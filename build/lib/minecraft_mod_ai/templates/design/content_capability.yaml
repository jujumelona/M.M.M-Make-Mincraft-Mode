id: design/content_capability
task: Select exactly one base Minecraft FactType required by this content entity.
record_schema:
  type: object
  properties:
    fact_type:
      type: string
      enum:
        - ITEM_EXISTS
        - BLOCK_EXISTS
        - CRAFTING_RECIPE
        - SMELTING_RECIPE
        - REGISTRY_TAG
        - ENTITY_EXISTS
        - GUI_EXISTS
        - NETWORK_PACKET
        - BLOCK_ENTITY_EXISTS
        - DATA_COMPONENT
        - WORLDGEN_FEATURE
        - DIMENSION
        - BIOME
        - STATUS_EFFECT
        - SOUND_EVENT
        - PARTICLE_TYPE
        - ENTITY_LOOT
        - ADVANCEMENT
        - EQUIPMENT_ARMOR
        - CUSTOM_ITEM_BEHAVIOR
        - CUSTOM_BLOCK_BEHAVIOR
        - UNSUPPORTED
  required:
    - fact_type
  additionalProperties: false
rules:
  - Use UNSUPPORTED when none of the enumerated FactTypes exactly represents the required capability.
  - Never substitute an easier artifact type for the requested content entity.
