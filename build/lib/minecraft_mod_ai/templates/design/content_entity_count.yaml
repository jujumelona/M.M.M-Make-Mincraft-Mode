id: design/content_entity_count
task: Determine how many distinct content entities the current requirement explicitly requires.
record_schema:
  type: object
  properties:
    count:
      type: integer
      minimum: 1
  required:
    - count
  additionalProperties: false
rules:
  - Count only distinct content entities required by the current authored requirement and supplied grounded context.
  - Do not count implementation modules, files, assets, properties, relations, or speculative additions.
  - When the requirement explicitly gives a quantity, preserve that quantity exactly.
  - When one semantic entity is required without an explicit quantity, return 1.
  - Do not clamp authored cardinality to an arbitrary implementation ceiling.
  - This task determines cardinality only. The host owns entity generation, ordering, repetition, validation, and termination.
