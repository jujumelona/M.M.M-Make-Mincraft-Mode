id: feature/behavior_contract/success_postconditions
task: Resolve exactly one success postconditions record for the supplied feature and
  acceptance criterion.
cardinality_blocking: false
input_fields:
- requirement
- criterion
- evidence
- accepted_records
record_schema:
  type: object
  properties:
    condition:
      type: string
      minLength: 1
      maxLength: 256
    observation:
      type: string
      minLength: 1
      maxLength: 256
  required:
  - condition
  - observation
  additionalProperties: false
rules:
- Return only the host-requested ordinal record for this concern; do not plan neighboring concerns.
- Condition is one concise success-state predicate for this criterion, not a feature description or research summary.
- Observation is one concise player-visible or test-visible fact proving that condition; never paste candidate descriptions, source prose, or general mod summaries.
- Keep each string within the record schema's atomic string bound so the primary tool schema and recovery schema are identical.
- Preserve supplied evidence identifiers. Never invent external APIs, paths or facts.
- Do not emit continuation, completion, applicability, retry, or loop-control decisions; the host owns cardinality and iteration.
- If the supplied facts cannot support the requested ordinal record, fail rather than inventing a fallback record.
