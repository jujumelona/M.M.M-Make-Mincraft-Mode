id: feature/behavior
task: Describe one externally observable primary behavior for this feature.
rules: [Use only the supplied feature context, Separate independent behaviors into separate records, Do not describe Minecraft implementation]
record_schema:
  type: object
  properties: {feature_id: {type: string, minLength: 1, maxLength: 256}, behavior: {type: string, minLength: 1, maxLength: 256}}
  required: [feature_id, behavior]
  additionalProperties: false
