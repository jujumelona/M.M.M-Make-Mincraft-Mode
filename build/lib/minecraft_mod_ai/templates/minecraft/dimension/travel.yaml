id: minecraft/dimension/travel
task: Implement only the travel responsibility of the supplied dimension artifact.
execution_mode: model
side:
- common
inputs:
- name: dimension_identity
  type: identifier
  required: true
- name: dimension_travel_input
  type: specification
  required: true
outputs:
- name: dimension_travel_receipt
  type: receipt
- name: dimension_travel_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - DIMENSION
  symbols: []
  schemas: []
implementation_key: fabric/dimension/travel
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - dimension_properties
repair:
  scope:
  - minecraft/dimension/travel
  writable_anchors:
  - /* MMM:dimension_travel */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- travel
anchor_kinds:
- symbol
- test
rules:
- Implement travel responsibility for dimension strictly within declared DIMENSION
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required dimension prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- dimension travel matches host version contract
- dimension travel receipts emitted with verified context
