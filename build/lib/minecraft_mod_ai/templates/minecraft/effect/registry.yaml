id: minecraft/effect/registry
task: Implement only the registry responsibility of the supplied effect artifact.
execution_mode: model
side:
- common
inputs:
- name: effect_identity
  type: identifier
  required: true
- name: effect_registry_input
  type: specification
  required: true
outputs:
- name: effect_registry_receipt
  type: receipt
- name: effect_registry_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - STATUS_EFFECT
  symbols:
  - StatusEffect
  schemas: []
implementation_key: fabric/effect/registry
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - effect_properties
repair:
  scope:
  - minecraft/effect/registry
  writable_anchors:
  - /* MMM:effect_registry */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- registry
anchor_kinds:
- registry_id
- symbol
- test
rules:
- Implement registry responsibility for effect strictly within declared STATUS_EFFECT
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required effect prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- effect registry matches host version contract
- effect registry receipts emitted with verified context
