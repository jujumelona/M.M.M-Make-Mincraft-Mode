id: minecraft/screen/state
task: Implement only the state responsibility of the supplied screen artifact.
execution_mode: deterministic
side:
- client
inputs:
- name: screen_identity
  type: identifier
  required: true
- name: screen_state_input
  type: specification
  required: true
outputs:
- name: screen_state_receipt
  type: receipt
- name: screen_state_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - GUI_EXISTS
  symbols:
  - ScreenHandlerType
  schemas: []
implementation_key: fabric/screen/state
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - screen_properties
repair:
  scope:
  - minecraft/screen/state
  writable_anchors:
  - /* MMM:screen_state */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- state
anchor_kinds:
- symbol
- test
rules:
- Implement state responsibility for screen strictly within declared SCREEN_CLIENT
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required screen prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- screen state matches host version contract
- screen state receipts emitted with verified context
