id: minecraft/saved_data/save
task: Implement only the save responsibility of the supplied saved data artifact.
execution_mode: model
side:
- common
inputs:
- name: saved_data_identity
  type: identifier
  required: true
- name: saved_data_save_input
  type: specification
  required: true
outputs:
- name: saved_data_save_receipt
  type: receipt
- name: saved_data_save_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols:
  - register_item
  schemas: []
implementation_key: fabric/saved_data/save
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - saved_data_properties
repair:
  scope:
  - minecraft/saved_data/save
  writable_anchors:
  - /* MMM:saved_data_save */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- save
anchor_kinds:
- symbol
- test
rules:
- Implement save responsibility for saved_data strictly within declared PERSISTENT_STATE
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required saved_data prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- saved_data save matches host version contract
- saved_data save receipts emitted with verified context
