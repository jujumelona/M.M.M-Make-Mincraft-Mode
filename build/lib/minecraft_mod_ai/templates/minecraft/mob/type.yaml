id: minecraft/mob/type
task: Implement only the type responsibility of the supplied mob artifact.
execution_mode: model
side:
- common
inputs:
- name: mob_identity
  type: identifier
  required: true
- name: mob_type_input
  type: specification
  required: true
outputs:
- name: mob_type_receipt
  type: receipt
- name: mob_type_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - ENTITY_EXISTS
  symbols:
  - EntityType
  schemas: []
implementation_key: fabric/mob/type
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - mob_properties
repair:
  scope:
  - minecraft/mob/type
  writable_anchors:
  - /* MMM:mob_type */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- type
anchor_kinds:
- symbol
- test
rules:
- Implement type responsibility for mob strictly within declared REGISTER_MOB capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required mob prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- mob type matches host version contract
- mob type receipts emitted with verified context
