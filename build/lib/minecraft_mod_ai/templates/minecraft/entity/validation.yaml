id: minecraft/entity/validation
task: Implement only the validation responsibility of the supplied entity artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: entity_identity
  type: identifier
  required: true
- name: entity_validation_input
  type: specification
  required: true
outputs:
- name: entity_validation_receipt
  type: receipt
- name: entity_validation_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - ENTITY_EXISTS
  symbols:
  - EntityType
  schemas: []
implementation_key: fabric/entity/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - entity_properties
repair:
  scope:
  - minecraft/entity/validation
  writable_anchors:
  - /* MMM:entity_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- symbol
- test
rules:
- Implement validation responsibility for entity strictly within declared REGISTER_ENTITY
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required entity prerequisite receipt is missing; never invent defaults.
- Output must satisfy mod_integration_test validator before completion.
postconditions:
- entity validation matches host version contract
- entity validation receipts emitted with verified context
