id: minecraft/entity/constructor
task: Implement only the constructor responsibility of the supplied entity artifact.
execution_mode: model
side:
- common
inputs:
- name: entity_identity
  type: identifier
  required: true
- name: entity_constructor_input
  type: specification
  required: true
outputs:
- name: entity_constructor_receipt
  type: receipt
- name: entity_constructor_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - ENTITY_EXISTS
  symbols:
  - EntityType
  schemas: []
implementation_key: fabric/entity/constructor
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - entity_properties
repair:
  scope:
  - minecraft/entity/constructor
  writable_anchors:
  - /* MMM:entity_constructor */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- constructor
anchor_kinds:
- symbol
- test
rules:
- Implement constructor responsibility for entity strictly within declared REGISTER_ENTITY
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required entity prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- entity constructor matches host version contract
- entity constructor receipts emitted with verified context
