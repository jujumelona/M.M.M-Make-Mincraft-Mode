id: minecraft/entity/animation
task: Implement only the animation responsibility of the supplied entity artifact.
execution_mode: model
side:
- client
inputs:
- name: entity_identity
  type: identifier
  required: true
- name: entity_animation_input
  type: specification
  required: true
outputs:
- name: entity_animation_receipt
  type: receipt
- name: entity_animation_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - ENTITY_EXISTS
  symbols:
  - EntityType
  schemas: []
implementation_key: fabric/entity/animation
validators:
- java_parse
- client_side_only
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - entity_properties
repair:
  scope:
  - minecraft/entity/animation
  writable_anchors:
  - /* MMM:entity_animation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- animation
anchor_kinds:
- symbol
- test
rules:
- Implement animation responsibility for entity strictly within declared REGISTER_ENTITY
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required entity prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- entity animation matches host version contract
- entity animation receipts emitted with verified context
