id: minecraft/tag/entries
task: Implement only the entries responsibility of the supplied tag artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: tag_identity
  type: identifier
  required: true
- name: tag_entries_input
  type: specification
  required: true
outputs:
- name: tag_entries_receipt
  type: receipt
- name: tag_entries_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - TAGS
  symbols: []
  schemas:
  - fabric/tag/registry
implementation_key: fabric/tag/entries
validators:
- json_schema
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - tag_properties
repair:
  scope:
  - minecraft/tag/entries
  writable_anchors:
  - /* MMM:tag_entries */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- entries
anchor_kinds:
- resource
- test
rules:
- Implement entries responsibility for tag strictly within declared TAGS capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required tag prerequisite receipt is missing; never invent defaults.
- Output must satisfy json_schema validator before completion.
postconditions:
- tag entries matches host version contract
- tag entries receipts emitted with verified context
