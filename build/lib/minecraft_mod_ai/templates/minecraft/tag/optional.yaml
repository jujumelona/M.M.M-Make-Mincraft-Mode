id: minecraft/tag/optional
task: Implement only the optional responsibility of the supplied tag artifact.
execution_mode: model
side:
- common
inputs:
- name: tag_identity
  type: identifier
  required: true
- name: tag_optional_input
  type: specification
  required: true
outputs:
- name: tag_optional_receipt
  type: receipt
- name: tag_optional_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - TAGS
  symbols: []
  schemas:
  - fabric/tag/registry
implementation_key: fabric/tag/optional
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - tag_properties
repair:
  scope:
  - minecraft/tag/optional
  writable_anchors:
  - /* MMM:tag_optional */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- optional
anchor_kinds:
- resource
- test
rules:
- Implement optional responsibility for tag strictly within declared TAGS capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required tag prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- tag optional matches host version contract
- tag optional receipts emitted with verified context
