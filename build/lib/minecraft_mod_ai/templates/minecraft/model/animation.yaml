id: minecraft/model/animation
task: Implement only the animation responsibility of the supplied model artifact.
execution_mode: model
side:
- client
inputs:
- name: model_identity
  type: identifier
  required: true
- name: model_animation_input
  type: specification
  required: true
outputs:
- name: model_animation_receipt
  type: receipt
- name: model_animation_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols: []
  schemas:
  - minecraft/resource/item/model_generated
implementation_key: fabric/model/animation
validators:
- java_parse
- client_side_only
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - model_properties
repair:
  scope:
  - minecraft/model/animation
  writable_anchors:
  - /* MMM:model_animation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- animation
anchor_kinds:
- resource
- test
rules:
- Implement animation responsibility for model strictly within declared MODEL_DEFINITION
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required model prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- model animation matches host version contract
- model animation receipts emitted with verified context
