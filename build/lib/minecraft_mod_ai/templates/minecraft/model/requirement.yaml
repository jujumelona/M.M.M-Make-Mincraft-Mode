id: minecraft/model/requirement
task: Implement only the requirement responsibility of the supplied model artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: model_identity
  type: identifier
  required: true
- name: model_requirement_input
  type: specification
  required: true
outputs:
- name: model_requirement_receipt
  type: receipt
- name: model_requirement_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols: []
  schemas:
  - minecraft/resource/item/model_generated
implementation_key: fabric/model/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - model_properties
repair:
  scope:
  - minecraft/model/requirement
  writable_anchors:
  - /* MMM:model_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- resource
- test
rules:
- Implement requirement responsibility for model strictly within declared MODEL_DEFINITION
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required model prerequisite receipt is missing; never invent defaults.
- Output must satisfy semantic_contract validator before completion.
postconditions:
- model requirement matches host version contract
- model requirement receipts emitted with verified context
