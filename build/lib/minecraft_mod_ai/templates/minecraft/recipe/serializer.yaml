id: minecraft/recipe/serializer
task: Implement only the serializer responsibility of the supplied recipe artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: recipe_identity
  type: identifier
  required: true
- name: recipe_serializer_input
  type: specification
  required: true
outputs:
- name: recipe_serializer_receipt
  type: receipt
- name: recipe_serializer_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - RECIPE_CRAFTING
  - RECIPE_SMELTING
  symbols: []
  schemas:
  - fabric/recipe/shaped
  - fabric/recipe/shapeless
implementation_key: fabric/recipe/serializer
validators:
- json_schema
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - recipe_properties
repair:
  scope:
  - minecraft/recipe/serializer
  writable_anchors:
  - /* MMM:recipe_serializer */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- serializer
anchor_kinds:
- resource
- test
rules:
- Implement serializer responsibility for recipe strictly within declared RECIPE_CRAFTING
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required recipe prerequisite receipt is missing; never invent defaults.
- Output must satisfy json_schema validator before completion.
postconditions:
- recipe serializer matches host version contract
- recipe serializer receipts emitted with verified context
