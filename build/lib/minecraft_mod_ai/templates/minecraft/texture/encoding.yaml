id: minecraft/texture/encoding
task: Implement only the encoding responsibility of the supplied texture artifact.
execution_mode: model
side:
- client
inputs:
- name: texture_identity
  type: identifier
  required: true
- name: texture_encoding_input
  type: specification
  required: true
outputs:
- name: texture_encoding_receipt
  type: receipt
- name: texture_encoding_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols:
  - register_item
  schemas: []
implementation_key: fabric/texture/encoding
validators:
- java_parse
- client_side_only
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - texture_properties
repair:
  scope:
  - minecraft/texture/encoding
  writable_anchors:
  - /* MMM:texture_encoding */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- encoding
anchor_kinds:
- resource
- test
rules:
- Implement encoding responsibility for texture strictly within declared TEXTURE_ASSET
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required texture prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- texture encoding matches host version contract
- texture encoding receipts emitted with verified context
