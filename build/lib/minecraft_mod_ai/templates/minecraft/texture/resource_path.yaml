id: minecraft/texture/resource_path
task: Implement only the resource path responsibility of the supplied texture artifact.
execution_mode: model
side:
- client
inputs:
- name: texture_identity
  type: identifier
  required: true
- name: texture_resource_path_input
  type: specification
  required: true
outputs:
- name: texture_resource_path_receipt
  type: receipt
- name: texture_resource_path_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols:
  - register_item
  schemas: []
implementation_key: fabric/texture/resource_path
validators:
- java_parse
- client_side_only
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - texture_properties
repair:
  scope:
  - minecraft/texture/resource_path
  writable_anchors:
  - /* MMM:texture_resource_path */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- resource_path
anchor_kinds:
- resource
- test
rules:
- Implement resource_path responsibility for texture strictly within declared TEXTURE_ASSET
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required texture prerequisite receipt is missing; never invent defaults.
- Output must satisfy json_schema validator before completion.
postconditions:
- texture resource_path matches host version contract
- texture resource_path receipts emitted with verified context
