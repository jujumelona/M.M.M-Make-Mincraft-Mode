id: minecraft/particle/requirement
task: Implement only the requirement responsibility of the supplied particle artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: particle_identity
  type: identifier
  required: true
- name: particle_requirement_input
  type: specification
  required: true
outputs:
- name: particle_requirement_receipt
  type: receipt
- name: particle_requirement_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - PARTICLE_TYPE
  symbols:
  - ParticleType
  schemas: []
implementation_key: fabric/particle/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - particle_properties
repair:
  scope:
  - minecraft/particle/requirement
  writable_anchors:
  - /* MMM:particle_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- symbol
- test
rules:
- Implement requirement responsibility for particle strictly within declared PARTICLE_TYPE
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required particle prerequisite receipt is missing; never invent defaults.
- Output must satisfy semantic_contract validator before completion.
postconditions:
- particle requirement matches host version contract
- particle requirement receipts emitted with verified context
