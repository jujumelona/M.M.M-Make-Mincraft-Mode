id: minecraft/particle/validation
task: Implement only the validation responsibility of the supplied particle artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: particle_identity
  type: identifier
  required: true
- name: particle_validation_input
  type: specification
  required: true
outputs:
- name: particle_validation_receipt
  type: receipt
- name: particle_validation_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - PARTICLE_TYPE
  symbols:
  - ParticleType
  schemas: []
implementation_key: fabric/particle/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - particle_properties
repair:
  scope:
  - minecraft/particle/validation
  writable_anchors:
  - /* MMM:particle_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- symbol
- test
rules:
- Implement validation responsibility for particle strictly within declared PARTICLE_TYPE
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required particle prerequisite receipt is missing; never invent defaults.
- Output must satisfy mod_integration_test validator before completion.
postconditions:
- particle validation matches host version contract
- particle validation receipts emitted with verified context
