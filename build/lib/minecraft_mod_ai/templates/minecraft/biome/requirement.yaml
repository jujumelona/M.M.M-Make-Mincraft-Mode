id: minecraft/biome/requirement
task: Implement only the requirement responsibility of the supplied biome artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: biome_identity
  type: identifier
  required: true
- name: biome_requirement_input
  type: specification
  required: true
outputs:
- name: biome_requirement_receipt
  type: receipt
- name: biome_requirement_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - BIOME
  symbols: []
  schemas: []
implementation_key: fabric/biome/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - biome_properties
repair:
  scope:
  - minecraft/biome/requirement
  writable_anchors:
  - /* MMM:biome_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- symbol
- test
rules:
- Implement requirement responsibility for biome strictly within declared BIOME capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required biome prerequisite receipt is missing; never invent defaults.
- Output must satisfy semantic_contract validator before completion.
postconditions:
- biome requirement matches host version contract
- biome requirement receipts emitted with verified context
