id: minecraft/language/datagen
task: Implement only the datagen responsibility of the supplied language artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: language_identity
  type: identifier
  required: true
- name: language_datagen_input
  type: specification
  required: true
outputs:
- name: language_datagen_receipt
  type: receipt
- name: language_datagen_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols: []
  schemas:
  - fabric/item/lang_en
implementation_key: fabric/language/datagen
validators:
- json_schema
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - language_properties
repair:
  scope:
  - minecraft/language/datagen
  writable_anchors:
  - /* MMM:language_datagen */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- datagen
anchor_kinds:
- resource
- test
rules:
- Implement datagen responsibility for language strictly within declared LANGUAGE_ASSET
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required language prerequisite receipt is missing; never invent defaults.
- Output must satisfy json_schema validator before completion.
postconditions:
- language datagen matches host version contract
- language datagen receipts emitted with verified context
