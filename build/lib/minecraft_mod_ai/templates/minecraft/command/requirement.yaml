id: minecraft/command/requirement
task: Implement only the requirement responsibility of the supplied command artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: command_identity
  type: identifier
  required: true
- name: command_requirement_input
  type: specification
  required: true
outputs:
- name: command_requirement_receipt
  type: receipt
- name: command_requirement_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols:
  - register_item
  schemas: []
implementation_key: fabric/command/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - command_properties
repair:
  scope:
  - minecraft/command/requirement
  writable_anchors:
  - /* MMM:command_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- symbol
- test
rules:
- Implement requirement responsibility for command strictly within declared COMMAND_REGISTRATION
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required command prerequisite receipt is missing; never invent defaults.
- Output must satisfy semantic_contract validator before completion.
postconditions:
- command requirement matches host version contract
- command requirement receipts emitted with verified context
