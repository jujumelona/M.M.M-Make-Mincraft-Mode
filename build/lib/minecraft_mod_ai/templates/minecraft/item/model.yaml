id: minecraft/item/model
task: Implement only the model responsibility of the supplied item artifact.
execution_mode: model
side:
- client
inputs:
- name: item_identity
  type: identifier
  required: true
- name: item_model_input
  type: specification
  required: true
outputs:
- name: item_model_receipt
  type: receipt
- name: item_model_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  - ITEM_SETTINGS
  symbols:
  - register_item
  - resource_key_create
  - item_stacks_to
  schemas: []
implementation_key: fabric/item/model
validators:
- java_parse
- client_side_only
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - item_properties
repair:
  scope:
  - minecraft/item/model
  writable_anchors:
  - /* MMM:item_model */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- model
anchor_kinds:
- symbol
- test
rules:
- Implement model responsibility for item strictly within declared REGISTER_ITEM capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required item prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- item model matches host version contract
- item model receipts emitted with verified context
