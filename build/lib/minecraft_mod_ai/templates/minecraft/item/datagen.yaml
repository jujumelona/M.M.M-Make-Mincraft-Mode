id: minecraft/item/datagen
task: Implement only the datagen responsibility of the supplied item artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: item_identity
  type: identifier
  required: true
- name: item_datagen_input
  type: specification
  required: true
outputs:
- name: item_datagen_receipt
  type: receipt
- name: item_datagen_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  - ITEM_SETTINGS
  symbols:
  - register_item
  - resource_key_create
  - item_stacks_to
  schemas: []
implementation_key: fabric/item/datagen
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - item_properties
repair:
  scope:
  - minecraft/item/datagen
  writable_anchors:
  - /* MMM:item_datagen */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- datagen
anchor_kinds:
- symbol
- test
rules:
- Implement datagen responsibility for item strictly within declared REGISTER_ITEM
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required item prerequisite receipt is missing; never invent defaults.
- Output must satisfy json_schema validator before completion.
postconditions:
- item datagen matches host version contract
- item datagen receipts emitted with verified context
