id: minecraft/attribute/validation
task: Implement only the validation responsibility of the supplied attribute artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: attribute_identity
  type: identifier
  required: true
- name: attribute_validation_input
  type: specification
  required: true
outputs:
- name: attribute_validation_receipt
  type: receipt
- name: attribute_validation_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols:
  - register_item
  schemas: []
implementation_key: fabric/attribute/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - attribute_properties
repair:
  scope:
  - minecraft/attribute/validation
  writable_anchors:
  - /* MMM:attribute_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- symbol
- test
rules:
- Implement validation responsibility for attribute strictly within declared ENTITY_ATTRIBUTES
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required attribute prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy mod_integration_test validator before completion.
postconditions:
- attribute validation matches host version contract
- attribute validation receipts emitted with verified context
