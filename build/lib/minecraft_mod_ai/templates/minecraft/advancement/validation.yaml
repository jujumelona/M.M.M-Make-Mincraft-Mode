id: minecraft/advancement/validation
task: Implement only the validation responsibility of the supplied advancement artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: advancement_identity
  type: identifier
  required: true
- name: advancement_validation_input
  type: specification
  required: true
outputs:
- name: advancement_validation_receipt
  type: receipt
- name: advancement_validation_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - ADVANCEMENT
  symbols: []
  schemas: []
implementation_key: fabric/advancement/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - advancement_properties
repair:
  scope:
  - minecraft/advancement/validation
  writable_anchors:
  - /* MMM:advancement_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- resource
- test
rules:
- Implement validation responsibility for advancement strictly within declared ADVANCEMENT
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required advancement prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy mod_integration_test validator before completion.
postconditions:
- advancement validation matches host version contract
- advancement validation receipts emitted with verified context
