id: minecraft/menu/validity
task: Implement only the validity responsibility of the supplied menu artifact.
execution_mode: model
side:
- common
inputs:
- name: menu_identity
  type: identifier
  required: true
- name: menu_validity_input
  type: specification
  required: true
outputs:
- name: menu_validity_receipt
  type: receipt
- name: menu_validity_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - GUI_EXISTS
  symbols:
  - ScreenHandlerType
  schemas: []
implementation_key: fabric/menu/validity
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - menu_properties
repair:
  scope:
  - minecraft/menu/validity
  writable_anchors:
  - /* MMM:menu_validity */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validity
anchor_kinds:
- symbol
- test
rules:
- Implement validity responsibility for menu strictly within declared SCREEN_HANDLER
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required menu prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- menu validity matches host version contract
- menu validity receipts emitted with verified context
