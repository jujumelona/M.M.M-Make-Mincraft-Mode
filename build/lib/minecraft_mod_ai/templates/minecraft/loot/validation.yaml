id: minecraft/loot/validation
task: Implement only the validation responsibility of the supplied loot artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: loot_identity
  type: identifier
  required: true
- name: loot_validation_input
  type: specification
  required: true
outputs:
- name: loot_validation_receipt
  type: receipt
- name: loot_validation_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - LOOT_TABLE
  symbols: []
  schemas:
  - fabric/loot/block_drop
implementation_key: fabric/loot/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - loot_properties
repair:
  scope:
  - minecraft/loot/validation
  writable_anchors:
  - /* MMM:loot_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- resource
- test
rules:
- Implement validation responsibility for loot strictly within declared LOOT_TABLE
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required loot prerequisite receipt is missing; never invent defaults.
- Output must satisfy mod_integration_test validator before completion.
postconditions:
- loot validation matches host version contract
- loot validation receipts emitted with verified context
