id: minecraft/network_payload/validation
task: Implement only the validation responsibility of the supplied network payload
  artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: network_payload_identity
  type: identifier
  required: true
- name: network_payload_validation_input
  type: specification
  required: true
outputs:
- name: network_payload_validation_receipt
  type: receipt
- name: network_payload_validation_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - NETWORK_PACKET
  symbols:
  - register_item
  schemas: []
implementation_key: fabric/network_payload/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - network_payload_properties
repair:
  scope:
  - minecraft/network_payload/validation
  writable_anchors:
  - /* MMM:network_payload_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- symbol
- test
rules:
- Implement validation responsibility for network_payload strictly within declared
  NETWORKING capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required network_payload prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy mod_integration_test validator before completion.
postconditions:
- network_payload validation matches host version contract
- network_payload validation receipts emitted with verified context
