id: minecraft/animation/clip
task: Implement only the clip responsibility of the supplied animation artifact.
execution_mode: model
side:
- client
inputs:
- name: animation_identity
  type: identifier
  required: true
- name: animation_clip_input
  type: specification
  required: true
outputs:
- name: animation_clip_receipt
  type: receipt
- name: animation_clip_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - ENTITY_EXISTS
  symbols:
  - EntityType
  schemas: []
implementation_key: fabric/animation/clip
validators:
- java_parse
- client_side_only
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - animation_properties
repair:
  scope:
  - minecraft/animation/clip
  writable_anchors:
  - /* MMM:animation_clip */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- clip
anchor_kinds:
- resource
- test
rules:
- Implement clip responsibility for animation strictly within declared ANIMATION_DEFINITION
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required animation prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy json_schema validator before completion.
postconditions:
- animation clip matches host version contract
- animation clip receipts emitted with verified context
