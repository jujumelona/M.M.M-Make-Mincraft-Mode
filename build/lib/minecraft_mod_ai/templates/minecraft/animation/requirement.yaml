id: minecraft/animation/requirement
task: Implement only the requirement responsibility of the supplied animation artifact.
execution_mode: deterministic
side:
- client
inputs:
- name: animation_identity
  type: identifier
  required: true
- name: animation_requirement_input
  type: specification
  required: true
outputs:
- name: animation_requirement_receipt
  type: receipt
- name: animation_requirement_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - ENTITY_EXISTS
  symbols:
  - EntityType
  schemas: []
implementation_key: fabric/animation/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - animation_properties
repair:
  scope:
  - minecraft/animation/requirement
  writable_anchors:
  - /* MMM:animation_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- resource
- test
rules:
- Implement requirement responsibility for animation strictly within declared ANIMATION_DEFINITION
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required animation prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy semantic_contract validator before completion.
postconditions:
- animation requirement matches host version contract
- animation requirement receipts emitted with verified context
