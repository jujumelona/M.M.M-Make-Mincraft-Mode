[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mmm-make-mincraft-mode"
version = "0.8.0"
description = "Minecraft Fabric mod production system with immutable planning, request-resolved implementation methods, sharded generation, indexed repair, runtime playtests and distribution"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "M.M.M Make Mincraft Mode contributors" }]
dependencies = [
  "PyYAML>=6.0.2,<7",
  "anyio>=4.4,<5",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "mcp==2.0.0",
  "packaging>=24,<27",
]

[project.optional-dependencies]
local-model = [
  "accelerate>=1.0,<2",
  "fastapi>=0.100.0",
  "huggingface-hub>=0.28,<2",
  "Jinja2>=3.1,<4",
  "openai>=1,<3",
  "Pillow>=10.4,<13",
  "pydantic-settings>=2.0.1",
  "safetensors>=0.4,<1",
  "sse-starlette>=1.6.1",
  "starlette-context>=0.3.6,<0.4",
  "transformers>=4.52.0",
  "uvicorn>=0.22.0",
  "websockets>=12,<16",
]
# Legacy/custom TransformersTextAdapter profiles that explicitly request bnb_4bit
# can opt in without making every native-GGUF Colab install a CUDA BNB wheel.
transformers-bnb = [
  "bitsandbytes>=0.45,<1; sys_platform == 'linux'",
]
qwen-fastpath = [
  "flash-linear-attention[cuda,conv1d]>=0.5.1,<0.6; sys_platform == 'linux'",
]
rag = [
  "numpy>=1.26,<3",
  "sentence-transformers>=3.0,<6",
]
# Colab currently ships Gradio 6.x. Keep MMM on that compatible line instead of
# downgrading to Gradio 5.50, which pins gradio-client 1.14, pydantic<=2.12.3 and
# starlette<1 and conflicts with the current Colab/Hugging Face/Google stack.
ui = ["gradio>=6.24,<7"]
image = [
  "bitsandbytes>=0.45,<1; sys_platform == 'linux'",
  "diffusers>=0.39,<1",
  "peft>=0.17,<1",
  "sentencepiece>=0.2,<1",
  "transformers>=4.56.0",
]
# These named capability groups are requested by the Colab runtime setup but add no
# separate Python packages. They keep setup capability declarations explicit without
# inventing dependencies that are not part of the runtime contract.
speech = []
production-audio = []
dev = [
  "nbformat>=5.10,<6",
  "numpy>=1.26,<3",
  "Pillow>=10.4,<13",
  "pytest>=8,<10",
  "ruff>=0.16,<1",
  "vulture>=2.14,<3",
  "tomli>=2; python_version < '3.11'",
]

[project.scripts]
mmm = "minecraft_mod_ai.cli:main"
minecraft-mod-ai = "minecraft_mod_ai.cli:main"
mmm-mcp = "minecraft_mod_ai.mcp_server:main"
mmm-mod-generation-mcp = "minecraft_mod_ai.mod_generation_mcp_server:main"
jdtls = "minecraft_mod_ai.jdtls_bootstrap:main"

[project.urls]
Repository = "https://github.com/jujumelona/M.M.M-Make-Mincraft-Mode"
Colab = "https://colab.research.google.com/github/jujumelona/M.M.M-Make-Mincraft-Mode/blob/main/M.M.M_Make_Mincraft_Mode_Colab.ipynb"
Issues = "https://github.com/jujumelona/M.M.M-Make-Mincraft-Mode/issues"

[tool.setuptools]
packages = ["minecraft_mod_ai", "minecraft_mod_ai.config", "minecraft_mod_ai.integrations", "minecraft_mod_ai.model_adapters"]
py-modules = ["mcp_gateway", "download_resources"]

[tool.setuptools.package-data]
minecraft_mod_ai = ["config/*.yaml", "packaged_skills.json", "integrations/mineflayer/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.vulture]
# The staged-operation helper keeps this positional compatibility input while the
# canonical recovery refactor removes the legacy protocol around it.
ignore_names = ["original_root"]
