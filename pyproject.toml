[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mmm-make-mincraft-mode"
version = "0.1.0"
description = "M.M.M Make Mincraft Mode - Minecraft Fabric mod builder for local and Colab use"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "M.M.M Make Mincraft Mode contributors" }]
dependencies = []

[project.optional-dependencies]
ui = ["gradio>=6.0,<7"]
local-model = [
  "accelerate>=1.0,<2",
  "transformers>=4.57,<6",
]
dev = [
  "nbformat>=5.10,<6",
  "pytest>=8,<10",
]

[project.scripts]
mmm = "minecraft_mod_ai.cli:main"
minecraft-mod-ai = "minecraft_mod_ai.cli:main"

[project.urls]
Repository = "https://github.com/jujumelona/M.M.M-Make-Mincraft-Mode"
Colab = "https://colab.research.google.com/github/jujumelona/M.M.M-Make-Mincraft-Mode/blob/main/M.M.M_Make_Mincraft_Mode_Colab.ipynb"
Issues = "https://github.com/jujumelona/M.M.M-Make-Mincraft-Mode/issues"

[tool.setuptools.packages.find]
include = ["minecraft_mod_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
