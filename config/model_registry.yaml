schema_version: mmm/model-registry-v2

_shared_embedding: &embedding
  model_id: Qwen/Qwen3-Embedding-0.6B
  adapter: embedding
  device: cpu
  dimensions: 512
  max_context: 8192
  max_new_tokens: 1

_shared_reranker: &reranker
  model_id: Qwen/Qwen3-Reranker-0.6B
  adapter: reranker
  device: cpu
  max_context: 8192
  max_new_tokens: 1

_shared_image_gen: &image_gen
  model_id: black-forest-labs/FLUX.2-klein-9B
  adapter: image_diffusion
  quantization: bnb_4bit_nf4
  torch_dtype: float16
  exclusive_gpu: true
  cpu_offload: true
  min_free_vram_mb: 9000
  lora_model_id: artificialguybr/PIXELART-REDMOND-FLUXKLEIN9B
  lora_weight_name: '[FLUX.2.Klein]PixelArt_Redmond.safetensors'
  lora_adapter_name: mmm_pixelart_redmond
  lora_scale: 1.0
  lora_trigger: Pixel Art, PixArFK

_fast_test_text: &fast_test_text
  model_id: mock/fast-test-engine
  adapter: mock
  max_context: 32768
  max_input_tokens: 0
  max_new_tokens: 2048
  min_free_vram_mb: 0

_qwen36_35b: &qwen36_35b
  model_id: unsloth/Qwen3.6-35B-A3B-MTP-GGUF
  adapter: llama_cpp
  gguf_filename: Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
  mmproj_filename: mmproj-F16.gguf
  torch_dtype: float16
  max_context: 262144
  max_input_tokens: 0
  max_new_tokens: 8192
  min_free_vram_mb: 2000
  exclusive_gpu: true

_qwen38_27b_q4: &qwen38_27b_q4
  model_id: unsloth/Qwen3.8-27B-GGUF
  adapter: llama_cpp
  gguf_filename: Qwen3.8-27B-UD-Q4_K_XL.gguf
  mmproj_filename: mmproj-BF16.gguf
  native_mtp: true
  torch_dtype: float16
  max_context: 262144
  max_input_tokens: 0
  max_new_tokens: 8192
  min_free_vram_mb: 2000
  exclusive_gpu: true

_qwen38_27b_q3: &qwen38_27b_q3
  model_id: unsloth/Qwen3.8-27B-GGUF
  adapter: llama_cpp
  gguf_filename: Qwen3.8-27B-UD-Q3_K_XL.gguf
  mmproj_filename: mmproj-BF16.gguf
  native_mtp: true
  torch_dtype: float16
  max_context: 262144
  max_input_tokens: 0
  max_new_tokens: 8192
  min_free_vram_mb: 2000
  exclusive_gpu: true

_qwen35_9b: &qwen35_9b
  model_id: unsloth/Qwen3.5-9B-MTP-GGUF
  adapter: llama_cpp
  gguf_filename: Qwen3.5-9B-UD-Q4_K_XL.gguf
  mmproj_filename: mmproj-F16.gguf
  torch_dtype: float16
  max_context: 262144
  max_input_tokens: 0
  max_new_tokens: 8192
  min_free_vram_mb: 1000
  exclusive_gpu: true

profiles:
  fast_test:
    description: Fast deterministic pipeline test; no production text model.
    roles:
      planner: *fast_test_text
      researcher: *fast_test_text
      coder: *fast_test_text
      coder_safe: *fast_test_text
      visual_critic: *fast_test_text
      embedding: *embedding
      reranker: *reranker
      image_generator: *image_gen

  Qwen3.6-35B_23GB:
    description: unsloth/Qwen3.6-35B-A3B-MTP-GGUF UD-Q4_K_XL (22.9GB)
    roles:
      planner: *qwen36_35b
      researcher: *qwen36_35b
      coder: *qwen36_35b
      coder_safe: *qwen36_35b
      visual_critic: *qwen36_35b
      embedding: *embedding
      reranker: *reranker
      image_generator: *image_gen

  Qwen3.8-27B_18GB:
    description: unsloth/Qwen3.8-27B-GGUF UD-Q4_K_XL (17.9GB); native MTP.
    roles:
      planner: *qwen38_27b_q4
      researcher: *qwen38_27b_q4
      coder: *qwen38_27b_q4
      coder_safe: *qwen38_27b_q4
      visual_critic: *qwen38_27b_q4
      embedding: *embedding
      reranker: *reranker
      image_generator: *image_gen

  Qwen3.8-27B_14GB:
    description: unsloth/Qwen3.8-27B-GGUF UD-Q3_K_XL (13.4GB); native MTP.
    roles:
      planner: *qwen38_27b_q3
      researcher: *qwen38_27b_q3
      coder: *qwen38_27b_q3
      coder_safe: *qwen38_27b_q3
      visual_critic: *qwen38_27b_q3
      embedding: *embedding
      reranker: *reranker
      image_generator: *image_gen

  Qwen3.5-9B_6GB:
    description: unsloth/Qwen3.5-9B-MTP-GGUF UD-Q4_K_XL (6.14GB); T4 production target.
    roles:
      planner: *qwen35_9b
      researcher: *qwen35_9b
      coder: *qwen35_9b
      coder_safe: *qwen35_9b
      visual_critic: *qwen35_9b
      embedding: *embedding
      reranker: *reranker
      image_generator: *image_gen

  t4_local:
    description: Default T4 alias for Qwen3.5-9B_6GB.
    roles:
      planner: *qwen35_9b
      researcher: *qwen35_9b
      coder: *qwen35_9b
      coder_safe: *qwen35_9b
      visual_critic: *qwen35_9b
      embedding: *embedding
      reranker: *reranker
      image_generator: *image_gen

  t4_quality:
    description: T4 quality alias for Qwen3.5-9B_6GB.
    roles:
      planner: *qwen35_9b
      researcher: *qwen35_9b
      coder: *qwen35_9b
      coder_safe: *qwen35_9b
      visual_critic: *qwen35_9b
      embedding: *embedding
      reranker: *reranker
      image_generator: *image_gen

  remote_quality:
    description: Per-role OpenAI-compatible endpoints for large coding and vision models. Retrieval stays local.
    roles:
      planner:
        provider: openai_compatible
        adapter: openai_compatible
        model_env: MMM_PLANNER_MODEL
        base_url_env: MMM_PLANNER_BASE_URL
        api_key_env: MMM_PLANNER_API_KEY
        max_context: 65536
        max_new_tokens: 4000
      researcher:
        provider: openai_compatible
        adapter: openai_compatible
        model_env: MMM_RESEARCH_MODEL
        base_url_env: MMM_RESEARCH_BASE_URL
        api_key_env: MMM_RESEARCH_API_KEY
        max_context: 65536
        max_new_tokens: 3500
      coder:
        provider: openai_compatible
        adapter: openai_compatible
        model_env: MMM_CODER_MODEL
        base_url_env: MMM_CODER_BASE_URL
        api_key_env: MMM_CODER_API_KEY
        recommended_models:
          - Qwen/Qwen3-Coder-30B-A3B-Instruct
          - Qwen/Qwen3-Coder-Next
        max_context: 131072
        max_new_tokens: 8192
      coder_safe:
        provider: openai_compatible
        adapter: openai_compatible
        model_env: MMM_CODER_SAFE_MODEL
        base_url_env: MMM_CODER_SAFE_BASE_URL
        api_key_env: MMM_CODER_SAFE_API_KEY
        max_context: 65536
        max_new_tokens: 4096
      visual_critic:
        provider: openai_compatible
        adapter: openai_compatible
        model_env: MMM_VISION_MODEL
        base_url_env: MMM_VISION_BASE_URL
        api_key_env: MMM_VISION_API_KEY
        max_context: 65536
        max_new_tokens: 3000
      embedding: *embedding
      reranker: *reranker
      image_generator: *image_gen
