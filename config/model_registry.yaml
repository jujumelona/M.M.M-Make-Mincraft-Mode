schema_version: mmm/model-registry-v2

_shared_embedding: &embedding
  model_id: Qwen/Qwen3-Embedding-0.6B
  adapter: embedding
  device: cpu
  dimensions: 512
  max_context: 2048
  max_new_tokens: 1

_shared_reranker: &reranker
  model_id: Qwen/Qwen3-Reranker-0.6B
  adapter: reranker
  device: cpu
  max_context: 2048
  max_new_tokens: 1

_shared_image_gen: &image_gen
  model_id: black-forest-labs/FLUX.2-klein-9B
  adapter: image_diffusion
  quantization: bnb_4bit_nf4
  torch_dtype: float16
  exclusive_gpu: true
  cpu_offload: true
  min_free_vram_mb: 9000
  lora_model_id: artificialguybr/PIXELART-REDMOND-FLUXKLEIN9B
  lora_weight_name: '[FLUX.2.Klein]PixelArt_Redmond.safetensors'
  lora_adapter_name: mmm_pixelart_redmond
  lora_scale: 1.0
  lora_trigger: Pixel Art, PixArFK

_fast_test_text: &fast_test_text
  model_id: mock/fast-test-engine
  adapter: mock
  max_context: 32768
  max_input_tokens: 0
  max_new_tokens: 2048
  min_free_vram_mb: 0

_qwen38_27b_q4: &qwen38_27b_q4
  model_id: unsloth/Qwen3.8-27B-GGUF
  adapter: llama_cpp
  gguf_filename: Qwen3.8-27B-UD-Q4_K_XL.gguf
  mmproj_filename: mmproj-BF16.gguf
  runtime_contract: qwen
  qwen_family: qwen3.8
  qwen_tool_markup: qwen3_coder_xml
  qwen_action_thinking_control: enable_thinking_false
  qwen_preserve_thinking: true
  qwen_reasoning_effort: true
  qwen_assistant_prefill: true
  agent_thinking: true
  dynamic_output_budget: true
  thinking_reasoning_effort: xhigh
  native_mtp: true
  sampling_profiles:
    general_thinking: &qwen38_thinking
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repeat_penalty: 1.0
    precise_coding: *qwen38_thinking
    non_thinking: &qwen38_non_thinking
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      min_p: 0.0
      presence_penalty: 1.5
      repeat_penalty: 1.0
  torch_dtype: float16
  max_context: 262144
  max_input_tokens: 0
  max_new_tokens: 8192
  min_free_vram_mb: 2000
  exclusive_gpu: true

_qwen35_9b: &qwen35_9b
  model_id: unsloth/Qwen3.5-9B-MTP-GGUF
  adapter: llama_cpp
  gguf_filename: Qwen3.5-9B-UD-Q4_K_XL.gguf
  mmproj_filename: mmproj-F16.gguf
  runtime_contract: qwen
  qwen_family: qwen3.5
  qwen_tool_markup: qwen3_coder_xml
  qwen_action_thinking_control: enable_thinking_false
  qwen_preserve_thinking: false
  qwen_reasoning_effort: false
  qwen_assistant_prefill: true
  agent_thinking: true
  dynamic_output_budget: true
  request_policy: task_aware_sampling
  decode_hotpath: t4_mtp
  runtime_context_default: 32768
  mtp_widths: "1,2,3,4,5,6"
  sampling_profiles:
    general_thinking:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 1.5
      repeat_penalty: 1.0
    precise_coding:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repeat_penalty: 1.0
    non_thinking:
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      min_p: 0.0
      presence_penalty: 1.5
      repeat_penalty: 1.0
  torch_dtype: float16
  max_context: 262144
  max_input_tokens: 0
  max_new_tokens: 8192
  min_free_vram_mb: 1000
  exclusive_gpu: true

profiles:
  fast_test:
    description: Fast deterministic pipeline test; no production text model.
    roles:
      planner: *fast_test_text
      researcher: *fast_test_text
      coder: *fast_test_text
      coder_safe: *fast_test_text
      visual_critic: *fast_test_text
      embedding: *embedding
      reranker: *reranker
      image_generator: *image_gen

  Qwen3.8-27B_18GB:
    description: unsloth/Qwen3.8-27B-GGUF UD-Q4_K_XL (17.9GB); native MTP.
    roles:
      planner: *qwen38_27b_q4
      researcher: *qwen38_27b_q4
      coder: *qwen38_27b_q4
      coder_safe: *qwen38_27b_q4
      visual_critic: *qwen38_27b_q4
      embedding: *embedding
      reranker: *reranker
      image_generator: *image_gen

  Qwen3.5-9B_6GB:
    description: unsloth/Qwen3.5-9B-MTP-GGUF UD-Q4_K_XL (6.14GB); T4 production target.
    roles:
      planner: *qwen35_9b
      researcher: *qwen35_9b
      coder: *qwen35_9b
      coder_safe: *qwen35_9b
      visual_critic: *qwen35_9b
      embedding: *embedding
      reranker: *reranker
      image_generator: *image_gen

  t4_local:
    description: Default T4 alias for Qwen3.5-9B_6GB.
    roles:
      planner: *qwen35_9b
      researcher: *qwen35_9b
      coder: *qwen35_9b
      coder_safe: *qwen35_9b
      visual_critic: *qwen35_9b
      embedding: *embedding
      reranker: *reranker
      image_generator: *image_gen

  t4_quality:
    description: T4 quality alias for Qwen3.5-9B_6GB.
    roles:
      planner: *qwen35_9b
      researcher: *qwen35_9b
      coder: *qwen35_9b
      coder_safe: *qwen35_9b
      visual_critic: *qwen35_9b
      embedding: *embedding
      reranker: *reranker
      image_generator: *image_gen
