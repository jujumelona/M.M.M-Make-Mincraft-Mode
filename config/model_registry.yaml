schema_version: mmm/model-registry-v1
profiles:
  t4_local:
    description: Single NVIDIA T4 profile; only one GPU-heavy role may be resident.
    roles:
      planner:
        model_id: Qwen/Qwen3.5-4B
        adapter: transformers_multimodal
        quantization: bnb_4bit
        max_context: 8192
        max_new_tokens: 1800
        min_free_vram_mb: 6500
      researcher:
        model_id: Qwen/Qwen3-4B-Instruct-2507
        adapter: transformers_text
        quantization: bnb_4bit
        max_context: 16384
        max_new_tokens: 1800
        min_free_vram_mb: 5500
      coder:
        model_id: Qwen/Qwen3-4B-Instruct-2507
        adapter: transformers_text
        quantization: bnb_4bit
        max_context: 16384
        max_new_tokens: 2600
        min_free_vram_mb: 5500
      visual_critic:
        model_id: Qwen/Qwen3.5-4B
        adapter: transformers_multimodal
        quantization: bnb_4bit
        max_context: 8192
        max_new_tokens: 1200
        min_free_vram_mb: 6500
      world_planner:
        model_id: Qwen/Qwen3.5-4B
        adapter: transformers_multimodal
        quantization: bnb_4bit
        max_context: 8192
        max_new_tokens: 2200
        min_free_vram_mb: 6500
      image_generator:
        model_id: black-forest-labs/FLUX.2-klein-4B
        adapter: image_diffusion
        torch_dtype: float16
        exclusive_gpu: true
        cpu_offload: true
        min_free_vram_mb: 12500
      speech_recognition:
        model_id: openai/whisper-small
        adapter: speech
        torch_dtype: float16
        exclusive_gpu: true
        min_free_vram_mb: 3000
  remote_quality:
    description: OpenAI-compatible providers selected entirely through environment variables.
    roles:
      planner:
        provider: openai_compatible
        adapter: openai_compatible
        model_env: MMM_PLANNER_MODEL
        base_url_env: MMM_PLANNER_BASE_URL
        api_key_env: MMM_PLANNER_API_KEY
        max_context: 32768
        max_new_tokens: 3000
      researcher:
        provider: openai_compatible
        adapter: openai_compatible
        model_env: MMM_RESEARCH_MODEL
        base_url_env: MMM_RESEARCH_BASE_URL
        api_key_env: MMM_RESEARCH_API_KEY
        max_context: 32768
        max_new_tokens: 2600
      coder:
        provider: openai_compatible
        adapter: openai_compatible
        model_env: MMM_CODER_MODEL
        base_url_env: MMM_CODER_BASE_URL
        api_key_env: MMM_CODER_API_KEY
        max_context: 65536
        max_new_tokens: 5000
      visual_critic:
        provider: openai_compatible
        adapter: openai_compatible
        model_env: MMM_VISION_MODEL
        base_url_env: MMM_VISION_BASE_URL
        api_key_env: MMM_VISION_API_KEY
        max_context: 32768
        max_new_tokens: 2000
      world_planner:
        provider: openai_compatible
        adapter: openai_compatible
        model_env: MMM_WORLD_MODEL
        base_url_env: MMM_WORLD_BASE_URL
        api_key_env: MMM_WORLD_API_KEY
        max_context: 32768
        max_new_tokens: 3000
      image_generator:
        provider: openai_compatible
        adapter: openai_compatible
        model_env: MMM_IMAGE_MODEL
        base_url_env: MMM_IMAGE_BASE_URL
        api_key_env: MMM_IMAGE_API_KEY
      speech_recognition:
        provider: openai_compatible
        adapter: openai_compatible
        model_env: MMM_SPEECH_MODEL
        base_url_env: MMM_SPEECH_BASE_URL
        api_key_env: MMM_SPEECH_API_KEY
