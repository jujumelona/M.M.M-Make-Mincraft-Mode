  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Legacy aliases
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  t4_local:
    description: "Legacy alias → Qwen3.6-35B_23GB"
    roles:
      planner: *qwen36_35b
      researcher: *qwen36_35b
      coder: *qwen36_35b
      coder_safe: *qwen36_35b
      visual_critic: *qwen36_35b
      embedding: *shared_embedding
      reranker: *shared_reranker
      image_generator: *shared_image_gen
      speech_recognition: *shared_speech

  t4_quality:
    description: "Legacy alias → Qwen3.6-35B_23GB"
    roles:
      planner: *qwen36_35b
      researcher: *qwen36_35b
      coder: *qwen36_35b
      coder_safe: *qwen36_35b
      visual_critic: *qwen36_35b
      embedding: *shared_embedding
      reranker: *shared_reranker
      image_generator: *shared_image_gen
      speech_recognition: *shared_speech

  remote_quality:
    description: Per-role OpenAI-compatible endpoints for large coding and vision models. Retrieval stays local.
    roles:
      planner:
        provider: openai_compatible
        adapter: openai_compatible
        model_env: MMM_PLANNER_MODEL
        base_url_env: MMM_PLANNER_BASE_URL
        api_key_env: MMM_PLANNER_API_KEY
        max_context: 65536
        max_new_tokens: 4000
      researcher:
        provider: openai_compatible
        adapter: openai_compatible
        model_env: MMM_RESEARCH_MODEL
        base_url_env: MMM_RESEARCH_BASE_URL
        api_key_env: MMM_RESEARCH_API_KEY
        max_context: 65536
        max_new_tokens: 3500
      coder:
        provider: openai_compatible
        adapter: openai_compatible
        model_env: MMM_CODER_MODEL
        base_url_env: MMM_CODER_BASE_URL
        api_key_env: MMM_CODER_API_KEY
        recommended_models:
          - Qwen/Qwen3-Coder-30B-A3B-Instruct
          - Qwen/Qwen3-Coder-Next
        max_context: 131072
        max_new_tokens: 8192
      coder_safe:
        provider: openai_compatible
        adapter: openai_compatible
        model_env: MMM_CODER_SAFE_MODEL
        base_url_env: MMM_CODER_SAFE_BASE_URL
        api_key_env: MMM_CODER_SAFE_API_KEY
        max_context: 65536
        max_new_tokens: 4096
      visual_critic:
        provider: openai_compatible
        adapter: openai_compatible
        model_env: MMM_VISION_MODEL
        base_url_env: MMM_VISION_BASE_URL
        api_key_env: MMM_VISION_API_KEY
        max_context: 65536
        max_new_tokens: 3000
      embedding: *shared_embedding
      reranker: *shared_reranker
      image_generator:
        provider: openai_compatible
        adapter: openai_compatible
        model_env: MMM_IMAGE_MODEL
        base_url_env: MMM_IMAGE_BASE_URL
        api_key_env: MMM_IMAGE_API_KEY
      speech_recognition:
        provider: openai_compatible
        adapter: openai_compatible
        model_env: MMM_SPEECH_MODEL
        base_url_env: MMM_SPEECH_BASE_URL
        api_key_env: MMM_SPEECH_API_KEY
