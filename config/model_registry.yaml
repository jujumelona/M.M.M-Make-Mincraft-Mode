schema_version: mmm/model-registry-v2

# ─── YAML anchors for shared non-LLM roles ───
_shared_embedding: &shared_embedding
  model_id: Qwen/Qwen3-Embedding-0.6B
  adapter: embedding
  device: cpu
  dimensions: 512
  max_context: 8192
  max_new_tokens: 1

_shared_reranker: &shared_reranker
  model_id: Qwen/Qwen3-Reranker-0.6B
  adapter: reranker
  device: cpu
  max_context: 8192
  max_new_tokens: 1

_shared_image_gen: &shared_image_gen
  model_id: black-forest-labs/FLUX.2-klein-4B
  adapter: image_diffusion
  torch_dtype: float16
  exclusive_gpu: true
  cpu_offload: true
  min_free_vram_mb: 12500

_shared_speech: &shared_speech
  model_id: openai/whisper-small
  adapter: speech
  torch_dtype: float16
  exclusive_gpu: true
  min_free_vram_mb: 3000

profiles:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # Full 16k (16384) Context Length profiles for maximum planning depth
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  Qwen3.6-35B_23GB:
    description: "unsloth/Qwen3.6-35B-A3B-MTP-GGUF UD-Q4_K_XL (22.9GB) — 16k Context + Smart Offload"
    roles:
      planner: &qwen36_35b
        model_id: unsloth/Qwen3.6-35B-A3B-MTP-GGUF
        adapter: llama_cpp
        gguf_filename: Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
        torch_dtype: float16
        max_context: 16384
        max_input_tokens: 0
        max_new_tokens: 8192
        min_free_vram_mb: 2000
      researcher: *qwen36_35b
      coder: *qwen36_35b
      coder_safe: *qwen36_35b
      visual_critic: *qwen36_35b
      embedding: *shared_embedding
      reranker: *shared_reranker
      image_generator: *shared_image_gen
      speech_recognition: *shared_speech

  Qwen3.6-27B_18GB:
    description: "unsloth/Qwen3.6-27B-MTP-GGUF UD-Q4_K_XL (17.9GB) — 16k Context + Smart Offload"
    roles:
      planner: &qwen36_27b_q4
        model_id: unsloth/Qwen3.6-27B-MTP-GGUF
        adapter: llama_cpp
        gguf_filename: Qwen3.6-27B-UD-Q4_K_XL.gguf
        torch_dtype: float16
        max_context: 16384
        max_input_tokens: 0
        max_new_tokens: 8192
        min_free_vram_mb: 2000
      researcher: *qwen36_27b_q4
      coder: *qwen36_27b_q4
      coder_safe: *qwen36_27b_q4
      visual_critic: *qwen36_27b_q4
      embedding: *shared_embedding
      reranker: *shared_reranker
      image_generator: *shared_image_gen
      speech_recognition: *shared_speech

  Qwen3.6-27B_14GB:
    description: "unsloth/Qwen3.6-27B-MTP-GGUF Q3_K_M (13.8GB) — 16k Context"
    roles:
      planner: &qwen36_27b_q3
        model_id: unsloth/Qwen3.6-27B-MTP-GGUF
        adapter: llama_cpp
        gguf_filename: Qwen3.6-27B-Q3_K_M.gguf
        torch_dtype: float16
