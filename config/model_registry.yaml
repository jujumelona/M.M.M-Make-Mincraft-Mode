schema_version: mmm/model-registry-v2
profiles:
  t4_local:
    description: Single NVIDIA T4 profile with Qwen3.6-35B MoE GGUF GPU/CPU offloading.
    roles:
      planner:
        model_id: unsloth/Qwen3.6-35B-A3B-MTP-GGUF
        adapter: llama_cpp
        quantization: gguf_mxfp4
        torch_dtype: float16
        max_context: 16384
        max_input_tokens: 0
        max_new_tokens: 8192
        min_free_vram_mb: 2000
      researcher:
        model_id: unsloth/Qwen3.6-35B-A3B-MTP-GGUF
        adapter: llama_cpp
        quantization: gguf_mxfp4
