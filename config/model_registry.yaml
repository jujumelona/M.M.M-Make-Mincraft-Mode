    roles:
      planner: &gemma4_26b
        model_id: unsloth/gemma-4-26B-A4B-it-GGUF
        adapter: llama_cpp
        gguf_filename: gemma-4-26B-A4B-it-UD-IQ4_NL.gguf
        torch_dtype: float16
        max_context: 16384
        max_input_tokens: 0
        max_new_tokens: 8192
