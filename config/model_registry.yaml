        torch_dtype: float16
        max_context: 16384
        max_input_tokens: 0
        max_new_tokens: 8192
        min_free_vram_mb: 2000
      embedding:
        model_id: Qwen/Qwen3-Embedding-0.6B
        adapter: embedding
        device: cpu
        dimensions: 512
        max_context: 8192
        max_new_tokens: 1
      reranker:
        model_id: Qwen/Qwen3-Reranker-0.6B
