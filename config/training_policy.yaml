schema_version: mmm/training-policy-v1
target:
  mode: trace_exact
allowed_source_licenses:
  - Apache-2.0
  - MIT
  - BSD-2-Clause
  - BSD-3-Clause
  - CC0-1.0
  - Unlicense
forbidden_sources:
  - unlicensed repositories
  - redistributed decompiled net.minecraft source
  - Minecraft original textures, models or sounds
  - mixed loader or unknown-version source dumps
required_success_evidence:
  - source_license
  - source_commit
  - gradle_exit_code
  - request_fidelity_passed
  - diagnostics_error_count
  - gametest_passed
  - jar_validation_passed
reward:
  gradle_build: 2.0
  diagnostics_clean: 1.0
  registry_references_valid: 1.0
  gametest: 2.0
  jar_validation: 1.0
  request_fidelity: 1.0
  requested_feature_deleted: -2.0
  cross_loader_api: -3.0
  wrong_version_symbol: -3.0
  approval_scope_escape: -5.0
