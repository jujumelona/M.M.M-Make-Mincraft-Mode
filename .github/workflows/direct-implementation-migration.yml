name: Direct Implementation Migration
on:
  push:
    branches: [main]
    paths:
      - 'minecraft_mod_ai/**'
      - 'tests/**'
      - '.github/workflows/direct-implementation-migration.yml'
  workflow_dispatch:
jobs:
  no-external-mod-reuse:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Compile modified implementation files
        run: |
          python -m compileall -q minecraft_mod_ai
          python -m ruff check minecraft_mod_ai tests --select F821,E7,E9
      - name: Verify direct implementation and removal invariants
        run: |
          python -m pytest -q \
            tests/test_external_source_reuse_removed.py \
            tests/test_request_feature_implementation.py \
            tests/test_request_runtime_ownership.py \
            tests/test_feature_work_order.py \
            tests/test_production_compiler_repair.py \
            tests/test_template_mirror_integrity.py \
            tests/test_skill_policy.py \
            tests/test_mcp_skill_stage_integrity.py \
            tests/test_notebook_target_reference_contract.py \
            tests/test_pre_design_phase_contract.py \
            tests/test_predesign_io_deadline_contract.py \
            tests/test_catalog_first_grounded_rag.py \
            tests/test_catalog_first_grounded_rag_policy.py \
            tests/test_predesign_provider_pagination.py \
            tests/test_reference_source_research_concurrency.py \
            tests/test_reference_source_research_parallelism.py \
            tests/test_reference_source_research_strategy.py \
            tests/test_planning_handoff_contract.py
