name: Full code audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/full-code-audit.yml

permissions:
  contents: read

# Generation 5: audit current main after bootstrap consolidation.
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -e '.[dev]' ruff
      - name: Compile every Python source
        run: python -m compileall -q minecraft_mod_ai tests tools download_resources.py
      - name: Import production package bootstrap
        run: python -c "import minecraft_mod_ai; assert minecraft_mod_ai.runtime_bootstrap.runtime_initialized()"
      - name: Validate Mineflayer bridge syntax
        run: node --check integrations/mineflayer-1201/bridge.mjs
      - name: Validate canonical Colab notebook
        run: python tools/validate_colab_notebook.py
      - name: Verify packaged Skill catalog is reproducible
        run: |
          python tools/package_skills.py
          git diff --exit-code -- minecraft_mod_ai/packaged_skills.json
      - name: Check undefined names and invalid Python constructs
        run: python -m ruff check minecraft_mod_ai tools download_resources.py --select E9,F63,F7,F82
      - name: Enforce flat runtime composition
        run: python -m pytest -q tests/test_runtime_bootstrap_clean.py
      - name: Run complete test suite
        run: python -m pytest -q --tb=short --durations=30 --maxfail=25
