name: Full code audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/full-code-audit.yml

permissions:
  contents: write

# Current-main audit after removing stale repair scaffolding.
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install audit dependencies
        run: python -m pip install --prefer-binary -e '.[dev]' ruff
      - name: Compile and static validation
        run: |
          python -m compileall -q minecraft_mod_ai tests tools download_resources.py
          python -m ruff check minecraft_mod_ai tools download_resources.py --select E9,F63,F7,F82
          python -c "import minecraft_mod_ai; assert minecraft_mod_ai.runtime_bootstrap.runtime_initialized()"
          node --check integrations/mineflayer-1201/bridge.mjs
          python tools/validate_colab_notebook.py
          python tools/package_skills.py
          git diff --exit-code -- minecraft_mod_ai/packaged_skills.json
      - name: Runtime composition contract
        run: python -m pytest -q tests/test_runtime_bootstrap_clean.py --tb=short
      - name: Complete test suite
        run: python -m pytest -q --tb=short --durations=40
      - name: Remove audit scaffold after green suite
        run: |
          set -euo pipefail
          rm .github/workflows/full-code-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove completed full audit scaffold'
          git pull --rebase origin main
          git push origin HEAD:main
