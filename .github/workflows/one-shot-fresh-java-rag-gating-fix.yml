name: One-shot fresh Java RAG gating fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-fresh-java-rag-gating-fix.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-fresh-java-rag-gating-fix-main
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Repair fresh Java initial RAG gating
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/progress_aware_tool_loop.py')
          text = path.read_text(encoding='utf-8')
          old = '''    require_rag = bool(\n        role in {"coder", "coder_safe"}\n        and all_names & _RAG_EVIDENCE_TOOLS\n        and (\n            (router._agent_require_fresh_evidence and not host_grounded)\n            or fresh_java_target\n        )\n    )\n'''
          new = '''    require_rag = bool(\n        role in {"coder", "coder_safe"}\n        and all_names & _RAG_EVIDENCE_TOOLS\n        and not host_grounded\n        and (router._agent_require_fresh_evidence or fresh_java_target)\n    )\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one initial RAG policy block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          cat > tests/test_progress_aware_fresh_java_rag_gating.py <<'PYTEST'
          from pathlib import Path


          def _policy_source() -> str:
              source = Path("minecraft_mod_ai/progress_aware_tool_loop.py").read_text(encoding="utf-8")
              start = source.index("    require_rag = bool(\n", source.index("def _generate_with_tools_impl"))
              end = source.index("\n\n    if require_rag:", start)
              return source[start:end]


          def test_host_grounded_fresh_java_does_not_force_initial_rag() -> None:
              policy = _policy_source()
              assert "and not host_grounded" in policy
              assert "and (router._agent_require_fresh_evidence or fresh_java_target)" in policy
              assert "or fresh_java_target\n" not in policy


          def test_fresh_java_still_requires_rag_when_host_is_not_grounded() -> None:
              policy = _policy_source()
              namespace = {
                  "role": "coder",
                  "all_names": {"search_code_rag", "apply_source_edit"},
                  "_RAG_EVIDENCE_TOOLS": frozenset({"search_code_rag"}),
                  "host_grounded": False,
                  "fresh_java_target": True,
                  "router": type("Router", (), {"_agent_require_fresh_evidence": False})(),
              }
              expression = policy.split("=", 1)[1].strip()
              assert eval(expression, {}, namespace) is True


          def test_grounded_fresh_java_can_enter_act_without_initial_rag() -> None:
              policy = _policy_source()
              namespace = {
                  "role": "coder",
                  "all_names": {"search_code_rag", "apply_source_edit"},
                  "_RAG_EVIDENCE_TOOLS": frozenset({"search_code_rag"}),
                  "host_grounded": True,
                  "fresh_java_target": True,
                  "router": type("Router", (), {"_agent_require_fresh_evidence": True})(),
              }
              expression = policy.split("=", 1)[1].strip()
              assert eval(expression, {}, namespace) is False
          PYTEST

      - name: Verify focused regression
        run: |
          python -m pip install --prefer-binary -e '.[dev]'
          python -m compileall -q minecraft_mod_ai/progress_aware_tool_loop.py
          python -m pytest -q tests/test_progress_aware_fresh_java_rag_gating.py tests/test_agent_required_rag_semantic_choice.py
      - name: Commit verified repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/progress_aware_tool_loop.py tests/test_progress_aware_fresh_java_rag_gating.py
          git diff --cached --check
          git commit -m 'Fix host-grounded fresh Java RAG gating'
          git push origin HEAD:main
