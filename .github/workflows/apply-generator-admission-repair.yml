name: Apply generator admission repair

on:
  push:
    branches: [main]
    paths:
      - tools/apply_generator_admission_repair.py
      - .github/workflows/apply-generator-admission-repair.yml

permissions:
  contents: write

concurrency:
  group: generator-admission-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply fail-closed generator repair
        run: python tools/apply_generator_admission_repair.py
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Verify platform and template contracts
        run: >-
          python -m pytest -q
          tests/test_platform_target_resolution.py
          tests/test_template_contracts.py
          tests/test_template_contract_integrity.py
          tests/test_template_mirror_integrity.py
          tests/test_template_authority_contract.py
          tests/test_template_fail_closed.py
          tests/test_template_version_prefill.py
          tests/test_task_template_runner_deterministic.py
          tests/test_atomic_slot_executor.py
          tests/test_resolved_version_context.py
          tests/test_packaged_version_catalog.py
      - name: Commit verified repair and remove one-time machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/apply_generator_admission_repair.py .github/workflows/apply-generator-admission-repair.yml
          git add minecraft_mod_ai/generator.py minecraft_mod_ai/platform_generation_contract.py
          git diff --cached --check
          git commit -m 'fix: enforce reviewed generator admission boundary'
          git pull --rebase origin main
          git push origin HEAD:main
