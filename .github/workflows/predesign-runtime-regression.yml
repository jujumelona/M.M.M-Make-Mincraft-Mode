name: Pre-design Runtime Regression

on:
  push:
    branches:
      - main
    paths:
      - 'minecraft_mod_ai/**'
      - 'tests/test_predesign_source_discovery_contract.py'
      - '.github/workflows/predesign-runtime-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  predesign-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install package and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Import package bootstrap
        run: |
          python -c "import minecraft_mod_ai; print('package import PASS')"
      - name: Run pre-design regression contract
        run: |
          python -m pytest -q tests/test_predesign_source_discovery_contract.py
      - name: Ban retired pre-design owner
        run: |
          test ! -e minecraft_mod_ai/agentic_pre_design_rag.py
          if grep -R --line-number --include='*.py' 'agentic_pre_design_rag' minecraft_mod_ai; then
            echo 'retired pre-design owner reference found' >&2
            exit 1
          fi
