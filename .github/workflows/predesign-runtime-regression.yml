name: Planning RAG Runtime Regression

on:
  push:
    branches:
      - main
    paths:
      - 'minecraft_mod_ai/**'
      - 'tests/test_planning_state_contract.py'
      - 'tests/test_planning_ssot_invariants.py'
      - 'tests/test_research_evidence_handoff_contract.py'
      - 'tests/test_public_acceptance_runtime_boundary.py'
      - '.github/workflows/predesign-runtime-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planning-rag-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install package and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Import package bootstrap
        run: |
          python -c "import minecraft_mod_ai; print('package import PASS')"
      - name: Run canonical planning and RAG regressions
        run: |
          python -m pytest -q \
            tests/test_planning_state_contract.py \
            tests/test_planning_ssot_invariants.py \
            tests/test_research_evidence_handoff_contract.py \
            tests/test_public_acceptance_runtime_boundary.py
      - name: Ban retired pre-design owner
        run: |
          python - <<'PY'
          from pathlib import Path

          token = "agentic_" + "pre_design_" + "rag"
          legacy = Path("minecraft_mod_ai") / f"{token}.py"
          if legacy.exists():
              raise SystemExit(f"retired owner still exists: {legacy}")
          offenders = []
          for path in Path("minecraft_mod_ai").rglob("*.py"):
              if token in path.read_text(encoding="utf-8"):
                  offenders.append(str(path))
          if offenders:
              raise SystemExit("retired owner references: " + ", ".join(offenders))
          print("retired owner ban PASS")
          PY
