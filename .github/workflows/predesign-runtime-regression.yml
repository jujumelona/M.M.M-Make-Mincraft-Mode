name: Pre-design Runtime Regression

on:
  push:
    branches:
      - main
    paths:
      - 'minecraft_mod_ai/**'
      - 'tests/test_predesign_source_discovery_contract.py'
      - 'tests/test_design_meta_output_contract.py'
      - 'tests/test_planner_log_replay_2026_09.py'
      - 'tests/test_planner_field_evidence_regressions.py'
      - 'tests/fixtures/planner_failure_2026_09_05.json'
      - '.github/workflows/predesign-runtime-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  predesign-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install package and test dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Import package bootstrap
        run: |
          python -c "import minecraft_mod_ai; print('package import PASS')"
      - name: Run pre-design and design-output regressions
        run: |
          python -m pytest -q \
            tests/test_predesign_source_discovery_contract.py \
            tests/test_design_meta_output_contract.py \
            tests/test_planner_log_replay_2026_09.py \
            tests/test_planner_field_evidence_regressions.py \
            tests/test_agentic_design_requirement_integrity.py \
            tests/test_agentic_game_design_text_contract.py \
            tests/test_research_execution_contract.py \
            tests/test_research_derived_requirements_small_model_contract.py \
            tests/test_semantic_source_fidelity.py \
            tests/test_plan_collect_all_linker.py \
            tests/test_public_acceptance_runtime_boundary.py
      - name: Ban retired pre-design owner
        run: |
          python - <<'PY'
          from pathlib import Path

          token = "agentic_" + "pre_design_" + "rag"
          legacy = Path("minecraft_mod_ai") / f"{token}.py"
          if legacy.exists():
              raise SystemExit(f"retired owner still exists: {legacy}")
          offenders = []
          for path in Path("minecraft_mod_ai").rglob("*.py"):
              if token in path.read_text(encoding="utf-8"):
                  offenders.append(str(path))
          if offenders:
              raise SystemExit("retired owner references: " + ", ".join(offenders))
          print("retired owner ban PASS")
          PY
