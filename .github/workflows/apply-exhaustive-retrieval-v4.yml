name: verify exhaustive grounded retrieval migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-exhaustive-retrieval-v4.yml'

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply canonical migration
        run: |
          python .github/scripts/patch_exhaustive_retrieval.py
          python .github/scripts/canonicalize_exhaustive_retrieval.py
          python .github/scripts/fix_exhaustive_retrieval_lint.py
      - name: Compile
        run: python -m compileall -q minecraft_mod_ai tests
      - name: Ruff
        run: python -m ruff check minecraft_mod_ai/github_adaptive_retrieval.py minecraft_mod_ai/research_grounded_rag_contract.py minecraft_mod_ai/pre_design_research_pipeline.py tests/test_exhaustive_retrieval_contract.py
      - name: Retrieval and pre-design contract tests
        run: |
          python -m pytest -q \
            tests/test_exhaustive_retrieval_contract.py \
            tests/test_pre_design_rag_root_cause.py \
            tests/test_grounded_rag_runtime_contract.py \
            tests/test_pre_design_research_pipeline.py
      - name: Reject arbitrary retrieval termination thresholds
        run: |
          python - <<'PY'
          from pathlib import Path

          gh = Path('minecraft_mod_ai/github_adaptive_retrieval.py').read_text()
          forbidden_gh = (
              '_search_request_budget',
              '_source_request_budget',
              '_source_byte_budget',
              '_output_byte_budget',
              '_coverage_target',
              'search_request_budget_exhausted',
              'source_request_budget_exhausted',
              'source_byte_budget_exhausted',
              'evidence_coverage_satisfied',
          )
          remaining = [token for token in forbidden_gh if token in gh]
          if remaining:
              raise SystemExit('legacy numeric retrieval stops remain: ' + ', '.join(remaining))

          rg = Path('minecraft_mod_ai/research_grounded_rag_contract.py').read_text()
          forbidden_rg = ('_MAX_EXTERNAL_PROJECTS', '_MAX_SOURCE_TEXT_CHARS')
          remaining = [token for token in forbidden_rg if token in rg]
          if remaining:
              raise SystemExit('legacy result/content truncation remains: ' + ', '.join(remaining))
          PY
      - name: Commit production sources and remove migration scaffolding
        run: |
          rm -f \
            .github/scripts/patch_exhaustive_retrieval.py \
            .github/scripts/canonicalize_exhaustive_retrieval.py \
            .github/scripts/fix_exhaustive_retrieval_lint.py \
            .github/workflows/apply-exhaustive-retrieval.yml \
            .github/workflows/apply-exhaustive-retrieval-v2.yml \
            .github/workflows/diagnose-exhaustive-retrieval.yml \
            .github/workflows/apply-exhaustive-retrieval-v4.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: exhaust grounded retrieval frontiers'
          git push origin HEAD:main
