name: Fix generation RAG binding once

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/fix_generation_rag_binding_once.py
      - .github/workflows/fix-generation-rag-binding-once.yml

permissions:
  contents: write

jobs:
  rewrite-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff

      - name: Apply host-bound RAG rewrite
        run: python .github/scripts/fix_generation_rag_binding_once.py

      - name: Compile changed Python
        run: |
          python -m py_compile \
            minecraft_mod_ai/mcp_server.py \
            minecraft_mod_ai/mcp_tools.py \
            minecraft_mod_ai/agent_tool_runtime.py \
            tests/test_generation_rag_target_binding.py

      - name: Ruff changed Python
        run: |
          python -m ruff check \
            minecraft_mod_ai/mcp_server.py \
            minecraft_mod_ai/mcp_tools.py \
            minecraft_mod_ai/agent_tool_runtime.py \
            tests/test_generation_rag_target_binding.py

      - name: Run generation RAG contracts
        run: |
          python -m pytest -q \
            tests/test_generation_rag_target_binding.py \
            tests/test_tool_call_admission_contract.py \
            tests/test_production_tool_call_isolation_contract.py

      - name: Verify model schema no longer owns target version
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('minecraft_mod_ai/mcp_server.py').read_text(encoding='utf-8'))
          fn = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == 'search_project_rag')
          args = [arg.arg for arg in fn.args.args]
          assert args == ['query', 'limit'], args
          PY

      - name: Commit verified RAG rewrite to main
        run: |
          rm .github/scripts/fix_generation_rag_binding_once.py
          rm .github/workflows/fix-generation-rag-binding-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Bind generation RAG to exact project target"
          git push origin HEAD:main
