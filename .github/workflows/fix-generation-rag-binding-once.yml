name: Fix generation RAG binding once

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/fix_generation_rag_binding_once.py
      - .github/workflows/fix-generation-rag-binding-once.yml

concurrency:
  group: fix-generation-rag-binding-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rewrite-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest ruff

      - name: Apply complete RAG and recovery rewrite
        run: python .github/scripts/fix_generation_rag_binding_once.py

      - name: Format changed Python
        run: |
          python -m ruff format \
            minecraft_mod_ai/mcp_server.py \
            minecraft_mod_ai/mcp_tools.py \
            minecraft_mod_ai/agent_tool_runtime.py \
            minecraft_mod_ai/model_adapters/llama_cpp_adapter.py \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            tests/test_generation_rag_target_binding.py

      - name: Compile changed Python
        run: |
          python -m py_compile \
            minecraft_mod_ai/mcp_server.py \
            minecraft_mod_ai/mcp_tools.py \
            minecraft_mod_ai/agent_tool_runtime.py \
            minecraft_mod_ai/model_adapters/llama_cpp_adapter.py \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            tests/test_generation_rag_target_binding.py

      - name: Ruff changed Python
        run: |
          python -m ruff check \
            minecraft_mod_ai/mcp_server.py \
            minecraft_mod_ai/mcp_tools.py \
            minecraft_mod_ai/agent_tool_runtime.py \
            minecraft_mod_ai/model_adapters/llama_cpp_adapter.py \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            tests/test_generation_rag_target_binding.py \
            --ignore BLE001,C901,PLR0911,PLR0912,PLR0915

      - name: Run RAG, admission, recovery contracts
        run: |
          python -m pytest -q \
            tests/test_generation_rag_target_binding.py \
            tests/test_tool_call_admission_contract.py \
            tests/test_production_tool_call_isolation_contract.py \
            tests/test_qwen_enum_recovery_contract.py \
            tests/test_qwen_required_alias_contract.py

      - name: Verify immediate-parent architecture regression
        run: |
          python .github/scripts/audit_code_quality_regression.py --base-ref "$GITHUB_SHA"

      - name: Commit verified complete rewrite to main
        run: |
          rm .github/scripts/fix_generation_rag_binding_once.py
          rm .github/workflows/fix-generation-rag-binding-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Bind recovery RAG to exact project target"
          git push origin HEAD:main
