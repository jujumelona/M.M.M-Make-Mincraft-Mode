name: Refactor progress loop state owner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refactor-progress-loop-state-owner.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Refactor verifier repair into HostRunState
        run: |
          python - <<'PY'
          from pathlib import Path

          core_path = Path('minecraft_mod_ai/progress_aware_tool_loop.py')
          text = core_path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
          '''    applied_mutations: list[str] = field(default_factory=list)\n    workspace_changed: bool = False\n    validation_status: str = "PENDING"\n    last_failure_digest: str | None = None\n''',
          '''    applied_mutations: list[str] = field(default_factory=list)\n    created_paths: set[str] = field(default_factory=set)\n    workspace_changed: bool = False\n    validation_status: str = "PENDING"\n    latest_verifier_tool: str | None = None\n    latest_verifier_errors: tuple[dict[str, Any], ...] = ()\n    latest_verifier_fingerprint: str | None = None\n    repair_guidance_fingerprint: str | None = None\n    last_failure_digest: str | None = None\n''',
          'HostRunState fields',
          )

          replace_once(
          '''    def record_mutation(self, tool_name: str, payload: Mapping[str, Any]) -> bool:\n        applied = mutation_payload_applied(tool_name, payload)\n        if applied:\n            with self._lock:\n                self.applied_mutations.append(tool_name)\n                self.workspace_changed = True\n            return True\n        return False\n\n''',
          '''    def record_mutation(\n        self,\n        tool_name: str,\n        arguments: Mapping[str, Any],\n        payload: Mapping[str, Any],\n    ) -> bool:\n        """Commit mutation truth to the same state machine that owns ACT/VERIFY.\n\n        A receipt-proven create immediately converts the target from a new-file\n        authority into an existing-file authority.  Verifier state is invalidated\n        only by a real byte change, so rejected/no-op edits cannot erase a FAIL.\n        """\n\n        if not mutation_payload_applied(tool_name, payload):\n            return False\n\n        operation = str(arguments.get("operation") or "").strip().casefold()\n        path = ""\n        for key in _SOURCE_EDIT_PATH_KEYS:\n            value = arguments.get(key)\n            if isinstance(value, str) and value.strip():\n                path = _canonical_mutation_path(value)\n                break\n\n        with self._lock:\n            self.applied_mutations.append(tool_name)\n            self.workspace_changed = True\n            if path and operation in _SOURCE_CREATE_OPERATIONS:\n                self.created_paths.add(path)\n\n            context = self.mutation_context\n            if context is not None and path == _canonical_mutation_path(context.target_path):\n                source_body = context.source_body\n                if operation in _SOURCE_CREATE_OPERATIONS:\n                    content = arguments.get("content")\n                    if isinstance(content, str):\n                        source_body = content\n                elif operation == "replace_exact" and isinstance(source_body, str):\n                    old = arguments.get("old")\n                    new = arguments.get("new")\n                    if isinstance(old, str) and isinstance(new, str) and old and source_body.count(old) == 1:\n                        source_body = source_body.replace(old, new, 1)\n                self.mutation_context = replace(\n                    context,\n                    source_body=source_body,\n                    is_new_file=False,\n                    evidence_source="mutation_receipt",\n                )\n\n            # Any real source delta makes the previous verifier observation stale.\n            self.validation_status = "PENDING"\n            self.latest_verifier_tool = None\n            self.latest_verifier_errors = ()\n            self.latest_verifier_fingerprint = None\n            self.repair_guidance_fingerprint = None\n        return True\n\n    def record_verification(\n        self,\n        tool_name: str,\n        payload: Mapping[str, Any],\n        status: str,\n    ) -> bool:\n        """Record trustworthy verifier evidence without rescanning message history."""\n\n        from .validation_diagnostic_contract import diagnostic_errors\n\n        result = payload.get("result")\n        receipt = result if isinstance(result, Mapping) else payload\n        errors: list[dict[str, Any]] = []\n        if status == "FAIL":\n            for item in diagnostic_errors(receipt):\n                compact = {\n                    key: item.get(key)\n                    for key in ("uri", "path", "file", "severity", "code", "source", "message", "range", "line")\n                    if item.get(key) not in (None, "", [], {})\n                }\n                if compact:\n                    errors.append(compact)\n        fingerprint = evidence_fingerprint(\n            {"tool": tool_name, "status": status, "errors": errors}\n        )\n        with self._lock:\n            changed = (\n                status != self.validation_status\n                or fingerprint != self.latest_verifier_fingerprint\n            )\n            self.validation_status = status\n            self.latest_verifier_tool = tool_name\n            self.latest_verifier_errors = tuple(errors)\n            self.latest_verifier_fingerprint = fingerprint\n            if status != "FAIL":\n                self.repair_guidance_fingerprint = None\n            return changed\n\n    def take_verifier_repair_guidance(self) -> str | None:\n        """Issue repair context once per verifier/source state, from host-owned state."""\n\n        with self._lock:\n            if (\n                self.validation_status != "FAIL"\n                or not self.latest_verifier_fingerprint\n                or self.latest_verifier_fingerprint == self.repair_guidance_fingerprint\n            ):\n                return None\n            self.repair_guidance_fingerprint = self.latest_verifier_fingerprint\n            context = self.mutation_context\n            evidence = {\n                "verifier": self.latest_verifier_tool,\n                "diagnostics": list(self.latest_verifier_errors),\n                "target_path": context.target_path if context is not None else None,\n                "target_is_new_file": context.is_new_file if context is not None else None,\n                "paths_created_in_this_run": sorted(self.created_paths),\n            }\n        return (\n            "MMM_CORE_VERIFIER_REPAIR_V1\\n"\n            "The host verifier still reports source defects. Repair the existing target; "\n            "do not restart generation and do not recreate a path that already has an APPLIED "\n            "mutation receipt. Make a material source-byte change that addresses the diagnostics, "\n            "then allow VERIFY to run again.\\n"\n            + json.dumps(evidence, ensure_ascii=False, sort_keys=True, default=str)\n        )\n\n''',
          'record_mutation state ownership',
          )

          replace_once(
          '''            if implementation_requires_mutation and not state.workspace_changed and not mutation_history_applied(messages):\n                raise ModelConfigurationError(\n                    "Writable coder reached the host tool-round limit before a "\n                    "reviewed source mutation was applied; refusing a prose-only implementation."\n                )\n            return _finalize_without_tools(\n''',
          '''            if implementation_requires_mutation and not state.workspace_changed and not mutation_history_applied(messages):\n                raise ModelConfigurationError(\n                    "Writable coder reached the host tool-round limit before a "\n                    "reviewed source mutation was applied; refusing a prose-only implementation."\n                )\n            if implementation_requires_mutation and state.validation_status == "FAIL":\n                raise ModelConfigurationError(\n                    "VERIFICATION_REPAIR_FIXED_POINT: tool-round boundary reached while "\n                    "trustworthy verifier evidence still reports source defects."\n                )\n            return _finalize_without_tools(\n''',
          'round-limit verifier fail close',
          )

          replace_once(
          '''            if implementation_requires_mutation and not state.workspace_changed and not mutation_history_applied(messages):\n                raise ModelConfigurationError(\n                    "Writable coder reached a no-progress boundary before a reviewed source "\n                    f"mutation was applied; refusing a prose-only implementation.{reason_suffix}\\n"\n                    f"Execution trajectory:\\n{traj_summary}"\n                )\n            return _finalize_without_tools(\n''',
          '''            if implementation_requires_mutation and not state.workspace_changed and not mutation_history_applied(messages):\n                raise ModelConfigurationError(\n                    "Writable coder reached a no-progress boundary before a reviewed source "\n                    f"mutation was applied; refusing a prose-only implementation.{reason_suffix}\\n"\n                    f"Execution trajectory:\\n{traj_summary}"\n                )\n            if implementation_requires_mutation and state.validation_status == "FAIL":\n                raise ModelConfigurationError(\n                    "VERIFICATION_REPAIR_FIXED_POINT: the same source state/action/result converged "\n                    "while trustworthy verifier diagnostics remain unresolved."\n                    f"{reason_suffix}\\nExecution trajectory:\\n{traj_summary}"\n                )\n            return _finalize_without_tools(\n''',
          'no-progress verifier fail close',
          )

          replace_once(
          '''        turn_request = replace(\n            request,\n            tools=phase_tools,\n            tool_choice=tool_choice,\n            parallel_tool_calls=parallel_tool_calls,\n        )\n''',
          '''        if implementation_requires_mutation and state.phase == LoopPhase.ACT:\n            repair_guidance = state.take_verifier_repair_guidance()\n            if repair_guidance is not None:\n                messages.append({"role": "system", "content": repair_guidance})\n\n        turn_request = replace(\n            request,\n            tools=phase_tools,\n            tool_choice=tool_choice,\n            parallel_tool_calls=parallel_tool_calls,\n        )\n''',
          'core repair guidance injection',
          )

          replace_once(
          '''            if implementation_requires_mutation and not state.workspace_changed and not mutation_history_applied(messages):\n                if state.phase == LoopPhase.OBSERVE and is_mutation_ready(messages, state):\n''',
          '''            if implementation_requires_mutation and state.validation_status == "FAIL":\n                state.phase = LoopPhase.ACT\n                state.record_no_progress_result(\n                    {\n                        "phase": LoopPhase.ACT.value,\n                        "validation_status": "FAIL",\n                        "verifier_fingerprint": state.latest_verifier_fingerprint,\n                        "prose": content,\n                    }\n                )\n                if state.no_progress_streak >= 2:\n                    raise ModelConfigurationError(\n                        "VERIFICATION_REPAIR_FIXED_POINT: coder repeatedly returned prose while "\n                        "trustworthy verifier diagnostics remain unresolved."\n                    )\n                messages.extend([\n                    {"role": "assistant", "content": content},\n                    {\n                        "role": "system",\n                        "content": (\n                            "Verifier status is still FAIL. Prose cannot complete this implementation. "\n                            "Use the exposed mutation tool to materially repair the existing target, "\n                            "then allow host verification to run again."\n                        ),\n                    },\n                ])\n                continue\n            if implementation_requires_mutation and not state.workspace_changed and not mutation_history_applied(messages):\n                if state.phase == LoopPhase.OBSERVE and is_mutation_ready(messages, state):\n''',
          'prose cannot escape verifier fail',
          )

          replace_once(
          '''                mutation_applied = state.record_mutation(call.name, payload)\n''',
          '''                mutation_applied = state.record_mutation(call.name, call.arguments, payload)\n''',
          'mutation call owns arguments',
          )

          replace_once(
          '''                if status != state.validation_status:\n                    state.validation_status = status\n                    turn_made_progress = True\n                if status == "FAIL" and implementation_requires_mutation:\n''',
          '''                if state.record_verification(call.name, payload, status):\n                    turn_made_progress = True\n                if status == "FAIL" and implementation_requires_mutation:\n''',
          'verifier evidence ownership',
          )

          replace_once(
          '''                    "validation_status": state.validation_status,\n                    "workspace_changed": state.workspace_changed,\n                    "applied_mutations": tuple(state.applied_mutations),\n                    "tool_results": _fixed_point_tool_results(executed),\n''',
          '''                    "validation_status": state.validation_status,\n                    "verifier_fingerprint": state.latest_verifier_fingerprint,\n                    "workspace_changed": state.workspace_changed,\n                    "applied_mutations": tuple(state.applied_mutations),\n                    "tool_results": _fixed_point_tool_results(executed),\n''',
          'fixed-point includes verifier state',
          )

          core_path.write_text(text, encoding='utf-8')

          init_path = Path('minecraft_mod_ai/__init__.py')
          init_text = init_path.read_text(encoding='utf-8')
          old_import = '''from .verifier_fail_closed_completion_installation import (\n    install as install_verifier_fail_closed_completion,\n)\n'''
          old_install = '''# Final runtime composition is now known; make completion fail closed without altering\n# the mutation/verifier dispatch wrappers composed by runtime_finalization.\ninstall_verifier_fail_closed_completion(_progress_aware_tool_loop)\n'''
          if init_text.count(old_import) != 1 or init_text.count(old_install) != 1:
              raise SystemExit('bootstrap verifier wrapper ownership did not match expected source')
          init_text = init_text.replace(old_import, '', 1).replace(old_install, '', 1)
          init_path.write_text(init_text, encoding='utf-8')

          for obsolete in (
              Path('minecraft_mod_ai/verifier_fail_closed_completion_installation.py'),
              Path('tests/test_verifier_fail_closed_completion_installation.py'),
          ):
              if not obsolete.exists():
                  raise SystemExit(f'expected obsolete wrapper artifact missing: {obsolete}')
              obsolete.unlink()

          Path('tests/test_progress_aware_verifier_repair_state.py').write_text(r'''from __future__ import annotations

from minecraft_mod_ai.progress_aware_tool_loop import (
    HostRunState,
    TargetMutationContext,
    _mutation_target_error,
)


PATH = "src/main/java/dev/mmm/debugfixture/DebugToken.java"


def _applied_receipt(after: str = "sha256:created") -> dict:
    return {
        "ok": True,
        "result": {
            "schema_version": "mmm/source-patch-receipt-v1",
            "status": "APPLIED",
            "operations": [
                {
                    "path": PATH,
                    "before_sha256": None,
                    "after_sha256": after,
                }
            ],
        },
    }


def _failed_diagnostics(message: str = "RegistryWrapper cannot be resolved to a type") -> dict:
    return {
        "ok": True,
        "result": {
            "status": "FAIL",
            "diagnostics": {
                f"file:///{PATH}": [
                    {
                        "severity": 1,
                        "code": "UndefinedType",
                        "message": message,
                        "range": {
                            "start": {"line": 4, "character": 7},
                            "end": {"line": 4, "character": 22},
                        },
                    }
                ]
            },
        },
    }


def test_applied_create_converts_new_file_authority_to_existing_file():
    state = HostRunState(
        mutation_context=TargetMutationContext(
            target_path=PATH,
            target_symbol="DebugToken",
            is_new_file=True,
            evidence_source="task_capsule",
        )
    )
    args = {
        "operation": "create_file",
        "path": PATH,
        "content": "package dev.mmm.debugfixture; public class DebugToken {}",
    }

    assert state.record_mutation("apply_source_edit", args, _applied_receipt()) is True
    assert state.mutation_context is not None
    assert state.mutation_context.is_new_file is False
    assert state.mutation_context.source_body == args["content"]
    assert PATH in state.created_paths
    assert state.validation_status == "PENDING"

    error = _mutation_target_error("apply_source_edit", args, state.mutation_context)
    assert error is not None
    assert error.startswith("MUTATION_TARGET_CREATION_CONFLICT")


def test_verifier_diagnostics_are_owned_by_host_state_not_message_rescan():
    state = HostRunState(
        mutation_context=TargetMutationContext(
            target_path=PATH,
            target_symbol="DebugToken",
            source_body="public class DebugToken {}",
            is_new_file=False,
        ),
        created_paths={PATH},
    )
    payload = _failed_diagnostics()

    assert state.record_verification("java_diagnostics", payload, "FAIL") is True
    assert state.validation_status == "FAIL"
    assert state.latest_verifier_tool == "java_diagnostics"
    assert state.latest_verifier_fingerprint
    assert state.latest_verifier_errors

    guidance = state.take_verifier_repair_guidance()
    assert guidance is not None
    assert guidance.startswith("MMM_CORE_VERIFIER_REPAIR_V1")
    assert "RegistryWrapper cannot be resolved to a type" in guidance
    assert PATH in guidance
    assert "do not restart generation" in guidance
    assert state.take_verifier_repair_guidance() is None


def test_real_mutation_invalidates_old_verifier_and_same_diagnostic_can_be_reissued():
    state = HostRunState(
        mutation_context=TargetMutationContext(
            target_path=PATH,
            target_symbol="DebugToken",
            source_body="class DebugToken { RegistryWrapper x; }",
            is_new_file=False,
        )
    )
    failure = _failed_diagnostics()
    state.record_verification("java_diagnostics", failure, "FAIL")
    first = state.take_verifier_repair_guidance()
    assert first is not None

    args = {
        "operation": "replace_exact",
        "path": PATH,
        "old": "RegistryWrapper",
        "new": "RegistryEntry",
    }
    assert state.record_mutation("apply_source_edit", args, _applied_receipt("sha256:edited"))
    assert state.validation_status == "PENDING"
    assert state.latest_verifier_fingerprint is None
    assert state.mutation_context is not None
    assert "RegistryEntry" in (state.mutation_context.source_body or "")

    assert state.record_verification("java_diagnostics", failure, "FAIL") is True
    second = state.take_verifier_repair_guidance()
    assert second is not None


def test_repeated_semantically_identical_failure_is_the_fixed_point_signal():
    state = HostRunState(validation_status="FAIL")
    value = {
        "phase": "ACT",
        "validation_status": "FAIL",
        "verifier_fingerprint": "same-diagnostic",
        "model_tool_calls": [
            {"name": "apply_source_edit", "arguments": {"operation": "create_file", "path": PATH}}
        ],
        "tool_results": [
            {"name": "apply_source_edit", "ok": False, "failure_code": "MUTATION_TARGET_CREATION_CONFLICT"}
        ],
    }
    assert state.record_no_progress_result(value) == 1
    assert state.record_no_progress_result(value) == 2


def test_bootstrap_no_longer_installs_verifier_message_history_wrapper():
    init_text = __import__('pathlib').Path('minecraft_mod_ai/__init__.py').read_text(encoding='utf-8')
    assert 'verifier_fail_closed_completion_installation' not in init_text
    assert 'install_verifier_fail_closed_completion' not in init_text
    assert not __import__('pathlib').Path('minecraft_mod_ai/verifier_fail_closed_completion_installation.py').exists()
''', encoding='utf-8')
          PY
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Run verifier state-owner regression tests
        run: >-
          python -m pytest -q
          tests/test_progress_aware_verifier_repair_state.py
          tests/test_progress_aware_tool_loop.py
          tests/test_host_selected_mutation_action.py
          tests/test_coder_execution_contract.py
          tests/test_small_model_boundary_regressions.py
          tests/test_runtime_contract_composer.py
      - name: Commit core ownership refactor to main
        run: |
          rm .github/workflows/refactor-progress-loop-state-owner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: make progress loop own verifier repair state"
          git push origin HEAD:main
