name: Refactor progress loop state owner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refactor-progress-loop-state-owner.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply core state-owner migration
        run: |
          python -c "from pathlib import Path; p=Path('.github/scripts/refactor_progress_loop_state_owner.py'); s=p.read_text(); old='text, count = pattern.subn(new_methods, text, count=1)'; new='text, count = pattern.subn(lambda _match: new_methods, text, count=1)'; assert s.count(old) == 1; p.write_text(s.replace(old,new,1))"
          python -m py_compile .github/scripts/refactor_progress_loop_state_owner.py
          python .github/scripts/refactor_progress_loop_state_owner.py
      - name: Verify focused contracts
        run: |
          python -m py_compile minecraft_mod_ai/progress_aware_tool_loop.py minecraft_mod_ai/__init__.py tests/test_progress_aware_verifier_repair_state.py
          pytest -q tests/test_progress_aware_verifier_repair_state.py
          pytest -q tests/test_progress_aware_tool_loop.py
      - name: Commit structural migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/scripts/refactor_progress_loop_state_owner.py
          git rm .github/workflows/refactor-progress-loop-state-owner.yml
          git add -A
          git commit -m 'refactor: make verifier repair host-state owned'
          git pull --rebase origin main
          git push origin HEAD:main
