name: Apply agent autonomy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-agent-autonomy.yml

permissions:
  contents: write

concurrency:
  group: apply-agent-autonomy-main
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fix migration tail selector
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_agent_autonomy.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('marker = "        _save_failed_patch(\\n"')
          end = text.index('if "repair_budget_exhausted" in t or', start)
          end = text.index('\n', end)
          replacement = '''marker = "        _save_failed_patch(\\n"
          budget_reason = t.find('reason="repair_budget_exhausted"')
          decorator = t.find("    patch_one_invalid_batch._mmm_bounded_semantic_batch_repair", budget_reason)
          if budget_reason < 0 or decorator < 0:
              raise SystemExit("batch repair exhaustion tail not found")
          tail_start = t.rfind(marker, t.find("def _install_bounded_batch_repair"), budget_reason)
          if tail_start < 0:
              raise SystemExit("batch repair exhaustion block start not found")
          t = t[:tail_start] + t[decorator:]
          if "repair_budget_exhausted" in t or "range(1, max_attempts + 1)" in t:
              raise SystemExit("batch repair numeric ceiling still present")'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
      - name: Apply progress-driven autonomy
        run: python .github/scripts/apply_agent_autonomy.py
      - name: Verify autonomy contracts
        run: |
          python -m pip install --prefer-binary -e '.[dev]'
          python -m ruff check \
            minecraft_mod_ai/model_router.py \
            minecraft_mod_ai/planner_incremental_resume_contract.py \
            minecraft_mod_ai/complete_planner.py \
            tests/test_agent_tool_calling.py \
            tests/test_planner_incremental_repair_contract.py \
            --select F,E7,E9
          python -m pytest -q \
            tests/test_agent_tool_calling.py \
            tests/test_planner_incremental_repair_contract.py \
            tests/test_complete_planner_scaling.py
          git diff --check
      - name: Commit and self-delete
        run: |
          git rm .github/workflows/apply-agent-autonomy.yml
          git rm -f .github/scripts/apply_agent_autonomy.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make agent and planner completion progress-driven'
          git pull --rebase origin main
          git push origin HEAD:main
