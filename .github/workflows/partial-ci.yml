name: Partial CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: partial-ci-${{ github.ref }}
  # Preserve active checks; coalesce superseded pending commits so GitHub's
  # 100-run concurrency queue does not reject new commits before job creation.
  # The impact selector below covers the rolling recent commit history.
  cancel-in-progress: false

jobs:
  impact:
    name: Select impacted checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python_files: ${{ steps.select.outputs.python_files }}
      test_files: ${{ steps.select.outputs.test_files }}
      run_python: ${{ steps.select.outputs.run_python }}
      run_tests: ${{ steps.select.outputs.run_tests }}
      run_e2e: ${{ steps.select.outputs.run_e2e }}
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(python - <<'PY'
          import json
          import os
          print(json.dumps({
              "state": "pending",
              "context": "partial-ci/gate",
              "description": "Changed-file Partial CI running",
              "target_url": (
                  f'{os.environ["GITHUB_SERVER_URL"]}/'
                  f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/'
                  f'{os.environ["GITHUB_RUN_ID"]}'
              ),
          }))
          PY
          )"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: select
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(".")
          try:
              commits = subprocess.check_output(
                  ["git", "rev-list", "--max-count=101", "HEAD"], text=True
              ).splitlines()
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", "--diff-filter=ACMRT",
                   commits[-1], "HEAD"],
                  text=True,
              ).splitlines()
          except (subprocess.CalledProcessError, IndexError):
              changed = subprocess.check_output(
                  ["git", "ls-files"], text=True
              ).splitlines()

          changed = sorted({Path(path).as_posix() for path in changed if path.strip()})
          python_files = [
              path for path in changed
              if path.endswith(".py") and (root / path).is_file()
          ]

          selected_tests: set[str] = {
              path for path in changed
              if path.startswith("tests/test_") and path.endswith(".py") and (root / path).is_file()
          }

          targeted_source_tests = {
              "minecraft_mod_ai/complete_planner.py": (
                  "tests/test_typed_plan_authoring.py",
              ),
              "minecraft_mod_ai/authored_production.py": (
                  "tests/test_authored_direct_lowering.py",
                  "tests/test_typed_plan_production.py",
              ),
              "minecraft_mod_ai/typed_plan_ir.py": (
                  "tests/test_typed_plan_ir.py",
                  "tests/test_typed_plan_authoring.py",
                  "tests/test_typed_plan_production.py",
              ),
              "minecraft_mod_ai/typed_plan_production.py": (
                  "tests/test_typed_plan_production.py",
              ),
          }
          targeted_path_tests = {}
          for prefix, candidates in targeted_path_tests.items():
              if not any(path.startswith(prefix) for path in changed):
                  continue
              for candidate in candidates:
                  if (root / candidate).is_file():
                      selected_tests.add(candidate)

          targeted_sources: set[str] = set()
          for source_path, candidates in targeted_source_tests.items():
              if source_path not in changed:
                  continue
              targeted_sources.add(source_path)
              for candidate in candidates:
                  if (root / candidate).is_file():
                      selected_tests.add(candidate)

          source_modules: set[str] = set()
          source_stems: set[str] = set()
          narrow_complete_orchestrator_receipt_change = False
          for path in python_files:
              if path in targeted_sources:
                  continue
              p = Path(path)
              if p.as_posix() == "minecraft_mod_ai/complete_orchestrator.py":
                  diff_text = subprocess.check_output(
                      ["git", "diff", "--unified=0", "HEAD^", "HEAD", "--", path],
                      text=True,
                  )
                  receipt_markers = (
                      "_full_gradle_build_receipt_passed",
                      "Final project has no passing full Gradle build command receipt",
                      "_gametest_receipt_passed",
                  )
                  if any(marker in diff_text for marker in receipt_markers):
                      narrow_complete_orchestrator_receipt_change = True
                      for candidate in (
                          "tests/test_complete_final_validation_contract.py",
                      ):
                          if (root / candidate).is_file():
                              selected_tests.add(candidate)
                      continue
              if p.parts and p.parts[0] == "minecraft_mod_ai":
                  module = ".".join(p.with_suffix("").parts)
                  source_modules.add(module)
                  source_stems.add(p.stem)
              elif p.parts and p.parts[0] == "tools":
                  source_modules.add(".".join(p.with_suffix("").parts))
                  source_stems.add(p.stem)

          for test_path in root.glob("tests/test_*.py"):
              text = test_path.read_text(encoding="utf-8", errors="ignore")
              if any(module in text for module in source_modules):
                  selected_tests.add(test_path.as_posix())
                  continue
              if any(
                  f"import {stem}" in text or
                  f"from minecraft_mod_ai import {stem}" in text or
                  f"from tools import {stem}" in text
                  for stem in source_stems
              ):
                  selected_tests.add(test_path.as_posix())

          # A green unit-test selection must never certify the executable
          # Colab -> generation -> real Gradle/GameTest pipeline by itself.
          # Critical production and notebook changes require the full fixture.
          e2e_inputs = {
              "M.M.M_Make_Mincraft_Mode_Colab.ipynb",
              "tools/colab_runtime_setup.py",
              "tests/test_deterministic_debug_full_pipeline_e2e.py",
              "tests/test_gametest_eula_consent_forwarding.py",
              "tests/test_runner_parallel_validation_contract.py",
              "tests/test_production_ci_e2e_gate.py",
              ".github/workflows/partial-ci.yml",
              ".github/workflows/deterministic-debug-full-e2e.yml",
          }
          production_prefixes = (
              "minecraft_mod_ai/runner",
              "minecraft_mod_ai/resource_",
              "minecraft_mod_ai/model_",
              "minecraft_mod_ai/work_graph",
              "minecraft_mod_ai/typed_plan_",
              "minecraft_mod_ai/authored_production",
              "minecraft_mod_ai/complete_orchestrator",
              "minecraft_mod_ai/colab_",
              "minecraft_mod_ai/complete_preflight",
              "minecraft_mod_ai/platform_live_execution",
              "minecraft_mod_ai/fabric_official_template",
              "minecraft_mod_ai/resource_asset_production",
              "minecraft_mod_ai/resource_image_pipeline",
              "minecraft_mod_ai/resource_alpha_segmentation",
          )
          run_e2e = any(
              path in e2e_inputs or path.startswith(production_prefixes)
              for path in changed
          )
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write("python_files=" + json.dumps(python_files, separators=(",", ":")) + "\n")
              handle.write("test_files=" + json.dumps(sorted(selected_tests), separators=(",", ":")) + "\n")
              handle.write("run_python=" + ("true" if python_files else "false") + "\n")
              handle.write("run_tests=" + ("true" if selected_tests else "false") + "\n")
              handle.write("run_e2e=" + ("true" if run_e2e else "false") + "\n")

          print("changed:", *changed, sep="\n  ")
          print("python:", *python_files, sep="\n  ")
          print("tests:", *sorted(selected_tests), sep="\n  ")
          print("production-e2e-required:", run_e2e)
          PY

  python:
    name: Changed Python compile + ruff
    needs: impact
    if: ${{ needs.impact.outputs.run_python == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --prefer-binary ruff
      - shell: bash
        env:
          PYTHON_FILES_JSON: ${{ needs.impact.outputs.python_files }}
        run: |
          python - <<'PY' > /tmp/python-files.txt
          import json, os
          for path in json.loads(os.environ["PYTHON_FILES_JSON"]):
              print(path)
          PY
          mapfile -t PYTHON_FILES < /tmp/python-files.txt
          python -m py_compile "${PYTHON_FILES[@]}"
          python -m ruff check "${PYTHON_FILES[@]}" --select F,E7,E9

  tests:
    name: Impacted tests
    needs: impact
    if: ${{ needs.impact.outputs.run_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - shell: bash
        env:
          TEST_FILES_JSON: ${{ needs.impact.outputs.test_files }}
        run: |
          python - <<'PY' > /tmp/tests.txt
          import json, os
          for path in json.loads(os.environ["TEST_FILES_JSON"]):
              print(path)
          PY
          mapfile -t TEST_FILES < /tmp/tests.txt
          printf 'Impacted tests:\n'
          printf '  %s\n' "${TEST_FILES[@]}"
          python tools/pytest_diagnostics.py             --log audit/partial-tests.log             --junit audit/partial-tests.xml             --durations 25             --maxfail 20             "${TEST_FILES[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partial-tests-${{ github.sha }}
          path: |
            audit/partial-tests.log
            audit/partial-tests.xml
          if-no-files-found: warn

  production_e2e:
    name: Real production Gradle + GameTest E2E
    needs: impact
    if: ${{ needs.impact.outputs.run_e2e == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Reproduce Colab EULA and actual Gradle pipeline
        timeout-minutes: 20
        run: |
          python -m pytest -q tests/test_gametest_eula_consent_forwarding.py
          python -m pytest -q tests/test_deterministic_debug_full_pipeline_e2e.py
      - name: Upload production verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-e2e-${{ github.sha }}
          path: |
            audit/
          if-no-files-found: ignore

  gate:
    name: Partial CI Gate
    if: ${{ always() }}
    needs: [impact, python, tests, production_e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          IMPACT: ${{ needs.impact.result }}
          PYTHON: ${{ needs.python.result }}
          TESTS: ${{ needs.tests.result }}
          PRODUCTION_E2E: ${{ needs.production_e2e.result }}
          PRODUCTION_E2E_REQUIRED: ${{ needs.impact.outputs.run_e2e }}
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=success
          test "$IMPACT" = success || conclusion=failure
          test "$PYTHON" = success -o "$PYTHON" = skipped || conclusion=failure
          test "$TESTS" = success -o "$TESTS" = skipped || conclusion=failure
          # Never mark a required real Gradle/GameTest run as optional.
          if [ "$PRODUCTION_E2E_REQUIRED" = true ]; then
            test "$PRODUCTION_E2E" = success || conclusion=failure
          else
            test "$PRODUCTION_E2E" = skipped || conclusion=failure
          fi
          export PARTIAL_CI_CONCLUSION="$conclusion"
          payload="$(python - <<'PY'
          import json
          import os
          print(json.dumps({
              "state": os.environ["PARTIAL_CI_CONCLUSION"],
              "context": "partial-ci/gate",
              "description": "Changed-file Partial CI gate",
              "target_url": (
                  f'{os.environ["GITHUB_SERVER_URL"]}/'
                  f'{os.environ["GITHUB_REPOSITORY"]}/actions/runs/'
                  f'{os.environ["GITHUB_RUN_ID"]}'
              ),
          }))
          PY
          )"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "$payload"
          test "$conclusion" = success
