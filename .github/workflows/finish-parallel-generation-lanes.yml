name: Finish parallel generation lanes

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python tools/apply_parallel_generation_lanes.py
      - name: Install package
        run: python -m pip install -e . pytest ruff
      - name: Verify
        run: |
          python -m compileall -q minecraft_mod_ai tests/test_pipeline_parallel_bottlenecks.py
          python -m ruff check minecraft_mod_ai/work_graph.py minecraft_mod_ai/complete_orchestrator.py tests/test_pipeline_parallel_bottlenecks.py --select F,E7,E9
          python -m pytest -q tests/test_pipeline_parallel_bottlenecks.py tests/test_extended_content_lock_parallelism.py
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/finish-parallel-generation-lanes.yml tools/apply_parallel_generation_lanes.py
          git add minecraft_mod_ai/work_graph.py minecraft_mod_ai/complete_orchestrator.py tests/test_pipeline_parallel_bottlenecks.py
          git commit -m 'Parallelize entity review and restore singleton generation shards'
          git pull --rebase origin main
          git push origin HEAD:main
