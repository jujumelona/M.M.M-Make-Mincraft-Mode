name: One-time structural Python cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-structural-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Ruff
        run: python -m pip install 'ruff==0.16.2'
      - name: Remove residual no-op expressions
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "minecraft_mod_ai/custom_module_generator.py": [
                  ('            actual_start_byte + len(quoted)\n', ''),
              ],
              "minecraft_mod_ai/model_adapters/transformers_multimodal.py": [
                  ('            getattr(transformers, "AutoModelForCausalLM", None)\n', ''),
                  ('            getattr(transformers, "AutoModel", None)\n', ''),
                  ('            getattr(transformers, "AutoModelForMultimodalLM", None)\n', ''),
              ],
              "tests/test_large_request_ingestion.py": [
                  ('            int(source["page_index"])\n', ''),
              ],
              "minecraft_mod_ai/proposal_store.py": [
                  (
                      '    read_part = lambda relative: _read_file_part(index.parent, relative)\n',
                      '    def read_part(relative):\n        return _read_file_part(index.parent, relative)\n',
                  ),
              ],
          }
          for name, edits in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in edits:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"expected exactly one match in {name}: {old!r}; got {count}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Normalize dense control flow
        run: |
          python -m ruff format minecraft_mod_ai/geckolib_generator.py minecraft_mod_ai/proposal_store.py
          python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9 --fix
          python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9
      - name: Verify patch integrity
        run: git diff --check
      - name: Commit cleanup and remove maintenance workflow
        run: |
          git rm .github/workflows/one-time-structural-cleanup.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Normalize Python control flow and remove no-op code'
          git push origin HEAD:main
