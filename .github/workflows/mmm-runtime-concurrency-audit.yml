name: exhaustive runtime concurrency audit

on:
  push:
    branches: [main]
    paths:
      - 'minecraft_mod_ai/**/*.py'
      - 'tests/**/*.py'
      - '.github/scripts/**/*.py'
      - '.github/workflows/mmm-runtime-concurrency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmm-runtime-concurrency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Exhaustive Python runtime scan
        run: python .github/scripts/audit_runtime_concurrency.py
