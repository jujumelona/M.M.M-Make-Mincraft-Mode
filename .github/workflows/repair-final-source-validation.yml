name: Repair final source validation binding
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-final-source-validation.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - run: python .github/scripts/repair_final_source_validation_binding.py
      - run: python -m compileall -q minecraft_mod_ai
      - run: python -m pytest -q tests/test_final_source_validation_binding.py tests/test_semantic_receipt_ownership.py
      - run: git diff --check
      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/repair-final-source-validation.yml .github/scripts/repair_final_source_validation_binding.py
          git add minecraft_mod_ai/complete_orchestrator.py minecraft_mod_ai/work_graph.py tests/test_final_source_validation_binding.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bind final source validation after repair'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
