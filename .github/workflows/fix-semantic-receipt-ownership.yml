name: Fix semantic receipt ownership
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-semantic-receipt-ownership.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - run: python .github/scripts/fix_semantic_receipt_ownership.py
      - run: python -m compileall -q minecraft_mod_ai
      - run: python -m pytest -q tests/test_semantic_receipt_ownership.py
      - run: git diff --check
      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-semantic-receipt-ownership.yml .github/scripts/fix_semantic_receipt_ownership.py
          git add minecraft_mod_ai/complete_orchestrator.py minecraft_mod_ai/extended_content_generator.py minecraft_mod_ai/system_pack_generator.py tests/test_semantic_receipt_ownership.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bind semantic evidence by receipt ownership'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
