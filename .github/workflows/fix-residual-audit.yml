name: Fix residual audit failures

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-residual-audit.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply minimal residual fixes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              found = s.count(old)
              if found < count:
                  raise SystemExit(f'{path}: expected at least {count} matches, found {found}: {old[:100]!r}')
              p.write_text(s.replace(old, new, count), encoding='utf-8')

          # Remove the notebook-only entry point for the deleted forced-MTP shim.
          nb_path = Path('M.M.M_Make_Mincraft_Mode_Colab.ipynb')
          nb = json.loads(nb_path.read_text(encoding='utf-8'))
          before = len(nb['cells'])
          nb['cells'] = [
              cell for cell in nb['cells']
              if 'colab_mtp_server' not in ''.join(cell.get('source', []))
          ]
          if len(nb['cells']) != before - 1:
              raise SystemExit(f'expected exactly one legacy MTP notebook cell, removed {before-len(nb["cells"])}')
          nb_path.write_text(json.dumps(nb, ensure_ascii=False, indent=1) + '\n', encoding='utf-8')

          # Source-build fallback remains emergency opt-in; the explicit fallback test opts in.
          replace(
              'tests/test_colab_native_llama_prebuilt_integration.py',
              '    monkeypatch.delenv("MMM_LLAMA_SERVER_DISTRIBUTION", raising=False)\n    monkeypatch.setattr(module, "_find_verified_native_server", lambda: None)\n',
              '    monkeypatch.delenv("MMM_LLAMA_SERVER_DISTRIBUTION", raising=False)\n    monkeypatch.setenv("MMM_LLAMA_ALLOW_SOURCE_BUILD", "1")\n    monkeypatch.setattr(module, "_find_verified_native_server", lambda: None)\n',
          )

          # MCP schema/stage contracts moved forward intentionally.
          replace('tests/test_mcp_complete_plan_refs.py', 'mmm/complete-plan-result-v3', 'mmm/complete-plan-result-v4')
          replace(
              'tests/test_mcp_config.py',
              '    assert "MMM_MCP_STAGE" not in generation["env"]\n',
              '    assert generation["env"]["MMM_MCP_STAGE"] == "generation"\n',
          )

          # Image residency supersedes the older permanent cached-pipeline marker.
          replace(
              'tests/test_model_runtime_performance_contract.py',
              '    assert getattr(\n        ImageDiffusionAdapter.generate_image,\n        "_mmm_cached_image_pipeline",\n        False,\n    )\n',
              '',
          )

          # Colab install targets are constants, not a formatting contract; receipt now binds native binary identity.
          replace(
              'tests/test_notebook_registry_policy.py',
              '    assert \'REMOTE_PROJECT_INSTALL_TARGET = (\\n    ".[ui,rag,\' in setup_source\n',
              '    assert \'REMOTE_PROJECT_INSTALL_TARGET = ".[ui,rag,\' in setup_source\n',
          )
          replace(
              'tests/test_notebook_registry_policy.py',
              '    assert \'LOCAL_PROJECT_INSTALL_TARGET = (\\n    ".[ui,local-model,rag,\' in setup_source\n',
              '    assert \'LOCAL_PROJECT_INSTALL_TARGET = ".[ui,local-model,rag,\' in setup_source\n',
          )
          replace(
              'tests/test_notebook_registry_policy.py',
              '        setup_fingerprint=first,\n        torch=None,\n    )\n',
              '        setup_fingerprint=first,\n        torch=None,\n        llama_server_binary="",\n    )\n',
          )

          # Current strict parser deliberately ignores unrelated scratch JSON when exactly one contract object exists.
          p = Path('tests/test_planner_strict_json_contract.py')
          s = p.read_text(encoding='utf-8')
          old = '''def test_outline_sequence_rejects_unrelated_json_object() -> None:\n    expected = (frozenset({"production_batches", "complete", "next_cursor"}),)\n    with pytest.raises(SpecValidationError, match="valid sequential production-outline"):\n        _extract(\n            '{"production_batches":[],"complete":false,"next_cursor":"p2"}\\n'\n            '{"note":"alternative"}',\n            expected,\n        )\n'''
          new = '''def test_outline_sequence_ignores_unrelated_scratch_object() -> None:\n    expected = (frozenset({"production_batches", "complete", "next_cursor"}),)\n    assert _extract(\n        '{"production_batches":[],"complete":false,"next_cursor":"p2"}\\n'\n        '{"note":"alternative"}',\n        expected,\n    ) == {"production_batches": [], "complete": False, "next_cursor": "p2"}\n'''
          if old not in s:
              raise SystemExit('strict-json scratch test shape changed')
          s = s.replace(old, new, 1)
          s = s.replace('match="found 2 complete outermost JSON containers"', 'match="found 2 matching objects"')
          p.write_text(s, encoding='utf-8')

          replace(
              'tests/test_planner_outline_prompt_contract.py',
              '    assert "Choose the page size yourself" in system\n',
              '    assert "Choose page size yourself" in system\n',
          )
          replace(
              'tests/test_planner_pagination_safety_contract.py',
              'match="no host-verifiable deliverable progress"',
              'match="no verified progress"',
          )

          # True dependency waves: work unlocked by this wave cannot preempt work already ready at wave start.
          replace(
              'minecraft_mod_ai/execution_efficiency_contract.py',
              '''    emitted = 0\n    while ready:\n        _, index = heapq.heappop(ready)\n        group = groups[index]\n        yield str(group["stage"]), tuple(group["members"])\n        emitted += 1\n        for dependent in dependents[index]:\n            indegree[dependent] -= 1\n            if indegree[dependent] == 0:\n                heapq.heappush(\n                    ready,\n                    (int(groups[dependent]["first_order"]), dependent),\n                )\n''',
              '''    emitted = 0\n    while ready:\n        current_wave: list[tuple[int, int]] = []\n        while ready:\n            current_wave.append(heapq.heappop(ready))\n        next_wave: list[tuple[int, int]] = []\n        for _, index in current_wave:\n            group = groups[index]\n            yield str(group["stage"]), tuple(group["members"])\n            emitted += 1\n            for dependent in dependents[index]:\n                indegree[dependent] -= 1\n                if indegree[dependent] == 0:\n                    heapq.heappush(\n                        next_wave,\n                        (int(groups[dependent]["first_order"]), dependent),\n                    )\n        ready = next_wave\n''',
          )

          # Streaming tests mock the persistent httpx.Client seam used in production.
          Path('tests/test_llama_server_streaming.py').write_text(r'''from __future__ import annotations

from types import SimpleNamespace

import httpx

from minecraft_mod_ai import llama_stream_efficiency_contract as stream_contract
from minecraft_mod_ai.llama_server_hardware_policy import _strict_server_generate


class _Adapter:
    def __init__(self) -> None:
        self.config = SimpleNamespace(
            role="planner",
            model_id="test/model",
            max_new_tokens=8192,
        )


class _StreamingResponse:
    status_code = 200
    text = ""

    def __enter__(self):
        return self

    def __exit__(self, exc_type, exc, tb):
        return False

    def read(self):
        return b""

    def iter_lines(self):
        yield ': ping - connection liveness only'
        yield 'data: {"choices":[{"delta":{"role":"assistant"}}]}'
        yield 'data: {"choices":[{"delta":{"content":"{\\"ok\\":"}}]}'
        yield 'data: {"choices":[{"delta":{"content":"true}"}}]}'
        yield 'data: [DONE]'


class _UnavailableTelemetryResponse:
    status_code = 404
    text = ""

    @staticmethod
    def json():
        return {}


def _disable_mock_telemetry(monkeypatch) -> None:
    monkeypatch.setattr(httpx, "get", lambda *args, **kwargs: _UnavailableTelemetryResponse())


def test_local_native_generation_uses_sse_without_fixed_read_timeout(monkeypatch) -> None:
    captured: dict[str, object] = {}
    stream_contract._CLIENTS.clear()

    class FakeClient:
        def __init__(self, *, timeout, limits):
            captured["timeout"] = timeout
            captured["limits"] = limits

        def stream(self, method, url, *, json):
            captured["method"] = method
            captured["url"] = url
            captured["json"] = json
            return _StreamingResponse()

        def close(self):
            pass

    monkeypatch.setattr(httpx, "Client", FakeClient)
    _disable_mock_telemetry(monkeypatch)

    adapter = _Adapter()
    request = SimpleNamespace(
        messages=({"role": "user", "content": "return json"},),
        response_format="json",
    )
    result = _strict_server_generate(adapter, request, "http://127.0.0.1:8910/v1")

    assert result == '{"ok":true}'
    assert captured["method"] == "POST"
    assert captured["url"] == "http://127.0.0.1:8910/v1/chat/completions"
    assert captured["json"]["stream"] is True
    timeout = captured["timeout"]
    assert isinstance(timeout, httpx.Timeout)
    assert timeout.connect == 30.0
    assert timeout.read is None
    assert timeout.write == 30.0
    assert timeout.pool == 30.0


def test_local_native_stream_requires_done_marker(monkeypatch) -> None:
    class _BrokenResponse(_StreamingResponse):
        def iter_lines(self):
            yield 'data: {"choices":[{"delta":{"content":"partial"}}]}'

    stream_contract._CLIENTS.clear()

    class FakeClient:
        def __init__(self, *, timeout, limits):
            pass

        def stream(self, *args, **kwargs):
            return _BrokenResponse()

        def close(self):
            pass

    monkeypatch.setattr(httpx, "Client", FakeClient)
    _disable_mock_telemetry(monkeypatch)

    adapter = _Adapter()
    request = SimpleNamespace(
        messages=({"role": "user", "content": "x"},),
        response_format="text",
    )

    try:
        _strict_server_generate(adapter, request, "http://127.0.0.1:8910/v1")
    except Exception as exc:
        assert "stream ended before the [DONE] marker" in str(exc)
    else:
        raise AssertionError("truncated SSE stream must fail closed")
''', encoding='utf-8')

          # The workflow is diagnostic/fix scaffolding, not repository product code.
          Path('.github/workflows/fix-residual-audit.yml').unlink()
          PY
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]' ruff
      - name: Validate edited sources
        run: |
          python -m compileall -q minecraft_mod_ai tests tools
          python -m ruff check minecraft_mod_ai tools --select E9,F63,F7,F82
          python tools/validate_colab_notebook.py
      - name: Run residual targeted suite
        run: |
          python -m pytest -q --tb=short \
            tests/test_colab_native_llama_prebuilt_integration.py \
            tests/test_execution_efficiency_contract.py \
            tests/test_llama_server_streaming.py \
            tests/test_mcp_complete_plan_refs.py \
            tests/test_mcp_config.py \
            tests/test_model_runtime_performance_contract.py \
            tests/test_no_legacy_python_llama_runtime.py \
            tests/test_notebook_registry_policy.py \
            tests/test_planner_incremental_repair_contract.py \
            tests/test_planner_json_runtime_contract.py \
            tests/test_planner_outline_prompt_contract.py \
            tests/test_planner_pagination_safety_contract.py \
            tests/test_planner_strict_json_contract.py
      - name: Commit verified fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix residual runtime and audit contracts'
          git pull --rebase origin main
          git push origin HEAD:main
