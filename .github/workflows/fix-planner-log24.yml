name: Planner log24 robustness repair
on:
  push:
    paths:
      - '.github/workflows/fix-planner-log24.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fix staging markers and apply systemic repair
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/fix_planner_format_and_retrieval.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('"def _generate_section(\\n",', '"def _generate_section(",')
          text = text.replace('"def _normalize_heading(\\n",', '"def _normalize_heading(",')
          text = text.replace('"def _section_messages(\\n",', '"def _section_messages(",')
          text = text.replace('"def _render_design_research(\\n",', '"def _render_design_research(",')
          path.write_text(text, encoding='utf-8')
          PY
          python tools/fix_planner_format_and_retrieval.py
          python tools/fix_planner_budget_field_owner.py
      - name: Install dependencies
        run: python -m pip install -q -e . pytest ruff
      - name: Compile
        run: python -m compileall -q minecraft_mod_ai tests
      - name: Ruff changed surfaces
        run: |
          ruff check --select F,E9 \
            minecraft_mod_ai/agentic_research_game_design.py \
            minecraft_mod_ai/pre_design_external_source_contract.py \
            minecraft_mod_ai/small_model_predesign_research.py \
            minecraft_mod_ai/pre_design_research_pipeline.py \
            tests/test_agentic_research_game_design.py \
            tests/test_planner_log24_regressions.py
      - name: Regression tests
        run: |
          pytest -q \
            tests/test_planner_log24_regressions.py \
            tests/test_agentic_research_game_design.py \
            tests/test_small_model_predesign_v2.py \
            tests/test_final_host_owned_predesign.py \
            tests/test_pre_design_research_pipeline.py \
            tests/test_pre_design_rag_direct_owner.py
      - name: Architecture assertions
        shell: bash
        run: |
          set -euxo pipefail
          grep -n 'host_owned_field_compiler' minecraft_mod_ai/agentic_research_game_design.py
          grep -n '^def _host_field_fallback' minecraft_mod_ai/agentic_research_game_design.py
          grep -n '^def _ensure_module_coverage' minecraft_mod_ai/agentic_research_game_design.py
          ! grep -A90 -n '^def _generate_section' minecraft_mod_ai/agentic_research_game_design.py | grep '_parse_markdown_section(raw, fields)'
          grep -A35 -n '^def _design_request_fits' minecraft_mod_ai/pre_design_research_pipeline.py | grep '_field_messages'
          grep -n 'no_claim_bearing_source_bodies' minecraft_mod_ai/small_model_predesign_research.py
          grep -n 'common >= 5' minecraft_mod_ai/pre_design_external_source_contract.py
      - name: Commit verified repair
        shell: bash
        run: |
          set -euxo pipefail
          rm -f tools/fix_planner_format_and_retrieval.py
          rm -f tools/fix_planner_budget_field_owner.py
          rm -f .github/workflows/fix-planner-log24.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'fix: make planner output structure host-owned'
          git push origin HEAD:main
