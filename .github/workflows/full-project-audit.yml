name: Full project audit

on:
  push:
    branches: [main]
    paths-ignore:
      - "audit/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: full-project-audit-main
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Apply generated Java compile fixes
        run: python tools/apply_fabric_generator_compile_fixes.py

      - name: Commit generated Java template fixes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- minecraft_mod_ai/geckolib_generator.py minecraft_mod_ai/extended_content_generator.py minecraft_mod_ai/system_templates_quest.py)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              minecraft_mod_ai/geckolib_generator.py \
              minecraft_mod_ai/extended_content_generator.py \
              minecraft_mod_ai/system_templates_quest.py
            git commit -m "Fix generated Fabric Java compile contracts [skip ci]"
            git push origin HEAD:main
          fi

      - name: Verify packaged Skill catalog is synchronized
        shell: bash
        run: |
          python tools/package_skills.py
          git diff --exit-code -- minecraft_mod_ai/packaged_skills.json

      - name: Run complete repository audit
        run: python tools/full_project_audit.py

      - name: Commit audit evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/FULL_PROJECT_AUDIT.json audit/FULL_PROJECT_AUDIT.log
          if ! git diff --cached --quiet; then
            git commit -m "Record full project audit evidence [skip ci]"
            git push origin HEAD:main
          fi

      - name: Enforce audit result
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("audit/FULL_PROJECT_AUDIT.json").read_text())
          if report["overall_status"] != "passed":
              raise SystemExit(
                  "Full project audit failed: " + ", ".join(report["failed_checks"])
              )
          print("Full project audit passed.")
          PY
