name: Worker 12 Native Cleanup

on:
  push:
    paths:
      - '.github/worker12-native-cleanup.trigger'

permissions:
  contents: write

concurrency:
  group: worker12-native-cleanup
  cancel-in-progress: false

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply worker 12 cleanup
        run: python .github/scripts/worker12_native_cleanup.py
      - name: Static gates
        run: |
          git diff --check
          python -m compileall -q minecraft_mod_ai tests tools
          python -m ruff check minecraft_mod_ai/agentic_optimization_contract.py tests/test_worker12_shared_core.py --select F,E7,E9
          vulture minecraft_mod_ai/agentic_optimization_contract.py --min-confidence 100
          python tools/validate_colab_notebook.py
      - name: Worker 12 regression suite
        run: |
          python -m pytest -q \
            tests/test_worker12_shared_core.py \
            tests/test_agent_security_contract.py \
            tests/test_runtime_bootstrap_clean.py \
            tests/test_validation_execution_contract.py \
            tests/test_remote_store_defaults.py \
            tests/test_remote_trajectory_auth_preflight.py \
            tests/test_colab_prefetch_bootstrap.py \
            tests/test_colab_run_modes.py
      - name: Commit tested source changes
        run: |
          git add minecraft_mod_ai/agentic_optimization_contract.py tests/test_worker12_shared_core.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'refactor(worker12): unify repair diagnostic authority'
      - name: Rebase, re-test, and push main
        run: |
          set -euo pipefail
          if ! git log -1 --pretty=%s | grep -q '^refactor(worker12): unify repair diagnostic authority$'; then
            exit 0
          fi
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            python -m pytest -q tests/test_worker12_shared_core.py tests/test_agent_security_contract.py
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
