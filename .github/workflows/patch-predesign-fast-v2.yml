name: One-shot Pre-design Fast Fix v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-predesign-fast-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Install project test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Reapply validated patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/patch-predesign-fast.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(source) if line.strip() == "python - <<'PY'") + 1
          end = next(i for i in range(start, len(source)) if source[i].strip() == 'PY')
          lines = source[start:end]
          normalized = []
          for line in lines:
              normalized.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/predesign_patch.py').write_text('\n'.join(normalized) + '\n', encoding='utf-8')
          PY
          python /tmp/predesign_patch.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_predesign_source_discovery_contract.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert rows[0]["external_rag"]["github_retrieval"]["provider_status"] == "error"\n'
          new = '''    assert rows[0]["external_rag"]["github_retrieval"]["provider_status"] in {\n        "error",\n        "disabled_after_rate_or_auth_failure",\n    }\n'''
          if old not in text:
              raise SystemExit('github 403 assertion marker missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Compile and run focused regressions
        run: |
          python -m py_compile minecraft_mod_ai/central_research.py minecraft_mod_ai/pre_design_grounded_rag.py
          python -m pytest -q tests/test_predesign_source_discovery_contract.py
      - name: Commit fast fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/central_research.py minecraft_mod_ai/pre_design_grounded_rag.py tests/test_predesign_source_discovery_contract.py
          git commit -m 'fix: validate and parallelize pre-design discovery'
          git push origin HEAD:main
