name: Fix coder liveness once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix_coder_liveness_once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply coder liveness fixes
        run: python .github/scripts/fix_coder_liveness_once.py
      - name: Compile patched modules
        run: |
          python -m py_compile \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            minecraft_mod_ai/generation_output_budget.py \
            minecraft_mod_ai/prefill_calibration_strictness_contract.py \
            minecraft_mod_ai/custom_module_generator.py \
            tests/test_coder_liveness_boundaries.py
      - name: Run focused regressions
        run: python -m pytest -q tests/test_coder_liveness_boundaries.py
      - name: Commit real fix and remove temporary machinery
        run: |
          git rm .github/scripts/fix_coder_liveness_once.py .github/workflows/fix_coder_liveness_once.yml
          git add \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            minecraft_mod_ai/generation_output_budget.py \
            minecraft_mod_ai/prefill_calibration_strictness_contract.py \
            minecraft_mod_ai/custom_module_generator.py \
            tests/test_coder_liveness_boundaries.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: stop coder phase and output restart loops"
          git push origin HEAD:main
      - name: Remove temporary machinery after failure
        if: failure()
        run: |
          git reset --hard HEAD
          git rm -f .github/scripts/fix_coder_liveness_once.py .github/workflows/fix_coder_liveness_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove failed coder liveness patch machinery"
          git push origin HEAD:main
