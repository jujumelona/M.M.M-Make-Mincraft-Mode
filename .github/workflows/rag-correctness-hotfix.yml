name: RAG correctness hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rag-correctness-hotfix.yml'

permissions:
  contents: write

concurrency:
  group: rag-correctness-hotfix
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Apply reviewed small-model architecture refactor
        run: |
          python -m pip install --quiet PyYAML
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          data = yaml.safe_load(Path('.github/workflows/native-rag-protocol-refactor.yml').read_text(encoding='utf-8'))
          wanted = {
              'Move bounded design work to schema-constrained non-thinking path',
              'Tighten retrieval admission before evidence fusion',
              'Update regression contract for structured design',
          }
          found = set()
          for step in data['jobs']['refactor']['steps']:
              name = step.get('name') if isinstance(step, dict) else None
              if name in wanted:
                  subprocess.run(step['run'], shell=True, executable='/bin/bash', check=True)
                  found.add(name)
          if found != wanted:
              raise SystemExit(f'missing reviewed steps: {sorted(wanted - found)}')
          PY

      - name: Remove model-driven JSON repair
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/agentic_pre_design_rag.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '_DOMAIN_CHECKPOINT_SCHEMA = "mmm/research-domain-checkpoint-v3"',
              '_DOMAIN_CHECKPOINT_SCHEMA = "mmm/research-domain-checkpoint-v6"',
              1,
          )
          text = text.replace(
              '_PAGE_PROTOCOL_SCHEMA = "mmm/research-page-host-completion-v3"',
              '_PAGE_PROTOCOL_SCHEMA = "mmm/research-page-host-completion-v4"',
              1,
          )
          text = text.replace(
              '_SYNTHESIS_PROTOCOL_SCHEMA = "mmm/research-hierarchical-synthesis-v3"',
              '_SYNTHESIS_PROTOCOL_SCHEMA = "mmm/research-hierarchical-synthesis-v4"',
              1,
          )
          start = text.index('def _generate_bounded(')
          end = text.index('def _structured_output_failure(', start)
          replacement = '''def _normalize_bounded_json_text(raw_text: str) -> str:
              """Recover one embedded or fenced JSON value locally without another model turn."""
              candidate = str(raw_text or "").strip()
              if candidate.startswith("```"):
                  lines = candidate.splitlines()
                  if lines and lines[0].strip().startswith("```"):
                      lines = lines[1:]
                  if lines and lines[-1].strip() == "```":
                      lines = lines[:-1]
                  candidate = "\\n".join(lines).strip()
              decoder = json.JSONDecoder()
              starts = [0] + [
                  index for index, char in enumerate(candidate) if char in "{[" and index
              ]
              seen: set[int] = set()
              for position in starts:
                  if position in seen:
                      continue
                  seen.add(position)
                  try:
                      value, _ = decoder.raw_decode(candidate[position:])
                  except json.JSONDecodeError:
                      continue
                  if isinstance(value, (Mapping, list)):
                      return json.dumps(
                          value,
                          ensure_ascii=False,
                          sort_keys=True,
                          separators=(",", ":"),
                      )
              raise ValueError("no recoverable JSON object or array in bounded model output")


          def _generate_bounded(
              agentic_module: Any,
              router: Any,
              *,
              messages: list[dict[str, str]],
              response_schema: Mapping[str, Any],
              parser: Any,
              progress_label: str,
          ) -> Any:
              """Use one model turn, deterministic host normalization, then fail closed."""
              _emit_research_progress("model_attempt", label=progress_label, attempt=1)
              raw = ""
              try:
                  raw = router.generate_text(
                      "planner",
                      messages,
                      response_format="json",
                      response_schema=response_schema,
                      tool_stage="research",
                      enable_tools=False,
                  )
              except Exception as model_error:
                  _emit_bounded_failure(
                      "bounded_model_failure",
                      progress_label=progress_label,
                      raw_output=raw,
                      error=model_error,
                  )
                  raise
              try:
                  return parser(raw)
              except Exception as first_error:
                  _emit_bounded_failure(
                      "bounded_parse_failure",
                      progress_label=progress_label,
                      raw_output=raw,
                      error=first_error,
                  )
                  if not isinstance(first_error, agentic_module.SpecValidationError) and not _structured_output_failure(first_error):
                      raise
              try:
                  normalized = _normalize_bounded_json_text(raw)
                  parsed = parser(normalized)
              except Exception as local_error:
                  _emit_bounded_failure(
                      "bounded_host_normalization_failure",
                      progress_label=progress_label,
                      raw_output=raw,
                      error=local_error,
                  )
                  raise _BoundedResearchOutputError(
                      "bounded JSON failed after one model attempt and deterministic host normalization: "
                      f"{type(local_error).__name__}: {local_error}"
                  ) from local_error
              _emit_research_progress(
                  "bounded_host_normalized",
                  label=progress_label,
                  attempt=1,
                  raw_output_sha256=_sha256_text(raw),
              )
              return parsed
          '''
          path.write_text(text[:start] + replacement.rstrip() + '\n\n\n' + text[end:], encoding='utf-8')
          PY

      - name: Make corrective sufficiency fail closed
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/pre_design_rag_corrective.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '_QUALITY_SCHEMA = "mmm/pre-design-rag-quality-v3"',
              '_QUALITY_SCHEMA = "mmm/pre-design-rag-quality-v4"',
              1,
          )
          marker = '\n\ndef _corrective_round_limit() -> int:'
          helper = '''

          def _round_is_terminally_sufficient(
              summary: Mapping[str, Any],
              *,
              page_gaps: Any = (),
              support_rejections: Any = (),
          ) -> bool:
              """Require verified claims and zero unresolved evidence obligations."""
              return (
                  _round_has_verified_claims(summary)
                  and not _stable_text(page_gaps)
                  and not _stable_text(support_rejections)
              )
          '''
          if '_round_is_terminally_sufficient(' not in text:
              if marker not in text:
                  raise SystemExit('corrective helper insertion marker missing')
              text = text.replace(marker, helper.rstrip() + marker, 1)

          old = '''if _round_has_verified_claims(accumulated_summary):
                          fixed_point = _VERIFIED_FIXED_POINT
                          break'''
          new = '''if _round_is_terminally_sufficient(
                          accumulated_summary,
                          page_gaps=active_page_gaps,
                          support_rejections=active_support_rejections,
                      ):
                          fixed_point = _VERIFIED_FIXED_POINT
                          break'''
          if old not in text:
              raise SystemExit('unsafe any-claim terminal condition missing')
          text = text.replace(old, new, 1)
          text = text.replace(
              'summary["gaps"] = [] if claims else list(active_page_gaps)',
              'summary["gaps"] = list(active_page_gaps)',
              1,
          )
          text = text.replace(
              'if not claims and summary.get("gaps"):\n            reasons.append("unresolved evidence gaps remain")',
              'if summary.get("gaps"):\n            reasons.append("unresolved evidence gaps remain")\n        if active_support_rejections:\n            reasons.append("unresolved support rejections remain")',
              1,
          )
          text = text.replace(
              '"gap_semantics": "page_local_diagnostic_not_domain_blocker"',
              '"gap_semantics": "unresolved_page_or_support_gap_blocks_domain_sufficiency"',
              1,
          )
          text = text.replace(
              '"schema_version": "mmm/research-domain-checkpoint-v5"',
              '"schema_version": "mmm/research-domain-checkpoint-v6"',
              1,
          )
          text = text.replace(
              '"_round_has_verified_claims",\n]',
              '"_round_has_verified_claims",\n    "_round_is_terminally_sufficient",\n]',
              1,
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate source and regression behavior
        run: |
          python -m pip install --prefer-binary -e '.[dev]'
          python -m compileall -q minecraft_mod_ai tests
          python -m ruff check minecraft_mod_ai tests --select F,E7,E9
          python -m pytest -q tests/test_agentic_research_game_design.py tests/test_pre_design_rag_quality_contract.py
          python - <<'PY'
          import json
          from minecraft_mod_ai import agentic_pre_design_rag as rag
          from minecraft_mod_ai import pre_design_rag_corrective as corrective

          summary = {'claims': [{'claim': 'supported'}]}
          assert corrective._round_is_terminally_sufficient(summary)
          assert not corrective._round_is_terminally_sufficient(summary, page_gaps=['missing'])
          assert not corrective._round_is_terminally_sufficient(summary, support_rejections=['unsupported'])

          class Agentic:
              class SpecValidationError(ValueError):
                  pass

          class Router:
              def __init__(self):
                  self.calls = 0
              def generate_text(self, *args, **kwargs):
                  self.calls += 1
                  return '```json\n{"queries":["minecraft colony persistence"]}\n```'

          router = Router()
          parsed = rag._generate_bounded(
              Agentic,
              router,
              messages=[{'role': 'user', 'content': 'x'}],
              response_schema={'type': 'object'},
              parser=json.loads,
              progress_label='regression',
          )
          assert parsed == {'queries': ['minecraft colony persistence']}
          assert router.calls == 1
          assert rag._DOMAIN_CHECKPOINT_SCHEMA.endswith('-v6')
          assert corrective._QUALITY_SCHEMA.endswith('-v4')
          PY

      - name: Commit tested source fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/agentic_research_game_design.py minecraft_mod_ai/agentic_pre_design_rag.py minecraft_mod_ai/pre_design_rag_corrective.py minecraft_mod_ai/pre_design_rag_fusion.py tests/test_agentic_research_game_design.py tests/test_pre_design_rag_quality_contract.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: fail closed on incomplete pre-design RAG'
          git push origin HEAD:main
