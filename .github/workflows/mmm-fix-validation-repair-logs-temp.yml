name: MMM validation and repair regression fix

on:
  push:
    paths:
      - '.github/workflows/mmm-fix-validation-repair-logs-temp.yml'

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Patch confirmed defects
        run: python .github/scripts/mmm_fix_validation_repair_logs_temp.py

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run focused regression tests
        run: python -m pytest -q tests/test_validation_repair_regressions.py

      - name: Run related regression suite
        run: python -m pytest -q tests -k 'validation or repair or orchestrator or runner'

      - name: Commit tested fix to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/mmm-fix-validation-repair-logs-temp.yml
          rm -f .github/scripts/mmm_fix_validation_repair_logs_temp.py
          git add minecraft_mod_ai/validation_checkpoint_policy.py minecraft_mod_ai/repair_engine.py tests/test_validation_repair_regressions.py .github/workflows/mmm-fix-validation-repair-logs-temp.yml .github/scripts/mmm_fix_validation_repair_logs_temp.py
          git diff --cached --check
          git commit -m 'fix: bind final validation and repair diagnostics'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Concurrent main change conflicted with tested patch; refusing force push.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Unable to push tested patch after safe retries.' >&2
          exit 1
