name: Worker 04 routing exhaustion patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'ci: apply worker04 routing exhaustion patch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Patch exhausted required-RAG route selection
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/progress_aware_tool_loop.py')
          text = path.read_text(encoding='utf-8')
          old = '''                eligible_rag_names = tuple(
                      sorted(name for name in phase_tool_names if name in _RAG_EVIDENCE_TOOLS)
                  )'''.replace('                    ', '    ')
          # Keep indentation explicit instead of relying on formatter-specific rewriting.
          old = """                eligible_rag_names = tuple(
                    sorted(name for name in phase_tool_names if name in _RAG_EVIDENCE_TOOLS)
                )"""
          new = """                eligible_rag_names = tuple(
                    sorted(
                        name
                        for name in phase_tool_names
                        if name in _RAG_EVIDENCE_TOOLS and name not in state.attempted_sources
                    )
                )"""
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one required-RAG candidate block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Run worker 04 regressions
        run: >-
          python -m pytest -q
          tests/test_agent_tool_calling.py::test_required_rag_exhaustion_fails_before_hard_round_budget
          tests/test_agent_required_rag_semantic_choice.py
          tests/test_agent_capability_manifest_degradation.py
      - name: Commit patch to main
        run: |
          git config user.name 'worker-04-bot'
          git config user.email 'worker-04@users.noreply.github.com'
          git add minecraft_mod_ai/progress_aware_tool_loop.py
          git commit -m 'fix: exhaust weak RAG routes before retry'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            python -m pytest -q \
              tests/test_agent_tool_calling.py::test_required_rag_exhaustion_fails_before_hard_round_budget \
              tests/test_agent_required_rag_semantic_choice.py \
              tests/test_agent_capability_manifest_degradation.py
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
