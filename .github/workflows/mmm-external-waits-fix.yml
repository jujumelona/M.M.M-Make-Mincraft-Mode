name: MMM external runtime wait hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mmm-external-waits-fix.yml'

permissions:
  contents: write

concurrency:
  group: mmm-external-waits-fix-main
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Sync latest main
        run: git pull --ff-only origin main
      - name: Patch external runtime waits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def patch(path_name: str, replacements: list[tuple[str, str]]) -> None:
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'anchor not found in {path_name}: {old[:180]!r}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          patch('minecraft_mod_ai/scalable_pipeline.py', [
              ('from concurrent.futures import ThreadPoolExecutor\n', ''),
              ('from pathlib import Path\n\nfrom .importer import inspect_existing_project_archive\n',
               'from pathlib import Path\nfrom typing import Any\n\nfrom .deadline_executor import iter_completed_with_deadlines\nfrom .importer import inspect_existing_project_archive\n'),
              ('''            with ThreadPoolExecutor(max_workers=2, thread_name_prefix="mmm-plan") as pool:\n                proposal_future = pool.submit(self.planner.plan, prompt)\n                report_future = pool.submit(inspect_existing_project_archive, existing_input)\n                proposal = proposal_future.result()\n                report = report_future.result()\n''',
               '''            jobs = (\n                ("proposal", lambda: self.planner.plan(prompt)),\n                ("report", lambda: inspect_existing_project_archive(existing_input)),\n            )\n\n            def resolve_input(job: tuple[str, Any]) -> tuple[str, Any]:\n                name, function = job\n                return name, function()\n\n            results: dict[str, Any] = {}\n            for _job, result in iter_completed_with_deadlines(\n                jobs,\n                resolve_input,\n                max_workers=len(jobs),\n                stage="scalable-plan-inputs",\n                sort_key=lambda item: item[0],\n            ):\n                name, value = result\n                results[name] = value\n            proposal = results["proposal"]\n            report = results["report"]\n'''),
          ])

          patch('minecraft_mod_ai/reference_source_research.py', [
              ('from concurrent.futures import ThreadPoolExecutor\n', ''),
              ('import httpx\n\n_TIMEOUT', 'import httpx\n\nfrom .deadline_executor import iter_completed_with_deadlines\n\n_TIMEOUT'),
              ('''    with ThreadPoolExecutor(\n        max_workers=len(provider_specs),\n        thread_name_prefix="mmm-reference-provider",\n    ) as executor:\n        futures = [\n            executor.submit(_retrieve_provider, provider, function)\n            for provider, function in provider_specs\n        ]\n        provider_results = [future.result() for future in futures]\n\n    records: list[dict[str, Any]] = []\n''',
               '''    provider_results_by_name: dict[\n        str, tuple[list[dict[str, Any]], dict[str, Any], dict[str, str] | None]\n    ] = {}\n\n    def retrieve_provider_job(\n        spec: tuple[str, _ReferenceProvider],\n    ) -> tuple[\n        str,\n        tuple[list[dict[str, Any]], dict[str, Any], dict[str, str] | None],\n    ]:\n        provider, function = spec\n        return provider, _retrieve_provider(provider, function)\n\n    for _spec, result in iter_completed_with_deadlines(\n        provider_specs,\n        retrieve_provider_job,\n        max_workers=len(provider_specs),\n        stage="reference-source-providers",\n        sort_key=lambda item: item[0],\n    ):\n        provider, provider_result = result\n        provider_results_by_name[provider] = provider_result\n    provider_results = [\n        provider_results_by_name[provider] for provider, _function in provider_specs\n    ]\n\n    records: list[dict[str, Any]] = []\n'''),
          ])

          patch('minecraft_mod_ai/runtime_regression_reconciliation.py', [
              ('from concurrent.futures import ThreadPoolExecutor, as_completed\n', ''),
              ('from typing import Any\n\n_INSTALLED', 'from typing import Any\n\nfrom .deadline_executor import iter_completed_with_deadlines\n\n_INSTALLED'),
              ('''    results: list[Any | None] = [None] * len(ordered)\n    with ThreadPoolExecutor(max_workers=_workers()) as executor:\n        futures = {\n            executor.submit(\n                reuse.inspect_repository_slice,\n                repository=repository,\n                capability=capability,\n                adapter=adapter,\n                discovery_client=discovery_client,\n            ): index\n            for index, repository in enumerate(ordered)\n        }\n        for future in as_completed(futures):\n            index = futures[future]\n            try:\n                results[index] = future.result()\n            except Exception:\n                results[index] = None\n    return tuple(item for item in results if item is not None)\n''',
               '''    results: list[Any | None] = [None] * len(ordered)\n    jobs = tuple(enumerate(ordered))\n\n    def inspect_candidate(job: tuple[int, str]) -> tuple[int, Any | None]:\n        index, repository = job\n        try:\n            donor = reuse.inspect_repository_slice(\n                repository=repository,\n                capability=capability,\n                adapter=adapter,\n                discovery_client=discovery_client,\n            )\n        except Exception:\n            donor = None\n        return index, donor\n\n    for _job, result in iter_completed_with_deadlines(\n        jobs,\n        inspect_candidate,\n        max_workers=min(_workers(), len(jobs)),\n        stage="reuse-donor-candidate-inspection",\n        sort_key=lambda item: item[0],\n    ):\n        index, donor = result\n        results[index] = donor\n    return tuple(item for item in results if item is not None)\n'''),
          ])

          Path('tests/test_external_runtime_wait_deadline_contract.py').write_text('''from __future__ import annotations\n\nimport inspect\n\nfrom minecraft_mod_ai import reference_source_research\nfrom minecraft_mod_ai import runtime_regression_reconciliation\nfrom minecraft_mod_ai import scalable_pipeline\n\n\ndef test_scalable_plan_join_is_deadline_bound() -> None:\n    source = inspect.getsource(scalable_pipeline)\n    assert "ThreadPoolExecutor" not in source\n    assert ".result()" not in source\n    assert 'stage="scalable-plan-inputs"' in source\n\n\ndef test_reference_providers_are_deadline_bound() -> None:\n    source = inspect.getsource(reference_source_research)\n    assert "ThreadPoolExecutor" not in source\n    assert ".result()" not in source\n    assert 'stage="reference-source-providers"' in source\n    assert "_TIMEOUT = 12.0" in source\n\n\ndef test_reuse_donor_inspection_is_deadline_bound() -> None:\n    source = inspect.getsource(runtime_regression_reconciliation)\n    assert "ThreadPoolExecutor" not in source\n    assert "as_completed" not in source\n    assert ".result()" not in source\n    assert 'stage="reuse-donor-candidate-inspection"' in source\n''', encoding='utf-8')
          PY
      - name: Compile
        run: |
          python -m py_compile \
            minecraft_mod_ai/scalable_pipeline.py \
            minecraft_mod_ai/reference_source_research.py \
            minecraft_mod_ai/runtime_regression_reconciliation.py \
            tests/test_external_runtime_wait_deadline_contract.py
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_external_runtime_wait_deadline_contract.py \
            tests/test_remaining_bottleneck_contract.py \
            tests/test_retrieval_liveness_deadline_contract.py \
            tests/test_planning_deadline_hardening.py
          mapfile -t related < <(find tests -maxdepth 1 -type f \( -name '*scalable_pipeline*' -o -name '*reference_source*' -o -name '*runtime_regression*' -o -name '*reuse*donor*' \) ! -name 'test_external_runtime_wait_deadline_contract.py' -print)
          if ((${#related[@]})); then
            python -m pytest -q "${related[@]}"
          fi
      - name: Check correctness/import regressions
        run: |
          ruff check --select F,I --fix \
            minecraft_mod_ai/scalable_pipeline.py \
            minecraft_mod_ai/reference_source_research.py \
            minecraft_mod_ai/runtime_regression_reconciliation.py \
            tests/test_external_runtime_wait_deadline_contract.py
          ruff check --select F,I \
            minecraft_mod_ai/scalable_pipeline.py \
            minecraft_mod_ai/reference_source_research.py \
            minecraft_mod_ai/runtime_regression_reconciliation.py \
            tests/test_external_runtime_wait_deadline_contract.py
      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/mmm-external-waits-fix.yml
          git add \
            minecraft_mod_ai/scalable_pipeline.py \
            minecraft_mod_ai/reference_source_research.py \
            minecraft_mod_ai/runtime_regression_reconciliation.py \
            tests/test_external_runtime_wait_deadline_contract.py
          git commit -m 'fix: bound external runtime joins'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            sleep $((attempt * 2))
          done
          echo 'failed to push external wait fixes after retries' >&2
          exit 1
