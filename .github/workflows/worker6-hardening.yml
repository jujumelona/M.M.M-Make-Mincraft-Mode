name: Worker6 one-shot reuse hardening

on:
  push:
    paths:
      - '.github/workflows/worker6-hardening.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply hardening
        run: python scripts/worker6_hardening_once.py

      - name: Syntax verification
        run: python -m compileall -q minecraft_mod_ai tests/test_worker6_reuse_hardening.py

      - name: Commit hardening to main
        shell: bash
        run: |
          git config user.name "jujumelona"
          git config user.email "qasdaa025@gmail.com"
          git add minecraft_mod_ai/source_transplant.py minecraft_mod_ai/reuse_proof_executor.py minecraft_mod_ai/reuse_planner.py minecraft_mod_ai/final_project_assembler.py tests/test_worker6_reuse_hardening.py
          git commit -m "fix(worker6): harden reuse proof pipeline"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
