name: Native parallel runtime cleanup once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-parallel-runtime-once.yml

permissions:
  contents: write

concurrency:
  group: mmm-native-parallel-runtime-once
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
      - name: Convert parallel hooks to explicit calls
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          parallel = Path('minecraft_mod_ai/parallel_runtime_contract.py')
          source = parallel.read_text(encoding='utf-8')
          source = source.replace('from functools import wraps\n', 'from functools import lru_cache, wraps\n')
          source = source.replace('_MODEL_RESOLVER: Callable[[Any], str] | None = None\n', '')
          start = source.index('def _prefetch_model_worker(')
          end = source.index('\ndef _discovery_routes(', start)
          model_section = '''def _prefetch_model_worker(config: Any, resolver: Callable[[Any], str]) -> str:\n    return resolver(config)\n\n\ndef _ensure_model_prefetch(\n    config: Any,\n    resolver: Callable[[Any], str],\n) -> Future[str] | None:\n    """Start exactly one asynchronous GGUF resolution for a local Colab model."""\n    if not _eligible_for_model_prefetch(config):\n        return None\n    key = _model_key(config)\n    with _PREFETCH_LOCK:\n        future = _PREFETCH_FUTURES.get(key)\n        if future is not None:\n            return future\n        future = _PREFETCH_EXECUTOR.submit(_prefetch_model_worker, config, resolver)\n        _PREFETCH_FUTURES[key] = future\n    label = key[1] or Path(key[0]).name or key[0]\n    print("GGUF prefetch: started", label, flush=True)\n    return future\n\n\ndef resolve_model_path(config: Any, resolver: Callable[[Any], str]) -> str:\n    """Reuse an already-running model download, otherwise resolve synchronously."""\n    future = _ensure_model_prefetch(config, resolver)\n    if future is None:\n        return resolver(config)\n    return future.result()\n\n\ndef prefetch_profile(profile: Any) -> None:\n    """Start planner GGUF prefetch explicitly after a profile is resolved."""\n    config = profile.roles.get("planner")\n    if config is None or not _eligible_for_model_prefetch(config):\n        return\n    from .llama_server_autotune import _resolve_model_path_direct\n\n    _ensure_model_prefetch(config, _resolve_model_path_direct)\n\n'''
          source = source[:start] + model_section + source[end + 1:]

          tree = ast.parse(source)
          install = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == 'install')
          lines = source.splitlines(keepends=True)
          replacement = '''@lru_cache(maxsize=1)\ndef _native_discovery_wrapper() -> Callable[..., dict[str, Any]]:\n    from . import ecosystem_discovery as ecosystem_module\n\n    return _parallel_discover_seed_bundle_factory(\n        ecosystem_module,\n        ecosystem_module._serial_discover_seed_bundle,\n    )\n\n\ndef discover_seed_bundle(*args: Any, **kwargs: Any) -> dict[str, Any]:\n    return _native_discovery_wrapper()(*args, **kwargs)\n\n\n@lru_cache(maxsize=1)\ndef _native_research_wrapper() -> Callable[..., dict[str, Any]]:\n    from . import central_research as central_module\n\n    return _parallel_retrieve_domain_evidence_factory(\n        central_module,\n        central_module._serial_retrieve_domain_evidence,\n    )\n\n\ndef retrieve_domain_evidence(*args: Any, **kwargs: Any) -> dict[str, Any]:\n    return _native_research_wrapper()(*args, **kwargs)\n\n\ndef install(\n    *,\n    model_registry_module: Any,\n    llama_server_autotune_module: Any,\n) -> None:\n    """Compatibility verifier; canonical owners call parallel helpers explicitly."""\n    if not hasattr(llama_server_autotune_module, "_resolve_model_path_direct"):\n        raise RuntimeError("llama autotune must own native prefetch delegation")\n    if not hasattr(model_registry_module.ModelRegistry, "load_profile"):\n        raise RuntimeError("model registry is unavailable")\n\n\n__all__ = [\n    "discover_seed_bundle",\n    "install",\n    "prefetch_profile",\n    "resolve_model_path",\n    "retrieve_domain_evidence",\n]\n'''
          lines[install.lineno - 1:] = [replacement]
          parallel.write_text(''.join(lines), encoding='utf-8')

          autotune = Path('minecraft_mod_ai/llama_server_autotune.py')
          replace_once(autotune, 'def _resolve_model_path(config: Any) -> str:\n', 'def _resolve_model_path_direct(config: Any) -> str:\n')
          replace_once(
              autotune,
              '\n\ndef _fingerprint(config: Any, binary: str, model_path: str) -> str:\n',
              '''\n\ndef _resolve_model_path(config: Any) -> str:\n    from .parallel_runtime_contract import resolve_model_path\n\n    return resolve_model_path(config, _resolve_model_path_direct)\n\n\ndef _fingerprint(config: Any, binary: str, model_path: str) -> str:\n''',
          )

          registry = Path('minecraft_mod_ai/model_registry.py')
          replace_once(
              registry,
              '''        return ModelProfile(\n            name=name,\n            description=str(raw_profile.get("description", "")),\n            roles=roles,\n        )\n''',
              '''        profile = ModelProfile(\n            name=name,\n            description=str(raw_profile.get("description", "")),\n            roles=roles,\n        )\n        from .parallel_runtime_contract import prefetch_profile\n\n        prefetch_profile(profile)\n        return profile\n''',
          )

          central = Path('minecraft_mod_ai/central_research.py')
          replace_once(central, 'def retrieve_domain_evidence(\n', 'def _serial_retrieve_domain_evidence(\n')
          replace_once(
              central,
              '\n\ndef external_discovery_routes(\n',
              '''\n\ndef retrieve_domain_evidence(\n    research_brief: dict[str, Any],\n    *,\n    retrieve: Callable[..., RetrievalReceipt] = retrieve_official_evidence,\n) -> dict[str, Any]:\n    from .parallel_runtime_contract import retrieve_domain_evidence as parallel_retrieve\n\n    return parallel_retrieve(research_brief, retrieve=retrieve)\n\n\nretrieve_domain_evidence._mmm_parallel_rag = True  # type: ignore[attr-defined]\n\n\ndef external_discovery_routes(\n''',
          )

          ecosystem = Path('minecraft_mod_ai/ecosystem_discovery.py')
          text = ecosystem.read_text(encoding='utf-8')
          if text.count('def discover_seed_bundle(') != 1:
              raise SystemExit('ecosystem: expected one discover_seed_bundle definition')
          text = text.replace('def discover_seed_bundle(', 'def _serial_discover_seed_bundle(', 1)
          marker = 'def _seed_query('
          if text.count(marker) != 1:
              raise SystemExit('ecosystem: expected one _seed_query definition')
          wrapper = '''def discover_seed_bundle(prompt: str, game_design: dict[str, Any], *, research_brief: dict[str, Any] | None=None, client: EcosystemDiscoveryClient | None=None, route_cursor: str='', route_limit: int=12) -> dict[str, Any]:\n    from .parallel_runtime_contract import discover_seed_bundle as parallel_discover\n    return parallel_discover(prompt, game_design, research_brief=research_brief, client=client, route_cursor=route_cursor, route_limit=route_limit)\n\ndiscover_seed_bundle._mmm_parallel_routes = True\n\n'''
          text = text.replace(marker, wrapper + marker, 1)
          ecosystem.write_text(text, encoding='utf-8')

          bootstrap = Path('minecraft_mod_ai/runtime_bootstrap.py')
          replace_once(bootstrap, '    from .parallel_runtime_contract import install as install_parallel_runtime\n', '')
          block = '''    install_parallel_runtime(\n        model_registry_module=model_registry,\n        llama_server_autotune_module=llama_server_autotune,\n    )\n'''
          replace_once(bootstrap, block, '')
          PY
      - name: Validate explicit parallel ownership
        run: |
          python -m compileall -q minecraft_mod_ai/parallel_runtime_contract.py minecraft_mod_ai/llama_server_autotune.py minecraft_mod_ai/model_registry.py minecraft_mod_ai/central_research.py minecraft_mod_ai/ecosystem_discovery.py minecraft_mod_ai/runtime_bootstrap.py
          python .github/scripts/audit_runtime_mutations.py --output runtime_mutation_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('runtime_mutation_audit.json').read_text())
          offenders = [item for item in data['behavioral'] if item['path'] == 'minecraft_mod_ai/parallel_runtime_contract.py']
          if offenders:
              raise SystemExit(f'parallel runtime still rebinds external owners: {offenders}')
          PY
          git diff --check
      - name: Commit cleanup and self-remove
        run: |
          rm .github/workflows/native-parallel-runtime-once.yml
          git add -A
          git diff --cached --check
          git commit -m "refactor(runtime): make parallel paths explicit"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
