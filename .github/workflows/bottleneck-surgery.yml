name: Bottleneck Surgery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bottleneck-surgery.yml'

permissions:
  contents: write

jobs:
  surgery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Remove hot-path bottlenecks
        run: |
          cat > /tmp/patch_bottlenecks.py <<'PY'
          from pathlib import Path
          import re

          # 1) Extended-content steady-state directory catalogs must not rescan every
          # record on every module generation. Full iteration remains only for legacy
          # migration; canonical directory mode uses root count + direct selected paths.
          path = Path('minecraft_mod_ai/extended_content_generator.py')
          text = path.read_text(encoding='utf-8')
          marker = '_CATALOG_SHARD_SCHEMA = "mmm/extended-module-shard-v1"\n'
          helper = '''_CATALOG_SHARD_SCHEMA = "mmm/extended-module-shard-v1"\n_DIRECTORY_RECORD_DIR = ".minecraft_ai/extended-module-records"\n\n\ndef _module_record(module: ProductionModule) -> dict[str, Any]:\n    return {\n        "module_id": module.module_id,\n        "kind": module.kind,\n        "config": module.config,\n        "depends_on": list(module.depends_on),\n        "required_gates": list(module.required_gates),\n    }\n\n\ndef _directory_catalog_count(project_root: str | Path) -> int | None:\n    """Return the canonical directory count without walking record files.\n\n    Directory records are independently materialized and the root count is updated\n    under the project commit lock. Full record validation belongs to validation, not\n    every generation hot path. Non-canonical/legacy catalogs return None so the\n    migration path can perform one complete read.\n    """\n    root = Path(project_root).expanduser().resolve()\n    catalog = root / ".minecraft_ai/extended-modules.json"\n    if not catalog.is_file() or catalog.is_symlink():\n        return None\n    try:\n        raw = json.loads(catalog.read_text(encoding="utf-8"))\n    except (json.JSONDecodeError, OSError):\n        return None\n    if not isinstance(raw, dict) or raw.get("schema_version") != _DIRECTORY_CATALOG_SCHEMA:\n        return None\n    if raw.get("directory") != _DIRECTORY_RECORD_DIR:\n        return None\n    count = raw.get("module_count")\n    if type(count) is not int or count < 0:\n        raise ExtendedContentError("Extended module directory catalog count is invalid.")\n    directory = root / _DIRECTORY_RECORD_DIR\n    if count and (not directory.is_dir() or directory.is_symlink()):\n        raise ExtendedContentError("Extended module directory is missing or unsafe.")\n    return count\n\n\ndef _selected_missing_record_count(\n    project_root: str | Path, records: Iterable[dict[str, Any]]\n) -> int:\n    root = Path(project_root).expanduser().resolve()\n    missing = 0\n    for item in records:\n        target = root / _DIRECTORY_RECORD_DIR / f"{item['module_id']}.json"\n        if target.exists():\n            if not target.is_file() or target.is_symlink():\n                raise ExtendedContentError("Extended module record is unsafe.")\n        else:\n            missing += 1\n    return missing\n'''
          if '_DIRECTORY_RECORD_DIR =' not in text:
              assert marker in text
              text = text.replace(marker, helper, 1)

          pattern = re.compile(
              r'''    with project_write_lock\(info\.root\):\n        existing = \{.*?    files = _extended_directory_catalog_files\(\n        selected_records if already_directory else ordered,\n        module_count=len\(ordered\),\n    \)\n''',
              re.S,
          )
          replacement = '''    selected_records = [_module_record(module) for module in selected]\n    with project_write_lock(info.root):\n        directory_count = _directory_catalog_count(info.root)\n        if directory_count is None:\n            # Legacy/tree catalogs are migrated once. Canonical directory mode never\n            # walks every record during ordinary module generation.\n            existing = {\n                str(item["module_id"]): item\n                for item in iter_extended_module_records(info.root)\n            }\n            for item in selected_records:\n                existing[str(item["module_id"])] = item\n            generation_records = [existing[key] for key in sorted(existing)]\n            initial_count = len(generation_records)\n            already_directory = False\n        else:\n            generation_records = selected_records\n            initial_count = directory_count + _selected_missing_record_count(\n                info.root, selected_records\n            )\n            already_directory = True\n    files = _extended_directory_catalog_files(\n        selected_records if already_directory else generation_records,\n        module_count=initial_count,\n    )\n'''
          text, count = pattern.subn(replacement, text, count=1)
          assert count == 1, f'extended preparation replacement count={count}'

          final_pattern = re.compile(
              r'''    with project_write_lock\(info\.root\):\n        # Refresh the shared catalog after concurrent preparation so module_count\n        # and directory records converge to the exact committed project state\.\n        committed = \{.*?        binding = ensure_main_initializer_call\(\n            info,\n            import_line=f"import \{package_name\}\.extended\.GeneratedExtendedContent",\n            call_line="GeneratedExtendedContent\.register\(\)",\n            marker="extended:content",\n        \)\n''',
              re.S,
          )
          final_replacement = '''    with project_write_lock(info.root):\n        # Re-read only the O(1) root index after concurrent preparation. A full\n        # catalog walk is reserved for legacy migration.\n        current_count = _directory_catalog_count(info.root)\n        if current_count is None:\n            committed = {\n                str(item["module_id"]): item\n                for item in iter_extended_module_records(info.root)\n            }\n            for item in selected_records:\n                committed[str(item["module_id"])] = item\n            committed_count = len(committed)\n            for item in committed.values():\n                files[f"{_DIRECTORY_RECORD_DIR}/{item['module_id']}.json"] = _json_text(item)\n        else:\n            committed_count = current_count + _selected_missing_record_count(\n                info.root, selected_records\n            )\n            for item in selected_records:\n                files[f"{_DIRECTORY_RECORD_DIR}/{item['module_id']}.json"] = _json_text(item)\n        files[".minecraft_ai/extended-modules.json"] = _json_text(\n            {\n                "schema_version": _DIRECTORY_CATALOG_SCHEMA,\n                "module_count": committed_count,\n                "directory": _DIRECTORY_RECORD_DIR,\n            }\n        )\n        _merge_lang(info.root / f"src/main/resources/assets/{mod_id}/lang/en_us.json", lang_en)\n        _merge_lang(info.root / f"src/main/resources/assets/{mod_id}/lang/ko_kr.json", lang_ko)\n        receipt = write_text_files(info, files, replace_existing=True)\n        binding = ensure_main_initializer_call(\n            info,\n            import_line=f"import {package_name}.extended.GeneratedExtendedContent",\n            call_line="GeneratedExtendedContent.register()",\n            marker="extended:content",\n        )\n'''
          text, count = final_pattern.subn(final_replacement, text, count=1)
          assert count == 1, f'extended commit replacement count={count}'
          text = text.replace('"catalog_module_count": len(ordered),', '"catalog_module_count": committed_count,', 1)
          text = text.replace('    directory = ".minecraft_ai/extended-module-records"\n', '    directory = _DIRECTORY_RECORD_DIR\n', 1)
          path.write_text(text, encoding='utf-8')

          # 2) A single artifact has no scheduling parallelism to exploit. Avoid two
          # nested executors and execute/validate inline.
          path = Path('minecraft_mod_ai/artifact_graph_executor.py')
          text = path.read_text(encoding='utf-8')
          needle = '''    if missing_external:\n        raise ArtifactGraphError(f"ARTIFACT_GRAPH_MISSING_PRODUCER: {missing_external}")\n\n    order = {job.job_id: index for index, job in enumerate(ordered_jobs)}\n'''
          replacement = '''    if missing_external:\n        raise ArtifactGraphError(f"ARTIFACT_GRAPH_MISSING_PRODUCER: {missing_external}")\n\n    if len(ordered_jobs) == 1:\n        job = ordered_jobs[0]\n        receipt = _execute_one(\n            job,\n            context=context,\n            router=router,\n            registry=registry,\n            base_dir=base_dir,\n        )\n        _validate_completed_job(\n            job,\n            receipt,\n            context=context,\n            base_dir=base_dir,\n        )\n        return {\n            "status": "PASS",\n            "completed_jobs": [job.job_id],\n            "receipts": [receipt],\n            "ports": {name: port.to_dict() for name, port in registry.all_ports().items()},\n        }\n\n    order = {job.job_id: index for index, job in enumerate(ordered_jobs)}\n'''
          assert text.count(needle) == 1
          text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding='utf-8')

          # 3) Multi-file source transactions currently create a ThreadPoolExecutor per
          # transaction. Share one bounded process pool and preserve per-transaction
          # concurrency with a local semaphore.
          path = Path('minecraft_mod_ai/source_patch.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import tempfile\n', 'import tempfile\nimport threading\n', 1)
          marker = '_WORKSPACE_IMPACTS = frozenset({"unchanged", "rolled_back", "drift", "uncertain"})\n'
          pool_code = '''_WORKSPACE_IMPACTS = frozenset({"unchanged", "rolled_back", "drift", "uncertain"})\n_COMMIT_POOL_LOCK = threading.RLock()\n_COMMIT_POOL: ThreadPoolExecutor | None = None\n\n\ndef _global_commit_worker_count() -> int:\n    raw = os.environ.get("MMM_SOURCE_PATCH_GLOBAL_WORKERS", "").strip()\n    if raw:\n        try:\n            value = int(raw)\n        except ValueError as exc:\n            raise SourcePatchError("MMM_SOURCE_PATCH_GLOBAL_WORKERS must be a positive integer") from exc\n        if value < 1:\n            raise SourcePatchError("MMM_SOURCE_PATCH_GLOBAL_WORKERS must be a positive integer")\n        return min(32, value)\n    return min(16, max(2, (os.cpu_count() or 1) * 2))\n\n\ndef _shared_commit_pool() -> ThreadPoolExecutor:\n    global _COMMIT_POOL\n    with _COMMIT_POOL_LOCK:\n        if _COMMIT_POOL is None:\n            _COMMIT_POOL = ThreadPoolExecutor(\n                max_workers=_global_commit_worker_count(),\n                thread_name_prefix="mmm_source_patch_commit",\n            )\n        return _COMMIT_POOL\n'''
          if '_COMMIT_POOL_LOCK =' not in text:
              assert marker in text
              text = text.replace(marker, pool_code, 1)
          old = '''        else:\n            with ThreadPoolExecutor(\n                max_workers=workers,\n                thread_name_prefix="mmm_source_patch_commit",\n            ) as pool:\n                futures = {\n                    pool.submit(_commit_staged_path, path, after): path\n                    for path, after in ordered_staged\n                }\n                for future in as_completed(futures):\n                    path = futures[future]\n                    try:\n                        future.result()\n                    except BaseException as exc:\n                        errors[path] = exc\n                    else:\n                        committed.add(path)\n'''
          new = '''        else:\n            pool = _shared_commit_pool()\n            permits = threading.BoundedSemaphore(workers)\n\n            def commit_with_permit(path: Path, after: bytes | None) -> None:\n                with permits:\n                    _commit_staged_path(path, after)\n\n            futures = {\n                pool.submit(commit_with_permit, path, after): path\n                for path, after in ordered_staged\n            }\n            for future in as_completed(futures):\n                path = futures[future]\n                try:\n                    future.result()\n                except BaseException as exc:\n                    errors[path] = exc\n                else:\n                    committed.add(path)\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # Regression tests for the new fast paths.
          test = Path('tests/test_bottleneck_fast_paths.py')
          test.write_text('''from __future__ import annotations\n\nimport json\n\nfrom minecraft_mod_ai.artifact_job import ArtifactJob\nfrom minecraft_mod_ai.artifact_ports import PortRegistry\n\n\ndef test_extended_directory_count_is_constant_time_over_records(tmp_path):\n    from minecraft_mod_ai.extended_content_generator import _directory_catalog_count\n\n    records = tmp_path / ".minecraft_ai/extended-module-records"\n    records.mkdir(parents=True)\n    # Deliberately malformed record contents prove the hot-path helper does not parse\n    # unrelated records; full integrity is checked by the validation path.\n    for index in range(128):\n        (records / f"m{index}.json").write_text("{broken", encoding="utf-8")\n    (tmp_path / ".minecraft_ai/extended-modules.json").write_text(\n        json.dumps({\n            "schema_version": "mmm/extended-module-directory-v1",\n            "module_count": 128,\n            "directory": ".minecraft_ai/extended-module-records",\n        }),\n        encoding="utf-8",\n    )\n    assert _directory_catalog_count(tmp_path) == 128\n\n\ndef test_single_artifact_graph_avoids_executor_creation(monkeypatch):\n    import minecraft_mod_ai.artifact_graph_executor as executor\n\n    job = ArtifactJob(job_id="one", template_id="test/one", owner_module="m")\n    monkeypatch.setattr(\n        executor,\n        "_execute_one",\n        lambda job, **_kwargs: {"status": "PASS", "job_id": job.job_id},\n    )\n\n    class ForbiddenExecutor:\n        def __init__(self, *args, **kwargs):\n            raise AssertionError("single artifact graph created a thread pool")\n\n    monkeypatch.setattr(executor, "ThreadPoolExecutor", ForbiddenExecutor)\n    result = executor.execute_artifact_graph([job], port_registry=PortRegistry())\n    assert result["completed_jobs"] == ["one"]\n\n\ndef test_source_patch_uses_one_process_commit_pool(tmp_path, monkeypatch):\n    import minecraft_mod_ai.source_patch as source_patch\n\n    monkeypatch.setenv("MMM_SOURCE_PATCH_WORKERS", "2")\n    source_patch._COMMIT_POOL = None\n    created = 0\n    real = source_patch.ThreadPoolExecutor\n\n    class CountingExecutor(real):\n        def __init__(self, *args, **kwargs):\n            nonlocal created\n            created += 1\n            super().__init__(*args, **kwargs)\n\n    monkeypatch.setattr(source_patch, "ThreadPoolExecutor", CountingExecutor)\n    for batch in range(2):\n        files = [tmp_path / f"{batch}-{i}.txt" for i in range(2)]\n        operations = []\n        for target in files:\n            target.write_text("old", encoding="utf-8")\n            operations.append({\n                "operation": "replace",\n                "path": target.name,\n                "expected_sha256": source_patch.sha256_bytes(b"old"),\n                "content": "new",\n            })\n        source_patch.TransactionalSourcePatcher(tmp_path).apply(operations)\n    assert created == 1\n''', encoding='utf-8')
          PY
          python /tmp/patch_bottlenecks.py
      - name: Validate focused bottleneck contracts
        run: |
          python -m compileall -q minecraft_mod_ai tests/test_bottleneck_fast_paths.py
          python -m ruff check minecraft_mod_ai/extended_content_generator.py minecraft_mod_ai/artifact_graph_executor.py minecraft_mod_ai/source_patch.py tests/test_bottleneck_fast_paths.py --select F,E7,E9
          python -m pytest -q \
            tests/test_bottleneck_fast_paths.py \
            tests/test_source_patch_path_concurrency.py \
            tests/test_artifact_graph_executor.py \
            tests/test_artifact_graph_event_driven.py \
            tests/test_artifact_validation_overlap.py \
            tests/test_extended_content_generation_lock.py
      - name: Commit validated bottleneck fixes and remove surgery workflow
        run: |
          rm .github/workflows/bottleneck-surgery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/extended_content_generator.py minecraft_mod_ai/artifact_graph_executor.py minecraft_mod_ai/source_patch.py tests/test_bottleneck_fast_paths.py .github/workflows/bottleneck-surgery.yml
          git commit -m 'Remove remaining hot-path generation bottlenecks'
          git pull --rebase origin main
          git push origin HEAD:main
