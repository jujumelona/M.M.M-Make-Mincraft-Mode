name: RAG Completeness Fixes

on:
  push:
    paths:
      - .github/workflows/patch-rag-completeness.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply RAG completeness patch
        run: python tools/one_shot_rag_completeness.py
      - name: Verify focused RAG contracts
        run: |
          python -m pip install --prefer-binary -e '.[dev]'
          python -m ruff check --fix --ignore TRY004 minecraft_mod_ai/pre_design_grounded_rag.py minecraft_mod_ai/research_grounded_rag_contract.py minecraft_mod_ai/rag_index.py tests/test_predesign_code_rag_adaptive.py tests/test_rag_index.py
          python -m py_compile minecraft_mod_ai/pre_design_grounded_rag.py minecraft_mod_ai/research_grounded_rag_contract.py minecraft_mod_ai/rag_index.py
          python -m ruff check --ignore TRY004 minecraft_mod_ai/pre_design_grounded_rag.py minecraft_mod_ai/research_grounded_rag_contract.py minecraft_mod_ai/rag_index.py tests/test_predesign_code_rag_adaptive.py tests/test_rag_index.py
          python -m pytest -q tests/test_predesign_code_rag_adaptive.py tests/test_rag_index.py tests/test_pre_design_external_source_acquisition.py tests/test_predesign_source_discovery_contract.py
      - name: Commit production and tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add minecraft_mod_ai/pre_design_grounded_rag.py minecraft_mod_ai/research_grounded_rag_contract.py minecraft_mod_ai/rag_index.py tests/test_predesign_code_rag_adaptive.py tests/test_rag_index.py
          git diff --cached --check
          git commit -m 'fix: make RAG retrieval coverage-driven'
          git push origin HEAD:main
