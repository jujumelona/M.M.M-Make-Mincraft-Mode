name: Pytest diagnostics

on:
  push:
    branches: [main]
    paths-ignore:
      - "audit/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pytest-diagnostics-main
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run concise pytest diagnostics
        shell: bash
        run: |
          set +e
          python -m pytest -q --tb=short --disable-warnings > audit/PYTEST_DIAGNOSTICS.log 2>&1
          code=$?
          echo "$code" > audit/PYTEST_EXIT_CODE.txt
          cat audit/PYTEST_DIAGNOSTICS.log
          exit 0

      - name: Commit diagnostic evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/PYTEST_DIAGNOSTICS.log audit/PYTEST_EXIT_CODE.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record pytest diagnostics [skip ci]"
            git push origin HEAD:main
          fi
