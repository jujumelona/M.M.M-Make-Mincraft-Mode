name: Temporary Scheduler Diagnostic

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-scheduler-diagnostic.yml']

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -q -e '.[dev]'
      - name: Trace claims
        run: |
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path
          import minecraft_mod_ai.complete_orchestrator as orchestrator_module
          import minecraft_mod_ai.work_graph as work_graph_module
          import minecraft_mod_ai.scheduler_parallel_safety_contract as scheduler
          from minecraft_mod_ai.work_graph import DurableWorkLedger, WorkGraphPlan, WorkNode, WorkState

          def node(node_id, stage):
              return WorkNode(node_id=node_id, stage=stage, input_hash=f'sha256:{node_id}', dependencies=(), payload={'kind':'test','resource_class':'cpu_io'}, resource_class='cpu_io')

          scheduler.install(work_graph_module=work_graph_module, orchestrator_module=orchestrator_module)
          root = Path(tempfile.mkdtemp())
          plan = WorkGraphPlan(schema_version='mmm/production-work-graph-v1', proposal_hash='sha256:diag', graph_hash='sha256:diag-graph', module_count=0, nodes=(node('a-content','generate:content'),node('b-content','generate:content'),node('c-system','generate:system')))
          ledger = DurableWorkLedger(root/'diag.sqlite', proposal_hash=plan.proposal_hash)
          ledger.sync_plan(plan)
          stages=('generate:content','generate:system')
          first=ledger.claim_ready('mmm-orchestrator', stages=stages, lease_seconds=60)
          print('FIRST', json.dumps(first, sort_keys=True))
          print('TASKS_AFTER_FIRST', json.dumps(ledger.tasks(limit=20), sort_keys=True))
          con=ledger._connect()
          resource=scheduler._resource_sql('')
          print('RUNNING_RAW', con.execute("SELECT node_id,stage,state,json_extract(payload_json,'$.resource_class'),lease_owner,lease_until FROM tasks WHERE state=? ORDER BY node_id", (WorkState.RUNNING.value,)).fetchall())
          ph=','.join('?' for _ in scheduler._SERIAL_CPU_STAGES)
          print('ACTIVE_SERIAL', con.execute(f"SELECT DISTINCT stage FROM tasks WHERE state=? AND stage IN ({ph}) AND {resource}='cpu_io' ORDER BY stage", (WorkState.RUNNING.value,*scheduler._SERIAL_CPU_STAGES)).fetchall())
          second=ledger.claim_ready('mmm-orchestrator', stages=stages, lease_seconds=60)
          print('SECOND', json.dumps(second, sort_keys=True))
          print('TASKS_AFTER_SECOND', json.dumps(ledger.tasks(limit=20), sort_keys=True))
          PY