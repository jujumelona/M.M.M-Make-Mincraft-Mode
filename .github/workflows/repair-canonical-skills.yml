name: Repair canonical skills

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Restore canonical registry
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('minecraft_mod_ai/skill_catalog.py')
          text = path.read_text(encoding='utf-8')
          old = """CANONICAL_SKILLS = (\n    'compile-massive-work-graph',\n    'converge-game-quality',\n    'execute-complete-production',\n    'gather-adaptive-minecraft-evidence',\n    'resume-production-run',\n    'route-generic-game-research',\n    'select-compatible-ai-technique',\n)\nPOLICY_NATIVE_SKILLS = frozenset(CANONICAL_SKILLS)\n"""
          new = """CANONICAL_SKILLS = ('intake-mod-brief', 'research-minecraft-evidence', 'plan-game-design', 'freeze-approved-spec', 'inspect-existing-project', 'generate-fabric-core', 'generate-datagen', 'generate-worldgen', 'generate-geckolib-entity', 'generate-quest-progression', 'generate-gui-networking', 'generate-textures', 'model-with-blockbench', 'compile-and-repair', 'runtime-playtest', 'visual-review', 'release-security', 'execute-complete-production', 'patch-existing-project', 'publish-release', 'compile-massive-work-graph', 'gather-adaptive-minecraft-evidence', 'ground-production-with-live-evidence', 'resume-production-run', 'route-generic-game-research', 'select-compatible-ai-technique', 'converge-game-quality')\nPOLICY_NATIVE_SKILLS = frozenset({'compile-massive-work-graph', 'gather-adaptive-minecraft-evidence', 'resume-production-run', 'route-generic-game-research', 'select-compatible-ai-technique', 'execute-complete-production', 'converge-game-quality'})\n"""
          if old not in text:
              raise SystemExit('canonical Skill block did not match expected current source')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install package
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Rebuild packaged skills
        run: python tools/package_skills.py
      - name: Validate skills
        run: |
          python -m ruff check minecraft_mod_ai/skill_catalog.py minecraft_mod_ai/packaged_skill_runtime.py tools/package_skills.py --select F,E7,E9
          python -m pytest -q tests -k 'skill_catalog or packaged_skill'
      - name: Commit repair and remove one-shot workflow
        run: |
          git rm .github/workflows/repair-canonical-skills.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills minecraft_mod_ai/skill_catalog.py minecraft_mod_ai/packaged_skills.json plugins/mmm-minecraft-mod-ai/skills
          git commit -m 'Restore full canonical Skill catalog'
          git push origin HEAD:main
