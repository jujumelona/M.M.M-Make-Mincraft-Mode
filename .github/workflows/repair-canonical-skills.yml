name: Repair canonical skills

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Rebuild strict Skill sources from compiled contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          names = (
              'intake-mod-brief', 'research-minecraft-evidence', 'plan-game-design',
              'freeze-approved-spec', 'inspect-existing-project', 'generate-fabric-core',
              'generate-datagen', 'generate-worldgen', 'generate-geckolib-entity',
              'generate-quest-progression', 'generate-gui-networking', 'generate-textures',
              'model-with-blockbench', 'compile-and-repair', 'runtime-playtest',
              'visual-review', 'release-security', 'execute-complete-production',
              'patch-existing-project', 'publish-release', 'compile-massive-work-graph',
              'gather-adaptive-minecraft-evidence', 'ground-production-with-live-evidence',
              'resume-production-run', 'route-generic-game-research',
              'select-compatible-ai-technique', 'converge-game-quality',
          )

          catalog = Path('minecraft_mod_ai/skill_catalog.py')
          text = catalog.read_text(encoding='utf-8')
          old = """CANONICAL_SKILLS = (\n    'compile-massive-work-graph',\n    'converge-game-quality',\n    'execute-complete-production',\n    'gather-adaptive-minecraft-evidence',\n    'resume-production-run',\n    'route-generic-game-research',\n    'select-compatible-ai-technique',\n)\nPOLICY_NATIVE_SKILLS = frozenset(CANONICAL_SKILLS)\n"""
          new = "CANONICAL_SKILLS = " + repr(names) + "\nPOLICY_NATIVE_SKILLS = frozenset({'compile-massive-work-graph', 'gather-adaptive-minecraft-evidence', 'resume-production-run', 'route-generic-game-research', 'select-compatible-ai-technique', 'execute-complete-production', 'converge-game-quality'})\n"
          if old not in text:
              raise SystemExit('canonical Skill block did not match expected source')
          catalog.write_text(text.replace(old, new, 1), encoding='utf-8')

          snapshot = json.loads(Path('minecraft_mod_ai/packaged_skills.json').read_text(encoding='utf-8'))
          contracts = snapshot.get('contracts')
          if not isinstance(contracts, dict):
              raise SystemExit('packaged contract snapshot missing')
          missing = [name for name in names if name not in contracts]
          if missing:
              raise SystemExit(f'packaged contract snapshot missing canonical Skills: {missing}')

          def extract_inputs(raw: str, name: str) -> list[str]:
              lines = raw.splitlines()
              start = next((i for i, line in enumerate(lines) if line == 'inputs:'), None)
              if start is None:
                  raise SystemExit(f'{name}: inputs section missing')
              items: list[str] = []
              for line in lines[start + 1:]:
                  if line and not line[0].isspace() and not line.startswith('```'):
                      break
                  stripped = line.strip()
                  if not stripped or stripped == '```':
                      continue
                  if stripped.startswith('- '):
                      items.append(stripped[2:].strip())
                  elif items:
                      items[-1] += ' ' + stripped
              if not items or any(not item for item in items):
                  raise SystemExit(f'{name}: inputs section is empty')
              return items

          for name in names:
              path = Path('skills') / name / 'SKILL.md'
              raw = path.read_text(encoding='utf-8')
              contract = contracts[name]
              if not isinstance(contract, dict):
                  raise SystemExit(f'{name}: invalid compiled contract')
              inputs = extract_inputs(raw, name)
              retry = contract.get('retry')
              approvals = contract.get('approvals')
              exit_contract = contract.get('exit')
              tools = contract.get('allowed_tools')
              if not isinstance(retry, dict) or not isinstance(approvals, dict) or not isinstance(exit_contract, dict) or not isinstance(tools, list):
                  raise SystemExit(f'{name}: incomplete compiled contract')
              policy = {
                  'activate_when': contract['activate_when'],
                  'stages': contract['stages'],
                  'inputs': inputs,
                  'required_rag': contract['required_rag'],
                  'allowed_tools': tools,
                  'validators': contract['validators'],
                  'retry_policy': {
                      'max_attempts': retry.get('max_attempts'),
                      'strategy': retry.get('strategy'),
                      'stop_on_repeated_error_signature': bool(retry.get('stop_on_repeated_error_signature', True)),
                      'require_fresh_evidence': bool(retry.get('require_fresh_evidence', False)),
                  },
                  'approval_required': {
                      'writes': bool(approvals.get('writes', False)),
                      'runtime': bool(approvals.get('runtime', False)),
                      'release': bool(name == 'publish-release' or 'package_release' in tools),
                  },
                  'forbidden_actions': contract['forbidden_actions'],
                  'exit_conditions': {
                      'success': exit_contract['success'],
                      'blocked': exit_contract['blocked'],
                      'failed': exit_contract['failed'],
                  },
              }
              front = yaml.safe_dump(
                  {'name': name, 'description': str(contract['description']).strip()},
                  allow_unicode=True,
                  sort_keys=False,
                  width=120,
              ).strip()
              body = yaml.safe_dump(policy, allow_unicode=True, sort_keys=False, width=120).strip()
              path.write_text(f'---\n{front}\n---\n\n```yaml\n{body}\n```\n', encoding='utf-8')
          PY
      - name: Rebuild packaged skills
        run: python tools/package_skills.py
      - name: Validate skills
        run: |
          python -m ruff check minecraft_mod_ai/skill_catalog.py minecraft_mod_ai/packaged_skill_runtime.py tools/package_skills.py --select F,E7,E9
          python - <<'PY'
          from minecraft_mod_ai.skill_catalog import CANONICAL_SKILLS, compile_skill_catalog
          contracts = compile_skill_catalog('skills')
          assert len(CANONICAL_SKILLS) == 27
          assert set(contracts) == set(CANONICAL_SKILLS)
          print('canonical skill contracts:', len(contracts))
          PY
          python -m pytest -q tests -k 'skill_catalog or packaged_skill'
      - name: Commit repair and remove one-shot workflows
        run: |
          git rm .github/workflows/repair-canonical-skills.yml
          git rm -f .github/workflows/sync-generated-skill-catalog.yml || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills minecraft_mod_ai/skill_catalog.py minecraft_mod_ai/packaged_skills.json plugins/mmm-minecraft-mod-ai/skills .github/workflows
          git commit -m 'Restore full canonical Skill catalog'
          git push origin HEAD:main
