name: Acceptance hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/acceptance-hotfix.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: |
          python .github/acceptance_hotfix.py
          python -m compileall -q minecraft_mod_ai
          python -m pip install -q -e . pytest
          python -m pytest -q tests/test_acceptance_hotfix_regression.py tests/test_public_acceptance_runtime_boundary.py
      - run: |
          rm -f .github/acceptance_hotfix.py
          rm -f .github/workflows/one-shot-public-acceptance-hotfix*.yml
          rm -f .github/workflows/acceptance-hotfix.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "fix: sanitize public acceptance before production compile"
          git push origin main
