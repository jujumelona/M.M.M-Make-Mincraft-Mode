name: MMM repair manifest regression

on:
  push:
    paths:
      - '.github/workflows/mmm-validation-repair-apply-temp.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Add behavioral regression
        run: python .github/scripts/mmm_fix_build_ledger_order_temp.py
      - name: Compile
        run: python -m compileall -q minecraft_mod_ai tests/test_validation_repair_regressions.py tests/test_project_manifest_hash_efficiency_contract.py
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run focused regressions
        run: python -m pytest -q tests/test_validation_repair_regressions.py tests/test_project_manifest_hash_efficiency_contract.py
      - name: Commit regression and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/mmm-validation-repair-apply-temp.yml
          rm -f .github/scripts/mmm_fix_build_ledger_order_temp.py
          git add tests/test_validation_repair_regressions.py .github/workflows .github/scripts
          git diff --cached --check
          git commit -m 'test: cover repaired source manifest reconciliation'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Concurrent main change conflicted with tested regression; refusing force push.' >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo 'Unable to push tested regression after safe retries.' >&2
          exit 1
