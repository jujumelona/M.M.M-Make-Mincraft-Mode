name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: exhaustive-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-audit:
    name: Debug repo audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --prefer-binary 'build>=1,<2' -e '.[dev,ui]'
      - run: python .github/scripts/debug_repo_audit.py

  architecture-quality:
    name: Architecture quality regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --prefer-binary 'build>=1,<2' -e '.[dev,ui]'
      - run: python .github/scripts/audit_code_quality_regression.py --output audit/code-quality-regression.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: architecture-quality-${{ github.sha }}
          path: audit/code-quality-regression.json
          if-no-files-found: warn

  compile:
    name: Python compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m compileall -q minecraft_mod_ai tests tools download_resources.py

  ruff:
    name: Ruff critical errors
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --prefer-binary ruff
      - run: python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9

  dead-code:
    name: Dead code audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --prefer-binary vulture
      - run: vulture minecraft_mod_ai tools download_resources.py --min-confidence 100

  import-smoke:
    name: Package import smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --prefer-binary -e .
      - run: python -c "import minecraft_mod_ai"

  runtime-concurrency:
    name: Runtime concurrency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python .github/scripts/audit_runtime_concurrency.py

  runtime-efficiency:
    name: Runtime efficiency regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: |
          set -euo pipefail
          mkdir -p audit
          python .github/scripts/audit_runtime_efficiency.py --output audit/runtime-efficiency.json
          BASE_DIR="$(mktemp -d)"
          trap 'rm -rf "$BASE_DIR"' EXIT
          AUDIT_PATHS=(.github/scripts/audit_runtime_efficiency.py minecraft_mod_ai tools)
          if git cat-file -e HEAD^:download_resources.py 2>/dev/null; then AUDIT_PATHS+=(download_resources.py); fi
          git archive --format=tar HEAD^ -- "${AUDIT_PATHS[@]}" | tar -xf - -C "$BASE_DIR"
          (cd "$BASE_DIR" && python .github/scripts/audit_runtime_efficiency.py --output /tmp/runtime-efficiency-baseline.json)
          python .github/scripts/gate_runtime_efficiency.py --baseline /tmp/runtime-efficiency-baseline.json --current audit/runtime-efficiency.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-efficiency-${{ github.sha }}
          path: audit/runtime-efficiency.json
          if-no-files-found: warn

  runtime-mutations:
    name: Runtime mutation regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: |
          set -euo pipefail
          mkdir -p audit
          BASE_DIR="$(mktemp -d)"
          trap 'rm -rf "$BASE_DIR"' EXIT
          AUDIT_PATHS=(.github/scripts/audit_runtime_mutations.py minecraft_mod_ai tools)
          if git cat-file -e HEAD^:download_resources.py 2>/dev/null; then AUDIT_PATHS+=(download_resources.py); fi
          git archive --format=tar HEAD^ -- "${AUDIT_PATHS[@]}" | tar -xf - -C "$BASE_DIR"
          python .github/scripts/audit_runtime_mutations.py --baseline-root "$BASE_DIR" --fail-on-new --output audit/runtime-mutations.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-mutations-${{ github.sha }}
          path: audit/runtime-mutations.json
          if-no-files-found: warn

  mineflayer-syntax:
    name: Mineflayer bridge syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - run: node --check minecraft_mod_ai/integrations/mineflayer/bridge.mjs

  colab-validation:
    name: Colab validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --prefer-binary -e '.[dev,ui]'
      - run: python tools/validate_colab_notebook.py

  skill-packaging:
    name: Skill packaging determinism
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --prefer-binary -e .
      - run: |
          python tools/package_skills.py
          git diff --exit-code -- minecraft_mod_ai/packaged_skills.json plugins/mmm-minecraft-mod-ai/skills

  removed-surface:
    name: Removed surface invariant
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - run: test ! -e minecraft_mod_ai/agentic_pre_design_rag.py

  audit-families:
    name: Full audit family / ${{ matrix.family }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        family: [syntax, versions, subsystems, model_registry, runtime_contracts, environment, filesystem, structured_output, timeout_retry, concurrency_queue, pipeline, smtp]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --prefer-binary 'build>=1,<2' -e '.[dev,ui]'
      - run: python -m tools.full_project_audit_family "${{ matrix.family }}" --output "audit/family-${{ matrix.family }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-family-${{ matrix.family }}-${{ github.sha }}
          path: |
            audit/family-${{ matrix.family }}.json
            audit/FULL_PROJECT_AUDIT.log
          if-no-files-found: warn

  dependency-check:
    name: Dependency consistency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --prefer-binary -e '.[dev,ui]'
      - run: python -m pip check

  package-build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --prefer-binary 'build>=1,<2'
      - run: python -m build --sdist --wheel --outdir audit/dist
      - uses: actions/upload-artifact@v4
        with:
          name: package-build-${{ github.sha }}
          path: audit/dist/
          if-no-files-found: error

  wheel-clean-import:
    name: Wheel clean environment import
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --prefer-binary 'build>=1,<2' -e '.[dev,ui]'
      - run: |
          mkdir -p audit/dist
          python -m build --wheel --outdir audit/dist
          python - <<'PY'
          from tools import full_project_audit as audit
          audit.AUDIT_DIR.mkdir(parents=True, exist_ok=True)
          audit.LOG_PATH.write_text('', encoding='utf-8')
          audit.CHECKS.clear()
          audit.audit_wheel_import()
          failed = [check.name for check in audit.CHECKS if check.status == audit.FAIL]
          if failed:
              raise SystemExit('wheel import failures: ' + ', '.join(failed))
          PY

  root-cause-wrapper-contract:
    name: Root-cause wrapper contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - run: python -m pip install --prefer-binary -e '.[dev,ui]'
      - run: python -m pytest -q tests/test_root_cause_audit_wrapper.py

  minecraft-integrity:
    name: Real Fabric integrity
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - run: python -m pip install --prefer-binary 'build>=1,<2' -e '.[dev,ui]'
      - run: python tools/verify_integrity_minecraft.py --output .mmm/integrity-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minecraft-integrity-${{ github.sha }}
          path: .mmm/integrity-validation
          if-no-files-found: warn

  test-plan:
    name: Build balanced test matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          MATRIX="$(python -m tools.ci_test_matrix --max-jobs 32)"
          test "$MATRIX" != '{"include":[]}'
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          import subprocess
          payload = json.loads(subprocess.check_output(['python', '-m', 'tools.ci_test_matrix', '--max-jobs', '32'], text=True))
          jobs = payload['include']
          files = [item for job in jobs for item in job['files']]
          assert files
          assert len(files) == len(set(files))
          print(f"test_files={len(files)} matrix_jobs={len(jobs)}")
          PY

  tests:
    name: Python 3.11 test group ${{ matrix.id }}
    needs: test-plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11', cache: pip}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - run: python -m pip install --prefer-binary -e '.[dev,ui]'
      - name: Materialize test group
        shell: bash
        env:
          TEST_FILES_JSON: ${{ toJSON(matrix.files) }}
        run: |
          python - <<'PY' > /tmp/tests.txt
          import json
          import os
          for path in json.loads(os.environ['TEST_FILES_JSON']):
              print(path)
          PY
          test -s /tmp/tests.txt
          cat /tmp/tests.txt
      - name: Run test group
        shell: bash
        env:
          GROUP: ${{ matrix.id }}
        run: |
          mapfile -t TEST_FILES < /tmp/tests.txt
          python tools/pytest_diagnostics.py --log "audit/tests-${GROUP}.log" --junit "audit/tests-${GROUP}.xml" --durations 50 --maxfail 100 "${TEST_FILES[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-group-${{ matrix.id }}-${{ github.sha }}
          path: |
            audit/tests-${{ matrix.id }}.log
            audit/tests-${{ matrix.id }}.xml
          if-no-files-found: warn

  python313:
    name: Python 3.13 / ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test:
          - tests/test_planning_state_contract.py
          - tests/test_planning_mod_discovery.py
          - tests/test_planning_ssot_invariants.py
          - tests/test_planning_research_relevance_guards.py
          - tests/test_research_evidence_handoff_contract.py
          - tests/test_public_acceptance_runtime_boundary.py
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - run: python -m pip install --prefer-binary -e . pytest
      - run: python -m pytest -q "${{ matrix.test }}"

  model-realistic-replay:
    name: Model-realistic replay
    uses: ./.github/workflows/model-realistic-replay.yml

  audit:
    name: Aggregate granular audit gate
    if: ${{ always() }}
    timeout-minutes: 5
    needs: [debug-audit, architecture-quality, compile, ruff, dead-code, import-smoke, runtime-concurrency, runtime-efficiency, runtime-mutations, mineflayer-syntax, colab-validation, skill-packaging, removed-surface, audit-families, dependency-check, package-build, wheel-clean-import, root-cause-wrapper-contract, minecraft-integrity, test-plan]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            test "$result" = success
          done

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    timeout-minutes: 5
    needs: [audit, tests, python313, model-realistic-replay]
    runs-on: ubuntu-latest
    steps:
      - env:
          AUDIT: ${{ needs.audit.result }}
          TESTS: ${{ needs.tests.result }}
          PY313: ${{ needs.python313.result }}
          MODEL_REPLAY: ${{ needs.model-realistic-replay.result }}
        run: |
          test "$AUDIT" = success
          test "$TESTS" = success
          test "$PY313" = success
          test "$MODEL_REPLAY" = success