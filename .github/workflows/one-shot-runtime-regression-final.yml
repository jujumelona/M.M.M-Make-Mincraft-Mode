name: One Shot Runtime Regression Final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-runtime-regression-final.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -q -e '.[dev]'

      - name: Apply current runtime repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              if old not in text:
                  raise SystemExit(f'missing repair anchor in {path}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          # Apply only the already-tested runtime portion of the earlier repair.  Do not
          # replay its stale test rewrites: current main owns the test contract now.
          historical = subprocess.check_output(
              ['git', 'show', '2665596c1fd5f0afa73cee4f3fea060211e02c02:.github/workflows/one-shot-current-head-regression-repair.yml'],
              text=True,
          )
          lines = historical.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python - <<'PY'")
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          script = textwrap.dedent('\n'.join(lines[start + 1:end]))
          marker = '# --- Tests: update only stale contracts; do not restore retired runtime behavior. ---'
          if marker not in script:
              raise SystemExit('historical runtime/test boundary missing')
          runtime_script = script.split(marker, 1)[0]
          exec(compile(runtime_script, '<runtime-repair>', 'exec'), {'__name__': '__main__'})

          # Enforce serial CPU stage admission independently of JSON resource-expression
          # classification.  This is a second fail-closed guard around the SQL predicate.
          path = 'minecraft_mod_ai/scheduler_parallel_safety_contract.py'
          text = read(path)
          old = '''        serial_stage_placeholders = ",".join("?" for _ in _SERIAL_CPU_STAGES)
          ordered_lanes = tuple(
          '''
          new = '''        serial_stage_placeholders = ",".join("?" for _ in _SERIAL_CPU_STAGES)
          active_serial_stages = {
              str(row[0])
              for row in connection.execute(
                  f"SELECT DISTINCT stage FROM tasks WHERE state = ? AND stage IN ({serial_stage_placeholders})",
                  (WorkState.RUNNING.value, *_SERIAL_CPU_STAGES),
              ).fetchall()
          }
          ordered_lanes = tuple(
          '''
          if old not in text:
              raise SystemExit('scheduler serial-stage anchor missing')
          text = text.replace(old, new, 1)
          old = '''        ).fetchall()
          if not rows:
              return None

          node_id, _resource = min(
          '''
          new = '''        ).fetchall()
          if active_serial_stages and rows:
              node_ids = tuple(str(node) for node, _resource in rows)
              placeholders = ",".join("?" for _ in node_ids)
              stage_by_node = {
                  str(node): str(stage)
                  for node, stage in connection.execute(
                      f"SELECT node_id, stage FROM tasks WHERE node_id IN ({placeholders})",
                      node_ids,
                  ).fetchall()
              }
              rows = [
                  (node, resource)
                  for node, resource in rows
                  if not (
                      str(resource) == "cpu_io"
                      and stage_by_node.get(str(node)) in active_serial_stages
                  )
              ]
          if not rows:
              return None

          node_id, _resource = min(
          '''
          if old not in text:
              raise SystemExit('scheduler candidate-filter anchor missing')
          write(path, text.replace(old, new, 1))

          # A timeout must not consume its own bounded deadline again in fsync barriers.
          # Keep the trace and stderr record, but permit timeout paths to skip durability
          # barriers while normal failures remain sync-on-failure by default.
          path = 'minecraft_mod_ai/root_cause_trace.py'
          text = read(path)
          old = '''    details: Mapping[str, Any] | None = None,
              exc: BaseException | None = None,
          ) -> None:
          '''
          new = '''    details: Mapping[str, Any] | None = None,
              exc: BaseException | None = None,
              durable_failure_sync: bool = True,
          ) -> None:
          '''
          if old not in text:
              raise SystemExit('root trace signature anchor missing')
          text = text.replace(old, new, 1)
          old = '''    failure = _is_failure(result, exc)
              try:
          '''
          new = '''    failure = _is_failure(result, exc)
              failure_sync = failure and bool(durable_failure_sync)
              try:
          '''
          if old not in text:
              raise SystemExit('root trace failure anchor missing')
          text = text.replace(old, new, 1)
          if text.count('sync=failure') < 2:
              raise SystemExit('root trace durability anchors missing')
          text = text.replace('sync=failure', 'sync=failure_sync', 2)
          write(path, text)

          for path in (
              'minecraft_mod_ai/planning_state_adaptive_implementation.py',
              'minecraft_mod_ai/planning_state_research.py',
          ):
              text = read(path)
              anchor = '''                    "policy": "retryable_abort_current_stage",
                      },
                  )
                  raise TimeoutError(reason) from exc
          '''
              replacement = '''                    "policy": "retryable_abort_current_stage",
                      },
                      durable_failure_sync=False,
                  )
                  raise TimeoutError(reason) from exc
          '''
              if anchor not in text:
                  raise SystemExit(f'timeout trace anchor missing in {path}')
              write(path, text.replace(anchor, replacement, 1))

          # Current skill is intentionally usable during planning for factual API/version
          # grounding.  It is not a gameplay-novelty proof gate.
          path = 'tests/test_skill_policy.py'
          text = read(path)
          text = text.replace(
              'assert contract.stages == ("research",)',
              'assert contract.stages == ("planning", "research")',
              1,
          )
          text = text.replace(
              'tool_anchor = "- retrieve_source_excerpt\\n"',
              'tool_anchor = "- search_code_rag\\n"',
              1,
          )
          text = text.replace(
              'validator_anchor = "- grounded_generation\\n"',
              'validator_anchor = "- exact_version_evidence\\n"',
              1,
          )
          write(path, text)

          # The install contract requires both collection and reuse hooks; the unit-test
          # double must implement the current interface rather than weakening production.
          replace_once(
              'tests/test_small_model_atomic_coder_execution.py',
              '''    custom = SimpleNamespace(
                  _coder_project_context_budget=lambda *a, **k: 4096,
                  _materialize_owned_reuse_context=lambda *a, **k: {},
              )
          ''',
              '''    custom = SimpleNamespace(
                  _coder_project_context_budget=lambda *a, **k: 4096,
                  _collect_initial_observations=lambda *a, **k: {},
                  _materialize_owned_reuse_context=lambda *a, **k: {},
              )
          ''',
          )

          # mmm-planning is now an enabled first-party reviewed stage server.
          replace_once(
              'tests/test_agent_routing_contract.py',
              '''        "minecraft-runtime",
                  "mineflayer",
                  "mmm-planning",
          ''',
              '''        "minecraft-runtime",
                  "mineflayer",
          ''',
          )

          # Native --fit owns memory fitting; maximum GPU offload remains explicit.
          replace_once(
              'tests/test_llama_server_hardware_policy.py',
              'assert result[result.index("--gpu-layers") + 1] == "auto"',
              'assert result[result.index("--gpu-layers") + 1] == "all"',
          )
          PY
          git diff --check

      - name: Verify all previously failing regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_hidden_bottleneck_efficiency.py \
            tests/test_java_lsp_scaling.py \
            tests/test_llama_server_kernel_autotune.py \
            tests/test_model_router_forced_rag_recovery.py \
            tests/test_mutation_semantic_boundary.py \
            tests/test_planning_candidate_evidence.py \
            tests/test_planning_ssot_invariants.py \
            tests/test_scheduler_claim_install_identity.py \
            tests/test_skill_policy.py \
            tests/test_small_model_atomic_coder_execution.py \
            tests/test_agent_routing_contract.py \
            tests/test_artifact_decomposition_planning.py \
            tests/test_llama_server_native_resource_fit.py \
            tests/test_llama_server_hardware_policy.py \
            tests/test_planning_regressions_20260913.py \
            tests/test_tool_chatter_finite_bounds.py \
            tests/test_unified_host_execution_loop.py \
            tests/test_space_progression_planner_and_verifier_regression.py \
            tests/test_planning_convergence_contract.py \
            tests/test_planning_deadline_hardening.py
          python -m ruff check \
            minecraft_mod_ai/model_adapters/llama_cpp_adapter.py \
            minecraft_mod_ai/llama_server_kernel_autotune.py \
            minecraft_mod_ai/llama_server_hardware_policy.py \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            minecraft_mod_ai/planning_state_resolution.py \
            minecraft_mod_ai/deadline_executor.py \
            minecraft_mod_ai/planning_state_adaptive_implementation.py \
            minecraft_mod_ai/planning_state_research.py \
            minecraft_mod_ai/java_lsp.py \
            minecraft_mod_ai/scheduler_parallel_safety_contract.py \
            minecraft_mod_ai/root_cause_trace.py \
            tests/test_skill_policy.py \
            tests/test_small_model_atomic_coder_execution.py \
            tests/test_agent_routing_contract.py \
            tests/test_llama_server_hardware_policy.py \
            --select F,E7,E9
          python .github/scripts/audit_runtime_efficiency.py --output /tmp/runtime-efficiency-final.json

      - name: Commit and push verified runtime repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jujumelona'
          git config user.email 'qasdaa025@gmail.com'
          git add minecraft_mod_ai tests
          git diff --cached --check
          git commit -m 'fix: reconcile runtime scheduling and planning regressions'
          git fetch origin main
          git rebase origin/main
          python -m pytest -q \
            tests/test_scheduler_claim_install_identity.py \
            tests/test_planning_deadline_hardening.py \
            tests/test_skill_policy.py \
            tests/test_small_model_atomic_coder_execution.py \
            tests/test_agent_routing_contract.py \
            tests/test_llama_server_hardware_policy.py \
            tests/test_space_progression_planner_and_verifier_regression.py \
            tests/test_java_lsp_scaling.py
          python .github/scripts/audit_runtime_efficiency.py --output /tmp/runtime-efficiency-final.json
          git push origin HEAD:main
