name: One-shot structural planner repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/planner-structural-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Patch planner contracts
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import re
          from pathlib import Path

          path = Path('minecraft_mod_ai/evidence_first_planning.py')
          text = path.read_text(encoding='utf-8')

          # Provenance must be explicit. Ambiguous/direct callers preserve authored IDs.
          text = text.replace(
              '    is_design_module: bool = False,\n',
              '    is_design_module: bool | None = None,\n',
              1,
          )
          old = '''    if is_design_module:\n        # Design module IDs are authority — preserve verbatim, no promotion.\n        selected: tuple[str, ...] = (capability,)\n    else:\n        # Prompt provenance is already explicit in is_design_module. Never compare\n        # a raw-text fallback ID to a model-translated intent string.\n        selected = gameplay if gameplay else (capability,)\n'''
          new = '''    if is_design_module is True:\n        # Design module IDs are authority — preserve verbatim, no promotion.\n        selected: tuple[str, ...] = (capability,)\n    elif is_design_module is False:\n        # Prompt provenance is explicit: semantic gameplay roots may replace the\n        # raw fallback identity only on prompt-derived requirements.\n        selected = gameplay if gameplay else (capability,)\n    else:\n        # Backwards-compatible/direct calls have no provenance proof; preserve the\n        # explicit capability rather than guessing from translated model intent.\n        selected = (capability,)\n'''
          if old in text:
              text = text.replace(old, new, 1)

          marker = '\ndef _semantic_requirement_fields(\n'
          if 'def _semantic_ir_variants(' not in text:
              helper = '''\ndef _semantic_ir_variants(\n    ir: SemanticRequirementIR,\n) -> tuple[SemanticRequirementIR, ...]:\n    """Split independent model roots into independently plannable requirements."""\n    if len(ir.gameplay_capability_candidates) <= 1:\n        return (ir,)\n    variants: list[SemanticRequirementIR] = []\n    seen_roots: set[str] = set()\n    for candidate in ir.gameplay_capability_candidates:\n        variant = SemanticRequirementIR(\n            source_start=ir.source_start,\n            source_end=ir.source_end,\n            source_sha256=ir.source_sha256,\n            intent=ir.intent,\n            gameplay_capability_candidates=(candidate,),\n            confidence=ir.confidence,\n            unresolved=ir.unresolved,\n        )\n        gameplay, _implementation, _unresolved = _expand_semantic_ir(variant)\n        root = (gameplay[0] if gameplay else candidate).casefold().strip()\n        if not root or root in seen_roots:\n            continue\n        seen_roots.add(root)\n        variants.append(variant)\n    return tuple(variants) or (ir,)\n\n'''
              if marker not in text:
                  raise SystemExit('semantic requirement marker missing')
              text = text.replace(marker, helper + marker, 1)

          # Existing-catalog prompt supplements are prompt-derived explicitly.
          merge_start = text.index('def _merge_catalog_uncovered_prompt_requirements(')
          chunk_start = text.index('    acceptance_source = _strings(game_design.get("acceptance_tests"))', merge_start)
          chunk_end = text.index('\n    merged = dict(catalog)', chunk_start)
          merge_chunk = '''    acceptance_source = _strings(game_design.get("acceptance_tests"))\n    for index, (capability, statement) in enumerate(\n        additions, start=len(requirements)\n    ):\n        span = _source_span(prompt, statement)\n        matching_acceptance = tuple(\n            item\n            for item in acceptance_source\n            if _word_overlap(item, f"{capability} {statement}")\n        )\n        ir = _invoke_semantic_model(\n            statement, span["char_start"], span["char_end"], prompt, router\n        )\n        _validate_semantic_ir(ir, prompt)\n        variants = _semantic_ir_variants(ir)\n        for variant_index, variant_ir in enumerate(variants):\n            gameplay, _implementation, _unresolved = _expand_semantic_ir(variant_ir)\n            semantic_id = gameplay[0] if gameplay else capability\n            discriminator = {\n                "prompt_sha256": _sha(prompt),\n                "index": index,\n                "span": [span["char_start"], span["char_end"]],\n            }\n            if len(variants) > 1:\n                discriminator["semantic_variant"] = variant_index\n            requirement_id = _stable_id("req", semantic_id, discriminator)\n            semantic = _semantic_requirement_fields(\n                capability,\n                variant_ir,\n                requirement_id,\n                is_design_module=False,\n            )\n            requirements.append(\n                {\n                    "requirement_id": requirement_id,\n                    "capability": semantic["capability"],\n                    "statement": statement,\n                    "mandatory": True,\n                    "source_span": span,\n                    "provides": semantic["provides"],\n                    "gameplay_capabilities": semantic["gameplay_capabilities"],\n                    "implementation_capabilities": semantic[\n                        "implementation_capabilities"\n                    ],\n                    "artifact_task_ids": semantic["artifact_task_ids"],\n                    "semantic_status": semantic["semantic_status"],\n                    "unresolved_spans": semantic["unresolved_spans"],\n                    "acceptance": list(\n                        _requirement_acceptance(\n                            str(semantic["capability"]), matching_acceptance\n                        )\n                    ),\n                }\n            )\n'''
          text = text[:chunk_start] + merge_chunk + text[chunk_end:]

          # New catalogs: one independent semantic root == one requirement/gap/task chain.
          build_start = text.index('def build_request_catalog(')
          chunk_start = text.index('    acceptance_source = _strings(game_design.get("acceptance_tests"))', build_start)
          chunk_end = text.index('\n    purpose = ', chunk_start)
          build_chunk = '''    acceptance_source = _strings(game_design.get("acceptance_tests"))\n    requirements: list[dict[str, Any]] = []\n    for index, (capability, statement, from_design_module) in enumerate(records):\n        span = _source_span(prompt, statement)\n        matching_acceptance = tuple(\n            item\n            for item in acceptance_source\n            if _word_overlap(item, f"{capability} {statement}")\n        )\n        ir = _invoke_semantic_model(\n            statement, span["char_start"], span["char_end"], prompt, router\n        )\n        _validate_semantic_ir(ir, prompt)\n        variants = (ir,) if from_design_module else _semantic_ir_variants(ir)\n        for variant_index, variant_ir in enumerate(variants):\n            gameplay, _implementation, _unresolved = _expand_semantic_ir(variant_ir)\n            semantic_id = capability if from_design_module else (\n                gameplay[0] if gameplay else capability\n            )\n            discriminator = {\n                "prompt_sha256": _sha(prompt),\n                "index": index,\n                "span": [span["char_start"], span["char_end"]],\n            }\n            if len(variants) > 1:\n                discriminator["semantic_variant"] = variant_index\n            requirement_id = _stable_id("req", semantic_id, discriminator)\n            semantic = _semantic_requirement_fields(\n                capability,\n                variant_ir,\n                requirement_id,\n                is_design_module=from_design_module,\n            )\n            acceptance = _requirement_acceptance(\n                str(semantic["capability"]), matching_acceptance\n            )\n            requirements.append(\n                {\n                    "requirement_id": requirement_id,\n                    "capability": semantic["capability"],\n                    "statement": statement,\n                    "mandatory": True,\n                    "source_span": span,\n                    "provides": semantic["provides"],\n                    "gameplay_capabilities": semantic["gameplay_capabilities"],\n                    "implementation_capabilities": semantic[\n                        "implementation_capabilities"\n                    ],\n                    "artifact_task_ids": semantic["artifact_task_ids"],\n                    "semantic_status": semantic["semantic_status"],\n                    "unresolved_spans": semantic["unresolved_spans"],\n                    "acceptance": list(acceptance),\n                }\n            )\n'''
          text = text[:chunk_start] + build_chunk + text[chunk_end:]

          # Stored semantic roots must always remain bound to the singular provide.
          validator_start = text.index('def _validate_request_catalog(')
          gameplay_start = text.index('        # Gameplay binding check:', validator_start)
          gameplay_end = text.index('\n\ndef _word_overlap', gameplay_start)
          gameplay_block = '''        # Replay the stored Semantic Model output only; never reinterpret raw text.\n        gameplay_caps = frozenset(\n            str(v).removeprefix("capability:")\n            for v in requirement.get("gameplay_capabilities", ())\n            if str(v).strip()\n        )\n        provides_set = frozenset(provides)\n        stored_status = str(requirement.get("semantic_status", "RESOLVED"))\n        if stored_status == "UNRESOLVED" and not gameplay_caps:\n            raise EvidencePlanError(\n                "Mandatory request text is unresolved; generation is blocked."\n            )\n        if gameplay_caps and not gameplay_caps.intersection(provides_set):\n            raise EvidencePlanError(\n                "Requirement semantic binding lost a gameplay capability."\n            )\n'''
          text = text[:gameplay_start] + gameplay_block + text[gameplay_end:]

          # Every executable task keeps internal checks. Release bindings remain public-only.
          public_only = '''            # Structural integrity is enforced by done_predicate below.\n            # task.acceptance carries only public requirement acceptance on the\n            # terminal semantic step, so downstream aggregation cannot expose\n            # task IDs, owned-anchor checks, or gate mechanics to the user.\n            acceptance = [\n                str(item)\n                for item in gap.get("acceptance", ())\n                if index == len(steps) - 1 and _is_public_acceptance(item)\n            ]\n'''
          internal = '''            # Task-local validation is executable DAG state. Public/release\n            # acceptance is projected separately from requirement acceptance.\n            acceptance = [\n                f"{task_id}: all declared provides exist and all owned anchors pass their integrity checks"\n            ]\n            if index == len(steps) - 1:\n                acceptance.extend(\n                    str(item)\n                    for item in gap.get("acceptance", ())\n                    if _is_public_acceptance(item)\n                )\n'''
          if public_only in text:
              text = text.replace(public_only, internal, 1)

          # Production compilation can receive the same semantic router as catalog building.
          sig_old = '''    component_catalog: Any = None,\n    reuse_plan: Mapping[str, Any] | None = None,\n    target_decision: Mapping[str, Any] | None = None,\n) -> dict[str, Any]:\n    request_catalog = build_request_catalog(prompt, game_design)\n'''
          sig_new = '''    component_catalog: Any = None,\n    reuse_plan: Mapping[str, Any] | None = None,\n    target_decision: Mapping[str, Any] | None = None,\n    semantic_router: Any | None = None,\n) -> dict[str, Any]:\n    request_catalog = build_request_catalog(\n        prompt, game_design, router=semantic_router\n    )\n'''
          if sig_old in text:
              text = text.replace(sig_old, sig_new, 1)

          ast.parse(text)
          path.write_text(text, encoding='utf-8')

          # Reuse planner: keep unknown prompt-only requirements without letting them
          # inflate an authoritative design/catalog graph.
          reuse_path = Path('minecraft_mod_ai/reuse_planner.py')
          reuse = reuse_path.read_text(encoding='utf-8')
          reuse = re.sub(
              r'\n_DESIGN_REFERENCE_WORDS = frozenset\(\{[\s\S]*?\}\)\n',
              '\n',
              reuse,
              count=1,
          )
          reuse = re.sub(
              r'\n\ndef _is_design_reference_span\(value: str\) -> bool:\n[\s\S]*?(?=\n\n@dataclass\(frozen=True\)\nclass CapabilityGraph:)',
              '',
              reuse,
              count=1,
          )
          old = '''    prompt_res = resolve_capabilities_from_phrase_structured(str(prompt or ""))\n    enriched_res = enrich_resolution_with_semantic_inference(prompt_res, router=semantic_router)\n    selected_nodes = list(enriched_res.nodes)\n    if ordered:\n'''
          if old in reuse:
              reuse = reuse.replace(old, '''    authoritative_scope = bool(ordered)\n    prompt_res = resolve_capabilities_from_phrase_structured(str(prompt or ""))\n    enriched_res = enrich_resolution_with_semantic_inference(prompt_res, router=semantic_router)\n    selected_nodes = list(enriched_res.nodes)\n    if authoritative_scope:\n''', 1)
          # Remove stale English-only unresolved-span suppression if still present.
          reuse = re.sub(
              r'\n\s*if node\.origin == "unresolved_concept" and _is_design_reference_span\([\s\S]*?\):\n\s*continue',
              '',
              reuse,
              count=1,
          )
          if 'authoritative_scope = bool(ordered)' in reuse and 'prompt_resolution.provisional_opaque' not in reuse:
              anchor = '''    for u, v in enriched_res.edges:\n        if u in seen and v in seen and (u, v) not in edges:\n            edges.append((u, v))\n\n    if not ordered:\n        add("gameplay.core", "fallback")\n'''
              replacement = '''    for u, v in enriched_res.edges:\n        if u in seen and v in seen and (u, v) not in edges:\n            edges.append((u, v))\n\n    if not authoritative_scope:\n        inferred_spans = {\n            node.source_span\n            for node in enriched_res.nodes\n            if node.origin == "provisional_inferred" and node.source_span\n        }\n        for span in prompt_res.unresolved_spans:\n            clean_span = str(span or "").strip()\n            if not clean_span or clean_span in inferred_spans:\n                continue\n            opaque_id = (\n                "provisional:semantic_"\n                + hashlib.sha256(clean_span.encode("utf-8")).hexdigest()[:12]\n            )\n            anchor = add(\n                opaque_id, "prompt_resolution.provisional_opaque", expand=False\n            )\n            if anchor:\n                register_search_terms(anchor, (clean_span,))\n\n    if not ordered:\n        add("gameplay.core", "fallback")\n'''
              if anchor in reuse:
                  reuse = reuse.replace(anchor, replacement, 1)
          ast.parse(reuse)
          reuse_path.write_text(reuse, encoding='utf-8')

          test = Path('tests/test_planner_structural_repair_contract.py')
          test.write_text('''from __future__ import annotations\n\nfrom types import SimpleNamespace\n\nfrom minecraft_mod_ai.evidence_first_planning import (\n    SemanticRequirementIR,\n    _BRANCHES,\n    _compile_tasks,\n    _semantic_requirement_fields,\n    build_request_catalog,\n    compile_evidence_first_plan,\n)\nfrom minecraft_mod_ai.reuse_planner import decompose_capability_graph\n\n\ndef _router_for(caps: tuple[str, ...]):\n    payload = '{"intent":"semantic request","gameplay_capability_candidates":[' + ','.join(f'"{cap}"' for cap in caps) + '],"unresolved":false}'\n    return SimpleNamespace(generate_text=lambda *_args, **_kwargs: payload)\n\n\ndef test_direct_semantic_fields_preserve_explicit_capability_without_provenance() -> None:\n    ir = SemanticRequirementIR(0, 11, 'sha256:' + '0' * 64, 'trade items', ('economy.trade',), 0.95, False)\n    fields = _semantic_requirement_fields('custom.explicit_design_id', ir, 'req_explicit')\n    assert fields['capability'] == 'custom.explicit_design_id'\n    assert 'capability:custom.explicit_design_id' in fields['provides']\n\n\ndef test_multi_root_semantic_clause_explodes_into_independent_requirements() -> None:\n    prompt = 'Implement the requested progression systems.'\n    caps = ('mob.spawning', 'boss.entity', 'item.equipment', 'progression.level', 'item.upgrade')\n    catalog = build_request_catalog(prompt, {}, router=_router_for(caps))\n    got = {item['capability'] for item in catalog['requirements']}\n    assert set(caps) <= got\n    assert len({item['requirement_id'] for item in catalog['requirements']}) == len(catalog['requirements'])\n    assert all(len(item['provides']) == 1 for item in catalog['requirements'])\n\n\ndef test_multi_root_plan_builds_a_task_chain_for_every_capability() -> None:\n    prompt = 'Implement the requested progression systems.'\n    caps = ('mob.spawning', 'boss.entity', 'item.equipment', 'progression.level', 'item.upgrade')\n    plan = compile_evidence_first_plan(\n        prompt,\n        {},\n        target_decision={\n            'target': {\n                'minecraft_version': '1.21.1',\n                'loader': 'neoforge',\n                'source_api_family': 'neoforge',\n            }\n        },\n        semantic_router=_router_for(caps),\n    )\n    gap_caps = {gap['capability'] for gap in plan['gap_catalog']}\n    assert set(caps) <= gap_caps\n    task_req_refs = {ref for task in plan['tasks'] for ref in task['requirement_refs']}\n    assert task_req_refs == {item['requirement_id'] for item in plan['request_catalog']['requirements']}\n\n\ndef test_task_internal_acceptance_is_not_release_acceptance() -> None:\n    public = 'Verify the observable player-facing behavior for capability economy.trade.'\n    gaps = [{'gap_id':'gap_trade','requirement_ref':'req_trade','capability':'economy.trade','missing_provides':['capability:economy.trade'],'acceptance':[public]}]\n    reuse = [{'requirement_ref':'req_trade','component_refs':[],'source_refs':[]} ]\n    target = {'coordinates': {'minecraft_version':'1.21.1','loader':'neoforge'}}\n    branches = {name: {'status':'NOT_APPLICABLE'} for name in _BRANCHES}\n    ownership = {'module_id':':','source_set':'main','source_root':'src/main/java','resource_root':'src/main/resources','test_root':'src/test/java','namespace':'generated.test','mod_id':'test','extension':'java','topology_module_ids':[],'topology_source_sets':[]}\n    tasks = _compile_tasks(gaps, reuse, target, branches, ownership)\n    assert all(task['acceptance'] for task in tasks)\n    assert all(any('declared provides' in item.casefold() for item in task['acceptance']) for task in tasks)\n    assert public in tasks[-1]['acceptance']\n\n\ndef test_prompt_unknown_is_one_opaque_but_design_scope_does_not_inflate() -> None:\n    graph = decompose_capability_graph('Add seasonal rune banking.')\n    opaque = [node for node in graph.nodes if node.startswith('provisional:')]\n    assert len(opaque) == 1\n    design = {'capabilities': [f'system.feature_{index}' for index in range(96)]}\n    scoped = decompose_capability_graph('Implement the declared systems.', design=design)\n    assert len(scoped.nodes) == 96\n    assert not any(node.startswith('provisional:') for node in scoped.nodes)\n''', encoding='utf-8')
          ast.parse(test.read_text(encoding='utf-8'))
          PY
      - name: Install tests
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Run structural planner regressions
        run: |
          python -m pytest -q \
            tests/test_planner_structural_repair_contract.py \
            tests/test_planner_requirement_acceptance_contract.py \
            tests/test_language_independent_semantic_compiler_regression.py \
            tests/test_joint_reuse_planner_contract.py \
            tests/test_canonical_capability_ontology_and_reuse_proof.py \
            tests/test_evidence_first_planning.py
      - name: Commit actual repair directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            minecraft_mod_ai/evidence_first_planning.py \
            minecraft_mod_ai/reuse_planner.py \
            tests/test_planner_structural_repair_contract.py
          git rm -f \
            .github/workflows/planner-structural-repair.yml \
            .github/workflows/planner-contract-repair.yml \
            .github/workflows/acceptance-boundary-repair.yml || true
          git commit -m "fix: repair semantic requirement planning contracts"
          git push origin HEAD:main
