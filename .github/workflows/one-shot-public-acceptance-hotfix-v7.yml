name: One-shot public acceptance hotfix v7

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-public-acceptance-hotfix-v7.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply root acceptance patch
        shell: bash
        run: |
          python -m py_compile .github/acceptance_hotfix_v5.py
          python .github/acceptance_hotfix_v5.py
          python -m compileall -q minecraft_mod_ai

      - name: Install project test environment
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q -e . pytest

      - name: Verify acceptance boundary and mutation budget
        shell: bash
        run: |
          python -m pytest -q tests/test_public_acceptance_runtime_boundary.py
          python .github/scripts/audit_runtime_mutations.py

      - name: Commit actual source fix and purge temporary hotfix machinery
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Keep source changes, but incorporate any concurrent main-only tooling
          # commit before producing the final commit.
          git add minecraft_mod_ai/production_boundary_contract.py \
                  minecraft_mod_ai/production_contract.py \
                  tests/test_public_acceptance_runtime_boundary.py
          git commit -m 'tmp: acceptance source fix before cleanup'
          git fetch origin main
          git rebase origin/main

          rm -f .github/acceptance_hotfix.py
          rm -f .github/acceptance_hotfix_v5.py
          rm -f tests/test_acceptance_hotfix_regression.py
          rm -f .github/workflows/acceptance-hotfix.yml
          rm -f .github/workflows/one-shot-public-acceptance-hotfix.yml
          rm -f .github/workflows/one-shot-public-acceptance-hotfix-v2.yml
          rm -f .github/workflows/one-shot-public-acceptance-hotfix-v3.yml
          rm -f .github/workflows/one-shot-public-acceptance-hotfix-v4.yml
          rm -f .github/workflows/one-shot-public-acceptance-hotfix-v5.yml
          rm -f .github/workflows/one-shot-public-acceptance-hotfix-v6.yml
          rm -f .github/workflows/one-shot-public-acceptance-hotfix-v7.yml
          git add -A
          git commit --amend -m 'fix: sanitize public acceptance before production validation'
          echo "HOTFIX_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:main
