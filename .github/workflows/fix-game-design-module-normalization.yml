name: Fix game design module normalization

# Re-run after preserving the existing strict prompt line contract.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-game-design-module-normalization.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply and validate game design recovery repair
        run: |
          python -m pip install -q pytest anyio PyYAML httpx packaging "mcp==2.0.0"
          python .github/scripts/fix_game_design_module_normalization.py
          python -m compileall -q minecraft_mod_ai
          PYTHONPATH=. pytest -q tests/test_game_design_router.py tests/test_game_design_plan.py tests/test_planner_strict_json_contract.py
      - name: Commit repair to main and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-game-design-module-normalization.yml
          rm .github/scripts/fix_game_design_module_normalization.py
          git add minecraft_mod_ai/game_design.py tests/test_game_design_router.py .github/workflows/fix-game-design-module-normalization.yml .github/scripts/fix_game_design_module_normalization.py
          git diff --cached --check
          git commit -m "Recover compact game design module metadata"
          git pull --rebase origin main
          git push origin HEAD:main
