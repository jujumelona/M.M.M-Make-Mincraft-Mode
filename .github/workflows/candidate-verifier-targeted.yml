name: Candidate Verifier Targeted

on:
  push:
    branches: [main]
    paths:
      - "minecraft_mod_ai/custom_module_generator.py"
      - "minecraft_mod_ai/authored_production.py"
      - "minecraft_mod_ai/runner.py"
      - "minecraft_mod_ai/complete_orchestrator.py"
      - "tests/test_direct_custom_module_generator.py"
      - "tests/test_authored_direct_lowering.py"
      - ".github/workflows/candidate-verifier-targeted.yml"
  pull_request:
    paths:
      - "minecraft_mod_ai/custom_module_generator.py"
      - "minecraft_mod_ai/authored_production.py"
      - "minecraft_mod_ai/runner.py"
      - "minecraft_mod_ai/complete_orchestrator.py"
      - "tests/test_direct_custom_module_generator.py"
      - "tests/test_authored_direct_lowering.py"
      - ".github/workflows/candidate-verifier-targeted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install targeted test dependencies
        run: python -m pip install --prefer-binary -e ".[dev]"
      - name: Compile direct production path
        run: >-
          python -m py_compile
          minecraft_mod_ai/custom_module_generator.py
          minecraft_mod_ai/authored_production.py
          minecraft_mod_ai/runner.py
          minecraft_mod_ai/complete_orchestrator.py
      - name: Run direct generation regressions
        run: >-
          python -m pytest
          tests/test_direct_custom_module_generator.py
          tests/test_authored_direct_lowering.py
          -q
