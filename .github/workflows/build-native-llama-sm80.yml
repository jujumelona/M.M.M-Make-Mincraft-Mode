name: Build native llama CUDA SM80

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-native-llama-sm80.yml
      - .github/workflows/build-native-llama-cuda.yml
      - tools/native_llama_bundle.py

permissions:
  contents: write

concurrency:
  group: native-llama-sm80-b10375-cuda12.4-v2
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build-native-llama-cuda.yml
    with:
      cuda_arch: "80"
    permissions:
      contents: write
