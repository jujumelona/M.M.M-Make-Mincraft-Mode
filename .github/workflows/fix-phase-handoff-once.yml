name: Fix phase-local tool transcript once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix-phase-handoff-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.head_commit.message == 'Bootstrap phase-local tool transcript fix'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Rewrite phase-local tool protocol
        run: python .github/scripts/fix_phase_handoff_once.py
      - name: Verify focused change
        run: |
          python -m compileall -q minecraft_mod_ai/progress_aware_tool_loop.py tests/test_tool_call_admission_contract.py
          ruff check tests/test_tool_call_admission_contract.py
          pytest -q tests/test_tool_call_admission_contract.py
      - name: Commit implementation to main and remove one-shot helpers
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-phase-handoff-once.yml
          git rm .github/scripts/fix_phase_handoff_once.py
          git add minecraft_mod_ai/progress_aware_tool_loop.py tests/test_tool_call_admission_contract.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make tool phases protocol-local'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
