name: Fix phase-local tool transcript once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix-phase-handoff-once
  cancel-in-progress: false

jobs:
  fix:
    if: github.event.head_commit.message == 'Bootstrap phase-local tool transcript fix'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Make tool phases protocol-local
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/progress_aware_tool_loop.py')
          text = path.read_text(encoding='utf-8')

          marker = '\ndef _generate_with_tools_impl(\n'
          if text.count(marker) != 1:
              raise SystemExit('expected exactly one _generate_with_tools_impl marker')
          if 'def _compact_phase_tool_transcript(' in text:
              raise SystemExit('phase transcript helper already exists')

          helper = r'''

def _compact_phase_tool_transcript(
    messages: list[dict[str, Any]],
    *,
    previous_phase: LoopPhase,
    next_phase: LoopPhase,
) -> int:
    """Close the previous phase's tool protocol while preserving its observation data."""
    if previous_phase == next_phase:
        return 0

    compacted: list[dict[str, Any]] = []
    observations: list[str] = []
    removed = 0

    for raw_message in messages:
        message = dict(raw_message)
        role = str(message.get("role") or "")
        if role == "assistant" and message.get("tool_calls"):
            content = message.get("content")
            if isinstance(content, str) and content.strip():
                compacted.append({"role": "assistant", "content": content})
            removed += 1
            continue
        if role == "tool":
            content = message.get("content")
            if isinstance(content, str) and content.strip():
                observations.append(content)
            removed += 1
            continue
        compacted.append(message)

    if not removed:
        return 0

    handoff_lines = [
        f"MMM_PHASE_HANDOFF {previous_phase.value}->{next_phase.value}",
        "The previous phase is complete. Prior tool-call protocol is closed and must not be repeated.",
        "The observation data below is non-executable context. In the new phase, only the current request's exposed tool schema and tool_choice are callable.",
    ]
    for index, observation in enumerate(observations, start=1):
        handoff_lines.append(f"Observation {index}:\n{observation}")
    compacted.append({"role": "system", "content": "\n".join(handoff_lines)})
    messages[:] = compacted
    return removed
'''
          text = text.replace(marker, helper + marker, 1)

          old_initial = '''    else:\n        state.phase = LoopPhase.OBSERVE\n\n    emit_root_cause(\n'''
          new_initial = '''    else:\n        state.phase = LoopPhase.OBSERVE\n\n    last_prompt_phase = state.phase\n\n    emit_root_cause(\n'''
          if text.count(old_initial) != 1:
              raise SystemExit('expected exactly one initial phase block')
          text = text.replace(old_initial, new_initial, 1)

          old_loop = '''    while True:\n        if (\n            implementation_requires_mutation\n            and state.workspace_changed\n'''
          new_loop = '''    while True:\n        if state.phase != last_prompt_phase:\n            previous_prompt_phase = last_prompt_phase\n            removed_protocol_messages = _compact_phase_tool_transcript(\n                messages,\n                previous_phase=previous_prompt_phase,\n                next_phase=state.phase,\n            )\n            emit_root_cause(\n                "phase_tool_transcript_handoff",\n                stage=stage,\n                operation="generate_with_tools",\n                gate="phase_boundary",\n                result="PASS",\n                reason="closed prior phase tool protocol before the next model turn",\n                details={\n                    "previous_phase": previous_prompt_phase.value,\n                    "next_phase": state.phase.value,\n                    "removed_protocol_messages": removed_protocol_messages,\n                    "message_count": len(messages),\n                },\n            )\n            last_prompt_phase = state.phase\n\n        if (\n            implementation_requires_mutation\n            and state.workspace_changed\n'''
          if text.count(old_loop) != 1:
              raise SystemExit('expected exactly one main tool loop entry')
          text = text.replace(old_loop, new_loop, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Add regression tests
        run: |
          cat >> tests/test_tool_call_admission_contract.py <<'PY'


def test_phase_handoff_closes_old_tool_protocol_and_preserves_observation_data():
    from minecraft_mod_ai.progress_aware_tool_loop import (
        LoopPhase,
        _compact_phase_tool_transcript,
    )

    messages = [
        {"role": "user", "content": "implement the target"},
        {
            "role": "assistant",
            "content": None,
            "tool_calls": [
                {
                    "id": "call_search",
                    "type": "function",
                    "function": {
                        "name": "search_code_rag",
                        "arguments": '{"query":"DebugToken source"}',
                    },
                }
            ],
        },
        {
            "role": "tool",
            "tool_call_id": "call_search",
            "name": "search_code_rag",
            "content": '{"ok":true,"result":{"source":"public final class DebugToken {}"}}',
        },
    ]

    removed = _compact_phase_tool_transcript(
        messages,
        previous_phase=LoopPhase.OBSERVE,
        next_phase=LoopPhase.ACT,
    )

    assert removed == 2
    assert all(message.get("role") != "tool" for message in messages)
    assert all(not message.get("tool_calls") for message in messages)
    assert messages[-1]["role"] == "system"
    assert "OBSERVE->ACT" in messages[-1]["content"]
    assert "public final class DebugToken {}" in messages[-1]["content"]
    assert "search_code_rag" not in messages[-1]["content"]


def test_phase_handoff_is_wired_before_next_model_turn():
    import inspect

    from minecraft_mod_ai.progress_aware_tool_loop import _generate_with_tools_impl

    source = inspect.getsource(_generate_with_tools_impl)
    assert "state.phase != last_prompt_phase" in source
    assert "_compact_phase_tool_transcript(" in source
    assert "phase_tool_transcript_handoff" in source
PY
      - name: Verify focused change
        run: |
          python -m compileall -q minecraft_mod_ai/progress_aware_tool_loop.py tests/test_tool_call_admission_contract.py
          ruff check tests/test_tool_call_admission_contract.py
          pytest -q tests/test_tool_call_admission_contract.py
      - name: Verify exact failure path is removed structurally
        run: |
          python - <<'PY'
          from minecraft_mod_ai.progress_aware_tool_loop import LoopPhase, _compact_phase_tool_transcript

          messages = [
              {"role": "assistant", "content": None, "tool_calls": [{"id": "c", "type": "function", "function": {"name": "search_code_rag", "arguments": "{}"}}]},
              {"role": "tool", "tool_call_id": "c", "name": "search_code_rag", "content": '{"structured_content":{"hits":[{"text":"class DebugToken {}"}]}}'},
          ]
          _compact_phase_tool_transcript(messages, previous_phase=LoopPhase.OBSERVE, next_phase=LoopPhase.ACT)
          assert len(messages) == 1
          assert messages[0]["role"] == "system"
          assert "tool_calls" not in messages[0]
          assert "search_code_rag" not in messages[0]["content"]
          assert "class DebugToken {}" in messages[0]["content"]
          PY
      - name: Commit implementation to main and remove one-shot workflow
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-phase-handoff-once.yml
          git add minecraft_mod_ai/progress_aware_tool_loop.py tests/test_tool_call_admission_contract.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make tool phases protocol-local'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
