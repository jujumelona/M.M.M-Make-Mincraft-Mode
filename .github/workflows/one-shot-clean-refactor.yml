name: one-shot-clean-refactor

on:
  push:
    paths:
      - '.github/workflows/one-shot-clean-refactor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Prepare refactor tooling
        run: python -m pip install --disable-pip-version-check pyyaml pytest
      - name: Prepare safe AST wrapper
        shell: bash
        run: |
          cat > /tmp/run_clean_refactor.py <<'PY'
          import ast
          import os
          import sys

          sys.path.insert(0, os.getcwd())
          import scripts.one_shot_clean_refactor as refactor

          def _visit_try(self, node):
              node = self.generic_visit(node)
              if not node.body:
                  node.body = [ast.Pass()]
              for handler in node.handlers:
                  if not handler.body:
                      handler.body = [ast.Pass()]
              return node

          def _visit_body(self, node):
              node = self.generic_visit(node)
              if not node.body:
                  node.body = [ast.Pass()]
              return node

          refactor.CapabilityStripper.visit_Try = _visit_try
          if hasattr(ast, "TryStar"):
              refactor.CapabilityStripper.visit_TryStar = _visit_try
          refactor.CapabilityStripper.visit_With = _visit_body
          refactor.CapabilityStripper.visit_AsyncWith = _visit_body
          refactor.CapabilityStripper.visit_While = _visit_body
          refactor.main()
          PY
      - name: Apply clean refactor to current main
        shell: bash
        run: |
          set -euo pipefail
          run_refactor() {
            set +e
            output="$(python /tmp/run_clean_refactor.py 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if [ "$status" -ne 0 ]; then
              diagnostic="$(printf '%s' "$output" | tail -c 6000 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')"
              echo "::error title=Clean refactor failed::$diagnostic"
              return "$status"
            fi
          }
          apply_and_verify() {
            run_refactor
            python -m compileall -q minecraft_mod_ai
            python -m pytest -q tests/test_clean_production_contract.py
            git diff --check
          }
          apply_and_verify
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git reset --hard origin/main
            apply_and_verify
          fi
      - name: Commit only the refactor result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              git reset --hard origin/main
              python /tmp/run_clean_refactor.py
              python -m compileall -q minecraft_mod_ai
              python -m pytest -q tests/test_clean_production_contract.py
              git diff --check
            fi
            git rm -f scripts/one_shot_clean_refactor.py .github/workflows/one-shot-clean-refactor.yml
            git add -A
            git commit -m "refactor: collapse production contracts and remove media capability layer"
            if git push origin HEAD:main; then
              exit 0
            fi
            git reset --hard origin/main
          done
          echo "main changed repeatedly; refusing to overwrite newer work" >&2
          exit 1
