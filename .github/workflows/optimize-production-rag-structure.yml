name: Optimize production RAG structure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/optimize-production-rag-structure.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply and validate optimization
        run: |
          python -m pip install -q -e '.[dev]'
          python -m py_compile .github/scripts/optimize_production_rag_structure.py
          python .github/scripts/optimize_production_rag_structure.py
          python -m compileall -q minecraft_mod_ai tests
          python -m ruff check minecraft_mod_ai tests --select F,E7,E9
          python -m pytest -q
      - name: Commit optimized structure to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/optimize-production-rag-structure.yml
          rm .github/scripts/optimize_production_rag_structure.py
          git add -A
          git diff --cached --check
          git commit -m "Optimize production RAG ownership and refresh path"
          git pull --rebase origin main
          git push origin HEAD:main
