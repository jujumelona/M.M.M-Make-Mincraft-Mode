name: Regenerate Colab once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regenerate_colab_once.yml'
      - 'tools/build_colab_notebook.py'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'nbformat>=5.10,<6'
      - run: python tools/build_colab_notebook.py
      - name: Commit generated notebooks
        run: |
          if git diff --quiet -- M.M.M_Make_Mincraft_Mode_Colab.ipynb Minecraft_Multimodal_Mod_AI_Architecture_v6.ipynb; then
            echo 'Notebooks already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add M.M.M_Make_Mincraft_Mode_Colab.ipynb Minecraft_Multimodal_Mod_AI_Architecture_v6.ipynb
          git commit -m 'fix(colab): sync generated notebooks'
          git push origin HEAD:main
