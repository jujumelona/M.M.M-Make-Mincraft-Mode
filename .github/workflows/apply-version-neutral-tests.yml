name: Apply version-neutral test target fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply exact version-neutral fixture edits
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/conftest.py')
          text = path.read_text(encoding='utf-8')
          if 'def synthetic_platform_lock()' not in text:
              marker = '@pytest.fixture(autouse=True)\ndef _isolate_test_runtime_state'
              insert = '''@pytest.fixture\ndef synthetic_platform_lock():\n    """Resolved non-release target for version-independent generation tests."""\n\n    return _platform_lock_from_adapter(_synthetic_test_adapter())\n\n\n'''
              if marker not in text:
                  raise SystemExit('conftest isolate-fixture marker not found')
              text = text.replace(marker, insert + marker, 1)
              path.write_text(text, encoding='utf-8')

          path = Path('tests/test_hardened_release_gates.py')
          text = path.read_text(encoding='utf-8')
          old = 'def test_every_platform_component_is_exactly_pinned() -> None:\n    platform = PlatformLock()\n'
          new = 'def test_every_platform_component_is_exactly_pinned(\n    synthetic_platform_lock: PlatformLock,\n) -> None:\n    platform = synthetic_platform_lock\n'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('release gate edit point not found')
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_scalable_limits.py')
          text = path.read_text(encoding='utf-8')
          edits = [
              (
                  'from minecraft_mod_ai.spec import ContentKind, ContentSpec, ModSpec\n',
                  'from minecraft_mod_ai.spec import ContentKind, ContentSpec, ModSpec, PlatformLock\n',
              ),
              (
                  'def test_257_contents_generate_in_deterministic_shards(tmp_path: Path) -> None:\n',
                  'def test_257_contents_generate_in_deterministic_shards(\n    tmp_path: Path, synthetic_platform_lock: PlatformLock\n) -> None:\n',
              ),
              (
                  '        summary="scale contract",\n        contents=contents,\n',
                  '        summary="scale contract",\n        contents=contents,\n        platform=synthetic_platform_lock,\n',
              ),
              (
                  'def test_validator_uses_explicit_file_policy_not_legacy_4_mib(\n    tmp_path: Path,\n) -> None:\n',
                  'def test_validator_uses_explicit_file_policy_not_legacy_4_mib(\n    tmp_path: Path, synthetic_platform_lock: PlatformLock\n) -> None:\n',
              ),
              (
                  '        summary="policy file size contract",\n        contents=(\n',
                  '        summary="policy file size contract",\n        platform=synthetic_platform_lock,\n        contents=(\n',
              ),
          ]
          for old, new in edits:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'scalable edit point not found: {old!r}')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Verify fixed regressions
        run: >-
          python -m pytest -q
          tests/test_hardened_release_gates.py::test_every_platform_component_is_exactly_pinned
          tests/test_scalable_limits.py::test_257_contents_generate_in_deterministic_shards
          tests/test_scalable_limits.py::test_validator_uses_explicit_file_policy_not_legacy_4_mib
      - run: python .github/scripts/debug_repo_audit.py
      - run: python -m compileall -q minecraft_mod_ai tests tools download_resources.py
      - name: Commit and push
        run: |
          git config user.name 'jujumelona'
          git config user.email 'qasdaa025@gmail.com'
          git add tests/conftest.py tests/test_hardened_release_gates.py tests/test_scalable_limits.py
          git diff --cached --exit-code --quiet && exit 0
          git commit -m 'Use explicit synthetic targets in version-neutral tests'
          git push origin HEAD:main
