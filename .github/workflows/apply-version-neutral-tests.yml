name: Apply version-neutral test target fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply verified three-file patch
        shell: bash
        run: |
          cat > /tmp/fix.b64 <<'EOF'
          
          EOF
          tr -d '[:space:]' < /tmp/fix.b64 | base64 -d | gzip -dc > /tmp/fix.patch
          echo '74e19cd60c0c595dfcff3689f5e95398c1197e6ffeb1410563ed55082bf0f65d  /tmp/fix.patch' | sha256sum -c -
          git apply --index /tmp/fix.patch
          git diff --check --cached
      - name: Verify fixed regressions
        run: >-
          python -m pytest -q
          tests/test_hardened_release_gates.py::test_every_platform_component_is_exactly_pinned
          tests/test_scalable_limits.py::test_257_contents_generate_in_deterministic_shards
          tests/test_scalable_limits.py::test_validator_uses_explicit_file_policy_not_legacy_4_mib
      - run: python .github/scripts/debug_repo_audit.py
      - run: python -m compileall -q minecraft_mod_ai tests tools download_resources.py
      - name: Commit and push
        run: |
          git config user.name 'jujumelona'
          git config user.email 'qasdaa025@gmail.com'
          git commit -m 'Use explicit synthetic targets in version-neutral tests'
          git push origin HEAD:main
