name: One-time production stream owner cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-stream-owner-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Merge resume policy into stream owner
        run: |
          python - <<'PY'
          from pathlib import Path

          stream = Path('minecraft_mod_ai/production_stream_efficiency_contract.py')
          text = stream.read_text(encoding='utf-8')

          edits = [
              (
                  '_KIND_FIELD = {value: key for key, value in _ITEM_KIND.items()}\n',
                  '_KIND_FIELD = {value: key for key, value in _ITEM_KIND.items()}\n_FULL_PAGE_DECODE_LIMIT = 2\n',
              ),
              (
                  '''def _stream_event_path(stage: str, request: dict[str, Any]) -> Path:\n    from .production_page_durable_contract import page_checkpoint_path\n\n    page_path = page_checkpoint_path(stage, request)\n    return page_path.with_name(page_path.name + ".stream.jsonl")\n\n\n''',
                  '''def _stream_event_path(stage: str, request: dict[str, Any]) -> Path:\n    from .production_page_durable_contract import page_checkpoint_path\n\n    page_path = page_checkpoint_path(stage, request)\n    return page_path.with_name(page_path.name + ".stream.jsonl")\n\n\ndef _latest_saved_stream(path: Path) -> str:\n    if not path.is_file() or path.is_symlink():\n        return ""\n    latest = ""\n    try:\n        with path.open("r", encoding="utf-8") as handle:\n            for line in handle:\n                line = line.strip()\n                if not line:\n                    continue\n                try:\n                    value = json.loads(line)\n                except json.JSONDecodeError:\n                    break\n                if isinstance(value, dict) and isinstance(value.get("text"), str):\n                    latest = value["text"]\n    except OSError:\n        return ""\n    return latest\n\n\n''',
              ),
              (
                  '''        if not production:\n            return current(\n                router,\n                system_prompt=system_prompt,\n                request=request,\n                media_paths=media_paths,\n                expected_contracts=expected_contracts,\n                stage=stage,\n            )\n\n        view = runtime._contract_view(request, expected_contracts)\n''',
                  '''        if not production:\n            return current(\n                router,\n                system_prompt=system_prompt,\n                request=request,\n                media_paths=media_paths,\n                expected_contracts=expected_contracts,\n                stage=stage,\n            )\n\n        saved_text = _latest_saved_stream(_stream_event_path(stage, request))\n        if saved_text:\n            saved_page = _salvage_production_stream(\n                complete_planner_module,\n                runtime,\n                router,\n                text=saved_text,\n                request=request,\n                stage=stage,\n            )\n            if saved_page is not None:\n                return saved_page\n\n        view = runtime._contract_view(request, expected_contracts)\n''',
              ),
              (
                  '''        previous_diagnostic = ""\n        round_index = 0\n\n        while True:\n''',
                  '''        previous_diagnostic = ""\n        round_index = 0\n\n        while round_index < _FULL_PAGE_DECODE_LIMIT:\n''',
              ),
              (
                  '''            previous_diagnostic = diagnostic + "; salvage=no verified production item"\n            round_index += 1\n\n    generate_json_page_lossless._mmm_lossless_production_stream = True  # type: ignore[attr-defined]\n''',
                  '''            previous_diagnostic = diagnostic + "; salvage=no verified production item"\n            round_index += 1\n\n        raise complete_planner_module.SpecValidationError(\n            "Production page failed after one page-local repair; durable stream/item "\n            "repair remains authoritative."\n        )\n\n    generate_json_page_lossless._mmm_lossless_production_stream = True  # type: ignore[attr-defined]\n    generate_json_page_lossless._mmm_saved_stream_resume = True  # type: ignore[attr-defined]\n    generate_json_page_lossless._mmm_bounded_full_page_decode = True  # type: ignore[attr-defined]\n''',
              ),
          ]
          for old, new in edits:
              if text.count(old) != 1:
                  raise SystemExit(f'stream owner shape changed: {old[:100]!r}')
              text = text.replace(old, new)
          stream.write_text(text, encoding='utf-8')

          bootstrap = Path('minecraft_mod_ai/runtime_bootstrap.py')
          text = bootstrap.read_text(encoding='utf-8')
          for old in (
              '    from .production_stream_resume_contract import install as install_production_stream_resume\n',
              '    install_production_stream_resume(complete_planner)\n',
          ):
              if text.count(old) != 1:
                  raise SystemExit(f'bootstrap stream shape changed: {old!r}')
              text = text.replace(old, '')
          bootstrap.write_text(text, encoding='utf-8')

          test = Path('tests/test_runtime_bootstrap_clean.py')
          text = test.read_text(encoding='utf-8')
          old = '        "install_production_stream_resume(",\n'
          if text.count(old) != 1:
              raise SystemExit('bootstrap test stream call shape changed')
          text = text.replace(old, '')
          anchor = '    assert not (PACKAGE / "llama_server_max_performance.py").exists()\n'
          replacement = anchor + '    assert not (PACKAGE / "production_stream_resume_contract.py").exists()\n'
          if text.count(anchor) != 1:
              raise SystemExit('bootstrap absence assertion anchor changed')
          test.write_text(text.replace(anchor, replacement), encoding='utf-8')
          PY
          git rm minecraft_mod_ai/production_stream_resume_contract.py
      - name: Verify single stream owner
        run: |
          python -m pip install --prefer-binary -e '.[dev]'
          ! grep -R "production_stream_resume_contract\|install_production_stream_resume" -n minecraft_mod_ai tests tools --exclude-dir='__pycache__'
          python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9
          python -m pytest -q \
            tests/test_runtime_bootstrap_clean.py \
            tests/test_planner_json_runtime_contract.py \
            tests/test_production_page_durable_contract.py \
            tests/test_planner_incremental_repair_contract.py
          git diff --check
      - name: Commit and remove maintenance workflow
        run: |
          git rm .github/workflows/one-time-stream-owner-cleanup.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Give production streaming single ownership'
          git push origin HEAD:main
