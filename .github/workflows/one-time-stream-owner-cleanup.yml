name: One-time production stream owner cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-stream-owner-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Merge resume policy into stream owner
        run: |
          python - <<'PY'
          from pathlib import Path

          stream = Path('minecraft_mod_ai/production_stream_efficiency_contract.py')
          text = stream.read_text(encoding='utf-8')

          edits = [
              (
                  '_KIND_FIELD = {value: key for key, value in _ITEM_KIND.items()}\n',
                  '_KIND_FIELD = {value: key for key, value in _ITEM_KIND.items()}\n_FULL_PAGE_DECODE_LIMIT = 2\n',
              ),
              (
                  '''def _stream_event_path(stage: str, request: dict[str, Any]) -> Path:\n    from .production_page_durable_contract import page_checkpoint_path\n\n    page_path = page_checkpoint_path(stage, request)\n    return page_path.with_name(page_path.name + ".stream.jsonl")\n\n\n''',
                  '''def _stream_event_path(stage: str, request: dict[str, Any]) -> Path:\n    from .production_page_durable_contract import page_checkpoint_path\n\n    page_path = page_checkpoint_path(stage, request)\n    return page_path.with_name(page_path.name + ".stream.jsonl")\n\n\ndef _latest_saved_stream(path: Path) -> str:\n    if not path.is_file() or path.is_symlink():\n        return ""\n    latest = ""\n    try:\n        with path.open("r", encoding="utf-8") as handle:\n            for line in handle:\n                line = line.strip()\n                if not line:\n                    continue\n                try:\n                    value = json.loads(line)\n                except json.JSONDecodeError:\n                    break\n                if isinstance(value, dict) and isinstance(value.get("text"), str):\n                    latest = value["text"]\n    except OSError:\n        return ""\n    return latest\n\n\n''',
              ),
              (
                  '''        if not production:\n            return current(\n                router,\n                system_prompt=system_prompt,\n                request=request,\n                media_paths=media_paths,\n                expected_contracts=expected_contracts,\n                stage=stage,\n            )\n\n        view = runtime._contract_view(request, expected_contracts)\n''',
                  '''        if not production:\n            return current(\n                router,\n                system_prompt=system_prompt,\n                request=request,\n                media_paths=media_paths,\n                expected_contracts=expected_contracts,\n                stage=stage,\n            )\n\n        saved_text = _latest_saved_stream(_stream_event_path(stage, request))\n        if saved_text:\n            saved_page = _salvage_production_stream(\n                complete_planner_module,\n                runtime,\n                router,\n                text=saved_text,\n                request=request,\n                stage=stage,\n            )\n            if saved_page is not None:\n                return saved_page\n\n        view = runtime._contract_view(request, expected_contracts)\n''',
              ),
              (
                  '''        previous_diagnostic = ""\n        round_index = 0\n\n        while True:\n''',
                  '''        previous_diagnostic = ""\n        round_index = 0\n\n        while round_index < _FULL_PAGE_DECODE_LIMIT:\n''',
              ),
              (
                  '''            previous_diagnostic = diagnostic + "; salvage=no verified production item"\n            round_index += 1\n\n    generate_json_page_lossless._mmm_lossless_production_stream = True  # type: ignore[attr-defined]\n''',
                  '''            previous_diagnostic = diagnostic + "; salvage=no verified production item"\n            round_index += 1\n\n        raise complete_planner_module.SpecValidationError(\n            "Production page failed after one page-local repair; durable stream/item "\n            "repair remains authoritative."\n        )\n\n    generate_json_page_lossless._mmm_lossless_production_stream = True  # type: ignore[attr-defined]\n    generate_json_page_lossless._mmm_saved_stream_resume = True  # type: ignore[attr-defined]\n    generate_json_page_lossless._mmm_bounded_full_page_decode = True  # type: ignore[attr-defined]\n''',
              ),
          ]
          for old, new in edits:
              if text.count(old) != 1:
                  raise SystemExit(f'stream owner shape changed: {old[:100]!r}')
              text = text.replace(old, new)
          stream.write_text(text, encoding='utf-8')

          bootstrap = Path('minecraft_mod_ai/runtime_bootstrap.py')
          text = bootstrap.read_text(encoding='utf-8')
          for old in (
              '    from .production_stream_resume_contract import install as install_production_stream_resume\n',
              '    install_production_stream_resume(complete_planner)\n',
          ):
              if text.count(old) != 1:
                  raise SystemExit(f'bootstrap stream shape changed: {old!r}')
              text = text.replace(old, '')
          bootstrap.write_text(text, encoding='utf-8')

          test = Path('tests/test_runtime_bootstrap_clean.py')
          text = test.read_text(encoding='utf-8')
          old = '        "install_production_stream_resume(",\n'
          if text.count(old) != 1:
              raise SystemExit('bootstrap test stream call shape changed')
          text = text.replace(old, '')
          anchor = '    assert not (PACKAGE / "llama_server_max_performance.py").exists()\n'
          replacement = anchor + '    assert not (PACKAGE / "production_stream_resume_contract.py").exists()\n'
          if text.count(anchor) != 1:
              raise SystemExit('bootstrap absence assertion anchor changed')
          test.write_text(text.replace(anchor, replacement), encoding='utf-8')

          planner_test = Path('tests/test_planner_json_runtime_contract.py')
          text = planner_test.read_text(encoding='utf-8')
          if 'import pytest\n' not in text:
              text = text.replace('import json\n', 'import json\n\nimport pytest\n', 1)
          old = '''def test_production_repair_keeps_requested_targets_after_truncated_first_page() -> None:\n    router = _Router(\n        '{"modules":[{"module_id":"cut_off"',\n        json.dumps(\n            {\n                "modules": [\n                    _module("entity_runtime_impl", implements=("entity_runtime",))\n                ]\n            }\n        ),\n    )\n\n    page = complete_planner._generate_json_page_with_repair(\n        router,\n        system_prompt="Implement ALL requested deliverables in this page.",\n        request=_request("entity_runtime", "ui_runtime"),\n        media_paths=("reference.png",),\n        expected_contracts=(frozenset(complete_planner._PRODUCTION_PAGE_CONTRACT),),\n        stage="unit production page",\n    )\n\n    assert page["completed_deliverables"] == ["entity_runtime"]\n    assert page["complete"] is False\n    assert page["next_cursor"]\n    assert len(router.calls) == 2\n    second_user = router.calls[1]["messages"][1]["content"]\n    assert '\"current_target_deliverables\": [\"entity_runtime\", \"ui_runtime\"]' in second_user\n    second_system = router.calls[1]["messages"][0]["content"]\n    assert "RECOVERY MODE is host-narrowed" not in second_system\n    assert router.calls[1]["media_paths"] == ()\n\n\ndef test_production_page_can_repair_more_than_once() -> None:\n    router = _Router(\n        "not json",\n        "still not json",\n        json.dumps({"modules": [_module()]}),\n    )\n\n    page = complete_planner._generate_json_page_with_repair(\n        router,\n        system_prompt="Return the production page.",\n        request=_request(),\n        media_paths=(),\n        expected_contracts=(frozenset(complete_planner._PRODUCTION_PAGE_CONTRACT),),\n        stage="unit production page",\n    )\n\n    assert page["completed_deliverables"] == ["entity_runtime"]\n    assert len(router.calls) == 3\n    assert "REPAIR THIS PAGE" in router.calls[1]["messages"][0]["content"]\n    assert "REPAIR THIS PAGE" in router.calls[2]["messages"][0]["content"]\n\n\n'''
          new = '''def test_production_retry_keeps_requested_targets_after_invalid_first_page() -> None:\n    router = _Router(\n        "not json",\n        json.dumps(\n            {\n                "modules": [\n                    _module("entity_runtime_impl", implements=("entity_runtime",))\n                ]\n            }\n        ),\n    )\n\n    page = complete_planner._generate_json_page_with_repair(\n        router,\n        system_prompt="Implement ALL requested deliverables in this page.",\n        request=_request("entity_runtime", "ui_runtime"),\n        media_paths=("reference.png",),\n        expected_contracts=(frozenset(complete_planner._PRODUCTION_PAGE_CONTRACT),),\n        stage="unit production page",\n    )\n\n    assert page["completed_deliverables"] == ["entity_runtime"]\n    assert page["complete"] is False\n    assert page["next_cursor"]\n    assert len(router.calls) == 2\n    second_user = router.calls[1]["messages"][1]["content"]\n    assert '\"current_target_deliverables\": [\"entity_runtime\", \"ui_runtime\"]' in second_user\n    second_system = router.calls[1]["messages"][0]["content"]\n    assert "CORRECTION:" in second_system\n    assert router.calls[1]["media_paths"] == ()\n\n\ndef test_production_page_stops_after_one_full_page_retry() -> None:\n    router = _Router(\n        "not json",\n        "still not json",\n        json.dumps({"modules": [_module()]}),\n    )\n\n    with pytest.raises(\n        complete_planner.SpecValidationError,\n        match="failed after one page-local repair",\n    ):\n        complete_planner._generate_json_page_with_repair(\n            router,\n            system_prompt="Return the production page.",\n            request=_request(),\n            media_paths=(),\n            expected_contracts=(frozenset(complete_planner._PRODUCTION_PAGE_CONTRACT),),\n            stage="unit production page",\n        )\n\n    assert len(router.calls) == 2\n    assert "CORRECTION:" in router.calls[1]["messages"][0]["content"]\n\n\n'''
          if text.count(old) != 1:
              raise SystemExit('planner stream policy tests changed')
          planner_test.write_text(text.replace(old, new), encoding='utf-8')

          recovery = Path('tests/test_production_stream_resume_contract.py')
          text = recovery.read_text(encoding='utf-8')
          text = text.replace(\
              'from minecraft_mod_ai.production_stream_resume_contract import install as install_resume\n',\
              '',\
          )
          text = text.replace('    stream.install(complete_planner)\n    install_resume(complete_planner)\n', '')
          recovery.write_text(text, encoding='utf-8')
          PY
          git rm minecraft_mod_ai/production_stream_resume_contract.py
          git mv tests/test_production_stream_resume_contract.py tests/test_production_stream_recovery_contract.py
      - name: Verify single stream owner
        run: |
          python -m pip install --prefer-binary -e '.[dev]'
          if grep -R "production_stream_resume_contract\|install_production_stream_resume" -n minecraft_mod_ai tools --exclude-dir='__pycache__'; then exit 1; fi
          python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9
          python -m pytest -q \
            tests/test_runtime_bootstrap_clean.py \
            tests/test_planner_json_runtime_contract.py \
            tests/test_production_stream_recovery_contract.py \
            tests/test_production_page_durable_contract.py \
            tests/test_planner_incremental_repair_contract.py
          git diff --check
      - name: Commit and remove maintenance workflow
        run: |
          git rm .github/workflows/one-time-stream-owner-cleanup.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Give production streaming single ownership'
          git push origin HEAD:main
