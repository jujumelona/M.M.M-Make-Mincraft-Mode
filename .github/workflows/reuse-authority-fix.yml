name: One-shot authoritative reuse search fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reuse-authority-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Bind reuse search to approved semantics
        run: |
          python .github/scripts/reuse_authority_fix.py
          python -m compileall -q minecraft_mod_ai
          python -m pytest -q \
            tests/test_reuse_authoritative_search.py \
            tests/test_reuse_planner.py \
            tests/test_reuse_graph_expansion.py \
            tests/test_reuse_planner_integration.py
      - name: Commit fix directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            minecraft_mod_ai/reuse_planner.py \
            minecraft_mod_ai/requirement_catalog.py \
            tests/test_reuse_authoritative_search.py
          git rm .github/workflows/reuse-authority-fix.yml .github/scripts/reuse_authority_fix.py
          git commit -m "fix: bind reuse search to approved semantics"
          git push origin HEAD:main
