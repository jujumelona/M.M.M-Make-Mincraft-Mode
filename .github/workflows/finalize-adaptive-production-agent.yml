name: Finalize adaptive production agent

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-adaptive-production-agent.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply and validate adaptive production architecture
        run: |
          python -m pip install -q -e '.[dev]'
          python -m py_compile .github/scripts/finalize_adaptive_production_agent.py
          python .github/scripts/finalize_adaptive_production_agent.py
          python -m compileall -q minecraft_mod_ai tests
          python -m ruff check \
            minecraft_mod_ai/model_router.py \
            minecraft_mod_ai/agent_tool_runtime.py \
            minecraft_mod_ai/mcp_server.py \
            minecraft_mod_ai/skill_catalog.py \
            minecraft_mod_ai/agent_capability_context.py \
            minecraft_mod_ai/production_tools.py \
            minecraft_mod_ai/production_tool_parallel_contract.py \
            minecraft_mod_ai/custom_module_generator.py \
            minecraft_mod_ai/repair_engine.py \
            tests/test_adaptive_production_agent.py \
            tests/test_skill_policy.py \
            --select F,E7,E9
          python -m pytest -q \
            tests/test_adaptive_production_agent.py \
            tests/test_agent_tool_calling.py \
            tests/test_agent_capability_context.py \
            tests/test_agent_tool_runtime_colab_stdio.py \
            tests/test_skill_policy.py \
            tests/test_mcp_stdio.py \
            tests/test_rag_index.py \
            tests/test_custom_generation_search_contract.py \
            tests/test_repair_project_index_efficiency.py
      - name: Commit validated production agent to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/finalize-adaptive-production-agent.yml
          rm .github/scripts/finalize_adaptive_production_agent.py
          git add \
            minecraft_mod_ai/model_router.py \
            minecraft_mod_ai/agent_tool_runtime.py \
            minecraft_mod_ai/mcp_server.py \
            minecraft_mod_ai/skill_catalog.py \
            minecraft_mod_ai/agent_capability_context.py \
            minecraft_mod_ai/production_tools.py \
            minecraft_mod_ai/production_tool_parallel_contract.py \
            minecraft_mod_ai/custom_module_generator.py \
            minecraft_mod_ai/repair_engine.py \
            minecraft_mod_ai/packaged_skills.json \
            config/agent_roles.yaml \
            skills/ground-production-with-live-evidence/SKILL.md \
            tests/test_adaptive_production_agent.py \
            tests/test_skill_policy.py
          git add -A .github/scripts .github/workflows
          git diff --cached --check
          git commit -m "Make production agents continuously retrieve and validate evidence"
          git pull --rebase origin main
          git push origin HEAD:main
