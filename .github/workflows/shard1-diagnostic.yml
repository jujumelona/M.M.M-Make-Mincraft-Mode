name: Shard 1 diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/shard1-diagnostic.yml

permissions:
  contents: read

concurrency:
  group: shard1-diagnostic-main
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]
    name: Shard 1 diagnostic ${{ matrix.chunk }}/7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Run contiguous shard-1 slice
        env:
          CHUNK: ${{ matrix.chunk }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          dedicated = {
              "test_runtime_bootstrap_clean.py",
              "test_runtime_contract_composer.py",
              "test_runtime_contract_composer_ownership.py",
              "test_runtime_wrapper_signature_integrity.py",
              "test_minecraft_mcp_evidence_contract.py",
              "test_external_mcp_role_scope.py",
              "test_research_coordinator.py",
              "test_planner_template_schema.py",
              "test_conversational_ui.py",
              "test_agentic_search_efficiency_contract.py",
              "test_repair_candidate_purity_contract.py",
              "test_llama_parallel_runtime_contract.py",
          }
          files = [
              str(path)
              for index, path in enumerate(sorted(Path("tests").glob("test_*.py")))
              if path.name not in dedicated and index % 3 == 0
          ]
          chunk = int(os.environ["CHUNK"])
          width = (len(files) + 7) // 8
          selected = files[chunk * width : (chunk + 1) * width]
          print(f"shard1_files={len(files)} chunk={chunk} width={width} selected={len(selected)}", flush=True)
          for item in selected:
              print(f"SELECTED {item}", flush=True)
          if not selected:
              raise SystemExit(0)
          raise SystemExit(
              subprocess.call(
                  [
                      sys.executable,
                      "-m",
                      "pytest",
                      "-vv",
                      "--tb=short",
                      "--durations=15",
                      "--maxfail=25",
                      *selected,
                  ]
              )
          )
          PY
