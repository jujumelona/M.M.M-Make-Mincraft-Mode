name: One-shot public acceptance hotfix v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply deterministic acceptance hotfix
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/acceptance_hotfix.py
          python /tmp/acceptance_hotfix.py

      - name: Verify focused boundary regressions
        shell: bash
        run: |
          python -m compileall -q minecraft_mod_ai
          python -m pytest tests/test_public_acceptance_runtime_boundary.py -q
          python .github/scripts/audit_runtime_mutations.py

      - name: Commit fixed sources to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/one-shot-public-acceptance-hotfix.yml .github/workflows/one-shot-public-acceptance-hotfix-v2.yml
          git add minecraft_mod_ai/production_boundary_contract.py minecraft_mod_ai/production_contract.py minecraft_mod_ai/llama_model.py tests/test_public_acceptance_runtime_boundary.py
          git commit -m 'fix: sanitize public acceptance before production validation'
          git push origin HEAD:main
