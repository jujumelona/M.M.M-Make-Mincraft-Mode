name: Apply custom ProjectIndex hot-path fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-custom-index-hotpath.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reuse existing ProjectIndex manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('minecraft_mod_ai/custom_module_generator.py')
          text = path.read_text(encoding='utf-8')
          old = '''        live_manifest = ProjectIndex(root, policy=self.policy).manifest_receipt()
          ProductionToolService(
          '''
          new = '''        # Reuse the whole-project index already built above. Constructing a second
        # ProjectIndex here rescans every source file before every custom-module decode.
        # Refresh only when a concurrent generation lane changed the source tree.
        try:
            live_manifest = index.manifest_receipt()
        except ValueError as exc:
            if not _is_stale_project_index_error(exc):
                raise
            index = ProjectIndex(root, policy=self.policy)
            self._cached_index = index
            self._cached_root = root
            live_manifest = index.manifest_receipt()
        ProductionToolService(
          '''
          if old not in text:
              raise SystemExit('target ProjectIndex hot path not found')
          text = text.replace(old, new, 1)
          compile(text, str(path), 'exec')
          path.write_text(text, encoding='utf-8')
          PY
          python -m pip install -q -e '.[dev]'
          python -m ruff check minecraft_mod_ai/custom_module_generator.py --select F,E7,E9
          python -m pytest -q \
            tests/test_project_context_pagination.py \
            tests/test_research_ledger.py \
            tests/test_custom_generation_search_contract.py \
            tests/test_custom_generation_efficiency_contract.py
      - name: Commit hot-path fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-custom-index-hotpath.yml
          git add -A
          git diff --cached --check
          git commit -m "Reuse cached ProjectIndex in custom generation"
          git pull --rebase origin main
          git push origin HEAD:main
