name: Pre-design Provider Pagination

on:
  push:
    paths:
      - .github/workflows/patch-predesign-provider-pagination.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Patch provider pagination and parallel body acquisition
        run: |
          python - <<'PY'
          from inspect import cleandoc
          from pathlib import Path

          path = Path('minecraft_mod_ai/pre_design_grounded_rag.py')
          text = path.read_text(encoding='utf-8')
          anchor = '_MAX_QUERY_WORKERS = max(1, min(8, int(os.environ.get("MMM_PREDESIGN_QUERY_WORKERS", "4") or 4)))\n'
          if '_MAX_SOURCE_WORKERS' not in text:
              if anchor not in text:
                  raise SystemExit('query worker anchor missing')
              text = text.replace(
                  anchor,
                  anchor
                  + '_MAX_SOURCE_WORKERS = max(\n'
                  + '    1, min(16, int(os.environ.get("MMM_PREDESIGN_SOURCE_WORKERS", "8") or 8))\n'
                  + ')\n',
                  1,
              )

          start = text.index('def _search_modrinth(')
          end = text.index('\ndef _search_curseforge(', start)
          modrinth = cleandoc('''
          def _search_modrinth(query: str) -> tuple[list[dict[str, Any]], dict[str, Any]]:
              records: list[dict[str, Any]] = []
              errors: list[str] = []
              seen: set[str] = set()
              offset = 0
              search_requests = 0
              source_requests = 0
              provider_total = 0
              while True:
                  params = urllib.parse.urlencode(
                      {
                          "query": _query_terms(query),
                          "limit": 100,
                          "offset": offset,
                          "index": "relevance",
                          "facets": json.dumps([["project_type:mod"]]),
                      }
                  )
                  payload = _json(f"https://api.modrinth.com/v2/search?{params}")
                  search_requests += 1
                  raw_hits = payload.get("hits", []) if isinstance(payload, Mapping) else []
                  hits = [hit for hit in raw_hits if isinstance(hit, Mapping)] if isinstance(raw_hits, list) else []
                  if not hits:
                      break
                  try:
                      provider_total = max(provider_total, int(payload.get("total_hits", 0) or 0))
                  except (TypeError, ValueError, OverflowError):
                      provider_total = max(provider_total, offset + len(hits))

                  project_ids = list(
                      dict.fromkeys(
                          str(hit.get("project_id") or "").strip()
                          for hit in hits
                          if str(hit.get("project_id") or "").strip()
                      )
                  )
                  details: dict[str, Mapping[str, Any]] = {}
                  if project_ids:
                      source_requests += 1
                      try:
                          detail_params = urllib.parse.urlencode(
                              {"ids": json.dumps(project_ids, separators=(",", ":"))}
                          )
                          fetched = _json(
                              f"https://api.modrinth.com/v2/projects?{detail_params}"
                          )
                          if isinstance(fetched, list):
                              details = {
                                  str(item.get("id") or "").strip(): item
                                  for item in fetched
                                  if isinstance(item, Mapping)
                                  and str(item.get("id") or "").strip()
                              }
                      except Exception as exc:  # noqa: BLE001 - provider failure is recorded per page
                          errors.append(f"bulk-projects:{type(exc).__name__}:{exc}")

                  for hit in hits:
                      project_id = str(hit.get("project_id") or "").strip()
                      slug = str(hit.get("slug") or project_id).strip()
                      detail = details.get(project_id, hit)
                      body = str(detail.get("body") or hit.get("description") or "").strip()
                      source_key = project_id or slug
                      if not body or not source_key or source_key in seen:
                          continue
                      seen.add(source_key)
                      game_versions = detail.get("game_versions")
                      if not isinstance(game_versions, list):
                          game_versions = hit.get("versions")
                      records.append(
                          {
                              "source_id": f"modrinth:{source_key}",
                              "source_type": "modrinth_project_body",
                              "source_locator": f"modrinth:{source_key}",
                              "url": f"https://modrinth.com/mod/{slug}",
                              "title": str(detail.get("title") or hit.get("title") or slug),
                              "content": body,
                              "content_sha256": _sha256_text(body),
                              "body_retrieved": True,
                              "evidence_origin": "modrinth_project_body",
                              "metadata": {
                                  "project_id": project_id,
                                  "slug": slug,
                                  "versions": list(game_versions or []),
                                  "source_url": str(detail.get("source_url") or ""),
                              },
                          }
                      )

                  try:
                      server_offset = int(payload.get("offset", offset) or offset)
                  except (TypeError, ValueError, OverflowError):
                      server_offset = offset
                  next_offset = server_offset + len(hits)
                  if next_offset <= offset:
                      errors.append("nonadvancing_search_offset")
                      break
                  if provider_total and next_offset >= provider_total:
                      break
                  if len(hits) < 100 and not provider_total:
                      break
                  offset = next_offset

              return records, {
                  "provider": "modrinth",
                  "status": "available",
                  "result_count": len(records),
                  "provider_total": provider_total,
                  "search_requests": search_requests,
                  "source_requests": source_requests,
                  "detail_errors": errors,
              }
          ''') + '\n\n'
          text = text[:start] + modrinth + text[end + 1:]

          start = text.index('def _search_curseforge(')
          end = text.index('\ndef _search_github(', start)
          curseforge = cleandoc('''
          def _search_curseforge(query: str) -> tuple[list[dict[str, Any]], dict[str, Any]]:
              key = os.environ.get("CURSEFORGE_API_KEY", "").strip()
              if not key:
                  return [], {
                      "provider": "curseforge",
                      "status": "not_configured",
                      "result_count": 0,
                  }
              headers = {"x-api-key": key}
              records: list[dict[str, Any]] = []
              errors: list[str] = []
              seen: set[int] = set()
              index = 0
              search_requests = 0
              source_requests = 0
              provider_total = 0

              def description(mod_id: int) -> tuple[int, str, str]:
                  try:
                      desc = _json(
                          f"https://api.curseforge.com/v1/mods/{mod_id}/description",
                          headers,
                      )
                      if isinstance(desc, Mapping) and str(desc.get("data") or "").strip():
                          body = " ".join(
                              re.sub(r"<[^>]+>", " ", str(desc["data"])).split()
                          )
                          return mod_id, body, ""
                  except Exception as exc:  # noqa: BLE001 - one source must not cancel the page
                      return mod_id, "", f"{mod_id}:{type(exc).__name__}:{exc}"
                  return mod_id, "", ""

              while True:
                  params = urllib.parse.urlencode(
                      {
                          "gameId": 432,
                          "searchFilter": _query_terms(query),
                          "index": index,
                          "pageSize": 50,
                          "sortField": 2,
                          "sortOrder": "desc",
                      }
                  )
                  payload = _json(
                      f"https://api.curseforge.com/v1/mods/search?{params}", headers
                  )
                  search_requests += 1
                  raw_rows = payload.get("data", []) if isinstance(payload, Mapping) else []
                  rows = [row for row in raw_rows if isinstance(row, Mapping)] if isinstance(raw_rows, list) else []
                  if not rows:
                      break

                  mod_ids = [
                      int(row["id"])
                      for row in rows
                      if isinstance(row.get("id"), int) and int(row["id"]) not in seen
                  ]
                  source_requests += len(mod_ids)
                  descriptions: dict[int, str] = {}
                  if mod_ids:
                      workers = min(_MAX_SOURCE_WORKERS, len(mod_ids))
                      with ThreadPoolExecutor(max_workers=workers) as pool:
                          futures = [pool.submit(description, mod_id) for mod_id in mod_ids]
                          for future in as_completed(futures):
                              mod_id, body, error = future.result()
                              if body:
                                  descriptions[mod_id] = body
                              if error:
                                  errors.append(error)

                  for row in rows:
                      if not isinstance(row.get("id"), int):
                          continue
                      mod_id = int(row["id"])
                      if mod_id in seen:
                          continue
                      seen.add(mod_id)
                      body = descriptions.get(mod_id) or str(row.get("summary") or "").strip()
                      if not body:
                          continue
                      links = row.get("links") if isinstance(row.get("links"), Mapping) else {}
                      records.append(
                          {
                              "source_id": f"curseforge:{mod_id}",
                              "source_type": "curseforge_mod_body",
                              "source_locator": f"curseforge:{mod_id}",
                              "url": str(links.get("websiteUrl") or ""),
                              "title": str(row.get("name") or mod_id),
                              "content": body,
                              "content_sha256": _sha256_text(body),
                              "body_retrieved": True,
                              "evidence_origin": "curseforge_mod_body",
                              "metadata": {
                                  "mod_id": mod_id,
                                  "slug": str(row.get("slug") or ""),
                                  "source_url": str(links.get("sourceUrl") or ""),
                              },
                          }
                      )

                  pagination = payload.get("pagination") if isinstance(payload, Mapping) else None
                  if not isinstance(pagination, Mapping):
                      if len(rows) < 50:
                          break
                      next_index = index + len(rows)
                  else:
                      try:
                          server_index = int(pagination.get("index", index) or index)
                          result_count = int(pagination.get("resultCount", len(rows)) or len(rows))
                          provider_total = max(
                              provider_total,
                              int(pagination.get("totalCount", 0) or 0),
                          )
                      except (TypeError, ValueError, OverflowError):
                          server_index = index
                          result_count = len(rows)
                      next_index = server_index + result_count
                      if provider_total and next_index >= provider_total:
                          break
                  if next_index <= index:
                      errors.append("nonadvancing_search_index")
                      break
                  index = next_index

              return records, {
                  "provider": "curseforge",
                  "status": "available",
                  "result_count": len(records),
                  "provider_total": provider_total,
                  "search_requests": search_requests,
                  "source_requests": source_requests,
                  "detail_errors": errors,
              }
          ''') + '\n\n'
          text = text[:start] + curseforge + text[end + 1:]

          start = text.index('def _search_github(')
          end = text.index('\ndef _versions(', start)
          github = cleandoc('''
          def _search_github(
              query: str,
              *,
              disabled: Callable[[], bool] | None = None,
              disable: Callable[[], None] | None = None,
          ) -> tuple[list[dict[str, Any]], dict[str, Any]]:
              if disabled is not None and disabled():
                  return [], {
                      "provider": "github",
                      "status": "disabled_after_rate_or_auth_failure",
                      "result_count": 0,
                  }
              token = os.environ.get("GITHUB_TOKEN", "").strip()
              headers = {"Authorization": f"Bearer {token}"} if token else {}
              records: list[dict[str, Any]] = []
              readme_errors: list[str] = []
              seen: set[str] = set()
              page = 1
              consumed = 0
              search_requests = 0
              source_requests = 0
              provider_total = 0

              def repository_body(row: Mapping[str, Any]) -> tuple[str, str, str]:
                  full_name = str(row.get("full_name") or "").strip()
                  if not full_name:
                      return "", "", ""
                  body = str(row.get("description") or "").strip()
                  try:
                      fetched = _text(
                          f"https://api.github.com/repos/{full_name}/readme", headers
                      ).strip()
                      if fetched:
                          body = fetched
                  except urllib.error.HTTPError as exc:
                      if exc.code in {401, 403, 429} and disable is not None:
                          disable()
                      return full_name, body, f"{full_name}:{type(exc).__name__}:{exc}"
                  except Exception as exc:  # noqa: BLE001 - one README must not cancel prior evidence
                      return full_name, body, f"{full_name}:{type(exc).__name__}:{exc}"
                  return full_name, body, ""

              while True:
                  if disabled is not None and disabled():
                      break
                  params = urllib.parse.urlencode(
                      {
                          "q": _query_terms(query) + " minecraft fabric mod",
                          "per_page": 100,
                          "page": page,
                      }
                  )
                  try:
                      payload = _json(
                          f"https://api.github.com/search/repositories?{params}", headers
                      )
                  except urllib.error.HTTPError as exc:
                      if exc.code in {401, 403, 429} and disable is not None:
                          disable()
                      if exc.code == 422 and records:
                          readme_errors.append(
                              f"search_page_{page}:{type(exc).__name__}:{exc}"
                          )
                          break
                      raise
                  search_requests += 1
                  raw_rows = payload.get("items", []) if isinstance(payload, Mapping) else []
                  rows = [row for row in raw_rows if isinstance(row, Mapping)] if isinstance(raw_rows, list) else []
                  if not rows:
                      break
                  try:
                      provider_total = max(
                          provider_total, int(payload.get("total_count", 0) or 0)
                      )
                  except (TypeError, ValueError, OverflowError):
                      provider_total = max(provider_total, consumed + len(rows))

                  candidates = [
                      row
                      for row in rows
                      if str(row.get("full_name") or "").strip() not in seen
                  ]
                  source_requests += len(candidates)
                  bodies: dict[str, str] = {}
                  if candidates:
                      workers = min(_MAX_SOURCE_WORKERS, len(candidates))
                      with ThreadPoolExecutor(max_workers=workers) as pool:
                          futures = [pool.submit(repository_body, row) for row in candidates]
                          for future in as_completed(futures):
                              full_name, body, error = future.result()
                              if full_name and body:
                                  bodies[full_name] = body
                              if error:
                                  readme_errors.append(error)

                  for row in rows:
                      full_name = str(row.get("full_name") or "").strip()
                      if not full_name or full_name in seen:
                          continue
                      seen.add(full_name)
                      body = bodies.get(full_name) or str(row.get("description") or "").strip()
                      if not body:
                          continue
                      records.append(
                          {
                              "source_id": f"github:{full_name}",
                              "source_type": "github_repository_body",
                              "source_locator": f"github:{full_name}",
                              "url": str(row.get("html_url") or f"https://github.com/{full_name}"),
                              "title": str(row.get("name") or full_name),
                              "content": body,
                              "content_sha256": _sha256_text(body),
                              "body_retrieved": True,
                              "evidence_origin": "github_readme_body",
                              "metadata": {
                                  "repository": full_name,
                                  "default_branch": str(row.get("default_branch") or ""),
                              },
                          }
                      )
                  consumed += len(rows)
                  if provider_total and consumed >= provider_total:
                      break
                  page += 1

              status = (
                  "disabled_after_rate_or_auth_failure"
                  if disabled is not None and disabled()
                  else "available"
              )
              return records, {
                  "provider": "github",
                  "status": status,
                  "result_count": len(records),
                  "provider_total": provider_total,
                  "readme_errors": readme_errors,
                  "search_requests": search_requests,
                  "source_requests": source_requests,
              }
          ''') + '\n\n'
          text = text[:start] + github + text[end + 1:]
          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_predesign_provider_pagination.py')
          test.write_text('''from __future__ import annotations\n\nimport json\nimport urllib.parse\n\nfrom minecraft_mod_ai import pre_design_grounded_rag as rag\n\n\ndef _query(url: str) -> dict[str, list[str]]:\n    return urllib.parse.parse_qs(urllib.parse.urlparse(url).query)\n\n\ndef test_modrinth_paginates_and_bulk_fetches_full_projects(monkeypatch):\n    calls: list[str] = []\n\n    def fake_json(url, headers=None):\n        calls.append(url)\n        if "/v2/search?" in url:\n            offset = int(_query(url).get("offset", ["0"])[0])\n            if offset == 0:\n                return {"offset": 0, "total_hits": 3, "hits": [\n                    {"project_id": "a", "slug": "a", "title": "A", "description": "summary-a", "versions": ["1"]},\n                    {"project_id": "b", "slug": "b", "title": "B", "description": "summary-b", "versions": ["1"]},\n                ]}\n            if offset == 2:\n                return {"offset": 2, "total_hits": 3, "hits": [\n                    {"project_id": "c", "slug": "c", "title": "C", "description": "summary-c", "versions": ["2"]},\n                ]}\n            return {"offset": offset, "total_hits": 3, "hits": []}\n        if "/v2/projects?" in url:\n            ids = json.loads(_query(url)["ids"][0])\n            return [\n                {"id": project_id, "slug": project_id, "title": project_id.upper(), "body": f"full-{project_id}", "source_url": f"https://github.com/x/{project_id}", "game_versions": ["9"]}\n                for project_id in ids\n            ]\n        raise AssertionError(url)\n\n    monkeypatch.setattr(rag, "_json", fake_json)\n    records, receipt = rag._search_modrinth("space trading")\n    assert [record["source_id"] for record in records] == ["modrinth:a", "modrinth:b", "modrinth:c"]\n    assert [record["content"] for record in records] == ["full-a", "full-b", "full-c"]\n    assert all(record["metadata"]["versions"] == ["9"] for record in records)\n    assert receipt["search_requests"] == 2\n    assert receipt["source_requests"] == 2\n    assert receipt["provider_total"] == 3\n    assert sum("/v2/projects?" in call for call in calls) == 2\n\n\ndef test_curseforge_paginates_and_fetches_all_descriptions(monkeypatch):\n    def fake_json(url, headers=None):\n        if "/mods/search?" in url:\n            index = int(_query(url).get("index", ["0"])[0])\n            if index == 0:\n                return {"data": [\n                    {"id": 1, "name": "one", "summary": "s1", "links": {}},\n                    {"id": 2, "name": "two", "summary": "s2", "links": {}},\n                ], "pagination": {"index": 0, "pageSize": 50, "resultCount": 2, "totalCount": 3}}\n            if index == 2:\n                return {"data": [\n                    {"id": 3, "name": "three", "summary": "s3", "links": {}},\n                ], "pagination": {"index": 2, "pageSize": 50, "resultCount": 1, "totalCount": 3}}\n        if "/description" in url:\n            mod_id = url.split("/mods/", 1)[1].split("/", 1)[0]\n            return {"data": f"<p>full-{mod_id}</p>"}\n        raise AssertionError(url)\n\n    monkeypatch.setenv("CURSEFORGE_API_KEY", "test")\n    monkeypatch.setattr(rag, "_json", fake_json)\n    records, receipt = rag._search_curseforge("space trading")\n    assert [record["source_id"] for record in records] == ["curseforge:1", "curseforge:2", "curseforge:3"]\n    assert [record["content"] for record in records] == ["full-1", "full-2", "full-3"]\n    assert receipt["search_requests"] == 2\n    assert receipt["source_requests"] == 3\n    assert receipt["provider_total"] == 3\n\n\ndef test_github_fallback_paginates_and_fetches_all_readmes(monkeypatch):\n    def fake_json(url, headers=None):\n        if "/search/repositories?" not in url:\n            raise AssertionError(url)\n        page = int(_query(url).get("page", ["1"])[0])\n        if page == 1:\n            return {"total_count": 3, "items": [\n                {"full_name": "x/one", "name": "one", "description": "s1", "html_url": "https://github.com/x/one", "default_branch": "main"},\n                {"full_name": "x/two", "name": "two", "description": "s2", "html_url": "https://github.com/x/two", "default_branch": "main"},\n            ]}\n        if page == 2:\n            return {"total_count": 3, "items": [\n                {"full_name": "x/three", "name": "three", "description": "s3", "html_url": "https://github.com/x/three", "default_branch": "main"},\n            ]}\n        return {"total_count": 3, "items": []}\n\n    monkeypatch.setattr(rag, "_json", fake_json)\n    monkeypatch.setattr(rag, "_text", lambda url, headers=None: "README-" + url.split("/repos/", 1)[1].split("/readme", 1)[0])\n    records, receipt = rag._search_github("space trading")\n    assert [record["source_id"] for record in records] == ["github:x/one", "github:x/two", "github:x/three"]\n    assert [record["content"] for record in records] == ["README-x/one", "README-x/two", "README-x/three"]\n    assert receipt["search_requests"] == 2\n    assert receipt["source_requests"] == 3\n    assert receipt["provider_total"] == 3\n''', encoding='utf-8')
          PY
      - name: Verify provider-complete discovery
        run: |
          python -m pip install --prefer-binary -e '.[dev]'
          python -m ruff check --fix --ignore BLE001 minecraft_mod_ai/pre_design_grounded_rag.py tests/test_predesign_provider_pagination.py
          python -m py_compile minecraft_mod_ai/pre_design_grounded_rag.py
          python -m ruff check --ignore BLE001 minecraft_mod_ai/pre_design_grounded_rag.py tests/test_predesign_provider_pagination.py
          python -m pytest -q tests/test_predesign_provider_pagination.py tests/test_predesign_source_discovery_contract.py tests/test_pre_design_external_source_acquisition.py tests/test_pre_design_phase_contract.py tests/test_pre_design_live_retrieval_route.py
      - name: Commit production and regressions
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add minecraft_mod_ai/pre_design_grounded_rag.py tests/test_predesign_provider_pagination.py
          git diff --cached --check
          git commit -m 'perf: paginate predesign providers without evidence caps'
          git push origin HEAD:main
