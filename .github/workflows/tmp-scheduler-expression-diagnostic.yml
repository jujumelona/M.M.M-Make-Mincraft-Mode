name: Temporary Scheduler Expression Diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-scheduler-expression-diagnostic.yml']
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: python -m pip install -q -e '.[dev]'
      - run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          import minecraft_mod_ai.complete_orchestrator as o
          import minecraft_mod_ai.work_graph as w
          import minecraft_mod_ai.scheduler_parallel_safety_contract as s
          from minecraft_mod_ai.work_graph import DurableWorkLedger, WorkGraphPlan, WorkNode, WorkState
          def n(i,st): return WorkNode(node_id=i,stage=st,input_hash='sha256:'+i,dependencies=(),payload={'kind':'test','resource_class':'cpu_io'},resource_class='cpu_io')
          s.install(work_graph_module=w,orchestrator_module=o)
          p=WorkGraphPlan(schema_version='mmm/production-work-graph-v1',proposal_hash='sha256:diag2',graph_hash='sha256:g',module_count=0,nodes=(n('a','generate:content'),n('b','generate:content'),n('c','generate:system')))
          l=DurableWorkLedger(Path(tempfile.mkdtemp())/'x.sqlite',proposal_hash=p.proposal_hash); l.sync_plan(p)
          l.claim_ready('mmm-orchestrator',stages=('generate:content','generate:system'),lease_seconds=60)
          c=l._connect(); r=s._resource_sql(''); ph=','.join('?' for _ in s._SERIAL_CPU_STAGES)
          print('SERIAL',repr(s._SERIAL_CPU_STAGES)); print('RESOURCE_SQL',r)
          print('ALL',c.execute(f"SELECT node_id,stage,state,{r},stage IN ({ph}) FROM tasks ORDER BY node_id",s._SERIAL_CPU_STAGES).fetchall())
          print('STATE',repr(WorkState.RUNNING.value))
          print('ONLY_STAGE',c.execute(f"SELECT node_id FROM tasks WHERE state=? AND stage IN ({ph})",(WorkState.RUNNING.value,*s._SERIAL_CPU_STAGES)).fetchall())
          print('ONLY_RESOURCE',c.execute(f"SELECT node_id FROM tasks WHERE state=? AND {r}='cpu_io'",(WorkState.RUNNING.value,)).fetchall())
          print('BOTH',c.execute(f"SELECT node_id FROM tasks WHERE state=? AND stage IN ({ph}) AND {r}='cpu_io'",(WorkState.RUNNING.value,*s._SERIAL_CPU_STAGES)).fetchall())
          PY