name: Apply structured tool payload split

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-structured-tool-payload-split.yml
      - .github/scripts/apply_structured_tool_payload_split.py

permissions:
  contents: write

concurrency:
  group: apply-structured-tool-payload-split-main
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply integration patch
        run: python .github/scripts/apply_structured_tool_payload_split.py
      - name: Static verification
        run: |
          python -m compileall -q minecraft_mod_ai tests tools
          python -m ruff check minecraft_mod_ai tests tools --select F,E7,E9
          python .github/scripts/debug_repo_audit.py
          git diff --check
      - name: Targeted planner and llama contracts
        run: |
          python -m pytest -q \
            tests/test_game_design_router.py \
            tests/test_large_request_ingestion.py \
            tests/test_llama_structured_reasoning_stream.py \
            tests/test_llama_server_streaming.py \
            tests/test_llama_cpp_adapter_request_contract.py \
            tests/test_model_router_tools.py
      - name: Full test suite
        run: python -m pytest -q
      - name: Commit verified integration and self-delete
        run: |
          git rm .github/workflows/apply-structured-tool-payload-split.yml
          git rm .github/scripts/apply_structured_tool_payload_split.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Split structured and tool native llama payloads'
          git pull --rebase origin main
          git push origin HEAD:main
