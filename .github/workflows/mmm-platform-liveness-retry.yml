name: MMM platform discovery liveness retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mmm-platform-liveness-retry.yml'

permissions:
  contents: write

concurrency:
  group: mmm-platform-liveness-fix-main
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Sync latest main
        run: git pull --ff-only origin main
      - name: Reuse tested platform patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/mmm-platform-liveness-fix.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          exec(compile(textwrap.dedent(workflow[start:end]), '<platform-liveness-patch>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Compile
        run: |
          python -m py_compile \
            minecraft_mod_ai/platform_live_discovery.py \
            tests/test_platform_live_discovery_deadline_contract.py
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Run focused live-discovery regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_platform_live_discovery_deadline_contract.py \
            tests/test_remaining_bottleneck_contract.py \
            tests/test_retrieval_liveness_deadline_contract.py
          mapfile -t live_tests < <(find tests -maxdepth 1 -type f \( -name '*live*discovery*' -o -name '*platform_live*' \) ! -name 'test_platform_live_discovery_deadline_contract.py' -print)
          if ((${#live_tests[@]})); then
            python -m pytest -q "${live_tests[@]}"
          fi
      - name: Check correctness/import regressions
        run: |
          ruff check --select F,I --fix \
            minecraft_mod_ai/platform_live_discovery.py \
            tests/test_platform_live_discovery_deadline_contract.py
          ruff check --select F,I \
            minecraft_mod_ai/platform_live_discovery.py \
            tests/test_platform_live_discovery_deadline_contract.py
          python -m py_compile minecraft_mod_ai/platform_live_discovery.py
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            .github/workflows/mmm-platform-liveness-fix.yml \
            .github/workflows/mmm-platform-liveness-retry.yml
          git add \
            minecraft_mod_ai/platform_live_discovery.py \
            tests/test_platform_live_discovery_deadline_contract.py
          git commit -m 'fix: bound platform discovery waits'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            sleep $((attempt * 2))
          done
          echo 'failed to push platform liveness fix after retries' >&2
          exit 1
