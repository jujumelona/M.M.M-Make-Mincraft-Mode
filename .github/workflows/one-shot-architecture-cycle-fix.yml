name: One-shot architecture cycle fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-architecture-cycle-fix.yml'

concurrency:
  group: one-shot-architecture-cycle-fix-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build current and baseline snapshots
        run: |
          mkdir -p /tmp/mmm-export/current /tmp/mmm-export/baseline
          cp -a minecraft_mod_ai tests tools .github pyproject.toml download_resources.py README.md /tmp/mmm-export/current/
          git archive 9c1a538b3c0d9062356e6192bf991e7ce2cc8f53 minecraft_mod_ai tools | tar -x -C /tmp/mmm-export/baseline
          tar -czf /tmp/mmm-source-with-baseline.tar.gz -C /tmp/mmm-export current baseline
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mmm-source-with-baseline-${{ github.sha }}
          path: /tmp/mmm-source-with-baseline.tar.gz
          retention-days: 1
