name: One-shot architecture cycle fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-architecture-cycle-fix.yml'

concurrency:
  group: one-shot-architecture-cycle-fix-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build source snapshot
        run: |
          tar -czf /tmp/mmm-source.tar.gz \
            minecraft_mod_ai tests tools .github pyproject.toml download_resources.py README.md
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mmm-source-${{ github.sha }}
          path: /tmp/mmm-source.tar.gz
          retention-days: 1
