name: Native work graph cleanup

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/native-work-graph-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-work-graph-cleanup-main
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebase onto latest main
        run: git pull --rebase origin main

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Move work graph efficiency into its owner
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path
          import textwrap

          root = Path.cwd()
          work_graph_path = root / "minecraft_mod_ai" / "work_graph.py"
          efficiency_path = root / "minecraft_mod_ai" / "max_efficiency_runtime_contract.py"
          bootstrap_path = root / "minecraft_mod_ai" / "runtime_bootstrap.py"

          def replace_span(source: str, node: ast.AST, replacement: str, *, indent: str = "") -> str:
              lines = source.splitlines(keepends=True)
              decorators = getattr(node, "decorator_list", ())
              start_line = min((item.lineno for item in decorators), default=node.lineno)
              start = start_line - 1
              end = node.end_lineno
              rendered = textwrap.dedent(replacement).strip("\n")
              if rendered and indent:
                  rendered = textwrap.indent(rendered, indent)
              chunk = rendered + "\n\n" if rendered else ""
              return "".join(lines[:start]) + chunk + "".join(lines[end:])

          def top_function(source: str, name: str) -> ast.FunctionDef:
              for node in ast.parse(source).body:
                  if isinstance(node, ast.FunctionDef) and node.name == name:
                      return node
              raise RuntimeError(f"top-level function not found: {name}")

          def class_method(source: str, class_name: str, method_name: str) -> ast.FunctionDef:
              for node in ast.parse(source).body:
                  if isinstance(node, ast.ClassDef) and node.name == class_name:
                      for child in node.body:
                          if isinstance(child, ast.FunctionDef) and child.name == method_name:
                              return child
              raise RuntimeError(f"method not found: {class_name}.{method_name}")

          def top_assignment(source: str, name: str) -> ast.AST:
              for node in ast.parse(source).body:
                  if isinstance(node, ast.Assign) and any(
                      isinstance(target, ast.Name) and target.id == name for target in node.targets
                  ):
                      return node
                  if isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name) and node.target.id == name:
                      return node
              raise RuntimeError(f"top-level assignment not found: {name}")

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              if source.count(old) != 1:
                  raise RuntimeError(f"expected exactly one {label}, found {source.count(old)}")
              return source.replace(old, new, 1)

          work_graph = work_graph_path.read_text(encoding="utf-8")
          work_graph = replace_once(
              work_graph,
              """    policy = policy or ScalePolicy.from_environment()\n    proposal.validate(policy=policy)\n    proposal_hash = proposal.calculate_hash()\n    selected_modules = tuple(proposal.modules) if modules is None else tuple(modules)\n    for module in selected_modules:\n        module.validate(policy=policy)\n""",
              """    policy = policy or ScalePolicy.from_environment()\n    proposal.validate(policy=policy)\n    proposal_hash = proposal.approval_hash or proposal.calculate_hash()\n    selected_modules = tuple(proposal.modules) if modules is None else tuple(modules)\n    if modules is not None:\n        for module in selected_modules:\n            module.validate(policy=policy)\n""",
              "build validation/hash block",
          )

          work_graph = replace_span(
              work_graph,
              class_method(work_graph, "DurableWorkLedger", "tasks"),
              '''
              def tasks(self, *, cursor: str='', limit: int=100, state: WorkState | None=None) -> dict[str, Any]:
                  if not 1 <= limit <= 1000:
                      raise WorkGraphError('Task page size must be between 1 and 1000.')
                  clauses = ['node_id > ?']
                  params: list[Any] = [cursor]
                  if state is not None:
                      clauses.append('state = ?')
                      params.append(state.value)
                  params.append(limit + 1)
                  with self._connect() as connection:
                      rows = connection.execute(f"""
                          SELECT node_id, stage, input_hash, payload_json, state,
                                 attempt, lease_owner, lease_until, output_hash,
                                 receipt_json, error, updated_at
                          FROM tasks
                          WHERE {' AND '.join(clauses)}
                          ORDER BY node_id LIMIT ?
                          """, tuple(params)).fetchall()
                      page_rows = rows[:limit]
                      node_ids = [str(row[0]) for row in page_rows]
                      dependencies: dict[str, list[str]] = {node_id: [] for node_id in node_ids}
                      for start in range(0, len(node_ids), 900):
                          batch = node_ids[start:start + 900]
                          if not batch:
                              continue
                          placeholders = ','.join('?' for _ in batch)
                          for node_id, dependency_id in connection.execute(f"""
                              SELECT node_id, dependency_id FROM edges
                              WHERE node_id IN ({placeholders})
                              ORDER BY node_id, dependency_id
                              """, tuple(batch)):
                              dependencies[str(node_id)].append(str(dependency_id))

                  page = [
                      {
                          'node_id': row[0],
                          'stage': row[1],
                          'input_hash': row[2],
                          'payload': json.loads(row[3]),
                          'state': row[4],
                          'attempt': row[5],
                          'lease_owner': row[6],
                          'lease_until': row[7],
                          'output_hash': row[8],
                          'receipt': json.loads(row[9]) if row[9] else None,
                          'error': row[10],
                          'updated_at': row[11],
                          'dependencies': dependencies[str(row[0])],
                      }
                      for row in page_rows
                  ]
                  return {
                      'schema_version': 'mmm/work-task-page-v1',
                      'tasks': page,
                      'next_cursor': page[-1]['node_id'] if len(rows) > limit else '',
                  }
              ''',
              indent="    ",
          )

          work_graph = replace_span(
              work_graph,
              class_method(work_graph, "DurableWorkLedger", "summary"),
              '''
              def summary(self) -> dict[str, Any]:
                  with self._connect() as connection:
                      counts = {row[0]: row[1] for row in connection.execute('SELECT state, COUNT(*) FROM tasks GROUP BY state')}
                      total = sum(counts.values())
                      checkpoint_counts = {row[0]: row[1] for row in connection.execute('SELECT state, COUNT(*) FROM checkpoints GROUP BY state')}
                      cancel_requested = self._meta(connection, 'cancel_requested')
                      graph_hash = self._meta(connection, 'graph_hash')
                      module_count = self._meta(connection, 'module_count')
                  completed = counts.get(WorkState.SUCCEEDED.value, 0)
                  return {
                      'schema_version': 'mmm/work-ledger-summary-v1',
                      'proposal_hash': self.proposal_hash,
                      'graph_hash': graph_hash,
                      'module_count': int(module_count or '0'),
                      'task_count': total,
                      'counts': counts,
                      'checkpoint_counts': checkpoint_counts,
                      'cancel_requested': cancel_requested or None,
                      'progress': 1.0 if total == 0 else round(completed / total, 6),
                  }
              ''',
              indent="    ",
          )

          work_graph = replace_span(
              work_graph,
              top_function(work_graph, "_module_stage"),
              '''
              def _module_stage(module: ProductionModule) -> str:
                  if is_research_shard(module) or module.kind == 'research_shard':
                      return 'content'
                  if module.kind == 'integration':
                      if str(module.config.get('integration_type', '')) == 'mmm_local_ai_sidecar':
                          return 'content'
                      return 'custom'
                  if module.kind == 'custom_java' or module.config.get('implementation') == 'custom':
                      return 'custom'
                  if module.kind in {'entity', 'boss', 'npc'}:
                      return 'entity'
                  if module.kind in {'quest', 'class', 'skill', 'economy', 'shop', 'gui', 'networking', 'party', 'guild'}:
                      return 'system'
                  extended_kinds = {'item', 'block', 'fluid', 'status_effect', 'effect', 'enchantment', 'command', 'recipe', 'advancement', 'loot', 'tool', 'weapon', 'armor', 'food', 'crop', 'machine'}
                  if module.kind in extended_kinds:
                      return 'content'
                  return 'custom'
              ''',
          )
          ast.parse(work_graph)
          work_graph_path.write_text(work_graph, encoding="utf-8")

          efficiency = efficiency_path.read_text(encoding="utf-8")
          for name in (
              "_install_work_graph_compile_cache",
              "_install_work_ledger_read_batching",
              "_install_module_routing",
          ):
              efficiency = replace_span(efficiency, top_function(efficiency, name), "")
          for name in ("_WORK_GRAPH_HASH_CACHE", "_WORK_GRAPH_VALIDATION_CACHE"):
              efficiency = replace_span(efficiency, top_assignment(efficiency, name), "")
          efficiency = replace_span(
              efficiency,
              top_function(efficiency, "enhance_runtime"),
              '''
              def enhance_runtime() -> None:
                  """Install isolated custom-candidate throughput after runtime safety contracts."""

                  from . import custom_module_generator

                  _install_parallel_custom_search(custom_module_generator)
              ''',
          )
          efficiency = replace_span(
              efficiency,
              top_assignment(efficiency, "__all__"),
              '''
              __all__ = [
                  "_active_parallelism",
                  "_install_parallel_custom_search",
                  "enhance_runtime",
              ]
              ''',
          )
          if "sys." not in efficiency:
              efficiency = efficiency.replace("import sys\n", "")
          efficiency = efficiency.replace(
              """Late runtime policy for compile, routing, and isolated candidate efficiency.\n\nThe production graph owns dependency safety, durable leases and executor capacity.\nThis contract keeps only optimizations that belong outside that scheduler owner:\ncompile-local reuse, exact integration routing, batched ledger status reads, and\nisolated parallel custom candidate generation with a single winner commit.\n""",
              """Late runtime policy for isolated custom-candidate efficiency.\n\nThe production graph owns dependency safety, durable leases, routing and ledger reads.\nThis contract keeps only isolated parallel custom candidate generation with a single\nwinner commit because that optimization crosses the custom-generator boundary.\n""",
              1,
          )
          ast.parse(efficiency)
          efficiency_path.write_text(efficiency, encoding="utf-8")

          bootstrap = bootstrap_path.read_text(encoding="utf-8")
          bootstrap = replace_once(
              bootstrap,
              "    enhance_max_efficiency_runtime(work_graph_module=work_graph)\n",
              "    enhance_max_efficiency_runtime()\n",
              "max-efficiency bootstrap call",
          )
          ast.parse(bootstrap)
          bootstrap_path.write_text(bootstrap, encoding="utf-8")

          stale = (
              "_install_work_graph_compile_cache",
              "_install_work_ledger_read_batching",
              "_install_module_routing",
              "_WORK_GRAPH_HASH_CACHE",
              "_WORK_GRAPH_VALIDATION_CACHE",
          )
          final_efficiency = efficiency_path.read_text(encoding="utf-8")
          leftovers = [name for name in stale if name in final_efficiency]
          if leftovers:
              raise RuntimeError(f"stale work-graph runtime patches remain: {leftovers}")
          PY

      - name: Verify source, lint, tests and mutation audit
        run: |
          python -m compileall -q minecraft_mod_ai
          python -m ruff check \
            minecraft_mod_ai/work_graph.py \
            minecraft_mod_ai/max_efficiency_runtime_contract.py \
            minecraft_mod_ai/runtime_bootstrap.py
          python -m pytest
          python scripts/audit_runtime_mutations.py \
            --root minecraft_mod_ai \
            --json-out runtime_mutation_audit.json \
            --summary-out runtime_mutation_summary.json

      - name: Commit verified cleanup on latest main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            minecraft_mod_ai/work_graph.py \
            minecraft_mod_ai/max_efficiency_runtime_contract.py \
            minecraft_mod_ai/runtime_bootstrap.py \
            runtime_mutation_audit.json \
            runtime_mutation_summary.json
          git rm .github/workflows/native-work-graph-cleanup.yml
          git diff --cached --check
          git commit -m "refactor(work-graph): make efficiency native"
          git pull --rebase origin main
          python -m compileall -q minecraft_mod_ai
          python -m ruff check \
            minecraft_mod_ai/work_graph.py \
            minecraft_mod_ai/max_efficiency_runtime_contract.py \
            minecraft_mod_ai/runtime_bootstrap.py
          python -m pytest
          python scripts/audit_runtime_mutations.py \
            --root minecraft_mod_ai \
            --json-out runtime_mutation_audit.json \
            --summary-out runtime_mutation_summary.json
          git add runtime_mutation_audit.json runtime_mutation_summary.json
          if ! git diff --cached --quiet; then
            git commit --amend --no-edit
          fi
          git push origin HEAD:main
