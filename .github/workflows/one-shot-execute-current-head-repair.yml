name: One Shot Execute Current Head Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-execute-current-head-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -q -e '.[dev]'
      - name: Execute hardened repair block
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import textwrap

          workflow = subprocess.check_output(
              [
                  'git',
                  'show',
                  '2665596c1fd5f0afa73cee4f3fea060211e02c02:.github/workflows/one-shot-current-head-regression-repair.yml',
              ],
              text=True,
          )
          begin_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n          git diff --check"
          begin = workflow.index(begin_marker) + len(begin_marker)
          end = workflow.index(end_marker, begin)
          script = textwrap.dedent(workflow[begin:end])

          old_start = script.index("old = '''def test_agent_runtime_binds_diagnostics_to_the_actual_project_root")
          new_start = script.index("new = '''def test_agent_runtime_binds_diagnostics_to_the_actual_project_root", old_start)
          script = (
              script[:old_start]
              + "start = text.index('def test_agent_runtime_binds_diagnostics_to_the_actual_project_root(')\n"
              + script[new_start:]
          )
          stale = """if old not in text:\n    raise SystemExit('old project-root verifier test block not found')\ntext = text.replace(old, new, 1)\n"""
          if stale not in script:
              raise SystemExit('stale verifier replacement tail not found in extracted repair')
          script = script.replace(stale, "text = text[:start] + new\n", 1)
          exec(compile(script, '<current-head-repair>', 'exec'), {'__name__': '__main__'})
          PY
          git diff --check
      - name: Verify repaired regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_hidden_bottleneck_efficiency.py \
            tests/test_java_lsp_scaling.py \
            tests/test_llama_server_kernel_autotune.py \
            tests/test_model_router_forced_rag_recovery.py \
            tests/test_mutation_semantic_boundary.py \
            tests/test_planning_candidate_evidence.py \
            tests/test_planning_ssot_invariants.py \
            tests/test_scheduler_claim_install_identity.py \
            tests/test_skill_policy.py \
            tests/test_small_model_atomic_coder_execution.py \
            tests/test_agent_routing_contract.py \
            tests/test_artifact_decomposition_planning.py \
            tests/test_llama_server_native_resource_fit.py \
            tests/test_llama_server_hardware_policy.py \
            tests/test_planning_regressions_20260913.py \
            tests/test_tool_chatter_finite_bounds.py \
            tests/test_unified_host_execution_loop.py \
            tests/test_space_progression_planner_and_verifier_regression.py \
            tests/test_planning_convergence_contract.py \
            tests/test_planning_deadline_hardening.py
          python -m ruff check \
            minecraft_mod_ai/model_adapters/llama_cpp_adapter.py \
            minecraft_mod_ai/llama_server_kernel_autotune.py \
            minecraft_mod_ai/llama_server_hardware_policy.py \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            minecraft_mod_ai/planning_state_resolution.py \
            minecraft_mod_ai/deadline_executor.py \
            minecraft_mod_ai/planning_state_adaptive_implementation.py \
            minecraft_mod_ai/java_lsp.py \
            tests/test_unified_host_execution_loop.py \
            tests/test_java_lsp_scaling.py \
            tests/test_mutation_semantic_boundary.py \
            tests/test_planning_candidate_evidence.py \
            tests/test_planning_ssot_invariants.py \
            tests/test_scheduler_claim_install_identity.py \
            tests/test_skill_policy.py \
            tests/test_small_model_atomic_coder_execution.py \
            tests/test_agent_routing_contract.py \
            tests/test_llama_server_hardware_policy.py \
            tests/test_space_progression_planner_and_verifier_regression.py \
            --select F,E7,E9
          python .github/scripts/audit_runtime_efficiency.py --output /tmp/runtime-efficiency-repaired.json
      - name: Commit and push repaired code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add minecraft_mod_ai tests
          git diff --cached --check
          git commit -m 'fix: reconcile current runtime and regression contracts'
          git fetch origin main
          git rebase origin/main
          python -m pytest -q \
            tests/test_hidden_bottleneck_efficiency.py \
            tests/test_java_lsp_scaling.py \
            tests/test_llama_server_kernel_autotune.py \
            tests/test_model_router_forced_rag_recovery.py \
            tests/test_mutation_semantic_boundary.py \
            tests/test_planning_candidate_evidence.py \
            tests/test_planning_ssot_invariants.py \
            tests/test_scheduler_claim_install_identity.py \
            tests/test_skill_policy.py \
            tests/test_small_model_atomic_coder_execution.py \
            tests/test_agent_routing_contract.py \
            tests/test_artifact_decomposition_planning.py \
            tests/test_llama_server_native_resource_fit.py \
            tests/test_llama_server_hardware_policy.py \
            tests/test_planning_regressions_20260913.py \
            tests/test_tool_chatter_finite_bounds.py \
            tests/test_unified_host_execution_loop.py \
            tests/test_space_progression_planner_and_verifier_regression.py \
            tests/test_planning_convergence_contract.py \
            tests/test_planning_deadline_hardening.py
          python .github/scripts/audit_runtime_efficiency.py --output /tmp/runtime-efficiency-repaired.json
          git push origin HEAD:main