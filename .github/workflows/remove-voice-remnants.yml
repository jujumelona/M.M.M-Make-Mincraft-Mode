name: remove-voice-remnants
on:
  push:
    paths: ['.github/workflows/remove-voice-remnants.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('minecraft_mod_ai/technology_radar.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          dead_assignments = {
              '_VOICE_MODEL_CAPABILITIES',
              '_VOICE_CUES',
              '_ADAPTATION_CUES',
              'specific_voice_domain',
              'adaptation',
          }

          def mentions_voice(node: ast.AST) -> bool:
              text = ast.unparse(node)
              return '_VOICE_MODEL_CAPABILITIES' in text or 'language_intersection' in text

          class Clean(ast.NodeTransformer):
              def visit_Assign(self, node):
                  if any(isinstance(target, ast.Name) and target.id in dead_assignments for target in node.targets):
                      return None
                  return self.generic_visit(node)

              def visit_AnnAssign(self, node):
                  if isinstance(node.target, ast.Name) and node.target.id in dead_assignments:
                      return None
                  return self.generic_visit(node)

              def visit_FunctionDef(self, node):
                  if node.name == 'compute_voice_language_intersection' or 'voice' in node.name or 'speech' in node.name or 'tts' in node.name:
                      return None
                  return self.generic_visit(node)

              def visit_If(self, node):
                  if mentions_voice(node.test):
                      return None
                  return self.generic_visit(node)

              def visit_IfExp(self, node):
                  if mentions_voice(node.test):
                      return self.visit(node.orelse)
                  return self.generic_visit(node)

              def visit_Compare(self, node):
                  if mentions_voice(node):
                      return ast.copy_location(ast.Constant(False), node)
                  return self.generic_visit(node)

              def visit_Set(self, node):
                  node = self.generic_visit(node)
                  node.elts = [item for item in node.elts if not (isinstance(item, ast.Constant) and item.value == 'language_intersection')]
                  return node

              def visit_Dict(self, node):
                  node = self.generic_visit(node)
                  pairs = []
                  for key, value in zip(node.keys, node.values):
                      if isinstance(key, ast.Constant) and key.value in {'language_intersection', 'adaptation'}:
                          continue
                      pairs.append((key, value))
                  node.keys = [key for key, _ in pairs]
                  node.values = [value for _, value in pairs]
                  return node

          tree = Clean().visit(tree)
          ast.fix_missing_locations(tree)
          path.write_text(ast.unparse(tree) + '\n', encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add minecraft_mod_ai/technology_radar.py
          git commit -m 'refactor: remove retired voice and speech capability paths'
          git push origin HEAD:main
