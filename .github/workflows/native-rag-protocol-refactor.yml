name: Small-model planner architecture fix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/native-rag-protocol-refactor.yml']

permissions:
  contents: write

concurrency:
  group: small-model-planner-architecture-fix
  cancel-in-progress: false

jobs:
  refactor:
    if: "contains(github.event.head_commit.message, 'chore: run small-model architecture fix')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Locate canonical owners
        run: |
          echo '=== pre-body GitHub selection ==='
          grep -Rni -C 35 'github_repository_selected_for_body' minecraft_mod_ai || true
          echo '=== evidence materializer ==='
          grep -Rni -C 20 'def _materialize_domain_evidence_document' minecraft_mod_ai || true
          echo '=== design retrieval facets ==='
          grep -Rni -C 30 'design_retrieval_facets' minecraft_mod_ai || true

      - name: Move bounded design work to schema-constrained non-thinking path
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(text: str, start: str, end: str, replacement: str) -> str:
              i = text.index(start)
              j = text.index(end, i)
              return text[:i] + replacement.rstrip() + '\n\n\n' + text[j:]

          path = Path('minecraft_mod_ai/agentic_research_game_design.py')
          text = path.read_text(encoding='utf-8')

          text = replace_between(
              text,
              'def generate_sectioned_game_design(',
              'def _generate_section(',
              '''def generate_sectioned_game_design(
              game_design_module: Any,
              router: Any,
              prompt: str,
              *,
              media_paths: Sequence[str | Path] = (),
              research: Mapping[str, Any],
              trace_metadata: Mapping[str, Any] | None = None,
          ) -> dict[str, Any]:
              """Generate bounded structured sections, then validate requirement coverage."""
              merged: dict[str, Any] = {}
              for index, (section_id, fields, host_properties) in enumerate(_SECTION_SPECS):
                  section = _generate_section(
                      router,
                      prompt=prompt,
                      section_id=section_id,
                      fields=fields,
                      host_properties=host_properties,
                      research=research,
                      media_paths=media_paths if index == 0 else (),
                      trace_metadata=trace_metadata,
                  )
                  merged.update(section)
              if merged.get("art_direction") == {}:
                  merged.pop("art_direction", None)
              game_design_module._validate_design(merged)
              return _validate_requirement_coverage(merged, _active_requirement_ledger(prompt))'''
          )

          text = replace_between(
              text,
              'def _generate_section(',
              'def _normalize_heading(',
              '''def _generate_section(
              router: Any,
              *,
              prompt: str,
              section_id: str,
              fields: Sequence[str],
              host_properties: Mapping[str, Any],
              research: Mapping[str, Any],
              media_paths: Sequence[str | Path],
              trace_metadata: Mapping[str, Any] | None,
          ) -> dict[str, Any]:
              trace = PlannerStageTrace(
                  stage=f"game_design_{section_id}",
                  prompt=prompt,
                  media_paths=media_paths,
                  metadata=dict(trace_metadata or {}),
              )
              schema = {
                  "type": "object",
                  "properties": dict(host_properties),
                  "required": list(fields),
                  "additionalProperties": False,
              }
              raw = router.generate_text(
                  "planner",
                  _section_messages(
                      prompt=prompt,
                      section_id=section_id,
                      fields=fields,
                      research=research,
                  ),
                  media_paths=media_paths,
                  response_format="json",
                  response_schema=schema,
                  tool_stage="game_design",
                  enable_tools=False,
              )
              try:
                  payload = _extract_json_object(raw)
                  section = {field: payload[field] for field in fields if field in payload}
                  requirement_ids = tuple(
                      item["requirement_id"] for item in _active_requirement_ledger(prompt)
                  )
                  _validate_section_types(
                      section,
                      fields,
                      requirement_ids=requirement_ids,
                  )
              except (KeyError, SpecValidationError, ValueError, TypeError) as exc:
                  trace.record_attempt(
                      raw_output=raw,
                      validation_error=str(exc),
                      candidate=None,
                      context={"section_id": section_id, "format": "structured_json"},
                  )
                  raise
              trace.record_attempt(
                  raw_output=raw,
                  validation_error=None,
                  candidate=section,
                  accepted=section,
                  context={"section_id": section_id, "format": "structured_json"},
              )
              trace.record_success(section)
              return section'''
          )

          text = replace_between(
              text,
              'def _section_messages(',
              'def _render_design_research(',
              '''def _section_messages(
              *,
              prompt: str,
              section_id: str,
              fields: Sequence[str],
              research: Mapping[str, Any],
          ) -> list[dict[str, str]]:
              """Prompt only for semantic design decisions; structure is enforced by the host schema."""
              system = (
                  "You are a bounded Minecraft mod design worker. Make only the semantic design decisions "
                  "needed for the assigned section. Do not emit reasoning, analysis, <think> blocks, Markdown "
                  "headings, instructions, or fields outside the requested schema. Preserve exact approved "
                  "requirement IDs. Do not invent features merely to fill fields. User-facing strings stay in "
                  "the user's language and identifiers stay English snake_case. "
                  + _PRODUCTION_DEPTH
              )
              ledger = _active_requirement_ledger(prompt)
              user_payload = {
                  "authoritative_request": prompt,
                  "section_id": section_id,
                  "requested_fields": list(fields),
                  "research_context": _compact_research_for_design(research),
                  "approved_requirements": list(ledger),
              }
              return [
                  {"role": "system", "content": system},
                  {"role": "user", "content": json.dumps(user_payload, ensure_ascii=False, sort_keys=True)},
              ]'''
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Tighten retrieval admission before evidence fusion
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(text: str, start: str, end: str, replacement: str) -> str:
              i = text.index(start)
              j = text.index(end, i)
              return text[:i] + replacement.rstrip() + '\n\n\n' + text[j:]

          path = Path('minecraft_mod_ai/pre_design_rag_fusion.py')
          text = path.read_text(encoding='utf-8')
          text = replace_between(
              text,
              'def _record_is_query_relevant(',
              'def _evidence_excerpt(',
              '''def _record_is_query_relevant(query: str, record: Mapping[str, Any]) -> bool:
              """Categorically gate external evidence by ecosystem identity and request intent.

              Generic scaffolding words such as build/create/system are not semantic evidence. External
              GitHub/Modrinth records must first identify as Minecraft ecosystem material and must also
              overlap a non-scaffolding intent term from the approved retrieval query.
              """
              scaffolding = {
                  "build", "building", "create", "creating", "make", "making", "use", "using",
                  "support", "supports", "mode", "system", "systems", "feature", "features",
                  "source", "implementation", "code", "example", "examples", "project",
                  "minecraft", "mod", "mods",
              }
              ecosystem = {
                  "minecraft", "fabric", "forge", "neoforge", "quilt", "modrinth", "curseforge",
                  "bukkit", "spigot", "paper", "mixin", "yarn", "loom",
              }
              query_terms = _query_relevance_tokens(query)
              intent = {term for term in query_terms if term not in scaffolding}
              if not intent:
                  intent = query_terms
              searchable = " ".join(
                  str(record.get(field) or "")
                  for field in (
                      "title", "name", "description", "source_id", "url", "repository",
                      "topics", "content",
                  )
              )
              record_terms = _tokens(searchable)
              source_type = str(record.get("source_type") or "").casefold()
              source_id = str(record.get("source_id") or "").casefold()
              url = str(record.get("url") or "").casefold()
              external = (
                  "github" in source_type
                  or source_id.startswith("github:")
                  or "github.com/" in url
                  or "modrinth" in source_type
                  or source_id.startswith("modrinth:")
                  or "modrinth.com/" in url
              )
              if external and not (record_terms & ecosystem):
                  return False
              return bool(intent & record_terms)'''
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Update regression contract for structured design
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(text: str, start: str, end: str, replacement: str) -> str:
              i = text.index(start)
              j = text.index(end, i)
              return text[:i] + replacement.rstrip() + '\n\n\n' + text[j:]

          path = Path('tests/test_agentic_research_game_design.py')
          text = path.read_text(encoding='utf-8')
          text = replace_between(
              text,
              'class _SectionRouter:',
              'class _ResearchRouter:',
              '''class _SectionRouter:
              def __init__(self) -> None:
                  self.calls: list[dict[str, object]] = []

              def generate_text(
                  self,
                  role,
                  messages,
                  *,
                  media_paths=(),
                  response_format="text",
                  response_schema=None,
                  tool_stage=None,
                  enable_tools=True,
              ):
                  self.calls.append(
                      {
                          "role": role,
                          "messages": messages,
                          "media_paths": tuple(media_paths),
                          "response_format": response_format,
                          "response_schema": response_schema,
                          "tool_stage": tool_stage,
                          "enable_tools": enable_tools,
                      }
                  )
                  values = {
                      "title": "연구 기반 모드",
                      "pitch": "검색 근거를 바탕으로 설계한다.",
                      "core_loop": ["탐색하고 상호작용한다"],
                      "progression": ["기능을 단계적으로 해금한다"],
                      "combat": {},
                      "mod_context": {},
                      "modules": [],
                      "assets": [],
                      "acceptance_tests": ["요청한 핵심 루프가 게임 내에서 동작한다"],
                      "art_direction": {},
                  }
                  assert response_format == "json"
                  assert isinstance(response_schema, dict)
                  fields = list(response_schema["required"])
                  return json.dumps({field: values[field] for field in fields}, ensure_ascii=False)'''
          )
          text = replace_between(
              text,
              'def test_sectioned_game_design_generates_each_section_once_as_prose()',
              'def test_research_domain_accepts_only_host_issued_grounding_ref(',
              '''def test_sectioned_game_design_generates_each_section_once_as_structured_json() -> None:
              router = _SectionRouter()
              research = {
                  "research_brief": {"domains": []},
                  "domain_notes": [],
                  "deterministic": {},
                  "errors": [],
              }
              result = agentic.generate_sectioned_game_design(
                  game_design,
                  router,
                  "연구를 먼저 하고 모드를 설계해줘",
                  research=research,
              )
              expected_sections = [
                  tuple(fields) for _section_id, fields, _properties in agentic._SECTION_SPECS
              ]
              assert len(router.calls) == len(expected_sections)
              assert all(call["role"] == "planner" for call in router.calls)
              assert all(call["response_format"] == "json" for call in router.calls)
              assert all(isinstance(call["response_schema"], dict) for call in router.calls)
              assert all(call["tool_stage"] == "game_design" for call in router.calls)
              assert all(call["enable_tools"] is False for call in router.calls)
              for fields, call in zip(expected_sections, router.calls, strict=True):
                  schema = call["response_schema"]
                  assert schema["required"] == list(fields)
                  assert schema["additionalProperties"] is False
                  system = str(call["messages"][0]["content"])
                  assert "Do not emit reasoning" in system
              assert result["title"] == "연구 기반 모드"
              assert result["core_loop"]
              assert result["acceptance_tests"]
              assert "art_direction" not in result'''
          )
          path.write_text(text, encoding='utf-8')

          quality = Path('tests/test_pre_design_rag_quality_contract.py')
          qtext = quality.read_text(encoding='utf-8')
          marker = 'def test_retrieval_query_filter_rejects_raw_prompt_and_non_ascii():'
          addition = '''def test_external_fusion_rejects_generic_word_collision_without_minecraft_identity():
              from minecraft_mod_ai import pre_design_rag_fusion as fusion

              query = "minecraft mod build space station modules"
              noise = {
                  "source_id": "github:microsoft/StudentsAtBuild-2021",
                  "source_type": "github_source",
                  "title": "Students at Build 2021",
                  "url": "https://github.com/microsoft/StudentsAtBuild-2021",
                  "content": "Student projects and conference build sessions.",
              }
              relevant = {
                  "source_id": "github:example/minecraft-space-mod",
                  "source_type": "github_source",
                  "title": "Minecraft Fabric modular space station",
                  "url": "https://github.com/example/minecraft-space-mod",
                  "content": "Fabric mod implementing space station modules and vessel construction.",
              }
              assert fusion._record_is_query_relevant(query, noise) is False
              assert fusion._record_is_query_relevant(query, relevant) is True


          '''
          if 'test_external_fusion_rejects_generic_word_collision_without_minecraft_identity' not in qtext:
              qtext = qtext.replace(marker, addition + marker, 1)
          quality.write_text(qtext, encoding='utf-8')
          PY

      - name: Validate architecture changes
        run: |
          python -m pip install --prefer-binary -e '.[dev]'
          python -m compileall -q minecraft_mod_ai tests
          python -m ruff check minecraft_mod_ai tests --select F,E7,E9
          python -m pytest -q tests/test_agentic_research_game_design.py tests/test_pre_design_rag_quality_contract.py

      - name: Commit canonical architecture changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/native-rag-protocol-refactor.yml
          git add minecraft_mod_ai/agentic_research_game_design.py minecraft_mod_ai/pre_design_rag_fusion.py tests/test_agentic_research_game_design.py tests/test_pre_design_rag_quality_contract.py
          git diff --cached --check
          git commit -m 'refactor: constrain small-model planning and evidence admission'
          git push origin HEAD:main
