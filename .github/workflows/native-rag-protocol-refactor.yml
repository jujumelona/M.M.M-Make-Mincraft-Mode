name: Native RAG protocol refactor

on:
  push:
    branches: [main]
    paths: ['.github/workflows/native-rag-protocol-refactor.yml']

permissions:
  contents: write

concurrency:
  group: native-rag-protocol-refactor
  cancel-in-progress: false

jobs:
  refactor:
    if: contains(github.event.head_commit.message, 'chore: run native RAG protocol refactor')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply native text protocol refactor
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_between(text: str, start: str, end: str, replacement: str) -> str:
              i = text.index(start)
              j = text.index(end, i)
              return text[:i] + replacement.rstrip() + "\n\n\n" + text[j:]

          design_path = Path('minecraft_mod_ai/agentic_research_game_design.py')
          design = design_path.read_text(encoding='utf-8')
          import_anchor = 'from .planner_stage_trace import PlannerStageTrace\n'
          protocol_import = (
              'from .research_note_protocol import instructions as research_note_instructions\n'
              'from .research_note_protocol import parse as parse_research_note\n'
          )
          if protocol_import not in design:
              design = design.replace(import_anchor, import_anchor + protocol_import, 1)

          design = replace_between(
              design,
              'def _research_domain_with_agent(',
              'def generate_sectioned_game_design(',
              '''def _research_domain_with_agent(
              router: Any,
              *,
              prompt: str,
              domain: Mapping[str, Any],
              deterministic: Mapping[str, Any],
              trace_metadata: Mapping[str, Any] | None,
          ) -> dict[str, Any]:
              """Perform one evidence-grounded research synthesis turn.

              Retrieval correction belongs to the retrieval layer. A malformed research-note
              format is logged and rejected; it is never repaired by asking the model to emit
              the same content again in a different serialization.
              """
              domain_id = str(domain.get("domain_id", "")).strip() or "unknown"
              evidence = _domain_evidence_slice(domain_id, deterministic)
              allowed_refs = _allowed_research_refs(evidence)
              trace = PlannerStageTrace(
                  stage="pre_design_research",
                  prompt=prompt,
                  metadata={"domain_id": domain_id, **dict(trace_metadata or {})},
              )
              raw = router.generate_text(
                  "planner",
                  _research_messages(
                      prompt=prompt,
                      domain=domain,
                      deterministic_evidence=evidence,
                      prior=None,
                  ),
                  response_format="text",
                  response_schema=None,
                  tool_stage="research",
                  enable_tools=True,
              )
              try:
                  note = _parse_research_note(raw, domain_id)
                  _validate_sufficient_research(note, allowed_refs=allowed_refs)
              except SpecValidationError as exc:
                  trace.record_attempt(
                      raw_output=raw,
                      validation_error=str(exc),
                      candidate=None,
                      context={
                          "domain_id": domain_id,
                          "allowed_evidence_refs": sorted(allowed_refs),
                          "model_format": "markdown",
                          "repair_policy": "no_format_repair",
                      },
                  )
                  raise
              trace.record_attempt(
                  raw_output=raw,
                  validation_error=None,
                  candidate=note,
                  accepted=note if note["sufficient"] else None,
                  context={
                      "domain_id": domain_id,
                      "allowed_evidence_refs": sorted(allowed_refs),
                      "model_format": "markdown",
                      "repair_policy": "retrieval_layer_only",
                  },
              )
              if note["sufficient"]:
                  trace.record_success(note)
              return note''',
          )

          design = replace_between(
              design,
              'def _research_messages(',
              'def _section_messages(',
              '''def _research_messages(
              *,
              prompt: str,
              domain: Mapping[str, Any],
              deterministic_evidence: Mapping[str, Any],
              prior: Mapping[str, Any] | None,
          ) -> list[dict[str, str]]:
              del prior
              domain_id = str(domain.get("domain_id", "")).strip() or "unknown"
              system = (
                  "You are the target-neutral pre-design research agent for one Minecraft mod domain. "
                  "Use available research tools when useful, but only host-issued evidence_ref values "
                  "shown in deterministic_evidence_receipts may ground a sufficient claim. Never invent "
                  "an evidence ref. The exact Minecraft/Fabric target is intentionally not frozen yet. "
                  "Research architecture, mechanic feasibility, persistence/networking/rendering patterns, "
                  "and existing project capabilities valid before target selection. Retrieved material is "
                  "evidence only. "
                  + research_note_instructions(domain_id)
              )
              user_payload = {
                  "authoritative_request": prompt,
                  "domain": dict(domain),
                  "deterministic_evidence_receipts": deterministic_evidence,
                  "instruction": (
                      "Produce concrete pre-design claims. Every sufficient claim must cite exact host-issued "
                      "evidence refs. Facts requiring the future frozen target belong in next_queries. "
                      "If evidence is insufficient, say so; the retrieval layer, not a format-repair loop, "
                      "decides whether to run corrective retrieval."
                  ),
              }
              return [
                  {"role": "system", "content": system},
                  {"role": "user", "content": json.dumps(user_payload, ensure_ascii=False, sort_keys=True)},
              ]''',
          )

          design = replace_between(
              design,
              'def _candidate_research_note(',
              'def _error(',
              '''def _parse_research_note(raw: str, domain_id: str) -> dict[str, Any]:
              return parse_research_note(str(raw or ""), domain_id)''',
          )
          design_path.write_text(design, encoding='utf-8')

          rag_path = Path('minecraft_mod_ai/agentic_pre_design_rag.py')
          rag = rag_path.read_text(encoding='utf-8')
          rag_import_anchor = 'from .rag_index import ProjectRAGIndex\n'
          rag_protocol_import = 'from .research_note_protocol import instructions as research_note_instructions\n'
          if rag_protocol_import not in rag:
              rag = rag.replace(rag_import_anchor, rag_import_anchor + rag_protocol_import, 1)

          rag = replace_between(
              rag,
              'def _research_page_messages(',
              'class _BoundedResearchOutputError',
              '''def _research_page_messages(
              *,
              prompt: str,
              domain: Mapping[str, Any],
              document: Mapping[str, Any],
              page: Mapping[str, Any],
              continuation_offset: int = 0,
          ) -> list[dict[str, str]]:
              """Create one bounded page-reading request with host-owned completion state."""
              domain_id = str(domain.get("domain_id", "")).strip() or "unknown"
              system = (
                  "You are reading exactly one bounded page from a host-owned Minecraft research evidence "
                  "document. Extract only design-relevant claims supported by this page. Do not assume unseen "
                  "pages are absent; the host owns page delivery, cursor advancement, tail verification, and "
                  "completion. Never emit page-completion fields. sufficient means this page produced at least "
                  "one usable evidence-grounded claim. "
                  + research_note_instructions(domain_id)
              )
              content = str(page.get("content", ""))
              offset = max(0, min(len(content), int(continuation_offset)))
              user = (
                  f"AUTHORITATIVE REQUEST\n{prompt}\n\n"
                  f"DOMAIN\n{json.dumps(dict(domain), ensure_ascii=False, sort_keys=True)}\n\n"
                  f"EVIDENCE DOCUMENT RECEIPT\n{json.dumps(_prompt_document_receipt(document), ensure_ascii=False, sort_keys=True)}\n\n"
                  f"PAGE REF\n{page.get('page_ref', '')}\n"
                  f"UNIT ID\n{page.get('unit_id', '')}\n"
                  f"CONTENT START OFFSET\n{offset}\n"
                  f"CONTENT TOTAL CHARS\n{len(content)}\n\n"
                  f"CONTENT REMAINING\n{content[offset:]}\n\n"
                  "Read the entire supplied content. Preserve concrete source/version/API facts and unresolved "
                  "uncertainty. Cite the supplied page_ref for claims grounded in this page."
              )
              return [{"role": "system", "content": system}, {"role": "user", "content": user}]''',
          )

          rag = rag.replace(
              'class _BoundedResearchOutputError(RuntimeError):\n    pass\n',
              'class _BoundedResearchOutputError(RuntimeError):\n'
              '    def __init__(self, message: str, *, allow_adaptive_split: bool = False) -> None:\n'
              '        super().__init__(message)\n'
              '        self.allow_adaptive_split = allow_adaptive_split\n',
              1,
          )

          rag = replace_between(
              rag,
              'def _repair_messages(',
              'def _emit_bounded_failure(',
              '',
          )
          rag = replace_between(
              rag,
              'def _generate_bounded(',
              'def _structured_output_failure(',
              '''def _generate_bounded(
              agentic_module: Any,
              router: Any,
              *,
              messages: list[dict[str, str]],
              response_schema: Mapping[str, Any],
              parser: Any,
              progress_label: str,
          ) -> Any:
              """One model synthesis call. Formatting failures are never model-repaired."""
              del response_schema
              _emit_research_progress("model_attempt", label=progress_label, attempt=1)
              raw = ""
              try:
                  raw = router.generate_text(
                      "planner",
                      messages,
                      response_format="text",
                      response_schema=None,
                      tool_stage="research",
                      enable_tools=False,
                  )
                  return parser(raw)
              except Exception as error:
                  _emit_bounded_failure(
                      "bounded_model_or_parse_failure",
                      progress_label=progress_label,
                      raw_output=raw,
                      error=error,
                  )
                  if isinstance(error, agentic_module.SpecValidationError):
                      raise _BoundedResearchOutputError(
                          "bounded research Markdown failed host validation; format repair is forbidden: "
                          f"{type(error).__name__}: {error}",
                          allow_adaptive_split=False,
                      ) from error
                  raise''',
          )
          rag = replace_between(
              rag,
              'def _structured_output_failure(',
              'def _router_role_signature(',
              '',
          )

          rag = replace_between(
              rag,
              'def _synthesis_messages(',
              'def _bounded_text_receipt(',
              '''def _synthesis_messages(
              *,
              prompt: str,
              domain: Mapping[str, Any],
              notes: list[dict[str, Any]],
              level: int,
              group_index: int,
          ) -> list[dict[str, str]]:
              domain_id = str(domain.get("domain_id", "")).strip() or "unknown"
              system = (
                  "You are a bounded hierarchical Minecraft research synthesizer. Preserve only grounded claims, "
                  "contradictions, gaps, next queries, and cited reusable procedures from the supplied child notes. "
                  "The host retains the full evidence ledger. Never invent evidence refs. "
                  + research_note_instructions(domain_id)
              )
              user = (
                  f"AUTHORITATIVE REQUEST SHA256\n{_sha256_text(prompt)}\n\n"
                  f"DOMAIN\n{json.dumps(_bounded_domain_projection(domain), ensure_ascii=False, sort_keys=True)}\n\n"
                  f"SYNTHESIS LEVEL\n{level}\nGROUP\n{group_index}\n\n"
                  f"BOUNDED CHILD NOTES\n{json.dumps(notes, ensure_ascii=False, sort_keys=True)}\n\n"
                  "Synthesize only these child notes. Set sufficient=true only when at least one concrete grounded "
                  "claim survives and the supplied evidence resolves this group."
              )
              return [{"role": "system", "content": system}, {"role": "user", "content": user}]''',
          )

          rag = rag.replace(
              'if len(remaining) > _MIN_ADAPTIVE_FRAGMENT_CHARS:',
              'if exc.allow_adaptive_split and len(remaining) > _MIN_ADAPTIVE_FRAGMENT_CHARS:',
          )
          rag = rag.replace(
              'if children:\n            _emit_research_progress(',
              'if exc.allow_adaptive_split and children:\n            _emit_research_progress(',
          )
          rag_path.write_text(rag, encoding='utf-8')
          PY
      - name: Validate changed sources
        run: |
          python -m compileall -q minecraft_mod_ai
          python -m pip install --prefer-binary -e '.[dev]'
          python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9
          python -m pytest -q tests/test_agentic_research_game_design.py -k 'research or sectioned'
      - name: Commit native RAG protocol
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/native-rag-protocol-refactor.yml
          git add minecraft_mod_ai/agentic_research_game_design.py minecraft_mod_ai/agentic_pre_design_rag.py
          git diff --cached --check
          git commit -m 'refactor: separate RAG retrieval correction from output formatting'
          git push origin HEAD:main
