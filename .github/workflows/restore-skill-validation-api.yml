name: Restore Skill validation API

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Restore validation facade
        run: |
          cat > /tmp/restore_validation.py <<'PY'
          from pathlib import Path

          path = Path("minecraft_mod_ai/skill_catalog.py")
          text = path.read_text(encoding="utf-8")
          marker = "def load_skill_catalog(root: str | Path | None=None) -> dict[str, SkillContract]:\n    return compile_skill_catalog(root)\n\n\n"
          addition = '''def validate_skill_catalog(root: str | Path | None=None) -> dict[str, Any]:
              findings: list[str] = []
              contracts: dict[str, dict[str, Any]] = {}
              try:
                  compiled = compile_skill_catalog(root)
              except (SkillPolicyError, TypeError, ValueError, yaml.YAMLError) as exc:
                  return {
                      "schema_version": "mmm/skill-catalog-validation-v2",
                      "skills": list(CANONICAL_SKILLS),
                      "contracts": {},
                      "findings": [f"invalid-catalog:{exc}"],
                      "passed": False,
                  }
              for name, contract in compiled.items():
                  contracts[name] = contract.to_dict()
              return {
                  "schema_version": "mmm/skill-catalog-validation-v2",
                  "skills": list(CANONICAL_SKILLS),
                  "contracts": contracts,
                  "findings": findings,
                  "passed": True,
              }


          '''
          import textwrap
          addition = textwrap.dedent(addition)
          if "def validate_skill_catalog(" in text:
              raise SystemExit("validate_skill_catalog already exists")
          if marker not in text:
              raise SystemExit("load_skill_catalog anchor missing")
          path.write_text(text.replace(marker, marker + addition, 1), encoding="utf-8")
          PY
          python /tmp/restore_validation.py
      - name: Verify API
        run: |
          python -m pip install --prefer-binary -e '.[dev]'
          python -m ruff check minecraft_mod_ai/skill_catalog.py --select F,E7,E9
          python - <<'PY'
          from minecraft_mod_ai.skill_catalog import validate_skill_catalog
          result = validate_skill_catalog('skills')
          assert isinstance(result, dict)
          PY
      - name: Commit
        run: |
          git rm .github/workflows/restore-skill-validation-api.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/skill_catalog.py .github/workflows
          git commit -m 'Restore Skill catalog validation API'
          git push origin HEAD:main
