name: One-shot public acceptance hotfix v3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply precompiled deterministic acceptance hotfix
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/acceptance_hotfix_v3.py
          python -m py_compile /tmp/acceptance_hotfix_v3.py
          python /tmp/acceptance_hotfix_v3.py

      - name: Verify root fix before commit
        shell: bash
        run: |
          python -m compileall -q minecraft_mod_ai
          python -m pytest tests/test_public_acceptance_runtime_boundary.py -q
          python .github/scripts/audit_runtime_mutations.py

      - name: Commit and push actual hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/one-shot-public-acceptance-hotfix.yml \
                    .github/workflows/one-shot-public-acceptance-hotfix-v2.yml \
                    .github/workflows/one-shot-public-acceptance-hotfix-v3.yml
          git add minecraft_mod_ai/production_boundary_contract.py \
                  minecraft_mod_ai/production_contract.py \
                  minecraft_mod_ai/llama_model.py \
                  tests/test_public_acceptance_runtime_boundary.py
          git commit -m 'fix: sanitize public acceptance before production validation'
          echo "HOTFIX_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:main
