name: Apply Planning Hardening

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-planning-hardening.yml'

permissions:
  contents: write

concurrency:
  group: apply-planning-hardening-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Sync current main
        run: git pull --ff-only origin main
      - name: Remove migration-only workflow rewrite from patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/_apply_planning_deadline_hardening.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('\nworkflow_path = ROOT / ".github/workflows/planner-liveness.yml"')
          end = text.index('\n\ntest_path = ROOT / "tests/test_planning_deadline_hardening.py"', start)
          path.write_text(text[:start] + text[end:], encoding='utf-8')
          PY
      - name: Apply source migration
        run: python tools/_apply_planning_deadline_hardening.py
      - name: Make capacity deadline regression scheduler-independent
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_planning_deadline_hardening.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import time\n', 'import time\nfrom threading import Thread\n', 1)
          text = text.replace(
              '    ModelExecutionDeadlineExceeded,\n    ReentrantCapacityGate,\n',
              '    ModelExecutionDeadlineExceeded,\n    ReentrantCapacityGate,\n    bind_model_execution_deadline,\n',
              1,
          )
          start = text.index('def test_model_capacity_wait_inherits_work_unit_deadline(')
          end = text.index('\n\ndef test_detailed_planning_hung_work_unit_exits_with_bounded_timeout', start)
          replacement = '''def test_model_capacity_wait_inherits_work_unit_deadline() -> None:\n    gate = ReentrantCapacityGate(lambda: 1)\n    gate.acquire()\n    errors: list[BaseException] = []\n\n    def contend() -> None:\n        try:\n            with bind_model_execution_deadline(time.monotonic() + 0.03):\n                gate.acquire()\n        except BaseException as exc:\n            errors.append(exc)\n\n    contender = Thread(target=contend)\n    started = time.monotonic()\n    try:\n        contender.start()\n        contender.join(timeout=0.20)\n        assert not contender.is_alive()\n        assert time.monotonic() - started < 0.20\n        assert len(errors) == 1\n        assert isinstance(errors[0], ModelExecutionDeadlineExceeded)\n    finally:\n        gate.release()\n        contender.join(timeout=0.20)\n'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
      - name: Compile hardened planner sources
        run: |
          python -m py_compile \
            minecraft_mod_ai/model_concurrency.py \
            minecraft_mod_ai/deadline_executor.py \
            minecraft_mod_ai/planning_state_adaptive_implementation.py \
            minecraft_mod_ai/planning_state_research.py \
            tests/test_planning_deadline_hardening.py
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Run focused planning regressions
        run: |
          python -m pytest -q \
            tests/test_planning_deadline_hardening.py \
            tests/test_planning_progress_monotone.py
      - name: Commit clean final tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/_apply_planning_deadline_hardening.py
          git rm .github/workflows/apply-planning-hardening.yml
          git add minecraft_mod_ai/planning_state_adaptive_implementation.py
          git add minecraft_mod_ai/planning_state_research.py
          git add tests/test_planning_deadline_hardening.py
          git commit -m 'Harden planning proof authority and execution deadlines'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo 'failed to push planning hardening after rebase retries' >&2
          exit 1
