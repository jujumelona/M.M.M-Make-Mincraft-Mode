name: Validate packaged skills sync

on:
  push:
    branches: [main]
    paths:
      - "skills/**/SKILL.md"
      - "tools/package_skills.py"
      - "minecraft_mod_ai/packaged_skills.json"
      - "plugins/mmm-minecraft-mod-ai/skills/**/SKILL.md"
      - ".github/workflows/sync-packaged-skills.yml"
  pull_request:
    paths:
      - "skills/**/SKILL.md"
      - "tools/package_skills.py"
      - "minecraft_mod_ai/packaged_skills.json"
      - "plugins/mmm-minecraft-mod-ai/skills/**/SKILL.md"
      - ".github/workflows/sync-packaged-skills.yml"

permissions:
  contents: read

concurrency:
  group: validate-packaged-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install --prefer-binary -e .

      - name: Regenerate packaged and plugin Skills
        run: python tools/package_skills.py

      - name: Verify generated Skill artifacts are committed
        shell: bash
        run: |
          if ! git diff --exit-code -- \
            minecraft_mod_ai/packaged_skills.json \
            plugins/mmm-minecraft-mod-ai/skills/*/SKILL.md; then
            echo "Packaged/plugin Skill artifacts are out of sync."
            echo "Run 'python tools/package_skills.py' and commit the generated files."
            exit 1
          fi
