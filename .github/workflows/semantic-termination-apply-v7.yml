name: Semantic Termination Apply V7

on:
  push:
    paths:
      - .github/workflows/semantic-termination-apply-v7.yml

permissions:
  contents: write

concurrency:
  group: semantic-termination-apply-v7
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project test environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary "build>=1,<2" -e ".[dev,ui]"

      - name: Apply normalized semantic migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          v6 = Path('.github/workflows/semantic-termination-apply-v6.yml').read_text(encoding='utf-8')
          match = re.search(
              r"          python - <<'PY'\n(.*?)\n          PY\n",
              v6,
              flags=re.S,
          )
          if not match:
              raise SystemExit('v6 normalized migration python block not found')
          exec(compile(textwrap.dedent(match.group(1)), '<v6-migration>', 'exec'), {})
          PY

      - name: Compile
        run: python -m compileall -q minecraft_mod_ai tests

      - name: Run targeted regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_agent_tool_round_liveness.py \
            tests/test_adaptive_production_agent.py \
            tests/test_adaptive_execution_hardening.py

      - name: Audit legacy semantic counters
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'no_progress_streak|forced_rag_attempts|_agent_tool_round_limit|MMM_AGENT_TOOL_ROUNDS|MMM_AGENT_DEFAULT_TOOL_ROUNDS' -- minecraft_mod_ai tests; then
            echo 'legacy semantic retry/counter contract remains' >&2
            exit 1
          fi

      - name: Commit verified production migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI semantic termination migration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/model_router.py \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            minecraft_mod_ai/termination_contract.py \
            tests/test_agent_tool_round_liveness.py
          git diff --cached --check
          git commit -m 'Replace agent retry caps with semantic termination'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
