name: One Shot Shard2 Root Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-shard2-root-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -q -e '.[dev]'
      - name: Apply root fixes
        shell: bash
        run: |
          set -euo pipefail
          # Restore the authored-coverage pagination protocol that commit 6d5d1c6
          # accidentally replaced with blind repeated requirement generation.
          git show 01c9bc971695ec01a1a3103f26f256977a89f511:minecraft_mod_ai/planning_state_resolution.py \
            > minecraft_mod_ai/planning_state_resolution.py

          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/planning_state_adaptive_implementation.py')
          text = path.read_text(encoding='utf-8')
          old = '''                    if kind_tag == "artifact":
                        result_receipt = _planning_only_artifact_receipt(result_receipt)
                        job["artifact_fragments"].setdefault(artifact_kind, {})[
                            step_id
                        ] = result_receipt
                        working_state = _store_artifact_progress(
                            working_state,
                            requirement_ref=job["requirement_ref"],
                            artifact_kind=artifact_kind,
                            step_id=step_id,
                            receipt=result_receipt,
                        )
                    else:
                        job["fragments"][idx] = result_receipt
                        working_state = store_criterion_progress(
                            working_state,
                            requirement_ref=job["requirement_ref"],
                            selected_sections=job["selected_sections"],
                            criterion_index=idx,
                            criterion=job["criteria"][idx],
                            fragment=result_receipt,
                        )

                    remaining -= 1
                    if remaining >= before:
                        raise RuntimeError(
                            "DETAILED_PLAN_NO_PROGRESS: unfinished work items did not strictly decrease"
                        )

                    working_state = _checkpoint_state(working_state, checkpoint)
'''
          new = '''                    if kind_tag == "artifact":
                        result_receipt = _planning_only_artifact_receipt(result_receipt)
                        job["artifact_fragments"].setdefault(artifact_kind, {})[
                            step_id
                        ] = result_receipt
                    else:
                        job["fragments"][idx] = result_receipt

                    # on_result already persisted and checkpointed this validated work
                    # unit before executor shutdown.  The completion pass only updates
                    # in-memory job assembly and the monotone pending-work count.
                    remaining -= 1
                    if remaining >= before:
                        raise RuntimeError(
                            "DETAILED_PLAN_NO_PROGRESS: unfinished work items did not strictly decrease"
                        )
'''
          if text.count(old) != 1:
              raise SystemExit('adaptive duplicate-checkpoint anchor mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('tests/test_scheduler_parallel_safety_contract.py')
          text = path.read_text(encoding='utf-8')
          old = '''def test_anchor_fenced_runtime_disables_coarse_stage_admission() -> None:
    assert scheduler_contract._SERIAL_CPU_STAGES == ()
'''
          new = '''def test_anchor_fenced_runtime_keeps_fail_closed_stage_admission() -> None:
    assert scheduler_contract._SERIAL_CPU_STAGES == (
        "generate:content",
        "generate:system",
        "generate:entity",
    )
'''
          if text.count(old) != 1:
              raise SystemExit('scheduler contract test anchor mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Verify repaired contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_planning_requirement_pagination.py \
            tests/test_planning_progress_monotone.py \
            tests/test_scheduler_parallel_safety_contract.py \
            tests/test_planning_ssot_invariants.py \
            tests/test_space_progression_planner_and_verifier_regression.py
          python -m ruff check \
            minecraft_mod_ai/planning_state_resolution.py \
            minecraft_mod_ai/planning_state_adaptive_implementation.py \
            tests/test_scheduler_parallel_safety_contract.py \
            --select F,E7,E9
      - name: Commit verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jujumelona'
          git config user.email 'qasdaa025@gmail.com'
          git add \
            minecraft_mod_ai/planning_state_resolution.py \
            minecraft_mod_ai/planning_state_adaptive_implementation.py \
            tests/test_scheduler_parallel_safety_contract.py
          git diff --cached --check
          git commit -m 'fix: restore requirement coverage and monotone checkpoints'
          git fetch origin main
          git rebase origin/main
          python -m pytest -q \
            tests/test_planning_requirement_pagination.py \
            tests/test_planning_progress_monotone.py \
            tests/test_scheduler_parallel_safety_contract.py
          git push origin HEAD:main