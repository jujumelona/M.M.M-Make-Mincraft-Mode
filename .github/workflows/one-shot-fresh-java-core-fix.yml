name: One-shot fresh Java core fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-fresh-java-core-fix.yml

permissions:
  contents: write

jobs:
  apply-core-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e ".[dev]"
      - name: Integrate fix into core state machine
        run: python .github/scripts/apply_fresh_java_core_fix.py
      - name: Verify focused regression
        run: python -m pytest -q tests/test_fresh_java_grounding_transition.py
      - name: Check staged diff
        run: |
          git add -A
          git diff --cached --check
      - name: Commit and push core fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Integrate fresh Java grounding into core loop"
          git push origin HEAD:main
