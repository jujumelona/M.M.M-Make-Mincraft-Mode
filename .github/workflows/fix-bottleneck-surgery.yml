name: Fix Bottleneck Surgery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-bottleneck-surgery.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Remove stale test target and self-delete
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/bottleneck-surgery-retry.yml')
          text = path.read_text(encoding='utf-8')
          stale = '            tests/test_extended_content_generation_lock.py\n'
          if stale not in text:
              raise SystemExit('stale test target not found')
          path.write_text(text.replace(stale, '', 1), encoding='utf-8')
          Path('.github/workflows/fix-bottleneck-surgery.yml').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/bottleneck-surgery-retry.yml .github/workflows/fix-bottleneck-surgery.yml
          git commit -m 'Fix bottleneck surgery validation targets'
          git pull --rebase origin main
          git push origin HEAD:main
