name: Restore planner status once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore_planner_status_once.yml'

permissions:
  contents: write
  statuses: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Mark planner sync pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'mmm/planner-sync',
              description: 'Regenerating Colab planner status cells',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'nbformat>=5.10,<6'
      - name: Restore factual planner limits
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/build_colab_notebook.py')
          text = path.read_text(encoding='utf-8')
          required = (
              'planner_config.max_input_tokens',
              'planner_config.max_new_tokens',
              '기획 page input:',
              '기획 page output:',
          )
          if not all(token in text for token in required):
              old = '''print("기획 native context:", f"{planner_config.max_context:,} tokens")
print("결과 저장 위치:", OUTPUT_ROOT)
'''
              new = '''print("기획 native context:", f"{planner_config.max_context:,} tokens")
print(
    "기획 page input:",
    f"{planner_config.max_input_tokens:,} tokens"
    if planner_config.max_input_tokens
    else "native-context bound (no separate page cap)",
)
print("기획 page output:", f"{planner_config.max_new_tokens:,} tokens")
print("결과 저장 위치:", OUTPUT_ROOT)
'''
              if old not in text:
                  raise SystemExit('planner status block not found and required fields are absent')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Regenerate notebooks
        run: python tools/build_colab_notebook.py
      - name: Verify planner status and Colab contracts
        run: |
          python tools/build_colab_notebook.py --check
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path('tools/build_colab_notebook.py'),
              Path('M.M.M_Make_Mincraft_Mode_Colab.ipynb'),
              Path('Minecraft_Multimodal_Mod_AI_Architecture_v6.ipynb'),
          ]
          required = (
              'planner_config.max_input_tokens',
              'planner_config.max_new_tokens',
              '기획 page input:',
              '기획 page output:',
              'start_colab_mtp_server',
          )
          banned = (
              'git clone', 'cmake', 'nvcc', 'make -j',
              '무결성 100%', '에러 위험 요소 0%', '약 1분', '3배', '80토큰',
              '폭속', '풀옵션',
          )
          for path in paths:
              text = path.read_text(encoding='utf-8')
              for token in required:
                  assert token in text, (path, token)
              for token in banned:
                  assert token not in text, (path, token)
          PY
      - name: Commit regenerated notebooks
        run: |
          git rm -f .github/workflows/restore_planner_status_once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(colab): restore factual planner limit status'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Mark planner sync success
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'mmm/planner-sync',
              description: 'Planner status regenerated and pushed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - name: Mark planner sync failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'mmm/planner-sync',
              description: 'Planner status synchronization failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

