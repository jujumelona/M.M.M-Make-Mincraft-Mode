name: Debug source snapshot

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Pack repository
        run: tar --exclude=.git --exclude=audit -czf /tmp/mmm-source.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: mmm-source-${{ github.sha }}
          path: /tmp/mmm-source.tgz
          retention-days: 1
          if-no-files-found: error
