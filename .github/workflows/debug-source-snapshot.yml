name: One Shot Pipeline Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/debug-source-snapshot.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-pipeline-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply repair patch and package canonical skills
