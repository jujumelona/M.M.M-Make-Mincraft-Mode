---
name: make-minecraft-mod
description: Front door for planning, building, revising, validating, and resuming M.M.M Minecraft mod work.
---

# Make Minecraft Mod

Use this as the plugin front door. Route the request to the canonical M.M.M skills rather than duplicating their policies.

- New mod idea: `intake-mod-brief` -> `research-minecraft-evidence` -> `plan-game-design` -> `freeze-approved-spec` -> `execute-complete-production`.
- Existing mod changes: `inspect-existing-project` -> `patch-existing-project` -> `compile-and-repair`.
- Resume a saved run: `resume-production-run`.
- Release work: `verify-minecraft-release` when available in the host skill catalog, then `release-security` and `publish-release`.

Keep version/evidence/generation/validation authority with the canonical skills and MCP stages. Do not invent a second execution protocol in this wrapper.
MAKE_SKILL
