name: Apply MCP role scope once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-mcp-role-scope-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Sync current main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Apply role-scoped external MCP execution guard and tests
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          # external_mcp_router.py: the federation router itself must never leave
          # the model-role provider allowlist, including fallback/corroboration routes.
          path = "minecraft_mod_ai/external_mcp_router.py"
          replace_once(path, "from typing import Any, Mapping\n", "from typing import Any, Collection, Mapping\n")
          replace_once(
              path,
              "class ExternalMCPError(RuntimeError):\n    pass\n\n\n@dataclass(frozen=True)",
              "class ExternalMCPError(RuntimeError):\n    pass\n\n\ndef _server_scope(values: Collection[str] | None) -> frozenset[str] | None:\n    if values is None:\n        return None\n    return frozenset(\n        value\n        for raw in values\n        if (value := str(raw).strip())\n    )\n\n\n@dataclass(frozen=True)",
          )
          replace_once(
              path,
              "    def capability_manifest(\n        self,\n        *,\n        stage: str,\n        target: Any = None,\n        max_access: str = \"read\",\n    ) -> dict[str, Any]:\n        resolved = MCPRouteTarget.from_value(target)\n",
              "    def capability_manifest(\n        self,\n        *,\n        stage: str,\n        target: Any = None,\n        max_access: str = \"read\",\n        allowed_server_ids: Collection[str] | None = None,\n    ) -> dict[str, Any]:\n        resolved = MCPRouteTarget.from_value(target)\n        allowed_servers = _server_scope(allowed_server_ids)\n",
          )
          replace_once(
              path,
              "            routes = self.registry.routes(\n                capability,\n                stage=stage,\n                minecraft_version=resolved.minecraft_version,\n                loader=resolved.loader,\n                max_access=max_access,\n            )\n            if routes:\n",
              "            routes = self.registry.routes(\n                capability,\n                stage=stage,\n                minecraft_version=resolved.minecraft_version,\n                loader=resolved.loader,\n                max_access=max_access,\n            )\n            if allowed_servers is not None:\n                routes = [\n                    route\n                    for route in routes\n                    if str(route[\"server\"]) in allowed_servers\n                ]\n            if routes:\n",
          )
          replace_once(
              path,
              "        required: bool = False,\n        max_access: str = \"read\",\n        disposable_runtime: bool = False,\n    ) -> dict[str, Any]:\n",
              "        required: bool = False,\n        max_access: str = \"read\",\n        disposable_runtime: bool = False,\n        allowed_server_ids: Collection[str] | None = None,\n    ) -> dict[str, Any]:\n",
          )
          replace_once(
              path,
              "        resolved = MCPRouteTarget.from_value(target)\n        if stage != \"runtime\" and max_access != \"read\":\n",
              "        resolved = MCPRouteTarget.from_value(target)\n        allowed_servers = _server_scope(allowed_server_ids)\n        if stage != \"runtime\" and max_access != \"read\":\n",
          )
          replace_once(
              path,
              "        routes = self.registry.routes(\n            capability,\n            stage=stage,\n            minecraft_version=resolved.minecraft_version,\n            loader=resolved.loader,\n            max_access=max_access,\n        )\n        attempts: list[dict[str, Any]] = []\n",
              "        routes = self.registry.routes(\n            capability,\n            stage=stage,\n            minecraft_version=resolved.minecraft_version,\n            loader=resolved.loader,\n            max_access=max_access,\n        )\n        if allowed_servers is not None:\n            routes = [\n                route\n                for route in routes\n                if str(route[\"server\"]) in allowed_servers\n            ]\n        attempts: list[dict[str, Any]] = []\n",
          )

          # external_agent_bridge.py: propagate role scope through discovery, schema
          # cache, live schema selection, and invocation. Cache keys include the scope
          # so one role can never inherit another role's provider schema.
          path = "minecraft_mod_ai/external_agent_bridge.py"
          replace_once(path, "from typing import Any, Mapping\n", "from typing import Any, Collection, Mapping\n")
          replace_once(
              path,
              "        self._schema_cache: dict[tuple[str, str, str, str, str], dict[str, Any]] = {}\n",
              "        self._schema_cache: dict[\n            tuple[str, str, str, str, str, tuple[str, ...] | None], dict[str, Any]\n        ] = {}\n",
          )
          replace_once(
              path,
              "    def call(\n        self,\n        stage: str,\n        name: str,\n        payload: Mapping[str, Any],\n    ) -> dict[str, Any]:\n",
              "    def call(\n        self,\n        stage: str,\n        name: str,\n        payload: Mapping[str, Any],\n        *,\n        allowed_server_ids: Collection[str] | None = None,\n    ) -> dict[str, Any]:\n",
          )
          replace_once(
              path,
              "        router = self._external_router()\n\n        if name == CAPABILITIES_TOOL:\n",
              "        router = self._external_router()\n        allowed_servers = (\n            None\n            if allowed_server_ids is None\n            else frozenset(\n                value\n                for raw in allowed_server_ids\n                if (value := str(raw).strip())\n            )\n        )\n\n        if name == CAPABILITIES_TOOL:\n",
          )
          replace_once(
              path,
              "                max_access=max_access,\n            )\n\n        capability = str(payload.get(\"capability\", \"\")).strip()\n",
              "                max_access=max_access,\n                allowed_server_ids=allowed_servers,\n            )\n\n        capability = str(payload.get(\"capability\", \"\")).strip()\n",
          )
          replace_once(
              path,
              "                target[\"mappings\"],\n            )\n",
              "                target[\"mappings\"],\n                None if allowed_servers is None else tuple(sorted(allowed_servers)),\n            )\n",
          )
          replace_once(
              path,
              "                target,\n                max_access,\n            )\n",
              "                target,\n                max_access,\n                allowed_servers,\n            )\n",
          )
          replace_once(
              path,
              "            max_access=max_access,\n            disposable_runtime=bool(payload.get(\"disposable_runtime\", False)),\n        )\n",
              "            max_access=max_access,\n            disposable_runtime=bool(payload.get(\"disposable_runtime\", False)),\n            allowed_server_ids=allowed_servers,\n        )\n",
          )
          replace_once(
              path,
              "        target: Mapping[str, str],\n        max_access: str,\n    ) -> dict[str, Any]:\n",
              "        target: Mapping[str, str],\n        max_access: str,\n        allowed_server_ids: Collection[str] | None,\n    ) -> dict[str, Any]:\n",
          )
          replace_once(
              path,
              "        routes = router.registry.routes(\n            capability,\n            stage=stage,\n            minecraft_version=resolved.minecraft_version,\n            loader=resolved.loader,\n            max_access=max_access,\n        )\n        attempts: list[dict[str, Any]] = []\n",
              "        routes = router.registry.routes(\n            capability,\n            stage=stage,\n            minecraft_version=resolved.minecraft_version,\n            loader=resolved.loader,\n            max_access=max_access,\n        )\n        if allowed_server_ids is not None:\n            routes = [\n                route\n                for route in routes\n                if str(route[\"server\"]) in allowed_server_ids\n            ]\n        attempts: list[dict[str, Any]] = []\n",
          )

          # agent_tool_runtime.py: retain the legacy host call, but give model execution
          # an explicit scoped path. First-party tools are unchanged.
          path = "minecraft_mod_ai/agent_tool_runtime.py"
          replace_once(path, "from typing import Any, Mapping\n", "from typing import Any, Collection, Mapping\n")
          old = '''    def call(\n        self,\n        stage: str,\n        name: str,\n        arguments: Mapping[str, Any] | None = None,\n    ) -> dict[str, Any]:\n        selected = self._stage(stage)\n        tool_name = name.strip()\n        if not tool_name:\n            raise AgentToolRuntimeError("tool name must not be empty")\n        if tool_name in _BLOCKED_MODEL_TOOLS:\n            raise AgentToolRuntimeError(\n                f"Tool {tool_name!r} is intentionally not model-callable."\n            )\n        # Materialize the authoritative stage schema once. Keep the immutable name\n        # set beside it so hot-path calls do not rebuild the same set repeatedly.\n        self.tool_schemas(selected)\n        with self._lock:\n            allowed = self._allowed_tool_cache[selected]\n        if tool_name not in allowed:\n            raise AgentToolRuntimeError(\n                f"Tool {tool_name!r} is not exposed in stage {selected!r}."\n            )\n        payload = dict(arguments or {})\n        if tool_name in EXTERNAL_TOOL_NAMES:\n            return _bounded_result(\n                self._external_bridge.call(selected, tool_name, payload)\n            )\n        result = self._run_async(\n            self._call_tool_async,\n            selected,\n            tool_name,\n            payload,\n        )\n        return _bounded_result(result)\n\n'''
          new = '''    def call(\n        self,\n        stage: str,\n        name: str,\n        arguments: Mapping[str, Any] | None = None,\n    ) -> dict[str, Any]:\n        """Host-stage call. ModelRouter uses call_scoped for model-owned execution."""\n        return self._call(\n            stage,\n            name,\n            arguments,\n            external_server_ids=None,\n        )\n\n    def call_scoped(\n        self,\n        stage: str,\n        name: str,\n        arguments: Mapping[str, Any] | None = None,\n        *,\n        external_server_ids: Collection[str],\n    ) -> dict[str, Any]:\n        """Execute a model tool while enforcing its reviewed external MCP providers."""\n        return self._call(\n            stage,\n            name,\n            arguments,\n            external_server_ids=frozenset(\n                value\n                for raw in external_server_ids\n                if (value := str(raw).strip())\n            ),\n        )\n\n    def _call(\n        self,\n        stage: str,\n        name: str,\n        arguments: Mapping[str, Any] | None,\n        *,\n        external_server_ids: frozenset[str] | None,\n    ) -> dict[str, Any]:\n        selected = self._stage(stage)\n        tool_name = name.strip()\n        if not tool_name:\n            raise AgentToolRuntimeError("tool name must not be empty")\n        if tool_name in _BLOCKED_MODEL_TOOLS:\n            raise AgentToolRuntimeError(\n                f"Tool {tool_name!r} is intentionally not model-callable."\n            )\n        # Materialize the authoritative stage schema once. Keep the immutable name\n        # set beside it so hot-path calls do not rebuild the same set repeatedly.\n        self.tool_schemas(selected)\n        with self._lock:\n            allowed = self._allowed_tool_cache[selected]\n        if tool_name not in allowed:\n            raise AgentToolRuntimeError(\n                f"Tool {tool_name!r} is not exposed in stage {selected!r}."\n            )\n        payload = dict(arguments or {})\n        if tool_name in EXTERNAL_TOOL_NAMES:\n            return _bounded_result(\n                self._external_bridge.call(\n                    selected,\n                    tool_name,\n                    payload,\n                    allowed_server_ids=external_server_ids,\n                )\n            )\n        result = self._run_async(\n            self._call_tool_async,\n            selected,\n            tool_name,\n            payload,\n        )\n        return _bounded_result(result)\n\n'''
          replace_once(path, old, new)

          # agent_capability_context.py: one canonical stage+resident-role resolution
          # supplies the exact server scope used at execution time.
          path = "minecraft_mod_ai/agent_capability_context.py"
          replace_once(
              path,
              "    return selected_role\n\n\n@lru_cache(maxsize=8)\n",
              "    return selected_role\n\n\ndef reviewed_mcp_servers_for_model_role(\n    stage: str, model_role: str\n) -> frozenset[str]:\n    \"\"\"Return the reviewed external MCP server scope for this logical agent turn.\"\"\"\n    return frozenset(\n        mcp_servers_for_model_role(_policy_model_role(stage, model_role))\n    )\n\n\n@lru_cache(maxsize=8)\n",
          )
          replace_once(
              path,
              "    reviewed_servers = mcp_servers_for_model_role(policy_role)\n",
              "    reviewed_servers = reviewed_mcp_servers_for_model_role(selected, model_role)\n",
          )

          # model_router.py: external tools fail closed if the runtime cannot enforce
          # role scope; first-party fake runtimes used by unit tests retain compatibility.
          path = "minecraft_mod_ai/model_router.py"
          replace_once(
              path,
              "        from .agent_capability_context import skills_for_tool\n",
              "        from .agent_capability_context import (\n            reviewed_mcp_servers_for_model_role,\n            skills_for_tool,\n        )\n",
          )
          replace_once(
              path,
              "        require_rag = bool(\n            self._agent_require_fresh_evidence\n            and role in {\"coder\", \"coder_safe\"}\n            and exposed_tools & _RAG_EVIDENCE_TOOLS\n        )\n\n        while True:\n",
              "        require_rag = bool(\n            self._agent_require_fresh_evidence\n            and role in {\"coder\", \"coder_safe\"}\n            and exposed_tools & _RAG_EVIDENCE_TOOLS\n        )\n        reviewed_external_servers = reviewed_mcp_servers_for_model_role(stage, role)\n\n        while True:\n",
          )
          replace_once(
              path,
              "                    result = runtime.call(stage, call.name, call.arguments)\n",
              "                    scoped_call = getattr(runtime, \"call_scoped\", None)\n                    if callable(scoped_call):\n                        result = scoped_call(\n                            stage,\n                            call.name,\n                            call.arguments,\n                            external_server_ids=reviewed_external_servers,\n                        )\n                    elif call.name.startswith(\"external_mcp_\"):\n                        raise ModelConfigurationError(\n                            \"External MCP execution requires a role-scoped agent runtime.\"\n                        )\n                    else:\n                        result = runtime.call(stage, call.name, call.arguments)\n",
          )

          # Real generation-stage stdio handshake: no hand-authored schema can satisfy this.
          path = "tests/test_mcp_stdio.py"
          append = '''\n\ndef test_real_stdio_generation_stage_exposes_coder_evidence_tools(tmp_path: Path) -> None:\n    tools = asyncio.run(_handshake(tmp_path / "workspace", "generation"))\n    assert "inspect_existing_mod" in tools\n    assert "search_project_rag" in tools\n    assert "search_code_rag" in tools\n    assert "runtime_start_server" not in tools\n    assert "package_release" not in tools\n    assert "plan_complete_game" not in tools\n'''
          p = Path(path)
          text = p.read_text(encoding="utf-8")
          if "test_real_stdio_generation_stage_exposes_coder_evidence_tools" not in text:
              p.write_text(text.rstrip() + append + "\n", encoding="utf-8")

          # Focused policy/route regression tests.
          Path("tests/test_external_mcp_role_scope.py").write_text(r'''from __future__ import annotations

from pathlib import Path
from types import SimpleNamespace

from minecraft_mod_ai.agent_tool_runtime import AgentToolRuntime
from minecraft_mod_ai.external_agent_bridge import (
    CALL_TOOL,
    CAPABILITIES_TOOL,
    SCHEMA_TOOL,
    ExternalAgentBridge,
)
from minecraft_mod_ai.external_mcp import ExternalMCPRegistry
from minecraft_mod_ai.external_mcp_router import ExternalMCPRouter
from minecraft_mod_ai.model_adapters import GenerationResponse, ToolCall
from minecraft_mod_ai.model_router import ModelRouter


def _registry(tmp_path: Path) -> ExternalMCPRegistry:
    path = tmp_path / "role-scope-mcp.yaml"
    path.write_text(
        """schema_version: mmm/external-mcp-registry-v2
servers:
  allowed-provider:
    status: enabled
    transport: stdio
    command: [allowed]
    version_policy: dynamic
    loaders: [fabric]
    trust: test
    capabilities:
      source_search:
        tool: allowed_search
        access: read
        stages: [generation]
        priority: 20
  forbidden-provider:
    status: enabled
    transport: stdio
    command: [forbidden]
    version_policy: dynamic
    loaders: [fabric]
    trust: test
    capabilities:
      source_search:
        tool: forbidden_search
        access: read
        stages: [generation]
        priority: 1
      forbidden_only:
        tool: forbidden_only
        access: read
        stages: [generation]
        priority: 1
""",
        encoding="utf-8",
    )
    return ExternalMCPRegistry(path)


def test_router_filters_manifest_and_invocation_to_role_server_scope(tmp_path, monkeypatch) -> None:
    router = ExternalMCPRouter(_registry(tmp_path))
    manifest = router.capability_manifest(
        stage="generation",
        allowed_server_ids={"allowed-provider"},
    )
    assert set(manifest["capabilities"]) == {"source_search"}
    assert [row["server"] for row in manifest["capabilities"]["source_search"]] == [
        "allowed-provider"
    ]

    calls: list[str] = []

    def fake_call(server_name, entry, *, tool, arguments):
        calls.append(server_name)
        return {
            "server_info": {"name": server_name},
            "result": {"structured": {"hits": [server_name]}},
        }

    monkeypatch.setattr(router, "_call_provider", fake_call)
    bundle = router.invoke(
        "source_search",
        stage="generation",
        arguments={"query": "Block"},
        allowed_server_ids={"allowed-provider"},
    )
    assert bundle["status"] == "PASS"
    assert calls == ["allowed-provider"]
    assert bundle["evidence"][0]["server"] == "allowed-provider"

    denied = router.invoke(
        "forbidden_only",
        stage="generation",
        allowed_server_ids={"allowed-provider"},
    )
    assert denied["status"] == "UNAVAILABLE"
    assert denied["attempts"] == []


def test_bridge_schema_cache_isolated_by_server_scope(monkeypatch) -> None:
    bridge = ExternalAgentBridge()
    seen: list[frozenset[str]] = []

    async def fake_describe(stage, capability, target, max_access, allowed_server_ids):
        scope = frozenset(allowed_server_ids or ())
        seen.append(scope)
        return {"server": sorted(scope)[0], "status": "PASS"}

    monkeypatch.setattr(bridge, "_describe_async", fake_describe)
    one = bridge.call(
        "generation",
        SCHEMA_TOOL,
        {"capability": "source_search"},
        allowed_server_ids={"provider-a"},
    )
    two = bridge.call(
        "generation",
        SCHEMA_TOOL,
        {"capability": "source_search"},
        allowed_server_ids={"provider-b"},
    )
    again = bridge.call(
        "generation",
        SCHEMA_TOOL,
        {"capability": "source_search"},
        allowed_server_ids={"provider-a"},
    )
    assert one["server"] == "provider-a"
    assert two["server"] == "provider-b"
    assert again == one
    assert seen == [frozenset({"provider-a"}), frozenset({"provider-b"})]


def test_agent_runtime_propagates_exact_external_server_scope(tmp_path, monkeypatch) -> None:
    runtime = AgentToolRuntime(profile="test", workspace_root=tmp_path)
    runtime._schema_cache["generation"] = tuple(
        ExternalAgentBridge.tool_schemas("generation")
    )
    runtime._allowed_tool_cache["generation"] = frozenset(
        {CAPABILITIES_TOOL, SCHEMA_TOOL, CALL_TOOL}
    )
    seen: dict[str, object] = {}

    def fake_bridge(stage, name, payload, *, allowed_server_ids=None):
        seen["stage"] = stage
        seen["name"] = name
        seen["scope"] = frozenset(allowed_server_ids or ())
        return {"status": "PASS"}

    monkeypatch.setattr(runtime._external_bridge, "call", fake_bridge)
    result = runtime.call_scoped(
        "generation",
        CALL_TOOL,
        {"capability": "source_search", "arguments": {}},
        external_server_ids={"minecraft-dev", "mcmodding-docs"},
    )
    assert result["status"] == "PASS"
    assert seen == {
        "stage": "generation",
        "name": CALL_TOOL,
        "scope": frozenset({"minecraft-dev", "mcmodding-docs"}),
    }


class _Registry:
    def load_profile(self, name):
        return object()

    def role(self, profile, role):
        return SimpleNamespace(
            role=role,
            provider="local",
            adapter="llama_cpp",
            exclusive_gpu=False,
        )


class _ExternalRuntime:
    def __init__(self) -> None:
        self.scopes: list[frozenset[str]] = []
        self.unscoped_calls = 0

    def tool_schemas(self, stage):
        return ExternalAgentBridge.tool_schemas(stage)

    def call_scoped(self, stage, name, arguments, *, external_server_ids):
        self.scopes.append(frozenset(external_server_ids))
        return {"status": "PASS", "capability": arguments.get("capability")}

    def call(self, stage, name, arguments):
        self.unscoped_calls += 1
        raise AssertionError("external MCP model calls must never use the unscoped path")


class _ExternalAdapter:
    def __init__(self) -> None:
        self.count = 0

    def generate_turn(self, request):
        self.count += 1
        if self.count == 1:
            return GenerationResponse(
                tool_calls=(
                    ToolCall(
                        id="mcp_1",
                        name=CALL_TOOL,
                        arguments={"capability": "source_search", "arguments": {}},
                        raw_arguments=(
                            '{"capability":"source_search","arguments":{}}'
                        ),
                    ),
                )
            )
        return GenerationResponse(content="done")


def test_model_router_enforces_minecraftcoder_server_scope(monkeypatch) -> None:
    runtime = _ExternalRuntime()
    adapter = _ExternalAdapter()
    router = ModelRouter(
        profile="test",
        registry=_Registry(),
        agent_tool_runtime_factory=lambda **_: runtime,
    )
    monkeypatch.setattr(router, "_new_text_adapter", lambda config, role: adapter)
    assert router.generate_text(
        "coder",
        ({"role": "user", "content": "inspect exact Minecraft API"},),
        tool_stage="generation",
    ) == "done"
    assert runtime.unscoped_calls == 0
    assert len(runtime.scopes) == 1
    scope = runtime.scopes[0]
    assert "minecraft-dev" in scope
    assert "mcmodding-docs" in scope
    assert "minecraft-wiki" in scope
    assert "fabric-game-runtime" not in scope
    assert "minecraft-player-agent" not in scope


def test_model_router_fails_closed_for_external_runtime_without_scope(monkeypatch) -> None:
    class UnscopedRuntime:
        def tool_schemas(self, stage):
            return ExternalAgentBridge.tool_schemas(stage)

        def call(self, stage, name, arguments):
            raise AssertionError("unscoped external path must not execute")

    runtime = UnscopedRuntime()
    adapter = _ExternalAdapter()
    router = ModelRouter(
        profile="test",
        registry=_Registry(),
        agent_tool_runtime_factory=lambda **_: runtime,
    )
    monkeypatch.setattr(router, "_new_text_adapter", lambda config, role: adapter)
    assert router.generate_text(
        "coder",
        ({"role": "user", "content": "inspect"},),
        tool_stage="generation",
    ) == "done"
    observation = adapter.count
    assert observation == 2
''', encoding="utf-8")

          # Remove this temporary workflow in the same tested commit.
          Path(".github/workflows/apply-mcp-role-scope-once.yml").unlink()
          PY
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Compile and lint touched Python
        run: |
          python -m compileall -q minecraft_mod_ai tests
