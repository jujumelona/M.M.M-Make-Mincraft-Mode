            tests/test_mcp_stdio.py --select F,E7,E9
      - name: Run focused MCP routing tests
        run: >-
          python -m pytest -q
          tests/test_external_mcp_role_scope.py
          tests/test_external_mcp_router.py
          tests/test_agent_tool_calling.py
          tests/test_agent_runtime_hot_paths.py
          tests/test_agent_capability_context.py
          tests/test_llama_parallel_runtime_contract.py
          tests/test_mcp_stdio.py
      - name: Commit tested patch to main
        run: |
          git config user.name juju-mmm-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "Enforce role-scoped Minecraft MCP execution"
          git pull --rebase origin main
          git push origin HEAD:main
