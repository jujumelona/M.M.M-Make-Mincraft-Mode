name: Apply MCP role scope once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-mcp-role-scope-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Sync current main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Apply exact patch
        run: python .github/scripts/apply_mcp_role_scope_once.py
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Compile and lint touched Python
        run: |
          python -m compileall -q minecraft_mod_ai tests
          python -m ruff check minecraft_mod_ai tests --select F,E7,E9
      - name: Run focused MCP routing tests
        run: >-
          python -m pytest -q
          tests/test_external_mcp_role_scope.py
          tests/test_external_mcp_router.py
          tests/test_agent_tool_calling.py
          tests/test_agent_runtime_hot_paths.py
          tests/test_agent_capability_context.py
          tests/test_llama_parallel_runtime_contract.py
          tests/test_mcp_stdio.py
          tests/test_runtime_bootstrap_clean.py
      - name: Commit tested patch to main
        run: |
          git config user.name juju-mmm-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "Enforce role-scoped Minecraft MCP execution"
          git pull --rebase origin main
          git push origin HEAD:main
