name: One Shot Runtime Repair
on:
  push:
    paths:
      - '.github/workflows/one-shot-runtime-repair.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Preserve native llama sizing
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, *, required: bool = True) -> None:
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  if required:
                      raise SystemExit(f'pattern not found in {path}: {old[:80]!r}')
                  return
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'minecraft_mod_ai/qwen35_mtp_hotpath_contract.py',
              'def _context_size(config: Any | None = None) -> int:\n',
              'def _context_size(config: Any | None = None) -> int | None:\n',
          )
          replace_once(
              'minecraft_mod_ai/qwen35_mtp_hotpath_contract.py',
              '    return 0\n\n\ndef _draft_gpu_layers()',
              '    return None\n\n\ndef _draft_gpu_layers()',
          )
          replace_once(
              'minecraft_mod_ai/qwen35_mtp_hotpath_contract.py',
              '        _set_option(args, ("--ctx-size", "-c"), str(_context_size(config)))\n',
              '        context = _context_size(config)\n        if context is not None:\n            _set_option(args, ("--ctx-size", "-c"), str(context))\n',
          )

          replace_once(
              'minecraft_mod_ai/llama_server_hardware_policy.py',
              '    try:\n        index = args.index("--gpu-layers")\n        args[index + 1] = "auto"\n    except (ValueError, IndexError):\n        pass\n',
              '',
              required=False,
          )
          replace_once(
              'minecraft_mod_ai/llama_server_hardware_policy.py',
              '        def adaptive_variant_args(variant: Any) -> list[str]:\n            args = original_variant(variant)\n            try:\n                index = args.index("--spec-draft-ngl")\n                args[index + 1] = "auto"\n            except (ValueError, IndexError):\n                pass\n            return args\n',
              '        def adaptive_variant_args(variant: Any) -> list[str]:\n            return original_variant(variant)\n',
              required=False,
          )

          replace_once(
              'minecraft_mod_ai/llama_server_kernel_autotune.py',
              '            baseline = _baseline_config()\n            active = _active_config(baseline)\n            explicit_flash = os.environ.get("MMM_LLAMA_FLASH_ATTN", "").strip().lower()\n            flash = explicit_flash if explicit_flash in _ALLOWED_FLASH else active.flash_attn\n            batch = _operator_batch() or active.batch\n            generic_kv = _valid_kv(os.environ.get("MMM_KV_CACHE_QUANT", "q4_0"))\n            k = _valid_kv(os.environ.get("MMM_LLAMA_CACHE_TYPE_K", active.cache_type_k or generic_kv))\n            v = _valid_kv(os.environ.get("MMM_LLAMA_CACHE_TYPE_V", active.cache_type_v or generic_kv))\n            _replace_option(args, ("--flash-attn", "-fa"), flash)\n            _replace_option(args, ("--batch-size", "-b"), str(batch))\n            _replace_option(args, ("--cache-type-k", "-ctk"), k)\n            _replace_option(args, ("--cache-type-v", "-ctv"), v)\n            # Never leave physical batch above logical batch after an auto batch choice.\n            for name in ("--ubatch-size", "-ub"):\n                if name in args:\n                    index = args.index(name)\n                    if index + 1 < len(args):\n                        args[index + 1] = str(min(batch, _int(args[index + 1], batch)))\n                    break\n            return args\n',
              '            explicit_flash = os.environ.get("MMM_LLAMA_FLASH_ATTN", "").strip().lower()\n            active_flash = os.environ.get("MMM_LLAMA_ACTIVE_FLASH_ATTN", "").strip().lower()\n            if explicit_flash in _ALLOWED_FLASH:\n                _replace_option(args, ("--flash-attn", "-fa"), explicit_flash)\n            elif active_flash in _ALLOWED_FLASH:\n                _replace_option(args, ("--flash-attn", "-fa"), active_flash)\n\n            explicit_batch = _operator_batch()\n            active_batch = os.environ.get("MMM_LLAMA_ACTIVE_BATCH", "").strip()\n            if explicit_batch is not None:\n                _replace_option(args, ("--batch-size", "-b"), str(explicit_batch))\n            elif active_batch:\n                _replace_option(args, ("--batch-size", "-b"), str(_int(active_batch, 2048)))\n\n            generic_kv = os.environ.get("MMM_KV_CACHE_QUANT", "").strip().lower()\n            explicit_k = os.environ.get("MMM_LLAMA_CACHE_TYPE_K", "").strip().lower()\n            explicit_v = os.environ.get("MMM_LLAMA_CACHE_TYPE_V", "").strip().lower()\n            active_k = os.environ.get("MMM_LLAMA_ACTIVE_CACHE_TYPE_K", "").strip().lower()\n            active_v = os.environ.get("MMM_LLAMA_ACTIVE_CACHE_TYPE_V", "").strip().lower()\n            k = explicit_k or (generic_kv if generic_kv in _ALLOWED_KV else active_k)\n            v = explicit_v or (generic_kv if generic_kv in _ALLOWED_KV else active_v)\n            if k in _ALLOWED_KV:\n                _replace_option(args, ("--cache-type-k", "-ctk"), k)\n            if v in _ALLOWED_KV:\n                _replace_option(args, ("--cache-type-v", "-ctv"), v)\n            return args\n',
              required=False,
          )
          replace_once(
              'minecraft_mod_ai/llama_server_kernel_autotune.py',
              '                return (min(batch, _int(explicit, 512)),)\n',
              '                return (_int(explicit, 512),)\n',
              required=False,
          )

          p = Path('minecraft_mod_ai/llama_tuning_pipeline.py')
          s = p.read_text()
          s = s.replace('                if value >= 0:\n                    return value\n', '                if value > 0:\n                    return value\n', 1)
          s = s.replace(
              '            if context is None:\n                return args\n            for name in ("--ctx-size", "-c"):\n',
              '            if context is None:\n                for name in ("--ctx-size", "-c"):\n                    while name in args:\n                        index = args.index(name)\n                        del args[index]\n                        if index < len(args):\n                            del args[index]\n                return args\n            for name in ("--ctx-size", "-c"):\n',
              1,
          )
          s = s.replace('            self._install_profile_context_authority()\n            install_single_stream_agentic_policy(', '            install_single_stream_agentic_policy(', 1)
          marker = '            TuningStage("multimodal", install_multimodal_stage),\n'
          if marker not in s:
              raise SystemExit('pipeline final stage marker not found')
          s = s.replace(marker, marker + '            TuningStage("context-authority", self._install_profile_context_authority),\n', 1)
          p.write_text(s)
          PY
      - name: Test native runtime contracts
        run: |
          python -m pip install --prefer-binary -e '.[dev]' >/dev/null
          python -m pytest -q tests/test_llama_context_policy.py tests/test_llama_server_native_resource_fit.py tests/test_llama_parallel_runtime_contract.py
          python -m ruff check minecraft_mod_ai/qwen35_mtp_hotpath_contract.py minecraft_mod_ai/llama_server_hardware_policy.py minecraft_mod_ai/llama_server_kernel_autotune.py minecraft_mod_ai/llama_tuning_pipeline.py --select F,E7,E9
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-runtime-repair.yml
          git add minecraft_mod_ai/qwen35_mtp_hotpath_contract.py minecraft_mod_ai/llama_server_hardware_policy.py minecraft_mod_ai/llama_server_kernel_autotune.py minecraft_mod_ai/llama_tuning_pipeline.py
          git commit -m 'Preserve native llama resource authority'
          git pull --rebase origin main
          git push origin HEAD:main
