name: MMM retrieval liveness retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mmm-retrieval-liveness-retry.yml'

permissions:
  contents: write

concurrency:
  group: mmm-retrieval-liveness-fix-main
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Sync latest main
        run: git pull --ff-only origin main
      - name: Reuse tested patch program
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/mmm-retrieval-liveness-fix.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          program = textwrap.dedent(workflow[start:end])
          exec(compile(program, '<retrieval-liveness-patch>', 'exec'), {'__name__': '__main__'})
          PY
      - name: Compile patched sources
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            minecraft_mod_ai/agentic_research_fusion.py \
            minecraft_mod_ai/reuse_discovery.py \
            minecraft_mod_ai/minecraft_mcp_evidence_contract.py \
            tests/test_retrieval_liveness_deadline_contract.py
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Run retrieval liveness regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_retrieval_liveness_deadline_contract.py
      - name: Run adjacent deadline regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_remaining_bottleneck_contract.py \
            tests/test_planning_deadline_hardening.py
      - name: Normalize imports
        shell: bash
        run: |
          set -euo pipefail
          ruff check --select I --fix \
            minecraft_mod_ai/agentic_research_fusion.py \
            minecraft_mod_ai/reuse_discovery.py \
            minecraft_mod_ai/minecraft_mcp_evidence_contract.py \
            tests/test_retrieval_liveness_deadline_contract.py
      - name: Correctness lint
        shell: bash
        run: |
          set -euo pipefail
          ruff check --select E9,F63,F7,F82 \
            minecraft_mod_ai/agentic_research_fusion.py \
            minecraft_mod_ai/reuse_discovery.py \
            minecraft_mod_ai/minecraft_mcp_evidence_contract.py \
            tests/test_retrieval_liveness_deadline_contract.py
      - name: Re-run focused regressions after lint normalization
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_retrieval_liveness_deadline_contract.py \
            tests/test_remaining_bottleneck_contract.py \
            tests/test_planning_deadline_hardening.py
      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            .github/workflows/mmm-retrieval-liveness-fix.yml \
            .github/workflows/mmm-retrieval-liveness-retry.yml
          git add \
            minecraft_mod_ai/agentic_research_fusion.py \
            minecraft_mod_ai/reuse_discovery.py \
            minecraft_mod_ai/minecraft_mcp_evidence_contract.py \
            tests/test_retrieval_liveness_deadline_contract.py
          git commit -m 'fix: bound retrieval provider fanouts'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            sleep $((attempt * 2))
          done
          echo 'failed to push retrieval liveness fixes after retries' >&2
          exit 1
