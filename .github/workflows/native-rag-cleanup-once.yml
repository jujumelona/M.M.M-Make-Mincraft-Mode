name: Native RAG cleanup once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-rag-cleanup-once.yml

permissions:
  contents: write

concurrency:
  group: mmm-native-rag-cleanup-once
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
      - name: Move RAG performance into explicit canonical calls
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:100]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          rag = Path('minecraft_mod_ai/rag_index.py')
          replace_once(
              rag,
              '    def build(\n',
              '''    def build(\n        self,\n        roots: Sequence[str | Path],\n        *,\n        metadata: dict[str, Any],\n        router: ModelRouter | None = None,\n        semantic: bool = False,\n        max_files: int | None = None,\n    ) -> dict[str, Any]:\n        """Build or incrementally refresh through the canonical RAG performance path."""\n        from . import research_rag_performance\n\n        return research_rag_performance.build_index(\n            self,\n            roots,\n            metadata=metadata,\n            router=router,\n            semantic=semantic,\n            max_files=max_files,\n        )\n\n    def _full_rebuild(\n''',
          )
          replace_once(
              rag,
              'def _sqlite_search_pass(\n',
              '''def _sqlite_search_pass(\n    connection: sqlite3.Connection,\n    query: str,\n    *,\n    route: str,\n    limit: int,\n    metadata: dict[str, Any],\n    router: ModelRouter | None,\n    semantic: bool,\n    rerank: bool,\n    fts5_available: bool,\n) -> _PassResult:\n    """Use bounded ANN when eligible, with the exhaustive pass as correctness fallback."""\n    from . import research_rag_performance\n\n    return research_rag_performance.sqlite_search_pass(\n        connection,\n        query,\n        route=route,\n        limit=limit,\n        metadata=metadata,\n        router=router,\n        semantic=semantic,\n        rerank=rerank,\n        fts5_available=fts5_available,\n    )\n\n\ndef _full_sqlite_search_pass(\n''',
          )

          centroid = Path('minecraft_mod_ai/centroid_vector_rag.py')
          replace_once(
              centroid,
              'def direct_centroid_vector_search(\n',
              '''def direct_centroid_vector_search(\n    index_path: str | Path,\n    *,\n    query: str,\n    q1_vector: Sequence[float],\n    router: Any,\n    limit: int = 8,\n    required_metadata: Mapping[str, Any] | None = None,\n) -> dict[str, Any] | None:\n    """Use the bounded semantic path natively, with exhaustive search as fallback."""\n    from . import research_rag_performance\n\n    return research_rag_performance.centroid_vector_search(\n        index_path,\n        query=query,\n        q1_vector=q1_vector,\n        router=router,\n        limit=limit,\n        required_metadata=required_metadata,\n    )\n\n\ndef _full_direct_centroid_vector_search(\n''',
          )

          perf = Path('minecraft_mod_ai/research_rag_performance.py')
          source = perf.read_text(encoding='utf-8')
          tree = ast.parse(source)
          harden = next(
              node for node in tree.body
              if isinstance(node, ast.FunctionDef) and node.name == 'harden'
          )
          lines = source.splitlines(keepends=True)
          replacement = '''def _native_incremental_build():\n    from . import rag_index as rag\n\n    return _incremental_rag_build_factory(rag, rag.ProjectRAGIndex._full_rebuild)\n\n\n_native_incremental_build = lru_cache(maxsize=1)(_native_incremental_build)\n\n\ndef build_index(\n    index: Any,\n    roots: Sequence[str | Path],\n    *,\n    metadata: dict[str, Any],\n    router: Any | None = None,\n    semantic: bool = False,\n    max_files: int | None = None,\n) -> dict[str, Any]:\n    return _native_incremental_build()(\n        index,\n        roots,\n        metadata=metadata,\n        router=router,\n        semantic=semantic,\n        max_files=max_files,\n    )\n\n\ndef _native_sqlite_search_pass():\n    from . import rag_index as rag\n\n    return _bounded_sqlite_search_pass_factory(rag, rag._full_sqlite_search_pass)\n\n\n_native_sqlite_search_pass = lru_cache(maxsize=1)(_native_sqlite_search_pass)\n\n\ndef sqlite_search_pass(\n    connection: sqlite3.Connection,\n    query: str,\n    *,\n    route: str,\n    limit: int,\n    metadata: dict[str, Any],\n    router: Any | None,\n    semantic: bool,\n    rerank: bool,\n    fts5_available: bool,\n) -> Any:\n    return _native_sqlite_search_pass()(\n        connection,\n        query,\n        route=route,\n        limit=limit,\n        metadata=metadata,\n        router=router,\n        semantic=semantic,\n        rerank=rerank,\n        fts5_available=fts5_available,\n    )\n\n\ndef _native_centroid_search():\n    from . import centroid_vector_rag as centroid\n\n    return _bounded_centroid_factory(\n        centroid,\n        centroid._full_direct_centroid_vector_search,\n    )\n\n\n_native_centroid_search = lru_cache(maxsize=1)(_native_centroid_search)\n\n\ndef centroid_vector_search(\n    index_path: str | Path,\n    *,\n    query: str,\n    q1_vector: Sequence[float],\n    router: Any,\n    limit: int = 8,\n    required_metadata: Mapping[str, Any] | None = None,\n) -> dict[str, Any] | None:\n    return _native_centroid_search()(\n        index_path,\n        query=query,\n        q1_vector=q1_vector,\n        router=router,\n        limit=limit,\n        required_metadata=required_metadata,\n    )\n\n\ndef harden(rag_index_module: Any, centroid_module: Any) -> None:\n    """Compatibility verifier; canonical modules already own the optimized path."""\n    if not hasattr(rag_index_module.ProjectRAGIndex, '_full_rebuild'):\n        raise RuntimeError('ProjectRAGIndex native performance path is not installed.')\n    if not hasattr(rag_index_module, '_full_sqlite_search_pass'):\n        raise RuntimeError('RAG native bounded search path is not installed.')\n    if not hasattr(centroid_module, '_full_direct_centroid_vector_search'):\n        raise RuntimeError('Centroid native bounded search path is not installed.')\n'''
          lines[harden.lineno - 1:harden.end_lineno] = [replacement]
          updated = ''.join(lines)
          updated = updated.replace(
              '__all__ = ["harden"]',
              '__all__ = ["build_index", "sqlite_search_pass", "centroid_vector_search", "harden"]',
          )
          perf.write_text(updated, encoding='utf-8')

          bootstrap = Path('minecraft_mod_ai/runtime_bootstrap.py')
          replace_once(bootstrap, '        runtime_regression_fixes,\n', '')
          replace_once(bootstrap, '    runtime_regression_fixes.install()\n', '')

          Path('minecraft_mod_ai/runtime_regression_fixes.py').unlink()
          PY
      - name: Validate canonical RAG ownership
        run: |
          python -m compileall -q minecraft_mod_ai/rag_index.py minecraft_mod_ai/centroid_vector_rag.py minecraft_mod_ai/research_rag_performance.py minecraft_mod_ai/runtime_bootstrap.py
          python - <<'PY'
          import ast
          from pathlib import Path
          perf = ast.parse(Path('minecraft_mod_ai/research_rag_performance.py').read_text())
          harden = next(n for n in perf.body if isinstance(n, ast.FunctionDef) and n.name == 'harden')
          forbidden = []
          for node in ast.walk(harden):
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Attribute):
                          forbidden.append(ast.unparse(target))
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id == 'setattr':
                  forbidden.append('setattr')
          if forbidden:
              raise SystemExit(f'harden still mutates runtime implementations: {forbidden}')
          if Path('minecraft_mod_ai/runtime_regression_fixes.py').exists():
              raise SystemExit('runtime_regression_fixes.py still exists')
          PY
          git diff --check
      - name: Commit cleanup and remove one-shot workflow
        run: |
          rm .github/workflows/native-rag-cleanup-once.yml
          git add -A
          git diff --cached --check
          git commit -m "refactor(rag): make performance paths canonical"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
