name: Source Snapshot Export

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-snapshot-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pack source snapshot and history
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/source-snapshot.tar.gz" .
          git bundle create "$RUNNER_TEMP/repository.bundle" --all
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-snapshot-${{ github.sha }}
          path: |
            ${{ runner.temp }}/source-snapshot.tar.gz
            ${{ runner.temp }}/repository.bundle
          if-no-files-found: error
          retention-days: 1
