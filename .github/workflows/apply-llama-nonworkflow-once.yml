name: Apply validated llama runtime files once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-llama-nonworkflow-once.yml

permissions:
  contents: write

concurrency:
  group: apply-validated-llama-runtime-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply validated payload
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import re
          import zlib
          from pathlib import Path

          workflow = Path('.github/workflows/apply-llama-max-once.yml').read_text(encoding='utf-8')
          parts = []
          for index in (1, 2, 3):
              match = re.search(rf'^  PATCH_B64_{index}: (.+)$', workflow, re.MULTILINE)
              if match is None:
                  raise RuntimeError(f'PATCH_B64_{index} missing')
              parts.append(match.group(1).strip())
          source = zlib.decompress(base64.b64decode(''.join(parts))).decode('utf-8')
          exec(compile(source, '<validated-llama-max-patch>', 'exec'))
          PY

      - name: Validate runtime files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --prefer-binary -e '.[dev]'
          python -m compileall -q minecraft_mod_ai tests tools download_resources.py
          python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9
          vulture minecraft_mod_ai tools download_resources.py --min-confidence 100
          python -m pytest -q tests/test_qwen35_t4_single_stream_tuning.py tests/test_native_llama_prebuilt_contract.py tests/test_runtime_bootstrap_clean.py

      - name: Push only validated non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'juju-mmm-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            tools/colab_runtime_setup.py \
            tools/native_llama_bundle.py \
            minecraft_mod_ai/qwen35_t4_single_stream_tuning.py \
            minecraft_mod_ai/llama_tuning_pipeline.py \
            tests/test_native_llama_prebuilt_contract.py \
            tests/test_qwen35_t4_single_stream_tuning.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'validated runtime files already present'
            exit 0
          fi
          git commit -m 'Maximize latest llama.cpp runtime throughput on T4'
          git pull --rebase origin main
          git push origin HEAD:main
