name: Apply GitHub adaptive retrieval overhaul

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-github-adaptive-retrieval.yml'
      - 'scripts/apply_github_retrieval_overhaul.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dev dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply retrieval architecture patch
        run: python scripts/apply_github_retrieval_overhaul.py
      - name: Make source tokenization identifier-aware
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('minecraft_mod_ai/github_adaptive_retrieval.py')
          s = p.read_text(encoding='utf-8')
          anchor = '_TOKEN = re.compile(r"[A-Za-z0-9]+", re.UNICODE)\n'
          replacement = '''_TOKEN = re.compile(r"[A-Za-z0-9]+", re.UNICODE)
          _CAMEL_BOUNDARY = re.compile(
              r"(?<=[a-z0-9])(?=[A-Z])|(?<=[A-Z])(?=[A-Z][a-z])"
          )


          def _lexemes(value: str) -> tuple[str, ...]:
              """Split path/source identifiers before lexical retrieval scoring."""

              expanded = _CAMEL_BOUNDARY.sub(" ", str(value or ""))
              return tuple(_TOKEN.findall(expanded))
          '''
          if anchor not in s:
              raise SystemExit('tokenizer anchor drifted')
          s = s.replace(anchor, replacement, 1)
          s = s.replace('for raw in _TOKEN.findall(normalized):', 'for raw in _lexemes(normalized):', 1)
          s = s.replace('for raw in _TOKEN.findall(str(text or "")):', 'for raw in _lexemes(str(text or "")):', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Reject legacy recall cutoffs
        shell: bash
        run: |
          ! grep -R "_MAX_SOURCE_FILES_PER_REPO\|_MAX_SOURCE_REPOS_PER_QUERY\|next(iter(consumers))\|closure\[:10\]" -n minecraft_mod_ai
      - name: Compile and lint
        run: |
          python -m compileall -q minecraft_mod_ai
          python -m ruff check minecraft_mod_ai tests --select F,E7,E9
      - name: Run GitHub retrieval regression suite
        run: |
          python -m pytest -q \
            tests/test_github_adaptive_retrieval.py \
            tests/test_grounded_rag_runtime_contract.py \
            tests/test_pre_design_rag_root_cause.py
      - name: Commit verified overhaul to main
        shell: bash
        run: |
          rm scripts/apply_github_retrieval_overhaul.py
          rm .github/workflows/apply-github-adaptive-retrieval.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/github_adaptive_retrieval.py \
                  minecraft_mod_ai/research_grounded_rag_contract.py \
                  minecraft_mod_ai/grounded_rag_runtime_contract.py \
                  tests/test_github_adaptive_retrieval.py \
                  tests/test_grounded_rag_runtime_contract.py \
                  scripts/apply_github_retrieval_overhaul.py \
                  .github/workflows/apply-github-adaptive-retrieval.yml
          git commit -m 'refactor: make GitHub retrieval adaptive and query-specific'
          git push origin HEAD:main
