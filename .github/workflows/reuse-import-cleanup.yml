name: Reuse import cleanup

on:
  push:
    branches: [main]
    paths: ['.github/workflows/reuse-import-cleanup.yml']

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Remove stale import and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('minecraft_mod_ai/reuse_planner.py')
          text = path.read_text(encoding='utf-8')
          old = '    repository_from_candidate,\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale repository_from_candidate import, found {text.count(old)}')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY
          rm .github/workflows/reuse-import-cleanup.yml
          python -m ruff check minecraft_mod_ai/reuse_discovery.py minecraft_mod_ai/reuse_planner.py --select F,E7,E9
          python -m pytest -q tests/test_reuse_first_architecture_contract.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/reuse_planner.py .github/workflows/reuse-import-cleanup.yml
          git commit -m 'fix(reuse): finish discovery hygiene'
          git push origin HEAD:main
