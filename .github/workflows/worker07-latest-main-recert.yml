name: Worker 07 Latest Main Recertification

on:
  push:
    branches:
      - main
    paths:
      - .github/worker07-recert.trigger

permissions:
  contents: write

concurrency:
  group: worker07-latest-main-recert
  cancel-in-progress: false

jobs:
  recertify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Synchronize latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Capture pre-patch runtime mutation surface
        run: python .github/scripts/audit_runtime_mutations.py --output /tmp/worker07-before.json
      - name: Apply Worker 07 latest-main patch
        run: python .github/scripts/worker07_recertify.py
      - name: Syntax and focused lint
        run: |
          python -m py_compile \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            minecraft_mod_ai/implementation_kind_boundary_contract.py \
            minecraft_mod_ai/deterministic_minecraft_content_contract.py \
            tests/test_worker07_target_context_hardening.py \
            tests/test_unified_host_execution_loop.py
          python -m ruff check \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            minecraft_mod_ai/implementation_kind_boundary_contract.py \
            minecraft_mod_ai/deterministic_minecraft_content_contract.py \
            tests/test_worker07_target_context_hardening.py \
            tests/test_unified_host_execution_loop.py \
            --select F,E7,E9
      - name: Worker 07 focused and integration regressions
        run: |
          python -m pytest -q \
            tests/test_worker07_target_context_hardening.py \
            tests/test_unified_host_execution_loop.py \
            tests/test_implementation_kind_boundary_contract.py \
            tests/test_deterministic_minecraft_content_contract.py \
            tests/test_agent_capability_context.py \
            tests/test_runtime_bootstrap_clean.py \
            tests/test_runtime_wrapper_signature_integrity.py \
            --junitxml=/tmp/worker07-pytest.xml
      - name: Repository architecture and dead-code audits
        run: |
          python .github/scripts/debug_repo_audit.py
          vulture minecraft_mod_ai tools download_resources.py --min-confidence 100
      - name: Prove no runtime monkey-patch growth
        run: |
          python .github/scripts/audit_runtime_mutations.py --output /tmp/worker07-after.json
          python - <<'PY'
          import json
          from pathlib import Path
          before = json.loads(Path('/tmp/worker07-before.json').read_text(encoding='utf-8'))
          after = json.loads(Path('/tmp/worker07-after.json').read_text(encoding='utf-8'))
          b = int(before['behavioral_count'])
          a = int(after['behavioral_count'])
          print(f'WORKER07_MUTATIONS_BEFORE={b}')
          print(f'WORKER07_MUTATIONS_AFTER={a}')
          if a > b:
              raise SystemExit(f'Worker07 may not grow behavioral runtime mutation surface: {b}->{a}')
          PY
      - name: Record successful gate in progress document
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse('/tmp/worker07-pytest.xml').getroot()
          tests = int(root.attrib.get('tests', 0))
          failures = int(root.attrib.get('failures', 0))
          errors = int(root.attrib.get('errors', 0))
          skipped = int(root.attrib.get('skipped', 0))
          before = json.loads(Path('/tmp/worker07-before.json').read_text(encoding='utf-8'))
          after = json.loads(Path('/tmp/worker07-after.json').read_text(encoding='utf-8'))
          path = Path('docs/parallel_progress/worker-07.md')
          text = path.read_text(encoding='utf-8').rstrip()
          text += (
              '\n\n### Latest-main re-certification gate result\n\n'
              f'- focused/integration pytest: **PASS** — {tests} tests, {failures} failures, {errors} errors, {skipped} skipped\n'
              '- targeted `py_compile`: **PASS**\n'
              '- targeted Ruff `F,E7,E9`: **PASS**\n'
              '- `debug_repo_audit.py`: **PASS**\n'
              '- `vulture --min-confidence 100`: **PASS**\n'
              f'- behavioral runtime mutation surface: **{before["behavioral_count"]} -> {after["behavioral_count"]}** (no growth required)\n'
              '- direct-main rebase verification: repeated immediately before push below.\n'
          )
          path.write_text(text + '\n', encoding='utf-8')
          PY
      - name: Remove one-shot recertification machinery
        run: |
          rm -f .github/scripts/worker07_recertify.py
          rm -f .github/workflows/worker07-latest-main-recert.yml
          rm -f .github/worker07-recert.trigger
      - name: Commit Worker 07 final hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(worker07): pin source edits to localized targets"
      - name: Rebase onto newest parallel main
        run: |
          git fetch origin main
          git rebase origin/main
      - name: Re-run Worker 07 gate after rebase
        run: |
          python -m py_compile \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            minecraft_mod_ai/implementation_kind_boundary_contract.py \
            minecraft_mod_ai/deterministic_minecraft_content_contract.py \
            tests/test_worker07_target_context_hardening.py \
            tests/test_unified_host_execution_loop.py
          python -m ruff check \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            minecraft_mod_ai/implementation_kind_boundary_contract.py \
            minecraft_mod_ai/deterministic_minecraft_content_contract.py \
            tests/test_worker07_target_context_hardening.py \
            tests/test_unified_host_execution_loop.py \
            --select F,E7,E9
          python -m pytest -q \
            tests/test_worker07_target_context_hardening.py \
            tests/test_unified_host_execution_loop.py \
            tests/test_implementation_kind_boundary_contract.py \
            tests/test_deterministic_minecraft_content_contract.py \
            tests/test_agent_capability_context.py \
            tests/test_runtime_bootstrap_clean.py \
            tests/test_runtime_wrapper_signature_integrity.py
          python .github/scripts/debug_repo_audit.py
          vulture minecraft_mod_ai tools download_resources.py --min-confidence 100
          python .github/scripts/audit_runtime_mutations.py --output /tmp/worker07-rebased.json
      - name: Push final Worker 07 commit to main
        run: git push origin HEAD:main
