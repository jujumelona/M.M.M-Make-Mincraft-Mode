name: MMM pre-design retrieval HOL hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mmm-predesign-io-fix.yml'

permissions:
  contents: write

concurrency:
  group: mmm-predesign-io-fix-main
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Sync latest main
        run: git pull --ff-only origin main
      - name: Replace ordered executor maps
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/pre_design_grounded_rag.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'anchor not found: {old[:140]!r}')
              text = text.replace(old, new, 1)

          replace_once('from concurrent.futures import ThreadPoolExecutor\n', '')
          replace_once(
              'from typing import Any\n\nfrom .knowledge import (\n',
              'from typing import Any\n\nfrom .deadline_executor import iter_completed_with_deadlines\nfrom .knowledge import (\n',
          )

          replace_once(
              '''        if new_ids:\n            workers = _source_worker_count(len(new_ids))\n            if workers <= 1:\n                fetched = [description(mod_id) for mod_id in new_ids]\n            else:\n                with ThreadPoolExecutor(max_workers=workers) as pool:\n                    fetched = list(pool.map(description, new_ids))\n            for mod_id, body, error in fetched:\n''',
              '''        if new_ids:\n            workers = _source_worker_count(len(new_ids))\n            description_jobs = tuple(enumerate(new_ids))\n            fetched_by_index: dict[int, tuple[int, str, str]] = {}\n\n            def fetch_description(\n                job: tuple[int, int],\n            ) -> tuple[int, tuple[int, str, str]]:\n                index, mod_id = job\n                return index, description(mod_id)\n\n            for _job, indexed_result in iter_completed_with_deadlines(\n                description_jobs,\n                fetch_description,\n                max_workers=max(1, workers),\n                stage="predesign-curseforge-descriptions",\n                sort_key=lambda item: item[0],\n            ):\n                index, value = indexed_result\n                fetched_by_index[index] = value\n            fetched = [fetched_by_index[index] for index in range(len(new_ids))]\n            for mod_id, body, error in fetched:\n''',
          )

          replace_once(
              '''        if candidates:\n            workers = _source_worker_count(len(candidates))\n            if workers <= 1:\n                fetched = [repository_body(row) for row in candidates]\n            else:\n                with ThreadPoolExecutor(max_workers=workers) as pool:\n                    fetched = list(pool.map(repository_body, candidates))\n            for full_name, body, error in fetched:\n''',
              '''        if candidates:\n            workers = _source_worker_count(len(candidates))\n            repository_jobs = tuple(enumerate(candidates))\n            fetched_by_index: dict[int, tuple[str, str, str]] = {}\n\n            def fetch_repository_body(\n                job: tuple[int, Mapping[str, Any]],\n            ) -> tuple[int, tuple[str, str, str]]:\n                index, row = job\n                return index, repository_body(row)\n\n            for _job, indexed_result in iter_completed_with_deadlines(\n                repository_jobs,\n                fetch_repository_body,\n                max_workers=max(1, workers),\n                stage="predesign-github-repository-bodies",\n                sort_key=lambda item: item[0],\n            ):\n                index, value = indexed_result\n                fetched_by_index[index] = value\n            fetched = [fetched_by_index[index] for index in range(len(candidates))]\n            for full_name, body, error in fetched:\n''',
          )

          replace_once(
              '''    workers = _source_worker_count(len(repositories))\n    if workers <= 1:\n        fetched = [fetch_readme(full_name) for full_name in repositories]\n    else:\n        with ThreadPoolExecutor(max_workers=workers) as pool:\n            fetched = list(pool.map(fetch_readme, repositories))\n\n    found: list[dict[str, Any]] = []\n''',
              '''    workers = _source_worker_count(len(repositories))\n    readme_jobs = tuple(enumerate(repositories))\n    fetched_by_index: dict[int, tuple[str, str, str]] = {}\n\n    def fetch_indexed_readme(\n        job: tuple[int, str],\n    ) -> tuple[int, tuple[str, str, str]]:\n        index, full_name = job\n        return index, fetch_readme(full_name)\n\n    for _job, indexed_result in iter_completed_with_deadlines(\n        readme_jobs,\n        fetch_indexed_readme,\n        max_workers=max(1, workers),\n        stage="predesign-linked-readmes",\n        sort_key=lambda item: item[0],\n    ):\n        index, value = indexed_result\n        fetched_by_index[index] = value\n    fetched = [fetched_by_index[index] for index in range(len(repositories))]\n\n    found: list[dict[str, Any]] = []\n''',
          )

          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_predesign_io_deadline_contract.py')
          test.write_text('''from __future__ import annotations\n\nimport inspect\n\nfrom minecraft_mod_ai import pre_design_grounded_rag\n\n\ndef test_predesign_source_fetches_do_not_use_ordered_executor_map() -> None:\n    source = inspect.getsource(pre_design_grounded_rag)\n    assert "ThreadPoolExecutor" not in source\n    assert ".map(" not in source\n    assert "iter_completed_with_deadlines" in source\n\n\ndef test_predesign_source_fetches_have_named_deadline_stages() -> None:\n    source = inspect.getsource(pre_design_grounded_rag)\n    for stage in (\n        "predesign-curseforge-descriptions",\n        "predesign-github-repository-bodies",\n        "predesign-linked-readmes",\n    ):\n        assert stage in source\n\n\ndef test_transport_keeps_finite_network_timeout() -> None:\n    source = inspect.getsource(pre_design_grounded_rag)\n    assert "_TIMEOUT = 8.0" in source\n    assert "urlopen(request, timeout=_TIMEOUT)" in source\n''', encoding='utf-8')
          PY
      - name: Compile
        run: |
          python -m py_compile \
            minecraft_mod_ai/pre_design_grounded_rag.py \
            tests/test_predesign_io_deadline_contract.py
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_predesign_io_deadline_contract.py \
            tests/test_retrieval_liveness_deadline_contract.py \
            tests/test_remaining_bottleneck_contract.py
          mapfile -t rag_tests < <(find tests -maxdepth 1 -type f \( -name '*pre_design*' -o -name '*grounded_rag*' \) ! -name 'test_predesign_io_deadline_contract.py' -print)
          if ((${#rag_tests[@]})); then
            python -m pytest -q "${rag_tests[@]}"
          fi
      - name: Check correctness/import regressions
        run: |
          ruff check --select F,I --fix \
            minecraft_mod_ai/pre_design_grounded_rag.py \
            tests/test_predesign_io_deadline_contract.py
          ruff check --select F,I \
            minecraft_mod_ai/pre_design_grounded_rag.py \
            tests/test_predesign_io_deadline_contract.py
          python -m py_compile minecraft_mod_ai/pre_design_grounded_rag.py
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/mmm-predesign-io-fix.yml
          git add minecraft_mod_ai/pre_design_grounded_rag.py tests/test_predesign_io_deadline_contract.py
          git commit -m 'fix: remove pre-design retrieval head-of-line waits'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            sleep $((attempt * 2))
          done
          echo 'failed to push pre-design I/O fix after retries' >&2
          exit 1
