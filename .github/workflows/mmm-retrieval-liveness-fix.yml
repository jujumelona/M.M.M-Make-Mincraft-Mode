name: MMM retrieval liveness deadline fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mmm-retrieval-liveness-fix.yml'

permissions:
  contents: write

concurrency:
  group: mmm-retrieval-liveness-fix-main
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Sync latest main
        run: git pull --ff-only origin main
      - name: Patch unbounded retrieval fanouts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'anchor not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # agentic_research_fusion: both primary and correction provider waves must
          # inherit the shared work-unit/stage deadline instead of waiting forever.
          path = 'minecraft_mod_ai/agentic_research_fusion.py'
          replace_once(
              path,
              'from concurrent.futures import Future, ThreadPoolExecutor, as_completed\nfrom typing import Any\n',
              'from typing import Any\n\nfrom .deadline_executor import iter_completed_with_deadlines\n',
          )
          replace_once(
              path,
              '''    if jobs:\n        with ThreadPoolExecutor(\n            max_workers=workers,\n            thread_name_prefix="mmm_agentic_rag",\n        ) as pool:\n            primary_futures = [pool.submit(fetch_primary, job) for job in jobs]\n            for future in as_completed(primary_futures):\n                domain_index, query_index, primary = future.result()\n                primary_results[(domain_index, query_index)] = primary\n\n            correction_futures: dict[Future[Any], tuple[int, int, int]] = {}\n            for domain_index, query_index, _query in jobs:\n                primary = primary_results[(domain_index, query_index)]\n                queries = tuple(getattr(primary, "correction_queries", ()) or ())\n                correction_results[(domain_index, query_index)] = [None] * len(queries)\n                for correction_index, correction_query in enumerate(queries):\n                    future = pool.submit(\n                        retrieve,\n                        correction_query,\n                        minecraft_version=minecraft_version,\n                        loader=loader,\n                        mappings=mappings,\n                        limit=4,\n                    )\n                    correction_futures[future] = (\n                        domain_index,\n                        query_index,\n                        correction_index,\n                    )\n                    correction_job_count += 1\n\n            for future in as_completed(correction_futures):\n                domain_index, query_index, correction_index = correction_futures[future]\n                correction_results[(domain_index, query_index)][\n                    correction_index\n                ] = future.result()\n''',
              '''    if jobs:\n        for _job, primary_result in iter_completed_with_deadlines(\n            jobs,\n            fetch_primary,\n            max_workers=workers,\n            stage="agentic-rag-primary",\n            sort_key=lambda item: (item[0], item[1]),\n        ):\n            domain_index, query_index, primary = primary_result\n            primary_results[(domain_index, query_index)] = primary\n\n        correction_jobs: list[tuple[int, int, int, str]] = []\n        for domain_index, query_index, _query in jobs:\n            primary = primary_results[(domain_index, query_index)]\n            queries = tuple(getattr(primary, "correction_queries", ()) or ())\n            correction_results[(domain_index, query_index)] = [None] * len(queries)\n            for correction_index, correction_query in enumerate(queries):\n                correction_jobs.append(\n                    (domain_index, query_index, correction_index, correction_query)\n                )\n\n        correction_job_count = len(correction_jobs)\n\n        def fetch_correction(\n            job: tuple[int, int, int, str],\n        ) -> tuple[int, int, int, Any]:\n            domain_index, query_index, correction_index, correction_query = job\n            receipt = retrieve(\n                correction_query,\n                minecraft_version=minecraft_version,\n                loader=loader,\n                mappings=mappings,\n                limit=4,\n            )\n            return domain_index, query_index, correction_index, receipt\n\n        if correction_jobs:\n            for _job, correction_result in iter_completed_with_deadlines(\n                correction_jobs,\n                fetch_correction,\n                max_workers=min(workers, len(correction_jobs)),\n                stage="agentic-rag-correction",\n                sort_key=lambda item: (item[0], item[1], item[2]),\n            ):\n                domain_index, query_index, correction_index, receipt = correction_result\n                correction_results[(domain_index, query_index)][correction_index] = receipt\n''',
          )

          # reuse_discovery: remote Modrinth resolution and provider waves have finite
          # stage/work-unit deadlines; ordinary provider errors keep their old skip policy.
          path = 'minecraft_mod_ai/reuse_discovery.py'
          replace_once(
              path,
              'from concurrent.futures import ThreadPoolExecutor, as_completed\n',
              '',
          )
          replace_once(
              path,
              'from .canonical_capability_ontology import (\n',
              'from .deadline_executor import iter_completed_with_deadlines\nfrom .canonical_capability_ontology import (\n',
          )
          replace_once(
              path,
              '''    with ThreadPoolExecutor(max_workers=min(_workers(), len(jobs))) as pool:\n        futures = [pool.submit(resolve, job) for job in jobs]\n        for future in as_completed(futures):\n            repository, score = future.result()\n            if repository:\n                direct.append((repository, score))\n''',
              '''    for _job, result in iter_completed_with_deadlines(\n        jobs,\n        resolve,\n        max_workers=min(_workers(), len(jobs)),\n        stage="reuse-modrinth-source-resolution",\n        sort_key=lambda item: item[0],\n    ):\n        repository, score = result\n        if repository:\n            direct.append((repository, score))\n''',
          )
          replace_once(
              path,
              '''        with ThreadPoolExecutor(max_workers=min(_workers(), len(jobs)), thread_name_prefix="mmm-reuse-catalog") as pool:\n            futures = [pool.submit(provider_search, *job) for job in jobs]\n            for future in as_completed(futures):\n                try:\n                    capability, provider, values = future.result()\n                except Exception:\n                    continue\n                register(capability, provider, values)\n''',
              '''        def safe_provider_search(\n            job: tuple[str, str, str],\n        ) -> tuple[str, str, list[tuple[str, float]]]:\n            capability, provider, query = job\n            try:\n                return provider_search(capability, provider, query)\n            except Exception:\n                return capability, provider, []\n\n        for _job, result_row in iter_completed_with_deadlines(\n            jobs,\n            safe_provider_search,\n            max_workers=min(_workers(), len(jobs)),\n            stage=f"reuse-catalog-wave-{variant_index}",\n            sort_key=lambda item: (item[0], item[1], item[2]),\n        ):\n            capability, provider, values = result_row\n            register(capability, provider, values)\n''',
          )

          # External MCP batch: each external process/tool invocation participates in the
          # same bounded execution contract rather than an unbounded as_completed loop.
          path = 'minecraft_mod_ai/minecraft_mcp_evidence_contract.py'
          replace_once(
              path,
              'from concurrent.futures import ThreadPoolExecutor, as_completed\n',
              '',
          )
          replace_once(
              path,
              'from typing import Any\n\n_MARKER',
              'from typing import Any\n\nfrom .deadline_executor import iter_completed_with_deadlines\n\n_MARKER',
          )
          replace_once(
              path,
              '''        def run(index: int, request: Mapping[str, Any]) -> tuple[int, dict[str, Any]]:\n            payload = dict(request)\n            capability = str(payload.pop("capability", "")).strip()\n            if not capability:\n                raise ValueError("Each MCP batch request requires capability.")\n            return index, self.invoke(capability, **payload)\n\n        if len(rows) == 1:\n            _, bundle = run(0, rows[0])\n            return (bundle,)\n\n        ordered: list[dict[str, Any] | None] = [None] * len(rows)\n        with ThreadPoolExecutor(\n            max_workers=workers,\n            thread_name_prefix="mmm_external_mcp",\n        ) as pool:\n            futures = {\n                pool.submit(run, index, row): index\n                for index, row in enumerate(rows)\n            }\n            for future in as_completed(futures):\n                index, bundle = future.result()\n                ordered[index] = bundle\n        return tuple(item for item in ordered if item is not None)\n''',
              '''        def run(\n            job: tuple[int, Mapping[str, Any]],\n        ) -> tuple[int, dict[str, Any]]:\n            index, request = job\n            payload = dict(request)\n            capability = str(payload.pop("capability", "")).strip()\n            if not capability:\n                raise ValueError("Each MCP batch request requires capability.")\n            return index, self.invoke(capability, **payload)\n\n        jobs = list(enumerate(rows))\n        if len(jobs) == 1:\n            _, bundle = run(jobs[0])\n            return (bundle,)\n\n        ordered: list[dict[str, Any] | None] = [None] * len(rows)\n        for _job, result in iter_completed_with_deadlines(\n            jobs,\n            run,\n            max_workers=workers,\n            stage="external-mcp-batch",\n            sort_key=lambda item: item[0],\n        ):\n            index, bundle = result\n            ordered[index] = bundle\n        return tuple(item for item in ordered if item is not None)\n''',
          )

          test = Path('tests/test_retrieval_liveness_deadline_contract.py')
          test.write_text('''from __future__ import annotations\n\nimport inspect\n\nfrom minecraft_mod_ai import agentic_research_fusion\nfrom minecraft_mod_ai import minecraft_mcp_evidence_contract\nfrom minecraft_mod_ai import reuse_discovery\n\n\ndef test_agentic_research_fanout_is_deadline_bound() -> None:\n    source = inspect.getsource(agentic_research_fusion)\n    assert "ThreadPoolExecutor" not in source\n    assert "as_completed" not in source\n    assert 'stage="agentic-rag-primary"' in source\n    assert 'stage="agentic-rag-correction"' in source\n    assert "iter_completed_with_deadlines" in source\n\n\ndef test_reuse_discovery_remote_fanouts_are_deadline_bound() -> None:\n    source = inspect.getsource(reuse_discovery)\n    assert "ThreadPoolExecutor" not in source\n    assert "as_completed" not in source\n    assert 'stage="reuse-modrinth-source-resolution"' in source\n    assert 'stage=f"reuse-catalog-wave-{variant_index}"' in source\n\n\ndef test_external_mcp_batch_is_deadline_bound() -> None:\n    source = inspect.getsource(minecraft_mcp_evidence_contract)\n    assert "ThreadPoolExecutor" not in source\n    assert "as_completed" not in source\n    assert 'stage="external-mcp-batch"' in source\n    assert "iter_completed_with_deadlines" in source\n''', encoding='utf-8')
          PY
      - name: Verify retrieval deadline regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            minecraft_mod_ai/agentic_research_fusion.py \
            minecraft_mod_ai/reuse_discovery.py \
            minecraft_mod_ai/minecraft_mcp_evidence_contract.py \
            tests/test_retrieval_liveness_deadline_contract.py
          python -m pip install --prefer-binary -e '.[dev]'
          python -m pytest -q \
            tests/test_retrieval_liveness_deadline_contract.py \
            tests/test_remaining_bottleneck_contract.py \
            tests/test_planning_deadline_hardening.py
          ruff check \
            minecraft_mod_ai/agentic_research_fusion.py \
            minecraft_mod_ai/reuse_discovery.py \
            minecraft_mod_ai/minecraft_mcp_evidence_contract.py \
            tests/test_retrieval_liveness_deadline_contract.py
      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/mmm-retrieval-liveness-fix.yml
          git add \
            minecraft_mod_ai/agentic_research_fusion.py \
            minecraft_mod_ai/reuse_discovery.py \
            minecraft_mod_ai/minecraft_mcp_evidence_contract.py \
            tests/test_retrieval_liveness_deadline_contract.py
          git commit -m 'fix: bound retrieval provider fanouts'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            sleep $((attempt * 2))
          done
          echo 'failed to push retrieval liveness fixes after retries' >&2
          exit 1
