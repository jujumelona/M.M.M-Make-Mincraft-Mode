name: Planner normalization hotfix

# one-shot normalization runner; remove after the normalized source lands
on:
  push:
    paths:
      - ".github/workflows/planner-normalization-hotfix.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'install planner normalization hotfix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply normalization patch
        run: python tools/apply_planner_normalization_hotfix.py

      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e ".[dev]"

      - name: Run normalization regressions
        run: >-
          python -m pytest -q
          tests/test_planner_normalization_regression.py
          tests/test_planning_state_pipeline_orchestration.py
          tests/test_planning_progress_monotone.py
          tests/test_generation_verifier_resilience.py
          tests/test_planning_convergence_contract.py
          tests/test_planning_detail_applicability.py
          tests/test_planning_requirement_pagination.py

      - name: Commit normalized planner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft_mod_ai/planning_state_pipeline.py \
                  tests/test_generation_verifier_resilience.py \
                  tests/test_planning_progress_monotone.py \
                  tests/test_planning_detail_applicability.py
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "normalize planner research and checkpoint resume"
          git push origin HEAD:main
