name: Planner policy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify registry-only local planner
        run: |
          python tools/migrate_planner_router.py
          git diff --exit-code -- minecraft_mod_ai/planner.py
