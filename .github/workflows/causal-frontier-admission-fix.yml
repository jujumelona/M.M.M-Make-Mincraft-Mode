name: One-shot causal frontier admission fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/causal-frontier-admission-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Keep retrieval before workspace symbol inspection
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/progress_aware_tool_loop.py')
          text = path.read_text(encoding='utf-8')
          old = '''        if not localization_active:\n            selected_names = [name for name in by_name if name in _READ_OBSERVE_TOOLS]\n        else:\n'''
          new = '''        if not localization_active:\n            selected_names = [name for name in by_name if name in _READ_OBSERVE_TOOLS]\n            # Workspace-symbol inspection is causally downstream of locating source.\n            # Keep broad research/external evidence available, but never ask the model\n            # to choose between code retrieval and symbol inspection on the same\n            # frontier before a concrete source location exists.\n            if (\n                mutation_context is None\n                and "search_code_rag" in selected_names\n                and "java_workspace_symbols" in selected_names\n            ):\n                selected_names.remove("java_workspace_symbols")\n        else:\n'''
          if text.count(old) != 1:
              raise SystemExit('non-mutation OBSERVE frontier target drifted')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_localization_bottleneck_contract.py')
          test = test_path.read_text(encoding='utf-8')
          addition = '''\n\ndef test_non_mutation_observe_keeps_retrieval_before_workspace_symbol_inspection() -> None:\n    tools = (\n        _schema("search_code_rag"),\n        _schema("java_workspace_symbols"),\n    )\n    selected = loop._filter_tools_for_phase(\n        tools,\n        loop.LoopPhase.OBSERVE,\n        "coder",\n        localization_active=False,\n    )\n    assert _names(selected) == ("search_code_rag",)\n'''
          if 'test_non_mutation_observe_keeps_retrieval_before_workspace_symbol_inspection' not in test:
              test_path.write_text(test + addition, encoding='utf-8')
          PY
          python -m pytest -q tests/test_adaptive_production_agent.py tests/test_external_mcp_role_scope.py tests/test_localization_bottleneck_contract.py tests/test_agent_tool_calling.py
          python -m compileall -q minecraft_mod_ai
      - name: Commit fix directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft_mod_ai/progress_aware_tool_loop.py tests/test_localization_bottleneck_contract.py
          git rm .github/workflows/causal-frontier-admission-fix.yml
          git commit -m "fix: preserve causal source inspection frontier"
          git push origin HEAD:main
