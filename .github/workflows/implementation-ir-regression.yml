name: Implementation IR Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "minecraft_mod_ai/typed_plan_ir.py"
      - "minecraft_mod_ai/typed_platform_ir.py"
      - "minecraft_mod_ai/typed_event_ir.py"
      - "minecraft_mod_ai/typed_plan_production.py"
      - "minecraft_mod_ai/typed_host_capabilities.py"
      - "minecraft_mod_ai/generation_implementation_grounding.py"
      - "minecraft_mod_ai/authored_production.py"
      - "minecraft_mod_ai/complete_planner.py"
      - "minecraft_mod_ai/model_router.py"
      - "tests/test_typed_plan_ir.py"
      - "tests/test_typed_platform_ir.py"
      - "tests/test_typed_event_ir.py"
      - "tests/test_typed_plan_authoring.py"
      - "tests/test_typed_plan_production.py"
      - "tests/test_generation_implementation_grounding.py"
      - "tests/test_implementation_template_contract.py"
      - "tests/test_implementation_registry.py"
      - "tests/test_implementation_contract_ownership.py"
      - ".github/workflows/implementation-ir-regression.yml"
  pull_request:
    paths:
      - "minecraft_mod_ai/typed_plan_ir.py"
      - "minecraft_mod_ai/typed_platform_ir.py"
      - "minecraft_mod_ai/typed_event_ir.py"
      - "minecraft_mod_ai/typed_plan_production.py"
      - "minecraft_mod_ai/typed_host_capabilities.py"
      - "minecraft_mod_ai/generation_implementation_grounding.py"
      - "minecraft_mod_ai/authored_production.py"
      - "minecraft_mod_ai/complete_planner.py"
      - "minecraft_mod_ai/model_router.py"
      - "tests/test_typed_plan_ir.py"
      - "tests/test_typed_platform_ir.py"
      - "tests/test_typed_event_ir.py"
      - "tests/test_typed_plan_authoring.py"
      - "tests/test_typed_plan_production.py"
      - "tests/test_generation_implementation_grounding.py"
      - "tests/test_implementation_template_contract.py"
      - "tests/test_implementation_registry.py"
      - "tests/test_implementation_contract_ownership.py"
      - ".github/workflows/implementation-ir-regression.yml"

permissions:
  contents: read

concurrency:
  group: implementation-ir-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typed-host-ir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e ".[dev]"
      - name: Compile Typed Host implementation boundary
        run: >-
          python -m py_compile
          minecraft_mod_ai/typed_plan_ir.py
          minecraft_mod_ai/typed_platform_ir.py
          minecraft_mod_ai/typed_event_ir.py
          minecraft_mod_ai/typed_plan_production.py
          minecraft_mod_ai/typed_host_capabilities.py
          minecraft_mod_ai/generation_implementation_grounding.py
          minecraft_mod_ai/authored_production.py
      - name: Run Typed Host IR contracts
        run: >-
          python tools/pytest_diagnostics.py
          --log audit/implementation-ir.log
          --junit audit/implementation-ir.xml
          --durations 30
          --maxfail 30
          tests/test_typed_plan_ir.py
          tests/test_typed_platform_ir.py
          tests/test_typed_event_ir.py
          tests/test_typed_plan_authoring.py
          tests/test_typed_plan_production.py
          tests/test_generation_implementation_grounding.py
          tests/test_implementation_template_contract.py
          tests/test_implementation_registry.py
          tests/test_implementation_contract_ownership.py
      - name: Upload implementation diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: implementation-ir-${{ github.sha }}
          if-no-files-found: warn
          path: |
            audit/implementation-ir.log
            audit/implementation-ir.xml
