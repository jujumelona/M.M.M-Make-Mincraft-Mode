name: Implementation IR Regression

on:
  push:
    branches: [main]
    paths:
      - "minecraft_mod_ai/implementation_ir.py"
      - "minecraft_mod_ai/authored_document_contract.py"
      - "minecraft_mod_ai/authored_structured_design.py"
      - "minecraft_mod_ai/authored_section_ids.py"
      - "minecraft_mod_ai/complete_planner.py"
      - "minecraft_mod_ai/task_template_catalog.py"
      - "minecraft_mod_ai/implementation_decisions.py"
      - "minecraft_mod_ai/model_router.py"
      - "minecraft_mod_ai/implementation_graph_execution.py"
      - "minecraft_mod_ai/implementation_lifecycle.py"
      - "minecraft_mod_ai/authored_production.py"
      - "minecraft_mod_ai/atomic_java_admission.py"
      - "minecraft_mod_ai/atomic_concern_source.py"
      - "minecraft_mod_ai/custom_module_generator.py"
      - "minecraft_mod_ai/custom_module_errors.py"
      - "minecraft_mod_ai/structured_state_runtime.py"
      - "minecraft_mod_ai/production_state_compiler.py"
      - "minecraft_mod_ai/planning_state_implementation.py"
      - "minecraft_mod_ai/planning_detail_slots.py"
      - "minecraft_mod_ai/worksheet_atomic_chunker.py"
      - "minecraft_mod_ai/templates/feature/state_model/**"
      - "tests/test_atomic_java_component_admission.py"
      - "tests/test_atomic_java_native_http.py"
      - "tests/test_atomic_concern_response_contract.py"
      - "tests/test_authored_state_lowering_regression.py"
      - "tests/test_production_state_compiler.py"
      - "tests/test_planning_structured_worksheet_execution.py"
      - "tests/test_worksheet_atomic_chunker.py"
      - "tests/worksheet_fixtures.py"
      - "tests/test_direct_custom_module_generator.py"
      - "tests/test_implementation_contract_ownership.py"
      - "tests/test_authored_heading_contract.py"
      - "tests/test_authored_production.py"
      - "tests/test_implementation_graph_admission.py"
      - "tests/test_implementation_ir.py"
      - "tests/test_small_model_implementation_decisions.py"
      - "tests/test_implementation_graph_native_http.py"
      - ".github/workflows/implementation-ir-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: implementation-ir-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  implementation-ir:
    name: Implementation IR contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install --prefer-binary -e '.[dev,ui]'
      - name: Compile implementation IR boundary
        run: python -m py_compile minecraft_mod_ai/implementation_ir.py minecraft_mod_ai/implementation_graph_execution.py
      - name: Validate structured state planning and host compiler
        run: >-
          python -m pytest -q --tb=short
          tests/test_worksheet_atomic_chunker.py
          tests/test_planning_structured_worksheet_execution.py
          tests/test_authored_state_lowering_regression.py
          tests/test_production_state_compiler.py
      - name: Run implementation IR regressions
        run: >-
          python -m pytest -q --tb=short
          tests/test_implementation_graph_admission.py
          tests/test_authored_heading_contract.py
          tests/test_implementation_ir.py
          tests/test_implementation_contract_ownership.py
          tests/test_authored_production.py
          tests/test_small_model_implementation_decisions.py
          tests/test_implementation_graph_native_http.py
          tests/test_atomic_concern_response_contract.py
          tests/test_authored_state_lowering_regression.py
          tests/test_atomic_java_component_admission.py
          tests/test_atomic_java_native_http.py
          tests/test_direct_custom_module_generator.py
