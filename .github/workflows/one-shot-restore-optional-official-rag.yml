name: one-shot restore optional Official RAG

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-restore-optional-official-rag.yml

permissions:
  contents: write

concurrency:
  group: one-shot-restore-optional-official-rag
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Reapply deferred Official RAG contract and validate
        shell: bash
        run: |
          set -Eeuo pipefail
          WORKFLOW=.github/workflows/one-shot-restore-optional-official-rag.yml
          TARGET_COMMIT=8ba19997a76dcae3b3dcb235c2f8fbedcd611a1b

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cleanup_failure() {
            status=$?
            if git rev-parse -q --verify CHERRY_PICK_HEAD >/dev/null 2>&1; then
              git cherry-pick --abort || true
            fi
            rm -f "$WORKFLOW"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: remove failed one-shot Official RAG repair" || true
              git push origin HEAD:main || true
            fi
            exit "$status"
          }
          trap cleanup_failure ERR

          git fetch origin main --force
          git checkout main
          git reset --hard origin/main

          git cherry-pick "$TARGET_COMMIT"

          git diff --check HEAD^ HEAD
          python -m compileall -q minecraft_mod_ai

          rm -f "$WORKFLOW"
          git add -A
          git commit -m "chore: remove one-shot Official RAG repair workflow"
          git push origin HEAD:main

          trap - ERR
