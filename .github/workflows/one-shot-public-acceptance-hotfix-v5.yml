name: One-shot public acceptance hotfix v5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-public-acceptance-hotfix-v5.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply root acceptance fix
        shell: bash
        run: |
          python -m py_compile .github/acceptance_hotfix_v5.py
          python .github/acceptance_hotfix_v5.py

      - name: Verify before any source commit
        shell: bash
        run: |
          python -m compileall -q minecraft_mod_ai
          python -m pytest -q tests/test_public_acceptance_runtime_boundary.py
          python .github/scripts/audit_runtime_mutations.py

      - name: Commit actual fix and clean temporary machinery
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/acceptance_hotfix.py
          rm -f .github/acceptance_hotfix_v5.py
          rm -f tests/test_acceptance_hotfix_regression.py
          rm -f .github/workflows/acceptance-hotfix.yml
          rm -f .github/workflows/one-shot-public-acceptance-hotfix.yml
          rm -f .github/workflows/one-shot-public-acceptance-hotfix-v2.yml
          rm -f .github/workflows/one-shot-public-acceptance-hotfix-v3.yml
          rm -f .github/workflows/one-shot-public-acceptance-hotfix-v4.yml
          rm -f .github/workflows/one-shot-public-acceptance-hotfix-v5.yml
          git add -A
          git commit -m 'fix: sanitize public acceptance before production validation'
          echo "HOTFIX_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:main
