name: Apply final architecture repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-architecture-repair-final.yml'

permissions:
  contents: write
  actions: read

concurrency:
  group: apply-final-architecture-repair-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Reconstruct and apply verified repair
        shell: bash
        run: |
          set -euo pipefail
          cat .github/repair/part_00 .github/repair/part_01 .github/repair/part_02 \
              .github/repair/tail_00 .github/repair/tail_01 .github/repair/tail_02 \
              .github/repair/tail_03 .github/repair/tail_04 .github/repair/tail_05 \
              .github/repair/tail_06 > /tmp/repair.b64
          echo '9ac0436463c9399cc292173373eff504b09f54fb9c782c3b5940b8aeca559378  /tmp/repair.b64' | sha256sum -c -
          base64 -d /tmp/repair.b64 | gzip -dc > /tmp/repair.patch
          git apply --check /tmp/repair.patch
          git apply /tmp/repair.patch
          for spec in \
            'correction_00 93fa99a03dc7b0feb208ec94f05c761557b88aca4d4a8960bea33ef1d2769998' \
            'correction_01 a4895e0c4f2eb836b776cb7a8ad46823d13b6fad8825f76fa4127b41c8f7d99e' \
            'correction_02 0f8c55af89de122b4958d87e604755c77ab8f006f8ad2d16f9e11671c3c055eb'; do
            set -- $spec
            echo "$2  .github/repair/$1" | sha256sum -c -
            base64 -d ".github/repair/$1" | gzip -dc > "/tmp/$1.patch"
            git apply --check "/tmp/$1.patch"
            git apply "/tmp/$1.patch"
          done
      - name: Remove all transient repair assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/repair
          rm -f .github/workflows/apply-architecture-repair.yml
          rm -f .github/workflows/apply-architecture-repair-final.yml
          rm -f .github/workflows/one-shot-architecture-cycle-fix.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} + || true
      - name: Install validation dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m compileall -q minecraft_mod_ai tests tools download_resources.py
          python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9
          python .github/scripts/debug_repo_audit.py
      - name: Production cumulative architecture audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_SHA=''
          for WORKFLOW in cumulative-regression-guard.yml main-ci.yml; do
            while IFS= read -r CANDIDATE; do
              [[ -z "$CANDIDATE" || "$CANDIDATE" == "$GITHUB_SHA" ]] && continue
              STATUS="$(gh api "repos/$GITHUB_REPOSITORY/compare/$CANDIDATE...$GITHUB_SHA" --jq '.status' 2>/dev/null || true)"
              if [[ "$STATUS" == 'ahead' || "$STATUS" == 'identical' ]]; then
                BASE_SHA="$CANDIDATE"
                break 2
              fi
            done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs?branch=main&status=success&per_page=100" --jq '.workflow_runs[].head_sha')
          done
          [[ -n "$BASE_SHA" ]] || BASE_SHA="$(git rev-parse HEAD^)"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          echo "Resolved cumulative regression baseline: $BASE_SHA"
          python .github/scripts/audit_code_quality_regression.py --base-ref "$BASE_SHA" --output /tmp/architecture.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/architecture.json',encoding='utf-8'))
          v=p.get('violations',[])
          print('architecture violations:',len(v))
          if v:
              print(*v[:100],sep='\n')
              raise SystemExit(1)
          PY
      - name: Focused semantic and runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout 12m python -m pytest -q \
            tests/test_fresh_java_grounding_transition.py \
            tests/test_progress_aware_semantic_convergence.py \
            tests/test_agent_required_rag_semantic_choice.py \
            tests/test_model_router_generation_scope.py \
            tests/test_central_research.py \
            tests/test_parallel_runtime_no_fallback.py \
            tests/test_platform_live_discovery_mapping_semantics.py \
            tests/test_generation_verifier_resilience.py \
            tests/test_validation_diagnostic_wrapper_trace.py \
            tests/test_java_toolchain_separation_installation.py \
            tests/test_rag_source_evidence_contract.py
      - name: Commit verified repair to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No repair changes to commit'; exit 1; }
          git commit -m 'Eliminate cumulative architecture regressions'
          git push origin HEAD:main
