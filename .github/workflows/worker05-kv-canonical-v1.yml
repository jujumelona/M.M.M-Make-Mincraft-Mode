name: Worker 05 KV Canonical V1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/worker05-kv-canonical-v1.yml'

permissions:
  contents: write

jobs:
  canonicalize-kv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply canonical KV cleanup
        run: python .github/scripts/worker05_kv_canonical_v1.py
      - name: Verify canonical KV owner
        run: |
          # V1.1: narrow cache exceptions + explicit benchmark isolation boundaries.
          python -m compileall -q minecraft_mod_ai
          python .github/scripts/debug_repo_audit.py
          ruff check minecraft_mod_ai/llama_decode_speed_contract.py minecraft_mod_ai/runtime_bootstrap.py tests/test_llama_kv_correctness_contract.py minecraft_mod_ai/model_router.py minecraft_mod_ai/progress_aware_tool_loop.py minecraft_mod_ai/llama_context_safety_contract.py minecraft_mod_ai/llama_completion_liveness_contract.py
          pytest -q tests/test_llama_kv_correctness_contract.py tests/test_agent_tool_round_policy.py tests/test_llama_context_safety_contract.py tests/test_agent_context_window_contract.py tests/test_llama_forced_tool_capability_contract.py tests/test_llama_sse_error_contract.py
      - name: Commit canonical KV owner to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(llama): fold KV correctness into decode owner'
          git pull --rebase origin main
          git push origin HEAD:main
