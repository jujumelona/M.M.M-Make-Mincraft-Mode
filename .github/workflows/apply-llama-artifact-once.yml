name: Apply validated llama artifact once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-llama-artifact-once.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: apply-validated-llama-artifact-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download validated artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/llama-max
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/9179108008/zip" > /tmp/llama-max.zip
          unzip -q /tmp/llama-max.zip -d /tmp/llama-max
          test -s /tmp/llama-max/tools/colab_runtime_setup.py
          test -s /tmp/llama-max/tools/native_llama_bundle.py
          test -s /tmp/llama-max/minecraft_mod_ai/qwen35_t4_single_stream_tuning.py
          test -s /tmp/llama-max/minecraft_mod_ai/llama_tuning_pipeline.py
          test -s /tmp/llama-max/tests/test_native_llama_prebuilt_contract.py
          test -s /tmp/llama-max/tests/test_qwen35_t4_single_stream_tuning.py

      - name: Install validated runtime files
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/llama-max/tools/colab_runtime_setup.py tools/colab_runtime_setup.py
          cp /tmp/llama-max/tools/native_llama_bundle.py tools/native_llama_bundle.py
          cp /tmp/llama-max/minecraft_mod_ai/qwen35_t4_single_stream_tuning.py minecraft_mod_ai/qwen35_t4_single_stream_tuning.py
          cp /tmp/llama-max/minecraft_mod_ai/llama_tuning_pipeline.py minecraft_mod_ai/llama_tuning_pipeline.py
          cp /tmp/llama-max/tests/test_native_llama_prebuilt_contract.py tests/test_native_llama_prebuilt_contract.py
          cp /tmp/llama-max/tests/test_qwen35_t4_single_stream_tuning.py tests/test_qwen35_t4_single_stream_tuning.py

      - name: Revalidate installed files
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --prefer-binary -e '.[dev]'
          python -m compileall -q minecraft_mod_ai tests tools download_resources.py
          python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9
          vulture minecraft_mod_ai tools download_resources.py --min-confidence 100
          python -m pytest -q tests/test_qwen35_t4_single_stream_tuning.py tests/test_native_llama_prebuilt_contract.py tests/test_runtime_bootstrap_clean.py

      - name: Push validated runtime commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'juju-mmm-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            tools/colab_runtime_setup.py \
            tools/native_llama_bundle.py \
            minecraft_mod_ai/qwen35_t4_single_stream_tuning.py \
            minecraft_mod_ai/llama_tuning_pipeline.py \
            tests/test_native_llama_prebuilt_contract.py \
            tests/test_qwen35_t4_single_stream_tuning.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'validated runtime files already present'
            exit 0
          fi
          git commit -m 'Maximize latest llama.cpp runtime throughput on T4'
          git pull --rebase origin main
          git push origin HEAD:main
