name: Four Axes Final Validation
# rerun after verified lint-only cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/four-axes-finalize.yml']
permissions:
  contents: write
jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - run: python tools/_four_axes_finalize.py
      - run: |
          python -m compileall -q minecraft_mod_ai tests/test_four_axes_final_contract.py
          python -m ruff check minecraft_mod_ai/task_template_runner.py minecraft_mod_ai/content_design_graph.py minecraft_mod_ai/fact_source_reuse.py minecraft_mod_ai/geckolib_generator.py minecraft_mod_ai/complete_orchestrator.py tests/test_four_axes_final_contract.py --select F,E7,E9 --fix
          python -m ruff check minecraft_mod_ai/task_template_runner.py minecraft_mod_ai/content_design_graph.py minecraft_mod_ai/fact_source_reuse.py minecraft_mod_ai/geckolib_generator.py minecraft_mod_ai/complete_orchestrator.py tests/test_four_axes_final_contract.py --select F,E7,E9
          python -m pytest -q tests/test_four_axes_final_contract.py
      - name: Commit validated production changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/four-axes-finalize.yml tools/_four_axes_finalize.py
          git add minecraft_mod_ai tests/test_four_axes_final_contract.py
          git commit -m 'Finish four-axis design and generation closure'
          git pull --rebase origin main
          git push origin HEAD:main
