name: Deterministic Debug Full E2E

on:
  workflow_dispatch:
  pull_request:
    paths: &debug_paths
      - 'minecraft_mod_ai/execution_contract_policy.py'
      - 'minecraft_mod_ai/java_generation_policy.py'
      - 'minecraft_mod_ai/java_region_parser.py'
      - 'minecraft_mod_ai/authored_production.py'
      - 'minecraft_mod_ai/typed_plan_ir.py'
      - 'minecraft_mod_ai/typed_plan_production.py'
      - 'minecraft_mod_ai/typed_host_capabilities.py'
      - 'minecraft_mod_ai/colab_run_modes.py'
      - 'minecraft_mod_ai/complete_orchestrator.py'
      - 'minecraft_mod_ai/complete_orchestrator_services.py'
      - 'minecraft_mod_ai/complete_orchestrator_support.py'
      - 'minecraft_mod_ai/complete_validation_gates.py'
      - 'minecraft_mod_ai/java_lsp.py'
      - 'minecraft_mod_ai/jdtls_bootstrap.py'
      - 'minecraft_mod_ai/project_java_diagnostics.py'
      - 'minecraft_mod_ai/runner.py'
      - 'minecraft_mod_ai/final_artifact.py'
      - 'minecraft_mod_ai/mcp_tools.py'
      - 'minecraft_mod_ai/publisher.py'
      - 'minecraft_mod_ai/scalable_generator.py'
      - 'minecraft_mod_ai/scalable_validator.py'
      - 'minecraft_mod_ai/validator.py'
      - 'minecraft_mod_ai/platform_catalog.py'
      - 'minecraft_mod_ai/fabric_official_template_provider.py'
      - 'minecraft_mod_ai/platform_live_execution_contract.py'
      - 'minecraft_mod_ai/platform_resolver.py'
      - 'minecraft_mod_ai/host_version_catalog.py'
      - 'minecraft_mod_ai/project_index.py'
      - 'minecraft_mod_ai/project_index_execution_reuse_contract.py'
      - 'minecraft_mod_ai/work_graph.py'
      - 'minecraft_mod_ai/scheduler_claim_fencing_contract.py'
      - 'minecraft_mod_ai/templates/fabric/item/**'
      - 'tests/conftest.py'
      - 'tests/test_execution_contract_policy.py'
      - 'tests/test_java_lsp_deadline_budget.py'
      - 'tests/test_java_lsp_readiness.py'
      - 'tests/test_jdt_diagnostic_completeness.py'
      - 'tests/test_deterministic_debug_full_pipeline_e2e.py'
      - 'tests/test_platform_live_execution_contract.py'
      - 'tests/test_fabric_official_template_provider_contract.py'
      - 'pyproject.toml'
      - '.github/workflows/deterministic-debug-full-e2e.yml'
  push:
    branches: [main]
    paths: *debug_paths

permissions:
  contents: read

concurrency:
  group: deterministic-debug-full-e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic-debug-full-e2e:
    name: Debug fixture real Gradle pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install runtime and test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'

      - name: Run deterministic full-pipeline E2E
        timeout-minutes: 14
        run: python -m pytest -q tests/test_deterministic_debug_full_pipeline_e2e.py
