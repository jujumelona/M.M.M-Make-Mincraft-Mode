        p=_probe(a,binary,model,config,_variant(a,f'qwen35-t4-max-mtp-{w}',seed,w)); _log('mtp-width',p); probes.append(p)
        if _valid(p,base): widths.append(p)
    seeds=sorted(widths,key=_tps,reverse=True)[:2]
    widest=next((p for p in widths if int(p.variant.draft_n_max)==max(_widths())),None)
    if widest is not None and widest not in seeds: seeds.append(widest)
