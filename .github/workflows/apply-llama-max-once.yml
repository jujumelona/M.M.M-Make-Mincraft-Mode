            print('llama server: T4 max-speed production profile',f'source={source}',f'spec={selected.spec_type}',f'n_max={selected.draft_n_max}',f'p_min={selected.draft_p_min:g}',f'ubatch={selected.ubatch}',f'kv={kv}',f'bucket={bucket}',f'baseline={bt:.2f}',f'selected={st:.2f}',f'speedup={speed:.3f}x',flush=True); return url
    setattr(ensure,_MARKER,True); ensure._mmm_qwen35_t4_max_speed=True; a.ensure_tuned_server=ensure

__all__=['_bucket_for_request','_context_buckets','_kv_candidates','_kv_mode','_p_mins','_ubatches','_widths','install']
