            process=getattr(a,'_MANAGED_PROCESS',None); url=str(getattr(a,'_MANAGED_URL','') or ''); active=os.environ.get('MMM_LLAMA_ACTIVE_KV_CACHE','').strip().lower()
            if process is not None and process.poll() is None and url:
