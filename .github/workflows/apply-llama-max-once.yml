    if callable(fn): fn(); return
    p=getattr(a,'_MANAGED_PROCESS',None); a._stop_server(p); a._MANAGED_PROCESS=None; a._MANAGED_URL=None; os.environ.pop('LLAMA_SERVER_URL',None)
def install(a):
