def _kv_mode(config):
    aliases={'auto':'auto','native':'native-default','native-default':'native-default','f16':'f16','q8':'q8_0','q8_0':'q8_0','q4':'q4_0','q4_0':'q4_0'}
    raw=os.environ.get('MMM_QWEN35_T4_KV_MODE','').strip().lower()
    if raw: return aliases.get(raw,'auto')
    extra=getattr(config,'extra',{})
    if isinstance(extra,dict) and extra.get('kv_cache_autotune') is False: return aliases.get(str(extra.get('kv_cache_quant','q4_0')).lower(),'q4_0')
    return 'auto'
def _context_buckets(config):
    m=max(2048,int(getattr(config,'max_context',32768) or 32768)); cap=max(512,m-min(1536,m//4))
    return tuple(sorted({min(v,cap) for v in _ints('MMM_QWEN35_T4_KV_CONTEXT_BUCKETS',_DEFAULT_BUCKETS,512,m)}))
def _request_tokens(request):
    chars=0
    for msg in getattr(request,'messages',()) or ():
        if isinstance(msg,dict):
            value=msg.get('content',''); chars+=len(value) if isinstance(value,str) else len(json.dumps(value,ensure_ascii=False))
    return max(1,chars//3)
def _bucket_for_request(config,request):
    n=_request_tokens(request); buckets=_context_buckets(config)
