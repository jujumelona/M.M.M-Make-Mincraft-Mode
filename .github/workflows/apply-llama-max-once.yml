    if key not in d: d[key]=_measure_kv(a,binary,model,config,selected,bucket); _save_kv(fp,d)
    return str(d[key]),bucket
def _export(s,kv,bucket):
    os.environ['MMM_LLAMA_ACTIVE_SPEC_TYPE']=str(s.spec_type); os.environ['MMM_LLAMA_ACTIVE_DRAFT_N_MAX']=str(s.draft_n_max); os.environ['MMM_LLAMA_ACTIVE_PARALLEL']='1'; os.environ['MMM_LLAMA_ACTIVE_UBATCH']=str(s.ubatch); os.environ['MMM_LLAMA_ACTIVE_CACHE_REUSE']='0'; os.environ['MMM_LLAMA_ACTIVE_MTP_P_MIN']=f'{s.draft_p_min:g}'; os.environ['MMM_LLAMA_ACTIVE_TUNING_OBJECTIVE']='single_stream'; os.environ['MMM_LLAMA_ACTIVE_KV_CACHE']=kv; os.environ[_BUCKET_ENV]=str(bucket)
    if kv=='native-default': os.environ.pop(_KV_ENV,None)
