    return selected.variant,_tps(base),_tps(selected)
def _load_core(a,fp):
    try: d=json.loads(_core_path().read_text())
    except Exception: return None
    if d.get('schema')!=_SCHEMA_VERSION or d.get('fingerprint')!=fp: return None
    try: return a.ServerVariant(**d['selected']),float(d['baseline_tps']),float(d['selected_tps'])
    except Exception: return None
def _save_core(fp,s,b,st):
    p=_core_path(); p.parent.mkdir(parents=True,exist_ok=True); tmp=p.with_suffix('.tmp'); tmp.write_text(json.dumps({'schema':_SCHEMA_VERSION,'fingerprint':fp,'selected':asdict(s),'baseline_tps':b,'selected_tps':st},indent=2,sort_keys=True)+'\n'); os.replace(tmp,p)
def _kv_map(fp):
    try: d=json.loads(_kv_path().read_text())
    except Exception: return {}
    return d.get('buckets',{}) if d.get('schema')==_SCHEMA_VERSION and d.get('fingerprint')==fp and isinstance(d.get('buckets'),dict) else {}
def _save_kv(fp,d):
    p=_kv_path(); p.parent.mkdir(parents=True,exist_ok=True); tmp=p.with_suffix('.tmp'); tmp.write_text(json.dumps({'schema':_SCHEMA_VERSION,'fingerprint':fp,'buckets':d},indent=2,sort_keys=True)+'\n'); os.replace(tmp,p)
def _measure_kv(a,binary,model,config,selected,bucket):
    pad=max(0,bucket*4-4096); base=_probe(a,binary,model,config,selected,'native-default',pad); _log('kv',base,bucket)
    if not getattr(base,'ok',False) or _tps(base)<=0: raise RuntimeError('KV baseline failed')
    vals=[base]
    for kv in _kv_candidates():
        if kv=='native-default': continue
        p=_probe(a,binary,model,config,selected,kv,pad); _log('kv',p,bucket)
        if _valid(p,base): vals.append(p)
