name: Apply llama max optimization once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-llama-max-once.yml

permissions:
  contents: write

concurrency:
  group: apply-llama-max-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply latest engine and six-axis T4 optimization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import pathlib, re
          ROOT = pathlib.Path('.')
          LATEST = 'f65e568fd83712c92babbb096b57e572af0ec357'
          BUNDLE_SCHEMA = 'mmm/native-llama-cuda-bundle-v3-max-t4'
          BUNDLE_TAG = 'native-llama-f65e568-cuda12.4-max-v3'
          BUNDLE_PREFIX = 'llama-f65e568-cuda12.4-max'
          def read(path): return (ROOT/path).read_text(encoding='utf-8')
          def write(path,text):
              p=ROOT/path; p.parent.mkdir(parents=True,exist_ok=True); p.write_text(text,encoding='utf-8')
          def one(text,old,new,label):
              c=text.count(old)
              if c!=1: raise RuntimeError(f'{label}: expected 1 occurrence, found {c}')
              return text.replace(old,new,1)

          p='tools/colab_runtime_setup.py'; t=read(p)
          t=t.replace('SETUP_API_VERSION = "mmm/colab-runtime-setup-v3-prebuilt-cache"','SETUP_API_VERSION = "mmm/colab-runtime-setup-v4-max-native"')
          t=re.sub(r'LLAMA_SERVER_SOURCE_REF = "[0-9a-f]{40}"',f'LLAMA_SERVER_SOURCE_REF = "{LATEST}"',t,count=1)
          if '-DGGML_CUDA_CUB_3DOT2=ON' not in t:
              n='            "-DGGML_CUDA_GRAPHS=ON",\n'
              t=one(t,n,n+'            "-DGGML_CUDA_CUB_3DOT2=ON",\n            "-DGGML_CUDA_FA=ON",\n            "-DGGML_CUDA_FA_ALL_QUANTS=OFF",\n            "-DGGML_LTO=ON",\n','colab cuda flags')
          write(p,t)

          p='.github/workflows/build-native-llama-cuda.yml'; t=read(p)
          t=re.sub(r'LLAMA_SOURCE_REF: [0-9a-f]{40}',f'LLAMA_SOURCE_REF: {LATEST}',t,count=1)
          t=re.sub(r'BUNDLE_SCHEMA: \S+',f'BUNDLE_SCHEMA: {BUNDLE_SCHEMA}',t,count=1)
          t=re.sub(r'BUNDLE_PREFIX: \S+',f'BUNDLE_PREFIX: {BUNDLE_PREFIX}',t,count=1)
          t=re.sub(r'RELEASE_TAG: \S+',f'RELEASE_TAG: {BUNDLE_TAG}',t,count=1)
          if '-DGGML_CUDA_CUB_3DOT2=ON' not in t:
              n='            -DGGML_CUDA_GRAPHS=ON \\\n'
              t=one(t,n,n+'            -DGGML_CUDA_CUB_3DOT2=ON \\\n            -DGGML_CUDA_FA=ON \\\n            -DGGML_CUDA_FA_ALL_QUANTS=OFF \\\n            -DGGML_LTO=ON \\\n','workflow cuda flags')
          if 'GGML_CUDA_CUB_3DOT2:BOOL=ON' not in t:
              n="          grep -q '^GGML_CUDA_GRAPHS:BOOL=ON$' llama.cpp/build/CMakeCache.txt\n"
              t=one(t,n,n+"          grep -q '^GGML_CUDA_CUB_3DOT2:BOOL=ON$' llama.cpp/build/CMakeCache.txt\n          grep -q '^GGML_CUDA_FA:BOOL=ON$' llama.cpp/build/CMakeCache.txt\n          grep -q '^GGML_LTO:BOOL=ON$' llama.cpp/build/CMakeCache.txt\n",'workflow verify')
          if '"cuda_cub_3dot2": True' not in t:
              n='              "cuda_graphs": True,\n'
              t=one(t,n,n+'              "cuda_cub_3dot2": True,\n              "cuda_fa": True,\n              "lto": True,\n','manifest features')
          t=re.sub(r'--title "Native llama\.cpp CUDA [^"]+"','--title "Native llama.cpp latest CUDA max-throughput"',t,count=1)
          t=re.sub(r'--notes "Verified native llama-server CUDA 12\.4 bundles[^"]+"',f'--notes "Verified native llama-server CUDA 12.4 max-throughput bundles. Source: ggml-org/llama.cpp {LATEST}. CUDA Graphs + CUB 3.2 dot path + FlashAttention + LTO."',t,count=1)
          write(p,t)

          p='tools/native_llama_bundle.py'; t=read(p)
          t=re.sub(r'BUNDLE_SCHEMA_VERSION = "[^"]+"',f'BUNDLE_SCHEMA_VERSION = "{BUNDLE_SCHEMA}"',t,count=1)
          t=re.sub(r'BUNDLE_RELEASE_TAG = "[^"]+"',f'BUNDLE_RELEASE_TAG = "{BUNDLE_TAG}"',t,count=1)
          t=re.sub(r'BUNDLE_NAME_PREFIX = "[^"]+"',f'BUNDLE_NAME_PREFIX = "{BUNDLE_PREFIX}"',t,count=1)
          if 'requires cuda_cub_3dot2=true' not in t:
              g='    if manifest.get("cuda_graphs") is not True:\n        raise RuntimeError(\n            "prebuilt native llama manifest requires cuda_graphs=true"\n        )\n'
              r=g+'    if manifest.get("cuda_cub_3dot2") is not True:\n        raise RuntimeError("prebuilt native llama manifest requires cuda_cub_3dot2=true")\n    if manifest.get("cuda_fa") is not True:\n        raise RuntimeError("prebuilt native llama manifest requires cuda_fa=true")\n    if manifest.get("lto") is not True:\n        raise RuntimeError("prebuilt native llama manifest requires lto=true")\n'
              t=one(t,g,r,'loader guards')
          write(p,t)

          p='minecraft_mod_ai/qwen35_t4_single_stream_tuning.py'; t=read(p)
          if 'def _benchmark_padding()' not in t:
              helper='''\ndef _benchmark_padding() -> str:\n    raw = os.environ.get("MMM_QWEN35_T4_BENCH_PAD_CHARS", "").strip()\n    try:\n        chars = max(0, min(160000, int(raw))) if raw else 0\n    except ValueError:\n        chars = 0\n    if chars <= 0:\n        return ""\n    pattern = "alpha beta gamma delta epsilon zeta eta theta iota kappa lambda "\n    filler = (pattern * ((chars // len(pattern)) + 1))[:chars]\n    return (\n        "Ignore the following calibration-only context. Never repeat it in the answer.\\n"\n        + filler\n        + "\\nCalibration context ends here. Perform the exact copy task below.\\n"\n    )\n\n\n'''
              t=one(t,'def _benchmark_request() -> Any:\n',helper+'def _benchmark_request() -> Any:\n','padding helper')
          if '_benchmark_padding() + "Copy this payload exactly' not in t:
              t=one(t,'                "content": "Copy this payload exactly:\\n" + _EXPECTED_TEXT,\n','                "content": _benchmark_padding() + "Copy this payload exactly:\\n" + _EXPECTED_TEXT,\n','padded request')
          write(p,t)

          max_module = r'''from __future__ import annotations

import hashlib, json, os, threading
from dataclasses import asdict
from functools import wraps
from pathlib import Path
from typing import Any

from .qwen35_mtp_hotpath_contract import _is_qwen35_mtp, _reclaim_prior_mmm_server
from . import qwen35_t4_single_stream_tuning as t4

_SCHEMA_VERSION='mmm/qwen35-t4-max-speed-v3'
_MARKER='_mmm_qwen35_t4_max_speed_v3'
_LOCK=threading.RLock()
_DEFAULT_WIDTHS=(1,2,3,4,6,8,12,16)
_DEFAULT_P_MINS=(0.0,0.5,0.6,0.7,0.8,0.9)
_DEFAULT_UBATCHES=(512,1024,2048)
_DEFAULT_KV=('native-default','q8_0','q4_0')
_DEFAULT_BUCKETS=(2048,8192,16384,28672)
_KV_ENV='MMM_QWEN35_T4_KV_OVERRIDE'
_PAD_ENV='MMM_QWEN35_T4_BENCH_PAD_CHARS'
_BUCKET_ENV='MMM_LLAMA_ACTIVE_KV_BUCKET'

def _enabled(): return os.environ.get('MMM_QWEN35_T4_MAX_SPEED','1').strip().lower() not in {'0','false','no','off'}
def _ints(name,defaults,lo,hi):
    vals=[]
    for token in os.environ.get(name,','.join(map(str,defaults))).split(','):
        try: v=int(token.strip())
        except ValueError: continue
        if lo<=v<=hi and v not in vals: vals.append(v)
    return tuple(vals or defaults)
def _widths(): return _ints('MMM_QWEN35_T4_MAX_WIDTHS',_DEFAULT_WIDTHS,1,32)
def _ubatches(batch): return tuple(v for v in _ints('MMM_QWEN35_T4_UBATCHES',_DEFAULT_UBATCHES,64,max(64,batch)) if v<=batch) or (min(batch,512),)
def _p_mins():
    vals=[]
    for token in os.environ.get('MMM_QWEN35_T4_MAX_P_MIN',','.join(map(str,_DEFAULT_P_MINS))).split(','):
        try: v=round(float(token.strip()),4)
        except ValueError: continue
        if 0<=v<1 and v not in vals: vals.append(v)
    if 0.0 not in vals: vals.insert(0,0.0)
    return tuple(vals or _DEFAULT_P_MINS)
def _gain():
    try: return max(1.0,float(os.environ.get('MMM_QWEN35_T4_MAX_MIN_GAIN','1.005')))
    except ValueError: return 1.005
def _kv_candidates():
    aliases={'native':'native-default','native-default':'native-default','f16':'f16','q8':'q8_0','q8_0':'q8_0','q4':'q4_0','q4_0':'q4_0'}; vals=[]
    for token in os.environ.get('MMM_QWEN35_T4_MAX_KV',','.join(_DEFAULT_KV)).split(','):
        v=aliases.get(token.strip().lower(),'')
