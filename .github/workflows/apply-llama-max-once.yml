              t=one(t,'    assert "-DGGML_CUDA_GRAPHS=ON" in worker\n','    assert "-DGGML_CUDA_GRAPHS=ON" in worker\n    assert "-DGGML_CUDA_CUB_3DOT2=ON" in worker\n    assert "-DGGML_CUDA_FA=ON" in worker\n    assert "-DGGML_LTO=ON" in worker\n','worker tests')
          t=re.sub(r'assert helper\.BUNDLE_SCHEMA_VERSION == "[^"]+"',f'assert helper.BUNDLE_SCHEMA_VERSION == "{BUNDLE_SCHEMA}"',t,count=1)
          t=re.sub(r'assert helper\.BUNDLE_RELEASE_TAG == "[^"]+"',f'assert helper.BUNDLE_RELEASE_TAG == "{BUNDLE_TAG}"',t,count=1)
          fixture='                "cuda_graphs": False,\n                "files": {},\n'
          if fixture in t: t=t.replace(fixture,'                "cuda_graphs": False,\n                "cuda_cub_3dot2": True,\n                "cuda_fa": True,\n                "lto": True,\n                "files": {},\n',1)
          write(p,t)

          write('tests/test_qwen35_t4_max_speed_tuning.py','''from __future__ import annotations\nfrom types import SimpleNamespace\nfrom minecraft_mod_ai.qwen35_t4_max_speed_tuning import _bucket_for_request,_context_buckets,_kv_candidates,_kv_mode,_p_mins,_ubatches,_widths\n\ndef test_widths(monkeypatch):\n    monkeypatch.delenv("MMM_QWEN35_T4_MAX_WIDTHS",raising=False); assert _widths()==(1,2,3,4,6,8,12,16)\ndef test_pmins(monkeypatch):\n    monkeypatch.delenv("MMM_QWEN35_T4_MAX_P_MIN",raising=False); assert _p_mins()==(0.0,0.5,0.6,0.7,0.8,0.9)\ndef test_ubatch(monkeypatch):\n    monkeypatch.delenv("MMM_QWEN35_T4_UBATCHES",raising=False); assert _ubatches(2048)==(512,1024,2048)\ndef test_kv_modes(monkeypatch):\n    monkeypatch.delenv("MMM_QWEN35_T4_MAX_KV",raising=False); assert _kv_candidates()==("native-default","q8_0","q4_0"); c=SimpleNamespace(extra={}); monkeypatch.setenv("MMM_QWEN35_T4_KV_MODE","q8"); assert _kv_mode(c)=="q8_0"\ndef test_buckets(monkeypatch):\n    monkeypatch.delenv("MMM_QWEN35_T4_KV_CONTEXT_BUCKETS",raising=False); c=SimpleNamespace(max_context=32768); assert _context_buckets(c)==(2048,8192,16384,28672); r=SimpleNamespace(messages=({"role":"user","content":"x"*30000},)); assert _bucket_for_request(c,r)==16384\n''')
          pathlib.Path('.github/workflows/apply-llama-max-once.yml').unlink()
          print('patched latest llama engine + six-axis T4 max-speed policy')
          PY
          python3 -m py_compile tools/colab_runtime_setup.py tools/native_llama_bundle.py minecraft_mod_ai/qwen35_t4_single_stream_tuning.py minecraft_mod_ai/qwen35_t4_max_speed_tuning.py minecraft_mod_ai/llama_tuning_pipeline.py tests/test_qwen35_t4_max_speed_tuning.py

