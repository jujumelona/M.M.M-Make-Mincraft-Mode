name: Apply latest llama maximum optimization once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-llama-max-once.yml

permissions:
  contents: write

concurrency:
  group: apply-latest-llama-max-once
  cancel-in-progress: false

env:
  PATCH_B64_1: 
  PATCH_B64_2: 
  PATCH_B64_3: 

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply maximum optimization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os, zlib
          payload = os.environ['PATCH_B64_1'] + os.environ['PATCH_B64_2'] + os.environ['PATCH_B64_3']
          source = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          exec(compile(source, '<llama-max-patch>', 'exec'))
          PY

      - name: Validate modified runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --prefer-binary -e '.[dev]'
          python -m compileall -q minecraft_mod_ai tests tools download_resources.py
          python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9
          vulture minecraft_mod_ai tools download_resources.py --min-confidence 100
          python -m pytest -q tests/test_qwen35_t4_single_stream_tuning.py tests/test_native_llama_prebuilt_contract.py tests/test_runtime_bootstrap_clean.py

      - name: Commit to main and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-llama-max-once.yml
          git config user.name 'juju-mmm-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Maximize latest llama.cpp throughput on T4'
          git pull --rebase origin main
          git push origin HEAD:main
