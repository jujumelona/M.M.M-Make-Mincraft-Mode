def _core_path(): return (Path.home()/'.cache/mmm/qwen35-t4-max-speed-v3.json').resolve()
def _kv_path(): return (Path.home()/'.cache/mmm/qwen35-t4-kv-buckets-v3.json').resolve()
def _fp(autotune,config,binary,model):
    batch=autotune._env_int('MMM_LLAMA_BATCH',2048)
    payload={'schema':_SCHEMA_VERSION,'base':autotune._fingerprint(config,binary,model),'hardware':t4._hardware_identity(autotune),'server':autotune._server_version(binary),'widths':_widths(),'p':_p_mins(),'ub':_ubatches(batch),'kv':_kv_candidates(),'buckets':_context_buckets(config),'digest':t4._EXPECTED_DIGEST}
    return hashlib.sha256(json.dumps(payload,sort_keys=True,separators=(',',':')).encode()).hexdigest()
def _tps(p): return float(getattr(p,'predicted_tps',0.0) or 0.0)
def _valid(p,b): return t4._valid(p,b)
def _variant(a,name,ub,width=0,p=0.0): return t4._variant(a,name=name,ubatch=ub,width=width,p_min=p)
def _probe(a,binary,model,config,candidate,kv='native-default',pad=0):
    old=os.environ.get(_PAD_ENV)
    if pad: os.environ[_PAD_ENV]=str(pad)
    else: os.environ.pop(_PAD_ENV,None)
    try: return t4._probe(a,binary,model,config,candidate,kv=kv)
    finally:
        if old is None: os.environ.pop(_PAD_ENV,None)
        else: os.environ[_PAD_ENV]=old
def _log(stage,p,bucket=None):
    detail=f'{_tps(p):.2f} tok/s' if getattr(p,'ok',False) else str(getattr(p,'error','failed')); suffix=f' bucket={bucket}' if bucket else ''
    print('llama server: T4 max-speed probe',f'stage={stage}',p.variant.name,f'kv={getattr(p,"kv","native-default")}{suffix}',f'-> {detail}',flush=True)
def _best(base,probes):
    vals=[base]+[p for p in probes if p is not base and _valid(p,base)]; win=max(vals,key=_tps)
    return base if win is not base and _tps(win)<_tps(base)*_gain() else win
def _measure_core(a,binary,model,config):
    batch=a._env_int('MMM_LLAMA_BATCH',2048); ubs=_ubatches(batch); seed=512 if 512 in ubs else ubs[0]
    base=_probe(a,binary,model,config,_variant(a,'qwen35-t4-max-baseline',seed)); _log('baseline',base)
    if not getattr(base,'ok',False) or _tps(base)<=0: raise RuntimeError('T4 max-speed baseline failed')
    probes=[base]; widths=[]
