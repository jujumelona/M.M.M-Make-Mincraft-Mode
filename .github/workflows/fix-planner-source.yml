name: fix-planner-source
on:
  push:
    paths: ['.github/workflows/fix-planner-source.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('minecraft_mod_ai/complete_planner.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              "chain = hashlib.sha256(f'{_REQUEST_PRODUCTION_SCHEMA}:{ingestion['chain_sha256']}'.encode('utf-8'))",
              "chain = hashlib.sha256(f\"{_REQUEST_PRODUCTION_SCHEMA}:{ingestion['chain_sha256']}\".encode('utf-8'))",
          )
          compile(text, str(p), 'exec')
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add minecraft_mod_ai/complete_planner.py
          git commit -m 'fix: keep cleaned planner source syntactically valid'
          git push origin HEAD:main
