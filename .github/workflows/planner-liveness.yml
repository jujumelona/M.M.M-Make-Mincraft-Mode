name: Planner Liveness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'minecraft_mod_ai/complete_planner.py'
      - 'minecraft_mod_ai/deadline_executor.py'
      - 'minecraft_mod_ai/model_concurrency.py'
      - 'minecraft_mod_ai/model_router.py'
      - 'minecraft_mod_ai/planner_structured_router.py'
      - 'minecraft_mod_ai/llama_completion_liveness_contract.py'
      - 'minecraft_mod_ai/llama_stream_efficiency_contract.py'
      - 'minecraft_mod_ai/llama_structured_decode_policy.py'
      - 'tests/test_planner_stream_liveness.py'
      - 'tests/test_agentic_planner_runtime_hardening.py'
      - 'tests/test_pipeline_liveness_regressions.py'
      - 'tests/test_planner_structured_router.py'
      - 'tests/test_required_tool_decode_liveness.py'
      - '.github/workflows/planner-liveness.yml'
  pull_request:
    paths:
      - 'minecraft_mod_ai/complete_planner.py'
      - 'minecraft_mod_ai/deadline_executor.py'
      - 'minecraft_mod_ai/model_concurrency.py'
      - 'minecraft_mod_ai/model_router.py'
      - 'minecraft_mod_ai/planner_structured_router.py'
      - 'minecraft_mod_ai/llama_completion_liveness_contract.py'
      - 'minecraft_mod_ai/llama_stream_efficiency_contract.py'
      - 'minecraft_mod_ai/llama_structured_decode_policy.py'
      - 'tests/test_planner_stream_liveness.py'
      - 'tests/test_agentic_planner_runtime_hardening.py'
      - 'tests/test_pipeline_liveness_regressions.py'
      - 'tests/test_planner_structured_router.py'
      - 'tests/test_required_tool_decode_liveness.py'
      - '.github/workflows/planner-liveness.yml'

permissions:
  contents: read

concurrency:
  group: planner-liveness-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planner-liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Compile current planner runtime
        run: >-
          python -m py_compile
          minecraft_mod_ai/complete_planner.py
          minecraft_mod_ai/deadline_executor.py
          minecraft_mod_ai/model_concurrency.py
          minecraft_mod_ai/model_router.py
          minecraft_mod_ai/planner_structured_router.py
          minecraft_mod_ai/llama_completion_liveness_contract.py
          minecraft_mod_ai/llama_stream_efficiency_contract.py
          minecraft_mod_ai/llama_structured_decode_policy.py
      - name: Run planner liveness regressions
        run: >-
          python tools/pytest_diagnostics.py
          --log audit/planner-liveness.log
          --junit audit/planner-liveness.xml
          --durations 20
          --maxfail 20
          tests/test_planner_stream_liveness.py
          tests/test_agentic_planner_runtime_hardening.py
          tests/test_pipeline_liveness_regressions.py
          tests/test_planner_structured_router.py
          tests/test_required_tool_decode_liveness.py
      - name: Upload planner liveness diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: planner-liveness-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            audit/planner-liveness.log
            audit/planner-liveness.xml
