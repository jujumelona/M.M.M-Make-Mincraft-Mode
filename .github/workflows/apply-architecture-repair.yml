name: Apply architecture repair payload

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-architecture-repair.yml'

permissions:
  contents: write

concurrency:
  group: apply-architecture-repair-main
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Reconstruct verified repair payloads
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/repair/part_00 \
            .github/repair/part_01 \
            .github/repair/part_02 \
            .github/repair/tail_00 \
            .github/repair/tail_01 \
            .github/repair/tail_02 \
            .github/repair/tail_03 \
            .github/repair/tail_04 \
            .github/repair/tail_05 \
            .github/repair/tail_06 > /tmp/repair.b64
          echo '9ac0436463c9399cc292173373eff504b09f54fb9c782c3b5940b8aeca559378  /tmp/repair.b64' | sha256sum -c -
          base64 -d /tmp/repair.b64 | gzip -dc > /tmp/repair.patch
          git apply --check /tmp/repair.patch
          git apply /tmp/repair.patch

          echo '93fa99a03dc7b0feb208ec94f05c761557b88aca4d4a8960bea33ef1d2769998  .github/repair/correction_00' | sha256sum -c -
          base64 -d .github/repair/correction_00 | gzip -dc > /tmp/correction.patch
          git apply --check /tmp/correction.patch
          git apply /tmp/correction.patch

      - name: Remove transient repair assets before validation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/repair
          rm -f .github/workflows/apply-architecture-repair.yml
          rm -f .github/workflows/one-shot-architecture-cycle-fix.yml

      - name: Install validation dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m compileall -q minecraft_mod_ai tests tools download_resources.py
          python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9
          python .github/scripts/debug_repo_audit.py

      - name: Cumulative architecture audit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 1983dffcddf15064f388619a070db3ea99d83d2a
          python .github/scripts/audit_code_quality_regression.py \
            --base-ref 1983dffcddf15064f388619a070db3ea99d83d2a \
            --output /tmp/code-quality-regression.json
          python - <<'PY'
          import json
          p = json.load(open('/tmp/code-quality-regression.json', encoding='utf-8'))
          violations = p.get('violations', [])
          print('architecture violations:', len(violations))
          if violations:
              for item in violations[:100]:
                  print(item)
              raise SystemExit(1)
          PY

      - name: Focused semantic and runtime regressions
        shell: bash
        run: |
          set -euo pipefail
          timeout 12m python -m pytest -q \
            tests/test_fresh_java_grounding_transition.py \
            tests/test_progress_aware_semantic_convergence.py \
            tests/test_agent_required_rag_semantic_choice.py \
            tests/test_model_router_generation_scope.py \
            tests/test_central_research.py \
            tests/test_parallel_runtime_no_fallback.py \
            tests/test_platform_live_discovery_mapping_semantics.py \
            tests/test_generation_verifier_resilience.py \
            tests/test_validation_diagnostic_wrapper_trace.py \
            tests/test_java_toolchain_separation_installation.py \
            tests/test_rag_source_evidence_contract.py

      - name: Commit verified repair to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo 'No repair changes to commit'; exit 1; }
          git commit -m 'Eliminate cumulative architecture regressions'
          git push origin HEAD:main
