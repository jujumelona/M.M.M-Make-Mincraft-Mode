name: Apply integrity repair

on:
  push:
    branches: [main]
    paths:
      - tools/apply_integrity_repair_wave.py
      - tools/apply_integrity_repair_followup.py
      - tools/apply_integrity_repair_final.py
      - .github/workflows/apply-integrity-repair.yml

permissions:
  contents: write

concurrency:
  group: one-time-integrity-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply repair
        run: |
          python tools/apply_integrity_repair_wave.py
          python tools/apply_integrity_repair_followup.py
          python tools/apply_integrity_repair_final.py
      - name: Install test dependencies
        run: python -m pip install -q -e '.[dev]'
      - name: Verify repaired contracts
        run: >-
          pytest -q
          tests/test_agentic_planner_runtime_hardening.py
          tests/test_llama_tuning_pipeline_order.py
          tests/test_llama_server_kernel_autotune.py
          tests/test_llama_server_hardware_policy.py
          tests/test_custom_module_context_budget.py
          tests/test_colab_curseforge_key_contract.py
          tests/test_atomic_design_pipeline.py
          tests/test_content_design_graph_expansion.py
          tests/test_planning_detail_requirement_batching.py
          tests/test_debug_mode_fixture_roundtrip.py
          tests/test_evidence_first_planning.py
          tests/test_evidence_first_session_integration.py
          tests/test_distribution_truthfulness.py
          tests/test_content_catalog_scaling.py
          tests/test_deterministic_minecraft_content_contract.py
          --maxfail=20
      - name: Commit verified repair and remove one-time machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm tools/apply_integrity_repair_wave.py tools/apply_integrity_repair_followup.py tools/apply_integrity_repair_final.py .github/workflows/apply-integrity-repair.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix: reconcile integrity authority with runtime contracts'
          git push origin HEAD:main
