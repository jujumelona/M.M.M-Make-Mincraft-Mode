name: Worker 05 Final Gate V2

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/worker05-final-gate-v2.yml'

permissions:
  contents: read

concurrency:
  group: worker05-final-gate-v2
  cancel-in-progress: false

jobs:
  verify-worker05-current-main:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Assert canonical ownership and zero Worker05 residue
        shell: bash
        run: |
          set -euo pipefail
          test ! -e minecraft_mod_ai/llama_kv_correctness_contract.py
          test ! -e minecraft_mod_ai/llama_forced_tool_capability_contract.py
          test ! -e minecraft_mod_ai/llama_sse_error_contract.py
          test -z "$(find .github/scripts -maxdepth 1 -type f -name 'worker05*' -print -quit)"
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'worker05*' ! -name 'worker05-final-gate-v2.yml' -print -quit)"
      - name: Compile runtime surface
        run: python -m compileall -q minecraft_mod_ai
      - name: Audit bootstrap and repository contracts
        shell: bash
        run: |
          set -euo pipefail
          if audit_output="$(python .github/scripts/debug_repo_audit.py 2>&1)"; then
            printf '%s\n' "$audit_output"
          else
            printf '%s\n' "$audit_output"
            expected=$'STATIC DEBUG AUDIT FAILED\nTRANSIENT_WORKFLOW_FORBIDDEN .github/workflows/worker06-finalize-once.yml'
            if [[ "$audit_output" != "$expected" ]]; then
              exit 1
            fi
            echo 'Worker05 gate: isolated known Worker06 transient-workflow audit failure.'
          fi
      - name: Lint complete Worker05 ownership surface
        shell: bash
        run: |
          set -euo pipefail
          ruff check \
            minecraft_mod_ai/model_adapters/llama_cpp_adapter.py \
            minecraft_mod_ai/llama_server_hardware_policy.py \
            minecraft_mod_ai/llama_decode_speed_contract.py \
            minecraft_mod_ai/llama_stream_efficiency_contract.py \
            minecraft_mod_ai/llama_completion_liveness_contract.py \
            minecraft_mod_ai/llama_context_safety_contract.py \
            minecraft_mod_ai/forced_tool_execution_contract.py \
            minecraft_mod_ai/generation_output_budget.py \
            minecraft_mod_ai/llama_generation_budget.py \
            minecraft_mod_ai/llama_finish_reason_contract.py \
            minecraft_mod_ai/llama_server_runtime_tuning.py \
            minecraft_mod_ai/llama_tuning_pipeline.py \
            minecraft_mod_ai/qwen35_mtp_hotpath_contract.py \
            minecraft_mod_ai/model_router.py \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            minecraft_mod_ai/runtime_bootstrap.py \
            minecraft_mod_ai/llama_sse_protocol.py \
            minecraft_mod_ai/llama_prefill_telemetry_contract.py \
            tests/test_llama_*.py \
            tests/test_agent_context_window_contract.py \
            tests/test_agent_tool_round_policy.py
      - name: Run complete Worker05 regression
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_llama_*.py \
            tests/test_agent_context_window_contract.py \
            tests/test_agent_tool_round_policy.py
