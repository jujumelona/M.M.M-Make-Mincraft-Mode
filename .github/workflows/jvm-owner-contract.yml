name: JVM Owner Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'minecraft_mod_ai/jvm_owner/**'
      - 'minecraft_mod_ai/jvm_owner_bootstrap.py'
      - 'minecraft_mod_ai/java_core.py'
      - 'minecraft_mod_ai/owner_rpc.py'
      - 'minecraft_mod_ai/project_model.py'
      - 'minecraft_mod_ai/platform_catalog.py'
      - 'minecraft_mod_ai/platform_generation_contract.py'
      - 'minecraft_mod_ai/runner.py'
      - 'minecraft_mod_ai/generation_verifier_resilience.py'
      - 'minecraft_mod_ai/progress_aware_tool_loop.py'
      - 'minecraft_mod_ai/small_model_task_capsule_contract.py'
      - 'tests/test_java_core_toolchain.py'
      - 'tests/test_owner_rpc.py'
      - 'tests/test_generation_verifier_resilience.py'
      - 'tests/test_jvm_owner_integration.py'
      - '.github/workflows/jvm-owner-contract.yml'
  push:
    branches: [main]
    paths:
      - 'minecraft_mod_ai/jvm_owner/**'
      - 'minecraft_mod_ai/jvm_owner_bootstrap.py'
      - 'minecraft_mod_ai/java_core.py'
      - 'minecraft_mod_ai/owner_rpc.py'
      - 'minecraft_mod_ai/project_model.py'
      - 'minecraft_mod_ai/platform_catalog.py'
      - 'minecraft_mod_ai/platform_generation_contract.py'
      - 'minecraft_mod_ai/runner.py'
      - 'minecraft_mod_ai/generation_verifier_resilience.py'
      - 'minecraft_mod_ai/progress_aware_tool_loop.py'
      - 'minecraft_mod_ai/small_model_task_capsule_contract.py'
      - 'tests/test_java_core_toolchain.py'
      - 'tests/test_owner_rpc.py'
      - 'tests/test_generation_verifier_resilience.py'
      - 'tests/test_jvm_owner_integration.py'
      - '.github/workflows/jvm-owner-contract.yml'

permissions:
  contents: read

concurrency:
  group: jvm-owner-contract-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owner-build:
    name: Build pinned JDT owner runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install package and test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Build owner through production bootstrap
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import tempfile
          from pathlib import Path

          from minecraft_mod_ai.jvm_owner_bootstrap import owner_command

          with tempfile.TemporaryDirectory(prefix="mmm-owner-ci-") as raw:
              workspace = Path(raw)
              command = owner_command(workspace)
              assert command
              assert "-application" in command
              assert "mmm.owner.application" in command
              config = workspace / "configuration" / "config.ini"
              assert config.is_file(), config
              print("owner bootstrap compiled and materialized:", command[0])
          PY
      - name: Run owner/toolchain unit contracts
        timeout-minutes: 5
        run: |
          python -m pytest -q \
            tests/test_java_core_toolchain.py \
            tests/test_owner_rpc.py \
            tests/test_generation_verifier_resilience.py
      - name: Live owner incremental diagnostics
        timeout-minutes: 3
        env: &live_owner_env
          MMM_JVM_OWNER_LIVE: '1'
          MMM_JDT_DIAGNOSTIC_STARTUP_TIMEOUT_SECONDS: '90'
        run: python -m pytest -vv tests/test_jvm_owner_integration.py::test_incremental_dependent_diagnostics
      - name: Live owner Gradle project model
        timeout-minutes: 5
        env: *live_owner_env
        run: python -m pytest -vv tests/test_jvm_owner_integration.py::test_tooling_model_and_core_project_dependencies
      - name: Live generation verifier persistence
        timeout-minutes: 3
        env: *live_owner_env
        run: python -m pytest -vv tests/test_jvm_owner_integration.py::test_generation_service_preserves_errors_after_unchanged_check
      - name: Live annotation processor model
        timeout-minutes: 3
        env: *live_owner_env
        run: python -m pytest -vv tests/test_jvm_owner_integration.py::test_core_runs_resolved_annotation_processor
      - name: Live Debug Fabric project model
        timeout-minutes: 7
        env: *live_owner_env
        run: python -m pytest -vv tests/test_jvm_owner_integration.py::test_debug_fixture_fabric_project_resolves_through_production_java_core
