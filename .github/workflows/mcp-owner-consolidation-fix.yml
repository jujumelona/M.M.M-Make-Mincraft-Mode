name: One-shot MCP owner consolidation fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mcp-owner-consolidation-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Consolidate MCP persistence under transport pool
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/agent_tool_runtime.py')
          text = path.read_text(encoding='utf-8')

          old_init = '''        self._external_bridge = ExternalAgentBridge(timeout_seconds=timeout_seconds)\n        self._lock = threading.RLock()\n        self._async_loop: asyncio.AbstractEventLoop | None = None\n        self._async_thread: threading.Thread | None = None\n        self._async_ready = threading.Event()\n        self._mcp_sessions: dict[str, tuple[Any, Any]] = {}\n        self._mcp_session_locks: dict[str, asyncio.Lock] = {}\n        self._closed = False\n'''
          new_init = '''        self._external_bridge = ExternalAgentBridge(timeout_seconds=timeout_seconds)\n        self._lock = threading.RLock()\n'''
          if text.count(old_init) != 1:
              raise SystemExit('AgentToolRuntime init persistence block drifted')
          text = text.replace(old_init, new_init, 1)

          start = text.index('    def _ensure_async_loop(self) -> asyncio.AbstractEventLoop:\n')
          end = text.index('\n    def _session(self, stage: str):\n', start)
          replacement = '''    def _run_async(self, function: Any, *args: Any) -> Any:\n        # The transport pool owns persistent event loops and MCP subprocess/session\n        # lifecycles. This bridge deliberately stays ephemeral so AnyIO cancellation\n        # scopes are never entered in one task and exited from another.\n        async def runner() -> Any:\n            return await function(*args)\n\n        try:\n            asyncio.get_running_loop()\n        except RuntimeError:\n            return anyio.run(runner)\n\n        value: dict[str, Any] = {}\n        errors: list[BaseException] = []\n\n        def worker() -> None:\n            try:\n                value["result"] = anyio.run(runner)\n            except BaseException as exc:  # pragma: no cover - event-loop bridge\n                errors.append(exc)\n\n        thread = threading.Thread(target=worker, daemon=True)\n        thread.start()\n        thread.join(self.timeout_seconds + 5.0)\n        if thread.is_alive():\n            raise AgentToolRuntimeError("MCP synchronous bridge timed out")\n        if errors:\n            raise AgentToolRuntimeError(str(errors[0])) from errors[0]\n        return value["result"]\n\n    def close(self) -> None:\n        # runtime_finalization patches _session() to MCPTransportPool. Close only that\n        # persistent owner when materialized; do not create a pool merely to close it.\n        with self._lock:\n            pool = getattr(self, "_mcp_transport_pool", None)\n            if pool is None:\n                return\n            self._mcp_transport_pool = None\n            finalizer = getattr(self, "_mcp_transport_pool_finalizer", None)\n            self._mcp_transport_pool_finalizer = None\n        if finalizer is not None and getattr(finalizer, "alive", False):\n            finalizer.detach()\n        pool.close()\n\n    async def _list_tools_async(self, stage: str) -> list[dict[str, Any]]:\n        async with self._session(stage) as session:\n            listed = await session.list_tools()\n            result: list[dict[str, Any]] = []\n            for item in getattr(listed, "tools", ()) or ():\n                schema = getattr(item, "inputSchema", None)\n                if schema is None:\n                    schema = getattr(item, "input_schema", None)\n                result.append(\n                    {\n                        "name": str(getattr(item, "name", "")),\n                        "description": str(getattr(item, "description", "") or ""),\n                        "input_schema": _jsonable(schema),\n                    }\n                )\n            return result\n\n    async def _call_tool_async(\n        self,\n        stage: str,\n        name: str,\n        arguments: Mapping[str, Any],\n    ) -> dict[str, Any]:\n        async with self._session(stage) as session:\n            raw = await session.call_tool(name, arguments=dict(arguments))\n            normalized = _normalize_tool_result(raw)\n            if bool(getattr(raw, "isError", getattr(raw, "is_error", False))):\n                detail = _mcp_error_detail(normalized)\n                message = f"MCP tool {name!r} returned an error"\n                if detail:\n                    message = f"{message}: {detail}"\n                raise AgentToolRuntimeError(message)\n            return normalized\n'''
          text = text[:start] + replacement + text[end:]

          old_enter = '''        stack = AsyncExitStack()\n        self._stack = stack\n        try:\n            errlog = stack.enter_context(\n                tempfile.TemporaryFile(mode="w+", encoding="utf-8")\n            )\n            params = StdioServerParameters(\n                command=sys.executable,\n                args=["-m", "minecraft_mod_ai.mcp_server"],\n                env=self.env,\n            )\n            with anyio.fail_after(self.timeout_seconds):\n                read_stream, write_stream = await stack.enter_async_context(\n                    stdio_client(params, errlog=errlog)\n                )\n                self.session = await stack.enter_async_context(\n                    ClientSession(read_stream, write_stream)\n                )\n                await self.session.initialize()\n            return self.session\n'''
          new_enter = '''        stack = AsyncExitStack()\n        self._stack = stack\n        try:\n            stack.enter_context(anyio.fail_after(self.timeout_seconds))\n            errlog = stack.enter_context(\n                tempfile.TemporaryFile(mode="w+", encoding="utf-8")\n            )\n            params = StdioServerParameters(\n                command=sys.executable,\n                args=["-m", "minecraft_mod_ai.mcp_server"],\n                env=self.env,\n            )\n            read_stream, write_stream = await stack.enter_async_context(\n                stdio_client(params, errlog=errlog)\n            )\n            self.session = await stack.enter_async_context(\n                ClientSession(read_stream, write_stream)\n            )\n            await self.session.initialize()\n            return self.session\n'''
          if text.count(old_enter) != 1:
              raise SystemExit('native stdio session block drifted')
          text = text.replace(old_enter, new_enter, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_agent_runtime_hot_paths.py')
          test = test_path.read_text(encoding='utf-8')
          if 'import anyio\n' not in test:
              test = test.replace('from types import SimpleNamespace\n\n', 'from types import SimpleNamespace\n\nimport anyio\n\n', 1)
          old_test = '''    monkeypatch.setattr(runtime, "_session", lambda _stage: Context())\n    first = runtime._run_async(\n        runtime._call_tool_async,\n        "generation",\n        "search_code_rag",\n        {"query": "block registry"},\n    )\n    second = runtime._run_async(\n        runtime._call_tool_async,\n        "generation",\n        "search_code_rag",\n        {"query": "item registry"},\n    )\n    assert first["structured_content"] == {"ok": True}\n    assert second["structured_content"] == {"ok": True}\n    assert events == [\n        "enter",\n        "execute:search_code_rag:block registry",\n        "execute:search_code_rag:item registry",\n    ]\n    runtime.close()\n    assert events[-1] == "exit"\n    assert events.count("enter") == 1\n    assert events.count("exit") == 1\n'''
          new_test = '''    monkeypatch.setattr(runtime, "_session", lambda _stage: Context())\n    result = anyio.run(\n        runtime._call_tool_async,\n        "generation",\n        "search_code_rag",\n        {"query": "block registry"},\n    )\n    assert result["structured_content"] == {"ok": True}\n    assert events == ["enter", "execute:search_code_rag:block registry", "exit"]\n'''
          if test.count(old_test) != 1:
              raise SystemExit('agent runtime hot-path test block drifted')
          test = test.replace(old_test, new_test, 1)
          addition = '''\n\ndef test_runtime_close_releases_only_materialized_transport_pool() -> None:\n    runtime = agent_tool_runtime.AgentToolRuntime(profile="test")\n    events: list[str] = []\n\n    class Pool:\n        def close(self) -> None:\n            events.append("pool-close")\n\n    class Finalizer:\n        alive = True\n\n        def detach(self) -> None:\n            events.append("finalizer-detach")\n            self.alive = False\n\n    pool = Pool()\n    finalizer = Finalizer()\n    runtime._mcp_transport_pool = pool\n    runtime._mcp_transport_pool_finalizer = finalizer\n    runtime.close()\n\n    assert events == ["finalizer-detach", "pool-close"]\n    assert runtime._mcp_transport_pool is None\n    assert runtime._mcp_transport_pool_finalizer is None\n    runtime.close()\n    assert events == ["finalizer-detach", "pool-close"]\n'''
          if 'test_runtime_close_releases_only_materialized_transport_pool' not in test:
              test += addition
          test_path.write_text(test, encoding='utf-8')
          PY
          python -m pytest -q tests/test_llama_parallel_runtime_contract.py tests/test_agent_runtime_hot_paths.py tests/test_mcp_transport_pool.py tests/test_agent_tool_calling.py
          python -m compileall -q minecraft_mod_ai
      - name: Commit fix directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft_mod_ai/agent_tool_runtime.py tests/test_agent_runtime_hot_paths.py
          git rm .github/workflows/mcp-owner-consolidation-fix.yml
          git commit -m "fix: consolidate MCP persistence under transport pool"
          git push origin HEAD:main
