name: Repair platform provider authority

on:
  push:
    paths:
      - tests/test_platform_provider_authority.py
      - tools/apply_platform_provider_authority_fix.py
      - .github/workflows/repair-platform-provider-authority.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply authority repair
        run: python tools/apply_platform_provider_authority_fix.py
      - name: Verify focused regression
        run: python -m pytest -q tests/test_platform_provider_authority.py
      - name: Verify package compile
        run: python -m compileall -q minecraft_mod_ai
      - name: Verify diff hygiene
        run: git diff --check
      - name: Commit verified repair to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$remote_sha" != "$checkout_sha" ]; then
            echo "main moved during verification: checkout=$checkout_sha remote=$remote_sha" >&2
            exit 1
          fi
          rm tools/apply_platform_provider_authority_fix.py
          rm .github/workflows/repair-platform-provider-authority.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft_mod_ai/platform_catalog.py minecraft_mod_ai/platform_selection_pipeline.py tests/test_platform_provider_authority.py tools/apply_platform_provider_authority_fix.py .github/workflows/repair-platform-provider-authority.yml
          git commit -m "fix: make host platform authority explicit"
          git push origin HEAD:main
