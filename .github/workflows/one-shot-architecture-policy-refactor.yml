name: One-shot targetless production repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-architecture-policy-refactor.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Apply invariant patch
        run: python .github/scripts/fix_targetless_production.py

      - name: Verify targetless production regression
        run: |
          set -Eeuo pipefail
          python -m compileall -q minecraft_mod_ai tests/test_central_research.py tests/test_authored_production_optional_target.py
          python -m pytest -q tests/test_central_research.py tests/test_authored_production_optional_target.py
          git diff --check

      - name: Commit verified repair and restore CI entrypoint
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show HEAD^:.github/workflows/one-shot-architecture-policy-refactor.yml > .github/workflows/one-shot-architecture-policy-refactor.yml
          rm -f .github/workflows/one-shot-fix-targetless-production.yml
          rm -f .github/scripts/fix_targetless_production.py
          rm -f .github/scripts/trigger_targetless_fix.txt
          git add -A
          git commit -m "fix: skip targetless Official RAG without stopping production"
          git push origin HEAD:main
