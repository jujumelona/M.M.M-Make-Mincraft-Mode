name: One-shot architecture policy refactor

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-architecture-policy-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refactor parser scheduler and recovery policy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()

          # ------------------------------------------------------------------
          # Deadline scheduler: isolate optional error handling from the loop.
          # ------------------------------------------------------------------
          path = root / 'minecraft_mod_ai/deadline_executor.py'
          text = path.read_text(encoding='utf-8')
          marker = '''def _iter_completed_with_deadlines_impl(\n'''
          helpers = '''def _next_batch_or_report(\n    active: dict[Future[_Result], _ActiveTask[_Item]],\n    *,\n    stage: str,\n    unit_timeout: float,\n    stage_deadline: float | None,\n    on_error: Callable[[_Item, BaseException], None] | None,\n) -> set[Future[_Result]] | None:\n    try:\n        return _next_completed_batch(\n            active,\n            stage=stage,\n            unit_timeout=unit_timeout,\n            stage_deadline=stage_deadline,\n        )\n    except ParallelExecutionTimeout as exc:\n        if on_error is None:\n            raise\n        on_error(exc.item, exc)\n        return None\n\n\ndef _completed_result_or_report(\n    future: Future[_Result],\n    meta: _ActiveTask[_Item],\n    *,\n    stage: str,\n    on_error: Callable[[_Item, BaseException], None] | None,\n) -> tuple[bool, _Result | None]:\n    try:\n        return True, _completed_result(future, meta, stage=stage)\n    except ParallelTaskError as exc:\n        if on_error is None:\n            raise\n        on_error(meta.item, exc.cause)\n        return False, None\n\n\n'''
          if helpers not in text:
              if marker not in text:
                  raise SystemExit('deadline insertion marker missing')
              text = text.replace(marker, helpers + marker, 1)
          old = '''        while active:\n            try:\n                done = _next_completed_batch(\n                    active,\n                    stage=stage,\n                    unit_timeout=unit_timeout,\n                    stage_deadline=stage_deadline,\n                )\n            except ParallelExecutionTimeout as exc:\n                if on_error is None:\n                    raise\n                on_error(exc.item, exc)\n                return\n\n            ordered = sorted(\n                done,\n                key=lambda future: _completion_order(future, active, sort_key),\n            )\n            for future in ordered:\n                meta = active.pop(future)\n                try:\n                    result = _completed_result(future, meta, stage=stage)\n                except ParallelTaskError as exc:\n                    if on_error is None:\n                        raise\n                    on_error(meta.item, exc.cause)\n                    continue\n                if on_result is not None:\n                    on_result(meta.item, result)\n                yield meta.item, result\n'''
          new = '''        while active:\n            done = _next_batch_or_report(\n                active,\n                stage=stage,\n                unit_timeout=unit_timeout,\n                stage_deadline=stage_deadline,\n                on_error=on_error,\n            )\n            if done is None:\n                return\n\n            ordered = sorted(\n                done,\n                key=lambda future: _completion_order(future, active, sort_key),\n            )\n            for future in ordered:\n                meta = active.pop(future)\n                completed, result = _completed_result_or_report(\n                    future, meta, stage=stage, on_error=on_error\n                )\n                if not completed:\n                    continue\n                if on_result is not None:\n                    on_result(meta.item, result)\n                yield meta.item, result\n'''
          if old not in text:
              raise SystemExit('deadline loop block missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # ------------------------------------------------------------------
          # Qwen parser: keep sibling isolation, split scanning/validation/render.
          # ------------------------------------------------------------------
          path = root / 'minecraft_mod_ai/model_adapters/qwen_tool_parser.py'
          text = path.read_text(encoding='utf-8')
          start = text.index('def parse_qwen_tool_markup(\n')
          end = text.index('\n\ndef _parse_qwen_function(', start)
          replacement = r'''def _parse_qwen_candidate(
    text: str,
    start: int,
    *,
    wrapped: bool,
    schemas: Mapping[str, Mapping[str, Any]],
    call_index: int,
) -> tuple[ToolCall, int]:
    function_at = start + len(_TOOL_CALL_OPEN) if wrapped else start
    function_at = _skip_space(text, function_at)
    if not text.startswith(_FUNCTION_OPEN, function_at):
        raise ToolCallValidationError(
            "Qwen tool_call block does not begin with a function"
        )
    call, end = _parse_qwen_function(
        text,
        function_at,
        schemas,
        call_index=call_index,
    )
    if wrapped:
        close_at = _skip_space(text, end)
        if not text.startswith(_TOOL_CALL_CLOSE, close_at):
            raise ToolCallValidationError(
                "Qwen tool_call block is missing </tool_call>"
            )
        end = close_at + len(_TOOL_CALL_CLOSE)
    return call, end


def _collect_qwen_calls(
    text: str,
    schemas: Mapping[str, Mapping[str, Any]],
) -> tuple[list[ToolCall], list[tuple[int, int]], list[str], ToolCallValidationError | None, bool]:
    calls: list[ToolCall] = []
    spans: list[tuple[int, int]] = []
    rejected: list[str] = []
    first_error: ToolCallValidationError | None = None
    saw_tool_markup = False
    cursor = 0
    while cursor < len(text):
        wrapped_at = text.find(_TOOL_CALL_OPEN, cursor)
        direct_at = text.find(_FUNCTION_OPEN, cursor)
        starts = [value for value in (wrapped_at, direct_at) if value >= 0]
        if not starts:
            break
        start = min(starts)
        saw_tool_markup = True
        wrapped = wrapped_at == start
        try:
            call, end = _parse_qwen_candidate(
                text,
                start,
                wrapped=wrapped,
                schemas=schemas,
                call_index=len(calls),
            )
        except ToolCallValidationError as exc:
            if first_error is None:
                first_error = exc
            end = _malformed_call_end(text, start, wrapped=wrapped)
            if end <= start:
                end = min(len(text), start + 1)
            spans.append((start, end))
            rejected.append(_malformed_call_label(text, start, end, exc))
            cursor = end
            continue
        calls.append(call)
        spans.append((start, end))
        cursor = end
    return calls, spans, rejected, first_error, saw_tool_markup


def _append_structural_rejection(
    text: str,
    calls: list[ToolCall],
    spans: list[tuple[int, int]],
    rejected: list[str],
    first_error: ToolCallValidationError | None,
) -> ToolCallValidationError | None:
    for marker in _STRUCTURAL_MARKERS:
        pos = text.find(marker)
        if pos < 0 or any(begin <= pos < end for begin, end in spans):
            continue
        exc = ToolCallValidationError(
            f"unparsed Qwen tool markup begins at {marker!r}"
        )
        if not calls:
            raise exc
        if first_error is None:
            first_error = exc
        rejected.append(_malformed_call_label(text, pos, len(text), exc))
        spans.append((pos, len(text)))
        break
    return first_error


def _render_qwen_visible_text(
    text: str,
    spans: list[tuple[int, int]],
    rejected: list[str],
) -> str:
    visible: list[str] = []
    previous = 0
    for begin, end in sorted(spans):
        if begin > previous:
            visible.append(text[previous:begin])
        previous = max(previous, end)
    visible.append(text[previous:])
    if rejected:
        visible.append("\n" + "\n".join(rejected))
    return "".join(visible)


def parse_qwen_tool_markup(
    text: str,
    schemas: Mapping[str, Mapping[str, Any]],
) -> tuple[str, tuple[ToolCall, ...]]:
    """Parse native Qwen function tags without weakening the exposed tool schema.

    Independent sibling calls are transactional at call granularity: a malformed sibling
    is removed from executable output while already-valid siblings remain available to the
    host. If no call in a tool-bearing turn validates, raise the first validation error so
    malformed output can never masquerade as a prose-only success.
    """
    if not text:
        return "", ()
    calls, spans, rejected, first_error, saw_tool_markup = _collect_qwen_calls(text, schemas)
    first_error = _append_structural_rejection(
        text, calls, spans, rejected, first_error
    )
    if saw_tool_markup and not calls and first_error is not None:
        raise first_error
    if not spans:
        return text, ()
    return _render_qwen_visible_text(text, spans, rejected), tuple(calls)
'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          # ------------------------------------------------------------------
          # Recovery/verifier policy: remove policy branches from the giant loop.
          # ------------------------------------------------------------------
          policy = root / 'minecraft_mod_ai/progress_verification_policy.py'
          policy.write_text('''from __future__ import annotations\n\nfrom collections.abc import Callable, Mapping, MutableSequence\nfrom typing import Any\n\nRECOVERY_EVIDENCE_TOOLS = frozenset({\n    "search_code_rag",\n    "search_project_rag",\n    "discover_ecosystem_resources",\n    "inspect_modrinth_project",\n    "inspect_github_repository",\n    "inspect_huggingface_model",\n    "inspect_existing_mod",\n    "assess_technology_compatibility",\n    "java_workspace_symbols",\n    "external_mcp_call",\n    "read_reuse_source",\n})\n\n_VERIFIER_UNAVAILABLE_STATUSES = frozenset({\n    "UNAVAILABLE", "NOT_RUN", "TIMEOUT", "TIMED_OUT", "UNHEALTHY",\n})\n_VERIFIER_FAIL_STATUSES = frozenset({"FAIL", "FAILED", "ERROR", "INVALID"})\n_VERIFIER_PASS_STATUSES = frozenset({\n    "PASS", "PASSED", "OK", "SUCCESS", "SUCCEEDED", "AVAILABLE",\n})\n\n\ndef verification_outcome(tool_name: str, payload: Mapping[str, Any]) -> str:\n    """Classify verifier semantics independently from transport/runtime health."""\n    if not bool(payload.get("ok")):\n        failure_code = str(payload.get("failure_code") or "").strip().upper()\n        if failure_code in {"VERIFIER_ARGUMENT_INVALID", "VERIFIER_TARGET_INVALID"}:\n            return failure_code\n        return "UNAVAILABLE"\n    result = payload.get("result")\n    if not isinstance(result, Mapping):\n        return "PASS"\n    status = str(\n        result.get("status") or result.get("state") or result.get("outcome") or ""\n    ).strip().upper()\n    if status in _VERIFIER_UNAVAILABLE_STATUSES:\n        return "UNAVAILABLE"\n    if status in _VERIFIER_FAIL_STATUSES:\n        return "FAIL"\n    if status in _VERIFIER_PASS_STATUSES and tool_name not in {\n        "java_diagnostics", "jdt_diagnostics"\n    }:\n        return "PASS"\n    if result.get("available") is False:\n        return "UNAVAILABLE"\n    for key in ("success", "ok"):\n        if key in result and isinstance(result.get(key), bool):\n            return "PASS" if bool(result.get(key)) else "FAIL"\n    if "exit_code" in result:\n        try:\n            return "PASS" if int(result.get("exit_code")) == 0 else "FAIL"\n        except (TypeError, ValueError, OverflowError):\n            return "UNAVAILABLE"\n    if tool_name in {"java_diagnostics", "jdt_diagnostics"}:\n        from .validation_diagnostic_contract import diagnostic_errors\n        errors = diagnostic_errors(result)\n        if any(\n            str(item.get("code") or "") == "JDT_DIAGNOSTICS_UNAVAILABLE"\n            for item in errors\n        ):\n            return "UNAVAILABLE"\n        return "FAIL" if errors else "PASS"\n    return "PASS"\n\n\ndef is_evidence_tool(\n    name: str,\n    arguments: Mapping[str, Any],\n    *,\n    phase: str,\n    localization_tools: frozenset[str],\n    rag_tools: frozenset[str],\n    external_rag_capability: Callable[[Mapping[str, Any]], Any],\n) -> bool:\n    return (\n        name in localization_tools\n        or name in rag_tools\n        or (phase == "RECOVER" and name in RECOVERY_EVIDENCE_TOOLS)\n        or (name == "external_mcp_call" and bool(external_rag_capability(arguments)))\n    )\n\n\ndef evidence_made_progress(\n    context_progress: bool,\n    recorded: bool,\n    *,\n    phase: str,\n    implementation_requires_mutation: bool,\n) -> bool:\n    return bool(\n        context_progress\n        or (phase == "RECOVER" and recorded)\n        or (not implementation_requires_mutation and recorded)\n    )\n\n\ndef should_transition_to_act(\n    *,\n    phase: str,\n    implementation_requires_mutation: bool,\n    mutation_ready: bool,\n) -> bool:\n    return bool(\n        phase in {"OBSERVE", "RECOVER"}\n        and implementation_requires_mutation\n        and mutation_ready\n    )\n\n\ndef append_repair_guidance(\n    state: Any,\n    messages: MutableSequence[dict[str, Any]],\n    *,\n    implementation_requires_mutation: bool,\n) -> None:\n    if not implementation_requires_mutation or str(state.phase.value) not in {"ACT", "RECOVER"}:\n        return\n    guidance = state.take_verifier_repair_guidance()\n    if guidance is not None:\n        messages.append({"role": "system", "content": guidance})\n''', encoding='utf-8')

          path = root / 'minecraft_mod_ai/progress_aware_tool_loop.py'
          text = path.read_text(encoding='utf-8')
          import_marker = 'from .root_cause_trace import emit_root_cause, trace_scope\n'
          import_block = '''from .progress_verification_policy import (\n    RECOVERY_EVIDENCE_TOOLS as _RECOVERY_EVIDENCE_TOOLS,\n    append_repair_guidance as _append_repair_guidance,\n    evidence_made_progress as _evidence_made_progress,\n    is_evidence_tool as _is_evidence_tool,\n    should_transition_to_act as _should_transition_to_act,\n    verification_outcome as _verification_outcome,\n)\n'''
          if import_block not in text:
              text = text.replace(import_marker, import_block + import_marker, 1)

          recovery_start = text.index('_RECOVERY_EVIDENCE_TOOLS = frozenset({')
          recovery_end = text.index('\n\n_MUTATION_ACT_TOOLS', recovery_start)
          text = text[:recovery_start] + text[recovery_end + 2:]

          verifier_start = text.index('_VERIFIER_UNAVAILABLE_STATUSES = frozenset({')
          verifier_end = text.index('\n\ndef _fixed_point_tool_results(', verifier_start)
          text = text[:verifier_start] + text[verifier_end + 2:]

          nested = '''        def is_evidence_tool(call: Any) -> bool:\n            return (\n                call.name in _LOCALIZATION_EVIDENCE_TOOLS\n                or call.name in _RAG_EVIDENCE_TOOLS\n                or (\n                    state.phase == LoopPhase.RECOVER\n                    and call.name in _RECOVERY_EVIDENCE_TOOLS\n                )\n                or (call.name == "external_mcp_call" and bool(_external_rag_capability(call.arguments)))\n            )\n\n'''
          if nested not in text:
              raise SystemExit('nested evidence helper missing')
          text = text.replace(nested, '', 1)
          evidence_call = '''_is_evidence_tool(\n                    call.name, call.arguments, phase=state.phase.value,\n                    localization_tools=_LOCALIZATION_EVIDENCE_TOOLS, rag_tools=_RAG_EVIDENCE_TOOLS,\n                    external_rag_capability=_external_rag_capability,\n                )'''
          text = text.replace('is_evidence_tool(call)', evidence_call)

          old_guidance = '''        if (\n            implementation_requires_mutation\n            and state.phase in {LoopPhase.ACT, LoopPhase.RECOVER}\n        ):\n            repair_guidance = state.take_verifier_repair_guidance()\n            if repair_guidance is not None:\n                messages.append({"role": "system", "content": repair_guidance})\n'''
          if old_guidance not in text:
              raise SystemExit('repair guidance block missing')
          text = text.replace(
              old_guidance,
              '''        _append_repair_guidance(\n            state, messages, implementation_requires_mutation=implementation_requires_mutation\n        )\n''',
              1,
          )

          old_progress = '''                if (\n                    ctx_progress\n                    or (state.phase == LoopPhase.RECOVER and recorded)\n                    or (not implementation_requires_mutation and recorded)\n                ):\n                    turn_made_progress = True\n                    if (\n                        state.phase in {LoopPhase.OBSERVE, LoopPhase.RECOVER}\n                        and implementation_requires_mutation\n                        and is_mutation_ready(messages, state)\n                    ):\n                        state.phase = LoopPhase.ACT\n'''
          new_progress = '''                if _evidence_made_progress(\n                    ctx_progress, recorded, phase=state.phase.value,\n                    implementation_requires_mutation=implementation_requires_mutation,\n                ):\n                    turn_made_progress = True\n                    if _should_transition_to_act(\n                        phase=state.phase.value, implementation_requires_mutation=implementation_requires_mutation,\n                        mutation_ready=is_mutation_ready(messages, state),\n                    ):\n                        state.phase = LoopPhase.ACT\n'''
          if old_progress not in text:
              raise SystemExit('evidence progress block missing')
          path.write_text(text.replace(old_progress, new_progress, 1), encoding='utf-8')
          PY

      - name: Validate targeted behavior and architecture
        shell: bash
        run: |
          python -m compileall -q minecraft_mod_ai
          python -m pytest -q -k 'qwen or deadline or verifier_recovery or generation_recovery' tests
          python .github/scripts/audit_code_quality_regression.py \
            --base-ref 9c1a538b3c0d9062356e6192bf991e7ce2cc8f53 \
            --output /tmp/architecture-policy.json || true
          python - <<'PY'
          import json
          data = json.load(open('/tmp/architecture-policy.json', encoding='utf-8'))
          watched = {
              'minecraft_mod_ai/deadline_executor.py:_iter_completed_with_deadlines_impl',
              'minecraft_mod_ai/model_adapters/qwen_tool_parser.py:parse_qwen_tool_markup',
              'minecraft_mod_ai/progress_aware_tool_loop.py:_generate_with_tools_impl',
              'minecraft_mod_ai/progress_aware_tool_loop.py:_generate_with_tools_impl.is_evidence_tool',
              'minecraft_mod_ai/progress_aware_tool_loop.py',
          }
          remaining = [v for v in data['violations'] if v.get('subject') in watched]
          print('WATCHED_REMAINING=', remaining)
          if remaining:
              raise SystemExit('targeted architecture regressions remain')
          hard = [v for v in data['violations'] if v.get('category') in {
              'new_function_hard_ceiling', 'new_file_hard_ceiling'
          }]
          print('NEW_HARD_CEILING_VIOLATIONS=', hard)
          if hard:
              raise SystemExit('refactor introduced a new hard ceiling violation')
          PY

      - name: Commit refactor to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-architecture-policy-refactor.yml
          git add minecraft_mod_ai
          git commit -m "refactor: isolate parser scheduler and recovery policy"
          git pull --rebase origin main
          git push origin HEAD:main
