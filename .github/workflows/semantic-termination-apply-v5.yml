name: Semantic Termination Apply V5

on:
  push:
    paths:
      - .github/workflows/semantic-termination-apply-v5.yml

permissions:
  contents: write

concurrency:
  group: semantic-termination-apply-v5
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply semantic migration with scoped trace insertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/semantic-termination-apply-v3.yml').read_text(encoding='utf-8')

          def heredoc(start_marker: str, end_marker: str) -> str:
              start = workflow.index(start_marker) + len(start_marker)
              end = workflow.index(end_marker, start)
              return textwrap.dedent(workflow[start:end])

          contract = heredoc(
              "          cat > minecraft_mod_ai/termination_contract.py <<'PYMODULE'\n",
              "          PYMODULE\n",
          )
          Path('minecraft_mod_ai/termination_contract.py').write_text(contract, encoding='utf-8')

          py_blocks = [
              textwrap.dedent(block)
              for block in re.findall(
                  r"          python - <<'PY'\n(.*?)\n          PY\n",
                  workflow,
                  flags=re.S,
              )
          ]
          if len(py_blocks) != 2:
              raise SystemExit(f'expected router+loop migration scripts, found {len(py_blocks)}')

          exec(compile(py_blocks[0], '<router-migration>', 'exec'), {})

          loop_script = py_blocks[1]
          start = loop_script.index("insertion_anchor = '''")
          end = loop_script.index("\n\nfor token in (", start)
          replacement = '''trace_anchor = "        state.trajectory.append(trace_entry)\\n"
          trace_pos = text.find(trace_anchor, end_start)
          if trace_pos < 0:
              raise SystemExit('scoped trace append anchor not found after adjudication block')
          semantic_boundary = trace_anchor + """        if decision.status == TerminationStatus.BLOCKED:
              reason = decision.reason.value if decision.reason is not None else "BLOCKED"
              state.termination_reason = reason
              trajectory = format_trajectory_summary(state.trajectory)
              emit_root_cause(
                  "tool_loop_semantic_termination",
                  stage=stage,
                  operation="generate_with_tools",
                  gate="semantic_state_recurrence",
                  result="FAIL" if implementation_requires_mutation else "PASS",
                  reason=reason,
                  details={
                      "step_index": state.step_index,
                      "semantic_fingerprint": decision.semantic_fingerprint,
                      "required_state_change": decision.required_state_change,
                      "trajectory": trajectory,
                  },
              )
              if require_rag and not state.has_fresh_evidence:
                  raise ModelConfigurationError(
                      f"Required production evidence reached semantic {reason}; no novel "
                      "reviewed evidence frontier remains."
                  )
              if implementation_requires_mutation and (
                  not state.workspace_changed or state.validation_status != "PASS"
              ):
                  raise ModelConfigurationError(
                      f"Writable coder reached semantic {reason} before verified completion; "
                      "refusing prose-only or unverified success."
                  )
              return _finalize_without_tools(
                  router,
                  config,
                  adapter,
                  request,
                  messages,
                  instruction=(
                      f"Execution reached semantic {reason}. Do not call more tools. "
                      "Return only conclusions supported by existing observations."
                  ),
                  empty_error=(
                      "Agent returned an empty final response after semantic termination."
                  ),
              )
          """
          text = text[:trace_pos] + semantic_boundary + text[trace_pos + len(trace_anchor):]'''
          loop_script = loop_script[:start] + replacement + loop_script[end:]
          exec(compile(loop_script, '<tool-loop-migration>', 'exec'), {})

          tests = heredoc(
              "          cat > tests/test_agent_tool_round_liveness.py <<'PYTEST'\n",
              "          PYTEST\n",
          )
          Path('tests/test_agent_tool_round_liveness.py').write_text(tests, encoding='utf-8')
          PY

      - name: Compile
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q minecraft_mod_ai

      - name: Run targeted regression tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_agent_tool_round_liveness.py \
            tests/test_adaptive_production_agent.py \
            tests/test_adaptive_execution_hardening.py

      - name: Audit legacy semantic counters
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'no_progress_streak|forced_rag_attempts|_agent_tool_round_limit|MMM_AGENT_TOOL_ROUNDS|MMM_AGENT_DEFAULT_TOOL_ROUNDS' -- minecraft_mod_ai tests; then
            echo 'legacy semantic retry/counter contract remains' >&2
            exit 1
          fi

      - name: Commit verified production migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI semantic termination migration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/model_router.py \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            minecraft_mod_ai/termination_contract.py \
            tests/test_agent_tool_round_liveness.py
          git diff --cached --check
          git commit -m 'Replace agent retry caps with semantic termination'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
