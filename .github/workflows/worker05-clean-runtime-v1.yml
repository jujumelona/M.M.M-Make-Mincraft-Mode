name: Worker 05 Runtime Cleanup V1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/worker05-clean-runtime-v1.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply exact worker05 cleanup
        run: |
          python .github/scripts/worker05_clean_runtime_v1.py
          python .github/scripts/worker05_loop_cleanups_v1.py
      - name: Static and targeted verification
        run: |
          python -m compileall -q minecraft_mod_ai
          python .github/scripts/debug_repo_audit.py
          ruff check minecraft_mod_ai/model_router.py minecraft_mod_ai/progress_aware_tool_loop.py minecraft_mod_ai/llama_context_safety_contract.py tests/test_agent_tool_round_policy.py tests/test_llama_context_safety_contract.py
          pytest -q tests/test_agent_tool_round_policy.py tests/test_llama_context_safety_contract.py tests/test_agent_context_window_contract.py tests/test_agent_tool_calling.py
      - name: Commit cleanup to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(llama): fold finite tool rounds into owner'
          git pull --rebase origin main
          git push origin HEAD:main
