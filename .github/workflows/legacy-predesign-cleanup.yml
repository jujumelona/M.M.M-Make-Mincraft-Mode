name: One-shot Retired Pre-design Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/legacy-predesign-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Remove retired pre-design import from retrieval efficiency
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/small_model_retrieval_efficiency_contract.py')
          text = path.read_text(encoding='utf-8')
          old = text
          text = text.replace('        agentic_pre_design_rag,\n', '')
          text = text.replace('    _install_pre_design_rag_cascade(agentic_pre_design_rag)\n', '')
          if text == old:
              print('target lines already absent')
          else:
              path.write_text(text, encoding='utf-8')
              print('removed retired pre-design runtime cascade')
          PY
      - name: Commit cleanup to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/small_model_retrieval_efficiency_contract.py
          if ! git diff --cached --quiet; then
            git commit -m 'fix: remove retired pre-design retrieval cascade'
            git push origin HEAD:main
          fi
      - name: Audit all remaining retired owner references
        run: |
          if grep -R --line-number --include='*.py' 'agentic_pre_design_rag' minecraft_mod_ai; then
            echo 'REMAINING_RETIRED_OWNER_REFERENCES=1' >&2
            exit 1
          fi
          echo 'REMAINING_RETIRED_OWNER_REFERENCES=0'
