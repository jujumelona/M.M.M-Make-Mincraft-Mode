name: Apply planner meta-output guard

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch central detailed-plan text boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/planning_state_implementation.py')
          source = path.read_text(encoding='utf-8')

          constants_anchor = '_BATCH_MAX_TOKENS = 2200\n'
          if source.count(constants_anchor) != 1:
              raise SystemExit('batch constants anchor drifted')
          source = source.replace(
              constants_anchor,
              constants_anchor
              + '''_META_REASONING_TAG_RE = re.compile(
              r"^\\s*<\\s*think(?:ing)?\\b[^>]*>.*?<\\s*/\\s*think(?:ing)?\\s*>\\s*",
              re.IGNORECASE | re.DOTALL,
          )
          _META_REASONING_LABEL_RE = re.compile(
              r"^\\s*(?:#{1,6}\\s*)?(?:\\*\\*|__)?\\s*(?:thinking\\s+process|reasoning|analysis)\\s*(?:\\*\\*|__)?\\s*:\\s*",
              re.IGNORECASE,
          )
          _FINAL_OUTPUT_LABEL_RE = re.compile(
              r"(?:^|\\n)\\s*(?:#{1,6}\\s*)?(?:\\*\\*|__)?\\s*(?:final(?:\\s+(?:answer|specification))?|specification|answer)\\s*(?:\\*\\*|__)?\\s*:\\s*",
              re.IGNORECASE,
          )
          '''.replace('          ', ''),
              1,
          )

          start = source.index('def _normalize_section_text(')
          end = source.index('\n\ndef _plain_section(', start)
          replacement = '''def _strip_leading_meta_reasoning(raw: Any, section: str) -> str:
              value = str(raw or "").strip()
              while True:
                  stripped = _META_REASONING_TAG_RE.sub("", value, count=1).strip()
                  if stripped == value:
                      break
                  value = stripped

              if _META_REASONING_LABEL_RE.match(value):
                  final_output = _FINAL_OUTPUT_LABEL_RE.search(value)
                  if final_output is None:
                      raise ValueError(
                          f"DETAILED_PLAN_META_REASONING: {section} returned reasoning without an explicit final-output boundary"
                      )
                  value = value[final_output.end():].strip()
              return value


          def _normalize_section_text(raw: Any, section: str) -> str:
              value = _strip_leading_meta_reasoning(raw, section)
              if value.startswith("```"):
                  value = value.strip("`").strip()
              if value.lstrip().startswith(("{", "[")):
                  raise ValueError(
                      f"DETAILED_PLAN_TEXT_BOUNDARY: {section} returned a structured payload instead of prose"
                  )
              value = _text(value)
              if len(value) < 24:
                  raise ValueError(f"DETAILED_PLAN_SECTION: {section} returned no concrete specification")
              return value
          '''.replace('          ', '')
          source = source[:start] + replacement + source[end:]
          path.write_text(source, encoding='utf-8')
          PY
          python -m py_compile minecraft_mod_ai/planning_state_implementation.py
      - name: Commit source guard and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/one-shot-strip-planner-meta.yml
          git add minecraft_mod_ai/planning_state_implementation.py .github/workflows/one-shot-strip-planner-meta.yml
          git commit -m 'fix: reject planner meta reasoning from artifacts'
          git push origin HEAD:main
