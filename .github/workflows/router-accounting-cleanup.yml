name: Router Accounting Cleanup

on:
  push:
    paths:
      - .github/workflows/router-accounting-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch router and stale tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/model_router.py')
          text = path.read_text(encoding='utf-8')
          if '    def input_context_accounting(\n' not in text:
              anchor = '    def generate_text(\n        self,\n        role: str,\n'
              lines = [
                  '    def input_context_accounting(',
                  '        self,',
                  '        role: str,',
                  '        messages: Sequence[Mapping[str, Any]],',
                  '        *,',
                  '        media_paths: Sequence[str | Path] = (),',
                  '        response_format: str = "text",',
                  '        response_schema: Mapping[str, Any] | None = None,',
                  '        tool_stage: str | None = None,',
                  '        enable_tools: bool = False,',
                  '    ) -> Any | None:',
                  '        """Return live adapter input/context token accounting without generation."""',
                  '',
                  '        config, adapter = self._generation_adapter(role)',
                  '        _stage, _runtime, _tools, request = self._prepare_generation_request(',
                  '            role,',
                  '            messages,',
                  '            config=config,',
                  '            media_paths=media_paths,',
                  '            response_format=response_format,',
                  '            response_schema=response_schema,',
                  '            tool_stage=tool_stage,',
                  '            enable_tools=enable_tools,',
                  '        )',
                  '        counter = getattr(adapter, "input_context_accounting", None)',
                  '        if not callable(counter):',
                  '            return None',
                  '        return counter(request)',
                  '',
                  '',
              ]
              method = '\n'.join(lines)
              if anchor not in text:
                  raise SystemExit('generate_text anchor missing')
              text = text.replace(anchor, method + anchor, 1)
              path.write_text(text, encoding='utf-8')

          path = Path('tests/test_small_model_research_completion.py')
          text = path.read_text(encoding='utf-8')
          old = '    assert getattr(model_router.ModelRouter._prepare_generation_request, "_mmm_small_model_tool_retrieval", False)'
          new = '    assert not getattr(model_router.ModelRouter._prepare_generation_request, "_mmm_small_model_tool_retrieval", False)'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('selector assertion missing')
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_exact_llama_context_accounting.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from types import SimpleNamespace\n\n', '')
          text = text.replace('    ExactContextOverflow,\n', '')
          path.write_text(text, encoding='utf-8')

          path = Path('minecraft_mod_ai/small_model_predesign_research.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'except Exception as exc:',
              'except Exception as exc:  # noqa: BLE001 - model/external boundary becomes diagnostics',
          )
          text = text.replace(
              'except Exception:',
              'except Exception:  # noqa: BLE001 - optional host/external boundary degrades safely',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install and verify
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff check --fix minecraft_mod_ai/model_router.py minecraft_mod_ai/small_model_predesign_research.py tests/test_predesign_capacity_batching.py tests/test_small_model_research_completion.py tests/test_exact_llama_context_accounting.py
          python -m py_compile minecraft_mod_ai/model_router.py minecraft_mod_ai/small_model_predesign_research.py
          python -m ruff check minecraft_mod_ai/model_router.py minecraft_mod_ai/small_model_predesign_research.py tests/test_predesign_capacity_batching.py tests/test_small_model_research_completion.py tests/test_exact_llama_context_accounting.py
          python -m pytest -q tests/test_predesign_capacity_batching.py tests/test_predesign_source_discovery_contract.py tests/test_small_model_research_completion.py tests/test_exact_llama_context_accounting.py
      - name: Commit production and regressions
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add minecraft_mod_ai/model_router.py minecraft_mod_ai/small_model_predesign_research.py tests/test_small_model_research_completion.py tests/test_exact_llama_context_accounting.py
          git diff --cached --check
          git commit -m 'refactor: expose exact input accounting to research'
          git push origin HEAD:main
