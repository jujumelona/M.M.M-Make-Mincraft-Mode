name: one-shot staged source-context root-cause fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-staged-source-context-fix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact staged-root grounding fix
        run: python .github/scripts/apply_staged_source_context_fix.py

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run focused regression tests
        run: python -m pytest -q tests/test_custom_module_staged_source_context.py tests/test_source_target_lifecycle_contract.py

      - name: Compile touched Python
        run: python -m py_compile minecraft_mod_ai/custom_module_generator.py tests/test_custom_module_staged_source_context.py

      - name: Commit verified fix to main
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft_mod_ai/custom_module_generator.py tests/test_custom_module_staged_source_context.py
          git commit -m "Fix staged checkpoint source grounding"
          git push origin HEAD:main
