name: Run predesign retrieval optimization once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/run-predesign-retrieval-optimization-once.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply bounded retrieval refactor
        run: python .github/scripts/optimize_predesign_retrieval_once.py
      - name: Verify source hygiene
        run: |
          git diff --check
          python -m compileall -q minecraft_mod_ai
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Run pre-design regressions
        run: |
          python -m pytest -q tests/test_pre_design_research_pipeline.py tests/test_small_model_predesign_research.py
      - name: Commit refactor and remove staging files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/run-predesign-retrieval-optimization-once.yml
          git rm .github/scripts/optimize_predesign_retrieval_once.py
          git add minecraft_mod_ai/pre_design_grounded_rag.py
          git commit -m "perf: bound predesign retrieval fanout"
          git push origin main
      - name: Remove staging files after failure
        if: failure()
        run: |
          git reset --hard HEAD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/run-predesign-retrieval-optimization-once.yml
          git rm .github/scripts/optimize_predesign_retrieval_once.py
          git commit -m "chore: remove failed retrieval optimization staging"
          git push origin main
