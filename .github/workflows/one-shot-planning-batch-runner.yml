name: Execute planning batch migration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply and validate migration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/one_shot_planning_batch.py')
          source = path.read_text(encoding='utf-8')
          source = source.replace('if count != 1:', 'if count < 1:')
          source = source.replace(
              '    source = source.replace(old, new, 1)',
              '    head, separator, tail = source.rpartition(old)\n    source = head + new + tail',
          )
          path.write_text(source, encoding='utf-8')
          PY
          python tools/one_shot_planning_batch.py
          python -m py_compile minecraft_mod_ai/planning_state_implementation.py tests/test_planning_detail_requirement_batching.py
      - name: Commit migration and remove one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/one-shot-planning-batch.yml
          rm .github/workflows/one-shot-planning-batch-runner.yml
          rm tools/one_shot_planning_batch.py
          git add -A
          git commit -m 'perf: batch detailed planning per requirement'
          git push origin HEAD:main
