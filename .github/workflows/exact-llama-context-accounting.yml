name: Exact Llama Context Accounting

on:
  push:
    paths:
      - .github/workflows/exact-llama-context-accounting.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply exact runtime context accounting
        run: |
          python - <<'PY'
          from pathlib import Path

          exact = Path('minecraft_mod_ai/llama_exact_context.py')
          exact.write_text('''from __future__ import annotations\n\n\"\"\"Exact live llama.cpp chat-context accounting.\n\nThe managed server is the authority for both chat-template tokenization and the\nper-slot context size.  No byte/token ratio or fixed safety margin participates in\nthe fit decision.\n\"\"\"\n\nfrom collections.abc import Mapping\nfrom dataclasses import dataclass\nfrom typing import Any\n\n\n@dataclass(frozen=True)\nclass LiveContextAccounting:\n    input_tokens: int\n    context_tokens: int\n\n    @property\n    def remaining_tokens(self) -> int:\n        return self.context_tokens - self.input_tokens\n\n\nclass ExactContextOverflow(RuntimeError):\n    pass\n\n\ndef _client(server_url: str) -> Any:\n    from .llama_stream_efficiency_contract import _client as managed_client\n\n    return managed_client(server_url)\n\n\ndef live_context_accounting(\n    server_url: str,\n    payload: Mapping[str, Any],\n) -> LiveContextAccounting:\n    client = _client(server_url)\n    body = dict(payload)\n    body.pop(\"stream\", None)\n    token_response = client.post(\n        f\"{server_url.rstrip('/')}/chat/completions/input_tokens\",\n        json=body,\n    )\n    token_response.raise_for_status()\n    token_payload = token_response.json()\n    input_tokens = int(token_payload[\"input_tokens\"])\n\n    origin = server_url.rstrip(\"/\").removesuffix(\"/v1\")\n    props_response = client.get(f\"{origin}/props\")\n    props_response.raise_for_status()\n    props = props_response.json()\n    settings = props[\"default_generation_settings\"]\n    context_tokens = int(settings[\"n_ctx\"])\n    if input_tokens < 0 or context_tokens <= 0:\n        raise RuntimeError(\n            \"llama.cpp returned invalid live context accounting: \"\n            f\"input_tokens={input_tokens} n_ctx={context_tokens}\"\n        )\n    return LiveContextAccounting(\n        input_tokens=input_tokens,\n        context_tokens=context_tokens,\n    )\n\n\ndef capacity_safe_payload(\n    server_url: str,\n    payload: Mapping[str, Any],\n) -> dict[str, Any]:\n    result = dict(payload)\n    accounting = live_context_accounting(server_url, result)\n    remaining = accounting.remaining_tokens\n    if remaining <= 0:\n        raise ExactContextOverflow(\n            \"exact llama.cpp chat input exceeds the active runtime slot; \"\n            f\"input_tokens={accounting.input_tokens} n_ctx={accounting.context_tokens}\"\n        )\n    requested = int(result.get(\"max_tokens\", 0) or 0)\n    if requested <= 0 or requested > remaining:\n        result[\"max_tokens\"] = remaining\n    return result\n\n\n__all__ = [\n    \"ExactContextOverflow\",\n    \"LiveContextAccounting\",\n    \"capacity_safe_payload\",\n    \"live_context_accounting\",\n]\n''', encoding='utf-8')

          adapter = Path('minecraft_mod_ai/model_adapters/llama_cpp_adapter.py')
          text = adapter.read_text(encoding='utf-8')
          method_anchor = '''    def generate(self, request: GenerationRequest) -> str:\n        turn = self.generate_turn(request)\n'''
          method_replacement = '''    def input_context_accounting(self, request: GenerationRequest):\n        \"\"\"Ask the live llama.cpp server to count the exact templated request.\"\"\"\n\n        from ..llama_exact_context import live_context_accounting\n        from ..llama_server_hardware_policy import _server_payload\n\n        server_url = self._server_url(request)\n        return live_context_accounting(\n            server_url,\n            _server_payload(self, request),\n        )\n\n    def generate(self, request: GenerationRequest) -> str:\n        turn = self.generate_turn(request)\n'''
          if method_anchor not in text:
              raise SystemExit('llama adapter generate anchor not found')
          text = text.replace(method_anchor, method_replacement, 1)

          loop_anchor = '''    while True:\n        try:\n            final_message = _completion_message(server_url, current_payload)\n'''
          loop_replacement = '''    from ..llama_exact_context import capacity_safe_payload\n\n    while True:\n        current_payload = capacity_safe_payload(server_url, current_payload)\n        try:\n            final_message = _completion_message(server_url, current_payload)\n'''
          if loop_anchor not in text:
              raise SystemExit('llama adapter completion loop anchor not found')
          text = text.replace(loop_anchor, loop_replacement, 1)
          adapter.write_text(text, encoding='utf-8')

          loop = Path('minecraft_mod_ai/progress_aware_tool_loop.py')
          text = loop.read_text(encoding='utf-8')
          old = '''    fitted = fit_messages_to_context(messages, config=config, tools=request.tools)\n    _replace_live_messages(messages, fitted)\n    turn_request = replace(\n        request,\n        messages=tuple(messages),\n        media_paths=media_paths,\n        tool_choice=tool_choice,\n        parallel_tool_calls=parallel_tool_calls,\n    )\n'''
          new = '''    turn_request = replace(\n        request,\n        messages=tuple(messages),\n        media_paths=media_paths,\n        tool_choice=tool_choice,\n        parallel_tool_calls=parallel_tool_calls,\n    )\n    exact_accounting = getattr(adapter, \"input_context_accounting\", None)\n    if callable(exact_accounting):\n        accounting = exact_accounting(turn_request)\n        if accounting.input_tokens < accounting.context_tokens:\n            fitted = tuple(messages)\n        else:\n            fitted = fit_messages_to_context(messages, config=config, tools=request.tools)\n    else:\n        fitted = fit_messages_to_context(messages, config=config, tools=request.tools)\n    _replace_live_messages(messages, fitted)\n    turn_request = replace(turn_request, messages=tuple(messages))\n'''
          if old not in text:
              raise SystemExit('progress loop context fit anchor not found')
          text = text.replace(old, new, 1)
          loop.write_text(text, encoding='utf-8')

          test = Path('tests/test_exact_llama_context_accounting.py')
          test.write_text('''from __future__ import annotations\n\nfrom types import SimpleNamespace\n\nfrom minecraft_mod_ai.llama_exact_context import (\n    ExactContextOverflow,\n    capacity_safe_payload,\n    live_context_accounting,\n)\n\n\nclass _Response:\n    def __init__(self, payload):\n        self._payload = payload\n\n    def raise_for_status(self):\n        return None\n\n    def json(self):\n        return self._payload\n\n\nclass _Client:\n    def post(self, url, json):\n        assert url.endswith('/v1/chat/completions/input_tokens')\n        assert json['messages'][0]['content'] == 'hello'\n        return _Response({'object': 'response.input_tokens', 'input_tokens': 37})\n\n    def get(self, url):\n        assert url.endswith('/props')\n        return _Response({'default_generation_settings': {'n_ctx': 128}})\n\n\ndef test_live_accounting_uses_server_tokenizer_and_slot(monkeypatch):\n    import minecraft_mod_ai.llama_exact_context as module\n\n    monkeypatch.setattr(module, '_client', lambda _url: _Client())\n    accounting = live_context_accounting(\n        'http://127.0.0.1:8910/v1',\n        {'messages': [{'role': 'user', 'content': 'hello'}], 'max_tokens': 999},\n    )\n    assert accounting.input_tokens == 37\n    assert accounting.context_tokens == 128\n    assert accounting.remaining_tokens == 91\n\n\ndef test_output_allowance_is_only_physical_remaining_context(monkeypatch):\n    import minecraft_mod_ai.llama_exact_context as module\n\n    monkeypatch.setattr(module, '_client', lambda _url: _Client())\n    payload = capacity_safe_payload(\n        'http://127.0.0.1:8910/v1',\n        {'messages': [{'role': 'user', 'content': 'hello'}], 'max_tokens': 999},\n    )\n    assert payload['max_tokens'] == 91\n\n\ndef test_no_arbitrary_output_shrink_when_requested_output_physically_fits(monkeypatch):\n    import minecraft_mod_ai.llama_exact_context as module\n\n    monkeypatch.setattr(module, '_client', lambda _url: _Client())\n    payload = capacity_safe_payload(\n        'http://127.0.0.1:8910/v1',\n        {'messages': [{'role': 'user', 'content': 'hello'}], 'max_tokens': 80},\n    )\n    assert payload['max_tokens'] == 80\n''', encoding='utf-8')
          PY
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Compile and focused tests
        run: |
          python -m py_compile minecraft_mod_ai/llama_exact_context.py minecraft_mod_ai/model_adapters/llama_cpp_adapter.py minecraft_mod_ai/progress_aware_tool_loop.py
          python -m pytest -q tests/test_exact_llama_context_accounting.py tests/test_task_local_small_model_architecture.py
      - name: Commit production and tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add minecraft_mod_ai/llama_exact_context.py minecraft_mod_ai/model_adapters/llama_cpp_adapter.py minecraft_mod_ai/progress_aware_tool_loop.py tests/test_exact_llama_context_accounting.py
          git diff --cached --check
          git commit -m 'refactor: use live llama context accounting'
          git push origin HEAD:main
