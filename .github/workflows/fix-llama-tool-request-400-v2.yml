name: Fix llama tool request 400 v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-llama-tool-request-400-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply and validate canonical native llama request contract
        run: |
          python -m pip install -q -e '.[dev]'
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/fix_llama_tool_request_400_v2.py')
          source = path.read_text(encoding='utf-8')
          old = 'raise_start = source.find("            response.raise_for_status()", response_start)'
          new = 'raise_start = source.find("            response.raise_for_status()", turn_start)'
          if old not in source and new not in source:
              raise SystemExit('repair-script offset anchor not found')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
          python .github/scripts/fix_llama_tool_request_400_v2.py
          python -m compileall -q minecraft_mod_ai tests
          python -m ruff check minecraft_mod_ai/model_adapters/llama_cpp_adapter.py minecraft_mod_ai/llama_server_hardware_policy.py minecraft_mod_ai/llama_stream_efficiency_contract.py minecraft_mod_ai/llama_decode_speed_contract.py tests/test_llama_structured_reasoning_stream.py tests/test_llama_cpp_adapter_request_contract.py --select F,E7,E9
          python -m pytest -q tests/test_llama_structured_reasoning_stream.py tests/test_llama_server_streaming.py tests/test_llama_cpp_adapter_request_contract.py tests/test_game_design_router.py
      - name: Commit repair to main and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-llama-tool-request-400-v2.yml
          rm .github/scripts/fix_llama_tool_request_400_v2.py
          git add minecraft_mod_ai/model_adapters/llama_cpp_adapter.py minecraft_mod_ai/llama_server_hardware_policy.py minecraft_mod_ai/llama_stream_efficiency_contract.py minecraft_mod_ai/llama_decode_speed_contract.py tests/test_llama_structured_reasoning_stream.py tests/test_llama_cpp_adapter_request_contract.py .github/workflows/fix-llama-tool-request-400-v2.yml .github/scripts/fix_llama_tool_request_400_v2.py
          git diff --cached --check
          git commit -m "Unify native llama tool request payload"
          git pull --rebase origin main
          git push origin HEAD:main
