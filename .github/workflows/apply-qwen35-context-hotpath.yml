name: Apply Qwen3.5 8K performance context

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-qwen35-context-hotpath.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply bounded Qwen3.5 context profile
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('minecraft_mod_ai/qwen35_mtp_hotpath_contract.py')
          s = p.read_text(encoding='utf-8')
          old = '''        _set_option(args, ("--batch-size", "-b"), "2048")\n        _set_option(args, ("--ubatch-size", "-ub"), "512")\n\n        # Match the measured full-speed launch instead of inheriting later generic\n'''
          new = '''        _set_option(args, ("--batch-size", "-b"), "2048")\n        _set_option(args, ("--ubatch-size", "-ub"), "512")\n        # The previous measured fast server did not reserve MMM's generic 16K KV\n        # window. Keep the production fast profile bounded by default; structured\n        # planning and custom source evidence are already paginated. Operators can\n        # explicitly raise this when a single request genuinely needs more context.\n        fast_ctx = str(\n            max(4096, min(32768, int(os.environ.get("MMM_QWEN35_MTP_CTX", "8192"))))\n        )\n        _set_option(args, ("--ctx-size", "-c"), fast_ctx)\n\n        # Match the measured full-speed launch instead of inheriting later generic\n'''
          if old not in s:
              raise SystemExit('Qwen hot-path insertion target not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              '''    Context sizing remains host-owned so correctness is not traded for a smaller\n    context window.\n''',
              '''    The Qwen3.5 fast profile uses an 8K KV window by default rather than the\n    generic 16K reservation; MMM_QWEN35_MTP_CTX can explicitly raise it when needed.\n''',
              1,
          )
          compile(s, str(p), 'exec')
          p.write_text(s, encoding='utf-8')

          p = Path('tests/test_qwen35_mtp_hotpath_contract.py')
          s = p.read_text(encoding='utf-8')
          old = '''    # Context remains host-owned; speed restoration must not silently shrink it.\n    assert args[args.index("--ctx-size") + 1] == "16384"\n'''
          new = '''    # Qwen3.5 has a dedicated bounded performance context instead of inheriting the\n    # generic 16K reservation used by other llama profiles.\n    assert args[args.index("--ctx-size") + 1] == "8192"\n'''
          if old not in s:
              raise SystemExit('Qwen hot-path context test target not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python -m pip install -q -e '.[dev]'
          python -m ruff check minecraft_mod_ai/qwen35_mtp_hotpath_contract.py tests/test_qwen35_mtp_hotpath_contract.py --select F,E7,E9
          python -m pytest -q tests/test_qwen35_mtp_hotpath_contract.py tests/test_llama_server_autotune.py
      - name: Commit validated context profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-qwen35-context-hotpath.yml
          git add -A
          git diff --cached --check
          git commit -m "Bound Qwen3.5 MTP context for T4 throughput"
          git pull --rebase origin main
          git push origin HEAD:main
