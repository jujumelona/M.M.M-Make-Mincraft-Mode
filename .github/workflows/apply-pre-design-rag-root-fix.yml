name: Apply pre-design RAG root fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-pre-design-rag-root-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply root-cause patch
        run: python .github/scripts/apply_pre_design_rag_root_fix.py
      - name: Validate root-cause fix
        run: |
          python -m compileall -q minecraft_mod_ai
          python -m ruff check minecraft_mod_ai tests --select F,E7,E9
          python -m pytest -q tests/test_pre_design_rag_root_cause.py tests/test_grounded_rag_runtime_contract.py tests/test_reuse_authoritative_search.py tests/test_reuse_source_read_tool.py tests/test_reuse_research_hardening_contract.py tests/test_semantic_requirement_authority_single_pass.py
      - name: Verify split-brain path is gone
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('minecraft_mod_ai/pre_design_research_pipeline.py').read_text(encoding='utf-8')
          body = text[text.index('def collect_design_research('):]
          assert 'collect_local_project_evidence(' not in body
          assert 'retrieve_domain_evidence if target_frozen else _target_neutral_official_evidence' not in body
          assert 'project_rag._forced_rag_bundle(router, research_brief)' in body
          assert 'catalog/TOC/metadata' in text
          PY
      - name: Commit root-cause fix directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: unify pre-design grounded retrieval ownership"
          git push origin HEAD:main
