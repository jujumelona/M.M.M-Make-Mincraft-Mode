name: Main-only branch cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/main-only-branch-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete-non-main-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/${REPO}/branches?per_page=100" --jq '.[].name')
          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi
            echo "Deleting branch: $branch"
            encoded="$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$branch")"
            gh api --method DELETE "repos/${REPO}/git/refs/heads/${encoded}"
          done

          remaining="$(gh api --paginate "repos/${REPO}/branches?per_page=100" --jq '[.[].name | select(. != "main")] | length' | awk '{s+=$1} END {print s+0}')"
          if [[ "$remaining" != "0" ]]; then
            echo "Non-main branches still remain: $remaining" >&2
            exit 1
          fi
