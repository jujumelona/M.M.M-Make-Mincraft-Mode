name: One Shot Scheduler Root Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-scheduler-root-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -q -e '.[dev]'
      - name: Remove global scheduler safety disable
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('minecraft_mod_ai/generation_concurrency_safety.py')
          text = path.read_text(encoding='utf-8')
          old = '    scheduler_safety._SERIAL_CPU_STAGES = ()\n'
          new = (
              '    # Anchor-collision edges are additive protection. Keep the scheduler\'s\n'
              '    # serial-stage admission as a fail-closed fallback for direct, incomplete,\n'
              '    # or edge-less work graphs; never disable it process-wide.\n'
          )
          if old not in text:
              raise SystemExit('global serial-stage disable not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Verify scheduler and generation concurrency contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_scheduler_claim_install_identity.py \
            tests/test_generation_collision_anchors.py \
            tests/test_source_patch_path_concurrency.py \
            tests/test_artifact_checkpoint_concurrency.py \
            tests/test_artifact_graph_executor.py
          python -m ruff check minecraft_mod_ai/generation_concurrency_safety.py tests/test_scheduler_claim_install_identity.py --select F,E7,E9
      - name: Commit and push scheduler root fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add minecraft_mod_ai/generation_concurrency_safety.py
          git diff --cached --check
          git commit -m 'fix: keep scheduler serial-stage safety enabled'
          git fetch origin main
          git rebase origin/main
          python -m pytest -q tests/test_scheduler_claim_install_identity.py tests/test_generation_collision_anchors.py
          git push origin HEAD:main
