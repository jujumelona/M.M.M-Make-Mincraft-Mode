name: One-time high-confidence dead-code audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-vulture-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run high-confidence Vulture audit
        run: |
          python -m pip install 'vulture==2.14'
          vulture minecraft_mod_ai tools download_resources.py --min-confidence 100 > /tmp/vulture.txt || true
          echo '=== VULTURE_100_BEGIN ==='
          cat /tmp/vulture.txt
          echo '=== VULTURE_100_END ==='
      - name: Remove audit workflow
        run: |
          git rm .github/workflows/one-time-vulture-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove one-time dead-code audit workflow'
          git push origin HEAD:main
