name: Verify final runtime efficiency

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-final-efficiency.yml

permissions:
  contents: write

concurrency:
  group: mmm-verify-final-efficiency
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Reuse already measured MTP baseline for p-min stage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('minecraft_mod_ai/llama_decode_speed_contract.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r'def _probe_p_min\(.*?\n\ndef install\(', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('could not locate _probe_p_min block')
          replacement = '''def _probe_p_min(\n    autotune: Any,\n    binary: str,\n    model_path: str,\n    config: Any,\n    request: Any,\n    selected: Any,\n    *,\n    baseline_probe: Any | None = None,\n):\n    if str(getattr(selected, "spec_type", "none")) != "draft-mtp":\n        return _as_speed_variant(selected), ()\n    candidates = _mtp_p_min_candidates()\n    if len(candidates) <= 1:\n        return _as_speed_variant(selected), ()\n\n    probes: list[Any] = []\n    baseline = baseline_probe if bool(getattr(baseline_probe, "ok", False)) else None\n    if baseline is not None:\n        probes.append(baseline)\n        pending_candidates = tuple(value for value in candidates if value != 0.0)\n    else:\n        pending_candidates = candidates\n\n    bench_request = autotune._compact_benchmark_request(request)\n    probe_tokens = min(\n        int(config.max_new_tokens),\n        autotune._env_int(\n            "MMM_LLAMA_AUTOTUNE_TOKENS", autotune._BENCHMARK_OUTPUT_TOKENS\n        ),\n    )\n    preferred_port = autotune._env_int("MMM_LLAMA_AUTOTUNE_PORT", 18910)\n    for p_min in pending_candidates:\n        base = _as_speed_variant(selected, draft_p_min=p_min)\n        root_name = base.name.split("|pm", 1)[0]\n        variant = replace(\n            base,\n            name=root_name if p_min == 0 else f"{root_name}|pm{p_min:g}",\n        )\n        process = None\n        started = time.perf_counter()\n        try:\n            port = autotune._free_port(preferred_port)\n            process = autotune._start_server(binary, model_path, config, variant, port)\n            url = autotune._wait_ready(process, port)\n            autotune._probe_server(url, bench_request, max_tokens=1, variant=variant)\n            probe = autotune._probe_server(\n                url, bench_request, max_tokens=probe_tokens, variant=variant\n            )\n        except Exception as exc:\n            probe = autotune.ProbeResult(\n                variant=variant,\n                ok=False,\n                output_sha256="",\n                predicted_tokens=0,\n                predicted_tps=0.0,\n                prompt_tps=0.0,\n                elapsed_seconds=time.perf_counter() - started,\n                error=f"{type(exc).__name__}: {exc}",\n            )\n        finally:\n            autotune._stop_server(process)\n        probes.append(probe)\n        if baseline is None and p_min == 0 and bool(getattr(probe, "ok", False)):\n            baseline = probe\n\n    if baseline is None or not bool(getattr(baseline, "ok", False)):\n        return _as_speed_variant(selected), tuple(probes)\n    valid = [\n        probe\n        for probe in probes\n        if bool(getattr(probe, "ok", False))\n        and str(getattr(probe, "output_sha256", ""))\n        == str(getattr(baseline, "output_sha256", ""))\n        and float(getattr(probe, "predicted_tps", 0.0)) > 0\n    ]\n    if not valid:\n        return _as_speed_variant(selected), tuple(probes)\n    best = max(valid, key=lambda probe: float(getattr(probe, "predicted_tps", 0.0)))\n    minimum_gain = autotune._env_float("MMM_LLAMA_STAGE_MIN_GAIN", 1.01)\n    if best is not baseline and _decode_ratio(best, baseline) < max(1.0, minimum_gain):\n        best = baseline\n    return _as_speed_variant(best.variant), tuple(probes)\n\n\ndef install('''
          text = text[:match.start()] + replacement + text[match.end():]

          old = '''            selected, extra_probes = _probe_p_min(\n                autotune, binary, model_path, config, request, decision.selected\n            )\n'''
          new = '''            selected_baseline_probe = next(\n                (\n                    probe\n                    for probe in reversed(decision.probes)\n                    if bool(getattr(probe, "ok", False))\n                    and str(getattr(getattr(probe, "variant", None), "spec_type", "none"))\n                    == str(getattr(decision.selected, "spec_type", "none"))\n                    and int(getattr(getattr(probe, "variant", None), "draft_n_max", 0) or 0)\n                    == int(getattr(decision.selected, "draft_n_max", 0) or 0)\n                    and float(getattr(getattr(probe, "variant", None), "draft_p_min", 0.0) or 0.0)\n                    == 0.0\n                ),\n                None,\n            )\n            selected, extra_probes = _probe_p_min(\n                autotune,\n                binary,\n                model_path,\n                config,\n                request,\n                decision.selected,\n                baseline_probe=selected_baseline_probe,\n            )\n'''
          if text.count(old) != 1:
              raise SystemExit('decode benchmark p-min call shape changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: python -m pip install --prefer-binary -e '.[dev,ui]'
      - name: Static and notebook validation
        run: |
          python -m compileall -q minecraft_mod_ai tests tools download_resources.py
          python tools/validate_colab_notebook.py
          node --check integrations/mineflayer-1201/bridge.mjs
      - name: Full test suite
        run: pytest -q --tb=short
      - name: Commit verified result and remove verifier
        run: |
          set -euo pipefail
          rm .github/workflows/verify-final-efficiency.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reuse MTP baseline and verify final efficiency'
          git pull --rebase origin main
          git push origin HEAD:main
