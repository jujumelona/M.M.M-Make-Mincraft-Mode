name: Apply CI gate repairs

on:
  push:
    branches: [main]
    paths:
      - 'tools/_apply_ci_gate_repairs.py'
      - '.github/workflows/apply-ci-gate-repairs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply deterministic repairs
        run: python tools/_apply_ci_gate_repairs.py
      - name: Verify repaired contracts
        run: |
          python -m compileall -q minecraft_mod_ai tests tools
          python -m ruff check minecraft_mod_ai tests tools --select F,E7,E9
          python -m pytest -q \
            tests/test_acceptance_contract_ssot.py \
            tests/test_coder_mutation_authority_contract.py \
            tests/test_planir_mutation_authority_contract.py \
            tests/test_extended_catalog_validation_gate.py
      - name: Commit production changes and remove temporary machinery
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/evidence_first_planning.py \
                  minecraft_mod_ai/progress_aware_tool_loop.py \
                  minecraft_mod_ai/validator.py \
                  tests/test_extended_catalog_validation_gate.py
          git rm -f tools/_apply_ci_gate_repairs.py tools/_apply_extended_catalog_validation_gate.py .github/workflows/apply-ci-gate-repairs.yml
          git commit -m 'Repair validation and mutation authority gates'
          git pull --rebase origin main
          git push origin HEAD:main
