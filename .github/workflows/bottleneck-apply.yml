name: Bottleneck Apply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bottleneck-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Extract and apply reviewed patch
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/bottleneck-surgery-retry.yml').read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          begin = text.index(start) + len(start)
          end = text.index("\n          PY\n", begin)
          lines = text[begin:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/patch_bottlenecks.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/patch_bottlenecks.py
      - name: Validate bottleneck contracts
        run: |
          python -m compileall -q minecraft_mod_ai tests/test_bottleneck_fast_paths.py
          python -m ruff check minecraft_mod_ai/extended_content_generator.py minecraft_mod_ai/artifact_graph_executor.py minecraft_mod_ai/source_patch.py tests/test_bottleneck_fast_paths.py --select F,E7,E9
          python -m pytest -q \
            tests/test_bottleneck_fast_paths.py \
            tests/test_source_patch_path_concurrency.py \
            tests/test_artifact_graph_executor.py \
            tests/test_artifact_graph_event_driven.py
      - name: Commit only validated source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/extended_content_generator.py minecraft_mod_ai/artifact_graph_executor.py minecraft_mod_ai/source_patch.py tests/test_bottleneck_fast_paths.py
          git commit -m 'Remove remaining hot-path generation bottlenecks'
          git pull --rebase origin main
          git push origin HEAD:main
