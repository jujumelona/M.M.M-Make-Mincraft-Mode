name: Apply Section Compiler Final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-section-compiler-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Reuse verified patch steps from v2
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/patch-section-compiler-v2.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['patch']['steps']
          wanted = {
              'Collapse field calls into one call per section',
              'Align stale tests to current contracts',
          }
          for step in steps:
              if step.get('name') in wanted:
                  subprocess.run(['bash', '-euo', 'pipefail', '-c', step['run']], check=True)
          PY
      - name: Correct final current-contract expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_pre_design_phase_contract.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('    assert "external_mcp" not in providers\n', '', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify optimized compiler
        run: |
          python -m ruff check --fix \
            tests/test_agentic_game_design_text_contract.py \
            tests/test_planner_log24_regressions.py \
            tests/test_pre_design_external_source_acquisition.py \
            tests/test_pre_design_rag_direct_owner.py \
            tests/test_structured_unit_generation_contract.py \
            tests/test_pre_design_phase_contract.py \
            tests/test_worker02_rag_clean_code_regressions.py \
            tests/test_worker03_planner_design_readiness.py \
            --select F,E7,E9
          python -m py_compile minecraft_mod_ai/agentic_research_game_design.py
          python -m ruff check minecraft_mod_ai/agentic_research_game_design.py \
            tests/test_agentic_game_design_text_contract.py \
            tests/test_planner_log24_regressions.py \
            tests/test_pre_design_external_source_acquisition.py \
            tests/test_pre_design_rag_direct_owner.py \
            tests/test_structured_unit_generation_contract.py \
            tests/test_pre_design_phase_contract.py \
            tests/test_worker02_rag_clean_code_regressions.py \
            tests/test_worker03_planner_design_readiness.py \
            --select F,E7,E9
          python -m pytest -q \
            tests/test_agentic_game_design_text_contract.py \
            tests/test_planner_log24_regressions.py \
            tests/test_pre_design_external_source_acquisition.py \
            tests/test_pre_design_rag_direct_owner.py \
            tests/test_structured_unit_generation_contract.py \
            tests/test_pre_design_phase_contract.py \
            tests/test_worker02_rag_clean_code_regressions.py \
            tests/test_worker03_planner_design_readiness.py
      - name: Commit production and tests only
        run: |
          git config user.name "jujumelona"
          git config user.email "qasdaa025@gmail.com"
          git add minecraft_mod_ai/agentic_research_game_design.py tests
          git diff --cached --check
          git commit -m "perf: collapse design generation to one turn per section"
          git pull --rebase origin main
          git push origin main
