name: One-time synchronize packaged skills

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-packaged-skills-once.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install --prefer-binary -e .
      - name: Regenerate canonical Skill artifacts
        run: python tools/package_skills.py
      - name: Commit exact generated artifacts
        shell: bash
        run: |
          git add minecraft_mod_ai/packaged_skills.json plugins/mmm-minecraft-mod-ai/skills/*/SKILL.md
          if git diff --cached --quiet; then
            echo "Skill artifacts are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: synchronize packaged and plugin skills"
          git push origin HEAD:main
