name: One-shot reuse discovery language-neutral repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reuse-discovery-language-neutral-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Remove stale script-specific reuse discovery handling
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/reuse_discovery.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace('import re\n', 'import re\nimport unicodedata\n', 1)
          old_token = '_TOKEN = re.compile(r"[A-Za-z0-9_]+|[\\u3131-\\u318e\\uac00-\\ud7a3]+")'
          if old_token not in text:
              raise SystemExit('script-specific token regex not found')
          text = text.replace(old_token, '_TOKEN = re.compile(r"[\\w]+", re.UNICODE)', 1)

          marker = 'def _search_curseforge(query: str, *, limit: int) -> list[tuple[str, float]]:\n'
          helper = '''def _ascii_search_query(value: str) -> str:\n    """Project arbitrary Unicode text onto the ASCII-only CurseForge query field.\n\n    This is intentionally script-neutral: Unicode normalization may preserve\n    compatible Latin characters, while unsupported scripts fall back at the\n    provider boundary instead of invoking a language-specific transliterator.\n    """\n\n    normalized = unicodedata.normalize("NFKD", str(value or ""))\n    ascii_text = normalized.encode("ascii", "ignore").decode("ascii")\n    ascii_text = re.sub(r"[^A-Za-z0-9\\s_-]+", " ", ascii_text)\n    return re.sub(r"\\s+", " ", ascii_text).strip()\n\n\n'''
          if helper.strip() not in text:
              if marker not in text:
                  raise SystemExit('curseforge marker not found')
              text = text.replace(marker, helper + marker, 1)

          old = '''    from .canonical_capability_ontology import romanize_korean_universal\n\n    clean_query = romanize_korean_universal(query.strip())\n    clean_query = re.sub(r"[^a-zA-Z0-9\\s_-]+", " ", clean_query).strip()\n    clean_query = re.sub(r"\\s+", " ", clean_query)\n'''
          new = '''    clean_query = _ascii_search_query(query)\n'''
          if old not in text:
              raise SystemExit('stale language-specific curseforge path not found')
          text = text.replace(old, new, 1)

          if 'romanize_korean_universal' in text:
              raise SystemExit('stale language-specific transliterator reference remains')
          if '\\u3131' in text or '\\uac00' in text:
              raise SystemExit('script-specific token range remains')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Install tests
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Run reuse discovery and planner regressions
        run: |
          python -m pytest -q \
            tests/test_feature_decomposition_reuse_matrix.py \
            tests/test_reuse_discovery_optional_curseforge.py \
            tests/test_planner_requirement_acceptance_contract.py \
            tests/test_joint_reuse_planner_contract.py \
            tests/test_canonical_capability_ontology_and_reuse_proof.py \
            tests/test_language_independent_semantic_compiler_regression.py
      - name: Commit repair directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft_mod_ai/reuse_discovery.py
          git rm .github/workflows/reuse-discovery-language-neutral-repair.yml
          git commit -m "fix: make reuse discovery query normalization language-neutral"
          git push origin HEAD:main
