name: Optimize predesign retrieval once v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/optimize-predesign-retrieval-once-v2.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply clean retrieval refactor
        env:
          PATCH_SCRIPT_B64: 