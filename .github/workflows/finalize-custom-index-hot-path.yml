name: Finalize custom index hot path

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-custom-index-hot-path.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply and validate custom index hot path
        run: |
          python -m pip install -q -e '.[dev]'
          echo '' | base64 -d | python
          python -m py_compile minecraft_mod_ai/custom_module_generator.py
          python -m ruff check minecraft_mod_ai/custom_module_generator.py --select F,E7,E9
          python -m pytest -q tests/test_project_context_pagination.py tests/test_research_ledger.py
      - name: Commit validated hot path to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/finalize-custom-index-hot-path.yml
          git add minecraft_mod_ai/custom_module_generator.py .github/workflows/finalize-custom-index-hot-path.yml
          git diff --cached --check
          git commit -m "Reuse custom generation project index manifest"
          git pull --rebase origin main
          git push origin HEAD:main
