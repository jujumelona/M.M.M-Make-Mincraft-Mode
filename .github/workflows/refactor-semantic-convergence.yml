name: Refactor semantic convergence

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refactor-semantic-convergence.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply semantic convergence refactor
        run: |
          python -m py_compile .github/scripts/refactor_semantic_convergence.py
          python .github/scripts/refactor_semantic_convergence.py
      - name: Verify semantic convergence contracts
        run: |
          python -m py_compile minecraft_mod_ai/progress_aware_tool_loop.py tests/test_progress_aware_semantic_convergence.py tests/test_progress_aware_verifier_repair_state.py
          python -m pytest -q tests/test_progress_aware_semantic_convergence.py tests/test_progress_aware_verifier_repair_state.py
      - name: Audit numeric termination contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('minecraft_mod_ai/progress_aware_tool_loop.py').read_text(encoding='utf-8')
          forbidden = [
              '_agent_tool_round_limit',
              'state.step_index > round_limit',
              'state.no_progress_streak >= 2',
              'repeated > 1',
              'forced_rag_attempts',
              'after one bounded forced attempt',
          ]
          remaining = [item for item in forbidden if item in text]
          assert not remaining, remaining
          PY
      - name: Commit structural convergence refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/scripts/refactor_semantic_convergence.py
          git rm -f .github/workflows/refactor-semantic-convergence.yml
          git add -A
          git commit -m 'refactor: use semantic convergence for tool loop'
          git pull --rebase origin main
          git push origin HEAD:main
