name: One-shot Current Source Export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-current-source-export.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Restore fail-closed detailed planning contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/planning_state_pipeline.py')
          text = path.read_text(encoding='utf-8')

          old_stalled = '''            _checkpoint_state(checkpoint, pending_state)\n            return pending_state\n'''
          new_stalled = '''            _checkpoint_state(checkpoint, pending_state)\n            raise RuntimeError(\n                "DETAILED_PLAN_RUNTIME_STALLED: detailed planning failed without "\n                "new durable obligation progress"\n            ) from exc\n'''
          if text.count(old_stalled) != 1:
              raise SystemExit(f'expected one stalled-planning return, found {text.count(old_stalled)}')
          text = text.replace(old_stalled, new_stalled, 1)

          old_nonready = '''            if not advanced:\n                return latest_state\n            continue\n'''
          new_nonready = '''            if not advanced:\n                raise RuntimeError(\n                    "DETAILED_PLAN_NOT_READY: detailed planning returned non-ready "\n                    "without new durable obligation progress"\n                )\n            continue\n'''
          if text.count(old_nonready) != 1:
              raise SystemExit(f'expected one non-ready return, found {text.count(old_nonready)}')
          text = text.replace(old_nonready, new_nonready, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev,ui]'
      - name: Verify repaired contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_planning_detail_no_synthetic_fallback.py \
            tests/test_qwen_tool_safe_speculation.py \
            tests/test_template_runtime_ssot.py
          python -m ruff check minecraft_mod_ai/planning_state_pipeline.py tests/test_planning_detail_no_synthetic_fallback.py --select F,E7,E9
      - name: Commit verified source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jujumelona'
          git config user.email 'qasdaa025@gmail.com'
          git add minecraft_mod_ai/planning_state_pipeline.py
          git diff --cached --exit-code && exit 0
          git commit -m 'Restore fail-closed detailed planning termination'
          git push origin HEAD:main
