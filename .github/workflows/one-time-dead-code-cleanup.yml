name: One-time dead-code cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-dead-code-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Ruff
        run: python -m pip install 'ruff==0.16.2'
      - name: Remove statically dead Python code
        run: python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F --fix
      - name: Verify patch integrity
        run: git diff --check
      - name: Commit cleanup and remove maintenance workflow
        run: |
          git rm .github/workflows/one-time-dead-code-cleanup.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove statically dead Python code'
          git push origin HEAD:main
