name: diagnose exhaustive retrieval migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-exhaustive-retrieval.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Apply patch in worktree
        run: |
          python .github/scripts/patch_exhaustive_retrieval.py
          python .github/scripts/canonicalize_exhaustive_retrieval.py
      - name: Capture Ruff diagnostics
        run: |
          python -m ruff check --fix minecraft_mod_ai/github_adaptive_retrieval.py minecraft_mod_ai/research_grounded_rag_contract.py minecraft_mod_ai/pre_design_research_pipeline.py tests/test_exhaustive_retrieval_contract.py > ruff-diagnostics.txt 2>&1 || true
          python -m ruff check minecraft_mod_ai/github_adaptive_retrieval.py minecraft_mod_ai/research_grounded_rag_contract.py minecraft_mod_ai/pre_design_research_pipeline.py tests/test_exhaustive_retrieval_contract.py >> ruff-diagnostics.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: exhaustive-retrieval-diagnostics
          path: ruff-diagnostics.txt
