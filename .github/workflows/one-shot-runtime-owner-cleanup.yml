name: One-shot runtime owner cleanup
# retry: compatibility-hook-restored

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-runtime-owner-cleanup.yml

permissions:
  contents: write

concurrency:
  group: one-shot-runtime-owner-cleanup
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply owner cleanup
        run: python .github/scripts/apply_runtime_owner_cleanup.py
      - name: Compile
        run: python -m compileall -q minecraft_mod_ai tests
      - name: Focused regressions
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_java_toolchain_separation_installation.py \
            tests/test_generation_verifier_resilience.py \
            tests/test_validation_diagnostic_wrapper_trace.py \
            tests/test_platform_live_discovery_mapping_semantics.py \
            tests/test_platform_live_execution_contract.py \
            tests/test_central_research.py \
            tests/test_rag_source_evidence_contract.py \
            tests/test_progress_aware_semantic_convergence.py \
            tests/test_fresh_java_grounding_transition.py \
            2>&1 | tee /tmp/runtime-owner-focused.log
      - name: Diff check
        run: git diff --check
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai tests/test_java_toolchain_separation_installation.py
          if git diff --cached --quiet; then
            echo 'Expected cleanup diff was empty'
            exit 1
          fi
          git commit -m 'Consolidate runtime ownership without rebinding'
          git push origin HEAD:main
      - name: Upload focused log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-owner-focused-log
          path: /tmp/runtime-owner-focused.log
          if-no-files-found: ignore
