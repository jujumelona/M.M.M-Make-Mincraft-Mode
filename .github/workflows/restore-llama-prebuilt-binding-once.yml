name: Restore llama prebuilt binding once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-llama-prebuilt-binding-once.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sync main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Restore published prebuilt binding and context numbers only
        run: |
          set -euo pipefail
          files=(
            tools/colab_runtime_setup.py
            tools/native_llama_bundle.py
            .github/workflows/build-native-llama-cuda.yml
            tests/test_colab_native_llama_prebuilt_integration.py
            tests/test_native_llama_prebuilt_contract.py
          )
          sed -i 's/1d2869c6e54d5003f3927a79efbca0fefa034a6d/4a84b0ad108204f17f3232e26e5c802fb172b492/g' "${files[@]}"
          sed -i 's/native-llama-1d2869c-cuda12.4-max-v3/native-llama-4a84b0a-cuda12.4-max-v3/g' "${files[@]}"
          sed -i 's/llama-1d2869c-cuda12.4-max/llama-4a84b0a-cuda12.4-max/g' "${files[@]}"
          sed -i 's/_DEFAULT_CTX = 8192/_DEFAULT_CTX = 32768/' minecraft_mod_ai/qwen35_mtp_hotpath_contract.py
          sed -i 's/_MAX_CTX = 32768/_MAX_CTX = 2147483647/' minecraft_mod_ai/qwen35_mtp_hotpath_contract.py
          ! grep -n '1d2869c' "${files[@]}"
          grep -F '_DEFAULT_CTX = 32768' minecraft_mod_ai/qwen35_mtp_hotpath_contract.py
          grep -F '_MAX_CTX = 2147483647' minecraft_mod_ai/qwen35_mtp_hotpath_contract.py
          git diff --check
      - name: Test binding
        run: |
          python -m pip install -q pytest
          python -m py_compile tools/colab_runtime_setup.py tools/native_llama_bundle.py minecraft_mod_ai/qwen35_mtp_hotpath_contract.py
          python -m pytest -q tests/test_colab_native_llama_prebuilt_integration.py tests/test_native_llama_prebuilt_contract.py
      - name: Commit repair
        run: |
          set -euo pipefail
          rm -f .github/workflows/restore-llama-prebuilt-binding-once.yml
          git config user.name 'juju-mmm-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Restore published llama prebuilt binding'
          git pull --rebase origin main
          git push origin HEAD:main
