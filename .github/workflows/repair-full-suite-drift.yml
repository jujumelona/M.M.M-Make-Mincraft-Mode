name: Repair full suite drift

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-full-suite-drift.yml
      - .github/scripts/repair_full_suite_drift.py

permissions:
  contents: write

concurrency:
  group: repair-full-suite-drift-main
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Migrate stale tests to live contracts
        run: python .github/scripts/repair_full_suite_drift.py
      - name: Verify targeted migrations
        run: |
          python -m compileall -q minecraft_mod_ai tests tools
          python -m ruff check minecraft_mod_ai tests tools --select F,E7,E9
          python -m pytest -q \
            tests/test_mcp_complete_plan_refs.py \
            tests/test_notebook_registry_policy.py \
            tests/test_performance_final_contract.py \
            tests/test_planner_pagination_safety_contract.py \
            tests/test_platform_target_resolution.py \
            tests/test_production_stack.py \
            tests/test_scheduler_index_fail_closed.py \
            tests/test_scheduler_nested_index_receipts.py \
            tests/test_scheduler_parallel_safety_contract.py \
            tests/test_technology_radar.py
          git diff --check
      - name: Full test suite
        run: python -m pytest -q
      - name: Commit verified migrations and remove repair files
        run: |
          git rm .github/workflows/repair-full-suite-drift.yml .github/scripts/repair_full_suite_drift.py
          git add tests
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Align stale tests with live runtime contracts'
          git pull --rebase origin main
          git push origin HEAD:main
