name: Workflow Lint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/actionlint.yaml"
      - ".github/actionlint.yml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".github/actionlint.yaml"
      - ".github/actionlint.yml"

permissions:
  contents: read

concurrency:
  # Every workflow change must retain its own actionlint result.
  group: workflow-lint-${{ github.sha }}
  cancel-in-progress: false

jobs:
  actionlint:
    name: GitHub Actions static validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate every workflow and embedded shell
        uses: docker://ghcr.io/kjanat/actionlint:1.12.0
        with:
          args: -color
