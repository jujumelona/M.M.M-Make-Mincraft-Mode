name: One Shot Final CI Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-final-ci-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -q -e '.[dev]'
      - name: Apply root-cause fixes
        shell: bash
        run: |
          set -euo pipefail
          echo ' bicudCcgcmVwbGFjZV9tZQ==','base64 placeholder'