name: One Shot Final CI Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-final-ci-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -q -e '.[dev]'
      - name: Apply root-cause fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing repair anchor in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # on_result already persists each successful work unit immediately.  The
          # detached-result loop must update only in-memory assembly state, otherwise every
          # successful criterion is checkpointed twice.
          replace_once(
              'minecraft_mod_ai/planning_state_adaptive_implementation.py',
              '''                    if kind_tag == "artifact":
                          result_receipt = _planning_only_artifact_receipt(result_receipt)
