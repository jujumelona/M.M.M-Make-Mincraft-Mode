name: One Shot Final CI Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-final-ci-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -q -e '.[dev]'
      - name: Apply root-cause fixes
        run: |
          python tools/_final_ci_repair.py
          git diff --check
      - name: Verify focused regressions
        run: |
          python -m pytest -q \
            tests/test_planning_progress_monotone.py \
            tests/test_planning_requirement_pagination.py \
            tests/test_scheduler_parallel_safety_contract.py \
            tests/test_scheduler_claim_install_identity.py \
            tests/test_planning_deadline_hardening.py \
            tests/test_planning_convergence_contract.py
          python -m ruff check \
            minecraft_mod_ai/planning_state_adaptive_implementation.py \
            minecraft_mod_ai/planning_contract_ssot.py \
            tests/test_planning_requirement_pagination.py \
            tests/test_scheduler_parallel_safety_contract.py \
            --select F,E7,E9
      - name: Commit and push verified repair
        run: |
          git config user.name 'jujumelona'
          git config user.email 'qasdaa025@gmail.com'
          git add \
            minecraft_mod_ai/planning_state_adaptive_implementation.py \
            minecraft_mod_ai/planning_contract_ssot.py \
            tests/test_planning_requirement_pagination.py \
            tests/test_scheduler_parallel_safety_contract.py
          git diff --cached --check
          git commit -m 'fix: align semantic pagination and monotone checkpoints'
          git fetch origin main
          git rebase origin/main
          python -m pytest -q \
            tests/test_planning_progress_monotone.py \
            tests/test_planning_requirement_pagination.py \
            tests/test_scheduler_parallel_safety_contract.py \
            tests/test_scheduler_claim_install_identity.py
          git push origin HEAD:main
