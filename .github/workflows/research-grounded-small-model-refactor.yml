name: Research Grounded Small Model Refactor

on:
  push:
    paths:
      - .github/workflows/research-grounded-small-model-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply task-local generation architecture
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/custom_module_generator.py')
          text = path.read_text(encoding='utf-8')

          anchor = '''class CustomModuleGenerationError(RuntimeError):\n    pass\n\n\n'''
          replacement = '''class CustomModuleGenerationError(RuntimeError):\n    pass\n\n\ndef _task_local_module_contract(module: ProductionModule) -> dict[str, Any]:\n    \"\"\"Project one immutable semantic work item into the coder request.\n\n    Evidence-first planning already owns global proposal state.  Generation receives the\n    task-local contract (CodePlan-style per-edit authority) rather than replaying the\n    complete module/proposal configuration into every model turn.\n    \"\"\"\n\n    config = module.config if isinstance(module.config, dict) else {}\n    evidence_task = config.get(\"evidence_task\")\n    if isinstance(evidence_task, dict):\n        return {\n            \"module_id\": module.module_id,\n            \"kind\": module.kind,\n            \"evidence_task\": dict(evidence_task),\n            \"depends_on\": list(module.depends_on),\n            \"required_gates\": list(module.required_gates),\n        }\n    # Compatibility for callers that have not yet been compiled through the\n    # evidence-first semantic work graph.  No fields are silently discarded.\n    return {\n        \"module_id\": module.module_id,\n        \"kind\": module.kind,\n        \"config\": config,\n        \"depends_on\": list(module.depends_on),\n        \"required_gates\": list(module.required_gates),\n    }\n\n\n'''
          if anchor not in text:
              raise SystemExit('custom_module_generator error anchor not found')
          text = text.replace(anchor, replacement, 1)

          old_query = '''        query = json.dumps(\n            {\n                \"module_id\": module.module_id,\n                \"kind\": module.kind,\n                \"config\": module.config,\n                \"depends_on\": module.depends_on,\n            },\n            ensure_ascii=False,\n            sort_keys=True,\n        )\n'''
          new_query = '''        module_contract = _task_local_module_contract(module)\n        query = json.dumps(\n            module_contract,\n            ensure_ascii=False,\n            sort_keys=True,\n        )\n'''
          if old_query not in text:
              raise SystemExit('custom_module_generator query anchor not found')
          text = text.replace(old_query, new_query, 1)

          old_request_module = '''            \"module\": {\n                \"module_id\": module.module_id,\n                \"kind\": module.kind,\n                \"config\": module.config,\n                \"depends_on\": list(module.depends_on),\n                \"required_gates\": list(module.required_gates),\n            },\n'''
          new_request_module = '''            \"module\": module_contract,\n'''
          if text.count(old_request_module) != 1:
              raise SystemExit(f'expected one initial request module block, found {text.count(old_request_module)}')
          text = text.replace(old_request_module, new_request_module, 1)

          old_continuation_module = '''        \"module\": {\n            \"module_id\": module.module_id,\n            \"kind\": module.kind,\n            \"config\": module.config,\n            \"depends_on\": list(module.depends_on),\n            \"required_gates\": list(module.required_gates),\n        },\n'''
          new_continuation_module = '''        \"module\": _task_local_module_contract(module),\n'''
          if text.count(old_continuation_module) != 1:
              raise SystemExit(f'expected one continuation module block, found {text.count(old_continuation_module)}')
          text = text.replace(old_continuation_module, new_continuation_module, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('minecraft_mod_ai/runtime_bootstrap.py')
          text = path.read_text(encoding='utf-8')
          old = '''    # Keep the two non-RAG small-model amplifiers. The retired pre-design code-RAG wrapper\n    # is deliberately not installed.\n    small_model_max_agent_contract._install_tool_retrieval(model_router)\n    small_model_max_agent_contract._install_repair_context(\n'''
          new = '''    # The canonical progress-aware loop already exposes the phase-valid ACI.  Do not\n    # rerank that host-authorized tool frontier through an unrelated heuristic top-k.\n    small_model_max_agent_contract._install_repair_context(\n'''
          if old not in text:
              raise SystemExit('runtime bootstrap tool-retrieval anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_task_local_small_model_architecture.py')
          test.write_text('''from __future__ import annotations\n\nimport inspect\n\nfrom minecraft_mod_ai.complete_spec import ProductionModule\nfrom minecraft_mod_ai.custom_module_generator import _task_local_module_contract\nfrom minecraft_mod_ai import runtime_bootstrap\n\n\ndef test_evidence_task_projection_does_not_replay_unrelated_global_config() -> None:\n    task = {\n        \"task_id\": \"task_example\",\n        \"semantic_outcome\": \"Implement one independently verifiable outcome\",\n        \"requirement_refs\": [\"req_example\"],\n        \"owned_anchors\": [{\"kind\": \"symbol\", \"locator\": \"src/main/java/X.java#X\"}],\n        \"reuse_refs\": [],\n        \"consumes\": [\"root:example\"],\n        \"provides\": [\"example\"],\n        \"depends_on\": [],\n        \"acceptance\": [\"task_example: all declared provides exist\"],\n        \"required_gates\": [\"source\"],\n        \"impact_probes\": [\"changed_symbols\"],\n        \"task_sha256\": \"sha256:\" + \"0\" * 64,\n    }\n    module = ProductionModule(\n        module_id=\"task_example\",\n        kind=\"custom_java\",\n        config={\n            \"implementation\": \"custom\",\n            \"evidence_task\": task,\n            \"unrelated_global_design\": {\"huge\": \"must stay host-side\"},\n        },\n    )\n    projected = _task_local_module_contract(module)\n    assert projected[\"evidence_task\"] == task\n    assert \"config\" not in projected\n    assert \"unrelated_global_design\" not in repr(projected)\n\n\ndef test_runtime_bootstrap_does_not_install_heuristic_tool_top_k() -> None:\n    source = inspect.getsource(runtime_bootstrap._install_post_bootstrap_contracts)\n    assert \"_install_tool_retrieval\" not in source\n    assert \"_install_repair_context\" in source\n''', encoding='utf-8')
          PY
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Compile and focused regression
        run: |
          python -m py_compile minecraft_mod_ai/custom_module_generator.py minecraft_mod_ai/runtime_bootstrap.py
          python -m pytest -q tests/test_task_local_small_model_architecture.py
      - name: Commit production and regression only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add minecraft_mod_ai/custom_module_generator.py minecraft_mod_ai/runtime_bootstrap.py tests/test_task_local_small_model_architecture.py
          git diff --cached --check
          git commit -m 'refactor: make small-model generation task-local'
          git push origin HEAD:main
