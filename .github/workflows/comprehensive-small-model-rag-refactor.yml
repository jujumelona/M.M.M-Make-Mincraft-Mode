name: Comprehensive small-model RAG refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/comprehensive-small-model-rag-refactor.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply comprehensive host-owned RAG refactor
        run: python .github/scripts/comprehensive_small_model_rag_refactor.py
      - name: Validate comprehensive RAG refactor
        run: |
          python -m compileall -q minecraft_mod_ai tests
          python -m pip install -q pytest ruff
          ruff check minecraft_mod_ai/pre_design_rag_corrective.py minecraft_mod_ai/pre_design_rag_support.py minecraft_mod_ai/runtime_stability_contract.py minecraft_mod_ai/structured_output.py minecraft_mod_ai/pre_design_rag_fusion.py tests/test_small_model_rag_host_contract.py --select F,E7,E9
          pytest -q tests/test_small_model_rag_host_contract.py tests/test_agentic_research_game_design.py tests/test_pre_design_rag_corrective.py tests/test_pre_design_rag_fusion.py tests/test_pre_design_rag_support.py
      - name: Commit verified source changes
        run: |
          rm -f .github/workflows/comprehensive-small-model-rag-refactor.yml
          rm -f .github/scripts/comprehensive_small_model_rag_refactor.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: move pre-design RAG orchestration to host'
          git push origin HEAD:main
