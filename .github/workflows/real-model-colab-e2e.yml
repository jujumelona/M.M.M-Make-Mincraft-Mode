name: Real Model Colab E2E

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      profile:
        description: Real model registry profile
        required: false
        default: t4_quality
        type: string
  push:
    branches: [main]
    paths:
      # Running the real pipeline must reflect changes to Colab image, build,
      # and GameTest boundaries, not just model/parser code.
      - 'M.M.M_Make_Mincraft_Mode_Colab.ipynb'
      - 'tools/colab_runtime_setup.py'
      - 'minecraft_mod_ai/runner.py'
      - 'minecraft_mod_ai/runner_parallel_validation_contract.py'
      - 'minecraft_mod_ai/complete_orchestrator.py'
      - 'minecraft_mod_ai/resource_*.py'
      - 'minecraft_mod_ai/model_adapters/**'
      - 'minecraft_mod_ai/model_router.py'
      - 'minecraft_mod_ai/performance_final_contract.py'
      - 'minecraft_mod_ai/model_registry.py'
      - 'minecraft_mod_ai/resource_contracts.py'
      - 'minecraft_mod_ai/production_contract.py'
      - 'minecraft_mod_ai/work_graph_receipt_read.py'
      - 'minecraft_mod_ai/work_graph.py'
      - 'minecraft_mod_ai/llama_*.py'
      - 'minecraft_mod_ai/qwen*.py'
      - 'minecraft_mod_ai/generation_output_budget.py'
      - 'minecraft_mod_ai/model_context_budget.py'
      - 'minecraft_mod_ai/model_output_atomicity_contract.py'
      - 'minecraft_mod_ai/execution_contract_policy.py'
      - 'minecraft_mod_ai/typed_host_generation_contract.py'
      - 'minecraft_mod_ai/generation_target_compile.py'
      - 'minecraft_mod_ai/generation_compile_state.py'
      - 'minecraft_mod_ai/generation_verification_contract.py'
      - 'minecraft_mod_ai/generation_evidence_controller.py'
      - 'minecraft_mod_ai/java_generation_policy.py'
      - 'minecraft_mod_ai/agent_tool_runtime.py'
      - 'minecraft_mod_ai/generation_verifier_resilience.py'
      - 'minecraft_mod_ai/generation_implementation_grounding.py'
      - 'minecraft_mod_ai/colab_run_modes.py'
      - 'minecraft_mod_ai/worksheet_atomic_chunker.py'
      - 'minecraft_mod_ai/planning_detail_slots.py'
      - 'minecraft_mod_ai/planning_detail_template.py'
      - 'minecraft_mod_ai/task_template_catalog.py'
      - 'minecraft_mod_ai/templates/feature/**'
      - 'minecraft_mod_ai/fixed_template_generation.py'
      - 'config/model_registry.yaml'
      - '.github/workflows/real-model-colab-e2e.yml'

permissions:
  contents: read

concurrency:
  group: real-model-colab-e2e-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  colab-real-model-e2e:
    name: Normal planner and DebugToken compile E2E
    runs-on: [self-hosted, linux, x64, t4]
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      # Consent was explicitly approved for the notebook and this test host.
      MMM_ACCEPT_MINECRAFT_EULA: 'true'
      MMM_MODEL_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || 't4_quality' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure runner-local checkpoint directory
        shell: bash
        run: |
          echo "MMM_CHECKPOINT_DIR=$RUNNER_TEMP/mmm-real-model-colab-e2e" >> "$GITHUB_ENV"
          nvidia-smi

      - name: Install native-model runtime
        run: python -m pip install --prefer-binary -e '.[local-model]'

      - name: Verify real local foundation and physical T4 GPU
        timeout-minutes: 3
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          from minecraft_mod_ai.model_registry import ModelRegistry

          profile_name = os.environ["MMM_MODEL_PROFILE"]
          profile = ModelRegistry().load_profile(profile_name)
          foundation = {
              (profile.roles[r].adapter, profile.roles[r].model_id)
              for r in ("planner", "researcher", "coder", "coder_safe")
          }
          if len(foundation) != 1:
              raise RuntimeError("GPU_E2E_FOUNDATION_IDENTITY_MISMATCH")
          adapter, model_id = next(iter(foundation))
          if adapter != "llama_cpp" or not model_id or model_id.startswith("mock/"):
              raise RuntimeError("GPU_E2E_NON_MOCK_LOCAL_MODEL_REQUIRED")
          check = subprocess.run(
              ["nvidia-smi", "--query-gpu=name,memory.total", "--format=csv,noheader"],
              check=True, capture_output=True, text=True, timeout=25,
          )
          devices = [line.strip() for line in check.stdout.splitlines() if line.strip()]
          if not any("T4" in line for line in devices):
              raise RuntimeError(f"GPU_E2E_PHYSICAL_T4_REQUIRED: {devices!r}")
          receipt = {
              "schema_version": "mmm/t4-real-model-preflight-v1",
              "profile": profile_name, "model_id": model_id,
              "adapter": adapter, "devices": devices, "status": "PASS",
          }
          dest = Path("audit/real-model-colab-e2e/GPU_PREFLIGHT.json")
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Run normal planner plus DebugToken real-build E2E
        timeout-minutes: 40
        shell: bash
        run: |
          set -o pipefail
          mkdir -p audit/real-model-colab-e2e
          # Sample the native server's actual CUDA residency while inference runs.
          (
            while :; do
              printf 'SAMPLE %s\n' "$(date -u +%FT%TZ)"
              nvidia-smi --query-compute-apps=pid,process_name,used_gpu_memory --format=csv,noheader,nounits 2>&1 || echo GPU_PROCESS_PROBE_ERROR
              sleep 2
            done
          ) > audit/real-model-colab-e2e/gpu-process-samples.log &
          GPU_WATCH_PID=$!
          trap 'kill "$GPU_WATCH_PID" 2>/dev/null || :' EXIT
          python - <<'PY' 2>&1 | tee audit/real-model-colab-e2e/normal-and-debug-e2e.log
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          from minecraft_mod_ai.api import CompleteModAISession
          from minecraft_mod_ai.colab_run_modes import FULL_MODE, run_plan_dialog
          from minecraft_mod_ai.complete_orchestrator import CompleteExecutionOptions

          prompt = (
              "M.M.M Debug Mode fixture: add one deterministic debug token item and "
              "run the normal implementation/verification pipeline."
          )
          output_root = Path("audit/real-model-colab-e2e").resolve()
          output_root.mkdir(parents=True, exist_ok=True)
          profile = os.environ["MMM_MODEL_PROFILE"]

          session = CompleteModAISession(
              output_root=output_root,
              model_profile=profile,
              fast_mode=False,
              kv_cache_quant="q4_0",
          )

          # First prove the normal planner/source-generation path.
          plan_path = output_root / "proposal.json"
          dialog = run_plan_dialog(
              session=session,
              run_mode=FULL_MODE,
              prompt=prompt,
              plan_path=plan_path,
              debug_mode=False,
              minecraft_version="Auto",
              loader="Auto",
              print_fn=lambda *args, **kwargs: print(*args, **kwargs),
          )
          proposal = dialog.reply.complete_proposal
          proposal.validate()
          if not proposal.modules:
              raise AssertionError('normal real-model planner produced zero implementation modules')
          if proposal.requested_prompt != prompt:
              raise AssertionError(
                  "normal planner changed the authoritative requested_prompt: "
                  f"{proposal.requested_prompt!r}"
              )
          if not plan_path.is_file():
              raise AssertionError("normal Colab path did not persist proposal.json")

          source_options = CompleteExecutionOptions(
              source_only=True,
              run_jdt=False,
              run_gametest=False,
              auto_repair=False,
              run_blockbench=False,
              run_runtime=False,
              run_client=False,
              run_mineflayer=False,
              run_visual_review=False,
              cleanup_runtime=True,
              eula_accepted=False,
          )
          source_result = session.build(
              dialog.reply,
              run_name="real-model-colab-e2e",
              options=source_options,
          )
          if source_result.status != "SOURCE_READY":
              raise AssertionError(
                  f"unexpected source-only status: {source_result.status!r}"
              )
          release_zip = Path(str(source_result.release_zip)).expanduser().resolve()
          if not release_zip.is_file():
              raise AssertionError(f"source-only release is missing: {release_zip}")

          normal_evidence = {
              "schema_version": "mmm/real-model-colab-e2e-v1",
              "status": "PASS",
              "profile": profile,
              "debug_mode": False,
              "prompt": prompt,
              "proposal_hash": proposal.calculate_hash(),
              "module_count": len(proposal.modules),
              "pipeline_status": source_result.status,
              "release_zip": str(release_zip),
              "work_graph_hash": source_result.work_graph_hash,
          }
          (output_root / "REAL_MODEL_COLAB_E2E.json").write_text(
              json.dumps(normal_evidence, ensure_ascii=False, indent=2, sort_keys=True)
              + "\n",
              encoding="utf-8",
          )
          print(json.dumps(normal_evidence, ensure_ascii=False, indent=2, sort_keys=True))

          # Reuse the same live model/session for deterministic fresh-target generation
          # and a real Gradle compile receipt.
          target_rel = "src/main/java/dev/mmm/debugfixture/DebugToken.java"
          debug_root = output_root / "debug-fixture"
          debug_root.mkdir(parents=True, exist_ok=True)
          debug_plan_path = debug_root / "proposal.json"
          debug_dialog = run_plan_dialog(
              session=session,
              run_mode=FULL_MODE,
              prompt="",
              plan_path=debug_plan_path,
              debug_mode=True,
              minecraft_version="1.21.8",
              loader="fabric",
              print_fn=lambda *args, **kwargs: print(*args, **kwargs),
          )
          debug_proposal = debug_dialog.reply.complete_proposal
          debug_proposal.validate()
          if debug_proposal.modules != ():
              raise AssertionError(
                  "host-owned debug fixture must not manufacture production modules: "
                  f"{debug_proposal.modules!r}"
              )
          debug_fixture = debug_proposal.game_design.get("fixture", {})
          if (
              debug_fixture.get("artifact_id") != "debug_token"
              or debug_fixture.get("kind") != "item"
              or debug_fixture.get("deterministic") is not True
          ):
              raise AssertionError(
                  f"debug fixture contract drifted: {debug_fixture!r}"
              )

          build_options = CompleteExecutionOptions(
              source_only=False,
              run_jdt=False,
              run_gametest=True,
              auto_repair=False,
              run_blockbench=False,
              run_runtime=False,
              run_client=False,
              run_mineflayer=False,
              run_visual_review=False,
              cleanup_runtime=True,
              eula_accepted=True,
          )
          debug_result = session.build(
              debug_dialog.reply,
              run_name="real-model-debug-token-compile",
              options=build_options,
          )

          target = Path(debug_result.project_root).resolve() / target_rel
          if not target.is_file():
              raise AssertionError(f"fresh DebugToken target was not created: {target}")

          build = debug_result.build_report or {}
          if build.get("status") != "PASS":
              raise AssertionError(f"DebugToken Gradle build did not pass: {build!r}")
          successful_build_commands = [
              command
              for command in build.get("commands", [])
              if isinstance(command, dict)
              and command.get("name") in {"build", "clean_build", "incremental_build"}
              and command.get("exit_code") == 0
              and command.get("timed_out") is not True
          ]
          if not successful_build_commands:
              raise AssertionError(
                  "DebugToken target_compile has no successful Gradle receipt"
              )
          # A synthetic build PASS cannot stand in for a running Minecraft
          # server GameTest; require structured execution evidence.
          gametest_report = build.get("gametest_report")
          if (
              build.get("gametest_task") not in {"runGameTest", "runGameTestServer"}
              or not isinstance(gametest_report, str)
              or not Path(gametest_report).is_file()
          ):
              raise AssertionError(
                  "Real-model DebugToken run did not execute a passing GameTest: "
                  f"{build!r}"
              )

          jar_validation = debug_result.jar_validation or {}
          if jar_validation.get("status") != "PASS":
              raise AssertionError(f"real-model JAR validation failed: {jar_validation!r}")
          if not debug_result.jar_path or not Path(debug_result.jar_path).is_file():
              raise AssertionError("real-model debug build produced no actual JAR")

          debug_evidence = {
              "schema_version": "mmm/debug-token-real-build-e2e-v1",
              "status": "PASS",
              "profile": profile,
              "debug_mode": True,
              "artifact_id": debug_fixture["artifact_id"],
              "target_path": target_rel,
              "pipeline_status": debug_result.status,
              "build_status": build.get("status"),
              "successful_build_commands": [
                  command.get("name") for command in successful_build_commands
              ],
              "unresolved_gates": list(debug_result.unresolved_gates),
              "release_ready": debug_result.release_ready,
              "work_graph_hash": debug_result.work_graph_hash,
          }
          (debug_root / "DEBUG_TOKEN_REAL_BUILD_E2E.json").write_text(
              json.dumps(debug_evidence, ensure_ascii=False, indent=2, sort_keys=True)
              + "\n",
              encoding="utf-8",
          )
          print(json.dumps(debug_evidence, ensure_ascii=False, indent=2, sort_keys=True))
          PY
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path("audit/real-model-colab-e2e/gpu-process-samples.log").read_text(
              encoding="utf-8", errors="replace"
          )
          # A visible T4 is insufficient: the native llama-server itself must
          # consume GPU memory during the model-generated production run.
          active = []
          for line in log.splitlines():
              if "llama-server" not in line.casefold() and "llama_server" not in line.casefold():
                  continue
              memory = re.search(r",\\s*(\\d+)\\s*$", line)
              if memory and int(memory.group(1)) >= 512:
                  active.append(int(memory.group(1)))
          if not active:
              raise RuntimeError(
                  "GPU_E2E_INFERENCE_OFFLOAD_NOT_PROVEN: no T4 llama-server "
                  "process with >=512 MiB CUDA residency observed"
              )
          print("GPU_E2E_NATIVE_LLAMA_CUDA_RESIDENCY_MIB:", max(active))
          PY

      - name: Upload E2E evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: real-model-colab-e2e-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            audit/real-model-colab-e2e/GPU_PREFLIGHT.json
            audit/real-model-colab-e2e/normal-and-debug-e2e.log
            audit/real-model-colab-e2e/gpu-process-samples.log
            audit/real-model-colab-e2e/REAL_MODEL_COLAB_E2E.json
            audit/real-model-colab-e2e/proposal.json
            audit/real-model-colab-e2e/debug-fixture/**
            audit/real-model-colab-e2e/runs/**/*.zip
