name: Root-cause API grounding validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/root-cause-api-grounding-hotfix-v2.yml

permissions:
  contents: write

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Verify package bootstrap and installed wrapper integrity
        run: |
          python -c "import minecraft_mod_ai"
          python - <<'PY'
          import minecraft_mod_ai
          from minecraft_mod_ai.runtime_wrapper_integrity import verify_installed_wrappers
          report = verify_installed_wrappers()
          assert report.ok, report.issues
          print(f"wrapper integrity checked={report.checked}")
          PY

      - name: Run exact root-cause regressions
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_api_grounding_repair_installation.py \
            tests/test_coder_grounding_repair_regression.py \
            tests/test_agent_tool_verification_terminal.py \
            tests/test_tool_call_admission_contract.py \
            tests/test_colab_debug_fixture_path.py \
            2>&1 | tee /tmp/root-cause-validation.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-cause-api-grounding-validation
          path: /tmp/root-cause-validation.log
          if-no-files-found: ignore

      - name: Remove temporary hotfix workflows and push clean main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/root-cause-api-grounding-hotfix.yml
          git rm .github/workflows/root-cause-api-grounding-hotfix-v2.yml
          git commit -m "Verify API grounding repair and remove temporary workflows"
          git push origin HEAD:main
