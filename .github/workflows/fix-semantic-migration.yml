name: Fix Semantic Migration Matcher

on:
  push:
    paths:
      - .github/workflows/fix-semantic-migration.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Correct matcher and retrigger migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/semantic-termination-migration.yml')
          text = p.read_text(encoding='utf-8')
          old = "r'\\n_DEFAULT_AGENT_TOOL_ROUNDS = 128\\n_MIN_AGENT_TOOL_ROUNDS = 16\\n_MAX_AGENT_TOOL_ROUNDS = 512\\n\\n\\ndef _default_agent_tool_rounds\\(\\) -> int:\\n.*?\\n\\ndef _agent_tool_round_limit\\(\\) -> int:\\n.*?\\n    return max\\(_MIN_AGENT_TOOL_ROUNDS, min\\(_MAX_AGENT_TOOL_ROUNDS, value\\)\\)\\n',"
          new = "r'\\n_DEFAULT_AGENT_TOOL_ROUNDS = 128\\n.*?\\n\\ndef _parallel_read_workers\\(\\) -> int:\\n',"
          if text.count(old) != 1:
              raise SystemExit(f'router matcher anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old2 = "router_text, n = router_pattern.subn('\\n', router_text, count=1)"
          new2 = "router_text, n = router_pattern.subn('\\n\\ndef _parallel_read_workers() -> int:\\n', router_text, count=1)"
          if text.count(old2) != 1:
              raise SystemExit(f'router replacement anchor count={text.count(old2)}')
          text = text.replace(old2, new2, 1)
          p.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/fix-semantic-migration.yml
          git config user.name 'OpenAI semantic migration repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix semantic termination migration matcher'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
