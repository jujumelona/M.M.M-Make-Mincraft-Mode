name: Worker 04 Quality V3

on:
  push:
    branches:
      - main
    paths:
      - .github/worker04-quality-v3.apply

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply Worker 04 patch
        run: python .github/scripts/worker04_quality_patch.py
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Static quality
        run: >-
          ruff check
          minecraft_mod_ai/agent_capability_context.py
          minecraft_mod_ai/agent_roles.py
          minecraft_mod_ai/agent_tool_runtime.py
          minecraft_mod_ai/agent_intent.py
          minecraft_mod_ai/agent_routing_intent_contract.py
          minecraft_mod_ai/external_agent_bridge.py
          minecraft_mod_ai/external_mcp_router.py
          minecraft_mod_ai/model_router.py
          minecraft_mod_ai/progress_aware_tool_loop.py
          minecraft_mod_ai/temporary_skill_contract.py
          tests/test_worker04_quality_contract.py
      - name: Behavioral quality
        run: >-
          python -m pytest -q
          tests/test_worker04_quality_contract.py
          tests/test_agent_capability_context.py
          tests/test_agent_capability_manifest_degradation.py
          tests/test_agent_required_rag_semantic_choice.py
          tests/test_agent_tool_calling.py
          tests/test_external_mcp_router.py
          tests/test_agent_runtime_hot_paths.py
          tests/test_agent_routing_contract.py
      - name: High-confidence dead code
        run: >-
          vulture --min-confidence 90
          minecraft_mod_ai/agent_capability_context.py
          minecraft_mod_ai/agent_roles.py
          minecraft_mod_ai/agent_tool_runtime.py
          minecraft_mod_ai/agent_intent.py
          minecraft_mod_ai/agent_routing_intent_contract.py
          minecraft_mod_ai/external_agent_bridge.py
          minecraft_mod_ai/external_mcp_router.py
          minecraft_mod_ai/model_router.py
          minecraft_mod_ai/progress_aware_tool_loop.py
          minecraft_mod_ai/temporary_skill_contract.py
      - name: Commit tested patch
        run: |
          git diff --check
          git config user.name 'worker-04-bot'
          git config user.email 'worker-04@users.noreply.github.com'
          git add minecraft_mod_ai/agent_capability_context.py minecraft_mod_ai/model_router.py minecraft_mod_ai/temporary_skill_contract.py minecraft_mod_ai/external_mcp_router.py minecraft_mod_ai/external_agent_bridge.py minecraft_mod_ai/agent_tool_runtime.py minecraft_mod_ai/progress_aware_tool_loop.py
          git commit -m 'refactor: harden worker04 routing hot paths'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            ruff check minecraft_mod_ai/agent_capability_context.py minecraft_mod_ai/agent_roles.py minecraft_mod_ai/agent_tool_runtime.py minecraft_mod_ai/agent_intent.py minecraft_mod_ai/agent_routing_intent_contract.py minecraft_mod_ai/external_agent_bridge.py minecraft_mod_ai/external_mcp_router.py minecraft_mod_ai/model_router.py minecraft_mod_ai/progress_aware_tool_loop.py minecraft_mod_ai/temporary_skill_contract.py tests/test_worker04_quality_contract.py
            python -m pytest -q tests/test_worker04_quality_contract.py tests/test_agent_capability_context.py tests/test_agent_capability_manifest_degradation.py tests/test_agent_required_rag_semantic_choice.py tests/test_agent_tool_calling.py tests/test_external_mcp_router.py tests/test_agent_runtime_hot_paths.py tests/test_agent_routing_contract.py
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
