name: MMM execution-ownership regression

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typed-action-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/typed-action-sdk
          key: typed-action-sdk-v1-mc26.2-api0.155.2-loader0.19.3
      - run: python -m pip install -e '.[dev]'
      - name: Prepare verified Minecraft 26.2 SDK
        run: python scripts/prepare_typed_action_sdk.py --cache "$RUNNER_TEMP/typed-action-sdk"
      - name: Compile UI, source callbacks, state and persistence against real SDK
        run: |
          MMM_ACTION_COMPILE_CLASSPATH="$(cat "$RUNNER_TEMP/typed-action-sdk/classpath.txt")"
          export MMM_ACTION_COMPILE_CLASSPATH
          python -m pytest \
            tests/test_typed_ui_action_contract.py \
            tests/test_source_ui_actions_sdk.py \
            tests/test_host_action_occurrence.py \
            tests/test_typed_ui_action_authoring.py \
            tests/test_typed_state_context.py \
            tests/test_production_state_compiler.py \
            tests/test_host_typed_state_access.py
  source-feature-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test and parser dependencies
        run: python -m pip install -e '.[dev]'
      - name: Check Python source compilation
        run: python -m compileall -q minecraft_mod_ai
      - name: Test producer, hook, registration, context and repair contracts
        run: |
          python -m pytest -q \
            tests/test_feature_source_work_graph.py \
            tests/test_source_owned_hook.py \
            tests/test_feature_registration_proof.py \
            tests/test_source_owned_callback_authoring.py \
            tests/test_source_owned_host_integration.py \
            tests/test_host_action_occurrence.py \
            tests/test_source_owned_ui_host.py \
            tests/test_player_action_occurrence_evidence.py \
            tests/test_source_owned_custom_event.py \
            tests/test_source_owned_site_choice.py \
            tests/test_materialized_source_hook_producer.py \
            tests/test_host_callback_body.py \
            tests/test_entity_java_dependency_handoff.py \
            tests/test_construction_java_member_projection_regression.py \
            tests/test_construction_trigger_provenance.py \
            tests/test_construction_trigger_scope.py \
            tests/test_java_rejected_body_identity.py \
            tests/test_feature_execution_route.py \
            tests/test_first_pass_java_source.py
