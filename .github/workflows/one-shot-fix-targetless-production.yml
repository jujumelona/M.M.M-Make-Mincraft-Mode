name: one-shot fix targetless production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-fix-targetless-production.yml

permissions:
  contents: write

concurrency:
  group: one-shot-fix-targetless-production
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch target propagation and targetless Official RAG routing
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement, found {count}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          authored_old = '''def _require_bound_target(design: Mapping[str, Any]) -> dict[str, str]:
    """Return the host-selected platform triple produced by ``_bind_platform``.

    Saved authored designs bypass the normal planning path, so the production module
    must carry the same host-selected target contract that normal production receives.
    Do not infer or default any of these values here: an incomplete binding is an
    upstream contract violation and must fail before an RAG worker is submitted.
    """
    candidates: list[Mapping[str, Any]] = [design]
    for key in ("platform", "target", "toolchain", "build", "existing_project"):
        value = design.get(key)
        if isinstance(value, Mapping):
            candidates.append(value)

    for candidate in candidates:
        if all(candidate.get(key) not in (None, "") for key in _TARGET_KEYS):
            return {key: str(candidate[key]) for key in _TARGET_KEYS}

    raise ValueError(
        "Saved authored production requires the host-selected minecraft_version, "
        "loader and mappings returned by platform binding."
    )
'''
          authored_new = '''def _bound_target(design: Mapping[str, Any]) -> dict[str, str]:
    """Return a complete host-selected platform triple when one exists.

    A completely absent target is valid for target-agnostic production: Official RAG is
    skipped before worker submission while generic research and the rest of production
    continue. A partially populated target is never accepted because that would make the
    selected platform ambiguous.
    """
    candidates: list[Mapping[str, Any]] = [design]
    for key in ("platform", "target", "toolchain", "build", "existing_project"):
        value = design.get(key)
        if isinstance(value, Mapping):
            candidates.append(value)

    saw_partial = False
    for candidate in candidates:
        present = [candidate.get(key) not in (None, "") for key in _TARGET_KEYS]
        if all(present):
            return {key: str(candidate[key]) for key in _TARGET_KEYS}
        saw_partial = saw_partial or any(present)

    if saw_partial:
        raise ValueError(
            "Saved authored production received an incomplete platform target; "
            "minecraft_version, loader and mappings must be provided together."
        )
    return {}
'''
          replace_exact("minecraft_mod_ai/authored_production.py", authored_old, authored_new)
          replace_exact(
              "minecraft_mod_ai/authored_production.py",
              "    target = _require_bound_target(design)\n",
              "    target = _bound_target(design)\n",
          )

          replace_exact(
              "minecraft_mod_ai/central_research.py",
              '''    target = _canonical_platform_target(research_brief.get("_mmm_platform_target"))
    adapter = adapter_for_target(target["minecraft_version"], target["loader"])

    results: list[dict[str, Any]] = []
    unresolved: list[str] = []
''',
              '''    raw_target = research_brief.get("_mmm_platform_target")
    target = _canonical_platform_target(raw_target) if raw_target is not None else None
    adapter = (
        adapter_for_target(target["minecraft_version"], target["loader"])
        if target is not None
        else None
    )

    results: list[dict[str, Any]] = []
    unresolved: list[str] = []
    deferred: list[str] = []
''',
          )
          replace_exact(
              "minecraft_mod_ai/central_research.py",
              '''            continue

        query_results: list[dict[str, Any]] = []
''',
              '''            continue
