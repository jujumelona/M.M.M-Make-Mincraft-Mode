''',
              '''def test_targetless_official_research_skips_official_worker_without_retrieval() -> None:
    brief = normalize_research_brief('Research all routed facts.', {}, _candidate([_domain('official_one', providers=['official_docs'])]))
    calls: list[str] = []

    def fake_retrieve(query: str, **_kwargs: object) -> RetrievalReceipt:
        calls.append(query)
        return _receipt(query)

    evidence = retrieve_domain_evidence(brief, retrieve=fake_retrieve)
    assert calls == []
    assert evidence['target'] is None
    assert evidence['deferred_official_domains'] == ['official_one']
    assert evidence['unresolved_official_domains'] == []
    assert evidence['domains'][0]['strategy'] == 'deferred_until_platform_selected'


def test_targetless_mixed_research_preserves_generic_routes() -> None:
    brief = normalize_research_brief(
        'Research all routed facts.',
        {},
        _candidate([
            _domain('official_one', providers=['official_docs']),
            _domain('generic_one', providers=['github']),
        ]),
    )
    evidence = retrieve_domain_evidence(brief, retrieve=lambda *_args, **_kwargs: (_ for _ in ()).throw(AssertionError('Official retrieval must not run')))
    assert evidence['deferred_official_domains'] == ['official_one']
    assert evidence['domains'][0]['strategy'] == 'deferred_until_platform_selected'
    assert evidence['domains'][1]['strategy'] == 'routed_to_other_providers'


def test_partial_target_still_fails_closed() -> None:
    brief = normalize_research_brief('Research all routed facts.', {}, _candidate([_domain('official_one', providers=['official_docs'])]))
    brief['_mmm_platform_target'] = {'minecraft_version': '1.20.1', 'loader': 'fabric'}
    with pytest.raises(ParallelResearchContractError, match='minecraft_version, loader, and mappings'):
        retrieve_domain_evidence(brief, retrieve=lambda *_args, **_kwargs: _receipt('unused'))
''',
          )

          Path("tests/test_authored_production_optional_target.py").write_text(
              '''from __future__ import annotations

import pytest

from minecraft_mod_ai.authored_production import _bound_target


def test_bound_target_allows_completely_absent_target() -> None:
    assert _bound_target({"authored_plan": {"text": "saved"}}) == {}


def test_bound_target_preserves_complete_target() -> None:
    assert _bound_target({"target": {"minecraft_version": "1.21.1", "loader": "fabric", "mappings": "1.21.1+build.3"}}) == {
        "minecraft_version": "1.21.1",
        "loader": "fabric",
        "mappings": "1.21.1+build.3",
    }


def test_bound_target_rejects_partial_target() -> None:
    with pytest.raises(ValueError, match="incomplete platform target"):
        _bound_target({"target": {"minecraft_version": "1.21.1", "loader": "fabric"}})
''',
              encoding="utf-8",
          )
          PY

          python -m compileall -q minecraft_mod_ai tests/test_central_research.py tests/test_authored_production_optional_target.py
          python -m pytest -q tests/test_central_research.py tests/test_authored_production_optional_target.py
          git diff --check

          rm -f .github/workflows/one-shot-fix-targetless-production.yml
          git add -A
          git commit -m "fix: skip targetless Official RAG without stopping production"
          git push origin HEAD:main
