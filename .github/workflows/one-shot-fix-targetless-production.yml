name: one-shot fix targetless production

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-fix-targetless-production.yml

permissions:
  contents: write

concurrency:
  group: one-shot-fix-targetless-production
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply invariant patch
        shell: bash
        run: python -c "import base64; exec(base64.b64decode(' '))"
      - name: Verify regression slice
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m compileall -q minecraft_mod_ai tests/test_central_research.py tests/test_authored_production_optional_target.py
          python -m pytest -q tests/test_central_research.py tests/test_authored_production_optional_target.py
          git diff --check
      - name: Commit verified fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-fix-targetless-production.yml
          git add -A
          git commit -m "fix: skip targetless Official RAG without stopping production"
          git push origin HEAD:main
