name: verified remaining bottleneck fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mmm-bottleneck-stage3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply verified bottleneck fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {found}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          # Source transplant: bind donor identity in each task payload so no worker
          # depends on loop-variable closure state after deadline/cancellation.
          path = 'minecraft_mod_ai/source_transplant.py'
          replace_exact(
              path,
              '            prepared: list[tuple[Mapping[str, Any], str, str, str, int]] = []\n',
              '            prepared: list[tuple[Mapping[str, Any], str, str, str, int, str, str]] = []\n',
          )
          replace_exact(
              path,
              '                prepared.append((item, path, blob_sha, expected, expected_size))\n',
              '                prepared.append((item, path, blob_sha, expected, expected_size, repository, commit_sha))\n',
          )
          replace_exact(
              path,
              '''            def fetch_and_verify(\n                spec: tuple[Mapping[str, Any], str, str, str, int],\n            ) -> tuple[Mapping[str, Any], str, str, str, bytes]:\n                item, path, blob_sha, expected, expected_size = spec\n                raw = _fetch_blob_bytes(client, repository, blob_sha)\n                if not raw:\n                    raise SourceTransplantError(\n                        f"Pinned donor blob is empty for {repository}@{commit_sha}:{path}."\n                    )\n                actual = "sha256:" + hashlib.sha256(raw).hexdigest()\n                if actual != expected:\n                    raise SourceTransplantError(\n                        f"Pinned donor hash mismatch for {repository}@{commit_sha}:{path}."\n                    )\n                if len(raw) != expected_size:\n                    raise SourceTransplantError(\n                        f"Pinned donor size mismatch for {repository}@{commit_sha}:{path}."\n                    )\n                return item, path, blob_sha, actual, raw\n''',
              '''            def fetch_and_verify(\n                spec: tuple[Mapping[str, Any], str, str, str, int, str, str],\n            ) -> tuple[Mapping[str, Any], str, str, str, bytes]:\n                (\n                    item,\n                    path,\n                    blob_sha,\n                    expected,\n                    expected_size,\n                    repository_name,\n                    pinned_commit,\n                ) = spec\n                raw = _fetch_blob_bytes(client, repository_name, blob_sha)\n                if not raw:\n                    raise SourceTransplantError(\n                        f"Pinned donor blob is empty for {repository_name}@{pinned_commit}:{path}."\n                    )\n                actual = "sha256:" + hashlib.sha256(raw).hexdigest()\n                if actual != expected:\n                    raise SourceTransplantError(\n                        f"Pinned donor hash mismatch for {repository_name}@{pinned_commit}:{path}."\n                    )\n                if len(raw) != expected_size:\n                    raise SourceTransplantError(\n                        f"Pinned donor size mismatch for {repository_name}@{pinned_commit}:{path}."\n                    )\n                return item, path, blob_sha, actual, raw\n''',
          )
          replace_exact(
              path,
              '                    indexed: tuple[int, tuple[Mapping[str, Any], str, str, str, int]],\n',
              '                    indexed: tuple[int, tuple[Mapping[str, Any], str, str, str, int, str, str]],\n',
          )

          # Resource assets: all successful candidates receive the same score. Keep
          # candidate_count as failover budget, but stop after the first validated success.
          path = 'minecraft_mod_ai/resource_asset_production.py'
          replace_exact(
              path,
              '''                scored = []\n                failures = []\n                for index in range(profile.candidate_count):\n                    normalized = candidate_root / asset_id / role / f"normalized-{index:02d}.png"\n                    try:\n                        evidence = generate_candidate(\n                            lambda **kwargs: router.generate_image("image_generator", **kwargs), texture,\n                            prompt=prompt, directory=candidate_root / asset_id / role / f"candidate-{index:02d}",\n                            output=normalized, resolution=profile.preferred_generation_resolution,\n                            fallback=profile.fallback_generation_resolution, seed=_candidate_seed(asset_id, role, index))\n                    except ValueError as exc:\n                        failures.append({"candidate": index, "reason": str(exc)})\n                        continue\n                    scored.append((1000.0, index, normalized, evidence))\n                if not scored:\n                    raise AssetProductionError(f"No candidate satisfies resource contract for {asset_id}:{role}: {failures}")\n                score, index, winner, evidence = min(scored, key=lambda item: (-item[0], item[1]))\n''',
              '''                failures = []\n                selected = None\n                attempts = 0\n                for index in range(profile.candidate_count):\n                    attempts += 1\n                    normalized = candidate_root / asset_id / role / f"normalized-{index:02d}.png"\n                    try:\n                        evidence = generate_candidate(\n                            lambda **kwargs: router.generate_image("image_generator", **kwargs), texture,\n                            prompt=prompt, directory=candidate_root / asset_id / role / f"candidate-{index:02d}",\n                            output=normalized, resolution=profile.preferred_generation_resolution,\n                            fallback=profile.fallback_generation_resolution, seed=_candidate_seed(asset_id, role, index))\n                    except ValueError as exc:\n                        failures.append({"candidate": index, "reason": str(exc)})\n                        continue\n                    selected = (1000.0, index, normalized, evidence)\n                    break\n                if selected is None:\n                    raise AssetProductionError(f"No candidate satisfies resource contract for {asset_id}:{role}: {failures}")\n                score, index, winner, evidence = selected\n''',
          )
          replace_exact(
              path,
              '                    "selected_candidate": index, "selected_score": score, "candidate_count": profile.candidate_count,\n',
              '                    "selected_candidate": index, "selected_score": score, "candidate_count": attempts,\n                    "configured_candidate_count": profile.candidate_count,\n',
          )

          # Low-risk static/lint regressions in the already modified schedulers.
          replace_exact(
              'minecraft_mod_ai/artifact_graph_executor.py',
              '    for producer_id in dependents:\n        dependents[producer_id].sort(key=order.__getitem__)\n',
              '    for dependent_ids in dependents.values():\n        dependent_ids.sort(key=order.__getitem__)\n',
          )
          replace_exact(
              'minecraft_mod_ai/planning_state_implementation.py',
              '        raise ValueError("chunk output must be a JSON object")\n',
              '        raise TypeError("chunk output must be a JSON object")\n',
          )
          replace_exact(
              'minecraft_mod_ai/planning_state_implementation.py',
              '        raise ValueError("DETAILED_PLAN_SECTIONS: host selection must be a requirement mapping")\n',
              '        raise TypeError("DETAILED_PLAN_SECTIONS: host selection must be a requirement mapping")\n',
          )
          replace_exact(
              'minecraft_mod_ai/planning_state_implementation.py',
              '    unknown = set(str(key) for key in required_sections_by_requirement) - set(requirement_ids)\n',
              '    unknown = {str(key) for key in required_sections_by_requirement} - set(requirement_ids)\n',
          )

          # Complete orchestrator: remove duplicate futures import and lambda assignment
          # flagged by the static audit, without changing scheduling behavior.
          path = 'minecraft_mod_ai/complete_orchestrator.py'
          p = Path(path)
          lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
          future_lines = [i for i, line in enumerate(lines) if line.lstrip().startswith('from concurrent.futures import ') and 'ThreadPoolExecutor' in line]
          if len(future_lines) > 1:
              for i in reversed(future_lines[1:]):
                  line = lines[i]
                  names = line.split('import', 1)[1].strip().split(',')
                  names = [name.strip() for name in names if name.strip() != 'ThreadPoolExecutor']
                  lines[i] = (line.split('from concurrent.futures import', 1)[0] + 'from concurrent.futures import ' + ', '.join(names) + '\n') if names else ''
              p.write_text(''.join(lines), encoding='utf-8')
          text = p.read_text(encoding='utf-8')
          old = '''                            review_action = lambda receipt=entity_receipt, module_id=module.module_id: run_named_checkpoint(\n                                ledger,\n                                f'blockbench-review-{module_id}',\n                                stage='validate:blockbench',\n                                input_value={'graph_hash': work_plan.graph_hash, 'entity_receipt': receipt},\n                                action=lambda: self._blockbench_review(receipt, run_root),\n                                encode=lambda value: value,\n                                decode=lambda cached: cached,\n                                validate_cached=lambda cached: Path(str(cached.get('preview', ''))).is_file(),\n                            )\n'''
          if old in text:
              new = '''                            def review_action(receipt=entity_receipt, module_id=module.module_id):\n                                return run_named_checkpoint(\n                                    ledger,\n                                    f'blockbench-review-{module_id}',\n                                    stage='validate:blockbench',\n                                    input_value={'graph_hash': work_plan.graph_hash, 'entity_receipt': receipt},\n                                    action=lambda: self._blockbench_review(receipt, run_root),\n                                    encode=lambda value: value,\n                                    decode=lambda cached: cached,\n                                    validate_cached=lambda cached: Path(str(cached.get('preview', ''))).is_file(),\n                                )\n'''
              text = text.replace(old, new, 1)
          text = text.replace('except ExistingProjectImportError as outer_error:', 'except ExistingProjectImportError:', 1)
          text = text.replace('                        raise outer_error\n', '                        raise\n', 1)
          p.write_text(text, encoding='utf-8')

          # Broad catches here are deliberate boundary/fallback behavior.
          path = 'minecraft_mod_ai/parallel_runtime_contract.py'
          p = Path(path)
          text = p.read_text(encoding='utf-8')
          text = text.replace('        except BaseException as exc:\n            future.set_exception(exc)\n', '        except BaseException as exc:  # noqa: BLE001 - background future boundary\n            future.set_exception(exc)\n', 1)
          text = text.replace('        except Exception:\n            return original_retrieve_graph(\n', '        except Exception:  # noqa: BLE001 - compatibility fallback boundary\n            return original_retrieve_graph(\n', 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Add focused regression contracts
        shell: bash
        run: |
          cat > tests/test_remaining_bottleneck_contract.py <<'PY'
          from __future__ import annotations

          import inspect

          from minecraft_mod_ai import resource_asset_production, source_transplant


          def test_source_transplant_uses_deadline_scheduler_without_blocking_shutdown() -> None:
              source = inspect.getsource(source_transplant.materialize_reuse_plan)
              assert "iter_completed_with_deadlines" in source
              assert "executor.map" not in source
              assert "shutdown(wait=True" not in source
              assert "repository_name" in source
              assert "pinned_commit" in source


          def test_resource_candidates_stop_after_first_validated_success() -> None:
              source = inspect.getsource(resource_asset_production.generate_assets)
              assert "selected = None" in source
              assert "attempts += 1" in source
              assert "configured_candidate_count" in source
              assert "scored.append((1000.0" not in source
              success = source.index("selected = (1000.0, index, normalized, evidence)")
              assert source.index("break", success) > success
          PY
      - name: Compile
        run: python -m compileall -q minecraft_mod_ai tests
      - name: Safe Ruff fixes on touched files
        run: |
          python -m ruff check --fix \
            minecraft_mod_ai/source_transplant.py \
            minecraft_mod_ai/resource_asset_production.py \
            minecraft_mod_ai/artifact_graph_executor.py \
            minecraft_mod_ai/planning_state_implementation.py \
            minecraft_mod_ai/complete_orchestrator.py \
            minecraft_mod_ai/parallel_runtime_contract.py \
            tests/test_remaining_bottleneck_contract.py
      - name: Ruff touched files
        run: |
          python -m ruff check \
            minecraft_mod_ai/source_transplant.py \
            minecraft_mod_ai/resource_asset_production.py \
            minecraft_mod_ai/artifact_graph_executor.py \
            minecraft_mod_ai/planning_state_implementation.py \
            minecraft_mod_ai/complete_orchestrator.py \
            minecraft_mod_ai/parallel_runtime_contract.py \
            tests/test_remaining_bottleneck_contract.py
      - name: Targeted regression suite
        run: |
          python -m pytest -q \
            tests/test_remaining_bottleneck_contract.py \
            tests/test_artifact_graph_executor.py \
            tests/test_livepath_deadline_contract.py \
            tests/test_planning_pipeline_deadlines.py \
            tests/test_pipeline_liveness_regressions.py \
            tests/test_parallel_model_tasks.py
      - name: Locate runtime proof acceptance paths
        shell: bash
        run: |
          echo '=== proof/acceptance candidates ==='
          grep -RniE 'proof|acceptance|runtime[_ -]?valid|passed["'"'"']?[[:space:]]*[:=][[:space:]]*(True|true)|status["'"'"']?[[:space:]]*[:=][[:space:]]*["'"'"']PASS' minecraft_mod_ai \
            --include='*.py' | head -n 400 || true
      - name: Commit verified source fixes
        shell: bash
        run: |
          git config user.name 'mmm-hotfix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add minecraft_mod_ai tests/test_remaining_bottleneck_contract.py
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix: remove remaining execution bottlenecks'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'Concurrent main conflict; refusing unsafe overwrite.'
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
