name: verified remaining bottleneck fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mmm-bottleneck-stage3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dev dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply remaining verified fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_if_present(path: str, old: str, new: str) -> bool:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  return False
              p.write_text(text.replace(old, new, 1), encoding='utf-8')
              return True

          # Bind donor identity into every download task. The deadline scheduler may
          # outlive the lexical iteration on cancellation, so workers must not read
          # mutable loop variables from a closure.
          path = 'minecraft_mod_ai/source_transplant.py'
          replace_if_present(
              path,
              '            prepared: list[tuple[Mapping[str, Any], str, str, str, int]] = []\n',
              '            prepared: list[tuple[Mapping[str, Any], str, str, str, int, str, str]] = []\n',
          )
          replace_if_present(
              path,
              '                prepared.append((item, path, blob_sha, expected, expected_size))\n',
              '                prepared.append((item, path, blob_sha, expected, expected_size, repository, commit_sha))\n',
          )
          replace_if_present(
              path,
              '''            def fetch_and_verify(\n                spec: tuple[Mapping[str, Any], str, str, str, int],\n            ) -> tuple[Mapping[str, Any], str, str, str, bytes]:\n                item, path, blob_sha, expected, expected_size = spec\n                raw = _fetch_blob_bytes(client, repository, blob_sha)\n                if not raw:\n                    raise SourceTransplantError(\n                        f"Pinned donor blob is empty for {repository}@{commit_sha}:{path}."\n                    )\n                actual = "sha256:" + hashlib.sha256(raw).hexdigest()\n                if actual != expected:\n                    raise SourceTransplantError(\n                        f"Pinned donor hash mismatch for {repository}@{commit_sha}:{path}."\n                    )\n                if len(raw) != expected_size:\n                    raise SourceTransplantError(\n                        f"Pinned donor size mismatch for {repository}@{commit_sha}:{path}."\n                    )\n                return item, path, blob_sha, actual, raw\n''',
              '''            def fetch_and_verify(\n                spec: tuple[Mapping[str, Any], str, str, str, int, str, str],\n            ) -> tuple[Mapping[str, Any], str, str, str, bytes]:\n                (\n                    item,\n                    path,\n                    blob_sha,\n                    expected,\n                    expected_size,\n                    repository_name,\n                    pinned_commit,\n                ) = spec\n                raw = _fetch_blob_bytes(client, repository_name, blob_sha)\n                if not raw:\n                    raise SourceTransplantError(\n                        f"Pinned donor blob is empty for {repository_name}@{pinned_commit}:{path}."\n                    )\n                actual = "sha256:" + hashlib.sha256(raw).hexdigest()\n                if actual != expected:\n                    raise SourceTransplantError(\n                        f"Pinned donor hash mismatch for {repository_name}@{pinned_commit}:{path}."\n                    )\n                if len(raw) != expected_size:\n                    raise SourceTransplantError(\n                        f"Pinned donor size mismatch for {repository_name}@{pinned_commit}:{path}."\n                    )\n                return item, path, blob_sha, actual, raw\n''',
          )
          replace_if_present(
              path,
              '                    indexed: tuple[int, tuple[Mapping[str, Any], str, str, str, int]],\n',
              '                    indexed: tuple[int, tuple[Mapping[str, Any], str, str, str, int, str, str]],\n',
          )

          # Deterministic dependency sorting without repeated dict lookup.
          replace_if_present(
              'minecraft_mod_ai/artifact_graph_executor.py',
              '    for producer_id in dependents:\n        dependents[producer_id].sort(key=order.__getitem__)\n',
              '    for dependent_ids in dependents.values():\n        dependent_ids.sort(key=order.__getitem__)\n',
          )

          # Static audit fixes in the live orchestrator. Keep the first global executor
          # import and delete duplicate imports elsewhere in the same module.
          path = 'minecraft_mod_ai/complete_orchestrator.py'
          p = Path(path)
          lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
          seen_executor_import = False
          for i, line in enumerate(lines):
              if line.strip() == 'from concurrent.futures import ThreadPoolExecutor':
                  if seen_executor_import:
                      lines[i] = ''
                  else:
                      seen_executor_import = True
          p.write_text(''.join(lines), encoding='utf-8')
          replace_if_present(
              path,
              '''                            review_action = lambda receipt=entity_receipt, module_id=module.module_id: run_named_checkpoint(\n                                ledger,\n                                f'blockbench-review-{module_id}',\n                                stage='validate:blockbench',\n                                input_value={'graph_hash': work_plan.graph_hash, 'entity_receipt': receipt},\n                                action=lambda: self._blockbench_review(receipt, run_root),\n                                encode=lambda value: value,\n                                decode=lambda cached: cached,\n                                validate_cached=lambda cached: Path(str(cached.get('preview', ''))).is_file(),\n                            )\n''',
              '''                            def review_action(receipt=entity_receipt, module_id=module.module_id):\n                                return run_named_checkpoint(\n                                    ledger,\n                                    f'blockbench-review-{module_id}',\n                                    stage='validate:blockbench',\n                                    input_value={'graph_hash': work_plan.graph_hash, 'entity_receipt': receipt},\n                                    action=lambda: self._blockbench_review(receipt, run_root),\n                                    encode=lambda value: value,\n                                    decode=lambda cached: cached,\n                                    validate_cached=lambda cached: Path(str(cached.get('preview', ''))).is_file(),\n                                )\n''',
          )
          replace_if_present(
              path,
              '        except CompleteProductionError as outer_error:\n',
              '        except CompleteProductionError:\n',
          )
          replace_if_present(path, '                raise outer_error\n', '                raise\n')

          # These broad catches are intentional process/fallback boundaries, not hidden
          # swallowing. Mark them explicitly rather than changing runtime behavior.
          path = 'minecraft_mod_ai/parallel_runtime_contract.py'
          replace_if_present(
              path,
              '        except BaseException as exc:\n            future.set_exception(exc)\n',
              '        except BaseException as exc:  # noqa: BLE001 - future boundary\n            future.set_exception(exc)\n',
          )
          replace_if_present(
              path,
              '        except Exception:\n            return original_retrieve_graph(\n',
              '        except Exception:  # noqa: BLE001 - compatibility fallback\n            return original_retrieve_graph(\n',
          )
          PY
      - name: Add focused regression contract
        shell: bash
        run: |
          cat > tests/test_remaining_bottleneck_contract.py <<'PY'
          from __future__ import annotations

          import inspect

          from minecraft_mod_ai import resource_asset_production, source_transplant


          def test_source_transplant_deadline_workers_bind_donor_identity() -> None:
              source = inspect.getsource(source_transplant.materialize_reuse_plan)
              assert "iter_completed_with_deadlines" in source
              assert "executor.map" not in source
              assert "shutdown(wait=True" not in source
              assert "repository_name" in source
              assert "pinned_commit" in source


          def test_asset_generation_stops_after_first_selectable_candidate() -> None:
              source = inspect.getsource(resource_asset_production.generate_assets)
              assert "selected = None" in source
              assert "attempted_candidate_count" in source
              assert "scored.append((1000.0" not in source
              selected = source.index("selected = (1000.0, index, normalized, evidence)")
              assert source.index("break", selected) > selected
          PY
      - name: Compile
        run: python -m compileall -q minecraft_mod_ai tests
      - name: Ruff changed modules
        run: |
          python -m ruff check --fix \
            minecraft_mod_ai/source_transplant.py \
            minecraft_mod_ai/artifact_graph_executor.py \
            minecraft_mod_ai/complete_orchestrator.py \
            minecraft_mod_ai/parallel_runtime_contract.py \
            tests/test_remaining_bottleneck_contract.py
          python -m ruff check \
            minecraft_mod_ai/source_transplant.py \
            minecraft_mod_ai/artifact_graph_executor.py \
            minecraft_mod_ai/complete_orchestrator.py \
            minecraft_mod_ai/parallel_runtime_contract.py \
            tests/test_remaining_bottleneck_contract.py
      - name: Targeted regressions
        run: |
          python -m pytest -q \
            tests/test_remaining_bottleneck_contract.py \
            tests/test_artifact_graph_executor.py \
            tests/test_livepath_deadline_contract.py \
            tests/test_planning_pipeline_deadlines.py \
            tests/test_pipeline_liveness_regressions.py \
            tests/test_parallel_model_tasks.py
      - name: Locate runtime proof acceptance paths
        shell: bash
        run: |
          echo '=== proof/acceptance candidates ==='
          grep -RniE 'proof|acceptance|runtime[_ -]?valid|passed["'"'"']?[[:space:]]*[:=][[:space:]]*(True|true)|status["'"'"']?[[:space:]]*[:=][[:space:]]*["'"'"']PASS' minecraft_mod_ai \
            --include='*.py' | head -n 500 || true
      - name: Commit verified source fixes
        shell: bash
        run: |
          git config user.name 'mmm-hotfix-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add minecraft_mod_ai tests/test_remaining_bottleneck_contract.py
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix: close remaining execution bottlenecks'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
