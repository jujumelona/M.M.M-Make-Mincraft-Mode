name: One-shot RAG runtime root repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'chore: execute RAG runtime root repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Apply root-cause repair
        run: python .github/scripts/one_shot_rag_runtime_root_repair.py
      - name: Compile repaired Python
        run: python -m compileall -q minecraft_mod_ai tests/test_predesign_rag_runtime_root_cause.py
      - name: Install focused test dependencies
        run: python -m pip install -q pytest httpx pydantic
      - name: Run source-body and pre-design regressions
        run: >-
          pytest -q
          tests/test_predesign_rag_runtime_root_cause.py
          tests/test_agentic_pre_design_rag.py
          tests/test_pre_design_research_pipeline.py
          tests/test_predesign_runtime_composition.py
          tests/test_forced_rag_fusion_quality.py
      - name: Commit and push repaired runtime
        run: |
          git config user.name 'jujumelona'
          git config user.email 'qasdaa025@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: make pre-design RAG source-body exact'
          git push origin HEAD:main
