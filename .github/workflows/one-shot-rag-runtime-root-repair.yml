name: rag-runtime-root-repair

on: [push]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply repair
        run: python .github/scripts/one_shot_rag_runtime_root_repair.py
      - name: Compile
        run: python -m compileall -q minecraft_mod_ai tests/test_predesign_rag_runtime_root_cause.py
      - name: Install test dependencies
        run: python -m pip install -q pytest httpx pydantic
      - name: Focused regressions
        run: pytest -q tests/test_predesign_rag_runtime_root_cause.py tests/test_agentic_pre_design_rag.py tests/test_pre_design_research_pipeline.py tests/test_predesign_runtime_composition.py tests/test_forced_rag_fusion_quality.py
      - name: Commit repair
        run: |
          git config user.name juju
          git config user.email qasdaa025@gmail.com
          git add -A
          git diff --cached --check
          git commit -m "fix: make pre-design RAG source-body exact"
          git push origin HEAD:main
