name: One Shot Planning Frontier Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/repair/planner_frontier_fix.patch.gz.b64'

permissions:
  contents: write

concurrency:
  group: one-shot-planning-frontier-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified planner patch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          base64 -d .github/repair/planner_frontier_fix.patch.gz.b64 | gunzip > /tmp/planner_frontier_fix.patch
          git apply --check /tmp/planner_frontier_fix.patch
          git apply /tmp/planner_frontier_fix.patch
          python -m pip install -q -e . pytest
          python -m pytest -q \
            tests/test_planning_candidate_evidence.py \
            tests/test_planning_mod_discovery.py \
            tests/test_planning_regressions_20260913.py \
            tests/test_planning_search_routing.py
          git rm .github/repair/planner_frontier_fix.patch.gz.b64
          git rm .github/workflows/one-shot-planning-frontier-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            minecraft_mod_ai/planning_state_research.py \
            tests/test_planning_candidate_evidence.py \
            tests/test_planning_mod_discovery.py \
            tests/test_planning_regressions_20260913.py \
            tests/test_planning_search_routing.py
          git diff --cached --check
          git commit -m 'fix: converge planning research on local frontier'
          git push origin HEAD:main
