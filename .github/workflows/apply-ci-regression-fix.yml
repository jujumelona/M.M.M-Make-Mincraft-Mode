name: Apply CI regression fix set

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-ci-regression-fix-main
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply complete rebased regression fix set
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          cat > /tmp/ci-fix.patch.gz.b64 <<'PATCH_B64'
          
          PATCH_B64
          base64 -d /tmp/ci-fix.patch.gz.b64 | gzip -d > /tmp/ci-fix.patch
          echo '8dc69caea5f52335d27c43e6cccefd1f0070a43e62b4539381fca6fc700b389b  /tmp/ci-fix.patch' | sha256sum -c -
          git apply --check /tmp/ci-fix.patch
          git apply --index /tmp/ci-fix.patch
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/platform_runtime_contract.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''    @wraps(original_prepare)\n    def prepare_instance(self: Any, *args: Any, **kwargs: Any):\n'''
          if anchor not in text:
              raise SystemExit('runtime prepare_instance anchor not found')
          start = text.index(anchor) + len(anchor)
          probe = text.index('        _validate_java_command(\n', start)
          segment = text[start:probe]
          if 'instance_name = (' not in segment:
              preflight = '''        # Preserve base fail-fast ordering before probing the selected JDK.\n        instance_name = (\n            str(args[0]) if args else str(kwargs.get("instance_name", ""))\n        )\n        if self._process_running(self.server_process) or self._process_running(\n            self.client_process\n        ):\n            raise module.RuntimePolicyError(\n                "Stop the active disposable runtime before preparing another instance."\n            )\n        if not re.fullmatch(r"[a-z][a-z0-9_-]{1,63}", instance_name):\n            raise module.RuntimePolicyError("Invalid runtime instance name.")\n'''
              text = text[:start] + preflight + text[start:]
              probe += len(preflight)
          segment = text[start:probe]
          if 'self._existing_file(kwargs.get("mod_jar"))' not in segment:
              input_checks = '''        # Missing artifacts are request errors; do not mask them with host-JDK drift.\n        self._existing_file(kwargs.get("mod_jar"))\n        self._existing_file(kwargs.get("server_launcher"))\n'''
              text = text[:probe] + input_checks + text[probe:]
          path.write_text(text, encoding='utf-8')
          PY
          git add minecraft_mod_ai/platform_runtime_contract.py
          git rm --ignore-unmatch .github/workflows/apply-ci-regression-fix.yml
          git diff --cached --check
      - name: Install verification dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Verify all previously failing regression groups
        run: >-
          python -m pytest -q
          tests/test_agentic_pre_design_rag.py
          tests/test_external_agent_bridge_security.py
          tests/test_revision_binding.py
          tests/test_runtime_policy_v2.py
          tests/test_scalable_production.py
          tests/test_evidence_capabilities.py
          tests/test_mcp_technology_tools.py
          tests/test_runtime_manager_concurrency.py
      - run: python .github/scripts/debug_repo_audit.py
      - run: python -m compileall -q minecraft_mod_ai tests tools download_resources.py
      - name: Commit and push verified fix set
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jujumelona'
          git config user.email 'qasdaa025@gmail.com'
          git commit -m 'Fix all version-neutral CI regressions'
          git push origin HEAD:main
