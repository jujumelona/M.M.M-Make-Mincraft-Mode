name: Verify remaining contract repairs

on:
  push:
    branches: [main]
    paths:
      - 'tools/_apply_remaining_contract_repairs.py'
      - '.github/workflows/verify-remaining-contract-repairs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply repairs
        run: python tools/_apply_remaining_contract_repairs.py
      - name: Verify focused contracts
        run: |
          python -m compileall -q minecraft_mod_ai tests/test_coder_mutation_authority_contract.py tests/test_complete_production.py tests/test_contract_schema_catalog.py
          python -m ruff check minecraft_mod_ai/progress_aware_tool_loop.py minecraft_mod_ai/small_model_task_capsule_contract.py minecraft_mod_ai/agent_capability_context.py tests/test_complete_production.py --select F,E7,E9
          python -m pytest -q \
            tests/test_coder_mutation_authority_contract.py \
            tests/test_complete_production.py \
            tests/test_contract_schema_catalog.py \
            tests/test_default_llama_parallelism.py \
            tests/test_acceptance_contract_ssot.py
      - name: Commit validated repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/progress_aware_tool_loop.py minecraft_mod_ai/small_model_task_capsule_contract.py minecraft_mod_ai/agent_capability_context.py tests/test_complete_production.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Close remaining execution contract regressions'
          git pull --rebase origin main
          git push origin HEAD:main
