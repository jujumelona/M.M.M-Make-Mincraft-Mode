name: One Shot Qwen35 Context Sentinel Repair

on:
  push:
    paths:
      - '.github/workflows/one-shot-qwen35-context-sentinel-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]' >/dev/null

      - name: Add regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_qwen35_mtp_context_sentinel.py')
          if path.exists():
              raise SystemExit(f'regression test path already exists: {path}')
          path.write_text('''from __future__ import annotations

import os
from types import SimpleNamespace

import minecraft_mod_ai.qwen35_mtp_hotpath_contract as hotpath


def _config() -> SimpleNamespace:
    return SimpleNamespace(
        extra={
            "runtime_contract": "qwen",
            "decode_hotpath": "t4_mtp",
        }
    )


def _autotune(observed: dict[str, str | None]) -> SimpleNamespace:
    def current(config: object, request: object) -> str:
        del config, request
        observed["server_ctx"] = os.environ.get("MMM_LLAMA_SERVER_CTX")
        observed["active_tuning"] = os.environ.get("MMM_QWEN35_MTP_ACTIVE_TUNING")
        return "ok"

    return SimpleNamespace(
        ensure_tuned_server=current,
        _MANAGED_PROCESS=None,
        _MANAGED_URL="",
    )


def _isolate_runtime(monkeypatch: object) -> None:
    monkeypatch.setattr(hotpath, "_disable_decode_slot_polling", lambda: None)
    monkeypatch.setattr(hotpath, "_reclaim_prior_mmm_server", lambda: None)
    monkeypatch.delenv("MMM_LLAMA_SERVER_CTX", raising=False)
    monkeypatch.delenv("MMM_LLAMA_MTP_WIDTHS", raising=False)
    monkeypatch.delenv("MMM_QWEN35_MTP_ACTIVE_TUNING", raising=False)


def test_unset_context_override_preserves_native_context(monkeypatch: object) -> None:
    _isolate_runtime(monkeypatch)
    monkeypatch.delenv("MMM_QWEN35_MTP_CTX", raising=False)
    observed: dict[str, str | None] = {}
    autotune = _autotune(observed)

    assert hotpath._context_size(_config()) is None
    hotpath.install(autotune)

    assert autotune.ensure_tuned_server(_config(), object()) == "ok"
    assert observed == {"server_ctx": None, "active_tuning": "1"}
    assert "MMM_LLAMA_SERVER_CTX" not in os.environ
    assert "MMM_QWEN35_MTP_ACTIVE_TUNING" not in os.environ


def test_positive_context_override_is_applied_only_for_call(monkeypatch: object) -> None:
    _isolate_runtime(monkeypatch)
    monkeypatch.setenv("MMM_QWEN35_MTP_CTX", "4096")
    observed: dict[str, str | None] = {}
    autotune = _autotune(observed)

    assert hotpath._context_size(_config()) == 4096
    hotpath.install(autotune)

    assert autotune.ensure_tuned_server(_config(), object()) == "ok"
    assert observed == {"server_ctx": "4096", "active_tuning": "1"}
    assert "MMM_LLAMA_SERVER_CTX" not in os.environ
    assert "MMM_QWEN35_MTP_ACTIVE_TUNING" not in os.environ
''')
          PY

      - name: Prove regression test is red before the fix
        run: |
          if python -m pytest -q tests/test_qwen35_mtp_context_sentinel.py; then
            echo 'Regression test unexpectedly passed before the repair.' >&2
            exit 1
          fi

      - name: Repair optional context sentinel guard
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/qwen35_mtp_hotpath_contract.py')
          source = path.read_text()
          old = '        if context_override > 0:\n'
          new = '        if context_override is not None and context_override > 0:\n'
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale context guard, found {count}')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Verify repair
        run: |
          python -m pytest -q tests/test_qwen35_mtp_context_sentinel.py
          python -m ruff check \
            minecraft_mod_ai/qwen35_mtp_hotpath_contract.py \
            tests/test_qwen35_mtp_context_sentinel.py \
            --select F,E7,E9

      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/one-shot-qwen35-context-sentinel-repair.yml
          git add minecraft_mod_ai/qwen35_mtp_hotpath_contract.py tests/test_qwen35_mtp_context_sentinel.py
          git commit -m 'Fix optional Qwen35 MTP context override'
          git pull --rebase origin main
          git push origin HEAD:main
