name: Managed content GameTest runtime proof

on:
  push:
    branches: [main]
    paths:
      - 'minecraft_mod_ai/managed_content_gametest.py'
      - 'minecraft_mod_ai/complete_orchestrator.py'
      - 'minecraft_mod_ai/quality_evidence.py'
      - 'tests/test_managed_content_gametest.py'
      - 'tests/test_quality_execution_preflight.py'
      - 'tests/test_quality_evidence.py'
      - '.github/workflows/managed-content-gametest-runtime.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: managed-content-gametest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install project and test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Syntax compilation
        run: python -m compileall -q minecraft_mod_ai/managed_content_gametest.py minecraft_mod_ai/quality_evidence.py minecraft_mod_ai/complete_orchestrator.py tests/test_managed_content_gametest.py
      - name: Validate live proof and adversarial receipts
        run: python -m pytest -q tests/test_managed_content_gametest.py tests/test_quality_execution_preflight.py tests/test_quality_evidence.py
