name: MCP Stage Bootstrap Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mcp-stage-bootstrap-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generation-stage-bootstrap:
    name: Generation MCP child bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install --prefer-binary -e '.[dev,ui]'
      - name: Verify MCP stage registry and generation child import
        run: python -m pytest -q tests/test_mcp_stage_registry_bootstrap.py
