name: Audit Remaining Arbitrary Runtime Caps

on:
  push:
    paths:
      - .github/workflows/audit-arbitrary-caps.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Evidence and context cap candidates
        run: |
          echo '=== fixed result/slice limits ==='
          git grep -n -E 'limit[[:space:]]*=[[:space:]]*(3|5|6|8|10|20)|limit[[:space:]]*:[[:space:]]*(3|5|6|8|10|20)|\[:(2|3|5|6|8|10|20)\]' -- minecraft_mod_ai || true
          echo '=== byte/context compaction constants ==='
          git grep -n -E 'emergency_budget|budget_bytes|12[[:space:]]*\*[[:space:]]*1024|16[[:space:]]*\*[[:space:]]*1024|40[[:space:]]*\*[[:space:]]*1024|40_000|40000|6144|2048' -- minecraft_mod_ai || true
          echo '=== retry/round/turn bounds ==='
          git grep -n -E 'max_(round|turn|attempt|retry|retries)|MAX_(ROUND|TURN|ATTEMPT|RETRY|RETRIES)|retry_count|no_progress|streak' -- minecraft_mod_ai || true
          echo '=== retrieval/search calls with limits ==='
          git grep -n -E '(search|retrieve|query).*limit|limit.*(search|retrieve|query)' -- minecraft_mod_ai || true
