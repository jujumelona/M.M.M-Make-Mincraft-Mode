name: Audit Runtime Bottleneck Candidates

on:
  workflow_dispatch:
  push:
    paths:
      - minecraft_mod_ai/**/*.py
      - tests/**/*.py
      - .github/workflows/audit-arbitrary-caps.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Enumerate bottleneck and arbitrary-cap candidates
        shell: bash
        run: |
          set +e
          echo '=== numeric slices / fixed result truncation ==='
          git grep -n -E '\[:[0-9]+\]|\[[0-9]+:[0-9]+\]|limit[[:space:]]*=[[:space:]]*[0-9]+|limit[[:space:]]*:[[:space:]]*[0-9]+' -- minecraft_mod_ai || true

          echo '=== fixed MAX constants and literal min/max clamps ==='
          git grep -n -E '_MAX_[A-Z0-9_]+[[:space:]]*=[[:space:]]*[0-9]+|min\([[:space:]]*[0-9]+[[:space:]]*,|min\([^,]+,[[:space:]]*[0-9]+\)|max\([[:space:]]*[0-9]+[[:space:]]*,' -- minecraft_mod_ai || true

          echo '=== environment defaults/clamps that can become runtime caps ==='
          git grep -n -E 'os\.environ\.get\([^)]*,[[:space:]]*["'"'][0-9]+["'"']|_env_(int|float)\([^,]+,[[:space:]]*[0-9]+' -- minecraft_mod_ai || true

          echo '=== retry / round / turn / no-progress bounds ==='
          git grep -n -E 'max_(round|turn|attempt|retry|retries)|MAX_(ROUND|TURN|ATTEMPT|RETRY|RETRIES)|retry_count|no_progress|streak|attempts?[[:space:]]*[<>=]' -- minecraft_mod_ai || true

          echo '=== retrieval/search saturation and provider bounds ==='
          git grep -n -E '(search|retrieve|query|provider|source).*(limit|max_|pages|results)|(limit|max_|pages|results).*(search|retrieve|query|provider|source)' -- minecraft_mod_ai || true

          echo '=== concurrency ownership / executors / worker clamps ==='
          git grep -n -E 'ThreadPoolExecutor|ProcessPoolExecutor|max_workers|deterministic_model_map|router_native_model_parallelism|active_llama_parallelism|CapacityGate|Semaphore' -- minecraft_mod_ai || true

          echo '=== model/research calls that need loop-context review ==='
          git grep -n -E 'generate_fixed_template_text|generate_text\(|router\.generate|research_document_domain|run_bounded_record_template|run_fixed_template' -- minecraft_mod_ai || true

          echo '=== context / prompt / evidence compaction ==='
          git grep -n -E 'max_context|context_budget|budget_bytes|prompt_budget|token_budget|truncate|truncation|compact|excerpt|evidence.*(max|limit)|max.*evidence' -- minecraft_mod_ai || true

          echo '=== checkpoint / resume / validation reuse ==='
          git grep -n -E 'checkpoint|resume|cached_validation|reus(e|able)|fingerprint|already_(done|complete)|completed_nodes' -- minecraft_mod_ai || true
