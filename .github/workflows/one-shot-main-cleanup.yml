name: One-shot main cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[cleanup-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Remove retired contracts and static debris
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          obsolete = [
              'tests/test_complete_planner_batch_parallelism.py',
              'tests/test_complete_planner_research_shards.py',
              'tests/test_complete_planner_technology_sidecar.py',
              'tests/test_complete_planner_scaling.py',
              'tests/test_planner_checkpoint_journal_contract.py',
              'tests/test_planner_fingerprint_efficiency_contract.py',
              'tests/test_planner_pagination_safety_contract.py',
              'tests/test_planner_outline_prompt_contract.py',
              'tests/test_planner_json_runtime_contract.py',
              'tests/test_planner_parser_safety_contract.py',
              'tests/test_production_page_progress_contract.py',
              'tests/test_research_ledger.py',
          ]
          for name in obsolete:
              path = Path(name)
              if path.exists():
                  path.unlink()

          path = Path('minecraft_mod_ai/agentic_optimization_contract.py')
          text = path.read_text(encoding='utf-8')
          start = text.find('def _planner_candidate_count(')
          end = text.find('def _tokens(', start)
          if start >= 0 and end > start:
              text = text[:start] + text[end:]
          text = text.replace('    _install_planner_search(complete_planner_module)\n', '')
          text = text.replace(
              '    * planning: adaptive Best-of-N with deterministic page scoring;\n',
              ''
          )
          text = text.replace(
              'def install(*, complete_planner_module: Any, repair_module: Any, work_graph_module: Any) -> None:',
              'def install(*, complete_planner_module: Any, repair_module: Any, work_graph_module: Any) -> None:'
          )
          text = text.replace(
              '    """Install medium/high-yield agentic search without duplicating existing MMM paths.\n',
              '    """Install repair search and balanced execution without planner mutation.\n'
          )
          path.write_text(text, encoding='utf-8')
          PY

          python -m pip install 'ruff>=0.16,<1'
          python -m ruff check \
            minecraft_mod_ai/agentic_optimization_contract.py \
            minecraft_mod_ai/atomic_evidence_routing_contract.py \
            minecraft_mod_ai/ecosystem_discovery.py \
            minecraft_mod_ai/performance_final_contract.py \
            minecraft_mod_ai/small_model_research_contract.py \
            tests \
            --select F401,F841 --fix --unsafe-fixes || true
          python -m compileall -q minecraft_mod_ai tests tools download_resources.py

      - name: Commit cleanup to latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'mmm-cleanup-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'refactor: [cleanup-applied] remove retired planner contracts'
          git pull --rebase origin main
          git push origin HEAD:main
