name: Runtime Generation Regression

on:
  push:
    branches: [main]
    paths:
      - "minecraft_mod_ai/custom_module_generator.py"
      - "minecraft_mod_ai/authored_production.py"
      - "minecraft_mod_ai/runner.py"
      - "minecraft_mod_ai/complete_orchestrator.py"
      - "minecraft_mod_ai/complete_build_repair.py"
      - "minecraft_mod_ai/final_artifact.py"
      - "tests/test_direct_custom_module_generator.py"
      - "tests/test_authored_direct_lowering.py"
      - "tests/test_complete_final_validation_contract.py"
      - "tests/test_deterministic_debug_full_pipeline_e2e.py"
      - "tests/test_final_artifact_boundaries.py"
      - ".github/workflows/runtime-generation-regression.yml"
  pull_request:
    paths:
      - "minecraft_mod_ai/custom_module_generator.py"
      - "minecraft_mod_ai/authored_production.py"
      - "minecraft_mod_ai/runner.py"
      - "minecraft_mod_ai/complete_orchestrator.py"
      - "minecraft_mod_ai/complete_build_repair.py"
      - "minecraft_mod_ai/final_artifact.py"
      - "tests/test_direct_custom_module_generator.py"
      - "tests/test_authored_direct_lowering.py"
      - "tests/test_complete_final_validation_contract.py"
      - "tests/test_deterministic_debug_full_pipeline_e2e.py"
      - "tests/test_final_artifact_boundaries.py"
      - ".github/workflows/runtime-generation-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-generation-regression:
    name: runtime-regression / ${{ matrix.test_file }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        test_file:
          - tests/test_direct_custom_module_generator.py
          - tests/test_authored_direct_lowering.py
          - tests/test_complete_final_validation_contract.py
          - tests/test_deterministic_debug_full_pipeline_e2e.py
          - tests/test_final_artifact_boundaries.py
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e ".[dev]"
      - name: Run isolated regression cell
        run: python -m pytest "${{ matrix.test_file }}" -q
