name: Apply host-owned coder grounding once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-host-owned-coder-grounding-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Sync current main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Apply exact host-grounding patch
        run: python .github/scripts/apply_host_owned_coder_grounding_once.py
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Compile and lint touched Python
        run: |
          python -m compileall -q minecraft_mod_ai tests
          python -m ruff check minecraft_mod_ai tests --select F,E7,E9
      - name: Verify host-owned coder grounding
        run: >-
          python -m pytest -q
          tests/test_custom_module_host_grounding_contract.py
          tests/test_runtime_bootstrap_clean.py
      - name: Remove one-shot applicator
        run: |
          rm -f .github/scripts/apply_host_owned_coder_grounding_once.py
          rm -f .github/workflows/apply-host-owned-coder-grounding-once.yml
      - name: Commit tested patch to main
        run: |
          git config user.name juju-mmm-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "Enforce host-owned grounding before coder decode"
          git pull --rebase origin main
          git push origin HEAD:main
