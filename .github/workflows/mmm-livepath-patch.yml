name: verified livepath liveness fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mmm-livepath-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply live-path fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {found}: {old[:120]!r}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          # ------------------------------------------------------------------
          # 1. Default tool loop completion is semantic; only an explicit env
          #    override acts as a final safety circuit breaker.
          # ------------------------------------------------------------------
          path = 'minecraft_mod_ai/model_router.py'
          p = Path(path); text = p.read_text(encoding='utf-8')
          old = '''_DEFAULT_AGENT_TOOL_ROUNDS = 128\n_MIN_AGENT_TOOL_ROUNDS = 16\n_MAX_AGENT_TOOL_ROUNDS = 512\n\n\ndef _default_agent_tool_rounds() -> int:\n    raw = os.environ.get("MMM_AGENT_DEFAULT_TOOL_ROUNDS", "").strip()\n    if not raw:\n        return _DEFAULT_AGENT_TOOL_ROUNDS\n    try:\n        value = int(raw)\n    except ValueError:\n        return _DEFAULT_AGENT_TOOL_ROUNDS\n    return max(_MIN_AGENT_TOOL_ROUNDS, min(_MAX_AGENT_TOOL_ROUNDS, value))\n\n\ndef _agent_tool_round_limit() -> int:\n    raw = os.environ.get("MMM_AGENT_TOOL_ROUNDS", "").strip()\n    if not raw:\n        return _default_agent_tool_rounds()\n    try:\n        value = int(raw)\n    except ValueError:\n        return _default_agent_tool_rounds()\n    return value if value > 0 else _default_agent_tool_rounds()\n'''
          new = '''def _agent_tool_round_limit() -> int | None:\n    """Return an explicit operator safety cap, never a semantic completion rule."""\n\n    raw = os.environ.get("MMM_AGENT_TOOL_ROUNDS", "").strip()\n    if not raw:\n        return None\n    try:\n        value = int(raw)\n    except ValueError:\n        return None\n    return value if value > 0 else None\n'''
          if old not in text:
              raise SystemExit('model_router.py: legacy default tool-round cap block not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_exact(
              'minecraft_mod_ai/progress_aware_tool_loop.py',
              '        if state.step_index > round_limit:\n',
              '        if round_limit is not None and state.step_index > round_limit:\n',
          )
          replace_exact(
              'minecraft_mod_ai/progress_aware_tool_loop.py',
              '                    "Agent reached the host tool-round limit before required "\n',
              '                    "Agent reached the operator-configured safety tool-round limit before required "\n',
          )
          replace_exact(
              'minecraft_mod_ai/progress_aware_tool_loop.py',
              '                    "Writable coder reached the host tool-round limit before a "\n',
              '                    "Writable coder reached the operator-configured safety tool-round limit before a "\n',
          )
          replace_exact(
              'minecraft_mod_ai/progress_aware_tool_loop.py',
              '                    f"The host tool-round limit was reached after {round_limit} rounds. "\n',
              '                    f"The operator-configured safety tool-round limit was reached after {round_limit} rounds. "\n',
          )

          # ------------------------------------------------------------------
          # 2. Legacy corrective reader: remove default semantic round cap.
          #    It terminates on verified sufficiency or no unseen query/evidence.
          # ------------------------------------------------------------------
          path = 'minecraft_mod_ai/pre_design_rag_corrective.py'
          p = Path(path); text = p.read_text(encoding='utf-8')
          text = re.sub(
              r'def _corrective_round_limit\(\) -> int:\n(?:    .*\n)+?    return max\(0, min\(value, _MAX_CORRECTIVE_ROUNDS\)\)\n',
              '''def _corrective_round_limit() -> int | None:\n    """Optional operator circuit breaker; semantic convergence owns completion."""\n\n    raw = os.environ.get("MMM_PREDESIGN_CORRECTIVE_ROUNDS", "").strip()\n    if not raw:\n        return None\n    try:\n        value = int(raw)\n    except ValueError:\n        return None\n    return value if value >= 0 else None\n''',
              text,
              count=1,
          )
          p.write_text(text, encoding='utf-8')
          replace_exact(path, '        max_rounds = _corrective_round_limit()\n', '        safety_round_limit = _corrective_round_limit()\n')
          replace_exact(path, '        while round_index <= max_rounds:\n', '        while True:\n')
          replace_exact(path, '                max_rounds=max_rounds,\n', '                safety_round_limit=safety_round_limit,\n')
          replace_exact(
              path,
              '''            if round_index >= max_rounds:\n                fixed_point = "corrective_round_limit_reached"\n                break\n\n            unseen = _correction_queries(\n''',
              '''            if safety_round_limit is not None and round_index >= safety_round_limit:\n                raise RuntimeError(\n                    "PREDESIGN_CORRECTIVE_SAFETY_LIMIT: operator-configured corrective "\n                    f"round limit reached at {safety_round_limit}; semantic convergence was not reached"\n                )\n\n            unseen = _correction_queries(\n''',
          )
          # Later logic already computes `unseen`; if none can be produced, make that
          # explicit convergence rather than spinning until a count threshold.
          marker = '''                except Exception as exc:\n'''
          # no blind insertion here; downstream code's existing no-query branch remains authoritative.

          # ------------------------------------------------------------------
          # 3. Deterministic parallel model map becomes the canonical deadline owner.
          # ------------------------------------------------------------------
          path = 'minecraft_mod_ai/parallel_model_tasks.py'
          p = Path(path); text = p.read_text(encoding='utf-8')
          if 'from .deadline_executor import iter_completed_with_deadlines' not in text:
              text = text.replace(
                  'from concurrent.futures import ThreadPoolExecutor\n',
                  'from .deadline_executor import iter_completed_with_deadlines\n',
                  1,
              )
          pattern = re.compile(
              r'    with ThreadPoolExecutor\(.*?\n(?:.*\n)*?            raise\n',
              re.DOTALL,
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit('parallel_model_tasks.py: executor block not found')
          replacement = '''    positions = {id(item): index for index, item in enumerate(items)}\n    ordered: list[_R | None] = [None] * len(items)\n    token = _MODEL_PARALLEL_DEPTH.set(_MODEL_PARALLEL_DEPTH.get() + 1)\n    try:\n        for item, result in iter_completed_with_deadlines(\n            items,\n            worker,\n            max_workers=workers,\n            stage=thread_name_prefix,\n        ):\n            ordered[positions[id(item)]] = result\n    finally:\n        _MODEL_PARALLEL_DEPTH.reset(token)\n    if any(result is None for result in ordered):\n        raise RuntimeError(f"{thread_name_prefix}: parallel map lost a completed result")\n    return [result for result in ordered if result is not None]\n'''
          text = text[:match.start()] + replacement + text[match.end():]
          p.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # 4. Detailed planning DAG: each active section gets a real work-unit
          #    deadline and executor cleanup never waits for an uncooperative worker.
          # ------------------------------------------------------------------
          path = 'minecraft_mod_ai/planning_state_implementation.py'
          p = Path(path); text = p.read_text(encoding='utf-8')
          if 'planning_work_unit_timeout_seconds' not in text:
              anchor = 'from .model_router import ModelRouter\n'
              if anchor not in text:
                  # tolerate Any-router module layout
                  anchor = 'from .planning_state_contract import'
                  idx = text.find(anchor)
                  if idx < 0: raise SystemExit('planning_state_implementation import anchor missing')
                  text = text[:idx] + 'from .model_concurrency import planning_work_unit_timeout_seconds, run_with_model_execution_deadline\n' + text[idx:]
              else:
                  text = text.replace(anchor, 'from .model_concurrency import planning_work_unit_timeout_seconds, run_with_model_execution_deadline\n' + anchor, 1)
          if 'import time\n' not in text:
              text = text.replace('import ', 'import time\nimport ', 1)
          text = text.replace(
              '    future_to_node: dict[Future[dict[str, Any]], tuple[int, str]] = {}\n    with ThreadPoolExecutor(\n        max_workers=max_workers, thread_name_prefix="planning-detail"\n    ) as pool:\n',
              '    future_to_node: dict[Future[dict[str, Any]], tuple[int, str]] = {}\n    future_deadlines: dict[Future[dict[str, Any]], float] = {}\n    pool = ThreadPoolExecutor(max_workers=max_workers, thread_name_prefix="planning-detail")\n    try:\n',
              1,
          )
          old_submit = '''                future = pool.submit(\n                    copy_context().run,\n                    _compile_worksheet_section,\n                    router,\n                    requirement=job["requirement"],\n                    selected_sections=job["selected_sections"],\n                    section=section,\n                    evidence=job["evidence"],\n                    allowed=job["allowed"],\n                    completed=prerequisite_snapshot,\n                )\n'''
          new_submit = '''                deadline = time.monotonic() + planning_work_unit_timeout_seconds()\n                context_copy = copy_context()\n                future = pool.submit(\n                    context_copy.run,\n                    run_with_model_execution_deadline,\n                    deadline,\n                    _compile_worksheet_section,\n                    router,\n                    requirement=job["requirement"],\n                    selected_sections=job["selected_sections"],\n                    section=section,\n                    evidence=job["evidence"],\n                    allowed=job["allowed"],\n                    completed=prerequisite_snapshot,\n                )\n                future_deadlines[future] = deadline\n'''
          if old_submit not in text: raise SystemExit('planning_state_implementation submit block missing')
          text = text.replace(old_submit, new_submit, 1)
          text = text.replace(
              '            done, _ = wait(tuple(future_to_node), return_when=FIRST_COMPLETED)\n',
              '''            nearest_deadline = min(future_deadlines[future] for future in future_to_node)\n            timeout = max(0.0, nearest_deadline - time.monotonic())\n            done, _ = wait(\n                tuple(future_to_node), timeout=timeout, return_when=FIRST_COMPLETED\n            )\n            if not done:\n                expired = [\n                    future for future in future_to_node\n                    if time.monotonic() >= future_deadlines[future]\n                ]\n                for future in expired:\n                    future.cancel()\n                nodes = [future_to_node[future] for future in expired]\n                raise TimeoutError(f"DETAILED_PLAN_SECTION_TIMEOUT: {nodes}")\n''',
              1,
          )
          text = text.replace(
              '                job_index, section = future_to_node.pop(future)\n                job = jobs[job_index]\n                result = future.result()\n',
              '                job_index, section = future_to_node.pop(future)\n                future_deadlines.pop(future, None)\n                job = jobs[job_index]\n                result = future.result(timeout=0)\n',
              1,
          )
          # insert finally before compiled section, matching indentation after loop body
          needle = '\n    compiled: list[dict[str, Any]] = []\n'
          if needle not in text: raise SystemExit('planning_state_implementation compiled marker missing')
          text = text.replace(
              needle,
              '''\n    finally:\n        for future in future_to_node:\n            future.cancel()\n        pool.shutdown(wait=False, cancel_futures=True)\n\n    compiled: list[dict[str, Any]] = []\n''',
              1,
          )
          p.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # 5. Artifact DAG: bounded dynamic scheduler with nonblocking shutdown.
          # ------------------------------------------------------------------
          path = 'minecraft_mod_ai/artifact_graph_executor.py'
          p = Path(path); text = p.read_text(encoding='utf-8')
          if 'import time\n' not in text:
              text = text.replace('import heapq\n', 'import heapq\nimport time\n', 1)
          if 'planning_work_unit_timeout_seconds' not in text:
              anchor = 'from .artifact_job import ArtifactJob\n'
              if anchor not in text: raise SystemExit('artifact import anchor missing')
              text = text.replace(anchor, anchor + 'from .model_concurrency import planning_work_unit_timeout_seconds, run_with_model_execution_deadline\n', 1)
          text = text.replace(
              '    generation_futures: dict[Future[dict[str, Any]], ArtifactJob] = {}\n    validation_futures: dict[Future[None], tuple[ArtifactJob, dict[str, Any]]] = {}\n',
              '    generation_futures: dict[Future[dict[str, Any]], ArtifactJob] = {}\n    validation_futures: dict[Future[None], tuple[ArtifactJob, dict[str, Any]]] = {}\n    future_deadlines: dict[Future[Any], float] = {}\n',
              1,
          )
          old = '''            generation_futures[\n                pool.submit(\n                    _execute_one,\n                    job,\n                    context=context,\n                    router=router,\n                    registry=registry,\n                    base_dir=base_dir,\n                )\n            ] = job\n'''
          new = '''            deadline = time.monotonic() + planning_work_unit_timeout_seconds()\n            future = pool.submit(\n                run_with_model_execution_deadline,\n                deadline,\n                _execute_one,\n                job,\n                context=context,\n                router=router,\n                registry=registry,\n                base_dir=base_dir,\n            )\n            generation_futures[future] = job\n            future_deadlines[future] = deadline\n'''
          if old not in text: raise SystemExit('artifact generation submit block missing')
          text = text.replace(old, new, 1)
          text = text.replace(
              '''    with ThreadPoolExecutor(\n        max_workers=generation_workers,\n        thread_name_prefix="mmm-artifact-generate",\n    ) as generation_pool, ThreadPoolExecutor(\n        max_workers=validation_workers,\n        thread_name_prefix="mmm-artifact-validate",\n    ) as validation_pool:\n        submit_ready(generation_pool)\n        try:\n''',
              '''    generation_pool = ThreadPoolExecutor(\n        max_workers=generation_workers, thread_name_prefix="mmm-artifact-generate"\n    )\n    validation_pool = ThreadPoolExecutor(\n        max_workers=validation_workers, thread_name_prefix="mmm-artifact-validate"\n    )\n    try:\n        submit_ready(generation_pool)\n''',
              1,
          )
          text = text.replace(
              '                done, _ = wait(active, return_when=FIRST_COMPLETED)\n',
              '''                nearest_deadline = min(future_deadlines[future] for future in active)\n                timeout = max(0.0, nearest_deadline - time.monotonic())\n                done, _ = wait(active, timeout=timeout, return_when=FIRST_COMPLETED)\n                if not done:\n                    expired = [future for future in active if time.monotonic() >= future_deadlines[future]]\n                    for future in expired:\n                        future.cancel()\n                    owners = [\n                        generation_futures[future].job_id\n                        if future in generation_futures else validation_futures[future][0].job_id\n                        for future in expired\n                    ]\n                    raise ArtifactGraphError(f"ARTIFACT_GRAPH_WORK_TIMEOUT: {owners}")\n''',
              1,
          )
          text = text.replace(
              '                        job = generation_futures.pop(future)\n                        receipt = future.result()\n',
              '                        job = generation_futures.pop(future)\n                        future_deadlines.pop(future, None)\n                        receipt = future.result(timeout=0)\n',
              1,
          )
          text = text.replace(
              '''                        validation_future = validation_pool.submit(\n                            _validate_completed_job,\n                            job,\n                            receipt,\n                            context=context,\n                            base_dir=base_dir,\n                        )\n                        validation_futures[validation_future] = (job, receipt)\n''',
              '''                        validation_deadline = time.monotonic() + planning_work_unit_timeout_seconds()\n                        validation_future = validation_pool.submit(\n                            run_with_model_execution_deadline,\n                            validation_deadline,\n                            _validate_completed_job,\n                            job,\n                            receipt,\n                            context=context,\n                            base_dir=base_dir,\n                        )\n                        validation_futures[validation_future] = (job, receipt)\n                        future_deadlines[validation_future] = validation_deadline\n''',
              1,
          )
          text = text.replace(
              '                        job, receipt = validation_futures.pop(future)\n                        future.result()\n',
              '                        job, receipt = validation_futures.pop(future)\n                        future_deadlines.pop(future, None)\n                        future.result(timeout=0)\n',
              1,
          )
          # normalize the existing except/finally tail: replace context-manager cleanup if present.
          # Inject nonblocking shutdown at the function's existing cancellation finally block.
          if 'generation_pool.shutdown(wait=False, cancel_futures=True)' not in text:
              marker = '            for future in validation_futures:\n                future.cancel()\n'
              if marker not in text:
                  raise SystemExit('artifact graph cancellation marker missing')
              text = text.replace(
                  marker,
                  marker + '            generation_pool.shutdown(wait=False, cancel_futures=True)\n            validation_pool.shutdown(wait=False, cancel_futures=True)\n',
                  1,
              )
          p.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # 6. Source transplant downloads: canonical deadline executor, no wait=True.
          # ------------------------------------------------------------------
          path = 'minecraft_mod_ai/source_transplant.py'
          p = Path(path); text = p.read_text(encoding='utf-8')
          if 'from .deadline_executor import iter_completed_with_deadlines' not in text:
              # append beside internal imports; safe top-level import location before definitions
              anchor = 'from concurrent.futures import ThreadPoolExecutor\n'
              if anchor in text:
                  text = text.replace(anchor, '', 1)
              insert = 'from .deadline_executor import iter_completed_with_deadlines\n'
              # after typing import is safe
              m = re.search(r'from typing import .*\n', text)
              if not m: raise SystemExit('source_transplant typing import anchor missing')
              text = text[:m.end()] + insert + text[m.end():]
          # Remove shared executor construction/finally cleanup and use bounded map per donor.
          executor_block = '''    download_workers = _materialization_download_workers()\n    executor = (\n        ThreadPoolExecutor(\n            max_workers=download_workers,\n            thread_name_prefix="source-transplant-download",\n        )\n        if download_workers > 1\n        else None\n    )\n    receipts: list[dict[str, Any]] = []\n    try:\n'''
          if executor_block not in text: raise SystemExit('source_transplant executor block missing')
          text = text.replace(
              executor_block,
              '    download_workers = _materialization_download_workers()\n    receipts: list[dict[str, Any]] = []\n    try:\n',
              1,
          )
          text = text.replace(
              '''            if executor is None:\n                fetched = [fetch_and_verify(spec) for spec in prepared]\n            else:\n                fetched = list(executor.map(fetch_and_verify, prepared))\n''',
              '''            if download_workers <= 1:\n                fetched = [fetch_and_verify(spec) for spec in prepared]\n            else:\n                positions = {id(spec): index for index, spec in enumerate(prepared)}\n                ordered_fetched: list[tuple[Mapping[str, Any], str, str, str, bytes] | None] = [None] * len(prepared)\n                for spec, result in iter_completed_with_deadlines(\n                    prepared,\n                    fetch_and_verify,\n                    max_workers=download_workers,\n                    stage="source_transplant_download",\n                ):\n                    ordered_fetched[positions[id(spec)]] = result\n                if any(result is None for result in ordered_fetched):\n                    raise SourceTransplantError("Source transplant download lost a donor result.")\n                fetched = [result for result in ordered_fetched if result is not None]\n''',
              1,
          )
          text = text.replace(
              '''    finally:\n        if executor is not None:\n            executor.shutdown(wait=True, cancel_futures=True)\n        client.close()\n''',
              '''    finally:\n        client.close()\n''',
              1,
          )
          p.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # 7. Asset candidates: generate multiples only where score discriminates.
          # ------------------------------------------------------------------
          path = 'minecraft_mod_ai/resource_asset_production.py'
          replace_exact(
              path,
              '''                scored = []\n                failures = []\n                for index in range(profile.candidate_count):\n''',
              '''                scored = []\n                failures = []\n                effective_candidate_count = (\n                    profile.candidate_count if texture["topology"] == "seamless_tile" else 1\n                )\n                for index in range(effective_candidate_count):\n''',
          )
          replace_exact(
              path,
              '                    scored.append((1000.0, index, normalized, evidence))\n',
              '                    scored.append((_prepare(texture, normalized, normalized), index, normalized, evidence))\n',
          )
          replace_exact(
              path,
              '                    "selected_candidate": index, "selected_score": score, "candidate_count": profile.candidate_count,\n',
              '                    "selected_candidate": index, "selected_score": score, "candidate_count": effective_candidate_count,\n                    "configured_candidate_count": profile.candidate_count,\n',
          )

          # ------------------------------------------------------------------
          # 8. Source patch commit pool: bound completion wait. File commits are local,
          #    but a stuck filesystem operation must not pin rollback forever.
          # ------------------------------------------------------------------
          path = 'minecraft_mod_ai/source_patch.py'
          p = Path(path); text = p.read_text(encoding='utf-8')
          if 'planning_work_unit_timeout_seconds' not in text:
              anchor = 'from concurrent.futures import '
              idx = text.find(anchor)
              line_end = text.find('\n', idx)
              if idx < 0: raise SystemExit('source_patch future import anchor missing')
              text = text[:line_end+1] + 'from .model_concurrency import planning_work_unit_timeout_seconds\n' + text[line_end+1:]
          text = text.replace(
              '            for future in as_completed(futures):\n',
              '            for future in as_completed(futures, timeout=planning_work_unit_timeout_seconds()):\n',
              1,
          )
          p.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # 9. Foundational parallel runtime helper and prefetched retrieval futures.
          # ------------------------------------------------------------------
          path = 'minecraft_mod_ai/parallel_runtime_contract.py'
          p = Path(path); text = p.read_text(encoding='utf-8')
          if 'from .deadline_executor import iter_completed_with_deadlines' not in text:
              m = re.search(r'from typing import .*\n', text)
              if not m: raise SystemExit('parallel_runtime_contract typing anchor missing')
              text = text[:m.end()] + 'from .deadline_executor import iter_completed_with_deadlines\nfrom .model_concurrency import planning_work_unit_timeout_seconds\n' + text[m.end():]
          old_map = '''    with ThreadPoolExecutor(\n        max_workers=min(workers, len(items)),\n        thread_name_prefix="mmm_parallel_io",\n    ) as pool:\n        futures = [pool.submit(function, item) for item in items]\n        return [future.result() for future in futures]\n'''
          new_map = '''    positions = {id(item): index for index, item in enumerate(items)}\n    ordered: list[_R | None] = [None] * len(items)\n    for item, result in iter_completed_with_deadlines(\n        items,\n        function,\n        max_workers=min(workers, len(items)),\n        stage="parallel_runtime_io",\n    ):\n        ordered[positions[id(item)]] = result\n    if any(result is None for result in ordered):\n        raise RuntimeError("parallel runtime map lost a completed result")\n    return [result for result in ordered if result is not None]\n'''
          if old_map not in text: raise SystemExit('parallel_runtime ordered map block missing')
          text = text.replace(old_map, new_map, 1)
          text = text.replace('    return future.result()\n', '    return future.result(timeout=planning_work_unit_timeout_seconds())\n', 1)
          text = text.replace('            return future.result()\n', '            return future.result(timeout=planning_work_unit_timeout_seconds())\n', 1)
          text = text.replace('            receipt = self._submit(query, limit).result()\n', '            receipt = self._submit(query, limit).result(timeout=planning_work_unit_timeout_seconds())\n', 1)
          p.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # Tests: semantic cap, liveness source invariants, and asset candidate policy.
          # ------------------------------------------------------------------
          Path('tests/test_livepath_liveness_contract.py').write_text('''from __future__ import annotations\n\nimport inspect\nimport os\n\nfrom minecraft_mod_ai import model_router\nfrom minecraft_mod_ai import artifact_graph_executor\nfrom minecraft_mod_ai import planning_state_implementation\nfrom minecraft_mod_ai import source_transplant\nfrom minecraft_mod_ai import resource_asset_production\n\n\ndef test_agent_tool_round_limit_is_opt_in(monkeypatch):\n    monkeypatch.delenv("MMM_AGENT_TOOL_ROUNDS", raising=False)\n    assert model_router._agent_tool_round_limit() is None\n    monkeypatch.setenv("MMM_AGENT_TOOL_ROUNDS", "7")\n    assert model_router._agent_tool_round_limit() == 7\n\n\ndef test_detailed_planning_scheduler_has_deadline_and_nonblocking_shutdown():\n    source = inspect.getsource(planning_state_implementation)\n    assert "DETAILED_PLAN_SECTION_TIMEOUT" in source\n    assert "shutdown(wait=False, cancel_futures=True)" in source\n    assert "wait(tuple(future_to_node), return_when=FIRST_COMPLETED)" not in source\n\n\ndef test_artifact_graph_has_deadline_and_nonblocking_shutdown():\n    source = inspect.getsource(artifact_graph_executor)\n    assert "ARTIFACT_GRAPH_WORK_TIMEOUT" in source\n    assert "generation_pool.shutdown(wait=False, cancel_futures=True)" in source\n    assert "wait(active, return_when=FIRST_COMPLETED)" not in source\n\n\ndef test_source_transplant_has_no_wait_true_or_executor_map():\n    source = inspect.getsource(source_transplant.materialize_source_slices)\n    assert "shutdown(wait=True" not in source\n    assert "executor.map" not in source\n    assert "iter_completed_with_deadlines" in source\n\n\ndef test_asset_generation_does_not_score_every_candidate_identically():\n    source = inspect.getsource(resource_asset_production)\n    assert "scored.append((1000.0" not in source\n    assert "effective_candidate_count" in source\n    assert "configured_candidate_count" in source\n''', encoding='utf-8')
