name: Final host-owned predesign cleanup
on:
  push:
    paths:
      - '.github/workflows/final-host-owned-predesign.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply refactor
        run: python tools/refactor_predesign_host_v2.py
      - name: Install dependencies
        run: python -m pip install -q -e . pytest ruff
      - name: Compile
        run: python -m compileall -q minecraft_mod_ai tests
      - name: Ruff regression-safe errors
        run: |
          ruff check --select F,E9 \
            minecraft_mod_ai/pre_design_external_source_contract.py \
            minecraft_mod_ai/pre_design_rag_corrective.py \
            minecraft_mod_ai/authored_scope_research_contract.py \
            minecraft_mod_ai/agentic_research_game_design.py \
            minecraft_mod_ai/agentic_pre_design_rag.py \
            tests/test_final_host_owned_predesign.py \
            tests/test_agentic_research_game_design.py
      - name: Regression tests
        run: |
          pytest -q \
            tests/test_final_host_owned_predesign.py \
            tests/test_small_model_predesign_v2.py \
            tests/test_pre_design_rag_direct_owner.py \
            tests/test_agentic_research_game_design.py \
            tests/test_pre_design_research_pipeline.py
      - name: Architecture assertions
        shell: bash
        run: |
          set -euxo pipefail
          ! grep -n 'provider_cap = .* else 8' minecraft_mod_ai/pre_design_external_source_contract.py
          ! grep -A70 -n '^def _generate_gap_queries' minecraft_mod_ai/pre_design_rag_corrective.py | grep 'response_format="json"'
          ! grep -A80 -n '^def _call_retrieval_planner' minecraft_mod_ai/authored_scope_research_contract.py | grep 'response_format="json"'
          ! grep -A60 -n '^def _research_domain_with_agent' minecraft_mod_ai/agentic_research_game_design.py | grep 'response_format="json"'
          grep -A35 -n '^def _research_document_domain' minecraft_mod_ai/agentic_pre_design_rag.py | grep 'small_model_predesign_research'
      - name: Commit verified refactor
        shell: bash
        run: |
          set -euxo pipefail
          rm -f tools/refactor_predesign_host_v2.py
          rm -f .github/workflows/native-rag-protocol-refactor.yml
          rm -f .github/workflows/rag-correctness-hotfix.yml
          rm -f .github/workflows/rag-runtime-owner-fix.yml
          rm -f .github/workflows/final-host-owned-predesign.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'refactor: make pre-design research host-owned'
          git push origin HEAD:main
