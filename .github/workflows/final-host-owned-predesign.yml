          ! grep -A90 -n '^def _call_retrieval_planner' minecraft_mod_ai/authored_scope_research_contract.py | grep 'response_format="json"'
          ! grep -A70 -n '^def _research_domain_with_agent' minecraft_mod_ai/agentic_research_game_design.py | grep 'response_format="json"'
