name: Apply custom lazy RAG critical path optimization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-custom-lazy-rag.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Move RAG work off the custom happy path
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('minecraft_mod_ai/custom_module_generator.py')
          s = p.read_text(encoding='utf-8')

          start = s.index('        self.router.bind_agent_workspace(root.parent, require_fresh_evidence=True)\n')
          end = s.index('        query = json.dumps(\n', start)
          replacement = '''        # ProjectIndex below already supplies fresh, exact, SHA-bound source evidence.\n        # Keep the normal custom generation path to one model decode and materialize\n        # model-callable RAG only if host validation actually rejects that response.\n        self.router.bind_agent_workspace(root.parent, require_fresh_evidence=True)\n\n'''
          s = s[:start] + replacement + s[end:]

          old_prompt = '''                            "is a code-owned commitment to earlier operations. Use the "\n                            "live RAG/MCP tools throughout implementation: current code RAG "\n                            "for repository facts, exact-version project/API evidence for "\n                            "Minecraft/Fabric facts, reviewed ecosystem/repository tools for "\n                            "dependencies, and JDT symbols/diagnostics for uncertain Java "\n                            "APIs. Inspect RAG receipts and reformulate or switch source when "\n                            "evidence is weak. When code output for the current page is too "\n'''
          new_prompt = '''                            "is a code-owned commitment to earlier operations. The host has "\n                            "already supplied fresh exact source observations and reviewed "\n                            "research_context for this bounded first pass. Use them directly; "\n                            "do not repeat retrieval unless host validation rejects the result "\n                            "and explicitly enters evidence-backed repair. When code output for "\n                            "the current page is too "\n'''
          if old_prompt not in s:
              raise SystemExit('custom first-pass prompt target not found')
          s = s.replace(old_prompt, new_prompt, 1)

          old_call = '''                response_format="json",\n            )\n\n            is_last_page = (\n'''
          new_call = '''                response_format="json",\n                enable_tools=False,\n            )\n\n            is_last_page = (\n'''
          if old_call not in s:
              raise SystemExit('custom first-pass decode target not found')
          s = s.replace(old_call, new_call, 1)

          marker = '''        observation_page_index = 0\n        while True:\n'''
          if marker not in s:
              raise SystemExit('custom repair state target not found')
          s = s.replace(marker, '''        observation_page_index = 0\n        repair_rag_ready = False\n        while True:\n''', 1)

          repair_marker = '''                repair_signatures.add(signature)\n                repair_attempts += 1\n                print(\n'''
          if repair_marker not in s:
              raise SystemExit('custom repair escalation target not found')
          escalation = '''                repair_signatures.add(signature)\n                repair_attempts += 1\n                if not repair_rag_ready:\n                    # Escalation only: build one current lexical RAG snapshot after\n                    # host validation proves the direct evidence pass was insufficient.\n                    from .production_tools import ProductionToolService\n\n                    try:\n                        live_manifest = index.manifest_receipt()\n                    except ValueError as exc:\n                        if not _is_stale_project_index_error(exc):\n                            raise\n                        index = ProjectIndex(root, policy=self.policy)\n                        self._cached_index = index\n                        self._cached_root = root\n                        live_manifest = index.manifest_receipt()\n                    ProductionToolService(\n                        workspace_root=root.parent,\n                        profile=getattr(self.router, "profile", "t4_local"),\n                    ).index_project_rag(\n                        [root.name],\n                        metadata={\n                            "minecraft_version": minecraft_version,\n                            "loader": loader,\n                            "mapping_namespace": _mapping_namespace(mappings),\n                            "java_version": "17",\n                            "license": "project-local",\n                            "source_commit": str(live_manifest["sha256"]),\n                        },\n                        semantic=False,\n                    )\n                    repair_rag_ready = True\n                print(\n'''
          s = s.replace(repair_marker, escalation, 1)
          compile(s, str(p), 'exec')
          p.write_text(s, encoding='utf-8')
          PY
          python -m pip install -q -e '.[dev]'
          python -m ruff check minecraft_mod_ai/custom_module_generator.py --select F,E7,E9
          python -m pytest -q \
            tests/test_project_context_pagination.py \
            tests/test_research_ledger.py \
            tests/test_custom_generation_search_contract.py \
            tests/test_custom_generation_efficiency_contract.py \
            tests/test_project_write_concurrency_contract.py
      - name: Commit validated optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-custom-lazy-rag.yml
          git add minecraft_mod_ai/custom_module_generator.py .github/workflows/apply-custom-lazy-rag.yml
          git diff --cached --check
          git commit -m "Move custom RAG off the happy path"
          git pull --rebase origin main
          git push origin HEAD:main
