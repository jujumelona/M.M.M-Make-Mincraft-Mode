name: Finalize reuse source reader

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-reuse-source-read-fix.yml

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Bind latest main
        run: |
          git fetch origin +main:refs/remotes/origin/main
          git reset --hard refs/remotes/origin/main
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply existing reader patch and corrected contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-reuse-source-read.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Validate source reader contracts"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = workflow[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in script.splitlines())
          script = script.replace(
              'donor = project / ".minecraft_ai" / "reuse" / "donors" / "a" * 20',
              'donor = project / ".minecraft_ai" / "reuse" / "donors" / ("a" * 20)',
          )
          exec(compile(script, '<reuse-source-reader-patch>', 'exec'), {})

          hardening = Path('tests/test_reuse_research_hardening_contract.py')
          text = hardening.read_text(encoding='utf-8')
          old = '''def test_donor_context_is_bounded_per_file_and_globally(tmp_path) -> None:\n    files = []\n    for index in range(4):\n        path = tmp_path / f"F{index}.java"\n        path.write_bytes(bytes([65 + index]) * 10_000)\n        files.append({"path": str(path), "sha256": f"sha256:{index}"})\n    receipt = {\n        "donors": [\n            {\n                "repository": "owner/repo",\n                "commit_sha": "a" * 40,\n                "license_id": "MIT",\n                "capability": "trade.transaction",\n                "files": files,\n            }\n        ]\n    }\n\n    context = contract._materialized_donor_context(receipt, byte_budget=12_000, per_file_budget=4_000)\n\n    assert len(context) == 3\n    assert sum(len(item["content"].encode("utf-8")) for item in context) <= 12_000\n    assert all(item["truncated"] for item in context)\n'''
          new = '''def test_donor_context_exposes_manifest_metadata_without_eager_source_text(tmp_path) -> None:\n    files = []\n    for index in range(4):\n        path = tmp_path / f"F{index}.java"\n        path.write_bytes(bytes([65 + index]) * 10_000)\n        files.append({"path": str(path), "sha256": f"sha256:{index}", "size_bytes": 10_000})\n    receipt = {\n        "donors": [\n            {\n                "repository": "owner/repo",\n                "commit_sha": "a" * 40,\n                "license_id": "MIT",\n                "capability": "trade.transaction",\n                "files": files,\n            }\n        ]\n    }\n\n    context = contract._materialized_donor_context(receipt)\n\n    assert len(context) == 4\n    assert all(item["read_tool"] == "read_reuse_source" for item in context)\n    assert all("content" not in item for item in context)\n    assert [item["path"] for item in context] == [item["path"] for item in files]\n'''
          if old not in text:
              raise SystemExit('stale donor context test anchor changed')
          hardening.write_text(text.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/apply-reuse-source-read.yml').unlink(missing_ok=True)
          Path('.github/workflows/apply-reuse-source-read-fix.yml').unlink(missing_ok=True)
          PY
      - name: Validate source reader and reuse contracts
        run: |
          python -m compileall -q minecraft_mod_ai tests
          python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9
          python -m pytest -q \
            tests/test_reuse_source_read_tool.py \
            tests/test_reuse_research_hardening_contract.py \
            tests/test_agent_tool_runtime_mcp_errors.py \
            tests/test_agent_tool_calling.py \
            $(find tests -maxdepth 1 -name 'test_*reuse*.py' -print)
      - name: Commit directly to main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(reuse): add on-demand donor source reader"
          git push origin HEAD:main
          gh workflow run ci.yml --ref main
