name: Worker 01 Final Verify

on:
  push:
    branches: [main]
    paths:
      - 'minecraft_mod_ai/platform_catalog.py'
      - 'minecraft_mod_ai/platform_live_discovery.py'
      - 'minecraft_mod_ai/verified_scaffold_registry.py'
      - 'tests/test_worker01_platform_scaffold_authority.py'
      - 'docs/parallel_progress/worker-01.md'
      - '.github/workflows/worker01-final-verify.yml'

permissions:
  contents: read

concurrency:
  group: worker01-final-verify-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Worker 01 regression
        run: python -m pytest -q tests/test_worker01_platform_scaffold_authority.py
      - name: Worker 01 compile and lint
        run: |
          python -m compileall -q minecraft_mod_ai/platform_catalog.py minecraft_mod_ai/platform_live_discovery.py minecraft_mod_ai/verified_scaffold_registry.py tests/test_worker01_platform_scaffold_authority.py
          python -m ruff check minecraft_mod_ai/platform_catalog.py minecraft_mod_ai/platform_live_discovery.py minecraft_mod_ai/verified_scaffold_registry.py tests/test_worker01_platform_scaffold_authority.py --select F,E7,E9
      - name: Repository static audit
        run: python .github/scripts/debug_repo_audit.py
