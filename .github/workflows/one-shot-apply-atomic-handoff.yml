name: one-shot apply atomic handoff

on:
  push:
    paths:
      - '.github/workflows/one-shot-apply-atomic-handoff.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply focused patch from staged recipe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/one-shot-finish-atomic-handoff.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY", start)
          body = source[start:end]
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in body.splitlines()) + "\n"
          Path('/tmp/atomic_handoff_patch.py').write_text(body, encoding='utf-8')
          PY
          python /tmp/atomic_handoff_patch.py
          python -m compileall -q minecraft_mod_ai tests/test_atomic_capability_handoff.py
          python -m pytest -q tests/test_atomic_capability_handoff.py
          git diff --check
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai tests/test_atomic_capability_handoff.py
          git commit -m 'fix: route atomic capabilities without semantic fallbacks'
          git push origin HEAD:main
