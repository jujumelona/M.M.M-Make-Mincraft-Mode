name: source-clean-function-prune

on:
  push:
    paths:
      - '.github/workflows/source-clean-function-prune.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install project test dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Build corrected cleaner
        shell: bash
        run: |
          mkdir -p scripts
          git show 8ffc39622e956d3dedd43a4195f4fed15b57ad42:scripts/one_shot_clean_refactor.py > scripts/one_shot_clean_refactor.py
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/source-clean-final.yml').read_text(encoding='utf-8')
          marker = "          cat > /tmp/clean.py <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY\n      - name: Rebase-safe", start)
          lines = src[start:end].splitlines()
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          body = body.replace('for path in sorted((ROOT / "tests").glob("test_*.py")):', 'for path in ():')
          body = body.replace('for root in (PKG, ROOT / "config", ROOT / "skills", ROOT / "plugins", ROOT / "tests"):', 'for root in (ROOT / "config", ROOT / "skills", ROOT / "plugins"):')
          Path('/tmp/clean.py').write_text(body, encoding='utf-8')
          PY
          cat > /tmp/prune_removed_functions.py <<'PY'
          from __future__ import annotations
          import ast
          import re
          from pathlib import Path

          ROOT = Path.cwd()
          MEDIA = ("audio", "speech", "voice", "tts", "asr")
          BANNED = re.compile(r"AudioRequest|audio_generator|audio_resume_efficiency_contract|planner_production_page_contract|production_page_durable_contract|SpeechAdapter|speech_recognition|generate-audio|production-audio|ai_voice", re.I)

          def touches_media(node: ast.AST) -> bool:
              try:
                  text = ast.unparse(node).lower()
              except Exception:
                  text = ast.dump(node).lower()
              return any(token in text for token in MEDIA) or bool(BANNED.search(text))

          class TestPruner(ast.NodeTransformer):
              def visit_FunctionDef(self, node):
                  if touches_media(node):
                      return None
                  return self.generic_visit(node)
              visit_AsyncFunctionDef = visit_FunctionDef
              def visit_ClassDef(self, node):
                  if touches_media(node):
                      return None
                  node = self.generic_visit(node)
                  if not node.body:
                      return None
                  return node
              def visit_Import(self, node):
                  node.names = [a for a in node.names if not any(t in (a.name + " " + str(a.asname or "")).lower() for t in MEDIA) and not BANNED.search(a.name + " " + str(a.asname or ""))]
                  return node if node.names else None
              def visit_ImportFrom(self, node):
                  module = str(node.module or "")
                  if any(t in module.lower() for t in MEDIA) or BANNED.search(module):
                      return None
                  node.names = [a for a in node.names if not any(t in (a.name + " " + str(a.asname or "")).lower() for t in MEDIA) and not BANNED.search(a.name + " " + str(a.asname or ""))]
                  return node if node.names else None
              def visit_Assign(self, node):
                  return None if touches_media(node) else self.generic_visit(node)
              def visit_AnnAssign(self, node):
                  return None if touches_media(node) else self.generic_visit(node)

          class SourceNamePruner(ast.NodeTransformer):
              def visit_FunctionDef(self, node):
                  low = node.name.lower()
                  if any(token in low for token in MEDIA) or BANNED.search(node.name):
                      return None
                  node = self.generic_visit(node)
                  if not node.body:
                      node.body = [ast.Pass()]
                  return node
              visit_AsyncFunctionDef = visit_FunctionDef
              def visit_ClassDef(self, node):
                  low = node.name.lower()
                  if any(token in low for token in MEDIA) or BANNED.search(node.name):
                      return None
                  node = self.generic_visit(node)
                  if not node.body:
                      node.body = [ast.Pass()]
                  return node

          quality = ROOT / 'minecraft_mod_ai/quality_evidence.py'
          if quality.exists():
              tree = SourceNamePruner().visit(ast.parse(quality.read_text(encoding='utf-8')))
              ast.fix_missing_locations(tree)
              quality.write_text(ast.unparse(tree) + '\n', encoding='utf-8')

          work = ROOT / 'minecraft_mod_ai/work_graph.py'
          if work.exists():
              text = work.read_text(encoding='utf-8')
              text = re.sub(r'\n    synth_nodes: list\[str\] = \[\].*?(?=\n    validation_dependencies =)', '\n', text, flags=re.S)
              work.write_text(text, encoding='utf-8')

          for path in sorted((ROOT / 'tests').glob('test_*.py')):
              if path.name == 'test_clean_production_contract.py':
                  continue
              source = path.read_text(encoding='utf-8', errors='ignore')
              if not any(token in source.lower() for token in MEDIA) and not BANNED.search(source):
                  continue
              tree = TestPruner().visit(ast.parse(source, filename=str(path)))
              ast.fix_missing_locations(tree)
              path.write_text(ast.unparse(tree) + '\n', encoding='utf-8')
          PY
      - name: Rebase-safe transform verify commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p scripts
            git show 8ffc39622e956d3dedd43a4195f4fed15b57ad42:scripts/one_shot_clean_refactor.py > scripts/one_shot_clean_refactor.py
            python /tmp/clean.py
            python /tmp/prune_removed_functions.py
            python -m compileall -q minecraft_mod_ai tests
            python -m pytest -q tests/test_clean_production_contract.py
            python - <<'PY'
          import re
          from pathlib import Path
          banned = re.compile(r'AudioRequest|audio_generator|audio_resume_efficiency_contract|planner_production_page_contract|production_page_durable_contract|SpeechAdapter|speech_recognition|generate-audio|production-audio|ai_voice', re.I)
          offenders=[]
          for root in (Path('minecraft_mod_ai'),Path('config'),Path('skills'),Path('plugins'),Path('tests')):
              if not root.exists(): continue
              for p in root.rglob('*'):
                  if p.is_file() and p.suffix.lower() in {'.py','.json','.yaml','.yml','.md','.toml'} and banned.search(p.read_text(encoding='utf-8',errors='ignore')):
                      offenders.append(str(p))
          if Path('pyproject.toml').exists() and banned.search(Path('pyproject.toml').read_text(encoding='utf-8')): offenders.append('pyproject.toml')
          if offenders: raise SystemExit('removed references remain:\n'+'\n'.join(sorted(set(offenders))))
          PY
            git diff --check
            changed_workflows="$(git diff --name-only | grep '^.github/workflows/' | grep -v -E '^.github/workflows/(source-clean-refactor|source-clean-retry|source-clean-final|source-clean-function-prune)\.yml$' || true)"
            if [ -n "$changed_workflows" ]; then echo "$changed_workflows" >&2; exit 1; fi
            rm -f scripts/one_shot_clean_refactor.py scripts/.gitkeep .github/workflows/source-clean-refactor.yml .github/workflows/source-clean-retry.yml .github/workflows/source-clean-final.yml .github/workflows/source-clean-function-prune.yml
            git add -A
            git commit -m "refactor: enforce host planner schema and remove media subsystem"
            python - <<'PY'
          import subprocess
          def show(p): return subprocess.check_output(['git','show',f'HEAD:{p}'],text=True)
          assert 'class '+'AudioRequest' not in show('minecraft_mod_ai/complete_spec.py')
          template=show('minecraft_mod_ai/planner_template_schema.py')
          assert '"a'+'udio"' not in template and 'implements_'+'deliverables' not in template
          planner=show('minecraft_mod_ai/complete_planner.py')
          assert 'build_batch_skeleton' in planner and 'merge_model_output_into_skeleton' in planner
          pattern=r'AudioRequest|audio_generator|audio_resume_efficiency_contract|planner_production_page_contract|production_page_durable_contract|SpeechAdapter|speech_recognition|generate-audio|production-audio|ai_voice'
          p=subprocess.run(['git','grep','-n','-E',pattern,'HEAD','--','minecraft_mod_ai','config','pyproject.toml','skills','plugins','tests'],text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
          if p.returncode==0: raise SystemExit(p.stdout)
          if p.returncode not in (0,1): raise SystemExit(p.stderr)
          PY
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
