name: Temporary verify-pass debug fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temporary-verify-pass-debug-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply terminal verification fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/progress_aware_tool_loop.py')
          text = path.read_text(encoding='utf-8')
          old = '''    while True:\n        state.step_index += 1\n'''
          new = '''    while True:\n        if (\n            implementation_requires_mutation\n            and state.workspace_changed\n            and state.validation_status == "PASS"\n            and (not require_rag or state.has_fresh_evidence)\n        ):\n            state.termination_reason = "VERIFICATION_PASSED"\n            emit_root_cause(\n                "tool_loop_complete",\n                stage=stage,\n                operation="generate_with_tools",\n                gate="verification_outcome",\n                result="PASS",\n                reason=state.termination_reason,\n                details={\n                    "step_index": state.step_index,\n                    "workspace_changed": state.workspace_changed,\n                    "validation_status": state.validation_status,\n                    "applied_mutations": tuple(state.applied_mutations),\n                },\n            )\n            return _finalize_without_tools(\n                router,\n                config,\n                adapter,\n                request,\n                messages,\n                instruction=(\n                    "Host verification passed after the applied source mutation. "\n                    "Do not call more tools. Return the final implementation summary "\n                    "using only the verified observations already present."\n                ),\n                empty_error="Agent returned an empty final response after verification passed.",\n            )\n\n        state.step_index += 1\n'''
          if 'state.termination_reason = "VERIFICATION_PASSED"' in text:
              raise SystemExit('fix already present; refusing duplicate application')
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one tool-loop anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Add regression test
        shell: bash
        run: |
          cat > tests/test_agent_tool_verification_terminal.py <<'PYTEST'
          from __future__ import annotations

          import json
          from types import SimpleNamespace

          from minecraft_mod_ai.model_adapters import GenerationResponse, ToolCall
          from minecraft_mod_ai.model_router import ModelRouter


          class _Registry:
              def __init__(self) -> None:
                  self.config = SimpleNamespace(adapter="llama_cpp", exclusive_gpu=False)

              def load_profile(self, profile: str) -> None:
                  assert profile == "test"

              def role(self, profile: str, role: str):
                  assert profile == "test"
                  assert role == "coder"
                  return self.config


          def _schema(name: str) -> dict[str, object]:
              return {
                  "type": "function",
                  "function": {
                      "name": name,
                      "description": name,
                      "parameters": {
                          "type": "object",
                          "properties": {
                              "path": {"type": "string"},
                              "operation": {"type": "string"},
                              "content": {"type": "string"},
                          },
                          "additionalProperties": True,
                      },
                  },
              }


          class _Runtime:
              def __init__(self) -> None:
                  self.calls: list[tuple[str, str, dict[str, object]]] = []

              def tool_schemas(self, stage: str):
                  assert stage == "generation"
                  return (_schema("apply_source_edit"), _schema("java_diagnostics"))

              def call(self, stage: str, name: str, arguments):
                  payload = dict(arguments)
                  self.calls.append((stage, name, payload))
                  if name == "apply_source_edit":
                      return {
                          "schema_version": "mmm/source-patch-receipt-v1",
                          "status": "APPLIED",
                          "operations": [
                              {
                                  "before_sha256": "sha256:before",
                                  "after_sha256": "sha256:after",
                              }
                          ],
                      }
                  if name == "java_diagnostics":
                      return {"status": "PASS", "diagnostics": []}
                  raise AssertionError(f"unexpected tool call: {name}")


          class _Adapter:
              def __init__(self) -> None:
                  self.requests = []

              def generate_turn(self, request):
                  self.requests.append(request)
                  index = len(self.requests)
                  names = [item["function"]["name"] for item in request.tools]
                  if index == 1:
                      assert names == ["apply_source_edit"]
                      return GenerationResponse(
                          tool_calls=(
                              ToolCall(
                                  id="mutate_1",
                                  name="apply_source_edit",
                                  arguments={
                                      "path": "src/main/java/Example.java",
                                      "operation": "create_file",
                                      "content": "public final class Example {}",
                                  },
                                  raw_arguments=json.dumps(
                                      {
                                          "path": "src/main/java/Example.java",
                                          "operation": "create_file",
                                          "content": "public final class Example {}",
                                      }
                                  ),
                              ),
                          )
                      )
                  if index == 2:
                      assert names == ["java_diagnostics"]
                      assert request.tool_choice == {
                          "type": "function",
                          "function": {"name": "java_diagnostics"},
                      }
                      return GenerationResponse(
                          tool_calls=(
                              ToolCall(
                                  id="verify_1",
                                  name="java_diagnostics",
                                  arguments={"path": "src/main/java/Example.java"},
                                  raw_arguments='{"path":"src/main/java/Example.java"}',
                              ),
                          )
                      )
                  if index == 3:
                      assert request.tools == ()
                      assert request.tool_choice is None
                      return GenerationResponse(content="verified implementation complete")
                  raise AssertionError("verifier was invoked again after a trusted PASS")


          def test_verifier_pass_finalizes_without_repeating_verifier(monkeypatch) -> None:
              adapter = _Adapter()
              runtime = _Runtime()
              monkeypatch.setattr(
                  ModelRouter,
                  "_new_text_adapter",
                  staticmethod(lambda config, *, role: adapter),
              )
              router = ModelRouter(
                  profile="test",
                  registry=_Registry(),
                  agent_tool_runtime_factory=lambda **_: runtime,
              )
              request = {
                  "task": "implement_module",
                  "operation": "create_file",
                  "path": "src/main/java/Example.java",
                  "request": "implement_module",
              }

              result = router.generate_text(
                  "coder",
                  [{"role": "user", "content": json.dumps(request)}],
              )

              assert result == "verified implementation complete"
              assert [name for _, name, _ in runtime.calls] == [
                  "apply_source_edit",
                  "java_diagnostics",
              ]
              assert len(adapter.requests) == 3
              final_instruction = str(adapter.requests[-1].messages[-1]["content"])
              assert "verification passed" in final_instruction.casefold()
          PYTEST

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'

      - name: Run focused regressions
        run: |
          python -m pytest -q \
            tests/test_agent_tool_verification_terminal.py \
            tests/test_agent_tool_round_policy.py \
            tests/test_agent_tool_round_liveness.py \
            tests/test_agent_tool_calling.py

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temporary-verify-pass-debug-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft_mod_ai/progress_aware_tool_loop.py tests/test_agent_tool_verification_terminal.py .github/workflows/temporary-verify-pass-debug-fix.yml
          git commit -m "fix: finalize coder loop after verifier pass"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              echo "rebase conflict while preserving concurrent main changes" >&2
              exit 1
            }
          done
          echo "failed to push verified fix after bounded retries" >&2
          exit 1
