name: Production Kill Gates

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: production-kill-gates-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  file-plan:
    name: Discover every test file
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      lane1: ${{ steps.plan.outputs.lane1 }}
      lane2: ${{ steps.plan.outputs.lane2 }}
      lane3: ${{ steps.plan.outputs.lane3 }}
      lane4: ${{ steps.plan.outputs.lane4 }}
    steps:
      - uses: actions/checkout@v6
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          from tools.ci_test_matrix import build_file_lanes

          expected = sorted(path.as_posix() for path in Path("tests").glob("test_*.py"))
          assert expected, "no test files discovered"

          # Four long-lived runners preserve the existing lane topology while avoiding
          # one hosted runner allocation and one dependency install per test file.
          # max_jobs_per_lane is deliberately set from the discovered file count here:
          # these are no longer GitHub matrix cells, so no matrix-capacity limit applies.
          lanes = build_file_lanes(
              expected,
              lane_count=4,
              max_jobs_per_lane=len(expected),
          )
          cells = [cell for lane in lanes for cell in lane]
          actual = [cell["files"][0] for cell in cells]
          assert len(cells) == len(expected), (len(cells), len(expected))
          assert len(actual) == len(set(actual)), "duplicate test files in kill-gate lanes"
          assert sorted(actual) == expected, "kill-gate lanes omitted or invented test files"
          assert all(len(cell["files"]) == 1 for cell in cells), "a kill-gate cell owns multiple files"

          for index, lane in enumerate(lanes, 1):
              payload = json.dumps(lane, separators=(",", ":"))
              print(f"lane{index}={payload}")
          print(f"production kill gates: files={len(expected)} lanes={[len(lane) for lane in lanes]}", file=__import__('sys').stderr)
          PY

  collection-contract:
    name: Whole-suite collection contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev,ui]'
      - name: Collect every test without import errors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit/kill-gates
          python -m pytest --collect-only -q 2>&1 | tee audit/kill-gates/collection.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kill-gate-collection-${{ github.sha }}
          path: audit/kill-gates/collection.log
          if-no-files-found: warn

  lane1:
    name: Kill gate lane L1
    needs: file-plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_CELLS_JSON: ${{ needs.file-plan.outputs.lane1 }}
      LANE_ID: L1
    steps: &test_steps
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: python -m pip install --prefer-binary -e '.[dev,ui]'
      - name: Run every lane file in its own pytest process
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "audit/kill-gates/${LANE_ID}"
          python - <<'PY' > /tmp/test-cells.tsv
          import json
          import os

          cells = json.loads(os.environ["TEST_CELLS_JSON"])
          assert cells, "kill-gate lane is empty"
          for cell in cells:
              files = cell["files"]
              assert len(files) == 1, f"kill-gate cell must own one file, got {files!r}"
              print(f"{cell['id']}\t{files[0]}")
          PY
          test -s /tmp/test-cells.tsv

          failures=0
          while IFS=$'\t' read -r cell_id test_file; do
            echo "::group::${LANE_ID}/${cell_id} ${test_file}"
            if ! python tools/pytest_diagnostics.py \
              --log "audit/kill-gates/${LANE_ID}/${cell_id}.log" \
              --junit "audit/kill-gates/${LANE_ID}/${cell_id}.xml" \
              --durations 25 \
              --maxfail 100 \
              "$test_file"; then
              failures=$((failures + 1))
              echo "::error file=${test_file}::${LANE_ID}/${cell_id} failed"
            fi
            echo "::endgroup::"
          done < /tmp/test-cells.tsv

          if (( failures > 0 )); then
            echo "${LANE_ID}: ${failures} isolated test file(s) failed"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kill-gate-${{ env.LANE_ID }}-${{ github.sha }}
          path: audit/kill-gates/${{ env.LANE_ID }}/
          if-no-files-found: warn

  lane2:
    name: Kill gate lane L2
    needs: file-plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_CELLS_JSON: ${{ needs.file-plan.outputs.lane2 }}
      LANE_ID: L2
    steps: *test_steps

  lane3:
    name: Kill gate lane L3
    needs: file-plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_CELLS_JSON: ${{ needs.file-plan.outputs.lane3 }}
      LANE_ID: L3
    steps: *test_steps

  lane4:
    name: Kill gate lane L4
    needs: file-plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_CELLS_JSON: ${{ needs.file-plan.outputs.lane4 }}
      LANE_ID: L4
    steps: *test_steps

  gate:
    name: Production Kill Gate
    if: ${{ always() }}
    timeout-minutes: 5
    needs: [file-plan, collection-contract, lane1, lane2, lane3, lane4]
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed on every mandatory result
        env:
          PLAN: ${{ needs.file-plan.result }}
          COLLECTION: ${{ needs.collection-contract.result }}
          LANE1: ${{ needs.lane1.result }}
          LANE2: ${{ needs.lane2.result }}
          LANE3: ${{ needs.lane3.result }}
          LANE4: ${{ needs.lane4.result }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'plan=%s collection=%s lanes=%s,%s,%s,%s\n' \
            "$PLAN" "$COLLECTION" "$LANE1" "$LANE2" "$LANE3" "$LANE4"
          test "$PLAN" = success
          test "$COLLECTION" = success
          test "$LANE1" = success
          test "$LANE2" = success
          test "$LANE3" = success
          test "$LANE4" = success
