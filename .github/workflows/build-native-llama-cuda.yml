name: Native llama CUDA bundle worker

on:
  workflow_call:
    inputs:
      cuda_arch:
        description: CUDA SM architecture, for example 75
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_and_publish:
    name: CUDA SM${{ inputs.cuda_arch }}
    runs-on: ubuntu-22.04
    container: nvidia/cuda:12.4.1-devel-ubuntu22.04
    env:
      LLAMA_SOURCE_REF: ba360efe1f574ebae727aad64112d18ecedca85a
      BUNDLE_SCHEMA: mmm/native-llama-cuda-bundle-v2
      BUNDLE_PREFIX: llama-b10375-cuda12.4
      BUNDLE_ARCH: ${{ inputs.cuda_arch }}
      RELEASE_TAG: native-llama-b10375-cuda12.4-v2
    steps:
      - name: Install build and release tools
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils ca-certificates cmake gh git ninja-build python3
          rm -rf /var/lib/apt/lists/*
          gh --version

      - name: Prepare CUDA driver stubs for link-only build
        shell: bash
        run: |
          set -euo pipefail
          stub_dir=/usr/local/cuda/lib64/stubs
          test -f "$stub_dir/libcuda.so"
          ln -sf libcuda.so "$stub_dir/libcuda.so.1"
          test -e "$stub_dir/libcuda.so.1"

      - name: Build pinned native llama-server
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git llama.cpp
          git -C llama.cpp fetch --depth 1 origin "$LLAMA_SOURCE_REF"
          git -C llama.cpp checkout --detach FETCH_HEAD
          test "$(git -C llama.cpp rev-parse HEAD)" = "$LLAMA_SOURCE_REF"
          cmake -S llama.cpp -B llama.cpp/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DGGML_CUDA=ON \
            -DGGML_CUDA_GRAPHS=ON \
            -DCMAKE_CUDA_ARCHITECTURES="$BUNDLE_ARCH" \
            -DCMAKE_EXE_LINKER_FLAGS="-Wl,-rpath-link,/usr/local/cuda/lib64/stubs -L/usr/local/cuda/lib64/stubs" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,-rpath-link,/usr/local/cuda/lib64/stubs -L/usr/local/cuda/lib64/stubs" \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF \
            -DLLAMA_BUILD_APP=OFF \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_BUILD_TOOLS=ON \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_CURL=OFF
          cmake --build llama.cpp/build --target llama-server -j "$(nproc)"

      - name: Verify native linkage contract
        shell: bash
        run: |
          set -euo pipefail
          test -x llama.cpp/build/bin/llama-server
          cuda_so="$(find llama.cpp/build/bin -maxdepth 1 -type f -name 'libggml-cuda.so.*' | sort | head -n 1)"
          test -n "$cuda_so"
          readelf -d "$cuda_so" | grep -F 'Shared library: [libcuda.so.1]'
          if readelf -d llama.cpp/build/bin/llama-server | grep -F '/usr/local/cuda/lib64/stubs'; then
            echo 'llama-server contains a forbidden runtime path to the CI CUDA stub' >&2
            exit 1
          fi
          if readelf -d "$cuda_so" | grep -F '/usr/local/cuda/lib64/stubs'; then
            echo 'libggml-cuda contains a forbidden runtime path to the CI CUDA stub' >&2
            exit 1
          fi
          grep -q '^GGML_CUDA_GRAPHS:BOOL=ON$' llama.cpp/build/CMakeCache.txt

      - name: Package one copy of each shared library
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bundle dist
          mkdir -p bundle/bin dist
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          source = Path("llama.cpp/build/bin").resolve()
          root = Path("bundle").resolve()
          target = root / "bin"

          server = source / "llama-server"
          if not server.is_file():
              raise SystemExit("llama-server is missing")
          shutil.copy2(server, target / "llama-server")

          aliases: dict[str, str] = {}
          real_files: dict[str, Path] = {}
          libraries = sorted(source.glob("*.so*"))
          if not libraries:
              raise SystemExit("no shared libraries were produced")
          for entry in libraries:
              if not entry.is_file():
                  continue
              resolved = entry.resolve(strict=True)
              if not resolved.is_relative_to(source):
                  raise SystemExit(f"shared library resolves outside build/bin: {entry}")
              real_files.setdefault(resolved.name, resolved)
              if entry.name != resolved.name:
                  aliases[f"bin/{entry.name}"] = f"bin/{resolved.name}"

          for name, path in sorted(real_files.items()):
              shutil.copy2(path, target / name)

          files: dict[str, str] = {}
          for path in sorted(target.iterdir()):
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"bundle must contain regular files only: {path}")
              relative = path.relative_to(root).as_posix()
              files[relative] = hashlib.sha256(path.read_bytes()).hexdigest()

          if not any(name.startswith("bin/libggml-cuda.so") for name in files):
              raise SystemExit("CUDA backend real file is missing")
          if any(name.startswith("bin/libcuda.so") for name in files):
              raise SystemExit("CUDA driver stubs must never be packaged")
          if not aliases:
              raise SystemExit("expected shared-library aliases were not discovered")
          for alias, real in aliases.items():
              if real not in files:
                  raise SystemExit(f"alias target is not a packaged real file: {alias} -> {real}")

          manifest = {
              "schema_version": os.environ["BUNDLE_SCHEMA"],
              "llama_source_ref": os.environ["LLAMA_SOURCE_REF"],
              "cuda_arch": os.environ["BUNDLE_ARCH"],
              "cuda_toolkit": "12.4",
              "cuda_graphs": True,
              "platform": "linux-x86_64",
              "files": files,
              "aliases": dict(sorted(aliases.items())),
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(
              f"packaged regular files={len(files)} aliases={len(aliases)} "
              f"bytes={sum((root / name).stat().st_size for name in files)}"
          )
          PY
          test -x bundle/bin/llama-server
          test -z "$(find bundle -type l -print -quit)"
          test ! -e bundle/bin/libcuda.so
          test ! -e bundle/bin/libcuda.so.1
          asset="${BUNDLE_PREFIX}-sm${BUNDLE_ARCH}-linux-x86_64.tar.gz"
          tar -C bundle -czf "dist/$asset" .
          (cd dist && sha256sum "$asset" > "$asset.sha256")

      - name: Upload workflow artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: native-llama-sm${{ inputs.cuda_arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish this architecture immediately
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="${BUNDLE_PREFIX}-sm${BUNDLE_ARCH}-linux-x86_64.tar.gz"
          test -s "dist/$asset"
          test -s "dist/$asset.sha256"
          (cd dist && sha256sum -c "$asset.sha256")

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Native llama.cpp CUDA b10375 + CUDA Graphs" \
              --notes "Verified native llama-server CUDA 12.4 bundles with GGML_CUDA_GRAPHS=ON. Source: ggml-org/llama.cpp ba360efe1f574ebae727aad64112d18ecedca85a." \
            || gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi

          gh release upload "$RELEASE_TAG" \
            "dist/$asset" "dist/$asset.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
