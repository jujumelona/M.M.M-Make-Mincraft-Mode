name: one-shot skip unbound Official RAG

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-skip-unbound-official-rag.yml

permissions:
  contents: write

concurrency:
  group: one-shot-skip-unbound-official-rag
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Patch missing-target Official RAG gate, verify, and commit
        shell: bash
        run: |
          set -Eeuo pipefail
          WORKFLOW=.github/workflows/one-shot-skip-unbound-official-rag.yml
          BASE_SHA=$(git rev-parse HEAD)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cleanup_failure() {
            status=$?
            git reset --hard "$BASE_SHA" || true
            rm -f "$WORKFLOW"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: remove failed unbound Official RAG repair" || true
              git push origin HEAD:main || true
            fi
            exit "$status"
          }
          trap cleanup_failure ERR

          python - <<'PY'
          import ast
          from pathlib import Path

          MESSAGE = "Official RAG requires a host-selected minecraft_version, loader and mappings."
          ROOT = Path("minecraft_mod_ai")
          collection_tokens = ("list", "sequence", "iterable", "collection", "tuple", "set")
          patched = []

          def raised_message(node):
              if not isinstance(node, ast.Raise) or node.exc is None:
                  return None
              exc = node.exc
              if not isinstance(exc, ast.Call):
                  return None
              for arg in exc.args:
                  if isinstance(arg, ast.Constant) and arg.value == MESSAGE:
                      return MESSAGE
              return None

          for path in ROOT.rglob("*.py"):
              text = path.read_text(encoding="utf-8")
              if MESSAGE not in text:
                  continue
              tree = ast.parse(text)
              parents = {}
              for parent in ast.walk(tree):
                  for child in ast.iter_child_nodes(parent):
                      parents[child] = parent

              targets = []
              for node in ast.walk(tree):
                  if raised_message(node) != MESSAGE:
                      continue
                  cur = parents.get(node)
                  while cur is not None and not isinstance(cur, (ast.FunctionDef, ast.AsyncFunctionDef)):
                      cur = parents.get(cur)
                  if cur is None:
                      raise SystemExit(f"refusing non-function Official RAG gate in {path}")
                  ann = ast.unparse(cur.returns).lower() if cur.returns is not None else ""
                  if not any(token in ann for token in collection_tokens):
                      raise SystemExit(
                          f"refusing unsafe neutral return: {path}:{node.lineno} function={cur.name} return={ann or '<unannotated>'}"
                      )
                  targets.append(node)

              if not targets:
                  continue

              lines = text.splitlines(keepends=True)
              for node in sorted(targets, key=lambda n: n.lineno, reverse=True):
                  start = node.lineno - 1
                  end = (node.end_lineno or node.lineno) - 1
                  indent = lines[start][: len(lines[start]) - len(lines[start].lstrip())]
                  newline = "\r\n" if lines[start].endswith("\r\n") else "\n"
                  lines[start:end + 1] = [f"{indent}return []{newline}"]
                  patched.append(f"{path}:{node.lineno}")
              path.write_text("".join(lines), encoding="utf-8")

          if not patched:
              raise SystemExit("no safe Official RAG missing-target gate found")
          print(f"patched {len(patched)} safe Official RAG missing-target gate(s)")
          PY

          git diff --check
          python -m compileall -q minecraft_mod_ai

          mapfile -t RELEVANT_TESTS < <(grep -RIlE 'Official RAG|saved_authored_design|agentic-rag-primary' tests 2>/dev/null || true)
          if (( ${#RELEVANT_TESTS[@]} > 0 )); then
            python -m pytest -q "${RELEVANT_TESTS[@]}"
          else
            python -m pytest -q -k 'rag or authored or production' --maxfail=1
          fi

          rm -f "$WORKFLOW"
          git add -A
          if git diff --cached --quiet; then
            echo "repair produced no persistent source change" >&2
            exit 1
          fi
          git commit -m "fix: skip Official RAG until host target is selected"
          git push origin HEAD:main
          trap - ERR
