name: Finalize Orchestrator Responsibility Split

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-orchestrator-size.yml'

permissions:
  contents: write

concurrency:
  group: finalize-orchestrator-responsibility-split
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Move build-repair responsibility out of orchestrator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/complete_orchestrator.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'from .complete_spec import CompleteProposal, CompleteProposalStatus, ProductionModule\n',
              'from .complete_build_repair import run_build_with_repair\nfrom .complete_spec import CompleteProposal, CompleteProposalStatus, ProductionModule\n',
              'build-repair import anchor',
          )
          replace_once('from .repair_engine import RepairEngine\n', '', 'RepairEngine import')
          replace_once('from .runner import GradleRunner\n', '', 'GradleRunner import')

          helper = '''def _attested_repair_build(repair_result: Any) -> dict[str, Any] | None:\n    if not isinstance(repair_result, dict) or repair_result.get("status") != "PASS":\n        return None\n    repair_evidence = repair_result.get("evidence")\n    if not isinstance(repair_evidence, dict) or repair_evidence.get("passed") is not True:\n        return None\n    repaired_build = repair_evidence.get("build")\n    if not isinstance(repaired_build, dict) or repaired_build.get("status") != "PASS":\n        return None\n    return repaired_build\n\n\n'''
          replace_once(helper, '', 'attested build helper')

          method = '''    def _run_build_with_repair(\n        self,\n        *,\n        project_root: Path,\n        cache: Path,\n        options: CompleteExecutionOptions,\n        router: ModelRouter | None,\n    ) -> tuple[dict[str, Any], ModelRouter | None]:\n        build_result = GradleRunner(cache).build(\n            project_root, run_gametest=options.run_gametest\n        ).to_dict()\n        repair_result: dict[str, Any] | None = None\n        active_router = router\n        if build_result.get("status") != "PASS" and options.auto_repair:\n            active_router = active_router or self.router_factory()\n            repair_result = RepairEngine(\n                router=active_router,\n                gradle_cache=cache,\n                policy=self.policy,\n            ).repair(\n                project_root,\n                run_gametest=options.run_gametest,\n                max_attempts=options.max_repair_attempts,\n            )\n            repaired_build = _attested_repair_build(repair_result)\n            if repaired_build is not None:\n                build_result = dict(repaired_build)\n            else:\n                build_result = GradleRunner(cache).build(\n                    project_root, run_gametest=options.run_gametest\n                ).to_dict()\n        return {"build": build_result, "repair": repair_result}, active_router\n\n'''
          replace_once(method, '', 'orchestrator build-repair method')

          old_call = '''            bundle, router = self._run_build_with_repair(\n                project_root=project_root,\n                cache=cache,\n                options=options,\n                router=router,\n            )\n'''
          new_call = '''            bundle, router = run_build_with_repair(\n                project_root=project_root,\n                cache=cache,\n                run_gametest=options.run_gametest,\n                auto_repair=options.auto_repair,\n                max_repair_attempts=options.max_repair_attempts,\n                router=router,\n                router_factory=self.router_factory,\n                policy=self.policy,\n            )\n'''
          replace_once(old_call, new_call, 'build-repair call')
          path.write_text(text, encoding='utf-8')

          Path('minecraft_mod_ai/complete_build_repair.py').write_text('''from __future__ import annotations\n\nfrom collections.abc import Callable\nfrom pathlib import Path\nfrom typing import Any\n\nfrom .model_router import ModelRouter\nfrom .repair_engine import RepairEngine\nfrom .runner import GradleRunner\nfrom .scale_policy import ScalePolicy\n\n\ndef _attested_repair_build(repair_result: Any) -> dict[str, Any] | None:\n    if not isinstance(repair_result, dict) or repair_result.get("status") != "PASS":\n        return None\n    evidence = repair_result.get("evidence")\n    if not isinstance(evidence, dict) or evidence.get("passed") is not True:\n        return None\n    build = evidence.get("build")\n    if not isinstance(build, dict) or build.get("status") != "PASS":\n        return None\n    return build\n\n\ndef run_build_with_repair(\n    *,\n    project_root: Path,\n    cache: Path,\n    run_gametest: bool,\n    auto_repair: bool,\n    max_repair_attempts: int | None,\n    router: ModelRouter | None,\n    router_factory: Callable[[], ModelRouter],\n    policy: ScalePolicy,\n) -> tuple[dict[str, Any], ModelRouter | None]:\n    build = GradleRunner(cache).build(project_root, run_gametest=run_gametest).to_dict()\n    repair: dict[str, Any] | None = None\n    active_router = router\n    if build.get("status") != "PASS" and auto_repair:\n        active_router = active_router or router_factory()\n        repair = RepairEngine(\n            router=active_router, gradle_cache=cache, policy=policy\n        ).repair(\n            project_root,\n            run_gametest=run_gametest,\n            max_attempts=max_repair_attempts,\n        )\n        attested = _attested_repair_build(repair)\n        build = (\n            dict(attested)\n            if attested is not None\n            else GradleRunner(cache).build(\n                project_root, run_gametest=run_gametest\n            ).to_dict()\n        )\n    return {"build": build, "repair": repair}, active_router\n''', encoding='utf-8')
          PY

      - name: Validate moved responsibility
        run: |
          python -m compileall -q minecraft_mod_ai
          git diff --check
          test "$(wc -l < minecraft_mod_ai/complete_orchestrator.py)" -le 1675

      - name: Commit and remove one-shot workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-orchestrator-size.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/complete_orchestrator.py minecraft_mod_ai/complete_build_repair.py .github/workflows/finalize-orchestrator-size.yml
          git diff --cached --exit-code && { echo 'No changes produced'; exit 1; } || true
          git commit -m 'refactor(orchestrator): isolate build repair execution'
          git push origin HEAD:main
