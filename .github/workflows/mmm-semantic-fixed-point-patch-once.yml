name: MMM semantic fixed-point patch once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mmm-semantic-fixed-point-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebase patch base to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Apply semantic progress patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          ledger_path = Path('minecraft_mod_ai/causal_state_ledger.py')
          text = ledger_path.read_text()
          text = replace_once(
              text,
              '_SAFE_MUTATION_FAILURE_REFRESH_LIMIT = 2\n_WORKSPACE_IMPACT_MARKERS = (',
              '''_VOLATILE_FAILURE_KEYS = frozenset(\n    {\n        "elapsed_ms",\n        "duration_ms",\n        "latency_ms",\n        "timing_ms",\n        "request_id",\n        "trace_id",\n        "timestamp",\n    }\n)\n_WORKSPACE_IMPACT_MARKERS = (''',
              'replace retry counter constant',
          )
          anchor = '''def _transitions(schemas: Sequence[Mapping[str, Any]]) -> dict[str, Any]:\n'''
          helpers = '''def _stable_failure_value(value: Any) -> Any:\n    """Drop transport telemetry while preserving mutation failure identity."""\n\n    if isinstance(value, Mapping):\n        return {\n            str(key): _stable_failure_value(item)\n            for key, item in sorted(value.items(), key=lambda pair: str(pair[0]))\n            if str(key).casefold() not in _VOLATILE_FAILURE_KEYS\n        }\n    if isinstance(value, Sequence) and not isinstance(value, (str, bytes, bytearray)):\n        return [_stable_failure_value(item) for item in value]\n    return value\n\n\ndef _failed_source_mutation_signature(message: Mapping[str, Any]) -> str:\n    """Stable route/error identity for deterministic unchanged-workspace failures."""\n\n    if not _is_failed_source_mutation(message):\n        return ""\n    payload = _graph._payload(message)\n    if payload is None:\n        return ""\n    stable = {\n        "tool": str(message.get("name", "")).strip(),\n        "workspace_impact": _failed_source_mutation_workspace_impact(message),\n        "error": str(payload.get("error", "")).strip(),\n        "result": _stable_failure_value(payload.get("result")),\n    }\n    encoded = json.dumps(\n        stable,\n        ensure_ascii=False,\n        sort_keys=True,\n        separators=(",", ":"),\n        default=str,\n    ).encode("utf-8")\n    return hashlib.blake2s(encoded, digest_size=16).hexdigest()\n\n\n'''
          text = replace_once(text, anchor, helpers + anchor, 'insert failure fingerprint helpers')
          text = replace_once(
              text,
              '''class CausalStateSnapshot:\n    state: frozenset[str]\n    query: str\n    replayed_full_transcript: bool\n    processed_suffix_messages: int\n''',
              '''class CausalStateSnapshot:\n    state: frozenset[str]\n    query: str\n    replayed_full_transcript: bool\n    processed_suffix_messages: int\n    blocked_mutation_tools: frozenset[str] = frozenset()\n''',
              'extend causal snapshot',
          )
          text = replace_once(
              text,
              '''        self._refresh_required = False\n        self._fresh_state = frozenset({"workspace_bound"})\n        self._safe_mutation_failures = 0\n\n    def _reset_refresh_epoch(self) -> None:\n        self._refresh_required = False\n        self._fresh_state = frozenset({"workspace_bound"})\n        self._safe_mutation_failures = 0\n''',
              '''        self._refresh_required = False\n        self._fresh_state = frozenset({"workspace_bound"})\n        self._safe_failure_seen: set[str] = set()\n        self._safe_failure_recovered: set[str] = set()\n        self._pending_recovery_failures: set[str] = set()\n        self._blocked_mutation_tools: set[str] = set()\n\n    def _reset_refresh_window(self) -> None:\n        self._refresh_required = False\n        self._fresh_state = frozenset({"workspace_bound"})\n        self._pending_recovery_failures.clear()\n\n    def _reset_mutation_epoch(self) -> None:\n        """Forget stuck history only after the workspace may actually have changed."""\n\n        self._reset_refresh_window()\n        self._safe_failure_seen.clear()\n        self._safe_failure_recovered.clear()\n        self._blocked_mutation_tools.clear()\n''',
              'replace mutation retry state',
          )
          old_policy = '''    def _observe_refresh_policy(\n        self,\n        message: Mapping[str, Any],\n        schemas: Sequence[Mapping[str, Any]],\n    ) -> None:\n        """Turn repeated safe write failures into a corrective-evidence transition."""\n\n        impact = _failed_source_mutation_workspace_impact(message)\n        if impact:\n            if impact in _INVALIDATING_WORKSPACE_IMPACTS:\n                self._refresh_required = True\n                self._fresh_state = frozenset({"workspace_bound"})\n                self._safe_mutation_failures = 0\n                return\n            if impact in _SAFE_RETRY_WORKSPACE_IMPACTS:\n                self._safe_mutation_failures += 1\n                if self._safe_mutation_failures >= _SAFE_MUTATION_FAILURE_REFRESH_LIMIT:\n                    self._refresh_required = True\n                    self._fresh_state = frozenset({"workspace_bound"})\n                    self._safe_mutation_failures = 0\n                return\n\n        if self._refresh_required:\n            self._fresh_state = _advance_verified_state(\n                self._fresh_state,\n                (message,),\n                schemas,\n            )\n            if _fresh_evidence_ready(self._fresh_state):\n                self._reset_refresh_epoch()\n            return\n\n        if supplies_fresh_evidence(message, schemas):\n            self._safe_mutation_failures = 0\n'''
          new_policy = '''    def _observe_refresh_policy(\n        self,\n        message: Mapping[str, Any],\n        schemas: Sequence[Mapping[str, Any]],\n    ) -> None:\n        """Track semantic mutation recovery without treating a round count as progress."""\n\n        role = str(message.get("role", "")).strip().casefold()\n        name = str(message.get("name", "")).strip()\n        payload = _graph._payload(message) if role == "tool" else None\n        if (\n            role == "tool"\n            and name in SOURCE_MUTATION_NAMES\n            and payload is not None\n            and mutation_payload_applied(name, payload)\n        ):\n            # A reviewed source diff is objective world-state progress. Only this (or\n            # an uncertain/drift failure below) starts a new mutation epoch.\n            self._reset_mutation_epoch()\n            return\n\n        impact = _failed_source_mutation_workspace_impact(message)\n        if impact:\n            if impact in _INVALIDATING_WORKSPACE_IMPACTS:\n                # We cannot prove the workspace is the same, so old stuck identities\n                # are no longer sound. Re-observe before another mutation.\n                self._reset_mutation_epoch()\n                self._refresh_required = True\n                return\n            if impact in _SAFE_RETRY_WORKSPACE_IMPACTS:\n                signature = _failed_source_mutation_signature(message)\n                if signature and signature in self._safe_failure_recovered:\n                    # Same deterministic route/failure after an evidence recovery and\n                    # no workspace change is a causal fixed point. Hide the route from\n                    # the small model instead of asking it to invent an escape.\n                    self._blocked_mutation_tools.add(name)\n                    return\n                if signature and signature in self._safe_failure_seen:\n                    # A repeated semantic failure with no intervening recovery is not\n                    # progress. Force a fresh evidence transition exactly for this\n                    # failure identity rather than consuming a generic retry budget.\n                    self._refresh_required = True\n                    self._fresh_state = frozenset({"workspace_bound"})\n                    self._pending_recovery_failures.add(signature)\n                    return\n                if signature:\n                    self._safe_failure_seen.add(signature)\n                return\n\n        if self._refresh_required:\n            self._fresh_state = _advance_verified_state(\n                self._fresh_state,\n                (message,),\n                schemas,\n            )\n            if _fresh_evidence_ready(self._fresh_state):\n                self._safe_failure_recovered.update(self._pending_recovery_failures)\n                self._reset_refresh_window()\n            return\n\n        if supplies_fresh_evidence(message, schemas):\n            # Retrieval is observation, not world-state progress. It may satisfy a\n            # recovery, but must never erase the failure identity it is recovering.\n            self._safe_failure_recovered.update(self._safe_failure_seen)\n'''
          text = replace_once(text, old_policy, new_policy, 'replace refresh policy')
          text = replace_once(
              text,
              '''        self._reset_refresh_epoch()\n        for message in messages:\n''',
              '''        self._reset_mutation_epoch()\n        for message in messages:\n''',
              'reset mutation epoch on rebuild',
          )
          text = replace_once(
              text,
              '''            replayed_full_transcript=replayed,\n            processed_suffix_messages=suffix_count,\n        )\n''',
              '''            replayed_full_transcript=replayed,\n            processed_suffix_messages=suffix_count,\n            blocked_mutation_tools=frozenset(self._blocked_mutation_tools),\n        )\n''',
              'publish blocked mutation routes',
          )
          ledger_path.write_text(text)

          adapter_path = Path('minecraft_mod_ai/causal_frontier_adapter.py')
          text = adapter_path.read_text()
          text = replace_once(
              text,
              '''        forced_name = _forced_tool_name(request.tool_choice)\n        if forced_name:\n            forced_schema = by_name.get(forced_name)\n''',
              '''        forced_name = _forced_tool_name(request.tool_choice)\n        blocked_mutations: frozenset[str] = frozenset()\n        if forced_name:\n            if forced_name in _SOURCE_MUTATION_NAMES:\n                forced_snapshot = self._state_ledger.resolve(\n                    request.messages,\n                    candidates,\n                    require_fresh_evidence=self.require_fresh_evidence,\n                    query_fn=_query,\n                )\n                blocked_mutations = forced_snapshot.blocked_mutation_tools\n                if forced_name in blocked_mutations:\n                    raise ModelConfigurationError(\n                        "Host-forced source mutation reached a semantic fixed point "\n                        f"without workspace progress: {forced_name!r}."\n                    )\n            forced_schema = by_name.get(forced_name)\n''',
              'guard forced blocked mutation',
          )
          text = replace_once(
              text,
              '''            state = snapshot.state\n            goals = tuple(goals_for_query(snapshot.query))\n            names = executable_frontier(\n                candidates,\n                state=state,\n''',
              '''            state = snapshot.state\n            goals = tuple(goals_for_query(snapshot.query))\n            blocked_mutations = snapshot.blocked_mutation_tools\n            frontier_candidates = tuple(\n                schema for schema in candidates if _name(schema) not in blocked_mutations\n            )\n            names = executable_frontier(\n                frontier_candidates,\n                state=state,\n''',
              'filter semantic fixed-point routes',
          )
          text = replace_once(
              text,
              '''            selected = tuple(by_name[name] for name in names if name in by_name)\n            selected_names = tuple(_name(schema) for schema in selected)\n''',
              '''            selected = tuple(by_name[name] for name in names if name in by_name)\n            if not selected and blocked_mutations:\n                raise ModelConfigurationError(\n                    "Every causally reachable source-mutation route reached a semantic "\n                    "fixed point without workspace progress; refusing another retrieval/retry loop. "\n                    f"blocked={','.join(sorted(blocked_mutations))}"\n                )\n            selected_names = tuple(_name(schema) for schema in selected)\n''',
              'fail closed when no alternate causal route remains',
          )
          adapter_path.write_text(text)

          test_path = Path('tests/test_causal_state_ledger.py')
          tests = test_path.read_text()
          addition = r'''


def _safe_failed_patch(error: str = "SpecValidationError: anchor mismatch") -> dict:
    return {
        "role": "tool",
        "name": "apply_source_patch",
        "content": {"ok": False, "error": error},
    }


def _applied_patch() -> dict:
    return {
        "role": "tool",
        "name": "apply_source_patch",
        "content": {
            "ok": True,
            "_mmm_source_mutation": {
                "tool": "apply_source_patch",
                "status": "APPLIED_BY_HOST_RUNTIME",
            },
            "result": {"status": "APPLIED"},
        },
    }


def test_same_semantic_mutation_failure_recovers_then_blocks_without_global_round_cap() -> None:
    schemas = (_schema("search_code_rag"), _schema("apply_source_patch"))
    ledger = CausalStateLedger()
    messages = [{"role": "user", "content": "repair project"}, _rag_ok()]
    ledger.resolve(messages, schemas, require_fresh_evidence=True, query_fn=_query)

    messages = [*messages, _safe_failed_patch()]
    first = ledger.resolve(messages, schemas, require_fresh_evidence=True, query_fn=_query)
    assert "evidence_ready" in first.state
    assert first.blocked_mutation_tools == frozenset()

    messages = [*messages, _safe_failed_patch()]
    recovering = ledger.resolve(messages, schemas, require_fresh_evidence=True, query_fn=_query)
    assert "evidence_ready" not in recovering.state
    assert recovering.blocked_mutation_tools == frozenset()

    messages = [*messages, _rag_ok()]
    refreshed = ledger.resolve(messages, schemas, require_fresh_evidence=True, query_fn=_query)
    assert "evidence_ready" in refreshed.state
    assert refreshed.blocked_mutation_tools == frozenset()

    messages = [*messages, _safe_failed_patch()]
    fixed = ledger.resolve(messages, schemas, require_fresh_evidence=True, query_fn=_query)
    assert "evidence_ready" in fixed.state
    assert fixed.blocked_mutation_tools == frozenset({"apply_source_patch"})


def test_fresh_evidence_recovers_but_does_not_forget_safe_mutation_failure() -> None:
    schemas = (_schema("search_code_rag"), _schema("apply_source_patch"))
    ledger = CausalStateLedger()
    messages = [
        {"role": "user", "content": "repair project"},
        _rag_ok(),
        _safe_failed_patch(),
    ]
    first = ledger.resolve(messages, schemas, require_fresh_evidence=True, query_fn=_query)
    assert first.blocked_mutation_tools == frozenset()

    messages = [*messages, _rag_ok(), _safe_failed_patch()]
    fixed = ledger.resolve(messages, schemas, require_fresh_evidence=True, query_fn=_query)
    assert fixed.blocked_mutation_tools == frozenset({"apply_source_patch"})


def test_successful_source_mutation_clears_semantic_fixed_point_epoch() -> None:
    schemas = (_schema("search_code_rag"), _schema("apply_source_patch"))
    ledger = CausalStateLedger()
    messages = [
        {"role": "user", "content": "repair project"},
        _rag_ok(),
        _safe_failed_patch(),
        _rag_ok(),
        _safe_failed_patch(),
    ]
    fixed = ledger.resolve(messages, schemas, require_fresh_evidence=True, query_fn=_query)
    assert fixed.blocked_mutation_tools == frozenset({"apply_source_patch"})

    messages = [*messages, _applied_patch()]
    advanced = ledger.resolve(messages, schemas, require_fresh_evidence=True, query_fn=_query)
    assert advanced.blocked_mutation_tools == frozenset()
    assert "repair" in advanced.state
'''
          if 'test_same_semantic_mutation_failure_recovers_then_blocks_without_global_round_cap' in tests:
              raise SystemExit('semantic fixed-point tests already present')
          test_path.write_text(tests + addition)
          PY
      - name: Run focused regression tests
        run: python -m pytest tests/test_causal_state_ledger.py tests/test_agent_tool_round_liveness.py -q
      - name: Commit patch directly to main
        shell: bash
        run: |
          git config user.name "jujumelona"
          git config user.email "qasdaa025@gmail.com"
          git rm .github/workflows/mmm-semantic-fixed-point-patch-once.yml
          git add minecraft_mod_ai/causal_state_ledger.py minecraft_mod_ai/causal_frontier_adapter.py tests/test_causal_state_ledger.py
          git commit -m "fix(runtime): make mutation recovery semantic"
          git pull --rebase origin main
          git push origin HEAD:main
