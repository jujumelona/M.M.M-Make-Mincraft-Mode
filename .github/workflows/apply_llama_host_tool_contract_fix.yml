name: Apply llama host-tool contract fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply_llama_host_tool_contract_fix.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply product and regression patch
        run: python scripts/apply_llama_host_tool_contract_fix_v2.py
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Verify affected runtime contracts
        run: |
          python -m pytest -q \
            tests/test_llama_cpp_adapter_request_contract.py \
            tests/test_llama_structured_reasoning_policy.py \
            tests/test_runtime_json_gap_regression.py \
            tests/test_structured_output.py
          python -m compileall -q minecraft_mod_ai/model_adapters/llama_cpp_adapter.py minecraft_mod_ai/llama_server_hardware_policy.py
          git diff --check
      - name: Commit on latest main and push
        run: |
          git config user.name 'jujumelona'
          git config user.email 'qasdaa025@gmail.com'
          git rm \
            scripts/apply_llama_host_tool_contract_fix.py \
            scripts/apply_llama_host_tool_contract_fix_v2.py \
            .github/workflows/apply_llama_host_tool_contract_fix.yml
          git add \
            minecraft_mod_ai/model_adapters/llama_cpp_adapter.py \
            minecraft_mod_ai/llama_server_hardware_policy.py \
            tests/test_llama_cpp_adapter_request_contract.py \
            tests/test_llama_structured_reasoning_policy.py
          git commit -m 'Harden host-owned llama tool protocol'
          git fetch origin main
          git rebase origin/main
          python -m pytest -q \
            tests/test_llama_cpp_adapter_request_contract.py \
            tests/test_llama_structured_reasoning_policy.py \
            tests/test_runtime_json_gap_regression.py \
            tests/test_structured_output.py
          git push origin HEAD:main
      - name: Trigger full parallel CI on resulting main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" -f ref=main
