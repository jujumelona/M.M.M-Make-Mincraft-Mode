name: One Shot Current Head Regression Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-current-head-regression-repair.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-current-head-regression-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -q -e '.[dev]'
      - name: Apply current-head repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'expected block not found in {path}: {old[:120]!r}')
              text = text.replace(old, new, 1)
              write(path, text)

          # 1) Share assistant-prefill calibration across request-local adapters.
          replace_once(
              'minecraft_mod_ai/model_adapters/llama_cpp_adapter.py',
              'class LlamaCppAdapter(ModelAdapter):\n    """OpenAI-compatible client for the managed native llama-server."""\n',
              'class LlamaCppAdapter(ModelAdapter):\n    """OpenAI-compatible client for the managed native llama-server."""\n\n    # Cache is process/server-generation keyed, so request-local adapter instances can\n    # reuse the same calibrated Jinja suffix without stale cross-restart reuse.\n    _prefill_template_prefix_cache: dict[str, str] = {}\n',
          )

          # 2) Kernel winner must keep ubatch <= logical batch.
          replace_once(
              'minecraft_mod_ai/llama_server_kernel_autotune.py',
              '''            if explicit_batch is not None:\n                _replace_option(args, ("--batch-size", "-b"), str(explicit_batch))\n            elif active_batch:\n                _replace_option(args, ("--batch-size", "-b"), str(_int(active_batch, 2048)))\n\n            generic_kv = os.environ.get("MMM_KV_CACHE_QUANT", "").strip().lower()\n''',
              '''            if explicit_batch is not None:\n                _replace_option(args, ("--batch-size", "-b"), str(explicit_batch))\n            elif active_batch:\n                _replace_option(args, ("--batch-size", "-b"), str(_int(active_batch, 2048)))\n\n            # A selected logical batch is also a hard upper bound for ubatch. Keeping\n            # an inherited larger ubatch produces an invalid/overcommitted launch.\n            batch_flags = ("--batch-size", "-b")\n            ubatch_flags = ("--ubatch-size", "-ub")\n            batch_index = next((args.index(flag) for flag in batch_flags if flag in args), None)\n            ubatch_index = next((args.index(flag) for flag in ubatch_flags if flag in args), None)\n            if batch_index is not None and ubatch_index is not None:\n                effective_batch = _int(str(args[batch_index + 1]), 2048)\n                effective_ubatch = _int(str(args[ubatch_index + 1]), effective_batch)\n                if effective_ubatch > effective_batch:\n                    args[ubatch_index + 1] = str(effective_batch)\n\n            generic_kv = os.environ.get("MMM_KV_CACHE_QUANT", "").strip().lower()\n''',
          )

          # 3) Preserve maximum GPU offload; native --fit owns memory sizing.
          replace_once(
              'minecraft_mod_ai/llama_server_hardware_policy.py',
              '''    for option in ("--gpu-layers", "-ngl"):\n        if option in args:\n            index = args.index(option)\n            if index + 1 < len(args) and str(args[index + 1]).strip().casefold() == "all":\n                args[index + 1] = "auto"\n            break\n''',
              '''    # Preserve the caller's GPU offload policy. The canonical native launch uses\n    # --gpu-layers all together with --fit; rewriting it here silently reduces the\n    # throughput contract and conflicts with the autotune owner's launch semantics.\n''',
          )

          # 4) Stable forced-RAG error wording while retaining the same fail-closed behavior.
          p = 'minecraft_mod_ai/progress_aware_tool_loop.py'
          text = read(p)
          text = text.replace(
              "Production coder violated host-forced RAG tool choice {forced_rag_tool!r} ",
              "Production coder did not honor host-forced RAG tool choice {forced_rag_tool!r} ",
          )
          text = text.replace(
              "Production coder violated host-forced RAG tool choice {forced_rag_tool!r}; received {called}.",
              "Production coder did not honor host-forced RAG tool choice {forced_rag_tool!r}; received {called}.",
          )
          write(p, text)

          # 5) Restore semantic fixed-point pagination: repeated rows are convergence evidence,
          # not a reason for another model-owned coverage gate.
          p = 'minecraft_mod_ai/planning_state_resolution.py'
          text = read(p)
          text = text.replace(
              'from .planning_contract_ssot import (\n    REQUIREMENT_COVERAGE_SCHEMA,\n    SUBMIT_RESEARCHED_REQUIREMENTS_SCHEMA,\n)\n',
              'from .planning_contract_ssot import SUBMIT_RESEARCHED_REQUIREMENTS_SCHEMA\n',
              1,
          )
          start = text.index('def _generate_requirement_pages(')
          end = text.index('\ndef compile_researched_requirements(', start)
          function = '''def _generate_requirement_pages(router: Any, messages: list[dict[str, str]], budget: int) -> Any:\n    """Page requirements until the authored semantic frontier stops advancing."""\n    from .model_adapters import ModelConfigurationError\n\n    page_size = int(_REQUIREMENT_PARAMETERS["properties"]["requirements"]["maxItems"])\n    collected: list[dict[str, Any]] = []\n    seen: set[str] = set()\n    payload = json.loads(messages[1]["content"])\n    page_index = 0\n    while True:\n        current_messages = deepcopy(messages)\n        if collected:\n            current_messages[1]["content"] = json.dumps(\n                {**payload, "already_compiled_requirements": collected},\n                ensure_ascii=False,\n                separators=(",", ":"),\n            )\n            if sum(len(row["content"].encode("utf-8")) for row in current_messages) > budget:\n                raise ModelConfigurationError(\n                    "REQUIREMENT_PAGINATION_CONTEXT_EXHAUSTED: continuation cannot fit "\n                    "without losing authored task or prior requirement coverage"\n                )\n        try:\n            with planner_operation("researched_requirement_compile", output_tokens=2048):\n                raw = router.generate_tool_decision(\n                    "planner",\n                    current_messages,\n                    tool_name=_REQUIREMENT_TOOL,\n                    parameters=_REQUIREMENT_PARAMETERS,\n                    description="Submit the next page of independently testable player-visible requirements.",\n                )\n        except Exception as exc:\n            if not collected:\n                raise\n            raise ModelConfigurationError(\n                "REQUIREMENT_PAGINATION_FAILED: continuation failed; partial requirements are not complete"\n            ) from exc\n        rows = raw.get("requirements") if isinstance(raw, Mapping) else None\n        if not isinstance(rows, list):\n            if not collected:\n                return raw\n            raise ModelConfigurationError("REQUIREMENT_PAGINATION_FAILED: invalid continuation page")\n        emit_root_cause(\n            "planner_requirement_page_received",\n            stage="planning_state",\n            operation="researched_requirement_compile",\n            result="INFO",\n            details={"page_index": page_index + 1, "requirements": rows},\n        )\n\n        page_rows: list[dict[str, Any]] = []\n        page_seen: set[str] = set()\n        repeated_prior: list[dict[str, Any]] = []\n        for row in rows:\n            if not isinstance(row, Mapping) or not _text(row.get("statement")):\n                raise ModelConfigurationError("REQUIREMENT_PAGINATION_FAILED: invalid requirement row")\n            identity = json.dumps(\n                [\n                    _text(row.get("statement")).casefold(),\n                    _text(row.get("semantic_capability")).casefold(),\n                    [value.casefold() for value in _strings(row.get("acceptance"))],\n                ],\n                ensure_ascii=False,\n            )\n            if identity in seen or identity in page_seen:\n                repeated_prior.append(dict(row))\n                continue\n            page_seen.add(identity)\n            page_rows.append(dict(row))\n\n        page_index += 1\n        if not page_rows:\n            emit_root_cause(\n                "planner_requirement_page",\n                stage="planning_state",\n                operation="researched_requirement_compile",\n                result="COMPLETE",\n                reason="REQUIREMENT_SEMANTIC_FRONTIER_EXHAUSTED",\n                details={\n                    "page_index": page_index,\n                    "page_requirement_count": len(rows),\n                    "accepted_requirement_count": 0,\n                    "discarded_repeat_count": len(repeated_prior),\n                    "repeated_prior_requirements": repeated_prior,\n                    "total_requirement_count": len(collected),\n                    "requirements": rows,\n                },\n            )\n            return {"requirements": collected}\n\n        seen.update(page_seen)\n        collected.extend(page_rows)\n        page_full = len(rows) >= page_size\n        emit_root_cause(\n            "planner_requirement_page",\n            stage="planning_state",\n            operation="researched_requirement_compile",\n            result="CONTINUE" if page_full else "COMPLETE",\n            reason="REQUIREMENT_PAGE_FULL_CONTINUE" if page_full else "REQUIREMENT_PAGE_PARTIAL_COMPLETE",\n            details={\n                "page_index": page_index,\n                "page_requirement_count": len(rows),\n                "accepted_requirement_count": len(page_rows),\n                "discarded_repeat_count": len(repeated_prior),\n                "total_requirement_count": len(collected),\n                "requirements": rows,\n            },\n        )\n        if not page_full:\n            return {"requirements": collected}\n\n'''
          text = text[:start] + function + text[end + 1:]
          write(p, text)

          # 6) Preserve successful parallel work immediately, before a later sibling can fail.
          p = 'minecraft_mod_ai/deadline_executor.py'
          text = read(p)
          text = text.replace(
              '    sort_key: Callable[[_Item], object] | None = None,\n) -> list[tuple[_Item, _Result]]:',
              '    sort_key: Callable[[_Item], object] | None = None,\n    on_result: Callable[[_Item, _Result], None] | None = None,\n) -> list[tuple[_Item, _Result]]:',
              1,
          )
          text = text.replace(
              '                completed.append((meta.item, result))\n',
              '                if on_result is not None:\n                    on_result(meta.item, result)\n                completed.append((meta.item, result))\n',
              1,
          )
          text = text.replace(
              '    sort_key: Callable[[_Item], object] | None = None,\n) -> Iterator[tuple[_Item, _Result]]:',
              '    sort_key: Callable[[_Item], object] | None = None,\n    on_result: Callable[[_Item, _Result], None] | None = None,\n) -> Iterator[tuple[_Item, _Result]]:',
              1,
          )
          text = text.replace(
              '            sort_key=sort_key,\n        )\n',
              '            sort_key=sort_key,\n            on_result=on_result,\n        )\n',
              1,
          )
          write(p, text)

          p = 'minecraft_mod_ai/planning_state_adaptive_implementation.py'
          text = read(p)
          needle = '''        try:\n            completed_work = iter_completed_with_deadlines(\n                pending_items,\n                execute_work_item,\n                max_workers=workers,\n                stage="planning-artifact-monotone",\n                sort_key=lambda item: item[1:],\n            )\n'''
          replacement = '''        def checkpoint_completed_work(\n            work_item: tuple[str, int, str, int, str],\n            result_receipt: dict[str, Any],\n        ) -> None:\n            nonlocal working_state\n            kind_tag, job_index, artifact_kind, idx, step_id = work_item\n            job = jobs[job_index]\n            with state_lock:\n                if kind_tag == "artifact":\n                    normalized = _planning_only_artifact_receipt(result_receipt)\n                    working_state = _store_artifact_progress(\n                        working_state,\n                        requirement_ref=job["requirement_ref"],\n                        artifact_kind=artifact_kind,\n                        step_id=step_id,\n                        receipt=normalized,\n                    )\n                else:\n                    working_state = store_criterion_progress(\n                        working_state,\n                        requirement_ref=job["requirement_ref"],\n                        selected_sections=job["selected_sections"],\n                        criterion_index=idx,\n                        criterion=job["criteria"][idx],\n                        fragment=result_receipt,\n                    )\n                working_state = _checkpoint_state(working_state, checkpoint)\n\n        try:\n            completed_work = iter_completed_with_deadlines(\n                pending_items,\n                execute_work_item,\n                max_workers=workers,\n                stage="planning-artifact-monotone",\n                sort_key=lambda item: item[1:],\n                on_result=checkpoint_completed_work,\n            )\n'''
          if needle not in text:
              raise SystemExit('detailed planning executor block not found')
          text = text.replace(needle, replacement, 1)
          write(p, text)

          # 7) JDK discovery: preserve candidate order while probing expensive fallbacks in parallel.
          p = 'minecraft_mod_ai/java_lsp.py'
          text = read(p)
          text = text.replace(
              'import time\nfrom collections import deque\n',
              'import time\nfrom collections import deque\nfrom concurrent.futures import ThreadPoolExecutor\n',
              1,
          )
          marker = '\ndef _resolve_project_java_home(required_major: int | None = None) -> Path:\n'
          helper = '''\ndef _java_major_versions(java_homes: list[Path]) -> list[int | None]:\n    if not java_homes:\n        return []\n    workers = max(1, min(len(java_homes), os.cpu_count() or 1))\n    with ThreadPoolExecutor(max_workers=workers, thread_name_prefix="jdt-jdk-probe") as pool:\n        return list(pool.map(_java_major_version, java_homes))\n\n'''
          if marker not in text:
              raise SystemExit('java home resolver marker not found')
          text = text.replace(marker, helper + marker, 1)
          old = '''    seen: set[Path] = set()\n    observed: list[str] = []\n    for candidate in _candidate_java_homes(required):\n        try:\n            home = candidate.resolve(strict=True)\n        except OSError:\n            continue\n        if home in seen or not home.is_dir():\n            continue\n        seen.add(home)\n        major = _java_major_version(home)\n        if major is None:\n            continue\n        observed.append(f"{home}=>{major}")\n        if major == required:\n            return home\n'''
          new = '''    seen: set[Path] = set()\n    homes: list[Path] = []\n    for candidate in _candidate_java_homes(required):\n        try:\n            home = candidate.resolve(strict=True)\n        except OSError:\n            continue\n        if home in seen or not home.is_dir():\n            continue\n        seen.add(home)\n        homes.append(home)\n\n    observed: list[str] = []\n    for home, major in zip(homes, _java_major_versions(homes), strict=True):\n        if major is None:\n            continue\n        observed.append(f"{home}=>{major}")\n        if major == required:\n            return home\n'''
          if old not in text:
              raise SystemExit('java home serial probe block not found')
          text = text.replace(old, new, 1)
          write(p, text)

          # --- Tests: update only stale contracts; do not restore retired runtime behavior. ---

          # HostRunState now requires mutation arguments to own path/create tracking.
          p = 'tests/test_unified_host_execution_loop.py'
          text = read(p)
          text = text.replace(
              'state.record_mutation("apply_source_patch", failed_payload)',
              'state.record_mutation("apply_source_patch", {"operation": "replace", "path": "src/ModBlock.java"}, failed_payload)',
          )
          text = text.replace(
              'state.record_mutation("apply_source_patch", applied_payload)',
              'state.record_mutation("apply_source_patch", {"operation": "replace", "path": "src/ModBlock.java"}, applied_payload)',
          )
          text = text.replace(
              'state.record_mutation("apply_source_edit", unchanged)',
              'state.record_mutation("apply_source_edit", {"operation": "replace", "path": "src/ModBlock.java"}, unchanged)',
          )
          start = text.index('def test_wrong_source_edit_path_retries_pinned_act_without_rag()')
          end = text.index('\ndef test_distinct_contract_failures_do_not_fake_a_no_progress_fixed_point()', start)
          text = text[:start] + '''def test_wrong_source_edit_path_requires_outer_replan() -> None:\n    """A host-authority target drift is terminal for the already-executed action."""\n    router = MagicMock()\n    router._generation_scope.return_value = nullcontext()\n    router._agent_require_fresh_evidence = False\n    config = MagicMock(adapter="llama_cpp", max_context=16384, max_input_tokens=0, max_new_tokens=4096)\n    config.extra = {"runtime_contract": "qwen", "qwen_family": "qwen3.5"}\n    adapter = MagicMock()\n    adapter.generate_turn.return_value = GenerationResponse(\n        tool_calls=(ToolCall(\n            id="wrong_path",\n            name="apply_source_edit",\n            arguments={"operation": "create_file", "path": "src/Wrong.java", "content": "public class Wrong {}"},\n        ),)\n    )\n    runtime = MagicMock()\n    request = GenerationRequest(\n        messages=({"role": "user", "content": '{"phase":"implement_module","operation":"create_file","path":"src/Right.java"}'},),\n        tools=(_tool_schema("search_code_rag"), _tool_schema("apply_source_edit")),\n        tool_choice=None,\n        parallel_tool_calls=False,\n    )\n    with pytest.raises(ModelConfigurationError, match="POST_ARGUMENT_SEMANTIC_FAILURE: MUTATION_TARGET_DRIFT"):\n        generate_with_tools(router, config=config, adapter=adapter, request=request, runtime=runtime, stage="generation", role="coder")\n    runtime.call.assert_not_called()\n\n''' + text[end+1:]
          start = text.index('def test_distinct_contract_failures_do_not_fake_a_no_progress_fixed_point()')
          end = text.index('\ndef test_filter_tools_for_phase_hierarchical_localization_stages()', start)
          text = text[:start] + '''def test_phase_violation_can_retry_but_target_drift_requires_outer_replan() -> None:\n    router = MagicMock()\n    router._generation_scope.return_value = nullcontext()\n    router._agent_require_fresh_evidence = False\n    config = MagicMock(adapter="llama_cpp", max_context=16384, max_input_tokens=0, max_new_tokens=4096)\n    config.extra = {"runtime_contract": "qwen", "qwen_family": "qwen3.5"}\n    adapter = MagicMock()\n    adapter.generate_turn.side_effect = [\n        GenerationResponse(tool_calls=(ToolCall(id="phase_error", name="search_code_rag", arguments={"query": "wrong phase"}),)),\n        GenerationResponse(tool_calls=(ToolCall(id="target_error", name="apply_source_edit", arguments={"operation": "replace", "path": "src/Wrong.java", "content": "public class Wrong {}"}),)),\n    ]\n    runtime = MagicMock()\n    request = GenerationRequest(\n        messages=({"role": "user", "content": '{"phase":"implement_module","initial_exact_source_context":{"files":{"src/Right.java":"public class Right {}"}}}'},),\n        tools=(_tool_schema("search_code_rag"), _tool_schema("apply_source_edit")),\n        tool_choice=None,\n        parallel_tool_calls=False,\n    )\n    with pytest.raises(ModelConfigurationError, match="POST_ARGUMENT_SEMANTIC_FAILURE: MUTATION_TARGET_DRIFT"):\n        generate_with_tools(router, config=config, adapter=adapter, request=request, runtime=runtime, stage="generation", role="coder")\n    runtime.call.assert_not_called()\n\n''' + text[end+1:]
          write(p, text)

          # JDT scaling fake follows current constructor contract.
          replace_once(
              'tests/test_java_lsp_scaling.py',
              '    def __init__(self, command: list[str], cwd: Path) -> None:\n        self.command = command\n        self.cwd = cwd\n',
              '    def __init__(self, command: list[str], cwd: Path, configuration=None) -> None:\n        self.command = command\n        self.cwd = cwd\n        self.configuration = configuration\n',
          )

          # Creation conflicts are explicitly recoverable workspace-state conflicts.
          p = 'tests/test_mutation_semantic_boundary.py'
          text = read(p).replace('        "MUTATION_TARGET_CREATION_CONFLICT",\n', '', 1)
          write(p, text)

          # Retired external implementation-proof gate stays retired.
          p = 'tests/test_planning_candidate_evidence.py'
          text = read(p)
          start = text.index('def test_restored_false_complete_and_changed_requirement_cannot_enter_planner(')
          end = text.index('\ndef test_repository_projection_retains_evidence_beyond_preview()', start)
          text = text[:start] + '''def test_candidate_evidence_is_advisory_not_a_planner_authority_gate():\n    from minecraft_mod_ai import planning_candidate_evidence as candidate\n\n    assert not hasattr(candidate, "assert_candidate_research_complete")\n\n''' + text[end+1:]
          write(p, text)

          # Legacy implementation_method states are invalid rather than silently re-authorized.
          p = 'tests/test_planning_ssot_invariants.py'
          text = read(p)
          start = text.index('def test_implementation_only_unknown_does_not_block_requirement_selection():')
          end = text.index('\ndef test_state_integrity_rejects_unhashed_restored_state_mutation()', start)
          text = text[:start] + '''def test_legacy_implementation_research_unknown_is_rejected():\n    prompt = "Keep the weather compass."\n    state = _host_state(_Router([_payload()]), prompt)\n    state["unresolved"].append({\n        "unresolved_id": "u_001",\n        "question": "How is the compass implemented?",\n        "reason": "implementation_method",\n        "blocks": ["implementation_plan"],\n        "information_needed": "Concrete Minecraft implementation evidence.",\n        "resolution_route": "implementation_research",\n        "source_kinds": ["repository"],\n        "status": "open",\n    })\n    _rehash(state)\n    with pytest.raises(ValueError, match="unsupported reason 'implementation_method'"):\n        validate_planning_state(state, prompt=prompt)\n\n''' + text[end+1:]
          write(p, text)

          # Scheduler claim ownership is now explicit delegation in DurableWorkLedger.claim_ready.
          p = 'tests/test_scheduler_claim_install_identity.py'
          text = read(p)
          start = text.index('def test_install_reclaims_outermost_claim_after_wraps_copies_marker(')
          text = text[:start] + '''def test_install_preserves_explicit_orchestrator_claim_delegation(\n    tmp_path: Path,\n) -> None:\n    original = DurableWorkLedger.claim_ready\n    install(work_graph_module=work_graph_module, orchestrator_module=orchestrator_module)\n    assert DurableWorkLedger.claim_ready is original\n\n    plan = WorkGraphPlan(\n        schema_version="mmm/production-work-graph-v1",\n        proposal_hash="sha256:identity-delegation",\n        graph_hash="sha256:identity-delegation-graph",\n        module_count=0,\n        nodes=(\n            _node("a-content", "generate:content"),\n            _node("b-content", "generate:content"),\n            _node("c-system", "generate:system"),\n        ),\n    )\n    ledger = DurableWorkLedger(tmp_path / "identity.sqlite", proposal_hash=plan.proposal_hash)\n    ledger.sync_plan(plan)\n    stages = ("generate:content", "generate:system")\n    first = ledger.claim_ready("mmm-orchestrator", stages=stages, lease_seconds=60)\n    second = ledger.claim_ready("mmm-orchestrator", stages=stages, lease_seconds=60)\n    assert first is not None and first["node_id"] == "a-content"\n    assert second is not None and second["node_id"] == "c-system"\n    assert ledger.task("b-content")["state"] == "pending"\n'''
          write(p, text)

          # Skill contract currently supports planning+research and its reviewed tool surface changed.
          p = 'tests/test_skill_policy.py'
          text = read(p)
          text = text.replace('assert contract.stages == ("research",)', 'assert contract.stages == ("planning", "research")', 1)
          text = text.replace('    tool_anchor = "- retrieve_source_excerpt\\n"\n', '    tool_anchor = "- search_code_rag\\n"\n', 1)
          write(p, text)

          # Atomic coder fixture provides every hook the installer wraps.
          replace_once(
              'tests/test_small_model_atomic_coder_execution.py',
              '    custom = SimpleNamespace(\n        _coder_project_context_budget=lambda *a, **k: 4096,\n        _materialize_owned_reuse_context=lambda *a, **k: {},\n    )\n',
              '    custom = SimpleNamespace(\n        _coder_project_context_budget=lambda *a, **k: 4096,\n        _collect_initial_observations=lambda *a, **k: {},\n        _materialize_owned_reuse_context=lambda *a, **k: {},\n    )\n',
          )

          # mmm-planning is a current first-party registry server, not a stale alias.
          replace_once(
              'tests/test_agent_routing_contract.py',
              '        "mineflayer",\n        "mmm-planning",\n',
              '        "mineflayer",\n',
          )

          # Maximum GPU offload remains canonical.
          replace_once(
              'tests/test_llama_server_hardware_policy.py',
              '    assert result[result.index("--gpu-layers") + 1] == "auto"\n',
              '    assert result[result.index("--gpu-layers") + 1] == "all"\n',
          )

          # Verifier test boundary: project root and timeout are host-owned now.
          p = 'tests/test_space_progression_planner_and_verifier_regression.py'
          text = read(p)
          start = text.index('    steps = planning._semantic_steps("spacecraft.performance_upgrade", branches)')
          end = text.index('    gap = {', start)
          text = text[:start] + text[end:]
          text = text.replace(
              '''            assert arguments == {\n                "project_root": ".",\n                "relative_files": [capsule.primary_path],\n                "timeout_seconds": 60,\n            }\n''',
              '''            assert arguments == {\n                "relative_files": [capsule.primary_path],\n                "timeout_seconds": 90,\n            }\n''',
              1,
          )
          old = '''def test_agent_runtime_binds_diagnostics_to_the_actual_project_root(tmp_path: Path) -> None:\n    project = tmp_path / "project"\n    (project / "src/main/java/generated/mod").mkdir(parents=True)\n    (project / "build.gradle").write_text("plugins {}\\n", encoding="utf-8")\n    target = "src/main/java/generated/mod/ShipPerformance.java"\n    (project / target).write_text(\n        "package generated.mod; final class ShipPerformance {}\\n",\n        encoding="utf-8",\n    )\n    runtime = AgentToolRuntime(profile="test", workspace_root=tmp_path)\n    dispatched = []\n\n    def fake_run_async(function, *args):\n        dispatched.append((function.__name__, args))\n        return {"status": "PASS", "diagnostics": {}}\n\n    runtime._run_async = fake_run_async  # type: ignore[method-assign]\n    runtime.call(\n        "generation",\n        "java_diagnostics",\n        {\n            "project_root": "/hallucinated/project",\n            "relative_files": [target],\n            "diagnostics_config": {"allowlist": ["/wrong/.java"]},\n        },\n    )\n\n    assert len(dispatched) == 1\n    _function, (_stage, _name, arguments) = dispatched[0]\n    assert arguments == {\n        "project_root": str(project.resolve()),\n        "relative_files": [target],\n    }\n'''
          new = '''def test_agent_runtime_binds_diagnostics_to_the_actual_project_root(tmp_path: Path, monkeypatch) -> None:\n    from minecraft_mod_ai import java_lsp_trace\n\n    project = tmp_path / "project"\n    (project / "src/main/java/generated/mod").mkdir(parents=True)\n    (project / "build.gradle").write_text("plugins {}\\n", encoding="utf-8")\n    target = "src/main/java/generated/mod/ShipPerformance.java"\n    (project / target).write_text(\n        "package generated.mod; final class ShipPerformance {}\\n",\n        encoding="utf-8",\n    )\n    dispatched = []\n\n    class FakeJavaService:\n        def diagnostics(self, project_root, *, relative_files=None, timeout_seconds):\n            dispatched.append((Path(project_root).resolve(), list(relative_files or []), timeout_seconds))\n            return {"status": "PASS", "diagnostics": {}}\n\n        def close(self):\n            return None\n\n    monkeypatch.setattr(java_lsp_trace, "TracedJavaLanguageService", FakeJavaService)\n    runtime = AgentToolRuntime(profile="test", workspace_root=tmp_path)\n    runtime.call(\n        "generation",\n        "java_diagnostics",\n        {\n            "project_root": "/hallucinated/project",\n            "relative_files": [target],\n            "diagnostics_config": {"allowlist": ["/wrong/.java"]},\n        },\n    )\n\n    assert dispatched == [(project.resolve(), [target], 90)]\n'''
          if old not in text:
              raise SystemExit('old project-root verifier test block not found')
          text = text.replace(old, new, 1)
          write(p, text)

          # Hardware policy and fixed-point tests already encode the current desired outcomes.
          # Formatting/import cleanup for rewritten scheduler test.
          p = 'tests/test_scheduler_claim_install_identity.py'
          text = read(p).replace('from functools import wraps\n', '')
          write(p, text)

