name: Apply CI contract fixes once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-ci-contract-fixes-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply exact contract alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected source fragment missing: {path}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "minecraft_mod_ai/__init__.py",
              "from .fast_mode_quality_contract_installation import install as install_fast_mode_quality_contract\n",
              "",
          )
          replace_once(
              "minecraft_mod_ai/__init__.py",
              "\ninstall_fast_mode_quality_contract()\n",
              "\n",
          )
          replace_once(
              "minecraft_mod_ai/runtime_bootstrap.py",
              "    from .coder_max_efficiency_contract import install_coder_max_efficiency\n",
              "    from .coder_max_efficiency_contract import install_coder_max_efficiency\n"
              "    from .fast_mode_quality_contract_installation import install as install_fast_mode_quality_contract\n",
          )
          replace_once(
              "minecraft_mod_ai/runtime_bootstrap.py",
              "    install_coder_max_efficiency()\n",
              "    install_coder_max_efficiency()\n"
              "    install_fast_mode_quality_contract(custom_module_generator)\n",
          )
          replace_once(
              "minecraft_mod_ai/agent_capability_context.py",
              "_MAX_SKILL_DESCRIPTION_CHARS = 160\n",
              "_MAX_SKILL_DESCRIPTION_CHARS = 48\n",
          )

          skill_test = Path("tests/test_skill_catalog_reviewed_validators.py")
          skill_test.write_text(
              "from minecraft_mod_ai.skill_catalog import CANONICAL_SKILLS\n"
              "from tools.package_skills import build_payload\n\n\n"
              "def test_canonical_skill_catalog_compiles_under_reviewed_validator_policy() -> None:\n"
              "    payload = build_payload()\n\n"
              "    assert set(payload[\"contracts\"]) == set(CANONICAL_SKILLS)\n"
              "    assert set(payload[\"skills\"]) == set(CANONICAL_SKILLS)\n",
              encoding="utf-8",
          )

          replace_once(
              "tests/test_llama_parallel_runtime_contract.py",
              "    tool_result = router.generate_text(\n",
              "    tool_schema = {\n"
              "        \"type\": \"object\",\n"
              "        \"properties\": {\"status\": {\"type\": \"string\"}},\n"
              "        \"required\": [\"status\"],\n"
              "        \"additionalProperties\": False,\n"
              "    }\n"
              "    tool_result = router.generate_text(\n",
          )
          replace_once(
              "tests/test_llama_parallel_runtime_contract.py",
              "        response_format=\"json\",\n        tool_stage=\"generation\",\n        enable_tools=True,\n",
              "        response_format=\"json\",\n        response_schema=tool_schema,\n        tool_stage=\"generation\",\n        enable_tools=True,\n",
          )

          detail_test = Path("tests/test_planning_detail_applicability.py")
          detail_text = detail_test.read_text(encoding="utf-8")
          detail_text = detail_text.replace(
              '        "collect_planning_state_research",\n',
              '        "collect_planning_state_research_convergent",\n',
              1,
          )
          if detail_text.count('        "compile_detailed_implementation_plans",\n') != 2:
              raise SystemExit("expected two stale detailed-planner monkeypatch targets")
          detail_text = detail_text.replace(
              '        "compile_detailed_implementation_plans",\n',
              '        "compile_progress_monotone_detailed_plans",\n',
          )
          signature = (
              "        required_sections_by_requirement: dict[str, tuple[str, ...]],\n"
              "    ) -> dict[str, object]:\n"
          )
          if detail_text.count(signature) != 2:
              raise SystemExit("expected two stale detailed-planner stub signatures")
          detail_text = detail_text.replace(
              signature,
              "        required_sections_by_requirement: dict[str, tuple[str, ...]],\n"
              "        checkpoint: object = None,\n"
              "    ) -> dict[str, object]:\n",
          )
          detail_test.write_text(detail_text, encoding="utf-8")

          replace_once(
              "tests/test_llama_cpp_adapter_request_contract.py",
              '        lambda _url, payload: dict(payload),\n',
              '        lambda _url, payload, **_kwargs: dict(payload),\n',
          )
          adapter_test = Path("tests/test_llama_cpp_adapter_request_contract.py")
          adapter_text = adapter_test.read_text(encoding="utf-8")
          old_test = '''def test_apply_source_edit_action_alias_is_one_decode_local_recovery(monkeypatch) -> None:\n    posts = 0\n\n    def post(url, *, json, timeout):\n        nonlocal posts\n        posts += 1\n        return _CompletionResponse(\n            status_code=200,\n            payload={\n                "choices": [\n                    {\n                        "message": {\n                            "content": (\n                                "<tool_call><function=apply_source_edit>"\n                                "<parameter=action>replace_exact</parameter>"\n                                "<parameter=path>src/main/java/Example.java</parameter>"\n                                "</function></tool_call>"\n                            )\n                        }\n                    }\n                ]\n            },\n        )\n\n    monkeypatch.setattr(httpx, "post", post)\n\n    turn = _adapter().generate_turn(\n        GenerationRequest(\n            messages=({"role": "user", "content": "apply one edit"},),\n            tools=(_source_edit_tool(),),\n            tool_choice={\n                "type": "function",\n                "function": {"name": "apply_source_edit"},\n            },\n        )\n    )\n\n    assert posts == 1\n    assert len(turn.tool_calls) == 1\n    assert turn.tool_calls[0].arguments == {\n        "operation": "replace_exact",\n        "path": "src/main/java/Example.java",\n    }\n    assert "action" not in turn.tool_calls[0].arguments\n\n\n'''
          new_test = '''def test_apply_source_edit_uses_discriminator_then_operation_detail_recovery(monkeypatch) -> None:\n    from minecraft_mod_ai.source_edit_scalar_protocol_contract import SOURCE_EDIT_SCHEMA\n\n    replies = [\n        '{"operation":"replace_exact"}',\n        '{"path":"src/main/java/Example.java","old":"before();","new":"after();"}',\n    ]\n    posts: list[dict[str, object]] = []\n\n    def post(url, *, json, timeout):\n        del url, timeout\n        index = len(posts)\n        posts.append(dict(json))\n        return _CompletionResponse(\n            status_code=200,\n            payload={"choices": [{"message": {"content": replies[index]}}]},\n        )\n\n    monkeypatch.setattr(httpx, "post", post)\n    source_edit_tool = {\n        "type": "function",\n        "function": {\n            "name": "apply_source_edit",\n            "description": "apply one exact source edit",\n            "parameters": SOURCE_EDIT_SCHEMA,\n        },\n    }\n\n    turn = _adapter().generate_turn(\n        GenerationRequest(\n            messages=({"role": "user", "content": "apply one edit"},),\n            tools=(source_edit_tool,),\n            tool_choice={\n                "type": "function",\n                "function": {"name": "apply_source_edit"},\n            },\n        )\n    )\n\n    assert len(posts) == 2\n    assert len(turn.tool_calls) == 1\n    assert turn.tool_calls[0].arguments == {\n        "operation": "replace_exact",\n        "path": "src/main/java/Example.java",\n        "old": "before();",\n        "new": "after();",\n    }\n\n\n'''
          if old_test not in adapter_text:
              raise SystemExit("stale one-decode source-edit test body missing")
          adapter_test.write_text(adapter_text.replace(old_test, new_test, 1), encoding="utf-8")

          progress = Path("tests/test_planning_progress_monotone.py")
          text = progress.read_text(encoding="utf-8")
          anchor = "from minecraft_mod_ai import planning_state_adaptive_implementation as adaptive\n"
          if anchor not in text:
              raise SystemExit("planning progress import anchor missing")
          text = text.replace(
              anchor,
              anchor + "from minecraft_mod_ai.planning_detail_template import WORKSHEET_SECTIONS\n",
              1,
          )
          if "adaptive.WORKSHEET_SECTIONS" not in text:
              raise SystemExit("planning progress legacy worksheet owner missing")
          text = text.replace("adaptive.WORKSHEET_SECTIONS", "WORKSHEET_SECTIONS")
          progress.write_text(text, encoding="utf-8")
          PY
      - name: Install CI environment
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Verify focused regressions
        run: >-
          python -m pytest -q
          tests/test_runtime_bootstrap_clean.py
          tests/test_llama_parallel_runtime_contract.py
          tests/test_agent_capability_context.py
          tests/test_planning_detail_applicability.py
          tests/test_llama_cpp_adapter_request_contract.py
          tests/test_native_atomic_argument_recovery.py
          tests/test_planning_progress_monotone.py
          tests/test_skill_catalog_reviewed_validators.py
      - name: Commit verified fixes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-ci-contract-fixes-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft_mod_ai/__init__.py minecraft_mod_ai/runtime_bootstrap.py minecraft_mod_ai/agent_capability_context.py tests/test_skill_catalog_reviewed_validators.py tests/test_llama_parallel_runtime_contract.py tests/test_agent_capability_context.py tests/test_planning_detail_applicability.py tests/test_llama_cpp_adapter_request_contract.py tests/test_native_atomic_argument_recovery.py tests/test_planning_progress_monotone.py
          git commit -m "fix: align runtime and test contract ownership"
          git push origin HEAD:main
