name: Apply CI contract fixes once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-ci-contract-fixes-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply exact contract alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected source fragment missing: {path}: {old!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "minecraft_mod_ai/__init__.py",
              "from .fast_mode_quality_contract_installation import install as install_fast_mode_quality_contract\n",
              "",
          )
          replace_once(
              "minecraft_mod_ai/__init__.py",
              "\ninstall_fast_mode_quality_contract()\n",
              "\n",
          )
          replace_once(
              "minecraft_mod_ai/runtime_bootstrap.py",
              "    from .coder_max_efficiency_contract import install_coder_max_efficiency\n",
              "    from .coder_max_efficiency_contract import install_coder_max_efficiency\n"
              "    from .fast_mode_quality_contract_installation import install as install_fast_mode_quality_contract\n",
          )
          replace_once(
              "minecraft_mod_ai/runtime_bootstrap.py",
              "    install_coder_max_efficiency()\n",
              "    install_coder_max_efficiency()\n"
              "    install_fast_mode_quality_contract(custom_module_generator)\n",
          )

          skill_test = Path("tests/test_skill_catalog_reviewed_validators.py")
          skill_test.write_text(
              "from minecraft_mod_ai.skill_catalog import CANONICAL_SKILLS\n"
              "from tools.package_skills import build_payload\n\n\n"
              "def test_canonical_skill_catalog_compiles_under_reviewed_validator_policy() -> None:\n"
              "    payload = build_payload()\n\n"
              "    assert set(payload[\"contracts\"]) == set(CANONICAL_SKILLS)\n"
              "    assert set(payload[\"skills\"]) == set(CANONICAL_SKILLS)\n",
              encoding="utf-8",
          )

          replace_once(
              "tests/test_llama_parallel_runtime_contract.py",
              "    tool_result = router.generate_text(\n",
              "    tool_schema = {\n"
              "        \"type\": \"object\",\n"
              "        \"properties\": {\"status\": {\"type\": \"string\"}},\n"
              "        \"required\": [\"status\"],\n"
              "        \"additionalProperties\": False,\n"
              "    }\n"
              "    tool_result = router.generate_text(\n",
          )
          replace_once(
              "tests/test_llama_parallel_runtime_contract.py",
              "        response_format=\"json\",\n        tool_stage=\"generation\",\n        enable_tools=True,\n",
              "        response_format=\"json\",\n        response_schema=tool_schema,\n        tool_stage=\"generation\",\n        enable_tools=True,\n",
          )

          replace_once(
              "tests/test_planning_detail_applicability.py",
              '        "collect_planning_state_research",\n',
              '        "collect_planning_state_research_convergent",\n',
          )
          replace_once(
              "tests/test_llama_cpp_adapter_request_contract.py",
              '        lambda _url, payload: dict(payload),\n',
              '        lambda _url, payload, **_kwargs: dict(payload),\n',
          )

          progress = Path("tests/test_planning_progress_monotone.py")
          text = progress.read_text(encoding="utf-8")
          anchor = "from minecraft_mod_ai import planning_state_adaptive_implementation as adaptive\n"
          if anchor not in text:
              raise SystemExit("planning progress import anchor missing")
          text = text.replace(
              anchor,
              anchor + "from minecraft_mod_ai.planning_detail_template import WORKSHEET_SECTIONS\n",
              1,
          )
          if "adaptive.WORKSHEET_SECTIONS" not in text:
              raise SystemExit("planning progress legacy worksheet owner missing")
          text = text.replace("adaptive.WORKSHEET_SECTIONS", "WORKSHEET_SECTIONS")
          progress.write_text(text, encoding="utf-8")
          PY
      - name: Install CI environment
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Verify focused regressions
        run: >-
          python -m pytest -q
          tests/test_runtime_bootstrap_clean.py
          tests/test_llama_parallel_runtime_contract.py
          tests/test_planning_detail_applicability.py
          tests/test_llama_cpp_adapter_request_contract.py
          tests/test_planning_progress_monotone.py
          tests/test_skill_catalog_reviewed_validators.py
      - name: Commit verified fixes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/apply-ci-contract-fixes-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft_mod_ai/__init__.py minecraft_mod_ai/runtime_bootstrap.py tests/test_skill_catalog_reviewed_validators.py tests/test_llama_parallel_runtime_contract.py tests/test_planning_detail_applicability.py tests/test_llama_cpp_adapter_request_contract.py tests/test_planning_progress_monotone.py
          git commit -m "fix: align runtime and test contract ownership"
          git push origin HEAD:main
