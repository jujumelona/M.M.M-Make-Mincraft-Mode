name: Production integration

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Reviewed integration stage
        required: true
        type: choice
        options: [models, runtime, blockbench, complete, all]
        default: models
      model_profile:
        description: Model registry profile
        required: true
        default: t4_local

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,ui]'
      - run: python -m compileall -q minecraft_mod_ai tests tools download_resources.py
      - run: python tools/validate_colab_notebook.py
      - run: pytest -q

  model-smoke:
    if: inputs.stage == 'models' || inputs.stage == 'all'
    needs: contracts
    runs-on: [self-hosted, linux, x64, gpu, t4]
    timeout-minutes: 180
    env:
      MMM_MODEL_PROFILE: ${{ inputs.model_profile }}
      MMM_WORKSPACE: ${{ github.workspace }}/integration-output
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -e '.[local-model,rag,image,speech,training,production-audio]'
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from minecraft_mod_ai.model_smoke import run_model_smoke
          roles = ["planner", "researcher", "coder_safe", "coder", "embedding", "reranker", "visual_critic", "image_generator", "speech_recognition"]
          out = Path("integration-output/model-smoke")
          reports = [run_model_smoke(role=role, profile="${{ inputs.model_profile }}", output_dir=out / role) for role in roles]
          out.mkdir(parents=True, exist_ok=True)
          (out / "all-results.json").write_text(json.dumps(reports, indent=2), encoding="utf-8")
          failed = [report for report in reports if report.get("status") != "PASS"]
          if failed:
              raise SystemExit("Model smoke failures: " + ", ".join(report["role"] for report in failed))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t4-model-smoke
          path: integration-output/model-smoke/
          if-no-files-found: error

  runtime:
    if: inputs.stage == 'runtime' || inputs.stage == 'all'
    needs: contracts
    runs-on: [self-hosted, linux, x64, minecraft-1201]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -e '.[dev,ui]'
      - name: Verify reviewed prerequisites
        run: |
          test -n "${MMM_TEST_MOD_JAR:-}" || { echo "MMM_TEST_MOD_JAR is required"; exit 2; }
          test -n "${MMM_FABRIC_SERVER_LAUNCHER:-}" || { echo "MMM_FABRIC_SERVER_LAUNCHER is required"; exit 2; }
          test "${MMM_EULA_ACCEPTED:-false}" = "true" || { echo "Explicit EULA acceptance required"; exit 2; }
      - run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from minecraft_mod_ai.runtime_manager import MinecraftRuntimeManager
          workspace = Path("integration-output").resolve()
          inputs = workspace / "integration-inputs"
          inputs.mkdir(parents=True, exist_ok=True)
          mod = inputs / "test-mod.jar"
          launcher = inputs / "fabric-server-launch.jar"
          shutil.copy2(os.environ["MMM_TEST_MOD_JAR"], mod)
          shutil.copy2(os.environ["MMM_FABRIC_SERVER_LAUNCHER"], launcher)
          manager = MinecraftRuntimeManager(workspace)
          result = {}
          try:
              result = {
                  "prepared": manager.prepare_instance("runtime-integration", mod_jar=mod, server_launcher=launcher, eula_accepted=True),
                  "started": manager.start_server(timeout_seconds=180),
                  "status": manager.status(),
              }
          finally:
              result["cleanup"] = manager.cleanup()
          Path("runtime-result.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minecraft-runtime-evidence
          path: |
            runtime-result.json
            integration-output/
          if-no-files-found: warn

  blockbench:
    if: inputs.stage == 'blockbench' || inputs.stage == 'all'
    needs: contracts
    runs-on: [self-hosted, linux, x64, blockbench]
    timeout-minutes: 60
    env:
      MMM_BLOCKBENCH_MCP_URL: http://127.0.0.1:3000/bb-mcp
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -e '.[dev,ui]'
      - run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from minecraft_mod_ai.blockbench_client import BlockbenchMCPClient
          client = BlockbenchMCPClient()
          try:
              result = {"available_tools": client.list_tools()}
          finally:
              client.close()
          Path("blockbench-result.json").write_text(json.dumps(result, indent=2), encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blockbench-evidence
          path: blockbench-result.json
          if-no-files-found: error

  complete:
    if: inputs.stage == 'complete' || inputs.stage == 'all'
    needs: contracts
    runs-on: [self-hosted, linux, x64, gpu, t4, minecraft-1201, blockbench]
    timeout-minutes: 300
    env:
      MMM_MODEL_PROFILE: ${{ inputs.model_profile }}
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -e '.[dev,ui,local-model,rag,image,speech,training,production-audio]'
      - name: Verify full-run inputs
        run: |
          test -n "${MMM_COMPLETE_PROPOSAL_PATH:-}" || { echo "MMM_COMPLETE_PROPOSAL_PATH is required"; exit 2; }
          test -n "${MMM_FABRIC_SERVER_LAUNCHER:-}" || { echo "MMM_FABRIC_SERVER_LAUNCHER is required"; exit 2; }
          test -n "${MMM_COMPLETE_APPROVAL_HASH:-}" || { echo "MMM_COMPLETE_APPROVAL_HASH is required"; exit 2; }
          test "${MMM_EULA_ACCEPTED:-false}" = "true" || { echo "Explicit EULA acceptance required"; exit 2; }
      - name: Execute approved complete graph
        run: |
          mmm execute "$MMM_COMPLETE_PROPOSAL_PATH" \
            --approve "$MMM_COMPLETE_APPROVAL_HASH" \
            --profile "$MMM_MODEL_PROFILE" \
            --output integration-output \
            --run-name complete-integration \
            --server-launcher "$MMM_FABRIC_SERVER_LAUNCHER" \
            --accept-eula \
            ${MMM_COMPLETE_SCREENSHOT:+--screenshot "$MMM_COMPLETE_SCREENSHOT"} \
            > complete-result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-production-evidence
          path: |
            complete-result.json
            integration-output/
          if-no-files-found: error
