name: Rewrite tool admission once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: rewrite-tool-admission-once
  cancel-in-progress: false

jobs:
  rewrite:
    if: github.event.head_commit.message == 'Align admission compatibility tests'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Fetch audited rewrite programs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          programs = {
              '08960ecef57852b63cb6e1e3f5a752596a87cc2c': '/tmp/rewrite_tool_admission.py',
              'e89ea38f6d1f580d412b1c9091b2675e796c6966': '/tmp/migrate_legacy_tool_tests.py',
              '7c83b298cda94e53265d8a2ed886e7b87a17d49d': '/tmp/normalize_tool_admission.py',
              '01b8bb3b96c1da58681d64db6904ada4354f63b2': '/tmp/migrate_remaining_tool_tests.py',
              '79715e7e2703c9183b3daf8869362c6567db8da6': '/tmp/fix_source_mutation_lint.py',
              '90890adcc82784b59c14ab39683c1c8aab0879ac': '/tmp/fix_qwen_malformed_span.py',
              '93110e13693f3c82ecf620f33ef8e303be2f7752': '/tmp/move_qwen_compat_to_admission.py',
              '2685f09987294e0bb7f8d3a8350d2159d8a95b71': '/tmp/fix_admission_conflict_lint.py',
              'a21e64c2b6d5286c906b33a2e7ee56c607183f7c': '/tmp/align_admission_tests.py',
          }
          for sha, destination in programs.items():
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={
                      'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              if payload.get('encoding') != 'base64':
                  raise SystemExit(f'unexpected blob encoding for {sha}: {payload.get("encoding")!r}')
              program = base64.b64decode(payload['content'])
              open(destination, 'wb').write(program)
              print(f'fetched {sha} -> {destination}: {len(program)} bytes')
          PY
      - name: Apply single-boundary rewrite
        run: python /tmp/rewrite_tool_admission.py
      - name: Migrate legacy tool contract tests
        run: python /tmp/migrate_legacy_tool_tests.py
      - name: Normalize implementation and policy contracts
        run: python /tmp/normalize_tool_admission.py
      - name: Migrate remaining parser-owner contracts
        run: python /tmp/migrate_remaining_tool_tests.py
      - name: Narrow source patch exception assertion
        run: python /tmp/fix_source_mutation_lint.py
      - name: Fix malformed Qwen wrapper span
        run: python /tmp/fix_qwen_malformed_span.py
      - name: Move Qwen compatibility into admission
        run: python /tmp/move_qwen_compat_to_admission.py
      - name: Fix admission conflict lint
        run: python /tmp/fix_admission_conflict_lint.py
      - name: Align admission compatibility tests
        run: python /tmp/align_admission_tests.py
      - name: Apply repository formatting fixes
        run: |
          ruff check --fix --exit-zero \
            minecraft_mod_ai/model_adapters/qwen_tool_parser.py \
            minecraft_mod_ai/model_adapters/llama_cpp_adapter.py \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            tests/test_tool_call_admission_contract.py \
            tests/test_llama_cpp_adapter_tool_policy.py \
            tests/test_llama_cpp_native_tool_call_contract.py \
            tests/test_llama_qwen_tool_recovery.py \
            tests/test_production_tool_call_isolation_contract.py \
            tests/test_qwen_enum_recovery_contract.py \
            tests/test_qwen_required_alias_contract.py \
            tests/test_qwen_tool_parser_sibling_isolation.py \
            tests/test_qwen_parser_single_owner.py \
            tests/test_source_mutation_workspace_impact.py \
            tests/test_qwen_apply_source_edit_alias.py \
            tests/test_qwen_tool_host_metadata.py \
            tests/test_qwen_official_spec_matrix.py
      - name: Structural guard
        run: |
          set -euo pipefail
          if grep -q 'ToolCallValidationError' minecraft_mod_ai/model_adapters/qwen_tool_parser.py; then exit 1; fi
          if grep -q 'MMM_MINECRAFT_VERSION' minecraft_mod_ai/model_adapters/qwen_tool_parser.py; then exit 1; fi
          if grep -q 'SOURCE_EDIT_PARAMETER_ALIASES' minecraft_mod_ai/model_adapters/qwen_tool_parser.py; then exit 1; fi
          if grep -q '_validate_decoded_value' minecraft_mod_ai/model_adapters/qwen_tool_parser.py; then exit 1; fi
          if grep -q 'additionalProperties' minecraft_mod_ai/model_adapters/qwen_tool_parser.py; then exit 1; fi
          grep -q '_admit_model_tool_calls' minecraft_mod_ai/model_adapters/llama_cpp_adapter.py
          grep -q '_normalize_admission_arguments' minecraft_mod_ai/model_adapters/llama_cpp_adapter.py
          grep -q 'raw_native_calls = _raw_native_tool_calls(message)' minecraft_mod_ai/model_adapters/llama_cpp_adapter.py
          grep -q '_model_tool_rejection_feedback' minecraft_mod_ai/progress_aware_tool_loop.py
          python - <<'PY'
          import ast
          from pathlib import Path

          forbidden = {'ToolCallValidationError', '_canonical_string_enum', '_parse_qwen_function'}
          offenders = []
          for path in Path('tests').glob('test_*.py'):
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              for node in ast.walk(tree):
                  if isinstance(node, ast.ImportFrom) and node.module == 'minecraft_mod_ai.model_adapters.qwen_tool_parser':
                      names = {alias.name for alias in node.names}
                      bad = sorted(names & forbidden)
                      if bad:
                          offenders.append((str(path), bad))
          if offenders:
              raise SystemExit(f'legacy qwen parser imports remain: {offenders}')
          PY
      - name: Compile rewritten Python
        run: |
          python -m compileall -q \
            minecraft_mod_ai/model_adapters/qwen_tool_parser.py \
            minecraft_mod_ai/model_adapters/llama_cpp_adapter.py \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            tests/test_tool_call_admission_contract.py \
            tests/test_llama_cpp_adapter_tool_policy.py \
            tests/test_llama_cpp_native_tool_call_contract.py \
            tests/test_llama_qwen_tool_recovery.py \
            tests/test_production_tool_call_isolation_contract.py \
            tests/test_qwen_enum_recovery_contract.py \
            tests/test_qwen_required_alias_contract.py \
            tests/test_qwen_tool_parser_sibling_isolation.py \
            tests/test_qwen_parser_single_owner.py \
            tests/test_source_mutation_workspace_impact.py \
            tests/test_qwen_apply_source_edit_alias.py \
            tests/test_qwen_tool_host_metadata.py \
            tests/test_qwen_official_spec_matrix.py
      - name: Ruff rewritten Python
        run: |
          ruff check \
            minecraft_mod_ai/model_adapters/qwen_tool_parser.py \
            minecraft_mod_ai/model_adapters/llama_cpp_adapter.py \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            tests/test_tool_call_admission_contract.py \
            tests/test_llama_cpp_adapter_tool_policy.py \
            tests/test_llama_cpp_native_tool_call_contract.py \
            tests/test_llama_qwen_tool_recovery.py \
            tests/test_production_tool_call_isolation_contract.py \
            tests/test_qwen_enum_recovery_contract.py \
            tests/test_qwen_required_alias_contract.py \
            tests/test_qwen_tool_parser_sibling_isolation.py \
            tests/test_qwen_parser_single_owner.py \
            tests/test_source_mutation_workspace_impact.py \
            tests/test_qwen_apply_source_edit_alias.py \
            tests/test_qwen_tool_host_metadata.py \
            tests/test_qwen_official_spec_matrix.py
      - name: Run blocking admission contracts
        run: |
          pytest -q \
            tests/test_tool_call_admission_contract.py \
            tests/test_llama_cpp_adapter_tool_policy.py \
            tests/test_llama_cpp_native_tool_call_contract.py \
            tests/test_llama_qwen_tool_recovery.py \
            tests/test_production_tool_call_isolation_contract.py \
            tests/test_qwen_enum_recovery_contract.py \
            tests/test_qwen_required_alias_contract.py \
            tests/test_qwen_tool_parser_sibling_isolation.py \
            tests/test_qwen_parser_single_owner.py \
            tests/test_qwen_apply_source_edit_alias.py \
            tests/test_qwen_tool_host_metadata.py \
            tests/test_qwen_official_spec_matrix.py \
            tests/test_source_mutation_workspace_impact.py::test_model_tool_admission_rejects_non_enum_operation_aliases
      - name: Inventory broader legacy regressions
        continue-on-error: true
        run: pytest -q tests -k 'qwen or llama_cpp or tool_call or tool_validation'
      - name: Commit rewritten implementation to main
        run: |
          set -euo pipefail
          git add \
            minecraft_mod_ai/model_adapters/qwen_tool_parser.py \
            minecraft_mod_ai/model_adapters/llama_cpp_adapter.py \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            tests/test_tool_call_admission_contract.py \
            tests/test_llama_cpp_adapter_tool_policy.py \
            tests/test_llama_cpp_native_tool_call_contract.py \
            tests/test_llama_qwen_tool_recovery.py \
            tests/test_production_tool_call_isolation_contract.py \
            tests/test_qwen_enum_recovery_contract.py \
            tests/test_qwen_required_alias_contract.py \
            tests/test_qwen_tool_parser_sibling_isolation.py \
            tests/test_qwen_parser_single_owner.py \
            tests/test_source_mutation_workspace_impact.py \
            tests/test_qwen_apply_source_edit_alias.py \
            tests/test_qwen_tool_host_metadata.py \
            tests/test_qwen_official_spec_matrix.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Rewrite tool-call admission as single boundary'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
