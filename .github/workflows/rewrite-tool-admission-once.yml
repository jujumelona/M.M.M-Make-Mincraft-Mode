name: Rewrite tool admission once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: rewrite-tool-admission-once
  cancel-in-progress: false

jobs:
  rewrite:
    if: github.event.head_commit.message == 'Bootstrap single-boundary tool admission rewrite'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Fetch audited rewrite program
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          sha = '08960ecef57852b63cb6e1e3f5a752596a87cc2c'
          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
              headers={
                  'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)
          if payload.get('encoding') != 'base64':
              raise SystemExit(f'unexpected blob encoding: {payload.get("encoding")!r}')
          program = base64.b64decode(payload['content'])
          open('/tmp/rewrite_tool_admission.py', 'wb').write(program)
          print(f'fetched rewrite blob {sha}: {len(program)} bytes')
          PY
      - name: Apply clean rewrite
        run: python /tmp/rewrite_tool_admission.py
      - name: Structural guard
        run: |
          set -euo pipefail
          ! grep -q 'ToolCallValidationError' minecraft_mod_ai/model_adapters/qwen_tool_parser.py
          ! grep -q 'MMM_MINECRAFT_VERSION' minecraft_mod_ai/model_adapters/qwen_tool_parser.py
          ! grep -q 'SOURCE_EDIT_PARAMETER_ALIASES' minecraft_mod_ai/model_adapters/qwen_tool_parser.py
          ! grep -q '_validate_decoded_value' minecraft_mod_ai/model_adapters/qwen_tool_parser.py
          ! grep -q 'additionalProperties' minecraft_mod_ai/model_adapters/qwen_tool_parser.py
          grep -q '_admit_model_tool_calls' minecraft_mod_ai/model_adapters/llama_cpp_adapter.py
          grep -q '_model_tool_rejection_feedback' minecraft_mod_ai/progress_aware_tool_loop.py
      - name: Compile changed Python
        run: python -m compileall -q minecraft_mod_ai/model_adapters/qwen_tool_parser.py minecraft_mod_ai/model_adapters/llama_cpp_adapter.py minecraft_mod_ai/progress_aware_tool_loop.py tests/test_tool_call_admission_contract.py
      - name: Run admission contract tests
        run: pytest -q tests/test_tool_call_admission_contract.py
      - name: Run related regression tests
        run: pytest -q tests -k 'qwen or llama_cpp or tool_call or tool_validation' --maxfail=1
      - name: Commit rewritten implementation to main
        run: |
          set -euo pipefail
          git rm .github/workflows/rewrite-tool-admission-once.yml
          git add -A minecraft_mod_ai/model_adapters/qwen_tool_parser.py minecraft_mod_ai/model_adapters/llama_cpp_adapter.py minecraft_mod_ai/progress_aware_tool_loop.py tests/test_tool_call_admission_contract.py .github/workflows/rewrite-tool-admission-once.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Rewrite tool-call admission as single boundary'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
