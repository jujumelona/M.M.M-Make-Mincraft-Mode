name: One-shot planner CI repair v4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-planner-ci-repair-v4.yml

permissions:
  contents: write
  actions: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test and audit dependencies
        run: python -m pip install --prefer-binary -e ".[dev]"

      - name: Apply corrected product repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/one-shot-planner-ci-repair-v3.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['repair']['steps']
          apply_script = next(step['run'] for step in steps if step.get('name') == 'Apply anchored product repair')
          subprocess.run(['bash', '-c', 'set -euo pipefail\n' + apply_script], check=True)

          # v3's generated policy file had only one defect: line 1 was already at column 0,
          # so textwrap.dedent left every later top-level line indented by four spaces.
          # Normalize that generated file before compilation/tests.
          policy = Path('minecraft_mod_ai/verifier_runtime_policy.py')
          lines = policy.read_text(encoding='utf-8').splitlines(keepends=True)
          if not lines or not lines[0].startswith('"""Host-owned verifier/recovery policy helpers.'):
              raise SystemExit('unexpected verifier_runtime_policy.py shape after v3 recipe')
          normalized = [lines[0]]
          normalized.extend(line[4:] if line.startswith('    ') else line for line in lines[1:])
          policy.write_text(''.join(normalized), encoding='utf-8')
          PY

      - name: Verify focused regressions and architecture
        shell: bash
        env:
          BASE_SHA: 9c1a538b3c0d9062356e6192bf991e7ce2cc8f53
        run: |
          set -euo pipefail
          python -m py_compile \
            minecraft_mod_ai/fixed_template_generation.py \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            minecraft_mod_ai/verifier_runtime_policy.py \
            minecraft_mod_ai/runner_target_java_contract.py
          pytest -q \
            tests/test_planning_criterion_fragment_repair.py \
            tests/test_planning_detail_runtime_selection.py \
            tests/test_parallel_validation_target_java.py \
            tests/test_progress_aware_verifier_recovery.py
          mapfile -t FIXED_TESTS < <(find tests -maxdepth 1 -type f -name '*fixed*template*.py' -print | sort)
          if (( ${#FIXED_TESTS[@]} )); then
            pytest -q "${FIXED_TESTS[@]}"
          fi
          git fetch --no-tags origin "$BASE_SHA"
          python .github/scripts/audit_code_quality_regression.py \
            --base-ref "$BASE_SHA" \
            --output /tmp/code-quality-regression.json

      - name: Commit verified repair to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "main moved during repair; refusing non-fast-forward write" >&2
            exit 75
          fi
          git rm -f \
            .github/workflows/one-shot-planner-ci-repair.yml \
            .github/workflows/one-shot-planner-ci-repair-v2.yml \
            .github/workflows/one-shot-planner-ci-repair-v3.yml \
            .github/workflows/one-shot-planner-ci-repair-v4.yml
          git config user.name "juju"
          git config user.email "qasdaa025@gmail.com"
          git add minecraft_mod_ai tests
          git diff --cached --check
          git commit -m "fix planner CI regressions without expanding work"
          git push origin HEAD:main
