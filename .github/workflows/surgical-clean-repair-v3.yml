name: surgical-clean-repair-v3
on:
  push:
    paths: ['.github/workflows/surgical-clean-repair-v3.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Apply verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          START="$(git rev-parse HEAD)"
          python - <<'PY'
          from pathlib import Path
          import yaml
          data = yaml.safe_load(Path('.github/workflows/surgical-clean-repair-v2.yml').read_text(encoding='utf-8'))
          steps = data['jobs']['repair']['steps']
          script = next(step['run'] for step in steps if step.get('name') == 'Restore healthy source and apply AST-safe cleanup')
          marker = 'python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9 --fix'
          Path('/tmp/transform.sh').write_text(script[:script.index(marker)], encoding='utf-8')
          PY
          bash /tmp/transform.sh
          python - <<'PY'
          import ast
          from pathlib import Path
          p = Path('minecraft_mod_ai/technology_radar.py')
          tree = ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
          class Cleaner(ast.NodeTransformer):
              def visit_Assign(self, node):
                  if any(isinstance(t, ast.Name) and t.id == 'voice_components' for t in node.targets):
                      return None
                  return self.generic_visit(node)
              def visit_AnnAssign(self, node):
                  if isinstance(node.target, ast.Name) and node.target.id == 'voice_components':
                      return None
                  return self.generic_visit(node)
          tree = Cleaner().visit(tree)
          ast.fix_missing_locations(tree)
          text = ast.unparse(tree) + '\n'
          compile(text, str(p), 'exec')
          p.write_text(text, encoding='utf-8')
          PY
          python -m compileall -q minecraft_mod_ai tests tools download_resources.py
          python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9 --fix
          python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9
          python -m vulture minecraft_mod_ai tools download_resources.py --min-confidence 100
          python -m pytest -q \
            tests/test_clean_production_contract.py \
            tests/test_research_coordinator.py \
            tests/test_agentic_search_efficiency_contract.py \
            tests/test_parallel_result_determinism_contract.py \
            tests/test_technology_radar.py
          git diff --check
          test -f minecraft_mod_ai/model_adapters/image_diffusion.py
          test -f minecraft_mod_ai/blockbench_client.py
          grep -q 'FLUX.2-klein-4B' config/model_registry.yaml
          grep -q 'build_batch_skeleton' minecraft_mod_ai/complete_planner.py
          grep -q 'merge_model_output_into_skeleton' minecraft_mod_ai/complete_planner.py
          ! grep -q 'def _expand_batches' minecraft_mod_ai/complete_planner.py
          ! grep -q 'def _expand_one_batch' minecraft_mod_ai/complete_planner.py
          ! grep -q 'module_batches' minecraft_mod_ai/complete_planner.py
          ! git grep -n -E 'AudioRequest|audio_generator|audio_resume_efficiency_contract|planner_production_page_contract|production_page_durable_contract|SpeechAdapter|speech_recognition|generate-audio|production-audio|ai_voice' -- minecraft_mod_ai config pyproject.toml tests
          test "$(git rev-parse HEAD)" = "$START"
      - name: Commit and push verified source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add minecraft_mod_ai tests config pyproject.toml skills plugins
          git diff --cached --check
          git commit -m 'refactor: restore clean non-media production paths'
          git push origin HEAD:main
