name: Native Colab bootstrap cleanup once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-colab-bootstrap-once.yml

permissions:
  contents: write

concurrency:
  group: mmm-native-colab-bootstrap-once
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
      - name: Move hot paths into canonical owners
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          platform = Path('minecraft_mod_ai/platform_live_discovery.py')
          replace_once(platform, 'import re\nimport urllib.request\n', 'import re\nimport threading\nimport urllib.request\n')
          replace_once(platform, 'from concurrent.futures import ThreadPoolExecutor\n', 'from concurrent.futures import Future, ThreadPoolExecutor\n')
          replace_once(
              platform,
              '@lru_cache(maxsize=1)\ndef discover_game_versions() -> tuple[dict[str, Any], ...]:\n',
              '@lru_cache(maxsize=1)\ndef _discover_game_versions() -> tuple[dict[str, Any], ...]:\n',
          )
          replace_once(
              platform,
              '\n\ndef latest_stable_versions(limit: int = 6) -> tuple[str, ...]:\n',
              '''\n\n_GAME_VERSION_LOCK = threading.RLock()\n_GAME_VERSION_FUTURE: Future[tuple[dict[str, Any], ...]] | None = None\n_PLATFORM_WARMUP_STARTED = False\n\n\ndef _start_game_version_prefetch() -> Future[tuple[dict[str, Any], ...]]:\n    global _GAME_VERSION_FUTURE\n    with _GAME_VERSION_LOCK:\n        future = _GAME_VERSION_FUTURE\n        if future is not None and not future.cancelled():\n            return future\n        future = Future()\n        _GAME_VERSION_FUTURE = future\n\n        def worker() -> None:\n            try:\n                future.set_result(_discover_game_versions())\n            except BaseException as exc:\n                future.set_exception(exc)\n\n        threading.Thread(\n            target=worker,\n            daemon=True,\n            name="mmm_platform_prefetch",\n        ).start()\n        return future\n\n\ndef discover_game_versions() -> tuple[dict[str, Any], ...]:\n    global _GAME_VERSION_FUTURE\n    future = _start_game_version_prefetch()\n    try:\n        return future.result()\n    except BaseException:\n        with _GAME_VERSION_LOCK:\n            if _GAME_VERSION_FUTURE is future:\n                _GAME_VERSION_FUTURE = None\n        raise\n\n\ndef start_platform_prefetch() -> None:\n    """Warm official platform metadata without replacing discovery functions."""\n    global _PLATFORM_WARMUP_STARTED\n    _start_game_version_prefetch()\n    with _GAME_VERSION_LOCK:\n        if _PLATFORM_WARMUP_STARTED:\n            return\n        _PLATFORM_WARMUP_STARTED = True\n\n    def warm_catalog() -> None:\n        try:\n            _common_platform_metadata()\n            _stable_java_versions()\n        except BaseException:\n            return\n\n    threading.Thread(\n        target=warm_catalog,\n        daemon=True,\n        name="mmm_platform_catalog_prefetch",\n    ).start()\n\n\ndef latest_stable_versions(limit: int = 6) -> tuple[str, ...]:\n''',
          )

          game_design = Path('minecraft_mod_ai/game_design.py')
          replace_once(
              game_design,
              '''def _json_text_bytes(value: str) -> int:\n    return sum(_json_character_bytes(character) for character in value)\n''',
              '''def _json_text_bytes(value: str) -> int:\n    """Return exact UTF-8 byte length of one JSON string using the C encoder."""\n    if not isinstance(value, str):\n        raise TypeError("_json_text_bytes requires a string")\n    return len(json.dumps(value, ensure_ascii=False).encode("utf-8")) - 2\n''',
          )

          work_graph = Path('minecraft_mod_ai/work_graph.py')
          replace_once(
              work_graph,
              '''    def to_dict(self) -> dict[str, Any]:\n        return asdict(self)\n''',
              '''    def to_dict(self) -> dict[str, Any]:\n        return {\n            "node_id": self.node_id,\n            "stage": self.stage,\n            "input_hash": self.input_hash,\n            "dependencies": self.dependencies,\n            "payload": self.payload,\n            "resource_class": self.resource_class,\n        }\n''',
          )
          replace_once(
              work_graph,
              "    policy = policy or ScalePolicy.from_environment()\n    proposal.validate(policy=policy)\n    selected_modules = tuple(proposal.modules) if modules is None else tuple(modules)\n",
              "    policy = policy or ScalePolicy.from_environment()\n    proposal.validate(policy=policy)\n    proposal_hash = proposal.calculate_hash()\n    selected_modules = tuple(proposal.modules) if modules is None else tuple(modules)\n",
          )
          text = work_graph.read_text(encoding='utf-8')
          old = 'proposal.calculate_hash()'
          count = text.count(old)
          if count != 4:
              raise SystemExit(f'work_graph: expected four proposal hash calls after insertion, found {count}')
          # Keep the one assignment expression and replace the three later uses.
          first = text.index(old)
          prefix = text[: first + len(old)]
          suffix = text[first + len(old):].replace(old, 'proposal_hash')
          text = prefix + suffix
          text = text.replace('for dependent in sorted(outgoing[node_id]):', 'for dependent in outgoing[node_id]:')
          work_graph.write_text(text, encoding='utf-8')

          store = Path('minecraft_mod_ai/proposal_store.py')
          replace_once(
              store,
              "    if raw['proposal_hash'] != proposal.calculate_hash():\n        raise SpecValidationError('Complete proposal shard root hash is invalid.')\n",
              "    actual_hash = proposal.approval_hash or proposal.calculate_hash()\n    if raw['proposal_hash'] != actual_hash:\n        raise SpecValidationError('Complete proposal shard root hash is invalid.')\n",
          )

          Path('minecraft_mod_ai/colab_prefetch_bootstrap.py').write_text('''from __future__ import annotations\n\n"""Colab-specific asynchronous warmup and worker-budget defaults."""\n\nimport os\nfrom pathlib import Path\nfrom typing import Any\n\n\ndef start(model_registry_module: Any) -> None:\n    """Start native metadata warmup; never replace runtime implementations."""\n    del model_registry_module\n    from .platform_live_discovery import start_platform_prefetch\n\n    start_platform_prefetch()\n    if not os.environ.get("MMM_COLAB_SETUP_RECEIPT", "").strip():\n        return\n    discovery_workers, research_workers = _colab_worker_defaults()\n    os.environ.setdefault("MMM_DISCOVERY_WORKERS", str(discovery_workers))\n    os.environ.setdefault("MMM_RESEARCH_WORKERS", str(research_workers))\n\n\ndef _colab_worker_defaults() -> tuple[int, int]:\n    """Size network and CPU retrieval pools from the live Colab allocation."""\n    cpu_count = max(1, int(os.cpu_count() or 1))\n    available_gib = 4\n    try:\n        for raw_line in Path("/proc/meminfo").read_text(encoding="utf-8").splitlines():\n            if not raw_line.startswith("MemAvailable:"):\n                continue\n            available_kib = int(raw_line.split()[1])\n            available_gib = max(1, available_kib // (1024 * 1024))\n            break\n    except (OSError, ValueError, IndexError):\n        pass\n    discovery = min(12, max(4, cpu_count * 4), max(4, available_gib * 2))\n    research = min(8, max(2, cpu_count * 2), max(2, available_gib))\n    return max(1, discovery), max(1, research)\n\n\n__all__ = ["_colab_worker_defaults", "start"]\n''', encoding='utf-8')
          PY
      - name: Validate canonical hot paths
        run: |
          python -m compileall -q minecraft_mod_ai/platform_live_discovery.py minecraft_mod_ai/game_design.py minecraft_mod_ai/work_graph.py minecraft_mod_ai/proposal_store.py minecraft_mod_ai/colab_prefetch_bootstrap.py
          python .github/scripts/audit_runtime_mutations.py --output runtime_mutation_audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('runtime_mutation_audit.json').read_text())
          offenders = [item for item in data['behavioral'] if item['path'] == 'minecraft_mod_ai/colab_prefetch_bootstrap.py']
          if offenders:
              raise SystemExit(f'Colab bootstrap still mutates external runtime owners: {offenders}')
          PY
          git diff --check
      - name: Commit cleanup and self-remove
        run: |
          rm .github/workflows/native-colab-bootstrap-once.yml
          git add -A
          git diff --cached --check
          git commit -m "refactor(colab): make bootstrap warmup native"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
