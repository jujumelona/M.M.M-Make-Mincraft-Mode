name: Finalize Colab MTP once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize_colab_mtp_once.yml'

permissions:
  contents: write
  statuses: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Mark sync pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'mmm/colab-sync',
              description: 'Colab MTP synchronization running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'nbformat>=5.10,<6'
      - name: Apply and verify synchronization
        run: python tools/finalize_colab_mtp_once.py
      - name: Remove one-shot helpers
        run: |
          git rm -f \
            .github/workflows/pin_llama_cuda_wheel_once.yml \
            .github/workflows/sync_mtp_colab_once.yml \
            .github/workflows/finalize_colab_mtp_once.yml \
            tools/finalize_colab_mtp_once.py
      - name: Commit synchronization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(colab): run MTP from pinned prebuilt CUDA binding'
          git push origin HEAD:main
      - name: Report sync status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const ok = process.env.JOB_STATUS === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: ok ? 'success' : 'failure',
              context: 'mmm/colab-sync',
              description: ok ? 'Colab MTP synchronization completed' : 'Colab MTP synchronization failed',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
