name: Finalize Colab MTP once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize_colab_mtp_once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'nbformat>=5.10,<6'
      - name: Require binary-only CUDA llama wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/colab_runtime_setup.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def _install_llama_cpp() -> None:')
          end = text.index('\n\ndef _install_project(', start)
          replacement = '''LLAMA_CPP_CUDA_WHEEL_VERSION = "0.3.34"
LLAMA_CPP_CUDA_WHEEL_INDEX = "https://abetlen.github.io/llama-cpp-python/whl/cu124"


def _llama_cpp_gpu_available() -> bool:
    try:
        import llama_cpp
        return bool(
            hasattr(llama_cpp, "llama_supports_gpu")
            and llama_cpp.llama_supports_gpu()
        )
    except Exception:
        return False


def _install_llama_cpp() -> None:
    """Install and verify the pinned pre-built CUDA wheel without source builds."""
    if _llama_cpp_gpu_available():
        print("llama-cpp-python CUDA wheel: available", flush=True)
        return

    print("llama-cpp-python CUDA wheel: installing", flush=True)
    cmd = [
        sys.executable,
        "-m",
        "pip",
        "install",
        "--upgrade",
        "--force-reinstall",
        "--only-binary=:all:",
        f"llama-cpp-python=={LLAMA_CPP_CUDA_WHEEL_VERSION}",
        "--extra-index-url",
        LLAMA_CPP_CUDA_WHEEL_INDEX,
        "--no-cache-dir",
    ]
    subprocess.run(cmd, check=True)

    for name in tuple(sys.modules):
        if name == "llama_cpp" or name.startswith("llama_cpp."):
            sys.modules.pop(name, None)
    importlib.invalidate_caches()
    if not _llama_cpp_gpu_available():
        raise RuntimeError(
            "Installed llama-cpp-python wheel does not report CUDA GPU support."
        )
    print(
        "llama-cpp-python CUDA wheel: installed",
        LLAMA_CPP_CUDA_WHEEL_VERSION,
        flush=True,
    )
'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
      - name: Use pinned MTP launcher in canonical notebook
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/build_colab_notebook.py')
          text = path.read_text(encoding='utf-8')
          start_marker = '    (\n        "code",\n        "mtp-server",'
          end_marker = '    (\n        "code",\n        "plan",'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = '''    (
        "code",
        "mtp-server",
        """# @title 4-1. [선택] 로컬 CUDA MTP 서버 실행
from minecraft_mod_ai.colab_mtp_server import start_colab_mtp_server

assert_current_colab_setup()
LLAMA_SERVER_URL = start_colab_mtp_server(planner_config)
print("llama MTP server:", LLAMA_SERVER_URL)
""",
    ),
'''
          path.write_text(text[:start] + block + text[end:], encoding='utf-8')
          PY
      - name: Regenerate Colab notebooks
        run: python tools/build_colab_notebook.py
      - name: Verify final Colab server contract
        run: |
          python - <<'PY'
          from pathlib import Path
          setup = Path('tools/colab_runtime_setup.py').read_text(encoding='utf-8')
          launcher = Path('minecraft_mod_ai/colab_mtp_server.py').read_text(encoding='utf-8')
          assert '--only-binary=:all:' in setup
          assert 'llama-cpp-python=={LLAMA_CPP_CUDA_WHEEL_VERSION}' in setup
          assert 'LLAMA_CPP_CUDA_WHEEL_VERSION = "0.3.34"' in setup
          assert 'draft_model": "draft-mtp"' in launcher
          assert '72adc790598eac9574aec6fc0bf6e994a9cfe732' in launcher
          paths = [
              Path('tools/build_colab_notebook.py'),
              Path('M.M.M_Make_Mincraft_Mode_Colab.ipynb'),
              Path('Minecraft_Multimodal_Mod_AI_Architecture_v6.ipynb'),
              Path('minecraft_mod_ai/colab_mtp_server.py'),
          ]
          banned = (
              'git clone', 'cmake', 'nvcc', 'make -j',
              '약 1분', '3배', '80토큰', '무결성 100%', '에러 위험 요소 0%'
          )
          for path in paths:
              text = path.read_text(encoding='utf-8')
              for token in banned:
                  assert token not in text, (path, token)
          for path in paths[1:3]:
              text = path.read_text(encoding='utf-8')
              assert 'start_colab_mtp_server' in text
          PY
      - name: Remove one-shot workflows
        run: |
          git rm -f \
            .github/workflows/pin_llama_cuda_wheel_once.yml \
            .github/workflows/sync_mtp_colab_once.yml \
            .github/workflows/finalize_colab_mtp_once.yml
      - name: Commit final Colab MTP path
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/colab_runtime_setup.py tools/build_colab_notebook.py M.M.M_Make_Mincraft_Mode_Colab.ipynb Minecraft_Multimodal_Mod_AI_Architecture_v6.ipynb
          git commit -m 'fix(colab): run MTP from pinned prebuilt CUDA binding'
          git push origin HEAD:main

# Trigger with one CI matrix runner reserved.
