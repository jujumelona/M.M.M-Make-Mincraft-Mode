name: Semantic fail-closed repair v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/semantic-fail-closed-v2.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch semantic fail-closed contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          evidence = Path('minecraft_mod_ai/evidence_first_planning.py')
          text = evidence.read_text(encoding='utf-8')
          old = '        unresolved = bool(data.get("unresolved", False)) and not candidates\n'
          new = '        unresolved = bool(data.get("unresolved", False)) or not candidates\n'
          if old not in text:
              raise SystemExit('expected unresolved expression not found')
          text = text.replace(old, new, 1)
          old = '''    except Exception:\n        # On any model/parse failure fall back to stub — never crash catalog build.\n        return _stub_semantic_model(clause, source_start, source_end, prompt)\n'''
          new = '''    except Exception:\n        # A configured production semantic router is authoritative.  If it fails or\n        # returns invalid structured output, do not silently replace its meaning with\n        # a deterministic ontology guess. Preserve the authored clause as unresolved\n        # so generation/reuse is blocked instead of researching an opaque hash.\n        return SemanticRequirementIR(\n            source_start=source_start,\n            source_end=source_end,\n            source_sha256=_sha(prompt[source_start:source_end]),\n            intent=clause,\n            gameplay_capability_candidates=(),\n            confidence=0.0,\n            unresolved=True,\n        )\n'''
          if old not in text:
              raise SystemExit('expected semantic exception fallback not found')
          text = text.replace(old, new, 1)
          evidence.write_text(text, encoding='utf-8')

          reuse = Path('minecraft_mod_ai/reuse_planner.py')
          text = reuse.read_text(encoding='utf-8')
          anchor = '    enriched_res = enrich_resolution_with_semantic_inference(prompt_res, router=semantic_router)\n'
          insert = anchor + '''    if semantic_router is not None and enriched_res.unresolved_spans:\n        unresolved = " | ".join(str(span) for span in enriched_res.unresolved_spans)\n        raise ReusePlanningError(\n            "semantic decomposition unresolved; reuse discovery blocked before "\n            f"search/research: {unresolved}"\n        )\n'''
          if anchor not in text:
              raise SystemExit('expected reuse semantic enrichment call not found')
          text = text.replace(anchor, insert, 1)
          old = '''    if not authoritative_scope:\n        inferred_spans = {\n'''
          new = '''    if semantic_router is not None and enriched_res.unresolved_spans:\n        raise ReusePlanningError("unresolved production semantics cannot enter retrieval")\n\n    if not authoritative_scope:\n        inferred_spans = {\n'''
          if old not in text:
              raise SystemExit('expected opaque fallback section not found')
          text = text.replace(old, new, 1)
          reuse.write_text(text, encoding='utf-8')

          test = Path('tests/test_semantic_fail_closed_regression.py')
          test.write_text('''from __future__ import annotations\n\nimport pytest\n\nfrom minecraft_mod_ai.evidence_first_planning import _model_semantic_ir\nfrom minecraft_mod_ai.reuse_planner import ReusePlanningError, decompose_capability_graph\n\n\nclass RaisingRouter:\n    def generate_text(self, *args, **kwargs):\n        raise RuntimeError("semantic transport failed")\n\n\nclass InvalidJsonRouter:\n    def generate_text(self, *args, **kwargs):\n        return "not-json"\n\n\nclass EmptyRouter:\n    def generate_text(self, *args, **kwargs):\n        return '{"intent":"unknown","gameplay_capability_candidates":[],"unresolved":false}'\n\n\nclass StructuredRouter:\n    def generate_text(self, *args, **kwargs):\n        return '{"intent":"trade","gameplay_capability_candidates":["economy.trade"],"unresolved":false}'\n\n\n@pytest.mark.parametrize("router", [RaisingRouter(), InvalidJsonRouter(), EmptyRouter()])\ndef test_production_semantic_failure_is_unresolved(router):\n    prompt = "opaque authored requirement"\n    ir = _model_semantic_ir(prompt, 0, len(prompt), prompt, router)\n    assert ir.unresolved is True\n    assert ir.gameplay_capability_candidates == ()\n    assert ir.confidence == 0.0\n\n\ndef test_model_router_like_object_resolves_without_callable_adapter():\n    prompt = "trade"\n    ir = _model_semantic_ir(prompt, 0, len(prompt), prompt, StructuredRouter())\n    assert ir.unresolved is False\n    assert ir.gameplay_capability_candidates == ("economy.trade",)\n\n\ndef test_reuse_research_blocks_unresolved_production_semantics():\n    with pytest.raises(ReusePlanningError, match="reuse discovery blocked"):\n        decompose_capability_graph("opaque authored requirement", semantic_router=RaisingRouter())\n''', encoding='utf-8')
          PY
      - name: Verify repair
        shell: bash
        run: |
          python -m py_compile minecraft_mod_ai/evidence_first_planning.py minecraft_mod_ai/reuse_planner.py minecraft_mod_ai/capability_semantic_inference.py tests/test_semantic_fail_closed_regression.py
          python -m pip install -q -e . pytest
          pytest -q tests/test_semantic_fail_closed_regression.py
      - name: Commit repair directly to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/evidence_first_planning.py minecraft_mod_ai/reuse_planner.py tests/test_semantic_fail_closed_regression.py
          git rm .github/workflows/semantic-fail-closed-v2.yml
          git commit -m 'fix: fail closed before unresolved semantic retrieval'
          git push origin HEAD:main
