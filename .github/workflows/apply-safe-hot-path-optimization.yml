name: Apply safe hot-path optimization

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-safe-hot-path-optimization.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply and validate focused hot-path changes
        run: |
          python -m pip install -q -e '.[dev]'
          python - <<'PY'
          from pathlib import Path

          prod = Path("minecraft_mod_ai/production_tools.py")
          text = prod.read_text(encoding="utf-8")
          if "from functools import cached_property\n" not in text:
              anchor = "from dataclasses import asdict\nfrom pathlib import Path\n"
              assert anchor in text
              text = text.replace(
                  anchor,
                  "from dataclasses import asdict\nfrom functools import cached_property\nfrom pathlib import Path\n",
                  1,
              )
          eager = (
              "        self.profile = profile\n"
              "        self.runtime = MinecraftRuntimeManager(self.workspace_root)\n"
              "        self.mineflayer = MineflayerBridge()\n\n"
          )
          lazy = (
              "        self.profile = profile\n\n"
              "    @cached_property\n"
              "    def runtime(self) -> MinecraftRuntimeManager:\n"
              "        return MinecraftRuntimeManager(self.workspace_root)\n\n"
              "    @cached_property\n"
              "    def mineflayer(self) -> MineflayerBridge:\n"
              "        return MineflayerBridge()\n\n"
          )
          if eager in text:
              text = text.replace(eager, lazy, 1)
          assert lazy in text
          compile(text, str(prod), "exec")
          prod.write_text(text, encoding="utf-8")

          custom = Path("minecraft_mod_ai/custom_module_generator.py")
          text = custom.read_text(encoding="utf-8")
          old = "        live_manifest = ProjectIndex(root, policy=self.policy).manifest_receipt()\n        ProductionToolService(\n"
          new = '''        # Reuse the already-built whole-project index for the RAG source receipt.
          # A second ProjectIndex here rescanned the complete project before every
          # custom-module decode. Refresh only when a concurrent lane invalidated it.
          try:
              live_manifest = index.manifest_receipt()
          except ValueError as exc:
              if not _is_stale_project_index_error(exc):
                  raise
              index = ProjectIndex(root, policy=self.policy)
              self._cached_index = index
              self._cached_root = root
              live_manifest = index.manifest_receipt()

          ProductionToolService(
          '''
          if old in text:
              text = text.replace(old, new, 1)
          assert "ProjectIndex(root, policy=self.policy).manifest_receipt()" not in text
          assert "live_manifest = index.manifest_receipt()" in text
          compile(text, str(custom), "exec")
          custom.write_text(text, encoding="utf-8")

          test = Path("tests/test_safe_hot_path_optimization.py")
          test.write_text('''from __future__ import annotations

import inspect

from minecraft_mod_ai import custom_module_generator, production_tools


def test_production_tool_service_lazily_constructs_runtime_bridges(monkeypatch, tmp_path) -> None:
    calls = {"runtime": 0, "mineflayer": 0}

    class Runtime:
        def __init__(self, root) -> None:
            calls["runtime"] += 1
            self.root = root

    class Mineflayer:
        def __init__(self) -> None:
            calls["mineflayer"] += 1

    monkeypatch.setattr(production_tools, "MinecraftRuntimeManager", Runtime)
    monkeypatch.setattr(production_tools, "MineflayerBridge", Mineflayer)
    service = production_tools.ProductionToolService(workspace_root=tmp_path, profile="test")
    assert calls == {"runtime": 0, "mineflayer": 0}
    assert service.runtime.root == tmp_path.resolve()
    assert service.runtime is service.runtime
    assert calls == {"runtime": 1, "mineflayer": 0}
    assert service.mineflayer is service.mineflayer
    assert calls == {"runtime": 1, "mineflayer": 1}


def test_custom_generation_reuses_existing_project_index_manifest() -> None:
    source = inspect.getsource(custom_module_generator.CustomModuleGenerator.generate)
    assert "ProjectIndex(root, policy=self.policy).manifest_receipt()" not in source
    assert "live_manifest = index.manifest_receipt()" in source
    assert "self._cached_index = index" in source
''', encoding="utf-8")
          compile(test.read_text(encoding="utf-8"), str(test), "exec")
          PY
          python -m compileall -q minecraft_mod_ai tests
          python -m ruff check \
            minecraft_mod_ai/production_tools.py \
            minecraft_mod_ai/custom_module_generator.py \
            tests/test_safe_hot_path_optimization.py \
            --select F,E7,E9
          python -m pytest -q \
            tests/test_safe_hot_path_optimization.py \
            tests/test_project_context_pagination.py \
            tests/test_research_ledger.py \
            tests/test_custom_generation_search_contract.py \
            tests/test_production_tool_parallel_contract.py
      - name: Commit focused optimization to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-safe-hot-path-optimization.yml
          git add -A
          git diff --cached --check
          git commit -m "Optimize RAG hot-path initialization and indexing"
          git pull --rebase origin main
          git push origin HEAD:main
