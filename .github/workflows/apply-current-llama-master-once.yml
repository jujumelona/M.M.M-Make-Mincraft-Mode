name: Apply current llama master once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-current-llama-master-once.yml

permissions:
  contents: write

concurrency:
  group: apply-current-llama-master-once
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update runtime and loader to current master bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old_sha = 'f65e568fd83712c92babbb096b57e572af0ec357'
          new_sha = '4a84b0ad108204f17f3232e26e5c802fb172b492'
          old_tag = 'native-llama-f65e568-cuda12.4-max-v3'
          new_tag = 'native-llama-4a84b0a-cuda12.4-max-v3'
          old_prefix = 'llama-f65e568-cuda12.4-max'
          new_prefix = 'llama-4a84b0a-cuda12.4-max'
          paths = [
              Path('tools/colab_runtime_setup.py'),
              Path('tools/native_llama_bundle.py'),
              Path('tests/test_colab_native_llama_prebuilt_integration.py'),
              Path('tests/test_native_llama_prebuilt_contract.py'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              text = text.replace(old_sha, new_sha)
              text = text.replace(old_tag, new_tag)
              text = text.replace(old_prefix, new_prefix)
              path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile tools/colab_runtime_setup.py tools/native_llama_bundle.py tests/test_colab_native_llama_prebuilt_integration.py tests/test_native_llama_prebuilt_contract.py
          python -m pip install --prefer-binary -e '.[dev]'
          python -m pytest -q tests/test_colab_native_llama_prebuilt_integration.py tests/test_native_llama_prebuilt_contract.py
      - name: Commit current master runtime binding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'juju-mmm-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add tools/colab_runtime_setup.py tools/native_llama_bundle.py tests/test_colab_native_llama_prebuilt_integration.py tests/test_native_llama_prebuilt_contract.py
          git diff --cached --check
          git commit -m 'Bind runtime cache to current llama.cpp master'
          git pull --rebase origin main
          git push origin HEAD:main
