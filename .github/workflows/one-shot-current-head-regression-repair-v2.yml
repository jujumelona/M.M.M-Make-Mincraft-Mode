name: One Shot Final Fail Closed Regression Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-current-head-regression-repair-v2.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -q -e '.[dev]'
      - name: Apply implementation and contract repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          historical = subprocess.check_output(
              ['git', 'show', '2665596c1fd5f0afa73cee4f3fea060211e02c02:.github/workflows/one-shot-current-head-regression-repair.yml'],
              text=True,
          )
          begin_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n          git diff --check"
          begin = historical.index(begin_marker) + len(begin_marker)
          end = historical.index(end_marker, begin)
          script = textwrap.dedent(historical[begin:end])

          old_start = script.index("old = '''def test_agent_runtime_binds_diagnostics_to_the_actual_project_root")
          new_start = script.index("new = '''def test_agent_runtime_binds_diagnostics_to_the_actual_project_root", old_start)
          script = (
              script[:old_start]
              + "start = text.index('def test_agent_runtime_binds_diagnostics_to_the_actual_project_root(')\n"
              + script[new_start:]
          )
          stale = """if old not in text:\n    raise SystemExit('old project-root verifier test block not found')\ntext = text.replace(old, new, 1)\n"""
          if stale not in script:
              raise SystemExit('stale verifier replacement tail not found')
          script = script.replace(stale, "text = text[:start] + new\n", 1)

          # The current scheduler regression is intentionally fail-closed. Never replace
          # it with the historical wrapper-marker test or a weaker concurrency expectation.
          scheduler_start = script.index('# Scheduler claim ownership is now explicit delegation')
          scheduler_end = script.index('# Hardware policy and fixed-point tests', scheduler_start)
          script = script[:scheduler_start] + script[scheduler_end:]

          exec(compile(script, '<base-repair>', 'exec'), {'__name__': '__main__'})

          def replace_once_or_present(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'expected repair block missing: {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # JDT fake implements the production semantic readiness protocol instead of
          # bypassing it.
          replace_once_or_present(
              'tests/test_java_lsp_scaling.py',
              '    def __init__(self, command: list[str], cwd: Path, configuration=None) -> None:\n        self.command = command\n        self.cwd = cwd\n        self.configuration = configuration\n',
              '    def __init__(self, command: list[str], cwd: Path, configuration=None, environment=None) -> None:\n        self.command = command\n        self.cwd = cwd\n        self.configuration = configuration\n        self.environment = environment\n',
          )
          replace_once_or_present(
              'tests/test_java_lsp_scaling.py',
              '    ) -> dict[str, Any]:\n        self.request_timeouts.append(timeout)\n        self.request_methods.append(method)\n        if method == "initialize":\n',
              '    ) -> dict[str, Any]:\n        if method == "textDocument/hover":\n            return {"contents": {"kind": "plaintext", "value": "java.lang.Object / java.lang.String resolved"}}\n        self.request_timeouts.append(timeout)\n        self.request_methods.append(method)\n        if method == "initialize":\n',
          )
          replace_once_or_present(
              'tests/test_java_lsp_scaling.py',
              '        if method == "textDocument/didOpen":\n            uri = str(params["textDocument"]["uri"])\n            self.opened_uris.append(uri)\n            number = int(Path(uri).stem.removeprefix("Generated"))\n',
              '        if method == "textDocument/didOpen":\n            uri = str(params["textDocument"]["uri"])\n            stem = Path(uri).stem\n            if stem == "__MmmJdtReadinessProbe":\n                self.messages.put({"method": "textDocument/publishDiagnostics", "params": {"uri": uri, "diagnostics": []}})\n                return\n            self.opened_uris.append(uri)\n            number = int(stem.removeprefix("Generated"))\n',
          )
          replace_once_or_present(
              'tests/test_java_lsp_scaling.py',
              'def test_workspace_symbol_calls_reuse_one_initialized_jdt_process(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    _FakeJsonRpcProcess.instances.clear()\n',
              'def test_workspace_symbol_calls_reuse_one_initialized_jdt_process(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    _write_java_files(tmp_path, 1)\n    _FakeJsonRpcProcess.instances.clear()\n',
          )
          replace_once_or_present(
              'tests/test_java_lsp_scaling.py',
              '    first_root.mkdir()\n    second_root.mkdir()\n    _FakeJsonRpcProcess.instances.clear()\n',
              '    first_root.mkdir()\n    second_root.mkdir()\n    _write_java_files(first_root, 1)\n    _write_java_files(second_root, 1)\n    _FakeJsonRpcProcess.instances.clear()\n',
          )

          # Scheduler: retain the correlated SQL guard, and independently snapshot active
          # serial CPU stages before ranking. This keeps a same-stage candidate out even if
          # a future SQLite/query rewrite weakens one of the two guards.
          p = Path('minecraft_mod_ai/scheduler_parallel_safety_contract.py')
          text = p.read_text(encoding='utf-8')
          old = '''        serial_stage_placeholders = ",".join("?" for _ in _SERIAL_CPU_STAGES)\n        ordered_lanes = tuple(\n'''
          new = '''        serial_stage_placeholders = ",".join("?" for _ in _SERIAL_CPU_STAGES)\n        active_serial_stages = tuple(\n            sorted(\n                str(stage)\n                for (stage,) in connection.execute(\n                    f"""\n                    SELECT DISTINCT stage\n                    FROM tasks\n                    WHERE state = ?\n                      AND stage IN ({serial_stage_placeholders})\n                      AND {resource_expr} = 'cpu_io'\n                    """,\n                    (WorkState.RUNNING.value, *_SERIAL_CPU_STAGES),\n                )\n            )\n        )\n        blocked_serial_sql = ""\n        blocked_serial_params: tuple[Any, ...] = ()\n        if active_serial_stages:\n            blocked_placeholders = ",".join("?" for _ in active_serial_stages)\n            blocked_serial_sql = (\n                f" AND NOT ({task_resource_expr} = 'cpu_io' "\n                f"AND task.stage IN ({blocked_placeholders}))"\n            )\n            blocked_serial_params = active_serial_stages\n\n        ordered_lanes = tuple(\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('scheduler active-stage insertion point missing')
              text = text.replace(old, new, 1)
          old = '''            WorkState.RUNNING.value,\n            *stage_params,\n            *ordered_lanes,\n'''
          new = '''            WorkState.RUNNING.value,\n            *blocked_serial_params,\n            *stage_params,\n            *ordered_lanes,\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('scheduler parameter insertion point missing')
              text = text.replace(old, new, 1)
          old = '''                  )\n                  {stage_sql}\n                  AND {task_resource_expr} IN ({lane_placeholders})\n'''
          new = '''                  )\n                  {blocked_serial_sql}\n                  {stage_sql}\n                  AND {task_resource_expr} IN ({lane_placeholders})\n'''
          if new not in text:
              if old not in text:
                  raise SystemExit('scheduler blocked-stage SQL insertion point missing')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # Current Skill contract explicitly spans planning + research and uses the
          # current reviewed tool/validator names.
          replace_once_or_present(
              'tests/test_skill_policy.py',
              '    assert contract.stages == ("research",)\n',
              '    assert contract.stages == ("planning", "research")\n',
          )
          replace_once_or_present(
              'tests/test_skill_policy.py',
              '    tool_anchor = "- retrieve_source_excerpt\\n"\n',
              '    tool_anchor = "- search_code_rag\\n"\n',
          )
          replace_once_or_present(
              'tests/test_skill_policy.py',
              '    validator_anchor = "- grounded_generation\\n"\n',
              '    validator_anchor = "- exact_version_evidence\\n"\n',
          )

          # Atomic execution installer now owns initial observation wrapping too.
          replace_once_or_present(
              'tests/test_small_model_atomic_coder_execution.py',
              '    custom = SimpleNamespace(\n        _coder_project_context_budget=lambda *a, **k: 4096,\n        _materialize_owned_reuse_context=lambda *a, **k: {},\n    )\n',
              '    custom = SimpleNamespace(\n        _coder_project_context_budget=lambda *a, **k: 4096,\n        _collect_initial_observations=lambda *a, **k: {},\n        _materialize_owned_reuse_context=lambda *a, **k: {},\n    )\n',
          )

          # mmm-planning is now a reviewed first-party canonical server, not a stale alias.
          p = Path('tests/test_agent_routing_contract.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace('        "mmm-planning",\n', '', 1)
          p.write_text(text, encoding='utf-8')

          # Native --fit owns memory sizing; maximum GPU offload remains 'all'.
          replace_once_or_present(
              'tests/test_llama_server_hardware_policy.py',
              '    assert result[result.index("--gpu-layers") + 1] == "auto"\n',
              '    assert result[result.index("--gpu-layers") + 1] == "all"\n',
          )

          # Kernel winner must preserve ubatch <= logical batch.
          p = Path('tests/test_llama_server_native_resource_fit.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'def test_explicit_resource_overrides_are_forwarded_without_custom_clamping(',
              'def test_explicit_resource_overrides_preserve_valid_batch_invariant(',
              1,
          )
          text = text.replace(
              '    assert _value(args, "--ubatch-size") == "1536"\n',
              '    assert _value(args, "--ubatch-size") == "1024"\n',
              1,
          )
          p.write_text(text, encoding='utf-8')

          # Remove assertions against deleted private semantic-step compilation. The test
          # already verifies the public requirement capabilities, artifact obligations,
          # runtime acceptance and dependency graph above this legacy block.
          p = Path('tests/test_space_progression_planner_and_verifier_regression.py')
          text = p.read_text(encoding='utf-8')
          start_marker = '    branches = planning._branch_predicates(catalog["requirements"], (), {"project_topology": {}})\n'
          end_marker = '    gap = {\n        "gap_id": "gap_ship_performance",\n'
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              replacement = '''    branches = planning._branch_predicates(\n        catalog["requirements"], (), {"project_topology": {}}\n    )\n    assert branches["needs_mixin"]["status"] == "NOT_APPLICABLE"\n\n'''
              text = text[:start] + replacement + text[end:]
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Verify full repaired regression set
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_hidden_bottleneck_efficiency.py \
            tests/test_java_lsp_scaling.py \
            tests/test_llama_server_kernel_autotune.py \
            tests/test_model_router_forced_rag_recovery.py \
            tests/test_mutation_semantic_boundary.py \
            tests/test_planning_candidate_evidence.py \
            tests/test_planning_ssot_invariants.py \
            tests/test_scheduler_claim_install_identity.py \
            tests/test_skill_policy.py \
            tests/test_small_model_atomic_coder_execution.py \
            tests/test_agent_routing_contract.py \
            tests/test_artifact_decomposition_planning.py \
            tests/test_llama_server_native_resource_fit.py \
            tests/test_llama_server_hardware_policy.py \
            tests/test_planning_regressions_20260913.py \
            tests/test_tool_chatter_finite_bounds.py \
            tests/test_unified_host_execution_loop.py \
            tests/test_space_progression_planner_and_verifier_regression.py \
            tests/test_planning_convergence_contract.py \
            tests/test_planning_deadline_hardening.py
          python -m ruff check \
            minecraft_mod_ai/model_adapters/llama_cpp_adapter.py \
            minecraft_mod_ai/llama_server_kernel_autotune.py \
            minecraft_mod_ai/llama_server_hardware_policy.py \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            minecraft_mod_ai/planning_state_resolution.py \
            minecraft_mod_ai/deadline_executor.py \
            minecraft_mod_ai/planning_state_adaptive_implementation.py \
            minecraft_mod_ai/java_lsp.py \
            minecraft_mod_ai/scheduler_parallel_safety_contract.py \
            tests/test_java_lsp_scaling.py \
            tests/test_scheduler_claim_install_identity.py \
            tests/test_skill_policy.py \
            tests/test_small_model_atomic_coder_execution.py \
            tests/test_agent_routing_contract.py \
            tests/test_llama_server_hardware_policy.py \
            tests/test_space_progression_planner_and_verifier_regression.py \
            --select F,E7,E9
          python .github/scripts/audit_runtime_efficiency.py --output /tmp/runtime-efficiency-repaired.json
      - name: Commit and push repaired code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add minecraft_mod_ai tests
          git diff --cached --check
          git commit -m 'fix: reconcile runtime and regression contracts'
          git fetch origin main
          git rebase origin/main
          python -m pytest -q \
            tests/test_scheduler_claim_install_identity.py \
            tests/test_java_lsp_scaling.py \
            tests/test_skill_policy.py \
            tests/test_small_model_atomic_coder_execution.py \
            tests/test_agent_routing_contract.py \
            tests/test_llama_server_hardware_policy.py \
            tests/test_llama_server_native_resource_fit.py \
            tests/test_space_progression_planner_and_verifier_regression.py \
            tests/test_hidden_bottleneck_efficiency.py \
            tests/test_planning_regressions_20260913.py \
            tests/test_unified_host_execution_loop.py
          python .github/scripts/audit_runtime_efficiency.py --output /tmp/runtime-efficiency-repaired.json
          git push origin HEAD:main
