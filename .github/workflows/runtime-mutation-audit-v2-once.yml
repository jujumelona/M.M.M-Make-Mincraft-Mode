name: Runtime mutation inventory v2 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-mutation-audit-v2-once.yml

permissions:
  contents: write

concurrency:
  group: mmm-runtime-mutation-audit-v2-once
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
      - name: Rebuild precise mutation inventory
        run: |
          python .github/scripts/audit_runtime_mutations.py --output runtime_mutation_audit.json
          python -m compileall -q minecraft_mod_ai
      - name: Commit inventory and remove one-shot workflow
        run: |
          rm .github/workflows/runtime-mutation-audit-v2-once.yml
          git add -A
          git diff --cached --check
          git commit -m "chore(audit): refine runtime mutation inventory"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
