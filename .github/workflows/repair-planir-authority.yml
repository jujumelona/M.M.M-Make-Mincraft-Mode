name: Repair PlanIR authority

on:
  push:
    branches: [main]
    paths:
      - 'tools/_repair_planir_authority.py'
      - '.github/workflows/repair-planir-authority.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply deterministic authority repair
        run: python tools/_repair_planir_authority.py
      - name: Verify authority contracts
        run: |
          python -m compileall -q minecraft_mod_ai tests
          python -m ruff check minecraft_mod_ai/progress_aware_tool_loop.py minecraft_mod_ai/planir_mutation_authority_contract.py minecraft_mod_ai/coder_mutation_authority_contract.py --select F,E7,E9
          python -m pytest -q tests/test_planir_mutation_authority_contract.py tests/test_coder_mutation_authority_contract.py tests/test_runtime_contract_composer.py tests/test_runtime_wrapper_signature_integrity.py
      - name: Commit verified source and self-clean
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/progress_aware_tool_loop.py minecraft_mod_ai/planir_mutation_authority_contract.py minecraft_mod_ai/coder_mutation_authority_contract.py
          git rm -f tools/_repair_planir_authority.py .github/workflows/repair-planir-authority.yml
          git commit -m 'Preserve host PlanIR mutation authority'
          git pull --rebase origin main
          git push origin HEAD:main
