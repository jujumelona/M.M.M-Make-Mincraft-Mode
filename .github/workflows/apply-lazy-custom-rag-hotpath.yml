name: Apply lazy custom RAG hot path

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-lazy-custom-rag-hotpath.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply lazy RAG and direct first decode
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('minecraft_mod_ai/custom_module_generator.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('        self.router.bind_agent_workspace(root.parent, require_fresh_evidence=True)\n')
          end = s.index('        query = json.dumps(\n', start)
          s = s[:start] + '''        # The host ProjectIndex below already provides fresh exact source evidence.\n        # Do not eagerly rebuild the SQLite RAG index for every custom module; the\n        # normal first-pass decode is tool-free and repair materializes RAG only if\n        # validation actually fails.\n        self.router.bind_agent_workspace(root.parent, require_fresh_evidence=True)\n\n''' + s[end:]
          old_prompt = '''                            "is a code-owned commitment to earlier operations. Use the "\n                            "live RAG/MCP tools throughout implementation: current code RAG "\n                            "for repository facts, exact-version project/API evidence for "\n                            "Minecraft/Fabric facts, reviewed ecosystem/repository tools for "\n                            "dependencies, and JDT symbols/diagnostics for uncertain Java "\n                            "APIs. Inspect RAG receipts and reformulate or switch source when "\n                            "evidence is weak. When code output for the current page is too "\n'''
          new_prompt = '''                            "is a code-owned commitment to earlier operations. The host has "\n                            "already supplied fresh exact source observations and reviewed "\n                            "research_context for this bounded first-pass decode. Use those "\n                            "inputs directly and do not repeat retrieval unless host validation "\n                            "fails and explicitly enters evidence-backed repair. When code "\n                            "output for the current page is too "\n'''
          if old_prompt not in s:
              raise SystemExit('initial custom prompt target not found')
          s = s.replace(old_prompt, new_prompt, 1)

          marker = '''        observation_page_index = 0\n        while True:\n'''
          if marker not in s:
              raise SystemExit('repair state insertion target not found')
          s = s.replace(marker, '''        observation_page_index = 0\n        repair_rag_ready = False\n        while True:\n''', 1)

          repair_marker = '''                repair_attempts += 1\n                print(\n'''
          if repair_marker not in s:
              raise SystemExit('repair escalation target not found')
          escalation = '''                repair_attempts += 1\n                if not repair_rag_ready:\n                    # First-pass structured generation is intentionally tool-free. If\n                    # host validation rejects it, materialize one current code-RAG\n                    # snapshot before giving the repair turn optional MCP/RAG tools.\n                    from .production_tools import ProductionToolService\n\n                    try:\n                        live_manifest = index.manifest_receipt()\n                    except ValueError as exc:\n                        if not _is_stale_project_index_error(exc):\n                            raise\n                        index = ProjectIndex(root, policy=self.policy)\n                        self._cached_index = index\n                        self._cached_root = root\n                        live_manifest = index.manifest_receipt()\n                    ProductionToolService(\n                        workspace_root=root.parent,\n                        profile=getattr(self.router, "profile", "t4_local"),\n                    ).index_project_rag(\n                        [root.name],\n                        metadata={\n                            "minecraft_version": minecraft_version,\n                            "loader": loader,\n                            "mapping_namespace": _mapping_namespace(mappings),\n                            "java_version": "17",\n                            "license": "project-local",\n                            "source_commit": str(live_manifest["sha256"]),\n                        },\n                        semantic=False,\n                    )\n                    repair_rag_ready = True\n                print(\n'''
          s = s.replace(repair_marker, escalation, 1)
          compile(s, str(p), 'exec')
          p.write_text(s, encoding='utf-8')

          p = Path('minecraft_mod_ai/custom_generation_search_contract.py')
          s = p.read_text(encoding='utf-8')
          old = '''    def generate_text(\n        self,\n        role: str,\n        messages: Sequence[Mapping[str, Any]],\n        **kwargs: Any,\n    ) -> str:\n        return self._router.generate_text(role, messages, **kwargs)\n'''
          new = '''    def generate_text(\n        self,\n        role: str,\n        messages: Sequence[Mapping[str, Any]],\n        **kwargs: Any,\n    ) -> str:\n        # Normal custom generation already carries bounded exact source observations\n        # plus reviewed research context. Keep that happy path to one decode. The\n        # validation-repair prompt explicitly contains this marker and may use tools.\n        repair_turn = any(\n            "Execution & Validation Failure:" in str(message.get("content", ""))\n            for message in messages\n            if isinstance(message, Mapping)\n        )\n        if role == "coder" and kwargs.get("response_format") == "json" and not repair_turn:\n            kwargs["enable_tools"] = False\n        return self._router.generate_text(role, messages, **kwargs)\n'''
          if old not in s:
              raise SystemExit('HostEvidenceRouter generate_text target not found')
          s = s.replace(old, new, 1)
          compile(s, str(p), 'exec')
          p.write_text(s, encoding='utf-8')
          PY
          python -m pip install -q -e '.[dev]'
          python -m ruff check minecraft_mod_ai/custom_module_generator.py minecraft_mod_ai/custom_generation_search_contract.py --select F,E7,E9
          python -m pytest -q \
            tests/test_project_context_pagination.py \
            tests/test_custom_generation_search_contract.py \
            tests/test_custom_generation_efficiency_contract.py \
            tests/test_project_write_concurrency_contract.py
      - name: Commit validated hot path
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-lazy-custom-rag-hotpath.yml
          git add -A
          git diff --cached --check
          git commit -m "Make custom RAG repair-only on the happy path"
          git pull --rebase origin main
          git push origin HEAD:main
