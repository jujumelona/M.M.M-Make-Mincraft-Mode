name: Apply grounded RAG runtime integration

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-grounded-rag-runtime.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Wire grounded RAG coordinator into live owners
        run: |
          python - <<'PY'
          from pathlib import Path

          finalization = Path('minecraft_mod_ai/runtime_finalization.py')
          text = finalization.read_text(encoding='utf-8')
          if '            reuse_planner,\n' not in text:
              anchor = '            research_rag_performance,\n'
              if anchor not in text:
                  raise SystemExit('runtime_finalization reuse import anchor drifted')
              text = text.replace(anchor, anchor + '            reuse_planner,\n', 1)
          import_line = '        from .grounded_rag_runtime_contract import install as install_grounded_rag_runtime\n'
          if import_line not in text:
              anchor = '        from .generation_concurrency_safety import install as install_generation_safety\n'
              if anchor not in text:
                  raise SystemExit('runtime_finalization grounded import anchor drifted')
              text = text.replace(anchor, anchor + import_line, 1)
          call = '        install_research_grounded_rag(agentic_pre_design_rag)\n'
          grounded_call = '        install_grounded_rag_runtime(agentic_pre_design_rag, reuse_planner)\n'
          if grounded_call not in text:
              if call not in text:
                  raise SystemExit('runtime_finalization research RAG call anchor drifted')
              text = text.replace(call, call + grounded_call, 1)
          finalization.write_text(text, encoding='utf-8')

          rag = Path('minecraft_mod_ai/research_grounded_rag_contract.py')
          text = rag.read_text(encoding='utf-8')
          text = text.replace('mmm/external-grounded-rag-v1', 'mmm/external-grounded-rag')
          text = text.replace('mmm/forced-pre-design-rag-v3', 'mmm/forced-pre-design-rag')
          rag.write_text(text, encoding='utf-8')

          for path in Path('minecraft_mod_ai').glob('*.py'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('mmm/local-project-rag-index-v1', 'mmm/local-project-rag-index')
              updated = updated.replace('local-project-rag-index-v1', 'local-project-rag-index')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          repair = Path('minecraft_mod_ai/repair_engine.py')
          text = repair.read_text(encoding='utf-8')
          old = '                project_index.update_files(tuple(str(item["path"]) for item in patch))\n                receipts.append(receipt)\n'
          new = (
              '                project_index.update_files(tuple(str(item["path"]) for item in patch))\n'
              '                # Keep durable retrieval synchronized with the committed source edit.\n'
              '                try:\n'
              '                    from .production_tools import ProjectRAGIndex\n'
              '                    rag_index = ProjectRAGIndex(root / ".minecraft_ai" / "rag_index")\n'
              '                    rag_index.build(\n'
              '                        [root],\n'
              '                        metadata=_repair_rag_metadata(root, project_index.manifest_receipt()),\n'
              '                        router=None,\n'
              '                        semantic=False,\n'
              '                    )\n'
              '                except Exception as exc:\n'
              '                    print(\n'
              '                        f"  [!] Project RAG refresh after repair edit failed: {type(exc).__name__}: {exc}",\n'
              '                        flush=True,\n'
              '                    )\n'
              '                receipts.append(receipt)\n'
          )
          if new not in text:
              if old not in text:
                  raise SystemExit('repair post-edit index anchor drifted')
              text = text.replace(old, new, 1)
          text = text.replace(
              '                semantic=True,\n                rerank=True,\n',
              '                semantic=False,\n                rerank=False,\n',
              1,
          )
          repair.write_text(text, encoding='utf-8')

          coordinator = Path('minecraft_mod_ai/grounded_rag_runtime_contract.py')
          text = coordinator.read_text(encoding='utf-8')
          stale = '            for path in closure[:10]:\n                source_id = f"github:{owner}/{repo}:{path}"\n'
          fixed = '            for path in closure[:10]:\n                folded = path.casefold()\n                source_id = f"github:{owner}/{repo}:{path}"\n'
          if fixed not in text:
              if stale not in text:
                  raise SystemExit('closure role anchor drifted')
              text = text.replace(stale, fixed, 1)
          coordinator.write_text(text, encoding='utf-8')

          Path('.github/workflows/apply-grounded-rag-runtime.yml').unlink(missing_ok=True)
          PY
      - name: Validate integrated RAG and coder repair contracts
        run: |
          python -m compileall -q minecraft_mod_ai
          python -m ruff check minecraft_mod_ai tests --select F,E7,E9
          python -m pytest -q \
            tests/test_grounded_rag_runtime_contract.py \
            tests/test_reuse_authoritative_search.py \
            tests/test_reuse_source_read_tool.py \
            tests/test_reuse_research_hardening_contract.py \
            tests/test_semantic_requirement_authority_single_pass.py
      - name: Verify removed RAG version labels
        run: |
          if grep -R --line-number -E 'external-grounded-rag-v1|forced-pre-design-rag-v3|local-project-rag-index-v1' minecraft_mod_ai; then
            exit 1
          fi
      - name: Commit integration directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: connect grounded RAG to reuse and repair runtime"
          git push origin HEAD:main
