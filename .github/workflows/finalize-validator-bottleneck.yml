name: Finalize Validator Bottleneck
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-validator-bottleneck.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Patch validator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('minecraft_mod_ai/validator.py')
          s = p.read_text(encoding='utf-8')
          old = '''        for path in sorted({*root.rglob("*.json"), *root.rglob("*.mcmeta")}):
              checks += 1
              self._load_json(path, findings, root)

          java_files = sorted(
          '''
          # Preserve source indentation exactly rather than weakening validation.
          old = old.replace('              ', '            ').replace('          java_files', '        java_files')
          new = '''        for path in sorted({*root.rglob("*.json"), *root.rglob("*.mcmeta")}):
            checks += 1
            self._load_json(path, findings, root)

        extended_catalog = root / ".minecraft_ai/extended-modules.json"
        if extended_catalog.exists():
            checks += 1
            try:
                from .extended_content_generator import ExtendedContentError, iter_extended_module_records
                tuple(iter_extended_module_records(root))
            except (ExtendedContentError, OSError, ValueError) as exc:
                findings.append(Finding(
                    "EXTENDED_CATALOG_INVALID",
                    "error",
                    self._rel(root, extended_catalog),
                    f"Extended module catalog failed structural validation: {exc}",
                ))

        java_files = sorted(
          '''
          if old not in s:
              raise SystemExit('validator insertion point not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Add regression test
        shell: bash
        run: |
          cat > tests/test_extended_catalog_validation_gate.py <<'PY'
          from __future__ import annotations
          import inspect
          import minecraft_mod_ai.validator as validator

          def test_extended_catalog_is_structurally_validated_once():
              source = inspect.getsource(validator.ProjectValidator.validate)
              assert source.count('iter_extended_module_records(root)') == 1
              assert 'EXTENDED_CATALOG_INVALID' in source
          PY
      - name: Verify
        run: |
          python -m compileall -q minecraft_mod_ai tests/test_extended_catalog_validation_gate.py
          python -m ruff check minecraft_mod_ai/validator.py tests/test_extended_catalog_validation_gate.py --select F,E7,E9
          python -m pytest -q tests/test_extended_catalog_validation_gate.py tests/test_extended_content_generator.py tests/test_validator.py
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/finalize-validator-bottleneck.yml
          git add minecraft_mod_ai/validator.py tests/test_extended_catalog_validation_gate.py .github/workflows/finalize-validator-bottleneck.yml
          git commit -m 'Validate extended catalog once at source gate'
          git pull --rebase origin main
          git push origin HEAD:main
