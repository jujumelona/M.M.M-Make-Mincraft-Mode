name: Finalize Validator Bottleneck
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-validator-bottleneck.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Patch validator and add regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('minecraft_mod_ai/validator.py')
          s = p.read_text(encoding='utf-8')
          old = '        for path in sorted({*root.rglob("*.json"), *root.rglob("*.mcmeta")}):\n            checks += 1\n            self._load_json(path, findings, root)\n\n        java_files = sorted(\n'
          new = '        for path in sorted({*root.rglob("*.json"), *root.rglob("*.mcmeta")}):\n            checks += 1\n            self._load_json(path, findings, root)\n\n        extended_catalog = root / ".minecraft_ai/extended-modules.json"\n        if extended_catalog.exists():\n            checks += 1\n            try:\n                from .extended_content_generator import ExtendedContentError, iter_extended_module_records\n                tuple(iter_extended_module_records(root))\n            except (ExtendedContentError, OSError, ValueError) as exc:\n                findings.append(Finding(\n                    "EXTENDED_CATALOG_INVALID",\n                    "error",\n                    self._rel(root, extended_catalog),\n                    f"Extended module catalog failed structural validation: {exc}",\n                ))\n\n        java_files = sorted(\n'
          if old not in s:
              raise SystemExit('validator insertion point not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          Path('tests/test_extended_catalog_validation_gate.py').write_text('''from __future__ import annotations\nimport inspect\nimport minecraft_mod_ai.validator as validator\n\ndef test_extended_catalog_is_structurally_validated_once():\n    source = inspect.getsource(validator.ProjectValidator.validate)\n    assert source.count("iter_extended_module_records(root)") == 1\n    assert "EXTENDED_CATALOG_INVALID" in source\n''', encoding='utf-8')
          PY
      - name: Verify
        run: |
          python -m compileall -q minecraft_mod_ai tests/test_extended_catalog_validation_gate.py
          python -m ruff check minecraft_mod_ai/validator.py tests/test_extended_catalog_validation_gate.py --select F,E7,E9
          python -m pytest -q tests/test_extended_catalog_validation_gate.py tests/test_extended_content_generator.py tests/test_validator.py
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/finalize-validator-bottleneck.yml
          git add -A
          git commit -m 'Validate extended catalog once at source gate'
          git pull --rebase origin main
          git push origin HEAD:main
