name: One-shot fresh Java root-cause fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-fresh-java-root-cause-fix.yml

permissions:
  contents: write

concurrency:
  group: one-shot-fresh-java-root-cause-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e ".[dev]"

      - name: Apply semantic evidence route fix
        run: python .github/scripts/apply_semantic_evidence_route_fix.py

      - name: Run focused regressions
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_agent_required_rag_semantic_choice.py \
            tests/test_fresh_java_grounding_transition.py \
            tests/test_api_grounding_repair_installation.py \
            tests/test_agent_tool_verification_terminal.py \
            2>&1 | tee /tmp/focused-pytest.log

      - name: Upload focused regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semantic-evidence-route-focused-log
          path: /tmp/focused-pytest.log
          if-no-files-found: ignore

      - name: Compile Python package
        run: python -m compileall -q minecraft_mod_ai

      - name: Validate diff
        run: git diff --check

      - name: Commit and push actual fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            tests/test_fresh_java_grounding_transition.py
          if git diff --cached --quiet; then
            echo "Expected root-cause patch produced no diff"
            exit 1
          fi
          git commit -m "Restore semantic evidence route liveness"
          git push origin HEAD:main
