name: One-shot fresh Java root-cause fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-fresh-java-root-cause-fix.yml

permissions:
  contents: write

concurrency:
  group: one-shot-fresh-java-root-cause-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e ".[dev]"

      - name: Apply root-cause fix to current main
        run: python .github/scripts/apply_fresh_java_root_cause_fix.py

      - name: Run focused regressions
        run: >-
          python -m pytest -q
          tests/test_api_grounding_repair_installation.py
          tests/test_fresh_java_grounding_transition.py
          tests/test_agent_tool_verification_terminal.py

      - name: Compile Python package
        run: python -m compileall -q minecraft_mod_ai

      - name: Validate diff
        run: git diff --check

      - name: Commit and push actual fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft_mod_ai/progress_aware_tool_loop.py tests/test_api_grounding_repair_installation.py
          git diff --cached --exit-code && { echo "Expected root-cause patch produced no diff"; exit 1; } || true
          git commit -m "Close fresh Java grounding and output recovery gaps"
          git push origin HEAD:main
