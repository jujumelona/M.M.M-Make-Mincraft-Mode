name: One-time owner cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-owner-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Consolidate owners and remove stale assertions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          def replace_section(path: str, start: str, end: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              a = text.find(start)
              b = text.find(end, a + len(start)) if a >= 0 else -1
              if a < 0 or b < 0:
                  raise SystemExit(f'{path}: section markers not found: {start!r} -> {end!r}')
              file.write_text(text[:a] + new + text[b:], encoding='utf-8')

          # execution_efficiency_contract now owns work-graph sharding only.
          replace_once(
              'minecraft_mod_ai/runtime_bootstrap.py',
              '''    install_execution_efficiency(\n        complete_planner_module=complete_planner,\n        work_graph_module=work_graph,\n    )\n''',
              '''    install_execution_efficiency(work_graph_module=work_graph)\n''',
          )

          # Production page progress is validated before any child/catalog commit.
          replace_once(
              'minecraft_mod_ai/planner_production_page_contract.py',
              '''            # Parse and repair each child independently. Valid siblings are committed\n            # unchanged; one malformed module/asset/audio item is patched in place and\n            # never causes the whole production page to be regenerated.\n            page_modules, page_assets, page_audio, tests = resolve_page_items(\n                complete_planner_module,\n                self.router,\n                page=page,\n                page_path=page_path,\n                module_catalog=module_catalog,\n                asset_catalog=asset_catalog,\n                audio_catalog=audio_catalog,\n                test_catalog=test_catalog,\n            )\n            parts.modules.extend(page_modules)\n            parts.assets.extend(page_assets)\n            parts.audio.extend(page_audio)\n            parts.acceptance_tests.extend(tests)\n            test_catalog.update(tests)\n\n            completed = {\n                value\n                for value in _string_list(page.get("completed_deliverables", []))\n                if value in remaining\n            }\n            if not completed:\n                raise complete_planner_module.SpecValidationError(\n                    f"Production batch {batch.batch_id!r} page made no verified progress."\n                )\n\n            remaining = [value for value in remaining if value not in completed]\n''',
              '''            completed = {\n                value\n                for value in _string_list(page.get("completed_deliverables", []))\n                if value in remaining\n            }\n            if not completed:\n                raise complete_planner_module.SpecValidationError(\n                    f"Production batch {batch.batch_id!r} page made no host-verifiable "\n                    "deliverable progress."\n                )\n\n            # Child repair is durable but catalog/parts mutation is transactional at\n            # page scope. A page that cannot prove progress never reaches this stage.\n            page_modules, page_assets, page_audio, tests = resolve_page_items(\n                complete_planner_module,\n                self.router,\n                page=page,\n                page_path=page_path,\n                module_catalog=module_catalog,\n                asset_catalog=asset_catalog,\n                audio_catalog=audio_catalog,\n                test_catalog=test_catalog,\n            )\n            parts.modules.extend(page_modules)\n            parts.assets.extend(page_assets)\n            parts.audio.extend(page_audio)\n            parts.acceptance_tests.extend(tests)\n            test_catalog.update(tests)\n\n            remaining = [value for value in remaining if value not in completed]\n''',
          )

          # Resolve children against overlay catalogs; commit bases only when every
          # child in the page resolves successfully.
          replace_once(
              'minecraft_mod_ai/production_page_durable_contract.py',
              '''def resolve_page_items(\n''',
              '''class _CatalogOverlay:\n    def __init__(self, base: Any) -> None:\n        self._base = base\n        self._local: list[str] = []\n        self._ids: set[str] = set()\n\n    def __contains__(self, identity: str) -> bool:\n        return identity in self._ids or identity in self._base\n\n    def add(self, identity: str) -> None:\n        if identity in self:\n            raise ValueError(f"duplicate staged catalog identity: {identity}")\n        self._ids.add(identity)\n        self._local.append(identity)\n\n    def commit(self) -> None:\n        for identity in self._local:\n            self._base.add(identity)\n\n\ndef resolve_page_items(\n''',
          )
          replace_once(
              'minecraft_mod_ai/production_page_durable_contract.py',
              '''    catalogs = {\n        "module": module_catalog,\n        "asset": asset_catalog,\n        "audio": audio_catalog,\n    }\n''',
              '''    catalogs = {\n        "module": _CatalogOverlay(module_catalog),\n        "asset": _CatalogOverlay(asset_catalog),\n        "audio": _CatalogOverlay(audio_catalog),\n    }\n''',
          )
          replace_once(
              'minecraft_mod_ai/production_page_durable_contract.py',
              '''            corrected_raw[kind].append(repaired_raw)\n\n    tests_raw = page.get("acceptance_tests", [])\n''',
              '''            corrected_raw[kind].append(repaired_raw)\n\n    for catalog in catalogs.values():\n        catalog.commit()\n\n    tests_raw = page.get("acceptance_tests", [])\n''',
          )

          # Mineflayer wait_for has an explicit closed condition contract and rejects
          # unsupported conditions before entering its polling loop.
          replace_once(
              'integrations/mineflayer-1201/bridge.mjs',
              '''async function waitFor(params) {\n''',
              '''const WAIT_CONDITIONS = new Set([\n  "spawned",\n  "window_open",\n  "window_closed",\n  "healthy"\n]);\n\nasync function waitFor(params) {\n''',
          )
          replace_once(
              'integrations/mineflayer-1201/bridge.mjs',
              '''  const condition = String(params.condition || "");\n  const timeoutMs = boundedInteger(params.timeout_ms ?? 10000, "wait timeout", 1, 60000);\n''',
              '''  const condition = String(params.condition || "");\n  if (!WAIT_CONDITIONS.has(condition)) {\n    throw new Error(`Unsupported wait_for condition: ${condition}`);\n  }\n  const timeoutMs = boundedInteger(params.timeout_ms ?? 10000, "wait timeout", 1, 60000);\n''',
          )

          # Invalid central-AI target choice is explicitly auditable as fail-closed.
          replace_once(
              'minecraft_mod_ai/platform_resolver.py',
              '''    return newest, (\n        "중앙 AI의 플랫폼 선택 응답을 host가 검증하지 못해, 완전히 resolve된 "\n        f"최신 stable profile Minecraft {newest}을 사용했습니다."\n    )\n''',
              '''    return newest, (\n        "중앙 AI의 플랫폼 선택 응답을 host가 검증하지 못해 fail-closed하고, "\n        f"완전히 resolve된 최신 stable profile Minecraft {newest}을 사용했습니다."\n    )\n''',
          )

          # Tests assert current behavior/ownership rather than removed implementation shape.
          replace_section(
              'tests/test_mineflayer_action_contract.py',
              'def test_required_runtime_assertion_is_real_and_bounded() -> None:\n',
              '\n\ndef test_mineflayer_bridge_javascript_parses_when_node_is_available()',
              '''def test_required_runtime_assertion_is_real_and_bounded() -> None:\n    source = _bridge_source()\n    assert "async function waitFor" in source\n    assert "wait_for: waitFor" in source\n    assert "Unsupported wait_for condition" in source\n    assert "timeout_ms ?? 10000" in source\n    assert '"wait timeout", 1, 60000' in source\n    for condition in ("spawned", "window_open", "window_closed", "healthy"):\n        assert f'"{condition}"' in source\n\n\n''',
          )
          replace_once(
              'tests/test_mod_only_public_surface.py',
              '''    assert "env: {MMM_MCP_STAGE: generation}" not in registry\n''',
              '''    assert "env: {MMM_MCP_STAGE: generation}" in registry\n''',
          )
          replace_section(
              'tests/test_production_stack.py',
              'def test_external_mcp_registry_is_version_locked() -> None:\n',
              '\n\ndef test_canonical_skill_catalog_is_complete()',
              '''def test_external_mcp_registry_is_stage_bound_and_provider_scoped() -> None:\n    registry = ExternalMCPRegistry().public_dict()["servers"]\n    assert registry["mmm-frontdoor"]["env"]["MMM_MCP_STAGE"] == "frontdoor"\n    assert registry["mmm-generation"]["env"]["MMM_MCP_STAGE"] == "generation"\n    assert registry["minecraft-dev"]["status"] == "enabled"\n    assert registry["minecraft-dev"]["version_policy"] == "provider_reported"\n    assert registry["minecraft-dev"]["command"][-1] == "@mcdxai/minecraft-dev-mcp"\n    assert registry["playwright"]["command"][2] == "@playwright/mcp@0.0.78"\n    assert registry["minecraft-player-agent"]["status"] == "optional"\n    assert "mineflayer-1201" not in registry\n    assert registry["gdmc"]["status"] == "incompatible_by_default"\n\n\n''',
          )
          replace_section(
              'tests/test_notebook_registry_policy.py',
              'def test_local_colab_profiles_require_verified_qwen_fast_kernels() -> None:\n',
              '\n\ndef test_notebook_checks_setup_fingerprint_and_prints_resolved_planner()',
              '''def test_local_colab_profiles_use_native_llama_and_optional_qwen_fastpath() -> None:\n    cells = _cells()\n    setup = runpy.run_path("tools/colab_runtime_setup.py")\n    pyproject = Path("pyproject.toml").read_text(encoding="utf-8")\n\n    assert 'MODEL_PROFILE = "Qwen3.5-9B_6GB"' in cells["configuration"]\n    assert "Qwen3.5-9B_6GB" in setup["LOCAL_PROFILES"]\n    assert "Gemma4-12B_7GB" in setup["LOCAL_PROFILES"]\n    assert setup["REMOTE_PROJECT_INSTALL_TARGET"] == (\n        ".[ui,rag,image,speech,production-audio,training]"\n    )\n    assert setup["LOCAL_PROJECT_INSTALL_TARGET"] == (\n        ".[ui,local-model,rag,image,speech,production-audio,training]"\n    )\n    assert len(setup["LLAMA_SERVER_SOURCE_REF"]) == 40\n    assert callable(setup["_ensure_native_server"])\n    assert "flash-linear-attention" not in cells["setup"]\n    assert "qwen-fastpath = [" in pyproject\n    assert "flash-linear-attention[cuda,conv1d]>=0.5.1,<0.6" in pyproject\n\n\n''',
          )
          PY
      - name: Verify consolidated contracts
        run: |
          python -m pip install --prefer-binary -e '.[dev]'
          python -m compileall -q minecraft_mod_ai tests tools download_resources.py
          python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9
          vulture minecraft_mod_ai tools download_resources.py --min-confidence 100
          node --check integrations/mineflayer-1201/bridge.mjs
          python -m pytest -q \
            tests/test_runtime_bootstrap_clean.py \
            tests/test_execution_efficiency_contract.py \
            tests/test_planner_pagination_safety_contract.py \
            tests/test_mineflayer_action_contract.py \
            tests/test_platform_target_resolution.py \
            tests/test_mod_only_public_surface.py \
            tests/test_production_stack.py \
            tests/test_notebook_registry_policy.py
          git diff --check
      - name: Commit and remove maintenance workflow
        run: |
          git rm .github/workflows/one-time-owner-cleanup.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Consolidate runtime owners and remove stale contract shapes'
          git push origin HEAD:main
