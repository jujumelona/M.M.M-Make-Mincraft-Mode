name: Runtime ownership cleanup once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/runtime-ownership-cleanup-once.yml

permissions:
  contents: write

concurrency:
  group: runtime-ownership-cleanup-once
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Consolidate runtime ownership
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path: str) -> str:
              return Path(path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding='utf-8')

          def once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 occurrence, found {count}')
              return text.replace(old, new, 1)

          # 1) Keep the bounded planning-seed policy, but delete the legacy page-schema bypass.
          path = 'minecraft_mod_ai/research_coordinator.py'
          text = read(path)
          text = text.replace('allow_legacy_terminal', 'planning_seed_only')
          legacy = '''        legacy_without_cursor_contract = (\n            "next_route_cursor" not in page and "routes_complete" not in page\n        )\n        if planning_seed_only and legacy_without_cursor_contract:\n            return deepcopy(page)\n'''
          if legacy not in text:
              raise RuntimeError('research coordinator legacy cursor bypass not found')
          text = text.replace(legacy, '', 1)
          old_doc = '''    The normal coordinator is exhaustive because specialist callers may require the\n    complete request-derived route catalog.  ``planning_seed_only`` is the planner\n    compatibility path used by ``CompleteGameDesignPlanner``: planning consumes only\n    the first bounded seed page and preserves ``next_route_cursor`` plus\n    ``remaining_route_count`` for later specialist work.  This prevents the planning\n    critical path from accidentally turning seed discovery into a full internet\n    research crawl.\n'''
          new_doc = '''    The normal coordinator is exhaustive because specialist callers may require the\n    complete request-derived route catalog. ``planning_seed_only`` keeps the planning\n    critical path bounded to the first canonical route page while preserving\n    ``next_route_cursor`` and ``remaining_route_count`` for later specialist work.\n    It never relaxes the route-page schema or cursor contract.\n'''
          text = once(text, old_doc, new_doc, 'research coordinator policy doc')
          text = text.replace(
              'never by an coordinator-wide item\n    coordinator-wide item or page limit.',
              'never by a coordinator-wide item or page limit.',
          )
          write(path, text)

          # 2) Make the agentic feature own its router applicability instead of bootstrap.
          path = 'minecraft_mod_ai/agentic_research_game_design.py'
          text = read(path).replace('allow_legacy_terminal=True', 'planning_seed_only=True')
          marker = '\n\ndef bind_game_design_planner(game_design_module: Any) -> None:\n'
          helper = '''\n\ndef supports_agentic_research_router(router: Any) -> bool:\n    """Return whether the router owns the production agent-tool runtime."""\n    from .model_router import ModelRouter\n\n    return isinstance(router, ModelRouter)\n'''
          if 'def supports_agentic_research_router(' not in text:
              text = once(text, marker, helper + marker, 'agentic router capability helper')
          old = '''    ) -> dict[str, Any]:\n        research = collect_pre_design_research(\n'''
          new = '''    ) -> dict[str, Any]:\n        if not supports_agentic_research_router(router):\n            return original_sharded(\n                router,\n                request_text=request_text,\n                media_paths=media_paths,\n                page_index=page_index,\n                page_count=page_count,\n            )\n        research = collect_pre_design_research(\n'''
          text = once(text, old, new, 'agentic sharded router boundary')
          old = '''    def plan(self: Any, prompt: str, *, media_paths=()):\n        if not prompt.strip():\n'''
          new = '''    def plan(self: Any, prompt: str, *, media_paths=()):\n        if not supports_agentic_research_router(self.router):\n            return original(self, prompt, media_paths=media_paths)\n        if not prompt.strip():\n'''
          text = once(text, old, new, 'agentic plan router boundary')
          write(path, text)

          # 3) Reuse that single capability owner in the intelligence amplifier.
          path = 'minecraft_mod_ai/central_intelligence_amplifier.py'
          text = read(path).replace('allow_legacy_terminal=True', 'planning_seed_only=True')
          count = text.count('_amplification_enabled(router)')
          if count != 2:
              raise RuntimeError(f'amplification call count changed: {count}')
          text = text.replace(
              '_amplification_enabled(router)',
              '_amplification_enabled(agentic_module, router)',
          )
          old = '''def _amplification_enabled(router: Any) -> bool:\n    if bool(getattr(router, "_mmm_enable_central_intelligence", False)):\n        return True\n    try:\n        from .model_router import ModelRouter\n    except Exception:\n        return False\n    return isinstance(router, ModelRouter)\n'''
          new = '''def _amplification_enabled(agentic_module: Any, router: Any) -> bool:\n    if bool(getattr(router, "_mmm_enable_central_intelligence", False)):\n        return True\n    return bool(agentic_module.supports_agentic_research_router(router))\n'''
          text = once(text, old, new, 'central intelligence router ownership')
          write(path, text)

          # 4) Bootstrap composes installers only; it no longer knows fake/test routers.
          path = 'minecraft_mod_ai/runtime_bootstrap.py'
          text = read(path)
          text = text.replace('from functools import wraps\n', '')
          text = text.replace('from typing import Any\n', '')
          text = once(
              text,
              '        minecraft_knowledge_contract,\n        model_router,\n        platform_central_ai_contract,\n',
              '        minecraft_knowledge_contract,\n        platform_central_ai_contract,\n',
              'bootstrap platform router import',
          )
          call = '''    _gate_research_first_to_production_router(\n        game_design_module=game_design,\n        model_router_module=model_router,\n    )\n'''
          text = once(text, call, '', 'bootstrap research gate call')
          text, count = re.subn(
              r'\n\ndef _gate_research_first_to_production_router\([\s\S]*?(?=\n\ndef _install_planner_contracts\(\) -> None:)',
              '',
              text,
              count=1,
          )
          if count != 1:
              raise RuntimeError(f'bootstrap research gate definition count: {count}')
          write(path, text)

          # 5) Fix the new real-MCP test: bind to pytest's existing directory.
          path = 'tests/test_llama_parallel_runtime_contract.py'
          text = read(path)
          text = once(
              text,
              '    router = ModelRouter(profile="t4_local").bind_agent_workspace(\n        tmp_path / "workspace"\n    )\n',
              '    router = ModelRouter(profile="t4_local").bind_agent_workspace(tmp_path)\n',
              'parallel MCP workspace fixture',
          )
          write(path, text)

          # Structural postconditions before tests.
          assert 'allow_legacy_terminal' not in read('minecraft_mod_ai/research_coordinator.py')
          assert '_gate_research_first_to_production_router' not in read('minecraft_mod_ai/runtime_bootstrap.py')
          assert 'planning_seed_only=True' in read('minecraft_mod_ai/agentic_research_game_design.py')
          assert 'planning_seed_only=True' in read('minecraft_mod_ai/central_intelligence_amplifier.py')
          PY

      - name: Verify cleanup
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --prefer-binary -e '.[dev]'
          python -m compileall -q minecraft_mod_ai tests tools download_resources.py
          python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9
          python -m vulture minecraft_mod_ai tools download_resources.py --min-confidence 100
          python -c 'import minecraft_mod_ai'
          python -m pytest -q tests/test_runtime_bootstrap_clean.py tests/test_agentic_research_game_design.py tests/test_research_coordinator.py tests/test_llama_parallel_runtime_contract.py

      - name: Commit cleanup and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/runtime-ownership-cleanup-once.yml
          git add minecraft_mod_ai/research_coordinator.py minecraft_mod_ai/agentic_research_game_design.py minecraft_mod_ai/central_intelligence_amplifier.py minecraft_mod_ai/runtime_bootstrap.py tests/test_llama_parallel_runtime_contract.py
          git commit -m 'Consolidate research runtime ownership'
          git pull --rebase origin main
          git push origin main
