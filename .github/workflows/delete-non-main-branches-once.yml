name: Delete non-main branches once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete known non-main branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "chatgpt/fix-progress-aware-rag-20260819"
            "chatgpt/semantic-plan-delta-20260819"
            "chatgpt/semantic-plan-delta-v2-20260819"
            "fix/coder-forced-rag-recovery"
            "__never__"
          )
          for branch in "${branches[@]}"; do
            encoded=${branch//\//%2F}
            status=$(curl -sS -o /tmp/delete-response -w '%{http_code}' \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GH_REPO}/git/refs/heads/${encoded}")
            if [[ "$status" != "204" && "$status" != "422" && "$status" != "404" ]]; then
              cat /tmp/delete-response >&2
              exit 1
            fi
          done
