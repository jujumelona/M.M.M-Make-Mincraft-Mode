# Temporary one-time HOST metadata regeneration after canonical checksum repair.
name: Rebuild canonical HOST snapshot once
on:
  push:
    branches: [main]
    paths:
      - 'minecraft_mod_ai/populate_version_artifact_rules.py'
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --prefer-binary -e .
      - run: python -m minecraft_mod_ai.populate_version_artifact_rules
      - name: Commit coherent catalog and version evidence
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/data/host_version_catalog.json minecraft_mod_ai/data/official_version_evidence.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(host): republish canonical prefixed artifact rule checksums'
          git push origin HEAD:main
