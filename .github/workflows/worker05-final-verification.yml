name: Worker 05 Final Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/worker05-final-verification.yml'

permissions:
  contents: read

concurrency:
  group: worker05-final-verification
  cancel-in-progress: true

jobs:
  verify-worker05:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Compile Worker 05 runtime surface
        run: python -m compileall -q minecraft_mod_ai
      - name: Audit bootstrap ownership
        run: python .github/scripts/debug_repo_audit.py
      - name: Lint canonical Worker 05 owners
        run: >-
          ruff check
          minecraft_mod_ai/llama_server_hardware_policy.py
          minecraft_mod_ai/llama_decode_speed_contract.py
          minecraft_mod_ai/llama_stream_efficiency_contract.py
          minecraft_mod_ai/llama_completion_liveness_contract.py
          minecraft_mod_ai/llama_context_safety_contract.py
          minecraft_mod_ai/forced_tool_execution_contract.py
          minecraft_mod_ai/model_router.py
          minecraft_mod_ai/progress_aware_tool_loop.py
          minecraft_mod_ai/runtime_bootstrap.py
          tests/test_llama_prefill_telemetry_contract.py
          tests/test_llama_server_hardware_policy.py
          tests/test_llama_completion_liveness_contract.py
          tests/test_llama_forced_tool_capability_contract.py
          tests/test_llama_kv_correctness_contract.py
      - name: Run complete Worker 05 contract regression
        run: >-
          pytest -q
          tests/test_llama_prefill_telemetry_contract.py
          tests/test_llama_server_hardware_policy.py
          tests/test_llama_completion_liveness_contract.py
          tests/test_llama_sse_error_contract.py
          tests/test_agent_tool_round_policy.py
          tests/test_llama_context_safety_contract.py
          tests/test_agent_context_window_contract.py
          tests/test_llama_forced_tool_capability_contract.py
          tests/test_llama_kv_correctness_contract.py
