name: Clean Colab status once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean_colab_status_once.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize status messages
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/colab_runtime_setup.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'f"🔄 Automatically reloading engine modules (commit {previous_commit[:7] if previous_commit else \'old\'} -> {used_commit[:7]})..."': 'f"engine reload: {previous_commit[:7] if previous_commit else \'old\'} -> {used_commit[:7]}"',
              'print("✅ Pre-built llama-cpp-python CUDA wheel with GPU support verified.", flush=True)': 'print("llama-cpp-python CUDA wheel: available", flush=True)',
              'print("⚡ Installing pre-built llama-cpp-python CUDA wheel...", flush=True)': 'print("llama-cpp-python CUDA wheel: installing", flush=True)',
              'print(f"📦 Installing M.M.M project dependencies ({target})...", flush=True)': 'print("project dependencies: installing", target, flush=True)',
              'print("✅ M.M.M project package installed successfully!", flush=True)': 'print("project dependencies: installed", flush=True)',
              'print("ℹ️ Qwen3.5 fast path kernels not active; standard PyTorch execution path enabled.", flush=True)': 'print("Qwen3.5 fast path: unavailable; using standard PyTorch", flush=True)',
              'print("✅ Qwen3.5 CUDA fast-path kernels verified.", flush=True)': 'print("Qwen3.5 fast path: available", flush=True)',
              'print("ℹ️ Standard PyTorch execution path silently falling back.", flush=True)': 'print("Qwen3.5 fast path: unavailable; using standard PyTorch", flush=True)',
              'print("🔍 Validating checkout integrity...", flush=True)': 'print("checkout: validating", flush=True)',
              'print("🔧 Checking CUDA GPU availability...", flush=True)': 'print("CUDA: checking", flush=True)',
              '    print("=" * 60, flush=True)\n    _install_project(local_profile=profile in LOCAL_PROFILES)\n    print("=" * 60, flush=True)': '    _install_project(local_profile=profile in LOCAL_PROFILES)',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected text: {old}')
              text = text.replace(old, new)
          for banned in ('✅', '⚡', '🔍', '🔧', 'ℹ️', '🔄'):
              if banned in text:
                  raise SystemExit(f'unsupported status decoration remains: {banned}')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/colab_runtime_setup.py
          git commit -m 'fix(colab): report setup states without hype'
          git push origin HEAD:main
