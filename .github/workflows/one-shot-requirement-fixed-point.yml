name: One Shot Requirement Fixed Point Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-requirement-fixed-point.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-requirement-fixed-point
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -q -e '.[dev]'
      - name: Apply true semantic fixed-point repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('minecraft_mod_ai/planning_state_resolution.py')
          source = source_path.read_text(encoding='utf-8')
          old_doc = '''    A full page only means the response envelope was filled, so it requests another
              page. A continuation page that re-enters an already accepted exact requirement is
              a deterministic convergence witness: reject that entire page and keep the last
              fully novel set. This avoids a second model call whose schema is unrelated to the
              page router and keeps termination evidence in the same protocol.
          '''
          new_doc = '''    A full page only means the response envelope was filled, so it requests another
              page whenever that response advances the requirement frontier. Repeated exact
              requirements are ignored, but they do not authorize dropping novel requirements
              that arrived in the same page. The fixed point is reached only when a continuation
              contributes no previously unseen requirement. Context exhaustion remains a
              fail-closed execution safety boundary rather than a semantic completion signal.
          '''
          if old_doc not in source:
              raise SystemExit('expected requirement-pagination doc block not found')
          source = source.replace(old_doc, new_doc, 1)

          start = source.find('        if repeated_prior:\n')
          end = source.find('        seen.update(page_seen)\n', start)
          if start < 0 or end < 0:
              raise SystemExit('expected repeated-prior termination block not found')
          replacement = '\n'.join([
              '        if not page_rows:',
              '            emit_root_cause(',
              '                "planner_requirement_page", stage="planning_state",',
              '                operation="researched_requirement_compile", result="COMPLETE",',
              '                reason="REQUIREMENT_SEMANTIC_FRONTIER_EXHAUSTED",',
              '                details={',
              '                    "page_index": page_index, "page_requirement_count": len(rows),',
              '                    "accepted_requirement_count": 0,',
              '                    "discarded_repeat_count": len(repeated_prior),',
              '                    "repeated_prior_requirements": repeated_prior,',
              '                    "total_requirement_count": len(collected), "requirements": rows,',
              '                },',
              '            )',
              '            return {"requirements": collected}',
              '',
          ])
          source = source[:start] + replacement + source[end:]
          old_full = '        page_full = len(page_rows) >= page_size\n'
          new_full = '        page_full = len(rows) >= page_size\n'
          if old_full not in source:
              raise SystemExit('expected page-full expression not found')
          source = source.replace(old_full, new_full, 1)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/test_planning_regressions_20260913.py')
          test = test_path.read_text(encoding='utf-8')
          if '    assert len(router.calls) == 3\n' not in test or '    second_messages = router.calls[2]["messages"]\n' not in test:
              raise SystemExit('expected stale first pagination assertions not found')
          test = test.replace('    assert len(router.calls) == 3\n', '    assert len(router.calls) == 2\n', 1)
          test = test.replace(
              '    second_messages = router.calls[2]["messages"]\n',
              '    second_messages = router.calls[1]["messages"]\n',
              1,
          )

          page_start = test.find(
              '            {\n'
              '                "requirements": [\n'
              '                    self._row("Paraphrased economy requirement", "economy_again"),\n'
          )
          page_end = test.find('        ]\n\n    @staticmethod', page_start)
          if page_start < 0 or page_end < 0:
              raise SystemExit('expected mixed repeat fixture page not found')
          new_pages = '\n'.join([
              '            {',
              '                "requirements": [',
              '                    self._row("Requirement 13", "cap_13"),',
              '                    self._row("Requirement 14", "cap_14"),',
              '                    self._row("Requirement 5", "cap_5"),',
              '                    self._row("Requirement 6", "cap_6"),',
              '                ]',
              '            },',
              '            {',
              '                "requirements": [',
              '                    self._row("Requirement 13", "cap_13"),',
              '                    self._row("Requirement 14", "cap_14"),',
              '                    self._row("Requirement 5", "cap_5"),',
              '                    self._row("Requirement 6", "cap_6"),',
              '                ]',
              '            },',
              '',
          ])
          test = test[:page_start] + new_pages + test[page_end:]

          test_start = test.find('def test_explicit_coverage_review_closes_frontier_without_requesting_partial_page() -> None:\n')
          test_end = test.find('\ndef test_success_postcondition_primary_schema_matches_atomic_recovery_bound()', test_start)
          if test_start < 0 or test_end < 0:
              raise SystemExit('expected stale frontier regression test not found')
          new_test = '\n'.join([
              'def test_mixed_repeat_page_keeps_novel_requirements_until_true_fixed_point() -> None:',
              '    router = _RepeatedFrontierRouter()',
              '    result = _generate_requirement_pages(router, _requirement_messages(), 100_000)',
              '',
              '    assert len(router.calls) == 5',
              '    assert len(result["requirements"]) == 14',
              '    statements = [row["statement"] for row in result["requirements"]]',
              '    assert statements[-2:] == ["Requirement 13", "Requirement 14"]',
              '    assert statements.count("Requirement 5") == 1',
              '    assert statements.count("Requirement 6") == 1',
              '',
          ])
          test = test[:test_start] + new_test + test[test_end:]
          test_path.write_text(test, encoding='utf-8')
          PY
          git diff --check
      - name: Verify fixed-point and planner liveness regressions
        run: >-
          python -m pytest -q
          tests/test_planning_regressions_20260913.py
          tests/test_planning_convergence_contract.py
          tests/test_planning_progress_monotone.py
          tests/test_planning_deadline_hardening.py
      - name: Static check repaired Python
        run: python -m ruff check minecraft_mod_ai/planning_state_resolution.py tests/test_planning_regressions_20260913.py --select F,E7,E9
      - name: Commit repair locally
        shell: bash
        run: |
          git rm -f .github/workflows/one-shot-requirement-fixed-point.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add minecraft_mod_ai/planning_state_resolution.py tests/test_planning_regressions_20260913.py
          git add -u .github/workflows/one-shot-requirement-fixed-point.yml
          git diff --cached --check
          git commit -m 'fix: stop requirement paging at true fixed point'
      - name: Rebase onto latest main and reverify merged tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git rebase origin/main
          python -m pytest -q \
            tests/test_planning_regressions_20260913.py \
            tests/test_planning_convergence_contract.py \
            tests/test_planning_progress_monotone.py \
            tests/test_planning_deadline_hardening.py
          python -m ruff check minecraft_mod_ai/planning_state_resolution.py tests/test_planning_regressions_20260913.py --select F,E7,E9
          git push origin HEAD:main
