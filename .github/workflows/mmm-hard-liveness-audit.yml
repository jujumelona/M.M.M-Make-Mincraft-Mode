name: hard liveness audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hard-liveness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Enforce canonical bounded concurrency ownership
        run: python .github/scripts/audit_runtime_concurrency.py
      - name: Verify deadline executor lifecycle
        run: python -m pytest -q tests/test_deadline_executor_ownership.py
