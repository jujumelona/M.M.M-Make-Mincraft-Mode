name: Apply isolated test fixture root fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-fixture-root-fix-main
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Patch fixture without weakening generator fail-closed guard
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/conftest.py')
          text = path.read_text(encoding='utf-8')
          old = '    fake_java = tmp_path / "fake-java-21"\n'
          new = (
              '    # Runtime helpers must live outside a project root that generator tests expect empty.\n'
              '    fake_java = tmp_path.parent / f"{tmp_path.name}-fake-java-21"\n'
          )
          if text.count(old) != 1:
              raise SystemExit('fixture anchor missing or ambiguous')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git add tests/conftest.py
          git rm .github/workflows/apply-fixture-root-fix.yml
          git diff --cached --check
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Verify both previously failing generator tests
        run: >-
          python -m pytest -q
          tests/test_hardened_release_gates.py::test_boss_spawn_egg_model_is_generated_without_map_commands
          tests/test_distribution_truthfulness.py::test_generator_declares_only_the_tested_platform_predicates
      - name: Static sanity
        run: |
          python -m compileall -q tests/conftest.py
          python .github/scripts/debug_repo_audit.py
      - name: Commit and push verified fixture fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jujumelona'
          git config user.email 'qasdaa025@gmail.com'
          git commit -m 'Keep runtime test helpers outside generator roots'
          git push origin HEAD:main
