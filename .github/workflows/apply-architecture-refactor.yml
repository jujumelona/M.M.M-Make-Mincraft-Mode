name: Apply Remaining Architecture Refactor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-architecture-refactor.yml'

permissions:
  contents: write

concurrency:
  group: apply-remaining-architecture-refactor
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact refactor
        run: python tools/refactor_remaining_architecture.py

      - name: Validate syntax and diff
        run: |
          python -m compileall -q minecraft_mod_ai
          git diff --check
          git status --short

      - name: Commit exact refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/model_adapters/llama_cpp_adapter.py minecraft_mod_ai/complete_orchestrator.py tools/refactor_remaining_architecture.py .github/workflows/apply-architecture-refactor.yml
          git diff --cached --exit-code && { echo 'No refactor changes produced'; exit 1; } || true
          git commit -m 'refactor: resolve remaining architecture deltas'
          git push origin HEAD:main
