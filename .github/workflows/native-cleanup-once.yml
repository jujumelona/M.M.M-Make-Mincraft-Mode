name: Native cleanup once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-cleanup-once.yml

permissions:
  contents: write

concurrency:
  group: mmm-native-cleanup-once
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
      - name: Migrate Openverse fixes into canonical owner
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          ecosystem = Path("minecraft_mod_ai/ecosystem_discovery.py")
          replace_once(
              ecosystem,
              """        elif provider == 'github':\n            candidates, total, next_position = self._search_github(query, page=position or 1, limit=limit, target_profile=target_profile, target=target)\n        elif provider == 'wikipedia':\n            candidates, total, next_position = self._search_wikipedia(query, offset=position, limit=limit)\n""",
              """        elif provider == 'github':\n            candidates, total, next_position = self._search_github(query, page=position or 1, limit=limit, target_profile=target_profile, target=target)\n        elif provider == 'openverse_images':\n            candidates, total, next_position = self._search_openverse(query, media_type='images', page=position or 1, limit=limit)\n        elif provider == 'wikipedia':\n            candidates, total, next_position = self._search_wikipedia(query, offset=position, limit=limit)\n""",
          )
          replace_once(
              ecosystem,
              """            {'id': identifier, 'title': str(item.get('title') or 'Untitled'), 'creator': str(item.get('creator') or ''), 'source_url': source_url, 'license_id': license_id, 'provider': str(item.get('provider') or ''), 'source': str(item.get('source') or '')}\n        page_count = _nonnegative_int(raw.get('page_count'))\n""",
              """            title = str(item.get('title') or 'Untitled').strip() or 'Untitled'\n            creator = str(item.get('creator') or '').strip()\n            attribution = str(item.get('attribution') or '').strip()\n            if not attribution:\n                attribution = f'{title} by {creator}, {license_id}' if creator else f'{title}, {license_id}'\n            stable = {'id': identifier, 'title': title, 'creator': creator, 'source_url': source_url, 'license_id': license_id, 'provider': str(item.get('provider') or ''), 'source': str(item.get('source') or '')}\n            candidates.append(EcosystemCandidate(candidate_id=f'openverse:{identifier}', provider='openverse_images', resource_kind='image_asset', title=title, summary=f'Openverse image metadata by {creator}.' if creator else 'Openverse image metadata.', source_url=source_url, api_url=_safe_https_url(item.get('detail_url'), allow_empty=True), license_id=license_id, license_url=_safe_https_url(item.get('license_url'), allow_empty=True), license_policy=_media_license_policy(license_name), minecraft_version='not_applicable', loader='not_applicable', compatibility='visual_reference_only; verify origin, dimensions, and exact license before reuse', attribution=attribution, preview_urls=_safe_preview_urls([item.get('thumbnail')], allowed_hosts=None), reuse_status='origin_license_verification_required', evidence_sha256=_sha256_text(canonical_json(stable)), metadata={'creator': creator, 'provider': stable['provider'], 'source': stable['source']}))\n        page_count = _nonnegative_int(raw.get('page_count'))\n""",
          )
          replace_once(
              ecosystem,
              """    joined = ' '.join((part.strip() for part in parts if part.strip()))\n    encoded = joined.encode('utf-8')\n    if len(encoded) <= 2000:\n        return joined\n    return encoded[:2000].decode('utf-8', errors='ignore').rstrip()\n""",
              """    return ' '.join(part.strip() for part in parts if part.strip())\n""",
          )

          Path("minecraft_mod_ai/runtime_regression_fixes.py").write_text(
              '''from __future__ import annotations\n\n"""Temporary research-RAG integration pending native ownership migration."""\n\n_INSTALLED = False\n\n\ndef _fix_research_hotpaths() -> None:\n    from . import centroid_vector_rag, rag_index, research_rag_performance\n\n    research_rag_performance.harden(rag_index, centroid_vector_rag)\n\n\ndef install() -> None:\n    global _INSTALLED\n    if _INSTALLED:\n        return\n    _fix_research_hotpaths()\n    _INSTALLED = True\n\n\n__all__ = ["install"]\n''',
              encoding="utf-8",
          )
          PY
      - name: Validate migrated modules
        run: |
          python -m compileall -q minecraft_mod_ai/ecosystem_discovery.py minecraft_mod_ai/runtime_regression_fixes.py
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('minecraft_mod_ai/runtime_regression_fixes.py').read_text())
          assignments = []
          for node in ast.walk(tree):
              if isinstance(node, (ast.Assign, ast.AnnAssign, ast.AugAssign)):
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  for target in targets:
                      if isinstance(target, ast.Attribute):
                          assignments.append(ast.unparse(target))
          if assignments:
              raise SystemExit(f'behavioral attribute assignment remains: {assignments}')
          PY
      - name: Commit cleanup and remove one-shot workflow
        run: |
          rm .github/workflows/native-cleanup-once.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "refactor(discovery): make Openverse behavior canonical"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
