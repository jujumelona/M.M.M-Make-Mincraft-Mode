name: Fix llama tool-aware startup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-llama-tool-jinja-startup.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply fix
        run: python .github/scripts/fix_llama_tool_jinja_startup.py
      - name: Validate focused contracts
        run: |
          python -m pip install -q -e '.[dev]'
          python -m py_compile \
            minecraft_mod_ai/llama_server_autotune.py \
            minecraft_mod_ai/model_adapters/llama_cpp_adapter.py \
            minecraft_mod_ai/minecraft_knowledge_contract.py \
            tools/colab_runtime_setup.py \
            tests/test_llama_tool_startup_contract.py
          python -m ruff check \
            minecraft_mod_ai/llama_server_autotune.py \
            minecraft_mod_ai/model_adapters/llama_cpp_adapter.py \
            minecraft_mod_ai/minecraft_knowledge_contract.py \
            tools/colab_runtime_setup.py \
            tests/test_llama_tool_startup_contract.py \
            --select F,E7,E9
          python -m pytest -q \
            tests/test_llama_tool_startup_contract.py \
            tests/test_llama_server_autotune.py \
            tests/test_llama_cpp_adapter_request_contract.py \
            tests/test_minecraft_knowledge_contract.py \
            tests/test_parallel_research_recovery.py
      - name: Commit validated fix to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/scripts/fix_llama_tool_jinja_startup.py
          rm .github/workflows/fix-llama-tool-jinja-startup.yml
          git add \
            minecraft_mod_ai/llama_server_autotune.py \
            minecraft_mod_ai/model_adapters/llama_cpp_adapter.py \
            minecraft_mod_ai/minecraft_knowledge_contract.py \
            tools/colab_runtime_setup.py \
            tests/test_llama_tool_startup_contract.py \
            .github/scripts/fix_llama_tool_jinja_startup.py \
            .github/workflows/fix-llama-tool-jinja-startup.yml
          git diff --cached --check
          git commit -m "Make native llama tool startup deterministic"
          git pull --rebase origin main
          git push origin HEAD:main
