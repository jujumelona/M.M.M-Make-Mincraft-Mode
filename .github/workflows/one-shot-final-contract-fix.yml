name: One-shot final contract fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-final-contract-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply exact contract patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          scalar = Path("minecraft_mod_ai/source_edit_scalar_protocol_contract.py")
          replace_once(
              scalar,
              '_ACCEPTED_OPERATIONS = tuple(sorted(set(_CANONICAL_OPERATIONS) | set(_OPERATION_ALIASES.keys())))\n',
              '''_MODEL_OPERATION_ENUM = (*_CANONICAL_OPERATIONS, "replace", "create", "delete")
SOURCE_EDIT_PARAMETER_ALIASES = {
    "file": "path",
    "target_path": "path",
    "target_file": "path",
    "new_text": "new",
    "new_content": "new",
    "replacement": "new",
    "old_text": "old",
    "code": "content",
    "body": "content",
}
''',
          )
          replace_once(scalar, '"enum": list(_ACCEPTED_OPERATIONS),', '"enum": list(_MODEL_OPERATION_ENUM),')
          scalar_text = scalar.read_text(encoding="utf-8")
          start = scalar_text.index("def _canonicalize_payload_aliases(")
          end = scalar_text.index("\n\ndef _normalize_operation", start)
          replacement = '''def _canonicalize_payload_aliases(payload: Mapping[str, Any]) -> dict[str, Any]:
    normalized = dict(payload)
    for alias, canonical in SOURCE_EDIT_PARAMETER_ALIASES.items():
        if alias in normalized and canonical not in normalized:
            normalized[canonical] = normalized.pop(alias)
    return normalized
'''
          scalar.write_text(scalar_text[:start] + replacement + scalar_text[end:], encoding="utf-8")
          replace_once(
              scalar,
              '__all__ = ["SOURCE_EDIT_SCHEMA", "materialize_model_source_edit"]',
              '__all__ = ["SOURCE_EDIT_PARAMETER_ALIASES", "SOURCE_EDIT_SCHEMA", "materialize_model_source_edit"]',
          )

          parser = Path("minecraft_mod_ai/model_adapters/qwen_tool_parser.py")
          replace_once(
              parser,
              'from ..model_tool_aliases import resolve_exposed_model_tool\n',
              'from ..model_tool_aliases import resolve_exposed_model_tool\nfrom ..source_edit_scalar_protocol_contract import SOURCE_EDIT_PARAMETER_ALIASES\n',
          )
          parser_text = parser.read_text(encoding="utf-8")
          marker = "\n_MAX_CONTAINER_DEPTH = 3"
          if parser_text.count(marker) != 1:
              raise SystemExit("qwen parser: unexpected container-depth marker count")
          alias_merge = '''
_APPLY_SOURCE_EDIT_ALIASES = {
    **SOURCE_EDIT_PARAMETER_ALIASES,
    **_APPLY_SOURCE_EDIT_TRANSPORT_ALIASES,
}
'''
          parser.write_text(parser_text.replace(marker, alias_merge + marker, 1), encoding="utf-8")
          replace_once(
              parser,
              '_APPLY_SOURCE_EDIT_TRANSPORT_ALIASES.get(emitted_key)',
              '_APPLY_SOURCE_EDIT_ALIASES.get(emitted_key)',
          )
          replace_once(
              parser,
              'for alias, canonical in _APPLY_SOURCE_EDIT_TRANSPORT_ALIASES.items()',
              'for alias, canonical in _APPLY_SOURCE_EDIT_ALIASES.items()',
          )

          trajectory = Path("minecraft_mod_ai/trajectory_memory.py")
          trajectory_text = trajectory.read_text(encoding="utf-8")
          marker = "\n\ndef _collect_execution_context("
          if trajectory_text.count(marker) != 1:
              raise SystemExit("trajectory memory: unexpected collect marker count")
          helper = '''

def _normalize_execution_context_value(
    key: str,
    value: Any,
) -> str | int | float | bool | None:
    normalized = _normalize_context_value(value)
    if key != "java_version" or normalized is None or isinstance(normalized, bool):
        return normalized
    if isinstance(normalized, str) and normalized.isdecimal():
        return int(normalized)
    if isinstance(normalized, float) and normalized.is_integer():
        return int(normalized)
    return normalized
'''
          trajectory.write_text(trajectory_text.replace(marker, helper + marker, 1), encoding="utf-8")
          replace_once(
              trajectory,
              '                normalized = _normalize_context_value(raw_value)\n',
              '                normalized = _normalize_execution_context_value(key, raw_value)\n',
          )

          temp_test = Path("tests/test_temporary_skill_reuse.py")
          replace_once(
              temp_test,
              '    monkeypatch.setenv("MMM_LOADER", "fabric")\n',
              '    monkeypatch.setenv("MMM_LOADER", "fabric")\n    monkeypatch.setenv("MMM_JAVA_VERSION", "21")\n',
          )

          ownership = Path("tests/test_source_edit_alias_ownership.py")
          replace_once(
              ownership,
              'from minecraft_mod_ai.source_edit_scalar_protocol_contract import SOURCE_EDIT_SCHEMA\n',
              'from minecraft_mod_ai.source_edit_scalar_protocol_contract import (\n    SOURCE_EDIT_PARAMETER_ALIASES,\n    SOURCE_EDIT_SCHEMA,\n)\n',
          )
          replace_once(
              ownership,
              '''    scalar_aliases = {
        "file",
        "target_path",
        "target_file",
        "new_text",
        "new_content",
        "replacement",
        "old_text",
        "code",
        "body",
    }
    assert transport.isdisjoint(properties)
    assert scalar_aliases <= properties
    assert scalar_aliases.isdisjoint(transport)
''',
              '''    scalar_aliases = set(SOURCE_EDIT_PARAMETER_ALIASES)
    assert transport.isdisjoint(properties)
    assert scalar_aliases <= properties
    assert scalar_aliases.isdisjoint(transport)
    assert all(
        qwen_tool_parser._APPLY_SOURCE_EDIT_ALIASES[alias] == canonical
        for alias, canonical in SOURCE_EDIT_PARAMETER_ALIASES.items()
    )
''',
          )
          PY
      - name: Run focused regressions
        run: >-
          python -m pytest -q
          tests/test_source_edit_protocol_ownership_regression.py
          tests/test_qwen_apply_source_edit_alias.py
          tests/test_source_edit_alias_ownership.py
          tests/test_source_edit_text_alias.py
          tests/test_temporary_skill_reuse.py
      - name: Commit validated source fixes
        shell: bash
        run: |
          git config user.name "jujumelona"
          git config user.email "qasdaa025@gmail.com"
          git add minecraft_mod_ai/source_edit_scalar_protocol_contract.py
          git add minecraft_mod_ai/model_adapters/qwen_tool_parser.py
          git add minecraft_mod_ai/trajectory_memory.py
          git add tests/test_temporary_skill_reuse.py
          git add tests/test_source_edit_alias_ownership.py
          git diff --cached --check
          git commit -m "refactor(contracts): single-own source aliases and normalize java context"
          git push origin HEAD:main
