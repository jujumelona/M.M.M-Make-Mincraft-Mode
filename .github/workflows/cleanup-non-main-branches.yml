name: Cleanup non-main branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete non-main branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for branch in \
            fix/exhaustive-template-pipeline \
            fix/finalize-runtime-ci \
            fix/runtime-verifier-readiness \
            fix/source-edit-canonicalization \
            fix/source-edit-discriminated-recovery \
            perf/consolidate-scattered-bottlenecks-20260908 \
            perf/remove-systemic-bottlenecks
          do
            encoded="${branch//\//%2F}"
            status="$(curl -sS -o /tmp/delete.json -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GH_REPO}/git/refs/heads/${encoded}")"
            if [ "$status" != "204" ] && [ "$status" != "422" ]; then
              cat /tmp/delete.json
              exit 1
            fi
          done
