name: One-shot native targetless retrieval v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-native-targetless-retrieval-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply native targetless retrieval patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python .github/scripts/patch_targetless_retrieval.py
          python -m compileall -q minecraft_mod_ai tests/test_live_rag_target_submission_guard.py
          python -m pip install -q pytest
          python -m pytest -q tests/test_live_rag_target_submission_guard.py
          git diff --check
          rm -f .github/workflows/one-shot-native-targetless-retrieval-v2.yml
          rm -f .github/scripts/patch_targetless_retrieval.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: own targetless retrieval in retrieval layer"
          git push origin HEAD:main
