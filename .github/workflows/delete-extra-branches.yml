name: delete-extra-branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete-extra-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete non-main branches
        run: |
          git push origin --delete cleanup-history-lifecycle || true
          git push origin --delete small-ai-template-audit || true
          git push origin --delete __do_not_create__ || true
