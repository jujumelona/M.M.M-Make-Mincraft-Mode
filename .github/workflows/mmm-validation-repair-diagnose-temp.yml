name: MMM validation repair diagnose

on:
  push:
    paths:
      - '.github/workflows/mmm-validation-repair-diagnose-temp.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply candidate patch in runner only
        run: python .github/scripts/mmm_fix_validation_repair_logs_temp.py
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run focused tests with captured output
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv tests/test_validation_repair_regressions.py 2>&1 | tee focused-test.log
      - name: Upload focused test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-repair-focused-log
          path: focused-test.log
          if-no-files-found: error
