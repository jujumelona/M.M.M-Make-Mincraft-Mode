name: MMM production liveness static audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmm-liveness-static-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Scan production Python liveness and executor ownership hazards
        run: python .github/scripts/audit_runtime_concurrency.py
