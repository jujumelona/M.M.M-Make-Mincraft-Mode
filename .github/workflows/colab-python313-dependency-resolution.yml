name: Colab Python 3.13 dependency resolution

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'tools/colab_pip_constraints.txt'
      - 'tools/colab_runtime_setup.py'
      - '.github/workflows/colab-python313-dependency-resolution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify full local Colab image stack can resolve before downloading wheels
        shell: bash
        run: |
          set -euo pipefail
          python -m pip --version
          timeout --signal=TERM --kill-after=10s 240s \
            python -m pip install \
            --dry-run --prefer-binary --only-binary=:all: \
            --disable-pip-version-check --timeout 25 --retries 2 \
            --constraint tools/colab_pip_constraints.txt \
            -e '.[ui,local-model,rag,image,speech,production-audio]' \
            'Pillow==11.3.0' \
            'numpy==2.1.3' \
            'numba==0.61.2' \
            'llvmlite==0.44.0'
