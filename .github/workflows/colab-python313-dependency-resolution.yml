name: Colab Python 3.13 core dependency resolution

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'requirements-colab.txt'
      - 'tools/colab_pip_constraints.txt'
      - 'tools/colab_runtime_setup.py'
      - 'tools/validate_colab_notebook.py'
      - 'M.M.M_Make_Mincraft_Mode_Colab.ipynb'
      - '.github/workflows/colab-python313-dependency-resolution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify core Colab extras resolve without removed image stack
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 240s \
            python -m pip install \
            --dry-run --prefer-binary --only-binary=:all: \
            --disable-pip-version-check --timeout 25 --retries 2 \
            --constraint tools/colab_pip_constraints.txt \
            -e '.[ui,local-model,rag,speech,production-audio]'
      - name: Smoke test installed core package and Colab build notebook
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -e . 'nbformat>=5.10,<6'
          python - <<'PY'
          from importlib.metadata import version
          from tools.colab_runtime_setup import _core_stack_preflight
          assert version('mmm-make-mincraft-mode')
          healthy, details = _core_stack_preflight()
          assert healthy, details
          print('COLAB_CORE_WITHOUT_REMBG: PASS')
          PY
          python tools/validate_colab_notebook.py
