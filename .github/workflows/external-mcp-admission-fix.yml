name: One-shot external MCP admission fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/external-mcp-admission-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Restore non-mutation OBSERVE tool admission
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/progress_aware_tool_loop.py')
          text = path.read_text(encoding='utf-8')

          old_sig = '''def _filter_tools_for_phase(\n    exposed_tools: Sequence[Mapping[str, Any]],\n    phase: LoopPhase,\n    role: str,\n    *,\n    mutation_context: TargetMutationContext | None = None,\n    attempted_sources: Sequence[str] | set[str] | frozenset[str] = frozenset(),\n) -> tuple[Mapping[str, Any], ...]:\n'''
          new_sig = '''def _filter_tools_for_phase(\n    exposed_tools: Sequence[Mapping[str, Any]],\n    phase: LoopPhase,\n    role: str,\n    *,\n    mutation_context: TargetMutationContext | None = None,\n    attempted_sources: Sequence[str] | set[str] | frozenset[str] = frozenset(),\n    localization_active: bool | None = None,\n) -> tuple[Mapping[str, Any], ...]:\n'''
          if text.count(old_sig) != 1:
              raise SystemExit('filter signature target drifted')
          text = text.replace(old_sig, new_sig, 1)

          old_observe = '''    if phase == LoopPhase.OBSERVE:\n        stage = (\n            mutation_context.localization_stage\n            if mutation_context is not None\n            else LocalizationStage.NEED_FILE\n        )\n        if stage == LocalizationStage.NEED_FILE:\n            preferred = ("search_code_rag", "search_project_rag", "inspect_existing_mod")\n            untried = [name for name in preferred if name in by_name and name not in attempted_sources]\n            selected_names = [untried[0]] if untried else []\n        elif stage == LocalizationStage.NEED_SYMBOL:\n            preferred = ("java_workspace_symbols", "search_code_rag", "search_project_rag")\n            untried = [name for name in preferred if name in by_name and name not in attempted_sources]\n            selected_names = [untried[0]] if untried else []\n        elif stage == LocalizationStage.NEED_BODY:\n            preferred = ("search_code_rag", "inspect_existing_mod")\n            untried = [name for name in preferred if name in by_name and name not in attempted_sources]\n            selected_names = [untried[0]] if untried else []\n        else:\n            selected_names = [name for name in by_name if name in _READ_OBSERVE_TOOLS]\n'''
          new_observe = '''    if phase == LoopPhase.OBSERVE:\n        if localization_active is None:\n            localization_active = mutation_context is not None\n        if not localization_active:\n            selected_names = [name for name in by_name if name in _READ_OBSERVE_TOOLS]\n        else:\n            stage = (\n                mutation_context.localization_stage\n                if mutation_context is not None\n                else LocalizationStage.NEED_FILE\n            )\n            if stage == LocalizationStage.NEED_FILE:\n                preferred = ("search_code_rag", "search_project_rag", "inspect_existing_mod")\n                untried = [name for name in preferred if name in by_name and name not in attempted_sources]\n                selected_names = [untried[0]] if untried else []\n            elif stage == LocalizationStage.NEED_SYMBOL:\n                preferred = ("java_workspace_symbols", "search_code_rag", "search_project_rag")\n                untried = [name for name in preferred if name in by_name and name not in attempted_sources]\n                selected_names = [untried[0]] if untried else []\n            elif stage == LocalizationStage.NEED_BODY:\n                preferred = ("search_code_rag", "inspect_existing_mod")\n                untried = [name for name in preferred if name in by_name and name not in attempted_sources]\n                selected_names = [untried[0]] if untried else []\n            else:\n                selected_names = [name for name in by_name if name in _READ_OBSERVE_TOOLS]\n'''
          if text.count(old_observe) != 1:
              raise SystemExit('OBSERVE admission target drifted')
          text = text.replace(old_observe, new_observe, 1)

          old_call = '''            mutation_context=(state.mutation_context if mutation_localization_active else None),\n            attempted_sources=phase_attempted_sources,\n        )\n'''
          new_call = '''            mutation_context=(state.mutation_context if mutation_localization_active else None),\n            attempted_sources=phase_attempted_sources,\n            localization_active=mutation_localization_active,\n        )\n'''
          if text.count(old_call) != 1:
              raise SystemExit('generate_with_tools filter call target drifted')
          text = text.replace(old_call, new_call, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_localization_bottleneck_contract.py')
          test = test_path.read_text(encoding='utf-8')
          addition = '''\n\ndef test_non_mutation_observe_keeps_reviewed_external_mcp_available() -> None:\n    tools = (\n        _schema("external_mcp_call"),\n        _schema("external_mcp_schema"),\n        _schema("search_code_rag"),\n        _schema("apply_source_edit"),\n    )\n    selected = loop._filter_tools_for_phase(\n        tools,\n        loop.LoopPhase.OBSERVE,\n        "coder",\n        localization_active=False,\n    )\n    assert _names(selected) == (\n        "external_mcp_call",\n        "external_mcp_schema",\n        "search_code_rag",\n    )\n\n\ndef test_mutation_need_file_still_narrows_observe_tools_without_context() -> None:\n    tools = (\n        _schema("external_mcp_call"),\n        _schema("search_code_rag"),\n        _schema("search_project_rag"),\n    )\n    selected = loop._filter_tools_for_phase(\n        tools,\n        loop.LoopPhase.OBSERVE,\n        "coder",\n        mutation_context=None,\n        localization_active=True,\n    )\n    assert _names(selected) == ("search_code_rag",)\n'''
          if 'test_non_mutation_observe_keeps_reviewed_external_mcp_available' not in test:
              test_path.write_text(test + addition, encoding='utf-8')
          PY
          python -m pytest -q tests/test_external_mcp_role_scope.py tests/test_localization_bottleneck_contract.py tests/test_agent_tool_calling.py
          python -m compileall -q minecraft_mod_ai
      - name: Commit fix directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft_mod_ai/progress_aware_tool_loop.py tests/test_localization_bottleneck_contract.py
          git rm .github/workflows/external-mcp-admission-fix.yml
          git commit -m "fix: preserve external MCP admission outside mutation localization"
          git push origin HEAD:main
