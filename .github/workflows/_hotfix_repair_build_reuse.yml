name: Apply repair build reuse hotfix

on:
  push:
    paths:
      - .github/workflows/_hotfix_repair_build_reuse.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact production and regression-test patch
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path

          orchestrator = Path('minecraft_mod_ai/complete_orchestrator.py')
          text = orchestrator.read_text(encoding='utf-8')
          old = """                repair_result = RepairEngine(router=router, gradle_cache=cache, policy=self.policy).repair(project_root, run_gametest=options.run_gametest, max_attempts=options.max_repair_attempts)\n                build_result = GradleRunner(cache).build(project_root, run_gametest=options.run_gametest).to_dict()\n"""
          new = """                repair_result = RepairEngine(router=router, gradle_cache=cache, policy=self.policy).repair(project_root, run_gametest=options.run_gametest, max_attempts=options.max_repair_attempts)\n                repair_evidence = repair_result.get('evidence') if isinstance(repair_result, dict) else None\n                repaired_build = repair_evidence.get('build') if isinstance(repair_evidence, dict) else None\n                if (\n                    repair_result.get('status') == 'PASS'\n                    and isinstance(repair_evidence, dict)\n                    and repair_evidence.get('passed') is True\n                    and isinstance(repaired_build, dict)\n                    and repaired_build.get('status') == 'PASS'\n                ):\n                    # RepairEngine already ran the final Gradle/GameTest validation on\n                    # the repaired tree. Reuse that attested receipt instead of running\n                    # the identical expensive build a third time.\n                    build_result = dict(repaired_build)\n                else:\n                    # Preserve fail-closed compatibility for alternate repair engines\n                    # that do not provide a validated build receipt.\n                    build_result = GradleRunner(cache).build(project_root, run_gametest=options.run_gametest).to_dict()\n"""
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one orchestrator target, found {text.count(old)}')
          orchestrator.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_complete_session_public_e2e.py')
          test = test_path.read_text(encoding='utf-8')
          old_test = """class _FakeRepairEngine:\n    calls = 0\n\n    def __init__(self, *args: object, **kwargs: object) -> None:\n        pass\n\n    def repair(self, *args: object, **kwargs: object) -> dict[str, object]:\n        type(self).calls += 1\n        return {\n            \"status\": \"PASS\",\n            \"attempts\": 1,\n            \"patch_receipts\": [],\n        }\n"""
          new_test = """class _FakeRepairEngine:\n    calls = 0\n\n    def __init__(self, *args: object, **kwargs: object) -> None:\n        pass\n\n    def repair(\n        self,\n        project_root: Path,\n        *,\n        run_gametest: bool = True,\n        max_attempts: int | None = None,\n    ) -> dict[str, object]:\n        del max_attempts\n        type(self).calls += 1\n        validation = _FakeGradleRunner(Path('.')).build(\n            project_root, run_gametest=run_gametest\n        ).to_dict()\n        assert validation.get(\"status\") == \"PASS\"\n        return {\n            \"status\": \"PASS\",\n            \"attempts\": 1,\n            \"evidence\": {\"passed\": True, \"build\": validation},\n            \"patch_receipts\": [],\n        }\n"""
          if test.count(old_test) != 1:
              raise SystemExit(f'expected exactly one E2E fake target, found {test.count(old_test)}')
          test_path.write_text(test.replace(old_test, new_test, 1), encoding='utf-8')
          PY
          python -m py_compile minecraft_mod_ai/complete_orchestrator.py tests/test_complete_session_public_e2e.py
          git diff --check
          git diff --exit-code --quiet && { echo 'No changes produced'; exit 1; } || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/complete_orchestrator.py tests/test_complete_session_public_e2e.py
          git commit -m 'fix: reuse validated repair build evidence'
          git push origin HEAD:main
