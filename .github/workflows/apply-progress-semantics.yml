name: Repair runtime bootstrap

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-progress-semantics.yml

permissions:
  contents: write

concurrency:
  group: repair-runtime-bootstrap-main
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair stale runtime owners
        run: python .github/scripts/repair_runtime_bootstrap.py
      - name: Verify package import
        run: |
          python -m pip install --prefer-binary -e '.[dev]'
          python -m compileall -q minecraft_mod_ai
          python -c "import minecraft_mod_ai; from minecraft_mod_ai.colab_run_modes import prepare_existing_mod_input; print('bootstrap import OK')"
          python -m ruff check minecraft_mod_ai/runtime_bootstrap.py --select F,E7,E9
          git diff --check
      - name: Commit bootstrap repair
        run: |
          git add minecraft_mod_ai/runtime_bootstrap.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove stale runtime bootstrap contract imports'
          git pull --rebase origin main
          git push origin HEAD:main
