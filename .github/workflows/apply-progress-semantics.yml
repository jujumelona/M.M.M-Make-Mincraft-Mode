name: Apply progress semantics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-progress-semantics.yml

permissions:
  contents: write

concurrency:
  group: apply-progress-semantics-main
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply progress and bootstrap semantics
        run: |
          python .github/scripts/repair_runtime_bootstrap.py
          python .github/scripts/fix_progress_test.py
          python .github/scripts/apply_progress_semantics.py
      - name: Verify progress semantics
        run: |
          python -m pip install --prefer-binary -e '.[dev]'
          python -m ruff check \
            minecraft_mod_ai/runtime_bootstrap.py \
            minecraft_mod_ai/model_router.py \
            minecraft_mod_ai/agent_tool_runtime.py \
            minecraft_mod_ai/planner_incremental_resume_contract.py \
            minecraft_mod_ai/complete_planner.py \
            tests/test_planner_incremental_repair_contract.py \
            tests/test_complete_planner_scaling.py \
            tests/test_agent_tool_calling.py \
            --select F,E7,E9
          python -c "import minecraft_mod_ai"
          python -m pytest -q \
            tests/test_runtime_bootstrap_clean.py \
            tests/test_planner_incremental_repair_contract.py \
            tests/test_complete_planner_scaling.py \
            tests/test_agent_tool_calling.py \
            tests/test_agent_tool_runtime_colab_stdio.py
          git diff --check
      - name: Commit and self-delete
        run: |
          git rm .github/workflows/apply-progress-semantics.yml
          git rm .github/scripts/apply_progress_semantics.py
          git rm .github/scripts/fix_progress_test.py
          git rm .github/scripts/repair_runtime_bootstrap.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove remaining planner progress ceilings and stale bootstrap owners'
          git pull --rebase origin main
          git push origin HEAD:main
