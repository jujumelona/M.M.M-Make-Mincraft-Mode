name: Apply progress semantics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-progress-semantics.yml

permissions:
  contents: write

concurrency:
  group: apply-progress-semantics-main
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Repair runtime bootstrap owners
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('minecraft_mod_ai/runtime_bootstrap.py')
          text = path.read_text(encoding='utf-8')

          old = "    install_execution_efficiency(\n        complete_planner_module=complete_planner,\n        work_graph_module=work_graph,\n    )"
          block = "    install_execution_efficiency(\n        work_graph_module=work_graph,\n    )"
          compact = "    install_execution_efficiency(work_graph_module=work_graph)"
          if old in text:
              text = text.replace(old, block, 1)
          elif block not in text and compact not in text:
              raise SystemExit('execution-efficiency bootstrap call not recognized')

          stale_imports = "    from . import mcp_server, mcp_tools, model_router, platform_resolver, production_tools\n"
          live_imports = "    from . import mcp_tools, platform_resolver\n"
          if stale_imports in text:
              text = text.replace(stale_imports, live_imports, 1)
          elif live_imports not in text:
              raise SystemExit('public-boundary import owner shape not recognized')

          stale = (
              "    from .agent_tool_calling_contract import install as install_agent_tools\n",
              "    install_agent_tools(model_router, mcp_server, production_tools)\n",
              "    from .platform_mcp_compatibility_contract import install as install_platform_mcp_compatibility\n",
              "    install_platform_mcp_compatibility(mcp_tools)\n",
          )
          for value in stale:
              text = text.replace(value, '', 1)
          forbidden = (
              'agent_tool_calling_contract',
              'install_agent_tools(',
              'platform_mcp_compatibility_contract',
              'install_platform_mcp_compatibility(',
          )
          if any(value in text for value in forbidden):
              raise SystemExit('stale public-boundary owner still referenced')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply remaining progress semantics
        run: |
          python .github/scripts/fix_progress_test.py
          python .github/scripts/apply_progress_semantics.py
      - name: Verify progress semantics
        run: |
          python -m pip install --prefer-binary -e '.[dev]'
          python -m ruff check \
            minecraft_mod_ai/runtime_bootstrap.py \
            minecraft_mod_ai/model_router.py \
            minecraft_mod_ai/agent_tool_runtime.py \
            minecraft_mod_ai/planner_incremental_resume_contract.py \
            minecraft_mod_ai/complete_planner.py \
            tests/test_planner_incremental_repair_contract.py \
            tests/test_complete_planner_scaling.py \
            tests/test_agent_tool_calling.py \
            --select F,E7,E9
          python -c "import minecraft_mod_ai"
          python -m pytest -q \
            tests/test_runtime_bootstrap_clean.py \
            tests/test_planner_incremental_repair_contract.py \
            tests/test_complete_planner_scaling.py \
            tests/test_agent_tool_calling.py \
            tests/test_agent_tool_runtime_colab_stdio.py
          git diff --check
      - name: Commit and self-delete
        run: |
          git rm .github/workflows/apply-progress-semantics.yml
          git rm .github/scripts/apply_progress_semantics.py
          git rm .github/scripts/fix_progress_test.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Remove remaining planner progress ceilings and stale bootstrap owners'
          git pull --rebase origin main
          git push origin HEAD:main
