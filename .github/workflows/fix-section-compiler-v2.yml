name: Fix Section Compiler v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-section-compiler-v2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Remove stale external MCP exclusion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/patch-section-compiler-v2.yml')
          text = path.read_text(encoding='utf-8')
          stale = '    assert "external_mcp" not in providers\\n'
          if stale not in text:
              raise SystemExit('stale assertion not found')
          path.write_text(text.replace(stale, '', 1), encoding='utf-8')
          PY
      - name: Commit workflow correction
        run: |
          git config user.name "jujumelona"
          git config user.email "qasdaa025@gmail.com"
          git rm -f .github/workflows/fix-section-compiler-v2.yml
          git add .github/workflows/patch-section-compiler-v2.yml
          git diff --cached --check
          git commit -m "ci: remove stale external MCP exclusion"
          git pull --rebase origin main
          git push origin main
