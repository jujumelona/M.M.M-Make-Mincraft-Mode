name: Full Debug Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "M.M.M_Make_Mincraft_Mode_Colab.ipynb"
      - "minecraft_mod_ai/**"
      - "tests/test_colab_debug_fixture_path.py"
      - "tests/test_record_cardinality_blocking_contract.py"
      - "tests/test_worksheet_atomic_chunker.py"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: full-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-gate:
    name: Import, pytest, audit, package
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install debug dependencies
        run: python -m pip install --prefer-binary "build>=1,<2" -e ".[dev,ui]"

      - name: Catch stale or missing internal imports
        run: python .github/scripts/debug_repo_audit.py

      - name: Import package bootstrap
        run: python -c "import minecraft_mod_ai"

      - name: Execute Colab Debug fixture and focused regressions
        run: |
          python -m pytest -q \
            tests/test_colab_debug_fixture_path.py \
            tests/test_record_cardinality_blocking_contract.py \
            tests/test_worksheet_atomic_chunker.py

      - name: Run exhaustive project Debug audit with compact root-cause output
        if: ${{ always() }}
        run: python tools/root_cause_audit_wrapper.py

      - name: Upload Debug report even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: full-project-debug-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            audit/FULL_PROJECT_AUDIT.json
            audit/FULL_PROJECT_AUDIT.log
            audit/FULL_PROJECT_AUDIT.runner.log
            audit/dist/*
