name: Worker 04 Audit V2

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  worker04-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Compile and static audit
        run: |
          python -m py_compile minecraft_mod_ai/agent_capability_context.py minecraft_mod_ai/agent_roles.py minecraft_mod_ai/agent_tool_runtime.py minecraft_mod_ai/agent_intent.py minecraft_mod_ai/agent_routing_intent_contract.py minecraft_mod_ai/external_agent_bridge.py minecraft_mod_ai/external_mcp_router.py minecraft_mod_ai/model_router.py minecraft_mod_ai/progress_aware_tool_loop.py
          ruff check minecraft_mod_ai/agent_capability_context.py minecraft_mod_ai/agent_roles.py minecraft_mod_ai/agent_tool_runtime.py minecraft_mod_ai/agent_intent.py minecraft_mod_ai/agent_routing_intent_contract.py minecraft_mod_ai/external_agent_bridge.py minecraft_mod_ai/external_mcp_router.py minecraft_mod_ai/model_router.py minecraft_mod_ai/progress_aware_tool_loop.py || true
          vulture --min-confidence 90 minecraft_mod_ai/agent_capability_context.py minecraft_mod_ai/agent_roles.py minecraft_mod_ai/agent_tool_runtime.py minecraft_mod_ai/agent_intent.py minecraft_mod_ai/agent_routing_intent_contract.py minecraft_mod_ai/external_agent_bridge.py minecraft_mod_ai/external_mcp_router.py minecraft_mod_ai/model_router.py minecraft_mod_ai/progress_aware_tool_loop.py || true
      - name: Measure routing hot paths
        run: |
          python - <<'PY'
          import time
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from types import MethodType
          from unittest.mock import patch
          import anyio
          import minecraft_mod_ai.agent_capability_context as ctx
          from minecraft_mod_ai.external_mcp_router import ExternalMCPRouter
          from minecraft_mod_ai.model_adapters.base import ToolCall
          from minecraft_mod_ai.model_router import _execute_tool_waves

          orig = Path.read_text
          count = {'roles': 0}
          def wrapped(self, *a, **kw):
              if self.name == 'agent_roles.yaml':
                  count['roles'] += 1
              return orig(self, *a, **kw)
          tools = (
              {'type':'function','function':{'name':'search_code_rag','parameters':{'type':'object'}}},
              {'type':'function','function':{'name':'search_project_rag','parameters':{'type':'object'}}},
              {'type':'function','function':{'name':'external_mcp_capabilities','parameters':{'type':'object'}}},
          )
          with patch.object(Path, 'read_text', wrapped):
              filtered = ctx.filter_tool_schemas_for_role('generation', 'coder', tools)
              ctx.build_agent_capability_context('generation', filtered, model_role='coder')
          print('ROLE_CONFIG_READS_PER_PREPARE=', count['roles'])

          router = ExternalMCPRouter(timeout_seconds=2.0)
          async def fake(self, server_name, entry, *, tool, arguments):
              await anyio.sleep(0.25)
              return {'server_info': {}, 'result': {'ok': True}}
          router._call_provider_async = MethodType(fake, router)
          def one(i):
              return router._call_provider(f's{i}', {}, tool='t', arguments={})
          start = time.perf_counter()
          with ThreadPoolExecutor(max_workers=2) as pool:
              list(pool.map(one, range(2)))
          print(f'EXTERNAL_ROUTER_TWO_READS_SECONDS={time.perf_counter()-start:.3f}')

          calls = (
              ToolCall(id='1', name='external_mcp_call', arguments={'max_access':'read'}),
              ToolCall(id='2', name='external_mcp_call', arguments={'max_access':'read'}),
          )
          def execute(call):
              time.sleep(0.25)
              return call, {'ok': True}
          start = time.perf_counter()
          _execute_tool_waves(calls, execute)
          print(f'EXTERNAL_MCP_WAVE_TWO_READS_SECONDS={time.perf_counter()-start:.3f}')
          PY
      - name: Structural metrics
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          files = ['agent_capability_context.py','agent_roles.py','agent_tool_runtime.py','agent_intent.py','agent_routing_intent_contract.py','external_agent_bridge.py','external_mcp_router.py','model_router.py','progress_aware_tool_loop.py']
          for short in files:
              p = Path('minecraft_mod_ai') / short
              text = p.read_text(encoding='utf-8')
              tree = ast.parse(text)
              funcs = [n for n in ast.walk(tree) if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))]
              broad = [n for n in ast.walk(tree) if isinstance(n,ast.ExceptHandler) and (n.type is None or (isinstance(n.type,ast.Name) and n.type.id in {'Exception','BaseException'}))]
              largest = sorted(((getattr(n,'end_lineno',n.lineno)-n.lineno+1,n.name,n.lineno) for n in funcs), reverse=True)[:6]
              print(f'METRIC {short} lines={len(text.splitlines())} funcs={len(funcs)} broad_except={len(broad)} largest={largest}')
          PY
      - name: Targeted Worker 04 tests
        run: >-
          python -m pytest -q
          tests/test_agent_capability_context.py
          tests/test_agent_capability_manifest_degradation.py
          tests/test_agent_required_rag_semantic_choice.py
          tests/test_agent_tool_calling.py
          tests/test_external_agent_bridge.py
          tests/test_external_mcp_router.py
