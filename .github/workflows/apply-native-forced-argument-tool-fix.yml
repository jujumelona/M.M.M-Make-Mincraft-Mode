name: Apply native forced argument tool fix

on:
  push:
    paths:
      - 'tools/apply_native_forced_argument_tool_fix.py'
      - '.github/workflows/apply-native-forced-argument-tool-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Fix migration anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/apply_native_forced_argument_tool_fix.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('"def _fingerprint(\\n"', '"def _fingerprint("')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Apply migration
        run: python tools/apply_native_forced_argument_tool_fix.py
      - name: Install tests
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Verify native forced arguments
        run: >-
          python -m pytest -q
          tests/test_host_selected_mutation_action.py
          tests/test_fixed_template_generation_boundary.py
          tests/test_planning_criterion_fixed_templates.py
          tests/test_planning_criterion_fragment_repair.py
          tests/test_planning_requirement_batch_runtime.py
      - name: Compile
        run: python -m compileall -q minecraft_mod_ai
      - name: Commit migration
        run: |
          if git diff --quiet -- minecraft_mod_ai/native_atomic_argument_recovery.py tests/test_host_selected_mutation_action.py; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/native_atomic_argument_recovery.py tests/test_host_selected_mutation_action.py
          git commit -m 'fix: force native argument pages through tool calls'
          git push origin HEAD:main
