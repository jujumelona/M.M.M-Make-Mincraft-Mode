name: source-clean-retry

on:
  push:
    paths:
      - '.github/workflows/source-clean-retry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install project test dependencies
        run: python -m pip install --disable-pip-version-check -e . pytest
      - name: Prepare patched transformer
        shell: bash
        run: |
          mkdir -p scripts
          git show 8ffc39622e956d3dedd43a4195f4fed15b57ad42:scripts/one_shot_clean_refactor.py > scripts/one_shot_clean_refactor.py
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/source-clean-refactor.yml').read_text(encoding='utf-8')
          marker = "          cat > /tmp/source_clean_refactor.py <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY\n      - name: Rebase-safe", start)
          lines = src[start:end].splitlines()
          body = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          body = body.replace(
              'refactor._strip_capability(path, "audio", "speech", "voice", "tts", "asr")',
              'refactor._strip_capability(path, "audio", "speech", "voice", "tts", "asr", "audio_generator", "audio_resume_efficiency_contract", "planner_production_page_contract", "production_page_durable_contract", "SpeechAdapter", "speech_recognition", "generate-audio", "production-audio", "ai_voice")',
          )
          body = body.replace(
              'roots = [PKG, ROOT / "config", ROOT / "skills", ROOT / "plugins", ROOT / "tests"]',
              'roots = [PKG, ROOT / "config", ROOT / "skills", ROOT / "plugins"]',
          )
          Path('/tmp/source_clean_refactor.py').write_text(body, encoding='utf-8')
          PY
          cat > /tmp/clean_mixed_tests.py <<'PY'
          from __future__ import annotations
          import ast
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, os.getcwd())
          import scripts.one_shot_clean_refactor as refactor

          def _visit_try(self, node):
              node = self.generic_visit(node)
              if not node.body:
                  node.body = [ast.Pass()]
              for handler in node.handlers:
                  if not handler.body:
                      handler.body = [ast.Pass()]
              return node

          def _visit_body(self, node):
              node = self.generic_visit(node)
              if not node.body:
                  node.body = [ast.Pass()]
              return node

          for name in ("visit_FunctionDef", "visit_AsyncFunctionDef", "visit_ClassDef", "visit_With", "visit_AsyncWith", "visit_While"):
              setattr(refactor.CapabilityStripper, name, _visit_body)
          refactor.CapabilityStripper.visit_Try = _visit_try
          if hasattr(ast, "TryStar"):
              refactor.CapabilityStripper.visit_TryStar = _visit_try

          original = refactor._expr_contains_marker
          def expr_contains(node, markers):
              if node is None:
                  return False
              lowered = tuple(str(marker).lower() for marker in markers)
              for child in ast.walk(node):
                  if isinstance(child, ast.Constant) and isinstance(child.value, str):
                      if any(marker in child.value.lower() for marker in lowered):
                          return True
              return original(node, markers)
          refactor._expr_contains_marker = expr_contains

          markers = (
              "audio", "speech", "voice", "tts", "asr",
              "audio_generator", "audio_resume_efficiency_contract",
              "planner_production_page_contract", "production_page_durable_contract",
              "SpeechAdapter", "speech_recognition", "generate-audio",
              "production-audio", "ai_voice",
          )
          root = Path('tests')
          for path in sorted(root.glob('test_*.py')):
              if path.name == 'test_clean_production_contract.py':
                  continue
              text = path.read_text(encoding='utf-8', errors='ignore')
              if any(marker.lower() in text.lower() for marker in markers):
                  refactor._strip_capability(path, *markers)
          PY
      - name: Rebase-safe cleanup and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p scripts
            git show 8ffc39622e956d3dedd43a4195f4fed15b57ad42:scripts/one_shot_clean_refactor.py > scripts/one_shot_clean_refactor.py

            python /tmp/source_clean_refactor.py
            python /tmp/clean_mixed_tests.py
            python -m compileall -q minecraft_mod_ai tests
            python -m pytest -q tests/test_clean_production_contract.py
            git diff --check

            python - <<'PY'
          import re
          from pathlib import Path
          pattern = re.compile(r'AudioRequest|audio_generator|audio_resume_efficiency_contract|planner_production_page_contract|production_page_durable_contract|SpeechAdapter|speech_recognition|generate-audio|production-audio|ai_voice', re.I)
          offenders = []
          for root in (Path('minecraft_mod_ai'), Path('config'), Path('skills'), Path('plugins'), Path('tests')):
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path == Path('scripts/one_shot_clean_refactor.py'):
                      continue
                  if path.suffix.lower() not in {'.py', '.json', '.yaml', '.yml', '.md', '.toml'}:
                      continue
                  if pattern.search(path.read_text(encoding='utf-8', errors='ignore')):
                      offenders.append(str(path))
          if Path('pyproject.toml').exists() and pattern.search(Path('pyproject.toml').read_text(encoding='utf-8')):
              offenders.append('pyproject.toml')
          if offenders:
              raise SystemExit('removed capability references remain:\n' + '\n'.join(sorted(set(offenders))))
          PY

            changed_workflows="$(git diff --name-only | grep '^.github/workflows/' | grep -v -E '^.github/workflows/(source-clean-refactor|source-clean-retry)\.yml$' || true)"
            if [ -n "$changed_workflows" ]; then
              echo "refusing workflow mutation from GITHUB_TOKEN:" >&2
              echo "$changed_workflows" >&2
              exit 1
            fi

            rm -f scripts/one_shot_clean_refactor.py scripts/.gitkeep .github/workflows/source-clean-refactor.yml .github/workflows/source-clean-retry.yml
            git add -A
            git commit -m "refactor: enforce host planner schema and remove media subsystem"

            python - <<'PY'
          import subprocess
          def show(path):
              return subprocess.check_output(['git', 'show', f'HEAD:{path}'], text=True)
          spec = show('minecraft_mod_ai/complete_spec.py')
          template = show('minecraft_mod_ai/planner_template_schema.py')
          planner = show('minecraft_mod_ai/complete_planner.py')
          assert 'class ' + 'AudioRequest' not in spec
          assert 'except Exception:\n' not in spec
          assert '"a' + 'udio"' not in template
          assert 'implements_' + 'deliverables' not in template
          assert 'build_batch_skeleton' in planner and 'merge_model_output_into_skeleton' in planner
          pattern = r'AudioRequest|audio_generator|audio_resume_efficiency_contract|planner_production_page_contract|production_page_durable_contract|SpeechAdapter|speech_recognition|generate-audio|production-audio|ai_voice'
          p = subprocess.run(['git','grep','-n','-E',pattern,'HEAD','--','minecraft_mod_ai','config','pyproject.toml','skills','plugins','tests'], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          if p.returncode == 0:
              raise SystemExit('committed tree still contains removed capability references:\n' + p.stdout)
          if p.returncode not in (0,1):
              raise SystemExit(p.stderr)
          PY

            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "main kept moving; refusing stale overwrite" >&2
          exit 1
