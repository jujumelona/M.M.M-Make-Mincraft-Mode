name: One-shot clause-local semantic authority fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/semantic-clause-authority-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Make semantic approval clause-local and bounded
        run: |
          python .github/scripts/semantic_clause_authority_fix.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_semantic_requirement_authority.py')
          text = path.read_text(encoding='utf-8')
          old = '''    router = TextRouter([{"requirements": [\n        _item("resource.gathering", "gather crystals"),\n        _item("economy.trade", "trade crystals"),\n    ]}])\n'''
          new = '''    router = TextRouter([\n        {"requirements": [_item("resource.gathering", "gather crystals")]},\n        {"requirements": [_item("economy.trade", "trade crystals")]},\n    ])\n'''
          if text.count(old) != 1:
              raise SystemExit('semantic clause fixture drifted')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m compileall -q minecraft_mod_ai
          python -m pytest -q tests/test_semantic_requirement_authority.py
      - name: Commit fix directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft_mod_ai/semantic_requirement_authority.py tests/test_semantic_requirement_authority.py
          git rm .github/workflows/semantic-clause-authority-fix.yml .github/scripts/semantic_clause_authority_fix.py
          git commit -m "fix: approve semantic requirements clause by clause"
          git push origin HEAD:main
