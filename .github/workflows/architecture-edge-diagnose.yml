name: Architecture edge diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/architecture-edge-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Find import edges that merge SCCs
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import importlib.util
          import json
          from pathlib import Path

          ROOT = Path.cwd()
          audit_path = ROOT / '.github' / 'scripts' / 'audit_code_quality_regression.py'
          spec = importlib.util.spec_from_file_location('quality_audit', audit_path)
          audit = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(audit)
          base_ref = '9c1a538b3c0d9062356e6192bf991e7ce2cc8f53'

          def graph_for(sources):
              trees = {}
              for path, source in sources.items():
                  try:
                      trees[path] = ast.parse(source, filename=path)
                  except SyntaxError:
                      pass
              modules = {audit._module_name(path) for path in trees}
              graph = {
                  audit._module_name(path): audit._imports(path, tree, modules)
                  for path, tree in trees.items()
              }
              return graph, trees, modules

          base_sources = audit._git_sources(ROOT, base_ref)
          head_sources = audit._working_sources(ROOT)
          base_graph, _, _ = graph_for(base_sources)
          head_graph, head_trees, head_modules = graph_for(head_sources)
          base_cycles = audit._cycles(base_graph)
          head_cycles = audit._cycles(head_graph)
          new_cycles = sorted(head_cycles - base_cycles, key=lambda row: (-len(row), row))
          payload = []
          for cycle in new_cycles:
              nodes = set(cycle)
              head_edges = {(owner, target) for owner, targets in head_graph.items() if owner in nodes for target in targets if target in nodes}
              base_edges = {(owner, target) for owner, targets in base_graph.items() if owner in nodes for target in targets if target in nodes}
              introduced = sorted(head_edges - base_edges)
              payload.append({'cycle_size': len(cycle), 'introduced_internal_edges': introduced})
          print('NEW_CYCLE_EDGE_DELTA=' + json.dumps(payload, indent=2))

          # Also print every changed import edge globally. This catches bridge edges whose
          # endpoints were in separate baseline SCCs.
          head_edges = {(owner, target) for owner, targets in head_graph.items() for target in targets}
          base_edges = {(owner, target) for owner, targets in base_graph.items() for target in targets}
          print('ALL_INTRODUCED_IMPORT_EDGES=' + json.dumps(sorted(head_edges - base_edges), indent=2))
          PY
