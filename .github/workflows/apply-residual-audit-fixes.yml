name: Apply residual audit fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-residual-audit-fixes.yml

permissions:
  contents: write

# Idempotent retry: concurrent main already removed the legacy notebook cell.
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply residual fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/_audit_fix_residuals.py')
          s = p.read_text(encoding='utf-8')
          old = '    if removed != 1:\n        raise RuntimeError(f"expected one legacy MTP notebook cell, removed {removed}")\n'
          new = '    if removed not in {0, 1}:\n        raise RuntimeError(f"expected at most one legacy MTP notebook cell, removed {removed}")\n'
          if old not in s:
              raise SystemExit('helper notebook idempotency target changed')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python tools/_audit_fix_residuals.py
          python tools/_audit_fix_residuals2.py
          rm tools/_audit_fix_residuals.py tools/_audit_fix_residuals2.py
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]' ruff
      - name: Validate edited sources
        run: |
          python -m compileall -q minecraft_mod_ai tests tools
          python -m ruff check minecraft_mod_ai tools --select E9,F63,F7,F82
          python tools/validate_colab_notebook.py
      - name: Run residual targeted suite
        run: |
          python -m pytest -q --tb=short \
            tests/test_colab_native_llama_prebuilt_integration.py \
            tests/test_execution_efficiency_contract.py \
            tests/test_llama_server_streaming.py \
            tests/test_mcp_complete_plan_refs.py \
            tests/test_mcp_config.py \
            tests/test_model_runtime_performance_contract.py \
            tests/test_no_legacy_python_llama_runtime.py \
            tests/test_notebook_registry_policy.py \
            tests/test_planner_incremental_repair_contract.py \
            tests/test_planner_json_runtime_contract.py \
            tests/test_planner_outline_prompt_contract.py \
            tests/test_planner_pagination_safety_contract.py \
            tests/test_planner_strict_json_contract.py
      - name: Commit verified fixes
        run: |
          set -euo pipefail
          rm .github/workflows/apply-residual-audit-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix residual runtime and audit contracts'
          git pull --rebase origin main
          git push origin HEAD:main
