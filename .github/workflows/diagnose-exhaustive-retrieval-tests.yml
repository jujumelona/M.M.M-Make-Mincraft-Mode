name: diagnose exhaustive retrieval tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-exhaustive-retrieval-tests.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - name: Apply final worktree migration
        run: |
          python .github/scripts/patch_exhaustive_retrieval.py
          python .github/scripts/canonicalize_exhaustive_retrieval.py
          python .github/scripts/fix_exhaustive_retrieval_lint.py
          python -m ruff check --fix minecraft_mod_ai/github_adaptive_retrieval.py minecraft_mod_ai/research_grounded_rag_contract.py minecraft_mod_ai/pre_design_research_pipeline.py tests/test_exhaustive_retrieval_contract.py
      - name: Capture pytest failures
        run: |
          python -m pytest -vv --tb=long \
            tests/test_exhaustive_retrieval_contract.py \
            tests/test_pre_design_rag_root_cause.py \
            tests/test_grounded_rag_runtime_contract.py \
            tests/test_pre_design_research_pipeline.py \
            > pytest-retrieval.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: exhaustive-retrieval-test-diagnostics
          path: pytest-retrieval.txt
