name: Finalize Build Repair Checkpoint Split

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-build-repair-checkpoint.yml'

permissions:
  contents: write

concurrency:
  group: finalize-build-repair-checkpoint-split
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Move checkpoint orchestration to build-repair module
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          helper = Path('minecraft_mod_ai/complete_build_repair.py')
          helper.write_text('''"""Build/repair execution and checkpoint ownership for complete production."""

from __future__ import annotations

from collections.abc import Callable
from pathlib import Path
from typing import Any, Protocol

from .model_router import ModelRouter
from .repair_engine import RepairEngine
from .runner import GradleRunner
from .scale_policy import ScalePolicy
from .work_graph import DurableWorkLedger, run_named_checkpoint


class BuildRepairOptions(Protocol):
    run_gametest: bool
    auto_repair: bool
    max_repair_attempts: int | None


def _attested_repair_build(repair_result: Any) -> dict[str, Any] | None:
    if not isinstance(repair_result, dict) or repair_result.get("status") != "PASS":
        return None
    evidence = repair_result.get("evidence")
    if not isinstance(evidence, dict) or evidence.get("passed") is not True:
        return None
    build = evidence.get("build")
    if not isinstance(build, dict) or build.get("status") != "PASS":
        return None
    return build


def run_build_with_repair(
    *,
    project_root: Path,
    cache: Path,
    run_gametest: bool,
    auto_repair: bool,
    max_repair_attempts: int | None,
    router: ModelRouter | None,
    router_factory: Callable[[], ModelRouter],
    policy: ScalePolicy,
) -> tuple[dict[str, Any], ModelRouter | None]:
    """Run build, bounded repair when requested, and the fail-closed rebuild path."""

    build = GradleRunner(cache).build(project_root, run_gametest=run_gametest).to_dict()
    repair: dict[str, Any] | None = None
    active_router = router
    if build.get("status") != "PASS" and auto_repair:
        active_router = active_router or router_factory()
        repair = RepairEngine(
            router=active_router, gradle_cache=cache, policy=policy
        ).repair(
            project_root,
            run_gametest=run_gametest,
            max_attempts=max_repair_attempts,
        )
        attested = _attested_repair_build(repair)
        build = (
            dict(attested)
            if attested is not None
            else GradleRunner(cache).build(
                project_root, run_gametest=run_gametest
            ).to_dict()
        )
    return {"build": build, "repair": repair}, active_router


def run_build_repair_checkpoint(
    *,
    ledger: DurableWorkLedger,
    graph_hash: str,
    validation_manifest: str,
    project_root: Path,
    run_root: Path,
    options: BuildRepairOptions,
    router: ModelRouter | None,
    router_factory: Callable[[], ModelRouter],
    policy: ScalePolicy,
    validate_cached: Callable[[Any], bool],
) -> tuple[dict[str, Any], ModelRouter | None]:
    """Own the durable Gradle/repair checkpoint and return any router it activated."""

    cache = run_root / ".cache/gradle"
    active_router = router

    def action() -> dict[str, Any]:
        nonlocal active_router
        bundle, active_router = run_build_with_repair(
            project_root=project_root,
            cache=cache,
            run_gametest=options.run_gametest,
            auto_repair=options.auto_repair,
            max_repair_attempts=options.max_repair_attempts,
            router=active_router,
            router_factory=router_factory,
            policy=policy,
        )
        return bundle

    bundle = run_named_checkpoint(
        ledger,
        "gradle-build",
        stage="build",
        input_value={
            "graph_hash": graph_hash,
            "project_manifest": validation_manifest,
            "run_gametest": options.run_gametest,
            "auto_repair": options.auto_repair,
            "max_repair_attempts": options.max_repair_attempts,
        },
        action=action,
        encode=lambda value: value,
        decode=lambda cached: cached,
        validate_cached=lambda cached: validate_cached(cached.get("build")),
    )
    return bundle, active_router
''', encoding='utf-8')

          path = Path('minecraft_mod_ai/complete_orchestrator.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'from .complete_build_repair import run_build_with_repair\n'
          new_import = 'from .complete_build_repair import run_build_repair_checkpoint\n'
          if text.count(old_import) != 1:
              raise SystemExit(f'import anchor count={text.count(old_import)}')
          text = text.replace(old_import, new_import, 1)

          old = '''        cache = run_root / '.cache/gradle'\n\n        def build_with_repair() -> dict[str, Any]:\n            nonlocal router\n            bundle, router = run_build_with_repair(\n                project_root=project_root,\n                cache=cache,\n                run_gametest=options.run_gametest,\n                auto_repair=options.auto_repair,\n                max_repair_attempts=options.max_repair_attempts,\n                router=router,\n                router_factory=self.router_factory,\n                policy=self.policy,\n            )\n            return bundle\n        build_bundle = run_named_checkpoint(ledger, 'gradle-build', stage='build', input_value={'graph_hash': work_plan.graph_hash, 'project_manifest': validation_manifest, 'run_gametest': options.run_gametest, 'auto_repair': options.auto_repair, 'max_repair_attempts': options.max_repair_attempts}, action=build_with_repair, encode=lambda value: value, decode=lambda cached: cached, validate_cached=lambda cached: self._cached_build_exists(cached.get('build')))\n'''
          new = '''        build_bundle, router = run_build_repair_checkpoint(\n            ledger=ledger, graph_hash=work_plan.graph_hash,\n            validation_manifest=validation_manifest, project_root=project_root,\n            run_root=run_root, options=options, router=router,\n            router_factory=self.router_factory, policy=self.policy,\n            validate_cached=self._cached_build_exists,\n        )\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'build checkpoint block count={count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate split
        run: |
          python -m compileall -q minecraft_mod_ai
          git diff --check
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('minecraft_mod_ai/complete_orchestrator.py').read_text(encoding='utf-8'))
          for node in ast.walk(tree):
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == 'execute':
                  span = node.end_lineno - node.lineno + 1
                  print(f'execute span={span}')
                  if span > 382:
                      raise SystemExit(f'execute span still exceeds baseline: {span}')
                  break
          else:
              raise SystemExit('execute function not found')
          PY

      - name: Commit and remove one-shot workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-build-repair-checkpoint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/complete_build_repair.py minecraft_mod_ai/complete_orchestrator.py .github/workflows/finalize-build-repair-checkpoint.yml
          git diff --cached --exit-code && { echo 'No changes produced'; exit 1; } || true
          git commit -m 'refactor(orchestrator): move build checkpoint ownership'
          git push origin HEAD:main
