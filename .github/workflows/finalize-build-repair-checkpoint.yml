name: Finalize Build Repair Checkpoint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-build-repair-checkpoint.yml'

permissions:
  contents: write

concurrency:
  group: finalize-build-repair-checkpoint
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact responsibility split
        run: python tools/finalize_build_repair_checkpoint.py

      - name: Validate refactor
        run: |
          python -m compileall -q minecraft_mod_ai
          git diff --check

      - name: Commit and remove one-shot files
        run: |
          set -euo pipefail
          rm -f tools/finalize_build_repair_checkpoint.py
          rm -f .github/workflows/finalize-build-repair-checkpoint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/complete_build_repair.py minecraft_mod_ai/complete_orchestrator.py tools/finalize_build_repair_checkpoint.py .github/workflows/finalize-build-repair-checkpoint.yml
          git diff --cached --exit-code && { echo 'No changes produced'; exit 1; } || true
          git commit -m 'refactor(orchestrator): move build checkpoint ownership'
          git push origin HEAD:main
