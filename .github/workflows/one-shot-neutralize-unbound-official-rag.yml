name: one-shot neutralize unbound Official RAG

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-neutralize-unbound-official-rag.yml

permissions:
  contents: write

concurrency:
  group: one-shot-neutralize-unbound-official-rag
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Neutralize only missing-target Official RAG failure and verify
        shell: bash
        run: |
          set -Eeuo pipefail
          WORKFLOW=.github/workflows/one-shot-neutralize-unbound-official-rag.yml
          BASE_SHA=$(git rev-parse HEAD)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cleanup_failure() {
            status=$?
            git reset --hard "$BASE_SHA" || true
            rm -f "$WORKFLOW"
            git add -A
            if ! git diff --cached --quiet; then
              git commit -m "chore: remove failed Official RAG fallback repair" || true
              git push origin HEAD:main || true
            fi
            exit "$status"
          }
          trap cleanup_failure ERR

          python - <<'PY'
          import ast
          from pathlib import Path

          MESSAGE = "Official RAG requires a host-selected minecraft_version, loader and mappings."
          matches = []
          for path in Path("minecraft_mod_ai").rglob("*.py"):
              text = path.read_text(encoding="utf-8")
              if MESSAGE not in text:
                  continue
              tree = ast.parse(text)
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Raise) or not isinstance(node.exc, ast.Call):
                      continue
                  if any(isinstance(a, ast.Constant) and a.value == MESSAGE for a in node.exc.args):
                      matches.append((path, node.lineno, node.end_lineno or node.lineno))

          if len(matches) != 1:
              raise SystemExit(f"expected exactly one Official RAG missing-target raise, found {len(matches)}")

          path, start_line, end_line = matches[0]
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines(keepends=True)
          start = start_line - 1
          end = end_line - 1
          indent = lines[start][: len(lines[start]) - len(lines[start].lstrip())]
          newline = "\r\n" if lines[start].endswith("\r\n") else "\n"
          lines[start:end + 1] = [f"{indent}return []{newline}"]
          path.write_text("".join(lines), encoding="utf-8")
          print(f"neutralized exactly one missing-target Official RAG failure at {path}:{start_line}")
          PY

          git diff --check
          python -m compileall -q minecraft_mod_ai

          mapfile -t RELEVANT_TESTS < <(grep -RIlE 'Official RAG|saved_authored_design|agentic-rag-primary|official.*rag|minecraft_version.*loader.*mappings' tests 2>/dev/null || true)
          if (( ${#RELEVANT_TESTS[@]} > 0 )); then
            python -m pytest -q "${RELEVANT_TESTS[@]}"
          else
            python -m pytest -q -k 'rag or authored or production' --maxfail=1
          fi

          rm -f "$WORKFLOW"
          git add -A
          git commit -m "fix: allow production to continue without an Official RAG target"
          git push origin HEAD:main
          trap - ERR
