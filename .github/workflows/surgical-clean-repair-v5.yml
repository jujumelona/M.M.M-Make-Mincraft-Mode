name: surgical-clean-repair-v5
on:
  push:
    paths: ['.github/workflows/surgical-clean-repair-v5.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Apply verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          START="$(git rev-parse HEAD)"
          python - <<'PY'
          from pathlib import Path
          import yaml
          data = yaml.safe_load(Path('.github/workflows/surgical-clean-repair-v3.yml').read_text(encoding='utf-8'))
          steps = data['jobs']['repair']['steps']
          script = next(step['run'] for step in steps if step.get('name') == 'Apply verified cleanup')
          lines = script.splitlines()
          cut = next(i for i, line in enumerate(lines) if line.startswith('python -m vulture '))
          Path('/tmp/transform.sh').write_text('\n'.join(lines[:cut]) + '\n', encoding='utf-8')
          PY
          bash /tmp/transform.sh
          python - <<'PY'
          import ast
          from pathlib import Path

          def write_tree(path: Path, tree: ast.AST) -> None:
              ast.fix_missing_locations(tree)
              text = ast.unparse(tree) + '\n'
              compile(text, str(path), 'exec')
              path.write_text(text, encoding='utf-8')

          p = Path('minecraft_mod_ai/agentic_research_game_design.py')
          tree = ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
          class Reachability(ast.NodeTransformer):
              def visit_FunctionDef(self, node):
                  node = self.generic_visit(node)
                  if node.name != '_generate_section':
                      return node
                  for stmt in node.body:
                      if isinstance(stmt, ast.While) and isinstance(stmt.test, ast.Constant) and stmt.test.value is True:
                          for index, child in enumerate(stmt.body):
                              if isinstance(child, ast.Try):
                                  stmt.body = stmt.body[:index + 1]
                                  break
                  return node
          write_tree(p, Reachability().visit(tree))

          p = Path('minecraft_mod_ai/runtime_bootstrap.py')
          tree = ast.parse(p.read_text(encoding='utf-8'), filename=str(p))
          dead_modules = {'planner_module_identity_contract', 'planner_outline_identity_contract'}
          dead_calls = {'install_planner_module_identity', 'install_planner_outline_identity'}
          class Bootstrap(ast.NodeTransformer):
              def visit_ImportFrom(self, node):
                  module = node.module or ''
                  if any(module.endswith(name) for name in dead_modules):
                      return None
                  return self.generic_visit(node)
              def visit_Expr(self, node):
                  if isinstance(node.value, ast.Call) and isinstance(node.value.func, ast.Name) and node.value.func.id in dead_calls:
                      return None
                  return self.generic_visit(node)
          write_tree(p, Bootstrap().visit(tree))

          for path in (
              Path('minecraft_mod_ai/planner_module_identity_contract.py'),
              Path('minecraft_mod_ai/planner_outline_identity_contract.py'),
          ):
              path.unlink(missing_ok=True)
          PY
          python -m compileall -q minecraft_mod_ai tests tools download_resources.py
          python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9 --fix
          python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9
          python -m vulture minecraft_mod_ai tools download_resources.py --min-confidence 100
          python -m pytest -q \
            tests/test_clean_production_contract.py \
            tests/test_research_coordinator.py \
            tests/test_agentic_search_efficiency_contract.py \
            tests/test_parallel_result_determinism_contract.py \
            tests/test_technology_radar.py
          git diff --check
          test -f minecraft_mod_ai/model_adapters/image_diffusion.py
          test -f minecraft_mod_ai/blockbench_client.py
          grep -q 'FLUX.2-klein-4B' config/model_registry.yaml
          grep -q 'build_batch_skeleton' minecraft_mod_ai/complete_planner.py
          grep -q 'merge_model_output_into_skeleton' minecraft_mod_ai/complete_planner.py
          ! grep -q 'def _expand_batches' minecraft_mod_ai/complete_planner.py
          ! grep -q 'def _expand_one_batch' minecraft_mod_ai/complete_planner.py
          ! grep -q 'module_batches' minecraft_mod_ai/complete_planner.py
          ! git grep -n -E 'AudioRequest|audio_generator|audio_resume_efficiency_contract|planner_production_page_contract|production_page_durable_contract|SpeechAdapter|speech_recognition|generate-audio|production-audio|ai_voice|planner_module_identity_contract|planner_outline_identity_contract' -- minecraft_mod_ai config pyproject.toml tests
          test "$(git rev-parse HEAD)" = "$START"
      - name: Commit and push verified source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add minecraft_mod_ai tests config pyproject.toml skills plugins
          git diff --cached --check
          git commit -m 'refactor: restore clean non-media production paths'
          git push origin HEAD:main
