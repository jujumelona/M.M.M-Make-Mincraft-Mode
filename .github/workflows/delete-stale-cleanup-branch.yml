name: Delete stale cleanup branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  delete-merged-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged cleanup branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body -L -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/cleanup%2Funtangle-runtime-20260817"
