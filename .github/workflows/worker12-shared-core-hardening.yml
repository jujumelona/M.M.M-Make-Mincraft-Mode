name: Worker 12 shared-core hardening

on:
  push:
    paths:
      - '.github/worker12-shared-core-hardening.trigger'

permissions:
  contents: write

concurrency:
  group: worker12-shared-core-hardening
  cancel-in-progress: false

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply exact worker 12 patch
        run: |
          python .github/scripts/worker12_shared_core_patch.py
          python .github/scripts/worker12_shared_core_followup.py
      - name: Static and architecture gates
        run: |
          python -m compileall -q minecraft_mod_ai tests tools download_resources.py
          python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9
          vulture minecraft_mod_ai tools download_resources.py --min-confidence 100
          python .github/scripts/debug_repo_audit.py
          python .github/scripts/audit_runtime_mutations.py --output /tmp/worker12-runtime-mutations.json
          python tools/validate_colab_notebook.py
      - name: Worker 12 regression suite
        run: |
          python -m pytest -q \
            tests/test_worker12_shared_core.py \
            tests/test_worker10_validation_fail_closed.py \
            tests/test_validation_execution_contract.py \
            tests/test_runtime_bootstrap_clean.py \
            tests/test_runtime_contract_composer.py \
            tests/test_runtime_contract_composer_ownership.py \
            tests/test_runtime_wrapper_signature_integrity.py \
            tests/test_remote_store_defaults.py \
            tests/test_remote_trajectory_auth_preflight.py \
            tests/test_colab_prefetch_bootstrap.py \
            tests/test_colab_run_modes.py
      - name: Commit tested source patch
        run: |
          git add minecraft_mod_ai tools tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: harden worker12 shared runtime boundaries'
      - name: Rebase, re-test, and push main
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            python -m pytest -q \
              tests/test_worker12_shared_core.py \
              tests/test_worker10_validation_fail_closed.py \
              tests/test_validation_execution_contract.py \
              tests/test_runtime_bootstrap_clean.py \
              tests/test_runtime_contract_composer.py \
              tests/test_runtime_contract_composer_ownership.py \
              tests/test_runtime_wrapper_signature_integrity.py \
              tests/test_remote_store_defaults.py \
              tests/test_remote_trajectory_auth_preflight.py \
              tests/test_colab_prefetch_bootstrap.py \
              tests/test_colab_run_modes.py
            if git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
          done
          exit 1
