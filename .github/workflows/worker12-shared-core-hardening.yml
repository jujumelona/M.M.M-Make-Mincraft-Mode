name: Worker 12 shared-core hardening

on:
  push:
    paths:
      - .github/worker12-shared-core-hardening.trigger

permissions:
  contents: write

concurrency:
  group: worker12-shared-core-hardening
  cancel-in-progress: false

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply worker 12 shared-core patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} exact matches, found {found}")
              target.write_text(text.replace(old, new, count), encoding="utf-8")

