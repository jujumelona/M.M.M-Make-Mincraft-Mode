name: Template Contract Validation

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'minecraft_mod_ai/templates/**'
      - 'minecraft_mod_ai/**/*.py'
      - 'minecraft_mod_ai/data/*version*.json'
      - 'tests/test_packaged_version_catalog.py'
      - 'tests/test_template*.py'
      - 'tests/test_runtime_cardinality_policy.py'
      - 'tests/test_atomic_slot_executor.py'
      - 'tests/test_task_template*.py'
      - 'tests/test_resolved_version_context.py'
      - 'tests/test_platform_target_resolution.py'
      - 'tests/test_template_contracts.py'
      - 'tests/test_template_contract_integrity.py'
      - 'tests/test_visual_review_template_contract.py'
      - '.github/workflows/template-contract-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Validate template contracts
        id: template_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_template_contracts.py tests/test_template_contract_integrity.py tests/test_template_mirror_integrity.py tests/test_template_authority_contract.py tests/test_template_fail_closed.py tests/test_template_version_prefill.py tests/test_task_template_runner_deterministic.py tests/test_runtime_cardinality_policy.py tests/test_atomic_slot_executor.py tests/test_resolved_version_context.py tests/test_platform_target_resolution.py tests/test_packaged_version_catalog.py tests/test_visual_review_template_contract.py 2>&1 | tee template-contract-pytest.log
      - name: Capture template consumers
        if: always()
        shell: bash
        run: |
          {
            echo '=== packaged template references ==='
            grep -RInE 'minecraft_mod_ai[^[:space:]]*templates|templates/' minecraft_mod_ai tests pyproject.toml 2>/dev/null || true
          } > template-consumers.log
      - name: Upload template validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: template-contract-diagnostics
          path: |
            template-contract-pytest.log
            template-consumers.log
          if-no-files-found: error
          retention-days: 1
      - name: Lint contract tests
        run: |
          python -m ruff check tests/test_template_contracts.py tests/test_template_contract_integrity.py tests/test_runtime_cardinality_policy.py tests/test_visual_review_template_contract.py --select F,E7,E9
      - name: Fail if template validation failed
        if: steps.template_tests.outcome != 'success'
        run: exit 1
