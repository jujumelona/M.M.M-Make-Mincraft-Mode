name: Template Contract Validation

on:
  push:
    branches: [main]
    paths:
      - 'templates/**'
      - 'minecraft_mod_ai/templates/**'
      - 'tests/test_template_contracts.py'
      - 'tests/test_template_contract_integrity.py'
      - '.github/workflows/template-contract-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Validate template contracts
        run: |
          python -m pytest -q tests/test_template_contracts.py tests/test_template_contract_integrity.py
      - name: Lint contract tests
        run: |
          python -m ruff check tests/test_template_contracts.py tests/test_template_contract_integrity.py --select F,E7,E9
