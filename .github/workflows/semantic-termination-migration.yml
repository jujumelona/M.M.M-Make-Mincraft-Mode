          cat > tests/test_agent_tool_round_liveness.py <<'PYTEST'
          from __future__ import annotations

          from pathlib import Path

          from minecraft_mod_ai.termination_contract import (
              SemanticTerminationLedger,
              TerminationReason,
              TerminationStatus,
              decide_terminal_state,
          )


          def test_identical_semantic_state_reaches_fixed_point_without_attempt_counter() -> None:
              ledger = SemanticTerminationLedger()
              state = {"phase": "OBSERVE", "evidence": (), "actions": ("search",)}
              assert ledger.observe(state, made_progress=False).status == TerminationStatus.CONTINUE
              decision = ledger.observe(state, made_progress=False)
              assert decision.status == TerminationStatus.BLOCKED
              assert decision.reason == TerminationReason.FIXED_POINT


          def test_semantic_cycle_is_detected_without_patience_window() -> None:
              ledger = SemanticTerminationLedger()
              a = {"phase": "OBSERVE", "frontier": "A"}
              b = {"phase": "ACT", "frontier": "B"}
              assert ledger.observe(a, made_progress=False).status == TerminationStatus.CONTINUE
              assert ledger.observe(b, made_progress=False).status == TerminationStatus.CONTINUE
              decision = ledger.observe(a, made_progress=False)
              assert decision.status == TerminationStatus.BLOCKED
              assert decision.reason == TerminationReason.SEMANTIC_CYCLE


          def test_real_progress_allows_revisit_of_prior_state() -> None:
              ledger = SemanticTerminationLedger()
              state = {"phase": "OBSERVE", "frontier": "same"}
              ledger.observe(state, made_progress=False)
              progressed = ledger.observe(state, made_progress=True)
              assert progressed.status == TerminationStatus.CONTINUE
              revisit = ledger.observe({"phase": "ACT", "frontier": "new"}, made_progress=False)
              assert revisit.status == TerminationStatus.CONTINUE


          def test_unknown_verifier_never_counts_as_success() -> None:
              decision = decide_terminal_state(
                  unresolved_criteria=(),
                  verifier_status="UNKNOWN",
                  admissible_actions=("verify",),
              )
              assert decision.status == TerminationStatus.CONTINUE


          def test_acceptance_and_verifier_pass_are_required_for_success() -> None:
              decision = decide_terminal_state(
                  unresolved_criteria=(),
                  verifier_status="PASS",
                  evidence=("build receipt",),
              )
              assert decision.status == TerminationStatus.SUCCESS
              assert decision.reason == TerminationReason.ACCEPTANCE_SATISFIED


          def test_external_dependency_and_resource_guard_are_not_success() -> None:
              blocked = decide_terminal_state(
                  unresolved_criteria=("download dependency",),
                  blockers=("registry unavailable",),
                  admissible_actions=(),
              )
              assert blocked.status == TerminationStatus.BLOCKED
              assert blocked.reason == TerminationReason.EXTERNAL_DEPENDENCY

              guarded = decide_terminal_state(
                  unresolved_criteria=("verify build",),
                  admissible_actions=("verify",),
                  resource_guard="context budget exhausted",
              )
              assert guarded.status == TerminationStatus.INCONCLUSIVE
              assert guarded.reason == TerminationReason.RESOURCE_GUARD


          def test_production_loop_contains_no_numeric_semantic_round_or_streak_guard() -> None:
              source = Path('minecraft_mod_ai/progress_aware_tool_loop.py').read_text(encoding='utf-8')
              router = Path('minecraft_mod_ai/model_router.py').read_text(encoding='utf-8')
              for token in (
                  'no_progress_streak',
                  'forced_rag_attempts',
                  '_agent_tool_round_limit',
                  'MMM_AGENT_TOOL_ROUNDS',
                  'round_limit',
              ):
                  assert token not in source
                  assert token not in router
              assert 'SemanticTerminationLedger' in source
              assert 'TerminationStatus.BLOCKED' in source
          PYTEST

          python -m compileall -q minecraft_mod_ai
          pytest -q tests/test_agent_tool_round_liveness.py

          echo '=== remaining semantic retry/counter candidates ==='
          if git grep -n -E 'no_progress_streak|forced_rag_attempts|_agent_tool_round_limit|MMM_AGENT_TOOL_ROUNDS|MMM_AGENT_DEFAULT_TOOL_ROUNDS' -- minecraft_mod_ai tests; then
            echo 'legacy semantic counter contract remains' >&2
            exit 1
          fi

      - name: Commit verified migration and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/semantic-termination-migration.yml
          git config user.name 'OpenAI semantic termination migration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'Replace agent retry caps with semantic termination'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
