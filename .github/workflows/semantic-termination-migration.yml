          )
          replacement = '''class RetrievalProgress:
              """Retrieval frontier tracker using semantic fixed-point detection."""

              def __init__(self, state: HostRunState | None = None) -> None:
                  self._state = state or HostRunState()
                  self.attempted_queries = self._state.attempted_queries
                  self.attempted_sources = self._state.attempted_sources
                  self.evidence_fingerprints = self._state.evidence_fingerprints
                  self._lock = self._state._lock
                  self._termination = SemanticTerminationLedger()

              def begin(self, tool_name: str, arguments: Mapping[str, Any]) -> RetrievalDecision:
                  if self._state.record_query(tool_name, arguments):
                      return RetrievalDecision.EXECUTE
                  return RetrievalDecision.DUPLICATE_QUERY

              def _frontier(self) -> dict[str, Any]:
                  return {
                      "attempted_sources": tuple(sorted(self.attempted_sources)),
                      "evidence_fingerprints": tuple(sorted(self.evidence_fingerprints)),
                  }

              def observe(
                  self,
                  *args: Any,
                  usable: bool = True,
                  **kwargs: Any,
              ) -> RetrievalObservation:
                  if len(args) >= 3:
                      value = args[2]
                  elif len(args) >= 1:
                      value = args[0]
                  else:
                      value = kwargs.get("value")

                  if not usable:
                      decision = self._termination.observe(self._frontier(), made_progress=False)
                      if decision.status == TerminationStatus.BLOCKED:
                          raise RetrievalNoProgressError(
                              f"retrieval semantic termination: {decision.reason.value}"
                          )
                      return RetrievalObservation.WEAK
                  if self._state.record_evidence(value, usable=True):
                      self._termination.observe(self._frontier(), made_progress=True)
                      return RetrievalObservation.FRESH
                  decision = self._termination.observe(self._frontier(), made_progress=False)
