                          snapshot,
                          made_progress=made_progress,
                      )
                      self.last_termination_decision = decision
                      return decision

              def next_untried_internal_tool('''
          text, n = pattern.subn(replacement, text, count=1)
          if n != 1:
              raise SystemExit(f'HostRunState no-progress method block replacement count={n}')

          pattern = re.compile(
              r'class RetrievalProgress:\n.*?\n\n_CODE_MARKERS =',
