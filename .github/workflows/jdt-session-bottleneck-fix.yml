name: One-shot JDT session bottleneck fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/jdt-session-bottleneck-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Reuse initialized JDT language-server sessions
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/java_lsp.py')
          text = path.read_text(encoding='utf-8')
          init_old = '''        self.diagnostic_quiet_seconds = diagnostic_quiet_seconds\n\n    def diagnostics(\n'''
          init_new = '''        self.diagnostic_quiet_seconds = diagnostic_quiet_seconds\n        self._session_lock = threading.RLock()\n        self._rpc: _JsonRpcProcess | None = None\n        self._project_root: Path | None = None\n\n    @staticmethod\n    def _rpc_alive(rpc: _JsonRpcProcess) -> bool:\n        process = getattr(rpc, "process", None)\n        poll = getattr(process, "poll", None)\n        return not callable(poll) or poll() is None\n\n    def _close_rpc_locked(self) -> None:\n        rpc = self._rpc\n        self._rpc = None\n        self._project_root = None\n        if rpc is not None:\n            rpc.close()\n\n    def _ensure_rpc_locked(\n        self,\n        root: Path,\n        *,\n        timeout_seconds: int,\n    ) -> _JsonRpcProcess:\n        rpc = self._rpc\n        if (\n            rpc is not None\n            and self._project_root == root\n            and self._rpc_alive(rpc)\n        ):\n            return rpc\n        if rpc is not None:\n            self._close_rpc_locked()\n        rpc = _JsonRpcProcess(self.command, root)\n        try:\n            rpc.request(\n                "initialize",\n                {\n                    "processId": os.getpid(),\n                    "rootUri": root.as_uri(),\n                    "capabilities": {\n                        "textDocument": {\n                            "publishDiagnostics": {"relatedInformation": True}\n                        },\n                        "workspace": {\n                            "workspaceFolders": True,\n                            "symbol": {},\n                        },\n                    },\n                    "workspaceFolders": list(rpc.workspace_folders),\n                },\n                timeout=min(timeout_seconds, 45),\n            )\n            rpc.notify("initialized", {})\n        except BaseException:\n            rpc.close()\n            raise\n        self._rpc = rpc\n        self._project_root = root\n        return rpc\n\n    def close(self) -> None:\n        with self._session_lock:\n            self._close_rpc_locked()\n\n    def diagnostics(\n'''
          if text.count(init_old) != 1:
              raise SystemExit('java_lsp init insertion target drifted')
          text = text.replace(init_old, init_new, 1)

          start = text.index('    def diagnostics(\n')
          end = text.index('\n    def workspace_symbols(\n', start)
          diagnostics = '''    def diagnostics(\n        self,\n        project_root: str | Path,\n        *,\n        relative_files: Iterable[str] | None = None,\n        timeout_seconds: int = 60,\n    ) -> dict[str, Any]:\n        root = Path(project_root).expanduser().resolve()\n        if not root.is_dir():\n            raise FileNotFoundError(root)\n        if timeout_seconds <= 0:\n            raise ValueError("timeout_seconds must be positive.")\n        files = _java_files(root, relative_files)\n        pages = _diagnostic_pages(\n            files,\n            max_files=self.diagnostic_page_max_files,\n            max_source_bytes=self.diagnostic_page_max_source_bytes,\n        )\n        if not pages:\n            return _diagnostic_result(\n                root=root,\n                files_opened=0,\n                total_source_bytes=0,\n                page_receipts=[],\n                diagnostics={},\n                stderr_tail=[],\n                max_files=self.diagnostic_page_max_files,\n                max_source_bytes=self.diagnostic_page_max_source_bytes,\n                timeout_seconds=timeout_seconds,\n            )\n\n        with self._session_lock:\n            rpc = self._ensure_rpc_locked(root, timeout_seconds=timeout_seconds)\n            diagnostics: dict[str, list[dict[str, Any]]] = {}\n            page_receipts: list[dict[str, Any]] = []\n            total_source_bytes = 0\n            for page_index, page in enumerate(pages):\n                sources, source_bytes = _read_source_page(\n                    page,\n                    max_source_bytes=self.diagnostic_page_max_source_bytes,\n                )\n                expected_uris = {path.as_uri() for path, _text in sources}\n                for source_path, source_text in sources:\n                    rpc.notify(\n                        "textDocument/didOpen",\n                        {\n                            "textDocument": {\n                                "uri": source_path.as_uri(),\n                                "languageId": "java",\n                                "version": 1,\n                                "text": source_text,\n                            }\n                        },\n                    )\n                try:\n                    page_diagnostics = _collect_diagnostics(\n                        rpc,\n                        expected_uris=expected_uris,\n                        timeout_seconds=timeout_seconds,\n                        quiet_seconds=self.diagnostic_quiet_seconds,\n                    )\n                finally:\n                    for source_path, _source_text in sources:\n                        rpc.notify(\n                            "textDocument/didClose",\n                            {"textDocument": {"uri": source_path.as_uri()}},\n                        )\n                diagnostics.update(page_diagnostics)\n                page_errors, page_warnings = _diagnostic_counts(page_diagnostics)\n                relative_paths = [\n                    source_path.relative_to(root).as_posix()\n                    for source_path, _source_text in sources\n                ]\n                page_receipts.append(\n                    {\n                        "page_index": page_index,\n                        "file_count": len(sources),\n                        "source_bytes": source_bytes,\n                        "first_file": relative_paths[0],\n                        "last_file": relative_paths[-1],\n                        "diagnostic_uri_count": len(page_diagnostics),\n                        "error_count": page_errors,\n                        "warning_count": page_warnings,\n                    }\n                )\n                total_source_bytes += source_bytes\n            return _diagnostic_result(\n                root=root,\n                files_opened=len(files),\n                total_source_bytes=total_source_bytes,\n                page_receipts=page_receipts,\n                diagnostics=diagnostics,\n                stderr_tail=list(rpc.stderr),\n                max_files=self.diagnostic_page_max_files,\n                max_source_bytes=self.diagnostic_page_max_source_bytes,\n                timeout_seconds=timeout_seconds,\n            )\n'''
          text = text[:start] + diagnostics + text[end:]

          start = text.index('    def workspace_symbols(\n')
          end = text.index('\n\ndef _java_files(', start)
          symbols = '''    def workspace_symbols(\n        self,\n        project_root: str | Path,\n        query: str,\n        *,\n        timeout_seconds: int = 60,\n    ) -> dict[str, Any]:\n        root = Path(project_root).expanduser().resolve()\n        if not root.is_dir():\n            raise FileNotFoundError(root)\n        if timeout_seconds <= 0:\n            raise ValueError("timeout_seconds must be positive.")\n        with self._session_lock:\n            rpc = self._ensure_rpc_locked(root, timeout_seconds=timeout_seconds)\n            result = rpc.request(\n                "workspace/symbol",\n                {"query": query},\n                timeout=timeout_seconds,\n            )\n            return {\n                "schema_version": "mmm/java-symbols-v1",\n                "query": query,\n                "symbols": result or [],\n            }\n'''
          text = text[:start] + symbols + text[end:]
          path.write_text(text, encoding='utf-8')

          prod_path = Path('minecraft_mod_ai/production_tools.py')
          prod = prod_path.read_text(encoding='utf-8')
          marker = '''    @cached_property\n    def mineflayer(self):\n        """Start Mineflayer bridge ownership only when a bot tool is requested."""\n        from .mineflayer_bridge import MineflayerBridge\n        return MineflayerBridge()\n\n'''
          replacement = marker + '''    @cached_property\n    def java(self) -> JavaLanguageService:\n        """Keep one initialized JDT LS owner per persistent production service."""\n        return JavaLanguageService()\n\n'''
          if prod.count(marker) != 1:
              raise SystemExit('production_tools java cached-property insertion target drifted')
          prod = prod.replace(marker, replacement, 1)
          old_methods = '''    def java_diagnostics(self, project_root: str, relative_files: list[str] | None=None, timeout_seconds: int=60) -> dict[str, Any]:\n        root = self._existing_dir(project_root)\n        return JavaLanguageService().diagnostics(root, relative_files=relative_files, timeout_seconds=timeout_seconds)\n\n    def java_workspace_symbols(self, project_root: str, query: str, timeout_seconds: int=60) -> dict[str, Any]:\n        return JavaLanguageService().workspace_symbols(self._existing_dir(project_root), query, timeout_seconds=timeout_seconds)\n'''
          new_methods = '''    def java_diagnostics(self, project_root: str, relative_files: list[str] | None=None, timeout_seconds: int=60) -> dict[str, Any]:\n        root = self._existing_dir(project_root)\n        return self.java.diagnostics(root, relative_files=relative_files, timeout_seconds=timeout_seconds)\n\n    def java_workspace_symbols(self, project_root: str, query: str, timeout_seconds: int=60) -> dict[str, Any]:\n        return self.java.workspace_symbols(self._existing_dir(project_root), query, timeout_seconds=timeout_seconds)\n'''
          if prod.count(old_methods) != 1:
              raise SystemExit('production_tools java method target drifted')
          prod_path.write_text(prod.replace(old_methods, new_methods, 1), encoding='utf-8')

          test_path = Path('tests/test_java_lsp_scaling.py')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(
              '''        self.request_timeouts: list[float] = []\n        self.opened_uris: list[str] = []\n''',
              '''        self.request_timeouts: list[float] = []\n        self.request_methods: list[str] = []\n        self.opened_uris: list[str] = []\n''',
              1,
          )
          test = test.replace(
              '''        self.request_timeouts.append(timeout)\n        assert method == "initialize"\n        return {}\n''',
              '''        self.request_timeouts.append(timeout)\n        self.request_methods.append(method)\n        if method == "initialize":\n            return {}\n        if method == "workspace/symbol":\n            return {"query": params.get("query", "")}\n        raise AssertionError(f"unexpected fake JDT request: {method}")\n''',
              1,
          )
          test = test.replace(
              '''    assert rpc.request_timeouts == [3]\n    assert rpc.closed is True\n''',
              '''    assert rpc.request_timeouts == [3]\n    assert rpc.closed is False\n    service.close()\n    assert rpc.closed is True\n''',
              1,
          )
          append = '''\n\ndef test_workspace_symbol_calls_reuse_one_initialized_jdt_process(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    _FakeJsonRpcProcess.instances.clear()\n    monkeypatch.setattr(java_lsp, "_JsonRpcProcess", _FakeJsonRpcProcess)\n    service = JavaLanguageService("fake-jdtls")\n\n    first = service.workspace_symbols(tmp_path, "Alpha", timeout_seconds=3)\n    second = service.workspace_symbols(tmp_path, "Beta", timeout_seconds=3)\n\n    assert first["symbols"] == {"query": "Alpha"}\n    assert second["symbols"] == {"query": "Beta"}\n    assert len(_FakeJsonRpcProcess.instances) == 1\n    rpc = _FakeJsonRpcProcess.instances[0]\n    assert rpc.request_methods == ["initialize", "workspace/symbol", "workspace/symbol"]\n    assert rpc.closed is False\n    service.close()\n    assert rpc.closed is True\n\n\ndef test_switching_project_root_restarts_the_jdt_session(\n    tmp_path: Path,\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    first_root = tmp_path / "first"\n    second_root = tmp_path / "second"\n    first_root.mkdir()\n    second_root.mkdir()\n    _FakeJsonRpcProcess.instances.clear()\n    monkeypatch.setattr(java_lsp, "_JsonRpcProcess", _FakeJsonRpcProcess)\n    service = JavaLanguageService("fake-jdtls")\n\n    service.workspace_symbols(first_root, "One", timeout_seconds=3)\n    first_rpc = _FakeJsonRpcProcess.instances[0]\n    service.workspace_symbols(second_root, "Two", timeout_seconds=3)\n\n    assert len(_FakeJsonRpcProcess.instances) == 2\n    assert first_rpc.closed is True\n    assert _FakeJsonRpcProcess.instances[1].closed is False\n    service.close()\n'''
          test_path.write_text(test + append, encoding='utf-8')
          PY
          python -m pytest -q tests/test_java_lsp_scaling.py tests/test_agent_runtime_hot_paths.py
          python -m compileall -q minecraft_mod_ai
      - name: Commit JDT bottleneck fix directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft_mod_ai/java_lsp.py minecraft_mod_ai/production_tools.py tests/test_java_lsp_scaling.py
          git rm .github/workflows/jdt-session-bottleneck-fix.yml
          git commit -m "perf: reuse initialized JDT language-server sessions"
          git push origin HEAD:main
