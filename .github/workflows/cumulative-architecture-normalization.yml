name: Cumulative architecture normalization

on:
  push:
    paths:
      - ".github/workflows/cumulative-architecture-normalization.yml"

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.head_commit.message == 'install cumulative architecture normalization'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Harden one-shot patcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/apply_cumulative_architecture_normalization.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _replace_region(text: str, start: str, end: str, replacement: str) -> str:\n    start_index = text.index(start)\n    end_index = text.index(end, start_index)\n    return text[:start_index] + replacement.rstrip() + "\\n\\n" + text[end_index:]\n'''
          new = '''def _replace_region(text: str, start: str, end: str, replacement: str) -> str:\n    start_index = text.index(start)\n    try:\n        end_index = text.index(end, start_index)\n    except ValueError:\n        marker_lines = [line for line in end.splitlines() if line.strip()]\n        signature = marker_lines[-1]\n        end_index = text.index(signature, start_index)\n        if len(marker_lines) > 1:\n            decorator = marker_lines[0]\n            decorator_index = text.rfind(decorator, start_index, end_index)\n            if decorator_index >= start_index and end_index - decorator_index < 128:\n                end_index = decorator_index\n    return text[:start_index] + replacement.rstrip() + "\\n\\n" + text[end_index:]\n'''
          if old not in text:
              raise SystemExit('expected _replace_region helper not found')
          text = text.replace(old, new, 1)
          fallback_marker = "replacement = '''def _last_gradle_log("
          runner_marker = "run_replacement = '''    def _run("
          if fallback_marker not in text or runner_marker not in text:
              raise SystemExit('expected replacement markers not found')
          text = text.replace(fallback_marker, "replacement = r'''def _last_gradle_log(", 1)
          text = text.replace(runner_marker, "run_replacement = r'''    def _run(", 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply architecture normalization
        run: python tools/apply_cumulative_architecture_normalization.py

      - name: Compile normalized Python tree
        run: python -m compileall -q minecraft_mod_ai

      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e ".[dev,ui]"

      - name: Run focused verifier and planner regressions
        run: >-
          python -m pytest -q
          tests/test_planner_normalization_regression.py
          tests/test_planning_state_pipeline_orchestration.py
          tests/test_planning_progress_monotone.py
          tests/test_generation_verifier_resilience.py
          tests/test_runner*.py

      - name: Remove one-shot normalization scaffolding
        run: |
          rm -f tools/apply_cumulative_architecture_normalization.py
          rm -f .github/workflows/cumulative-architecture-normalization.yml

      - name: Run cumulative architecture gate against last good baseline
        run: >-
          python .github/scripts/audit_code_quality_regression.py
          --base-ref ac47fe22dd672e1041d4ecc0f11b7564cf6f3933
          --output audit/cumulative-architecture-normalization.json

      - name: Commit normalized architecture and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            minecraft_mod_ai/planning_state_pipeline.py \
            minecraft_mod_ai/generation_verifier_fallback_installation.py \
            minecraft_mod_ai/runner.py \
            tools/apply_cumulative_architecture_normalization.py \
            .github/workflows/cumulative-architecture-normalization.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "normalize cumulative architecture regressions"
          git push origin HEAD:main
