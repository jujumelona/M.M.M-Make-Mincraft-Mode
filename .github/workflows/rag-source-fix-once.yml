name: One-shot RAG source integration

on:
  push:
    paths:
      - .github/workflows/rag-source-fix-once.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply RAG integration
        run: python tools/apply_rag_source_fix.py
      - name: Compile changed RAG modules
        run: |
          python -m py_compile \
            minecraft_mod_ai/pre_design_external_source_contract.py \
            minecraft_mod_ai/pre_design_rag_corrective.py \
            minecraft_mod_ai/runtime_bootstrap.py
      - name: Run focused RAG regressions
        run: |
          pytest -q \
            tests/test_pre_design_external_source_acquisition.py \
            tests/test_pre_design_research_pipeline.py \
            tests/test_predesign_runtime_composition.py
      - name: Commit and push integration
        run: |
          git config user.name 'jujumelona'
          git config user.email 'qasdaa025@gmail.com'
          git add minecraft_mod_ai/pre_design_rag_corrective.py minecraft_mod_ai/runtime_bootstrap.py
          if git diff --cached --quiet; then
            echo 'No RAG integration changes to commit'
            exit 0
          fi
          git commit -m 'fix: connect pre-design RAG to source bodies'
          git push origin HEAD:main
