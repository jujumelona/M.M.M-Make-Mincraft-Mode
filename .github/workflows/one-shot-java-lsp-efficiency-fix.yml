name: One-shot Java LSP efficiency fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-java-lsp-efficiency-fix.yml'

permissions:
  contents: write

concurrency:
  group: one-shot-java-lsp-efficiency-fix-main
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Hoist Java version probing out of selection loop
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('minecraft_mod_ai/java_lsp.py')
          text = path.read_text(encoding='utf-8')
          old = '''    observed: list[str] = []\n    for home, major in zip(homes, _java_major_versions(homes), strict=True):\n'''
          new = '''    majors = _java_major_versions(homes)\n    observed: list[str] = []\n    for home, major in zip(homes, majors, strict=True):\n'''
          if old not in text:
              raise SystemExit('expected java_lsp selection loop was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify focused contracts and cumulative efficiency
        run: |
          python -m pip install --prefer-binary -e '.[dev]'
          python -m compileall -q minecraft_mod_ai/java_lsp.py
          python -m pytest -q tests/test_java_toolchain_separation_installation.py
          python .github/scripts/audit_runtime_efficiency.py --output /tmp/current-efficiency.json
          BASE_SHA=9c1a538b3c0d9062356e6192bf991e7ce2cc8f53
          BASE_DIR="$(mktemp -d)"
          git archive --format=tar "$BASE_SHA" -- .github/scripts/audit_runtime_efficiency.py minecraft_mod_ai tools download_resources.py | tar -xf - -C "$BASE_DIR"
          (cd "$BASE_DIR" && python .github/scripts/audit_runtime_efficiency.py --output /tmp/base-efficiency.json)
          python .github/scripts/gate_runtime_efficiency.py --baseline /tmp/base-efficiency.json --current /tmp/current-efficiency.json
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/java_lsp.py
          git commit -m 'Hoist Java version probing out of selection loop'
          git push origin HEAD:main
