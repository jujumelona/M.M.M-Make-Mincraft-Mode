name: Worker 07 Canonical Target Finalize

on:
  push:
    branches:
      - main
    paths:
      - .github/worker07-finalize.trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Capture pre-Worker07 mutation surface
        run: python .github/scripts/audit_runtime_mutations.py --output /tmp/worker07-runtime-before.json
      - name: Apply canonical Worker 07 patch
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_BLOB: 2bea6711af3bec525b5eb27f7195fb5ad489bd9b
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${PATCH_BLOB}" --jq .content | tr -d '\n' | base64 -d > /tmp/worker07_finalize.py
          python /tmp/worker07_finalize.py
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_unified_host_execution_loop.py')
          text = path.read_text(encoding='utf-8')
          context_anchor = '    config.max_context = 16384\n'
          context_replacement = context_anchor + '    config.max_input_tokens = 0\n'
          if 'config.max_input_tokens = 0' not in text:
              if context_anchor not in text:
                  raise SystemExit('Worker07: unified-loop config anchor missing')
              text = text.replace(context_anchor, context_replacement)
              path.write_text(text, encoding='utf-8')

          contract = Path('minecraft_mod_ai/deterministic_minecraft_content_contract.py')
          source = contract.read_text(encoding='utf-8')
          stale = '''    policy_role = capability_module._policy_model_role(stage, model_role)\n    assigned = capability_module.skills_for_model_role(policy_role)\n'''
          canonical = '''    policy = capability_module._role_policy_snapshot(stage, model_role)\n    assigned = policy.skills\n'''
          if stale in source:
              source = source.replace(stale, canonical, 1)
              contract.write_text(source, encoding='utf-8')
          elif canonical not in source:
              raise SystemExit('Worker07: dynamic-skill policy anchor drifted')

          test = Path('tests/test_deterministic_minecraft_content_contract.py')
          source = test.read_text(encoding='utf-8')
          old = '''    class _Capability:\n        @staticmethod\n        def _policy_model_role(stage, model_role):\n            return model_role\n\n        @staticmethod\n        def skills_for_model_role(model_role):\n            assert model_role == "coder"\n            return frozenset({"generate-datagen", "patch-existing-project"})\n'''
          new = '''    class _Capability:\n        @staticmethod\n        def _role_policy_snapshot(stage, model_role):\n            assert stage == "generation"\n            assert model_role == "coder"\n            return SimpleNamespace(\n                skills=frozenset({"generate-datagen", "patch-existing-project"})\n            )\n'''
          if old in source:
              source = source.replace(old, new, 1)
              test.write_text(source, encoding='utf-8')
          elif '_role_policy_snapshot(stage, model_role)' not in source:
              raise SystemExit('Worker07: deterministic skill-policy test anchor drifted')
          PY
      - name: Worker 07 focused verification
        run: |
          python -m py_compile \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            minecraft_mod_ai/implementation_kind_boundary_contract.py \
            minecraft_mod_ai/deterministic_minecraft_content_contract.py \
            tests/test_worker07_target_context_hardening.py \
            tests/test_unified_host_execution_loop.py \
            tests/test_deterministic_minecraft_content_contract.py
          python -m ruff check \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            minecraft_mod_ai/implementation_kind_boundary_contract.py \
            minecraft_mod_ai/deterministic_minecraft_content_contract.py \
            tests/test_worker07_target_context_hardening.py \
            tests/test_unified_host_execution_loop.py \
            tests/test_deterministic_minecraft_content_contract.py \
            --select F,E7,E9
          python -m pytest -q \
            tests/test_worker07_target_context_hardening.py \
            tests/test_unified_host_execution_loop.py \
            tests/test_implementation_kind_boundary_contract.py \
            tests/test_deterministic_minecraft_content_contract.py \
            tests/test_agent_capability_context.py \
            tests/test_runtime_bootstrap_clean.py \
            tests/test_runtime_wrapper_signature_integrity.py
          python .github/scripts/debug_repo_audit.py
          vulture minecraft_mod_ai tools download_resources.py --min-confidence 100
          python .github/scripts/audit_runtime_mutations.py --output /tmp/worker07-runtime-after.json
          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path('/tmp/worker07-runtime-before.json').read_text(encoding='utf-8'))
          after = json.loads(Path('/tmp/worker07-runtime-after.json').read_text(encoding='utf-8'))
          before_count = int(before['behavioral_count'])
          after_count = int(after['behavioral_count'])
          delta = after_count - before_count
          print(f'WORKER07_RUNTIME_MUTATIONS_BEFORE={before_count}')
          print(f'WORKER07_RUNTIME_MUTATIONS_AFTER={after_count}')
          print(f'WORKER07_RUNTIME_MUTATIONS_DELTA={delta}')
          if delta > -2:
              raise SystemExit(
                  'Worker07 canonicalization must remove at least two behavioral late-runtime rebindings; '
                  f'observed delta={delta}'
              )
          path = 'minecraft_mod_ai/implementation_kind_boundary_contract.py'
          before_path = int(before.get('behavioral_by_path', {}).get(path, 0))
          after_path = int(after.get('behavioral_by_path', {}).get(path, 0))
          print(f'WORKER07_BOUNDARY_MUTATIONS={before_path}->{after_path}')
          if after_path > max(0, before_path - 2):
              raise SystemExit(
                  'Worker07 late target-hardening rebindings were not removed from the boundary contract'
              )
          PY
      - name: Commit canonical Worker 07 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: make coder target hardening canonical"
          git fetch origin main
          git rebase origin/main
          python -m py_compile \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            minecraft_mod_ai/implementation_kind_boundary_contract.py \
            minecraft_mod_ai/deterministic_minecraft_content_contract.py
          python -m pytest -q \
            tests/test_worker07_target_context_hardening.py \
            tests/test_unified_host_execution_loop.py \
            tests/test_implementation_kind_boundary_contract.py \
            tests/test_deterministic_minecraft_content_contract.py
          git push origin HEAD:main
