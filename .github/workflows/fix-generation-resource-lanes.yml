name: Fix deterministic generation resource lanes v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-generation-resource-lanes.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore CPU generation lanes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('minecraft_mod_ai/work_graph.py')
          s = p.read_text(encoding='utf-8')
          old = '''    elif kind == "module-shard" and gen_stage in {\n        "content",\n        "system",\n        "entity",\n        "audio-binding",\n    }:\n        res_class = "commit"\n    elif kind == "module-shard" and gen_stage == "custom":\n'''
          new = '''    elif kind == "module-shard" and gen_stage == "audio-binding":\n        # Audio binding can enter model-backed fallback and still owns shared final\n        # binding state, so keep it on the serialized commit lane.\n        res_class = "commit"\n    elif kind == "module-shard" and gen_stage in {"content", "system", "entity"}:\n        # Deterministic generation is safe to overlap. Shared Java/Gradle metadata\n        # edits are serialized narrowly inside project_edit/source_patch locks.\n        res_class = "cpu_io"\n    elif kind == "module-shard" and gen_stage == "custom":\n'''
          if old not in s:
              raise SystemExit('resource-class target not found')
          s = s.replace(old, new, 1)
          compile(s, str(p), 'exec')
          p.write_text(s, encoding='utf-8')
          PY
          python -m pip install -q -e '.[dev]'
          python -m ruff check minecraft_mod_ai/work_graph.py --select F,E7,E9
          python -m pytest -q tests/test_project_write_concurrency_contract.py
      - name: Commit validated lane fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-generation-resource-lanes.yml
          git add minecraft_mod_ai/work_graph.py .github/workflows/fix-generation-resource-lanes.yml
          git diff --cached --check
          git commit -m "Restore parallel deterministic generation lanes"
          git pull --rebase origin main
          git push origin HEAD:main
