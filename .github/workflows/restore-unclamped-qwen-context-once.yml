name: Restore unclamped Qwen context once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-unclamped-qwen-context-once.yml

permissions:
  contents: write

concurrency:
  group: restore-unclamped-qwen-context-once
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Sync current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
      - name: Restore verified unclamped context contract
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth 1 origin 6ca4785797268cb9eafd3a7229d90c5ff4d55b2d
          git show 6ca4785797268cb9eafd3a7229d90c5ff4d55b2d:minecraft_mod_ai/qwen35_mtp_hotpath_contract.py > minecraft_mod_ai/qwen35_mtp_hotpath_contract.py
          python - <<'PY'
          from pathlib import Path
          p = Path('minecraft_mod_ai/qwen35_mtp_hotpath_contract.py')
          s = p.read_text(encoding='utf-8')
          old = '    """Use the model profile context unless explicitly overridden."""\n'
          new = '''    """Use the model profile context without an artificial MMM clamp.\n\n    A positive MMM_QWEN35_MTP_CTX is forwarded exactly. Otherwise the model\n    profile max_context is authoritative; 32768 is only a compatibility fallback.\n    """\n'''
          if old not in s:
              raise SystemExit('expected context contract docstring missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify context contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --prefer-binary -e '.[dev]'
          python -m py_compile minecraft_mod_ai/qwen35_mtp_hotpath_contract.py tests/test_qwen35_mtp_hotpath_contract.py
          python -m ruff check minecraft_mod_ai/qwen35_mtp_hotpath_contract.py tests/test_qwen35_mtp_hotpath_contract.py --select F,E7,E9
          python -m pytest -q tests/test_qwen35_mtp_hotpath_contract.py tests/test_runtime_bootstrap_clean.py
      - name: Commit tested restoration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/restore-unclamped-qwen-context-once.yml
          git config user.name 'juju-mmm-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Remove artificial Qwen server context clamp'
          git pull --rebase origin main
          git push origin HEAD:main
