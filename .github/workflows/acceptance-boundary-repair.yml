name: One-shot acceptance boundary repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/acceptance-boundary-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Restore task-local checks and enforce public boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          evidence_path = Path('minecraft_mod_ai/evidence_first_planning.py')
          text = evidence_path.read_text(encoding='utf-8')
          old = '''            # Structural integrity is enforced by done_predicate below.\n            # task.acceptance carries only public requirement acceptance on the\n            # terminal semantic step, so downstream aggregation cannot expose\n            # task IDs, owned-anchor checks, or gate mechanics to the user.\n            acceptance = [\n                str(item)\n                for item in gap.get("acceptance", ())\n                if index == len(steps) - 1 and _is_public_acceptance(item)\n            ]\n'''
          new = '''            # Task-local acceptance is part of the executable DAG contract and\n            # must exist on every semantic step.  Public/release acceptance is\n            # projected separately from requirement acceptance below.\n            acceptance = [\n                f"{task_id}: all declared provides exist and all owned anchors pass their integrity checks"\n            ]\n            if index == len(steps) - 1:\n                acceptance.extend(\n                    str(item)\n                    for item in gap.get("acceptance", ())\n                    if _is_public_acceptance(item)\n                )\n'''
          if old not in text:
              raise SystemExit('task acceptance block not found')
          text = text.replace(old, new, 1)
          evidence_path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_planner_requirement_acceptance_contract.py')
          test = test_path.read_text(encoding='utf-8')
          test = test.replace(
              '    build_request_catalog,\n)',
              '    build_request_catalog,\n    compile_evidence_first_plan,\n)',
              1,
          )
          start = test.index('def test_task_acceptance_excludes_internal_integrity_checks() -> None:\n')
          replacement = '''def test_task_acceptance_keeps_internal_checks_for_dag_validation() -> None:\n    public_acceptance = "Verify the observable player-facing behavior for capability economy.trade."\n    gaps = [\n        {\n            "gap_id": "gap_trade",\n            "requirement_ref": "req_trade",\n            "capability": "economy.trade",\n            "missing_provides": ["capability:economy.trade"],\n            "acceptance": [public_acceptance],\n        }\n    ]\n    reuse = [\n        {\n            "requirement_ref": "req_trade",\n            "component_refs": [],\n            "source_refs": [],\n        }\n    ]\n    target = {"coordinates": {"minecraft_version": "1.21.1", "loader": "neoforge"}}\n    branches = {name: {"status": "NOT_APPLICABLE"} for name in _BRANCHES}\n    ownership = {\n        "module_id": ":",\n        "source_set": "main",\n        "source_root": "src/main/java",\n        "resource_root": "src/main/resources",\n        "test_root": "src/test/java",\n        "namespace": "generated.test",\n        "mod_id": "test",\n        "extension": "java",\n        "topology_module_ids": [],\n        "topology_source_sets": [],\n    }\n    tasks = _compile_tasks(gaps, reuse, target, branches, ownership)\n    assert tasks\n    assert all(task["acceptance"] for task in tasks)\n    assert all(\n        any("declared provides" in item.casefold() for item in task["acceptance"])\n        for task in tasks\n    )\n    assert public_acceptance in tasks[-1]["acceptance"]\n\n\ndef test_release_acceptance_contains_only_requirement_public_checks() -> None:\n    prompt = "Add a machine that processes ore into refined material."\n    design = {\n        "modules": [{"capability": "machine"}],\n        "target": {\n            "minecraft_version": "1.21.1",\n            "loader": "neoforge",\n        },\n    }\n    plan = compile_evidence_first_plan(prompt, design)\n    release = [\n        item\n        for binding in plan["acceptance_release_bindings"]\n        for item in binding["acceptance"]\n    ]\n    assert release\n    assert all(prompt not in item for item in release)\n    assert all(not item.startswith("task_") for item in release)\n    assert all("owned anchors" not in item.casefold() for item in release)\n    assert all("declared provides" not in item.casefold() for item in release)\n'''
          test = test[:start] + replacement
          test_path.write_text(test, encoding='utf-8')
          PY
      - name: Locate every acceptance aggregation surface
        run: |
          echo '=== acceptance_tests occurrences ==='
          grep -R -n --exclude-dir=.git 'acceptance_tests' minecraft_mod_ai tests || true
          echo '=== task acceptance consumers ==='
          grep -R -n --exclude-dir=.git -E 'acceptance_release_bindings|task.*acceptance|acceptance.*task' minecraft_mod_ai tests | head -300 || true
      - name: Install tests
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Run evidence and planner contract tests
        run: |
          python -m pytest -q \
            tests/test_evidence_first_planning.py \
            tests/test_evidence_first_session_integration.py \
            tests/test_planner_requirement_acceptance_contract.py \
            tests/test_joint_reuse_planner_contract.py
      - name: Commit repair directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft_mod_ai/evidence_first_planning.py tests/test_planner_requirement_acceptance_contract.py
          git rm .github/workflows/acceptance-boundary-repair.yml
          git commit -m "fix: separate task validation from release acceptance"
          git push origin HEAD:main
