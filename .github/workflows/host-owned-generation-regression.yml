name: Host-owned generation regression

on:
  push:
    branches: [main]
    paths:
      - "minecraft_mod_ai/incremental_java_*.py"
      - "minecraft_mod_ai/host_source_strategy.py"
      - "minecraft_mod_ai/feature_source_work_graph.py"
      - "minecraft_mod_ai/first_pass_java_source.py"
      - "minecraft_mod_ai/construction_java_context.py"
      - "minecraft_mod_ai/construction_file_author.py"
      - "minecraft_mod_ai/construction_host_source.py"
      - "tests/test_incremental_java_host_registration.py"
      - "tests/test_incremental_java_event_query_isolation.py"
      - ".github/workflows/host-owned-generation-regression.yml"
  workflow_dispatch:

jobs:
  host-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install project and tests
        run: python -m pip install -e '.[dev]'
      - name: Verify generation modules compile
        run: python -m compileall -q minecraft_mod_ai
      - name: Run small-AI source-generation regressions
        run: >-
          python -m pytest -q
          tests/test_incremental_java_host_registration.py
          tests/test_incremental_java_event_query_isolation.py
          tests/test_incremental_java_work_ownership.py
          tests/test_incremental_java_author.py
          tests/test_incremental_java_pipeline.py
          tests/test_feature_source_owned_dispatch.py
          tests/test_direct_feature_source.py
          tests/test_feature_source_work_graph.py
          tests/test_source_owned_custom_event.py
          tests/test_source_owned_hook.py
