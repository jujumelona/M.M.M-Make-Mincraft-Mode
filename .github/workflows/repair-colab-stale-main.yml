name: Repair Colab stale-main bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-colab-stale-main.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Repair and validate canonical Colab notebook
        run: |
          python .github/scripts/repair_colab_stale_main.py
          python -m json.tool M.M.M_Make_Mincraft_Mode_Colab.ipynb >/dev/null
          python -m compileall -q minecraft_mod_ai tools
          python -c "from pathlib import Path; s=Path('minecraft_mod_ai/runtime_bootstrap.py').read_text(); assert 'agent_tool_calling_contract' not in s; assert 'platform_mcp_compatibility_contract' not in s; assert 'platform_policy_runtime_contract' not in s"
      - name: Commit repaired notebook and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/repair-colab-stale-main.yml
          rm .github/scripts/repair_colab_stale_main.py
          git add M.M.M_Make_Mincraft_Mode_Colab.ipynb .github/workflows/repair-colab-stale-main.yml .github/scripts/repair_colab_stale_main.py
          git diff --cached --check
          git commit -m "Make Colab bootstrap self-heal stale main checkout"
          git pull --rebase origin main
          git push origin HEAD:main
