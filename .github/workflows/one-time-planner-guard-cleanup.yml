name: One-time planner guard cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-planner-guard-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Simplify outline cycle ownership
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/planner_incremental_resume_contract.py')
          text = path.read_text(encoding='utf-8')
          edits = [
              ('_DEFAULT_OUTLINE_GENERATION_ATTEMPTS = 2\n', ''),
              (
                  '''            self._seen_requests: set[str] = set()\n            self._outline_calls = 0\n            self._outline_limit = _bounded_env(\n                "MMM_PLANNER_OUTLINE_GENERATION_ATTEMPTS",\n                _DEFAULT_OUTLINE_GENERATION_ATTEMPTS,\n                maximum=4,\n            )\n''',
                  '''            self._outline_calls = 0\n''',
              ),
              (
                  '''            if not is_batch_repair:\n                self._outline_calls += 1\n                if self._outline_calls > self._outline_limit:\n                    raise complete_planner.SpecValidationError(\n                        "Production outline generation made no valid progress after the "\n                        "diagnostic regeneration path."\n                    )\n\n            request_sha256 = incremental_module._fingerprint(\n                {\n                    "role": role,\n                    "system": system_content,\n                    "user": user_content,\n                    "response_format": response_format,\n                    "media_paths": [str(path) for path in media_paths],\n                }\n            )\n            if request_sha256 in self._seen_requests:\n                raise complete_planner.SpecValidationError(\n                    "Planner repair cycle detected before repeating an identical model request."\n                )\n            self._seen_requests.add(request_sha256)\n\n''',
                  '''            if not is_batch_repair:\n                self._outline_calls += 1\n                if self._outline_calls > 2:\n                    raise complete_planner.SpecValidationError(\n                        "Planner repair cycle detected before a third semantic outline request."\n                    )\n\n''',
              ),
          ]
          for old, new in edits:
              if text.count(old) != 1:
                  raise SystemExit(f'planner guard shape changed: {old[:80]!r}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tests/test_planner_incremental_repair_contract.py')
          test_text = test_path.read_text(encoding='utf-8')
          old = '''    # Raise the broad generation ceiling so this test specifically exercises the exact\n    # request-cycle detector rather than the independent no-progress budget.\n    monkeypatch.setenv("MMM_PLANNER_OUTLINE_GENERATION_ATTEMPTS", "4")\n'''
          new = '''    # The host allows one diagnostic regeneration for the same semantic outline.\n'''
          if test_text.count(old) != 1:
              raise SystemExit('planner cycle test shape changed')
          test_path.write_text(test_text.replace(old, new), encoding='utf-8')
          PY
      - name: Verify planner repair semantics
        run: |
          python -m pip install --prefer-binary -e '.[dev]'
          python -m ruff check minecraft_mod_ai/planner_incremental_resume_contract.py tests/test_planner_incremental_repair_contract.py --select F,E7,E9
          python -m pytest -q \
            tests/test_planner_incremental_repair_contract.py \
            tests/test_complete_planner_scaling.py::test_initial_outline_repairs_without_replanning_design_or_research
          git diff --check
      - name: Commit and remove maintenance workflow
        run: |
          git rm .github/workflows/one-time-planner-guard-cleanup.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Give planner cycle guards single ownership'
          git push origin HEAD:main
