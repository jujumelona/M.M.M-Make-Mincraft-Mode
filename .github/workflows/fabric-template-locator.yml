name: Fabric template fix migration

on:
  push:
    branches: [main]
    paths-ignore:
      - "audit/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabric-template-fix-main
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply generated Java compile fixes
        run: python tools/apply_fabric_generator_compile_fixes.py
      - name: Verify patched source templates compile as Python
        run: python -m compileall -q minecraft_mod_ai tests
      - name: Commit generator template fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add \
            minecraft_mod_ai/geckolib_generator.py \
            minecraft_mod_ai/extended_content_generator.py \
            minecraft_mod_ai/system_templates_quest.py
          if ! git diff --cached --quiet; then
            git commit -m "Fix generated Fabric Java compile contracts [skip ci]"
            git push origin HEAD:main
          fi
