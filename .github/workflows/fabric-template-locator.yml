name: Fabric template locator

on:
  push:
    branches: [main]
    paths-ignore:
      - "audit/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fabric-template-locator-main
  cancel-in-progress: true

jobs:
  locate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Locate generated Java template sources
        run: python tools/locate_fabric_compile_templates.py
      - name: Commit locator evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add audit/FABRIC_TEMPLATE_LOCATIONS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Fabric template locations [skip ci]"
            git push origin HEAD:main
          fi
