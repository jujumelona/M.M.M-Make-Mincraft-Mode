name: Worker 04 Apply Quality V2

on:
  push:
    branches:
      - main
    paths:
      - .github/worker04-quality-v2.apply

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply narrow Worker 04 quality patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {actual}: {old[:100]!r}')
              file.write_text(text.replace(old, new, count), encoding='utf-8')

          replace(
              'minecraft_mod_ai/model_router.py',
              '''                from .agent_capability_context import (\n                    build_agent_capability_context,\n                    filter_tool_schemas_for_role,\n                )\n\n                tools = filter_tool_schemas_for_role(stage, role, raw_tools)\n                if tools:\n                    request_messages = _inject_system_context(\n                        request_messages,\n                        build_agent_capability_context(\n                            stage,\n                            tools,\n                            model_role=role,\n                        ),\n                    )''',
              '''                from .agent_capability_context import prepare_agent_tool_surface\n\n                tools, capability_context = prepare_agent_tool_surface(\n                    stage, role, raw_tools\n                )\n                if tools:\n                    request_messages = _inject_system_context(\n                        request_messages, capability_context\n                    )''',
          )
          replace(
              'minecraft_mod_ai/model_router.py',
              '\ndef _execute_tool_waves(\n',
              '''\ndef _parallel_read_call(call: Any) -> bool:\n    """Return whether a reviewed call is side-effect-free and safe in a read wave."""\n\n    if call.name in _PARALLEL_READ_TOOLS:\n        return True\n    if call.name != "external_mcp_call":\n        return False\n    access = str(call.arguments.get("max_access", "read")).strip().lower() or "read"\n    return access == "read"\n\n\ndef _execute_tool_waves(\n''',
          )
          replace(
              'minecraft_mod_ai/model_router.py',
              '        if call.name in _PARALLEL_READ_TOOLS:\n',
              '        if _parallel_read_call(call):\n',
          )

          replace(
              'minecraft_mod_ai/external_mcp_router.py',
              '        self._lock = threading.RLock()\n',
              '',
          )
          old_provider = '''    def _call_provider(\n        self,\n        server_name: str,\n        entry: Mapping[str, Any],\n        *,\n        tool: str,\n        arguments: Mapping[str, Any],\n    ) -> dict[str, Any]:\n        async def run() -> dict[str, Any]:\n            return await self._call_provider_async(\n                server_name, entry, tool=tool, arguments=arguments\n            )\n\n        with self._lock:\n            try:\n                asyncio.get_running_loop()\n            except RuntimeError:\n                return anyio.run(run)\n\n            # The public MMM APIs are synchronous, but an MCP host may call them\n            # from an already-running event loop.  Run the nested MCP session in a\n            # dedicated thread instead of illegally nesting asyncio.run().\n            value: dict[str, Any] = {}\n            error: list[BaseException] = []\n\n            def worker() -> None:\n                try:\n                    value["result"] = anyio.run(run)\n                except BaseException as exc:  # pragma: no cover - thread bridge\n                    error.append(exc)\n\n            thread = threading.Thread(target=worker, daemon=True)\n            thread.start()\n            thread.join(self.timeout_seconds + 5.0)\n            if thread.is_alive():\n                raise ExternalMCPError(\n                    f"External MCP {server_name} exceeded the synchronous bridge timeout."\n                )\n            if error:\n                raise ExternalMCPError(str(error[0])) from error[0]\n            return value["result"]\n'''
          new_provider = '''    def _call_provider(\n        self,\n        server_name: str,\n        entry: Mapping[str, Any],\n        *,\n        tool: str,\n        arguments: Mapping[str, Any],\n    ) -> dict[str, Any]:\n        async def run() -> dict[str, Any]:\n            return await self._call_provider_async(\n                server_name, entry, tool=tool, arguments=arguments\n            )\n\n        try:\n            asyncio.get_running_loop()\n        except RuntimeError:\n            return anyio.run(run)\n\n        # Each call owns an independent MCP transport/session, so serializing the\n        # complete provider I/O behind one router lock only adds head-of-line latency.\n        value: dict[str, Any] = {}\n        error: list[BaseException] = []\n\n        def worker() -> None:\n            try:\n                value["result"] = anyio.run(run)\n            except BaseException as exc:  # noqa: BLE001  # pragma: no cover - bridge\n                error.append(exc)\n\n        thread = threading.Thread(target=worker, daemon=True)\n        thread.start()\n        thread.join(self.timeout_seconds + 5.0)\n        if thread.is_alive():\n            raise ExternalMCPError(\n                f"External MCP {server_name} exceeded the synchronous bridge timeout."\n            )\n        if error:\n            raise ExternalMCPError(str(error[0])) from error[0]\n        return value["result"]\n'''
          replace('minecraft_mod_ai/external_mcp_router.py', old_provider, new_provider)
          replace(
              'minecraft_mod_ai/external_mcp_router.py',
              '            except Exception as exc:\n                attempts.append(\n',
              '            except Exception as exc:  # noqa: BLE001 - route failure must fall back\n                attempts.append(\n',
          )

          replace(
              'minecraft_mod_ai/external_agent_bridge.py',
              '''    def _external_router(self) -> Any:\n        if self._router is None:\n            from .external_mcp_router import ExternalMCPRouter\n\n            self._router = ExternalMCPRouter(\n                timeout_seconds=min(self.timeout_seconds, 120.0)\n            )\n        return self._router\n''',
              '''    def _external_router(self) -> Any:\n        router = self._router\n        if router is not None:\n            return router\n        with self._lock:\n            router = self._router\n            if router is None:\n                from .external_mcp_router import ExternalMCPRouter\n\n                router = ExternalMCPRouter(\n                    timeout_seconds=min(self.timeout_seconds, 120.0)\n                )\n                self._router = router\n            return router\n''',
          )
          replace(
              'minecraft_mod_ai/external_agent_bridge.py',
              '            except BaseException as exc:  # pragma: no cover - event-loop bridge\n',
              '            except BaseException as exc:  # noqa: BLE001  # pragma: no cover - bridge\n',
          )
          replace(
              'minecraft_mod_ai/external_agent_bridge.py',
              '            except Exception as exc:\n                attempts.append(\n',
              '            except Exception as exc:  # noqa: BLE001 - provider failure must fall back\n                attempts.append(\n',
          )
          replace(
              'minecraft_mod_ai/external_agent_bridge.py',
              '''            async with streamable_http_client(url) as (read_stream, write_stream, _):\n                async with ClientSession(read_stream, write_stream) as session:\n                    return await read(session)\n''',
              '''            async with (\n                streamable_http_client(url) as (read_stream, write_stream, _),\n                ClientSession(read_stream, write_stream) as session,\n            ):\n                return await read(session)\n''',
          )
          replace(
              'minecraft_mod_ai/external_agent_bridge.py',
              '    except Exception:\n        return str(value)\n',
              '    except (TypeError, ValueError, OverflowError, RecursionError):\n        return str(value)\n',
          )

          replace(
              'minecraft_mod_ai/agent_tool_runtime.py',
              'from pathlib import Path\n',
              'from pathlib import Path\nfrom types import TracebackType\n',
          )
          replace(
              'minecraft_mod_ai/agent_tool_runtime.py',
              '            except BaseException as exc:  # pragma: no cover - event-loop bridge\n',
              '            except BaseException as exc:  # noqa: BLE001  # pragma: no cover - bridge\n',
          )
          replace(
              'minecraft_mod_ai/agent_tool_runtime.py',
              '                tempfile.TemporaryFile(mode="w+", encoding="utf-8")\n',
              '                tempfile.TemporaryFile(mode="w+", encoding="utf-8")  # noqa: SIM115\n',
          )
          replace(
              'minecraft_mod_ai/agent_tool_runtime.py',
              '            except BaseException as cleanup_error:\n',
              '            except BaseException as cleanup_error:  # noqa: BLE001 - preserve original\n',
          )
          replace(
              'minecraft_mod_ai/agent_tool_runtime.py',
              '    async def __aexit__(self, exc_type: Any, exc: Any, tb: Any) -> bool | None:\n',
              '''    async def __aexit__(\n        self,\n        exc_type: type[BaseException] | None,\n        exc: BaseException | None,\n        tb: TracebackType | None,\n    ) -> bool | None:\n''',
          )

          replace(
              'minecraft_mod_ai/progress_aware_tool_loop.py',
              '''    if clean.startswith("http://") or clean.startswith("https://") or "://" in clean:\n        return False\n    suffix = Path(clean).suffix.casefold()\n    if "/" not in clean and suffix not in {".java", ".json", ".toml", ".gradle", ".properties", ".txt", ".md", ".kt", ".groovy"}:\n        return False\n    return True\n''',
              '''    if clean.startswith(("http://", "https://")) or "://" in clean:\n        return False\n    suffix = Path(clean).suffix.casefold()\n    return "/" in clean or suffix in {\n        ".java", ".json", ".toml", ".gradle", ".properties", ".txt", ".md", ".kt", ".groovy"\n    }\n''',
          )
          replace(
              'minecraft_mod_ai/progress_aware_tool_loop.py',
              '                        except BaseException as ultra_exc:\n',
              '                        except Exception as ultra_exc:  # noqa: BLE001 - classify backend boundary\n',
          )
          replace(
              'minecraft_mod_ai/progress_aware_tool_loop.py',
              '        def execute(call: Any) -> tuple[Any, Mapping[str, Any]]:\n',
              '''        def execute(\n            call: Any,\n            allowed_phase_tools: frozenset[str] = phase_tool_names,\n            localization_stage: LocalizationStage = current_localization_stage,\n        ) -> tuple[Any, Mapping[str, Any]]:\n''',
          )
          replace(
              'minecraft_mod_ai/progress_aware_tool_loop.py',
              '            if call.name not in phase_tool_names:\n',
              '            if call.name not in allowed_phase_tools:\n',
          )
          replace(
              'minecraft_mod_ai/progress_aware_tool_loop.py',
              '                    f"(allowed tools: {sorted(phase_tool_names)})."\n',
              '                    f"(allowed tools: {sorted(allowed_phase_tools)})."\n',
          )
          replace(
              'minecraft_mod_ai/progress_aware_tool_loop.py',
              '                    current_localization_stage\n                    if implementation_requires_mutation and state.phase == LoopPhase.OBSERVE\n',
              '                    localization_stage\n                    if implementation_requires_mutation and state.phase == LoopPhase.OBSERVE\n',
          )
          replace(
              'minecraft_mod_ai/progress_aware_tool_loop.py',
              '            except Exception as exc:\n                err_msg = f"{type(exc).__name__}: {exc}"\n',
              '            except Exception as exc:  # noqa: BLE001 - tool failures become observations\n                err_msg = f"{type(exc).__name__}: {exc}"\n',
          )
          replace(
              'minecraft_mod_ai/progress_aware_tool_loop.py',
              '''                ctx_progress = False\n                if after_ctx is not None:\n                    if before_ctx is None or after_ctx.localization_stage != before_ctx.localization_stage or after_ctx.target_path != before_ctx.target_path or after_ctx.target_symbol != before_ctx.target_symbol or after_ctx.source_body != before_ctx.source_body:\n                        ctx_progress = True\n''',
              '''                ctx_progress = bool(\n                    after_ctx is not None\n                    and (\n                        before_ctx is None\n                        or after_ctx.localization_stage != before_ctx.localization_stage\n                        or after_ctx.target_path != before_ctx.target_path\n                        or after_ctx.target_symbol != before_ctx.target_symbol\n                        or after_ctx.source_body != before_ctx.source_body\n                    )\n                )\n''',
          )
          replace(
              'minecraft_mod_ai/progress_aware_tool_loop.py',
              '''                    if state.phase == LoopPhase.OBSERVE and implementation_requires_mutation:\n                        if is_mutation_ready(messages, state):\n                            state.phase = LoopPhase.ACT\n''',
              '''                    if (\n                        state.phase == LoopPhase.OBSERVE\n                        and implementation_requires_mutation\n                        and is_mutation_ready(messages, state)\n                    ):\n                        state.phase = LoopPhase.ACT\n''',
          )
          PY
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Verify Worker 04 static quality
        run: >-
          ruff check
          minecraft_mod_ai/agent_capability_context.py
          minecraft_mod_ai/agent_roles.py
          minecraft_mod_ai/agent_tool_runtime.py
          minecraft_mod_ai/agent_intent.py
          minecraft_mod_ai/agent_routing_intent_contract.py
          minecraft_mod_ai/external_agent_bridge.py
          minecraft_mod_ai/external_mcp_router.py
          minecraft_mod_ai/model_router.py
          minecraft_mod_ai/progress_aware_tool_loop.py
          tests/test_worker04_quality_contract.py
      - name: Verify Worker 04 behavior
        run: >-
          python -m pytest -q
          tests/test_worker04_quality_contract.py
          tests/test_agent_capability_context.py
          tests/test_agent_capability_manifest_degradation.py
          tests/test_agent_required_rag_semantic_choice.py
          tests/test_agent_tool_calling.py
          tests/test_external_mcp_router.py
          tests/test_agent_runtime_hot_paths.py
      - name: Commit to main
        run: |
          git diff --check
          git config user.name 'worker-04-bot'
          git config user.email 'worker-04@users.noreply.github.com'
          git add minecraft_mod_ai/model_router.py minecraft_mod_ai/external_mcp_router.py minecraft_mod_ai/external_agent_bridge.py minecraft_mod_ai/agent_tool_runtime.py minecraft_mod_ai/progress_aware_tool_loop.py
          git commit -m 'refactor: harden worker04 routing hot paths'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            ruff check minecraft_mod_ai/agent_capability_context.py minecraft_mod_ai/agent_roles.py minecraft_mod_ai/agent_tool_runtime.py minecraft_mod_ai/agent_intent.py minecraft_mod_ai/agent_routing_intent_contract.py minecraft_mod_ai/external_agent_bridge.py minecraft_mod_ai/external_mcp_router.py minecraft_mod_ai/model_router.py minecraft_mod_ai/progress_aware_tool_loop.py tests/test_worker04_quality_contract.py
            python -m pytest -q tests/test_worker04_quality_contract.py tests/test_agent_capability_context.py tests/test_agent_capability_manifest_degradation.py tests/test_agent_required_rag_semantic_choice.py tests/test_agent_tool_calling.py tests/test_external_mcp_router.py tests/test_agent_runtime_hot_paths.py
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
