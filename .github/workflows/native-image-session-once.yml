name: Native image session cleanup once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-image-session-once.yml

permissions:
  contents: write

concurrency:
  group: mmm-native-image-session-once
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
      - name: Move image residency session into canonical owners
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, found {count}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          router = Path('minecraft_mod_ai/model_router.py')
          replace_once(
              router,
              '    def generate_image(\n',
              '''    @contextmanager\n    def image_generation_session(self, role: str = "image_generator"):\n        """Hold one exclusive local-image GPU lease through final pipeline parking."""\n\n        config = self.registry.role(self.profile, role)\n        local_diffusion = (\n            str(config.provider) == "local"\n            and str(config.adapter) == "image_diffusion"\n            and bool(config.exclusive_gpu)\n        )\n        if not local_diffusion:\n            yield self\n            return\n\n        from .model_adapters import image_diffusion as image_module\n\n        with self._gpu_scope(True):\n            try:\n                yield self\n            finally:\n                image_module.finish_image_shard()\n\n    def generate_image(\n''',
          )

          services = Path('minecraft_mod_ai/complete_orchestrator_services.py')
          replace_once(services, 'def generate_assets(\n', 'def _generate_assets_impl(\n')
          replace_once(
              services,
              '\n\ndef blockbench_review(\n',
              '''\n\ndef generate_assets(\n    router: ModelRouter,\n    proposal: CompleteProposal,\n    project_root: Path,\n    run_root: Path,\n) -> dict[str, Any]:\n    """Generate one asset shard inside the router-owned image residency session."""\n\n    with router.image_generation_session("image_generator"):\n        return _generate_assets_impl(router, proposal, project_root, run_root)\n\n\ngenerate_assets._mmm_adaptive_image_gpu_session = True  # type: ignore[attr-defined]\n\n\ndef blockbench_review(\n''',
          )

          residency = Path('minecraft_mod_ai/image_runtime_residency.py')
          residency.write_text('''from __future__ import annotations\n\n"""Compatibility verifier for the native image residency contract."""\n\n\ndef install() -> None:\n    from . import complete_orchestrator_services as services\n    from . import model_router\n    from .model_adapters import image_diffusion as image_module\n\n    if not getattr(\n        image_module.ImageDiffusionAdapter.generate_image,\n        "_mmm_adaptive_image_residency",\n        False,\n    ):\n        raise RuntimeError(\n            "ImageDiffusionAdapter must own adaptive pipeline residency natively."\n        )\n    if not hasattr(model_router.ModelRouter, "image_generation_session"):\n        raise RuntimeError("ModelRouter must own the image GPU session natively.")\n    if not getattr(services.generate_assets, "_mmm_adaptive_image_gpu_session", False):\n        raise RuntimeError("Asset generation must enter the native image GPU session.")\n\n\n__all__ = ["install"]\n''', encoding='utf-8')

          bootstrap = Path('minecraft_mod_ai/runtime_bootstrap.py')
          replace_once(
              bootstrap,
              '    from .image_runtime_residency import install as install_image_runtime_residency\n',
              '',
          )
          replace_once(bootstrap, '    install_image_runtime_residency()\n', '')
          PY
      - name: Validate native image ownership
        run: |
          python -m compileall -q minecraft_mod_ai/model_router.py minecraft_mod_ai/complete_orchestrator_services.py minecraft_mod_ai/image_runtime_residency.py minecraft_mod_ai/runtime_bootstrap.py
          python - <<'PY'
          import ast
          from pathlib import Path
          tree = ast.parse(Path('minecraft_mod_ai/image_runtime_residency.py').read_text())
          forbidden = []
          for node in ast.walk(tree):
              if isinstance(node, ast.Assign):
                  forbidden.extend(ast.unparse(t) for t in node.targets if isinstance(t, ast.Attribute))
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Name) and node.func.id == 'setattr':
                  forbidden.append('setattr')
          if forbidden:
              raise SystemExit(f'image compatibility module still patches runtime behavior: {forbidden}')
          bootstrap = Path('minecraft_mod_ai/runtime_bootstrap.py').read_text()
          if 'install_image_runtime_residency' in bootstrap:
              raise SystemExit('bootstrap still installs image residency wrapper')
          PY
          git diff --check
      - name: Commit cleanup and remove one-shot workflow
        run: |
          rm .github/workflows/native-image-session-once.yml
          git add -A
          git diff --cached --check
          git commit -m "refactor(images): make GPU session canonical"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
