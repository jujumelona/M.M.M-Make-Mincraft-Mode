name: Targeted Runtime Repair
# registered trigger
on:
  push:
    branches: [main]
    paths: ['.github/workflows/targeted-runtime-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Patch targeted regressions
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'patch anchor missing: {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'minecraft_mod_ai/work_graph.py',
              """        if stage == 'content':\n            return _pipeline_shard_size(\n                'MMM_CONTENT_PIPELINE_SHARD_SIZE',\n                1,\n                max(1, int(policy.java_shard_size)),\n            )\n""",
              """        if stage == 'content':\n            # Deterministic content aggregation is owned by ScalePolicy. Runtime\n            # environment knobs must not silently explode one bounded aggregate into\n            # one work node per module.\n            return max(1, int(policy.java_shard_size))\n""",
          )
          replace_once(
              'minecraft_mod_ai/work_graph.py',
              """        if stage == 'entity':\n            return _pipeline_shard_size(\n                'MMM_ENTITY_PIPELINE_SHARD_SIZE',\n                1,\n                max(1, int(policy.entity_shard_size)),\n            )\n""",
              """        if stage == 'entity':\n            return _pipeline_shard_size(\n                'MMM_ENTITY_PIPELINE_SHARD_SIZE',\n                2,\n                max(1, int(policy.entity_shard_size)),\n            )\n""",
          )

          replace_once(
              'minecraft_mod_ai/custom_module_generator.py',
              """    hard_cap = max(1024, int(policy.model_context_bytes))\n    if fast_mode:\n        return min(hard_cap, 4 * 1024)\n    fallback = min(hard_cap, 12 * 1024)\n""",
              """    hard_cap = max(1024, int(policy.model_context_bytes))\n    # Fast mode changes search/retry policy, not the semantic source context needed\n    # by the coder. Starving grounding here turns speed mode into a quality mode.\n    fallback = min(hard_cap, 12 * 1024)\n""",
          )

          replace_once(
              'minecraft_mod_ai/llama_tuning_pipeline.py',
              """    def _context_value(config: Any) -> int:\n""",
              """    def _context_value(config: Any) -> int | None:\n""",
          )
          replace_once(
              'minecraft_mod_ai/llama_tuning_pipeline.py',
              """        return 0\n\n    def _install_profile_context_authority(self) -> None:\n""",
              """        # No explicit/profile context means llama.cpp native auto remains\n        # authoritative. Do not materialize an artificial --ctx-size 0 flag.\n        return None\n\n    def _install_profile_context_authority(self) -> None:\n""",
          )
          replace_once(
              'minecraft_mod_ai/llama_tuning_pipeline.py',
              """            context = self._context_value(config)\n            for name in (\"--ctx-size\", \"-c\"):\n""",
              """            context = self._context_value(config)\n            if context is None:\n                return args\n            for name in (\"--ctx-size\", \"-c\"):\n""",
          )
          PY
      - name: Run targeted regressions
        run: |
          python -m compileall -q minecraft_mod_ai
          python -m ruff check minecraft_mod_ai --select F,E7,E9
          python -m pytest -q \
            tests/test_durable_work_graph.py \
            tests/test_generation_lane_parallelism_contract.py \
            tests/test_fast_mode_quality_contract.py \
            tests/test_llama_server_native_resource_fit.py \
            tests/test_reference_source_research_parallelism.py \
            tests/test_runtime_bootstrap_clean.py
      - name: Commit validated code
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai
          git commit -m 'Repair aggregate, coder context, and native llama sizing'
          git pull --rebase origin main
          git push origin HEAD:main
