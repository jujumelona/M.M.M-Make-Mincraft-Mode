name: Production Path Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'minecraft_mod_ai/model_adapters/**'
      - 'minecraft_mod_ai/model_router.py'
      - 'minecraft_mod_ai/custom_module_generator.py'
      - 'minecraft_mod_ai/atomic_concern_source.py'
      - 'minecraft_mod_ai/java_region_parser.py'
      - 'minecraft_mod_ai/authored_production.py'
      - 'minecraft_mod_ai/production_state_compiler.py'
      - 'minecraft_mod_ai/structured_state_runtime.py'
      - 'minecraft_mod_ai/implementation_graph_execution.py'
      - 'minecraft_mod_ai/runner.py'
      - 'minecraft_mod_ai/complete_orchestrator.py'
      - 'minecraft_mod_ai/scheduler_claim_fencing_contract.py'
      - 'minecraft_mod_ai/complete_build_repair.py'
      - 'minecraft_mod_ai/final_artifact.py'
      - 'tests/test_direct_custom_module_generator.py'
      - 'tests/test_atomic_concern_response_contract.py'
      - 'tests/test_atomic_java_first_pass.py'
      - 'tests/test_java_region_parser.py'
      - 'tests/test_authored_direct_lowering.py'
      - 'tests/test_production_state_compiler.py'
      - 'tests/test_authored_state_lowering_regression.py'
      - 'tests/test_implementation_graph_admission.py'
      - 'tests/test_complete_final_validation_contract.py'
      - 'tests/test_scheduler_claim_fencing_contract.py'
      - '.github/workflows/production-path-contract.yml'
  push:
    branches: [main]
    paths:
      - 'minecraft_mod_ai/model_adapters/**'
      - 'minecraft_mod_ai/model_router.py'
      - 'minecraft_mod_ai/custom_module_generator.py'
      - 'minecraft_mod_ai/atomic_concern_source.py'
      - 'minecraft_mod_ai/java_region_parser.py'
      - 'minecraft_mod_ai/authored_production.py'
      - 'minecraft_mod_ai/production_state_compiler.py'
      - 'minecraft_mod_ai/structured_state_runtime.py'
      - 'minecraft_mod_ai/implementation_graph_execution.py'
      - 'minecraft_mod_ai/runner.py'
      - 'minecraft_mod_ai/complete_orchestrator.py'
      - 'minecraft_mod_ai/scheduler_claim_fencing_contract.py'
      - 'minecraft_mod_ai/complete_build_repair.py'
      - 'minecraft_mod_ai/final_artifact.py'
      - 'tests/test_direct_custom_module_generator.py'
      - 'tests/test_atomic_concern_response_contract.py'
      - 'tests/test_atomic_java_first_pass.py'
      - 'tests/test_java_region_parser.py'
      - 'tests/test_authored_direct_lowering.py'
      - 'tests/test_production_state_compiler.py'
      - 'tests/test_authored_state_lowering_regression.py'
      - 'tests/test_implementation_graph_admission.py'
      - 'tests/test_complete_final_validation_contract.py'
      - 'tests/test_scheduler_claim_fencing_contract.py'
      - '.github/workflows/production-path-contract.yml'

permissions:
  contents: read

concurrency:
  group: production-path-contract-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic-production-path:
    name: Deterministic production path
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install runtime and test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Compile production boundary modules
        run: |
          python -m py_compile \
            minecraft_mod_ai/model_router.py \
            minecraft_mod_ai/custom_module_generator.py \
            minecraft_mod_ai/authored_production.py \
            minecraft_mod_ai/production_state_compiler.py \
            minecraft_mod_ai/structured_state_runtime.py \
            minecraft_mod_ai/implementation_graph_execution.py \
            minecraft_mod_ai/runner.py \
            minecraft_mod_ai/complete_orchestrator.py \
            minecraft_mod_ai/scheduler_claim_fencing_contract.py \
            minecraft_mod_ai/complete_build_repair.py \
            minecraft_mod_ai/final_artifact.py
      - name: Run direct production-path contracts
        run: |
          python -m pytest -q \
            tests/test_direct_custom_module_generator.py \
            tests/test_atomic_concern_response_contract.py::test_stored_state_semantic_shape_retries_then_accepts_declarations_only \
            tests/test_atomic_concern_response_contract.py::test_multiline_behavior_actor_source_is_host_lowered_without_structured_plan \
            tests/test_atomic_concern_response_contract.py::test_bold_inline_behavior_actor_source_is_host_lowered_without_structured_plan \
            tests/test_atomic_java_first_pass.py::test_stored_state_schema_forbids_outer_methods_before_model_decode \
            tests/test_atomic_java_first_pass.py::test_stored_state_native_part_selector_never_offers_methods \
            tests/test_authored_direct_lowering.py \
            tests/test_production_state_compiler.py \
            tests/test_authored_state_lowering_regression.py \
            tests/test_implementation_graph_admission.py \
            tests/test_complete_final_validation_contract.py \
            tests/test_scheduler_claim_fencing_contract.py
