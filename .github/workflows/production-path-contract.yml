permissions:
  contents: read

concurrency:
  group: production-path-contract-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deterministic-production-path:
    name: Deterministic production path
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install runtime and test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Compile production boundary modules
        run: |
          python -m py_compile \
            minecraft_mod_ai/model_router.py \
            minecraft_mod_ai/execution_contract_policy.py \
            minecraft_mod_ai/java_generation_policy.py \
            minecraft_mod_ai/java_region_parser.py \
            minecraft_mod_ai/authored_production.py \
            minecraft_mod_ai/typed_plan_ir.py \
            minecraft_mod_ai/typed_plan_production.py \
            minecraft_mod_ai/typed_host_capabilities.py \
            minecraft_mod_ai/production_state_compiler.py \
            minecraft_mod_ai/structured_state_runtime.py \
            minecraft_mod_ai/runner.py \
            minecraft_mod_ai/resource_asset_production.py \
            minecraft_mod_ai/mcp_tools.py \
            minecraft_mod_ai/publisher.py \
            minecraft_mod_ai/release_artifact_contract.py \
            minecraft_mod_ai/complete_orchestrator.py \
            minecraft_mod_ai/scheduler_claim_fencing_contract.py \
            minecraft_mod_ai/final_artifact.py
      - name: Run production-path contracts
        run: |
          python -m pytest -q \
            tests/test_request_first_rag_pipeline.py \
            tests/test_request_feature_implementation.py \
            tests/test_request_runtime_ownership.py \
            tests/test_production_checkpoint_fingerprint.py \
            tests/test_packaged_version_catalog.py \
            tests/test_ci_quality_regression_audit.py \
            tests/test_authored_source_rag.py \
            tests/test_curseforge_only_source_policy.py \
            tests/test_request_driven_worksheet.py \
            tests/test_gradle_wrapper_release_attestation.py \
            tests/test_llama_completion_liveness_contract.py \
            tests/test_authored_gameplay_gui_floor.py \
            tests/test_execution_contract_policy.py \
            tests/test_typed_plan_authoring.py \
            tests/test_typed_plan_production.py \
            tests/test_authored_direct_lowering.py \
            tests/test_production_state_compiler.py \
            tests/test_complete_final_validation_contract.py \
            tests/test_runner_gametest_first_execution.py \
            tests/test_resource_asset_clean_contract.py \
            tests/test_release_source_hygiene.py \
            tests/test_scheduler_claim_fencing_contract.py \
            tests/test_final_artifact_boundaries.py
