name: Reuse-first architecture upgrade

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/reuse-first-architecture.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical reuse-first changes
        shell: bash
        run: |
          set -euo pipefail
          cat > minecraft_mod_ai/reuse_discovery.py <<'PY'
          from __future__ import annotations

          """Adaptive, capability-level discovery for reusable Minecraft source donors.

          Discovery is intentionally cheap-first: query catalogues/repository metadata in
          parallel, resolve upstream source origins, deduplicate by immutable repository
          identity, then pass only a small coverage-diverse representative set to the
          expensive source-transplant inspector.
          """

          import os
          import re
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from dataclasses import dataclass, field
          from typing import Any, Mapping, Sequence
          from urllib.parse import quote, urlparse

          import httpx

          _TOKEN = re.compile(r"[A-Za-z0-9_]+|[\u3131-\u318e\uac00-\ud7a3]+")
          _MINECRAFT_GAME_ID = 432
          _CURSEFORGE_LOADERS = {"forge": 1, "fabric": 4, "quilt": 5, "neoforge": 6}


          @dataclass
          class _RepositoryEvidence:
              repository: str
              capabilities: set[str] = field(default_factory=set)
              providers: set[str] = field(default_factory=set)
              hits: int = 0
              rank_score: float = 0.0


          def _env_int(name: str, default: int, *, minimum: int, maximum: int) -> int:
              raw = os.environ.get(name, str(default)).strip()
              try:
                  value = int(raw)
              except ValueError as exc:
                  raise ValueError(f"{name} must be an integer.") from exc
              if not minimum <= value <= maximum:
                  raise ValueError(f"{name} must be between {minimum} and {maximum}.")
              return value


          def _workers() -> int:
              return _env_int("MMM_REUSE_PARALLELISM", 12, minimum=1, maximum=64)


          def _query_limit() -> int:
              return _env_int("MMM_REUSE_DISCOVERY_LIMIT", 16, minimum=4, maximum=50)


          def _representative_limit() -> int:
              return _env_int("MMM_REUSE_REPRESENTATIVE_LIMIT", 16, minimum=4, maximum=48)


          def _query_variant_limit() -> int:
              return _env_int("MMM_REUSE_QUERY_VARIANTS", 3, minimum=1, maximum=6)


          def _minimum_candidates() -> int:
              return _env_int("MMM_REUSE_MIN_CANDIDATES_PER_CAPABILITY", 3, minimum=1, maximum=12)


          def _graph_search_terms(
              capabilities: Sequence[str],
              capability_graph: Mapping[str, Any] | None,
          ) -> dict[str, tuple[str, ...]]:
              result = {capability: (capability.replace(".", " "),) for capability in capabilities}
              if not isinstance(capability_graph, Mapping):
                  return result
              raw = capability_graph.get("search_terms")
              if not isinstance(raw, Sequence) or isinstance(raw, (str, bytes)):
                  return result
              for item in raw:
                  if not isinstance(item, Mapping):
                      continue
                  capability = str(item.get("capability") or "").strip()
                  if capability not in result:
                      continue
                  terms = item.get("terms")
                  if not isinstance(terms, Sequence) or isinstance(terms, (str, bytes)):
                      continue
                  values: list[str] = []
                  for term in terms:
                      text = " ".join(str(term or "").split())
                      if text and text not in values:
                          values.append(text)
                  if values:
                      result[capability] = tuple(values)
              return result


          def _query_variants(capability: str, terms: Sequence[str]) -> tuple[str, ...]:
              values: list[str] = []
              semantic = " ".join(_TOKEN.findall(capability.replace(".", " ").replace("-", " ")))
              for raw in [*terms, semantic]:
                  text = " ".join(str(raw or "").split())
                  if text and text.casefold() not in {item.casefold() for item in values}:
                      values.append(text[:512])
              expanded: list[str] = []
              for text in values:
                  expanded.append(text)
                  if len(expanded) >= _query_variant_limit():
                      break
              if len(expanded) < _query_variant_limit() and semantic:
                  for suffix in ("system", "implementation source"):
                      query = f"{semantic} {suffix}"
                      if query.casefold() not in {item.casefold() for item in expanded}:
                          expanded.append(query)
                      if len(expanded) >= _query_variant_limit():
                          break
              return tuple(expanded or (capability,))


          def _github_repository(value: Any) -> str:
              text = str(value or "").strip()
              if not text:
                  return ""
              if re.fullmatch(r"[A-Za-z0-9_.-]{1,100}/[A-Za-z0-9_.-]{1,100}", text):
                  return text.removesuffix(".git")
              try:
                  parsed = urlparse(text)
              except ValueError:
                  return ""
              if parsed.scheme != "https" or (parsed.hostname or "").casefold() != "github.com":
                  return ""
              parts = [part for part in parsed.path.split("/") if part]
              if len(parts) < 2:
                  return ""
              owner, repo = parts[0], parts[1].removesuffix(".git")
              candidate = f"{owner}/{repo}"
              return candidate if re.fullmatch(r"[A-Za-z0-9_.-]{1,100}/[A-Za-z0-9_.-]{1,100}", candidate) else ""


          def _candidate_repository(candidate: Mapping[str, Any]) -> str:
              return _github_repository(candidate.get("source_url")) or _github_repository(candidate.get("title"))


          def _resolve_modrinth_candidates(candidates: Sequence[Mapping[str, Any]]) -> list[tuple[str, float]]:
              jobs: list[tuple[int, str]] = []
              direct: list[tuple[str, float]] = []
              for index, candidate in enumerate(candidates):
                  repository = _candidate_repository(candidate)
                  if repository:
                      direct.append((repository, 1.0 / (1 + index)))
                      continue
                  api_url = str(candidate.get("api_url") or "").strip()
                  if api_url.startswith("https://api.modrinth.com/v2/project/"):
                      jobs.append((index, api_url))
              if not jobs:
                  return direct

              def resolve(job: tuple[int, str]) -> tuple[str, float]:
                  index, url = job
                  try:
                      response = httpx.get(
                          url,
                          timeout=8.0,
                          follow_redirects=False,
                          headers={"User-Agent": "MMM-reuse-discovery/1"},
                      )
                      response.raise_for_status()
                      value = response.json()
                      if not isinstance(value, Mapping):
                          return "", 0.0
                      return _github_repository(value.get("source_url")), 1.0 / (1 + index)
                  except Exception:
                      return "", 0.0

              with ThreadPoolExecutor(max_workers=min(_workers(), len(jobs))) as pool:
                  futures = [pool.submit(resolve, job) for job in jobs]
                  for future in as_completed(futures):
                      repository, score = future.result()
                      if repository:
                          direct.append((repository, score))
              return direct


          def _search_curseforge(query: str, *, limit: int) -> list[tuple[str, float]]:
              api_key = (
                  os.environ.get("MMM_CURSEFORGE_API_KEY", "").strip()
                  or os.environ.get("CURSEFORGE_API_KEY", "").strip()
              )
              if not api_key:
                  return []
              params = {
                  "gameId": str(_MINECRAFT_GAME_ID),
                  "searchFilter": query,
                  "sortField": "2",
                  "sortOrder": "desc",
                  "pageSize": str(min(limit, 50)),
                  "index": "0",
              }
              try:
                  response = httpx.get(
                      "https://api.curseforge.com/v1/mods/search",
                      params=params,
                      headers={"Accept": "application/json", "x-api-key": api_key},
                      timeout=10.0,
                      follow_redirects=False,
                  )
                  response.raise_for_status()
                  raw = response.json()
              except Exception:
                  return []
              data = raw.get("data") if isinstance(raw, Mapping) else None
              if not isinstance(data, list):
                  return []
              result: list[tuple[str, float]] = []
              for index, item in enumerate(data):
                  if not isinstance(item, Mapping):
                      continue
                  links = item.get("links")
                  source_url = links.get("sourceUrl") if isinstance(links, Mapping) else ""
                  repository = _github_repository(source_url)
                  if repository:
                      result.append((repository, 1.0 / (1 + index)))
              return result


          def discover_repositories_for_graph(
              capabilities: Sequence[str],
              client: Any,
              *,
              capability_graph: Mapping[str, Any] | None = None,
          ) -> dict[str, tuple[str, ...]]:
              """Adaptive two-wave discovery with cross-capability representative selection."""

              ordered = tuple(dict.fromkeys(str(item).strip() for item in capabilities if str(item).strip()))
              result: dict[str, tuple[str, ...]] = {capability: () for capability in ordered}
              if not ordered:
                  return result
              terms = _graph_search_terms(ordered, capability_graph)
              variants = {capability: _query_variants(capability, terms[capability]) for capability in ordered}
              evidence: dict[str, _RepositoryEvidence] = {}
              per_capability: dict[str, dict[str, float]] = {capability: {} for capability in ordered}

              def register(capability: str, provider: str, values: Sequence[tuple[str, float]]) -> None:
                  for repository, rank in values:
                      repository = _github_repository(repository)
                      if not repository:
                          continue
                      cap_scores = per_capability[capability]
                      cap_scores[repository] = max(cap_scores.get(repository, 0.0), rank)
                      item = evidence.setdefault(repository, _RepositoryEvidence(repository=repository))
                      item.capabilities.add(capability)
                      item.providers.add(provider)
                      item.hits += 1
                      item.rank_score += rank

              def provider_search(capability: str, provider: str, query: str) -> tuple[str, str, list[tuple[str, float]]]:
                  if provider == "curseforge":
                      return capability, provider, _search_curseforge(query, limit=_query_limit())
                  try:
                      page = client.search(provider, query, limit=_query_limit(), target_profile="minecraft_mod")
                  except Exception:
                      return capability, provider, []
                  raw = page.get("candidates") if isinstance(page, Mapping) else None
                  candidates = [item for item in raw if isinstance(item, Mapping)] if isinstance(raw, Sequence) and not isinstance(raw, (str, bytes)) else []
                  if provider == "modrinth":
                      return capability, provider, _resolve_modrinth_candidates(candidates)
                  values: list[tuple[str, float]] = []
                  for index, candidate in enumerate(candidates):
                      repository = _candidate_repository(candidate)
                      if repository:
                          values.append((repository, 1.0 / (1 + index)))
                  return capability, provider, values

              providers = ["github", "modrinth"]
              if os.environ.get("MMM_CURSEFORGE_API_KEY", "").strip() or os.environ.get("CURSEFORGE_API_KEY", "").strip():
                  providers.append("curseforge")

              def run_wave(capability_set: Sequence[str], variant_index: int) -> None:
                  jobs: list[tuple[str, str, str]] = []
                  for capability in capability_set:
                      query_list = variants[capability]
                      if variant_index >= len(query_list):
                          continue
                      for provider in providers:
                          jobs.append((capability, provider, query_list[variant_index]))
                  if not jobs:
                      return
                  with ThreadPoolExecutor(max_workers=min(_workers(), len(jobs)), thread_name_prefix="mmm-reuse-catalog") as pool:
                      futures = [pool.submit(provider_search, *job) for job in jobs]
                      for future in as_completed(futures):
                          try:
                              capability, provider, values = future.result()
                          except Exception:
                              continue
                          register(capability, provider, values)

              run_wave(ordered, 0)
              for variant_index in range(1, _query_variant_limit()):
                  uncovered = [
                      capability
                      for capability in ordered
                      if len(per_capability[capability]) < _minimum_candidates()
                  ]
                  if not uncovered:
                      break
                  run_wave(uncovered, variant_index)

              selected = _representative_repositories(evidence, ordered)
              selected_set = set(selected)
              for capability in ordered:
                  ranked = sorted(
                      per_capability[capability],
                      key=lambda repo: (
                          repo in selected_set,
                          len(evidence[repo].capabilities),
                          len(evidence[repo].providers),
                          per_capability[capability][repo],
                          evidence[repo].rank_score,
                          repo,
                      ),
                      reverse=True,
                  )
                  selected_for_capability = [repo for repo in ranked if repo in selected_set]
                  if not selected_for_capability and ranked:
                      selected_for_capability.append(ranked[0])
                  result[capability] = tuple(selected_for_capability)
              return result


          def _representative_repositories(
              evidence: Mapping[str, _RepositoryEvidence],
              capabilities: Sequence[str],
          ) -> tuple[str, ...]:
              """Greedy set-cover/facility-location approximation over source repositories."""

              remaining = set(capabilities)
              available = set(evidence)
              selected: list[str] = []
              limit = min(_representative_limit(), len(available))
              minimum = min(6, limit)
              while available and len(selected) < limit:
                  best = max(
                      available,
                      key=lambda repo: (
                          100.0 * len(evidence[repo].capabilities & remaining)
                          + 10.0 * len(evidence[repo].capabilities)
                          + 3.0 * len(evidence[repo].providers)
                          + evidence[repo].rank_score,
                          evidence[repo].hits,
                          repo,
                      ),
                  )
                  new_coverage = evidence[best].capabilities & remaining
                  if not new_coverage and len(selected) >= minimum:
                      break
                  selected.append(best)
                  available.remove(best)
                  remaining -= new_coverage
                  if not remaining and len(selected) >= minimum:
                      break
              return tuple(selected)


          __all__ = ["discover_repositories_for_graph"]
          PY

          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/reuse_planner.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one anchor, found {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'from .ecosystem_discovery import EcosystemDiscoveryClient\n',
              'from .ecosystem_discovery import EcosystemDiscoveryClient\nfrom .reuse_discovery import discover_repositories_for_graph\n',
          )
          replace_once(
              '    sources: tuple[tuple[str, str], ...]\n\n    def to_dict(self) -> dict[str, Any]:\n',
              '    sources: tuple[tuple[str, str], ...]\n    search_terms: tuple[tuple[str, tuple[str, ...]], ...] = ()\n\n    def to_dict(self) -> dict[str, Any]:\n',
          )
          replace_once(
              '            "sources": [{"capability": cap, "source": source} for cap, source in self.sources],\n',
              '            "sources": [{"capability": cap, "source": source} for cap, source in self.sources],\n            "search_terms": [\n                {"capability": cap, "terms": list(terms)}\n                for cap, terms in self.search_terms\n            ],\n',
          )
          replace_once(
              '    sources: dict[str, str] = {}\n    seen: set[str] = set()\n',
              '    sources: dict[str, str] = {}\n    search_terms: dict[str, list[str]] = {}\n    seen: set[str] = set()\n',
          )
          replace_once(
              '    def walk(value: Any, source: str, parent: str = "", depth: int = 0) -> None:\n',
              '''    def register_search_terms(capability: str, values: Iterable[Any]) -> None:\n        if not capability:\n            return\n        bucket = search_terms.setdefault(capability, [])\n        for raw in values:\n            value = " ".join(str(raw or "").split())\n            if value and value.casefold() not in {item.casefold() for item in bucket}:\n                bucket.append(value[:512])\n\n    def walk(value: Any, source: str, parent: str = "", depth: int = 0) -> None:\n''',
          )
          old = '''    if isinstance(design, Mapping):\n        for key, value in design.items():\n            if str(key).casefold() in _CAPABILITY_KEYS:\n                walk(value, f"design.{key}")\n    for kind in module_kinds:\n        add(kind, "module_kind")\n\n    if not ordered:\n'''
          new = '''    catalog_used = False\n    if isinstance(design, Mapping):\n        catalog = design.get("_evidence_request_catalog")\n        requirements = catalog.get("requirements") if isinstance(catalog, Mapping) else None\n        if isinstance(requirements, Sequence) and not isinstance(requirements, (str, bytes)):\n            for requirement in requirements:\n                if not isinstance(requirement, Mapping):\n                    continue\n                capability = requirement.get("capability")\n                if not str(capability or "").strip():\n                    provides = requirement.get("provides")\n                    if isinstance(provides, Sequence) and not isinstance(provides, (str, bytes)):\n                        capability = next((item for item in provides if str(item or "").strip()), "")\n                source = f"evidence_request_catalog.{requirement.get('requirement_id') or 'requirement'}"\n                anchor = add(capability, source)\n                if anchor:\n                    register_search_terms(\n                        anchor,\n                        (capability, requirement.get("statement")),\n                    )\n                    catalog_used = True\n        if not catalog_used:\n            for key, value in design.items():\n                if str(key).casefold() in _CAPABILITY_KEYS:\n                    walk(value, f"design.{key}")\n    if not catalog_used:\n        for kind in module_kinds:\n            add(kind, "module_kind")\n\n    if not ordered:\n'''
          replace_once(old, new)
          replace_once(
              '        sources=tuple((node, sources[node]) for node in ordered),\n    )\n',
              '        sources=tuple((node, sources[node]) for node in ordered),\n        search_terms=tuple(\n            (node, tuple(search_terms.get(node, (node.replace(".", " "),))))\n            for node in ordered\n        ),\n    )\n',
          )

          replace_once(
              '_parallel_donor_repository_discovery(queries, client)\n',
              '_parallel_donor_repository_discovery(queries, client, capability_graph=graph.to_dict())\n',
          )
          replace_once(
              '''            _parallel_donor_repository_discovery(capabilities, client)\n            if allow_network\n''',
              '''            _parallel_donor_repository_discovery(\n                capabilities, client, capability_graph=capability_graph\n            )\n            if allow_network\n''',
          )

          start = text.index('def _parallel_donor_repository_discovery(')
          end = text.index('\n\ndef _near_cost_targets(', start)
          replacement = '''def _parallel_donor_repository_discovery(\n    capabilities: Sequence[str],\n    client: EcosystemDiscoveryClient,\n    *,\n    capability_graph: Mapping[str, Any] | None = None,\n) -> dict[str, tuple[str, ...]]:\n    """Discover source donors broadly, then deep-inspect only representative repos."""\n\n    return discover_repositories_for_graph(\n        capabilities,\n        client,\n        capability_graph=capability_graph,\n    )\n'''
          text = text[:start] + replacement + text[end:]

          start = text.index('def _discover_best_donor(')
          end = text.index('\n\ndef _fresh_cost(', start)
          replacement = '''def _discover_best_donor(\n    capability: str,\n    *,\n    adapter: PlatformAdapter,\n    discovery_client: EcosystemDiscoveryClient,\n    repositories: Sequence[str],\n) -> DonorSlice | None:\n    """Inspect shortlisted repositories concurrently and return the strongest slice."""\n\n    ordered = tuple(dict.fromkeys(repository for repository in repositories if repository))\n    if not ordered:\n        return None\n\n    def inspect(repository: str) -> DonorSlice | None:\n        return inspect_repository_slice(\n            repository=repository,\n            capability=capability,\n            adapter=adapter,\n            discovery_client=discovery_client,\n        )\n\n    donors: list[DonorSlice] = []\n    workers = min(_workers(), len(ordered))\n    if workers <= 1:\n        donors = [donor for donor in (inspect(repository) for repository in ordered) if donor is not None]\n    else:\n        with ThreadPoolExecutor(max_workers=workers, thread_name_prefix="mmm-donor-inspect") as pool:\n            futures = [pool.submit(inspect, repository) for repository in ordered]\n            for future in as_completed(futures):\n                try:\n                    donor = future.result()\n                except Exception:\n                    continue\n                if donor is not None:\n                    donors.append(donor)\n    if not donors:\n        return None\n    return max(\n        donors,\n        key=lambda donor: (\n            donor.exact_target,\n            donor.confidence,\n            -len(donor.required_dependencies),\n            -len(donor.files),\n            donor.repository,\n        ),\n    )\n'''
          text = text[:start] + replacement + text[end:]

          replace_once(
              '''    donor_count = sum(item.mode in {"source_transplant", "adapt"} for item in decisions)\n    dependency_edges = platform_evidence.dependency_edges if platform_evidence is not None else 0\n    cross_component = 0.15 * max(0, len(decisions) - 1) + 0.08 * donor_count\n    platform_verify = 1.0 + 0.05 * dependency_edges\n    maintenance_risk = (\n        (platform_evidence.integration_risk if platform_evidence is not None else 0.0)\n        + 0.25 * donor_count\n        + 0.50 * sum(item.mode == "fresh" for item in decisions)\n    )\n''',
              '''    donor_decisions = [item for item in decisions if item.mode in {"source_transplant", "adapt"}]\n    donor_sources = {item.source_id for item in donor_decisions if item.source_id}\n    donor_count = len(donor_sources)\n    cohesion_reuse = max(0, len(donor_decisions) - donor_count)\n    dependency_edges = platform_evidence.dependency_edges if platform_evidence is not None else 0\n    cross_component = max(\n        0.0,\n        0.15 * max(0, len(decisions) - 1)\n        + 0.08 * donor_count\n        - 0.05 * cohesion_reuse,\n    )\n    platform_verify = 1.0 + 0.05 * dependency_edges\n    maintenance_risk = (\n        (platform_evidence.integration_risk if platform_evidence is not None else 0.0)\n        + 0.25 * donor_count\n        + 0.50 * sum(item.mode == "fresh" for item in decisions)\n    )\n''',
          )

          # Emit an explicit reuse ledger so downstream generation can enforce scope.
          replace_once(
              '''            "capabilities": [item.to_dict() for item in self.capabilities],\n            "weighted_verified_reuse": round(self.weighted_verified_reuse, 4),\n''',
              '''            "capabilities": [item.to_dict() for item in self.capabilities],\n            "reuse_ledger": [\n                {\n                    "capability": item.capability,\n                    "status": (\n                        "FRESH_REQUIRED"\n                        if item.mode == "fresh"\n                        else "PARTIAL_REUSE"\n                        if item.mode == "adapt"\n                        else "VERIFIED_REUSE"\n                    ),\n                    "mode": item.mode,\n                    "source_id": item.source_id,\n                    "fresh_generation_scope": (\n                        "full" if item.mode == "fresh" else "residual_only" if item.mode == "adapt" else "forbidden"\n                    ),\n                }\n                for item in self.capabilities\n            ],\n            "weighted_verified_reuse": round(self.weighted_verified_reuse, 4),\n''',
          )

          path.write_text(text, encoding='utf-8')
          PY

          cat > tests/test_reuse_first_architecture_contract.py <<'PY'
          from __future__ import annotations

          from minecraft_mod_ai.reuse_discovery import discover_repositories_for_graph
          from minecraft_mod_ai.reuse_planner import (
              CapabilityGraph,
              ReuseDecision,
              TargetImplementationPlan,
              decompose_capability_graph,
          )


          def test_detailed_request_catalog_is_primary_reuse_search_specification():
              design = {
                  "_evidence_request_catalog": {
                      "requirements": [
                          {
                              "requirement_id": "req-trade",
                              "capability": "economy.trade",
                              "statement": "NPC shops buy and sell goods using persistent currency balances",
                              "provides": ["economy.trade"],
                          },
                          {
                              "requirement_id": "req-cooking",
                              "capability": "cooking.recipe",
                              "statement": "Players cook ingredient recipes at a timed cooking station",
                              "provides": ["cooking.recipe"],
                          },
                      ]
                  },
                  "modules": ["unrelated_fallback_module"],
              }
              graph = decompose_capability_graph(
                  "make a medieval life mod",
                  design=design,
                  module_kinds=("unrelated_fallback_module",),
              )
              assert graph.nodes == ("economy.trade", "cooking.recipe")
              payload = graph.to_dict()
              terms = {item["capability"]: item["terms"] for item in payload["search_terms"]}
              assert "NPC shops buy and sell goods using persistent currency balances" in terms["economy.trade"]
              assert "Players cook ingredient recipes at a timed cooking station" in terms["cooking.recipe"]
              assert all(source[1].startswith("evidence_request_catalog.") for source in graph.sources)


          class _FakeDiscovery:
              def __init__(self):
                  self.calls = []

              def search(self, provider, query, **kwargs):
                  self.calls.append((provider, query, kwargs))
                  if provider == "github":
                      return {
                          "candidates": [
                              {
                                  "source_url": "https://github.com/example/shared-systems",
                                  "title": "example/shared-systems",
                              },
                              {
                                  "source_url": f"https://github.com/example/{query.split()[0].lower()}-feature",
                                  "title": "feature",
                              },
                          ]
                      }
                  return {"candidates": []}


          def test_discovery_is_parallel_provider_aware_and_prefers_cross_capability_repositories(monkeypatch):
              monkeypatch.delenv("MMM_CURSEFORGE_API_KEY", raising=False)
