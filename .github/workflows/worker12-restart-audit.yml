name: Worker 12 Restart Audit

on:
  push:
    paths:
      - '.github/worker12-restart-audit.trigger'

permissions:
  contents: write

concurrency:
  group: worker12-restart-audit
  cancel-in-progress: false

jobs:
  patch-test-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply fresh Worker 12 audit fixes
        run: python .github/scripts/worker12_restart_audit_patch.py
      - name: Static gates
        run: |
          git diff --check
          python -m compileall -q minecraft_mod_ai tools tests
          python -m ruff check \
            minecraft_mod_ai/trajectory_memory.py \
            minecraft_mod_ai/agentic_optimization_contract.py \
            tools/colab_runtime_setup.py \
            tests/test_worker12_shared_core.py \
            --select F,E7,E9 --fix
          git diff --check
          python -m ruff check \
            minecraft_mod_ai/trajectory_memory.py \
            minecraft_mod_ai/agentic_optimization_contract.py \
            tools/colab_runtime_setup.py \
            tests/test_worker12_shared_core.py \
            --select F,E7,E9
          python tools/validate_colab_notebook.py
      - name: Worker 12 focused regression suite
        run: |
          python -m pytest -q \
            tests/test_worker12_shared_core.py \
            tests/test_agent_security_contract.py \
            tests/test_worker10_validation_fail_closed.py \
            tests/test_validation_execution_contract.py \
            tests/test_runtime_bootstrap_clean.py \
            tests/test_runtime_contract_composer.py \
            tests/test_runtime_contract_composer_ownership.py \
            tests/test_runtime_wrapper_signature_integrity.py \
            tests/test_remote_store_defaults.py \
            tests/test_remote_trajectory_auth_preflight.py \
            tests/test_colab_prefetch_bootstrap.py \
            tests/test_colab_run_modes.py
      - name: Commit tested source and remove one-shot scaffolding
        run: |
          set -euo pipefail
          git rm -f \
            .github/scripts/worker12_restart_audit_patch.py \
            .github/workflows/worker12-restart-audit.yml \
            .github/worker12-restart-audit.trigger
          git add minecraft_mod_ai tools tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(worker12): close fresh shared-core audit gaps'
      - name: Rebase latest main, re-test, and push
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            python -m pytest -q \
              tests/test_worker12_shared_core.py \
              tests/test_agent_security_contract.py \
              tests/test_validation_execution_contract.py \
              tests/test_runtime_bootstrap_clean.py \
              tests/test_colab_prefetch_bootstrap.py \
              tests/test_colab_run_modes.py
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
