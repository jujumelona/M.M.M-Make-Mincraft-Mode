name: Fix tool fixed-point convergence

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-tool-fixed-point.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply fixed-point convergence repair
        run: |
          python -m pip install -q pytest anyio PyYAML httpx packaging
          python .github/scripts/fix_tool_fixed_point.py
          python -m compileall -q minecraft_mod_ai
          pytest -q tests/test_agent_tool_calling.py
      - name: Commit repair to main and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-tool-fixed-point.yml
          rm .github/scripts/fix_tool_fixed_point.py
          git add minecraft_mod_ai/model_router.py tests/test_agent_tool_calling.py .github/workflows/fix-tool-fixed-point.yml .github/scripts/fix_tool_fixed_point.py
          git diff --cached --check
          git commit -m "Finalize after exact tool fixed-point convergence"
          git pull --rebase origin main
          git push origin HEAD:main
