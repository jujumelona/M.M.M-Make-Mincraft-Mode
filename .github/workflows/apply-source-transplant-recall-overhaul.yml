name: Apply source-transplant recall overhaul

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-source-transplant-recall-overhaul.yml'
      - 'scripts/apply_source_transplant_recall_overhaul.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dev dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply downstream recall patch
        run: python scripts/apply_source_transplant_recall_overhaul.py
      - name: Reject cardinality false-negative cutoffs
        shell: bash
        run: |
          ! grep -R "_MAX_TREE_FILES\|_MAX_SEEDS\|_MAX_CLOSURE_FILES\|_MAX_SLICE_BYTES" -n minecraft_mod_ai/source_transplant.py minecraft_mod_ai/capability_implementation_locator.py
          ! grep -n "\[:24\]" minecraft_mod_ai/source_transplant.py
          ! grep -n "max_seeds=_" minecraft_mod_ai/source_transplant.py
      - name: Compile and lint
        run: |
          python -m compileall -q minecraft_mod_ai
          python -m ruff check minecraft_mod_ai tests --select F,E7,E9
      - name: Run retrieval and reuse regressions
        run: |
          python -m pytest -q \
            tests/test_source_transplant_adaptive_retrieval.py \
            tests/test_github_adaptive_retrieval.py \
            tests/test_grounded_rag_runtime_contract.py \
            tests/test_pre_design_rag_root_cause.py
      - name: Commit verified overhaul to main
        shell: bash
        run: |
          rm scripts/apply_source_transplant_recall_overhaul.py
          rm .github/workflows/apply-source-transplant-recall-overhaul.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/source_transplant.py \
                  minecraft_mod_ai/capability_implementation_locator.py \
                  tests/test_source_transplant_adaptive_retrieval.py \
                  scripts/apply_source_transplant_recall_overhaul.py \
                  .github/workflows/apply-source-transplant-recall-overhaul.yml
          git commit -m 'refactor: remove source-transplant cardinality cutoffs'
          git push origin HEAD:main
