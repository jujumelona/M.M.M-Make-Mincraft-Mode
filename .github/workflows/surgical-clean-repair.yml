name: surgical-clean-repair

on:
  push:
    paths:
      - '.github/workflows/surgical-clean-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Restore healthy source and apply surgical cleanup
        shell: bash
        run: |
          set -euo pipefail
          BASE=6615a9e16828475bb4b27be7d915f3f4b49e7a51
          START="$(git rev-parse HEAD)"
          mkdir -p /tmp/keep
          keep=(
            minecraft_mod_ai/complete_spec.py
            minecraft_mod_ai/complete_orchestrator.py
            minecraft_mod_ai/production_contract.py
            minecraft_mod_ai/runtime_bootstrap.py
            minecraft_mod_ai/parallel_result_determinism_contract.py
            minecraft_mod_ai/model_registry.py
            minecraft_mod_ai/model_adapters/__init__.py
            minecraft_mod_ai/model_adapters/image_diffusion.py
            minecraft_mod_ai/model_router.py
            minecraft_mod_ai/planner_template_schema.py
            minecraft_mod_ai/work_graph.py
            config/model_registry.yaml
            pyproject.toml
            tests/test_clean_production_contract.py
          )
          for p in "${keep[@]}"; do
            if git cat-file -e "$START:$p" 2>/dev/null; then
              mkdir -p "/tmp/keep/$(dirname "$p")"
              git show "$START:$p" > "/tmp/keep/$p"
            fi
          done
          git restore --source="$BASE" -- minecraft_mod_ai tests config pyproject.toml
          for p in "${keep[@]}"; do
            if [ -f "/tmp/keep/$p" ]; then
              mkdir -p "$(dirname "$p")"
              cp "/tmp/keep/$p" "$p"
            fi
          done
          rm -f \
            minecraft_mod_ai/audio_generator.py \
            minecraft_mod_ai/audio_resume_efficiency_contract.py \
            minecraft_mod_ai/model_adapters/speech.py \
            minecraft_mod_ai/planner_production_page_contract.py \
            minecraft_mod_ai/production_page_durable_contract.py \
            minecraft_mod_ai/production_stream_efficiency_contract.py \
            minecraft_mod_ai/production_stream_recovery_contract.py
          rm -rf skills/generate-audio plugins/mmm-minecraft-mod-ai/skills/generate-audio

          cat > /tmp/surgical.py <<'PY'
          from __future__ import annotations
          import ast
          import re
          from pathlib import Path

          ROOT = Path.cwd()
          PKG = ROOT / 'minecraft_mod_ai'
          media_name = re.compile(r'(?:^|_)(audio|speech|voice|tts|asr)(?:_|$)', re.I)
          banned_module = re.compile(r'audio_generator|audio_resume_efficiency_contract|planner_production_page_contract|production_page_durable_contract|SpeechAdapter|speech_recognition|generate-audio|production-audio|ai_voice', re.I)

          def has_media_name(name: str) -> bool:
              return bool(media_name.search(name) or banned_module.search(name))

          def clean_imports_and_named_defs(path: Path, *, delete_media_named_functions: bool = False) -> None:
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              class Cleaner(ast.NodeTransformer):
                  def visit_Import(self, node):
                      node.names = [a for a in node.names if not has_media_name(a.name) and not has_media_name(a.asname or '')]
                      return node if node.names else None
                  def visit_ImportFrom(self, node):
                      if has_media_name(node.module or ''):
                          return None
                      node.names = [a for a in node.names if not has_media_name(a.name) and not has_media_name(a.asname or '')]
                      return node if node.names else None
                  def visit_FunctionDef(self, node):
                      if delete_media_named_functions and has_media_name(node.name):
                          return None
                      return self.generic_visit(node)
                  visit_AsyncFunctionDef = visit_FunctionDef
                  def visit_ClassDef(self, node):
                      if delete_media_named_functions and has_media_name(node.name):
                          return None
                      return self.generic_visit(node)
              tree = Cleaner().visit(tree)
              ast.fix_missing_locations(tree)
              path.write_text(ast.unparse(tree) + '\n', encoding='utf-8')

          # complete_planner: restore healthy control flow, then remove only the media lane.
          planner = PKG / 'complete_planner.py'
          tree = ast.parse(planner.read_text(encoding='utf-8'), filename=str(planner))
          class PlannerCleaner(ast.NodeTransformer):
              def visit_ImportFrom(self, node):
                  node.names = [a for a in node.names if a.name != 'AudioRequest']
                  return node if node.names else None
              def visit_AnnAssign(self, node):
                  if isinstance(node.target, ast.Name) and has_media_name(node.target.id):
                      return None
                  return self.generic_visit(node)
              def visit_FunctionDef(self, node):
                  if node.name in {'_audio', '_audio_target_path', '_expand_batches', '_expand_one_batch'} or has_media_name(node.name):
                      return None
                  node.args.args = [a for a in node.args.args if not has_media_name(a.arg)]
                  node.args.kwonlyargs = [a for a in node.args.kwonlyargs if not has_media_name(a.arg)]
                  node = self.generic_visit(node)
                  if not node.body:
                      node.body = [ast.Pass()]
                  return node
              visit_AsyncFunctionDef = visit_FunctionDef
              def visit_Assign(self, node):
                  if any(isinstance(t, ast.Name) and has_media_name(t.id) for t in node.targets):
                      return None
                  return self.generic_visit(node)
              def visit_For(self, node):
                  if isinstance(node.target, ast.Name) and has_media_name(node.target.id):
                      return None
                  node = self.generic_visit(node)
                  if not node.body: node.body = [ast.Pass()]
                  return node
              def visit_If(self, node):
                  text = ast.unparse(node.test).lower()
                  if has_media_name(text):
                      return [self.visit(x) for x in node.orelse if self.visit(x) is not None]
                  node = self.generic_visit(node)
                  if not node.body: node.body = [ast.Pass()]
                  return node
              def visit_Expr(self, node):
                  text = ast.unparse(node.value)
                  if has_media_name(text): return None
                  return self.generic_visit(node)
              def visit_Call(self, node):
                  node = self.generic_visit(node)
                  if isinstance(node.func, ast.Name) and node.func.id == '_ProductionParts' and len(node.args) == 4:
                      node.args = [node.args[0], node.args[1], node.args[3]]
                  node.keywords = [kw for kw in node.keywords if not (kw.arg and has_media_name(kw.arg))]
                  return node
              def visit_Dict(self, node):
                  pairs=[]
                  for k,v in zip(node.keys,node.values):
                      if isinstance(k, ast.Constant) and isinstance(k.value,str) and has_media_name(k.value):
                          continue
                      pairs.append((k,v))
                  node.keys=[k for k,_ in pairs]; node.values=[v for _,v in pairs]
                  return self.generic_visit(node)
          tree = PlannerCleaner().visit(tree)
          ast.fix_missing_locations(tree)
          text = ast.unparse(tree) + '\n'
          text = re.sub(
              r"\n\s*common = \{'assets', 'acceptance_tests'\}.*?(?=\n\s*(?:if|elif) set\(payload\) == \{'production_batches', 'complete', 'next_cursor'\}:)",
              '\n', text, flags=re.S,
          )
          text = text.replace("elif set(payload) == {'production_batches', 'complete', 'next_cursor'}:", "if set(payload) == {'production_batches', 'complete', 'next_cursor'}:")
          text = text.replace('Complete planner output must use production_batches, modules, or module_batches with the matching contract.', 'Complete planner output must use the host-owned production_batches contract.')
          text = text.replace('Define high-level architecture descriptors, asset requests, audio requests, and test names.', 'Define high-level architecture descriptors, asset requests, and test names.')
          # ProductionParts is now modules/assets/tests only.
          text = re.sub(r'class _ProductionParts:\n(\s+modules:.*\n\s+assets:.*\n)(?:\s+audio:.*\n)?(\s+acceptance_tests:.*)', r'class _ProductionParts:\n\1\2', text)
          compile(text, str(planner), 'exec')
          planner.write_text(text, encoding='utf-8')

          # Central research: keep visual/image/3D research, remove sound/voice research routes.
          central = PKG / 'central_research.py'
          text = central.read_text(encoding='utf-8')
          for token in (
              '        "audio",\n','        "speech_recognition",\n','        "voice_activity_detection",\n','        "speech_synthesis",\n','        "voice_adaptation",\n','        "voice_conversion",\n',
              '        "openverse_audio",\n',
          ):
              text = text.replace(token, '')
          text = re.sub(r'\n    for index, statement in enumerate\(media\["audio"\]\):.*?(?=\n    technology_kinds =)', '\n', text, flags=re.S)
          text = text.replace('Resolve the requested AI or speech pipeline without choosing a product from recency alone.', 'Resolve the requested AI pipeline without choosing a product from recency alone.')
          text = text.replace('Requested AI or speech pipeline: ', 'Requested AI pipeline: ')
          text = re.sub(r'\n    speech = \{.*?\n    ai = \{', '\n    ai = {', text, flags=re.S)
          text = text.replace('    if provider in {"openverse_images", "openverse_audio"}:\n        return "media"\n', '    if provider == "openverse_images":\n        return "media"\n')
          text = re.sub(r'\n    if kinds & speech:\n        return "speech_ai"', '', text)
          text = re.sub(r'def _requested_media_routes\(.*?\n    return routed\n', '''def _requested_media_routes(prompt: str, game_design: dict[str, Any]) -> dict[str, tuple[str, ...]]:\n    sources = [prompt.strip()]\n    sources.extend(value for path, value in _leaf_strings(game_design, "game_design") if not path.startswith("game_design.assets["))\n    matching = tuple(dict.fromkeys(source for source in sources if source and _contains_requested_media(source, family="visual")))\n    return {"visual": matching}\n''', text, flags=re.S)
          text = re.sub(r'def _contains_requested_media\(.*?\n    return any\(_contains_term\(folded, term\) for term in terms\)\n', '''def _contains_requested_media(text: str, *, family: str) -> bool:\n    if family != "visual":\n        return False\n    folded = text.casefold()\n    terms = ("visual", "texture", "sprite", "image", "icon", "pixel art", "art style", "3d model", "3d-model", "animation", "shader", "particle", "render", "gui", "ui", "시각", "텍스처", "이미지", "아이콘", "픽셀 아트", "아트 스타일", "3d 모델", "3d모델", "애니메이션", "셰이더", "파티클")\n    return any(_contains_term(folded, term) for term in terms)\n''', text, flags=re.S)
          text = re.sub(r'def _requested_technology_kinds\(prompt: str\).*?(?=\ndef _)', '''def _requested_technology_kinds(prompt: str) -> tuple[str, ...]:\n    folded = prompt.casefold()\n    requested = any(token in folded for token in (" ai ", "ai를", "ai가", "인공지능", "llm", "language model", "agent", "에이전트", "semantic memory", "임베딩")) or folded.startswith("ai ")\n    if not requested:\n        return ()\n    return ("ai_inference", "agent_tool_use", "model_runtime", "model_license", "dataset_provenance", "latency_budget", "scholarly_reference")\n\n''', text, flags=re.S)
          # Remove now-impossible media branches from provider augmentation.
          text = re.sub(r'\n    if "audio" in kinds:\n        required.append\("openverse_audio"\)', '', text)
          for quoted in ('"speech_recognition",','"voice_activity_detection",','"speech_synthesis",','"voice_adaptation",','"voice_conversion",'):
              text = text.replace('        '+quoted+'\n','')
          compile(text, str(central), 'exec')
          central.write_text(text, encoding='utf-8')

          # Remove dedicated speech/transcription methods without touching image/text adapters.
          for path in (PKG/'model_adapters/openai_compatible.py', PKG/'technology_radar.py', PKG/'quality_evidence.py'):
              if path.exists(): clean_imports_and_named_defs(path, delete_media_named_functions=True)

          # Package surface: no removed media symbols.
          init = PKG / '__init__.py'
          if init.exists(): clean_imports_and_named_defs(init, delete_media_named_functions=False)

          # Restore mixed tests, removing only tests/imports dedicated to the deleted capability.
          tests = ROOT / 'tests'
          delete_files = {
              'test_audio_generator.py','test_audio_resume_efficiency_contract.py','test_remote_speech_adapter.py',
              'test_planner_production_page_contract.py','test_production_page_durable_contract.py',
              'test_production_stream_efficiency_contract.py','test_production_stream_recovery_contract.py',
              'test_production_page_progress_contract.py',
          }
          for path in tests.glob('test_*.py'):
              if path.name in delete_files:
                  path.unlink(); continue
              if path.name == 'test_clean_production_contract.py': continue
              tree = ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
              class TestCleaner(ast.NodeTransformer):
                  def visit_ImportFrom(self,node):
                      if banned_module.search(node.module or ''): return None
                      node.names=[a for a in node.names if not has_media_name(a.name)]
                      return node if node.names else None
                  def visit_Import(self,node):
                      node.names=[a for a in node.names if not banned_module.search(a.name)]
                      return node if node.names else None
                  def visit_FunctionDef(self,node):
                      if node.name.startswith('test_') and (has_media_name(node.name) or banned_module.search(ast.unparse(node))):
                          return None
                      return self.generic_visit(node)
                  visit_AsyncFunctionDef=visit_FunctionDef
              tree=TestCleaner().visit(tree); ast.fix_missing_locations(tree)
              path.write_text(ast.unparse(tree)+'\n',encoding='utf-8')

          # Exact stale symbol in parallel determinism mixed test.
          p = tests / 'test_parallel_result_determinism_contract.py'
          if p.exists():
              t=p.read_text(encoding='utf-8')
              t=re.sub(r'(?m)^.*_normalize_synthesized_batches.*\n?', '', t)
              p.write_text(t,encoding='utf-8')
          PY
          python /tmp/surgical.py

          # Remove stale speech extras/roles after restoring baseline config.
          python - <<'PY'
          from pathlib import Path
          import yaml
          for p in (Path('config/model_registry.yaml'), Path('minecraft_mod_ai/config/model_registry.yaml')):
              if not p.exists(): continue
              data=yaml.safe_load(p.read_text(encoding='utf-8'))
              for profile in (data.get('profiles',{}) or {}).values():
                  if isinstance(profile,dict) and isinstance(profile.get('roles'),dict): profile['roles'].pop('speech_recognition',None)
              p.write_text(yaml.safe_dump(data,sort_keys=False,allow_unicode=True),encoding='utf-8')
          p=Path('pyproject.toml')
          lines=[]
          for line in p.read_text(encoding='utf-8').splitlines():
              low=line.strip().lower()
              if low.startswith('speech =') or low.startswith('production-audio =') or 'speech_recognition' in low or 'whisper' in low: continue
              lines.append(line)
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

          python -m compileall -q minecraft_mod_ai tests tools download_resources.py
          python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9 --fix
          python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9
          python -m vulture minecraft_mod_ai tools download_resources.py --min-confidence 100
          python -m pytest -q tests/test_clean_production_contract.py tests/test_research_coordinator.py tests/test_agentic_search_efficiency_contract.py tests/test_parallel_result_determinism_contract.py
          git diff --check
          test -f minecraft_mod_ai/model_adapters/image_diffusion.py
          test -f minecraft_mod_ai/blockbench_client.py
          grep -q 'FLUX.2-klein-4B' config/model_registry.yaml
          grep -q 'build_batch_skeleton' minecraft_mod_ai/complete_planner.py
          grep -q 'merge_model_output_into_skeleton' minecraft_mod_ai/complete_planner.py
          ! grep -q 'def _expand_batches' minecraft_mod_ai/complete_planner.py
          ! grep -q 'def _expand_one_batch' minecraft_mod_ai/complete_planner.py
          ! grep -q 'module_batches' minecraft_mod_ai/complete_planner.py
          ! git grep -n -E 'AudioRequest|audio_generator|audio_resume_efficiency_contract|planner_production_page_contract|production_page_durable_contract|SpeechAdapter|speech_recognition|generate-audio|production-audio|ai_voice' -- minecraft_mod_ai config pyproject.toml tests
      - name: Commit only against unchanged latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'main moved; refusing stale repair' >&2
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/surgical-clean-repair.yml
          git add -A
          git commit -m 'refactor: surgically restore clean production paths'
          git push origin HEAD:main
