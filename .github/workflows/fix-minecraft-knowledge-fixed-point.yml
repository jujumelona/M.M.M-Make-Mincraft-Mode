name: Fix Minecraft knowledge fixed-point coverage

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-minecraft-knowledge-fixed-point.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply route-coverage fix
        run: python .github/scripts/fix_minecraft_knowledge_fixed_point.py
      - name: Install test dependencies
        run: python -m pip install -q -e '.[dev]'
      - name: Static validation
        run: python -m ruff check minecraft_mod_ai/minecraft_knowledge_contract.py tests/test_minecraft_knowledge_contract.py --select F,E7,E9
      - name: Focused regression tests
        run: python -m pytest -q tests/test_minecraft_knowledge_contract.py tests/test_agentic_research_game_design.py tests/test_agentic_pre_design_rag.py
      - name: Commit validated fix and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-minecraft-knowledge-fixed-point.yml
          rm .github/scripts/fix_minecraft_knowledge_fixed_point.py
          git add -A
          git diff --cached --check
          git commit -m "Allow terminal research gaps without route deadlock"
          git pull --rebase origin main
          git push origin HEAD:main
