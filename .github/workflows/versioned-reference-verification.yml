name: Versioned Reference Verification

on:
  push:
    paths:
      - '.github/workflows/versioned-reference-verification.yml'

permissions:
  contents: read

jobs:
  verify-versioned-reference:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Verify exact-version reference system
        run: python -m pytest -q tests/test_versioned_mod_reference_resolution.py
