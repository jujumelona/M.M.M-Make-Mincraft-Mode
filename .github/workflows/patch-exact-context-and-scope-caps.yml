name: Exact Context And Scope Cap Removal

on:
  push:
    paths:
      - .github/workflows/patch-exact-context-and-scope-caps.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply exact context and scope cap patch
        run: python tools/one_shot_exact_context_scope_caps.py
      - name: Verify focused contracts
        run: |
          python -m pip install --prefer-binary -e '.[dev]'
          python -m ruff check --fix --ignore TRY004 minecraft_mod_ai/progress_aware_tool_loop.py minecraft_mod_ai/model_context_budget.py minecraft_mod_ai/llama_context_safety_contract.py minecraft_mod_ai/authored_scope_research_contract.py minecraft_mod_ai/production_boundary_contract.py tests/test_agent_context_window_contract.py
          python -m py_compile minecraft_mod_ai/progress_aware_tool_loop.py minecraft_mod_ai/model_context_budget.py minecraft_mod_ai/llama_context_safety_contract.py minecraft_mod_ai/authored_scope_research_contract.py minecraft_mod_ai/production_boundary_contract.py
          python -m ruff check --ignore TRY004 minecraft_mod_ai/progress_aware_tool_loop.py minecraft_mod_ai/model_context_budget.py minecraft_mod_ai/llama_context_safety_contract.py minecraft_mod_ai/authored_scope_research_contract.py minecraft_mod_ai/production_boundary_contract.py tests/test_agent_context_window_contract.py
          python -m pytest -q tests/test_agent_context_window_contract.py tests/test_llama_context_safety_contract.py tests/test_authored_scope_research_contract.py tests/test_production_boundary_contract.py
      - name: Commit production and tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add minecraft_mod_ai/progress_aware_tool_loop.py minecraft_mod_ai/model_context_budget.py minecraft_mod_ai/llama_context_safety_contract.py minecraft_mod_ai/authored_scope_research_contract.py minecraft_mod_ai/production_boundary_contract.py tests/test_agent_context_window_contract.py
          git diff --cached --check
          git commit -m 'fix: remove arbitrary context and scope caps'
          git push origin HEAD:main
