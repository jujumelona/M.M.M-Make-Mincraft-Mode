name: Exact Context And Scope Cap Removal

on:
  push:
    paths:
      - .github/workflows/patch-exact-context-and-scope-caps.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Remove exact-context and scope truncation caps
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Exact llama recovery: after a real context-pressure signal, choose the
          # largest deterministic compaction candidate that preserves a useful live
          # output reserve. There is no fixed 40 KiB downgrade for exact-accounting adapters.
          path = Path('minecraft_mod_ai/progress_aware_tool_loop.py')
          text = path.read_text(encoding='utf-8')
          anchor = '\ndef _generate_turn_with_context_recovery(\n'
          helper = r'''

def _exact_context_recovery_candidate(
    messages: Sequence[Mapping[str, Any]],
    *,
    turn_request: GenerationRequest,
    exact_accounting: Any,
    config: Any,
    tools: Sequence[Any],
) -> tuple[tuple[Mapping[str, Any], ...], dict[str, int]] | None:
    """Pick the largest protocol-safe retry that live token accounting can sustain.

    This runs only after the backend has reported real context pressure. Candidate
    budgets are fractions of the active host/runtime budget, not a product-size cap.
    The first candidate with a full normal output reserve wins; otherwise the
    largest candidate with any positive live output space is retained.
    """

    base_budget = max(1, int(request_message_budget(config, tools)))
    numerators = (8, 7, 6, 5, 4, 3, 2, 1)
    budgets = tuple(dict.fromkeys(max(1, base_budget * value // 8) for value in numerators))
    original = tuple(messages)
    fallback: tuple[tuple[Mapping[str, Any], ...], dict[str, int]] | None = None

    for budget in budgets:
        candidate = tuple(emergency_fit_messages(original, budget_bytes=budget))
        if candidate == original:
            continue
        accounting = exact_accounting(replace(turn_request, messages=candidate))
        input_tokens = int(accounting.input_tokens)
        context_tokens = int(accounting.context_tokens)
        remaining_tokens = context_tokens - input_tokens
        if remaining_tokens <= 0:
            continue
        receipt = {
            "budget_bytes": budget,
            "input_tokens": input_tokens,
            "context_tokens": context_tokens,
            "remaining_tokens": remaining_tokens,
        }
        if fallback is None:
            fallback = (candidate, receipt)
        configured_output = max(1, int(getattr(config, "max_new_tokens", 0) or 1))
        desired_reserve = min(configured_output, max(1, context_tokens // 4))
        if remaining_tokens >= desired_reserve:
            return candidate, receipt
    return fallback
'''
          if '_exact_context_recovery_candidate(' not in text:
              if anchor not in text:
                  raise SystemExit('context recovery insertion anchor missing')
              text = text.replace(anchor, helper + anchor, 1)

          old = '''        emergency_budget = min(\n            40 * 1024,\n            request_message_budget(config, request.tools),\n        )\n        emergency = emergency_fit_messages(\n            messages,\n            budget_bytes=emergency_budget,\n        )\n        if not _replace_live_messages(messages, emergency):\n            mark_context_recovery_exhausted(exc)\n            raise\n        retry_request = replace(\n            turn_request,\n            messages=tuple(messages),\n            media_paths=media_paths,\n        )\n        print(\n            "agent context: deterministic overflow recovery",\n            f"messages={len(messages)}",\n            f"budget_bytes={emergency_budget}",\n            flush=True,\n        )\n'''
          new = '''        recovery_receipt: dict[str, int] = {}\n        if callable(exact_accounting):\n            exact_recovery = _exact_context_recovery_candidate(\n                messages,\n                turn_request=turn_request,\n                exact_accounting=exact_accounting,\n                config=config,\n                tools=request.tools,\n            )\n            if exact_recovery is None:\n                mark_context_recovery_exhausted(exc)\n                raise\n            emergency, recovery_receipt = exact_recovery\n        else:\n            active_budget = max(1, request_message_budget(config, request.tools))\n            emergency_budget = max(1, active_budget * 3 // 4)\n            emergency = emergency_fit_messages(\n                messages,\n                budget_bytes=emergency_budget,\n            )\n            recovery_receipt = {"budget_bytes": emergency_budget}\n        if not _replace_live_messages(messages, emergency):\n            mark_context_recovery_exhausted(exc)\n            raise\n        retry_request = replace(\n            turn_request,\n            messages=tuple(messages),\n            media_paths=media_paths,\n        )\n        print(\n            "agent context: deterministic overflow recovery",\n            f"messages={len(messages)}",\n            *(f"{key}={value}" for key, value in recovery_receipt.items()),\n            flush=True,\n        )\n'''
          if old not in text:
              raise SystemExit('legacy 40KiB recovery block missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # 2) Canonical emergency packer no longer has a hidden 40KiB default.
          path = Path('minecraft_mod_ai/model_context_budget.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '    budget_bytes: int = 40 * 1024,\n',
              '    budget_bytes: int | None = None,\n',
              1,
          )
          text = text.replace(
              '    budget = max(_MIN_CONTEXT_BYTES, min(_MAX_CONTEXT_BYTES, int(budget_bytes)))\n',
              '    requested_budget = _MAX_CONTEXT_BYTES if budget_bytes is None else int(budget_bytes)\n'
              '    budget = max(_MIN_CONTEXT_BYTES, min(_MAX_CONTEXT_BYTES, requested_budget))\n',
              1,
          )
          path.write_text(text, encoding='utf-8')

          # The installed hard-capacity guard mirrors the canonical optional budget.
          path = Path('minecraft_mod_ai/llama_context_safety_contract.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '            budget_bytes: int = 40 * 1024,\n',
              '            budget_bytes: int | None = None,\n',
              1,
          )
          old = '''            exact_budget = max(\n                1,\n                min(int(context_module._MAX_CONTEXT_BYTES), int(budget_bytes)),\n            )\n'''
          new = '''            requested_budget = (\n                int(context_module._MAX_CONTEXT_BYTES)\n                if budget_bytes is None\n                else int(budget_bytes)\n            )\n            exact_budget = max(\n                1,\n                min(int(context_module._MAX_CONTEXT_BYTES), requested_budget),\n            )\n'''
          if old not in text:
              raise SystemExit('context safety emergency default block missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # 3) Preserve every host-approved authored research query. Deduplication remains.
          path = Path('minecraft_mod_ai/authored_scope_research_contract.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('"search_queries": queries[:5],', '"search_queries": queries,', 1)
          text = text.replace('"research_queries": queries[:5],', '"research_queries": queries,', 1)
          path.write_text(text, encoding='utf-8')

          # 4) Preserve every acceptance ref after canonical dedupe. Coverage must never
          # silently lose an approved acceptance condition merely because it is fourth+.
          path = Path('minecraft_mod_ai/production_boundary_contract.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'group["acceptance_refs"] = list(dict.fromkeys(refs))[:3]',
              'group["acceptance_refs"] = list(dict.fromkeys(refs))',
              1,
          )
          path.write_text(text, encoding='utf-8')

          # Focused regression: exact recovery must prefer the largest live-safe candidate
          # and preserve a normal output reserve instead of forcing a 40KiB byte cap.
          path = Path('tests/test_agent_context_window_contract.py')
          text = path.read_text(encoding='utf-8')
          addition = r'''

def test_exact_context_recovery_uses_live_tokens_not_fixed_40k(monkeypatch) -> None:
    original = (
        {"role": "system", "content": "s" * 100},
        {"role": "user", "content": "u" * 100},
        {"role": "assistant", "content": "a" * 100},
    )
    seen_budgets: list[int] = []

    def fake_emergency(messages, *, budget_bytes):
        seen_budgets.append(int(budget_bytes))
        marker = max(1, int(budget_bytes))
        return (*tuple(messages[:2]), {"role": "system", "content": f"budget={marker}"})

    class Accounting:
        def __init__(self, input_tokens: int):
            self.input_tokens = input_tokens
            self.context_tokens = 32_768

    def exact(request):
        marker = int(str(request.messages[-1]["content"]).split("=")[-1])
        # Only candidates at or below 75% leave the full 8192-token output reserve.
        return Accounting(20_000 if marker <= 72 * 1024 else 30_000)

    monkeypatch.setattr(tool_loop, "request_message_budget", lambda config, tools: 96 * 1024)
    monkeypatch.setattr(tool_loop, "emergency_fit_messages", fake_emergency)
    request = GenerationRequest(messages=original)
    recovered = tool_loop._exact_context_recovery_candidate(
        original,
        turn_request=request,
        exact_accounting=exact,
        config=_config(),
        tools=(),
    )
    assert recovered is not None
    candidate, receipt = recovered
    assert receipt["budget_bytes"] == 72 * 1024
    assert receipt["remaining_tokens"] == 12_768
    assert "budget=73728" in str(candidate[-1]["content"])
    assert seen_budgets[:3] == [96 * 1024, 84 * 1024, 72 * 1024]
'''
          if 'test_exact_context_recovery_uses_live_tokens_not_fixed_40k' not in text:
              text += addition
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify focused contracts
        run: |
          python -m pip install --prefer-binary -e '.[dev]'
          python -m ruff check --fix \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            minecraft_mod_ai/model_context_budget.py \
            minecraft_mod_ai/llama_context_safety_contract.py \
            minecraft_mod_ai/authored_scope_research_contract.py \
            minecraft_mod_ai/production_boundary_contract.py \
            tests/test_agent_context_window_contract.py
          python -m py_compile \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            minecraft_mod_ai/model_context_budget.py \
            minecraft_mod_ai/llama_context_safety_contract.py \
            minecraft_mod_ai/authored_scope_research_contract.py \
            minecraft_mod_ai/production_boundary_contract.py
          python -m ruff check \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            minecraft_mod_ai/model_context_budget.py \
            minecraft_mod_ai/llama_context_safety_contract.py \
            minecraft_mod_ai/authored_scope_research_contract.py \
            minecraft_mod_ai/production_boundary_contract.py \
            tests/test_agent_context_window_contract.py
          python -m pytest -q \
            tests/test_agent_context_window_contract.py \
            tests/test_llama_context_safety_contract.py \
            tests/test_authored_scope_research_contract.py \
            tests/test_production_boundary_contract.py
      - name: Commit production and tests
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            minecraft_mod_ai/model_context_budget.py \
            minecraft_mod_ai/llama_context_safety_contract.py \
            minecraft_mod_ai/authored_scope_research_contract.py \
            minecraft_mod_ai/production_boundary_contract.py \
            tests/test_agent_context_window_contract.py
          git diff --cached --check
          git commit -m 'fix: remove arbitrary context and scope caps'
          git push origin HEAD:main
