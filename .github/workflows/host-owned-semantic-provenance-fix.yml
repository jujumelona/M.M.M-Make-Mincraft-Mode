name: One-shot host-owned semantic provenance fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/host-owned-semantic-provenance-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply host-owned provenance fix
        run: python .github/scripts/fix_host_owned_semantic_provenance.py
      - name: Verify semantic authority
        run: |
          python -m pytest -q tests/test_semantic_requirement_authority.py
          python -m compileall -q minecraft_mod_ai
      - name: Commit fix directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft_mod_ai/semantic_requirement_authority.py tests/test_semantic_requirement_authority.py
          git rm .github/scripts/fix_host_owned_semantic_provenance.py
          git rm .github/workflows/host-owned-semantic-provenance-fix.yml
          git commit -m "fix: make semantic source provenance host-owned"
          git push origin HEAD:main
