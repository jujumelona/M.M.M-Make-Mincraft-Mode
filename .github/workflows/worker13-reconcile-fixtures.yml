name: Worker13 reconcile provider fixtures

on:
  push:
    paths:
      - '.github/workflows/worker13-reconcile-fixtures.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dev dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Reconcile synthetic provider evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/conftest.py')
          text = path.read_text(encoding='utf-8')
          old = '''        gradle="test-gradle",
        gradle_sha256="0" * 64,
'''
          new = '''        gradle="8.10.2",
        gradle_sha256="0" * 64,
'''
          if old not in text:
              raise SystemExit('expected synthetic Gradle fixture not found')
          text = text.replace(old, new, 1)

          old = '''        deterministic_module_kinds=MODULE_KINDS,
'''
          new = '''        deterministic_module_kinds=frozenset((
            *MODULE_KINDS,
            "system-pack:quest-system",
            "system-pack:class-skill-system",
            "system-pack:economy-shop",
            "system-pack:gui-networking",
            "system-pack:party-guild",
            "geckolib:entity",
            "geckolib:version:4.8.2",
        )),
'''
          if old not in text:
              raise SystemExit('expected synthetic capability fixture not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Targeted regression
        run: |
          python -m pytest -q \
            tests/test_content_catalog_scaling.py \
            tests/test_complete_production.py::test_geckolib_generator_accumulates_real_entity_bindings \
            tests/test_complete_production.py::test_complete_orchestrator_source_only_connects_all_generators \
            tests/test_fail_closed_production.py::test_builtin_quest_rejects_unimplemented_objective \
            tests/test_fail_closed_production.py::test_builtin_shop_requires_server_owned_catalog \
            tests/test_fail_closed_production.py::test_gui_networking_generation_is_read_only_and_replay_safe \
            tests/test_fail_closed_production.py::test_manual_quest_progress_targets_only_requested_id \
            tests/test_scalable_production.py::test_shop_uses_server_owned_catalog_and_not_player_supplied_price
      - name: Commit verified fixture reconciliation
        run: |
          git config user.name 'MMM Worker 13'
          git config user.email 'worker13@users.noreply.github.com'
          git rm .github/workflows/worker13-reconcile-fixtures.yml
          git add tests/conftest.py
          git commit -m 'test: bind synthetic provider to explicit capabilities'
          git pull --ff-only origin main
          git push origin HEAD:main
