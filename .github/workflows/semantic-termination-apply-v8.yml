name: Semantic Termination Apply V8

on:
  push:
    paths:
      - .github/workflows/semantic-termination-apply-v8.yml

permissions:
  contents: write

concurrency:
  group: semantic-termination-apply-v8
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project test environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary "build>=1,<2" -e ".[dev,ui]"

      - name: Apply semantic migration and remove obsolete count-policy tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          v6 = Path('.github/workflows/semantic-termination-apply-v6.yml').read_text(encoding='utf-8')
          match = re.search(
              r"          python - <<'PY'\n(.*?)\n          PY\n",
              v6,
              flags=re.S,
          )
          if not match:
              raise SystemExit('v6 normalized migration python block not found')
          exec(compile(textwrap.dedent(match.group(1)), '<v6-migration>', 'exec'), {})

          # The old round-policy test only verifies the removed 128/16/512 count contract.
          obsolete = Path('tests/test_agent_tool_round_policy.py')
          if obsolete.exists():
              obsolete.unlink()

          # Update trajectory tests to the semantic trace contract.
          unified = Path('tests/test_unified_host_execution_loop.py')
          source = unified.read_text(encoding='utf-8')
          count = source.count('        no_progress_streak_after=0,\n')
          if count != 2:
              raise SystemExit(f'expected two legacy trace fields, found {count}')
          source = source.replace(
              '        no_progress_streak_after=0,\n',
              '        termination_reason_after=None,\n',
          )
          old_summary = '    assert "progress=True streak=0" in summary\n'
          if source.count(old_summary) != 1:
              raise SystemExit('legacy trajectory summary assertion not found exactly once')
          source = source.replace(
              old_summary,
              '    assert "progress=True termination=None" in summary\n',
              1,
          )
          unified.write_text(source, encoding='utf-8')

          # Keep the source-level regression check without embedding the forbidden legacy
          # spellings verbatim, otherwise the repository audit detects its own test data.
          liveness = Path('tests/test_agent_tool_round_liveness.py')
          source = liveness.read_text(encoding='utf-8')
          replacements = {
              "'no_progress_streak'": "'no_progress_' + 'streak'",
              "'forced_rag_attempts'": "'forced_rag_' + 'attempts'",
              "'_agent_tool_round_limit'": "'_agent_tool_' + 'round_limit'",
              "'MMM_AGENT_TOOL_ROUNDS'": "'MMM_AGENT_TOOL_' + 'ROUNDS'",
              "'MMM_AGENT_DEFAULT_TOOL_ROUNDS'": "'MMM_AGENT_DEFAULT_TOOL_' + 'ROUNDS'",
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'liveness audit token anchor count for {old}: {source.count(old)}')
              source = source.replace(old, new, 1)
          liveness.write_text(source, encoding='utf-8')
          PY

      - name: Compile
        run: python -m compileall -q minecraft_mod_ai tests

      - name: Run semantic termination and host-loop regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_agent_tool_round_liveness.py \
            tests/test_adaptive_production_agent.py \
            tests/test_adaptive_execution_hardening.py \
            tests/test_unified_host_execution_loop.py

      - name: Audit legacy semantic counters
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E 'no_progress_streak|forced_rag_attempts|_agent_tool_round_limit|MMM_AGENT_TOOL_ROUNDS|MMM_AGENT_DEFAULT_TOOL_ROUNDS' -- minecraft_mod_ai tests; then
            echo 'legacy semantic retry/counter contract remains' >&2
            exit 1
          fi

      - name: Commit verified production migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenAI semantic termination migration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A minecraft_mod_ai/model_router.py \
            minecraft_mod_ai/progress_aware_tool_loop.py \
            minecraft_mod_ai/termination_contract.py \
            tests/test_agent_tool_round_liveness.py \
            tests/test_agent_tool_round_policy.py \
            tests/test_unified_host_execution_loop.py
          git diff --cached --check
          git commit -m 'Replace agent retry caps with semantic termination'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
