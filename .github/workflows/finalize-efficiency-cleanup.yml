name: Finalize runtime efficiency cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-efficiency-cleanup.yml

permissions:
  contents: write

concurrency:
  group: mmm-finalize-efficiency-cleanup
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch remaining cold-start reload and remove temporary workflows
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          decode_path = Path('minecraft_mod_ai/llama_decode_speed_contract.py')
          text = decode_path.read_text(encoding='utf-8')

          pattern = re.compile(r'def _probe_p_min\(.*?\n\ndef _kv_scan_candidates\(', re.S)
          match = pattern.search(text)
          if not match:
              raise SystemExit('could not locate _probe_p_min block')

          replacement = '''def _probe_p_min(\n    autotune: Any,\n    binary: str,\n    model_path: str,\n    config: Any,\n    request: Any,\n    selected: Any,\n    *,\n    baseline_probe: Any | None = None,\n):\n    if str(getattr(selected, "spec_type", "none")) != "draft-mtp":\n        return _as_speed_variant(selected), ()\n    candidates = _mtp_p_min_candidates()\n    if len(candidates) <= 1:\n        return _as_speed_variant(selected), ()\n\n    probes: list[Any] = []\n    baseline = baseline_probe if bool(getattr(baseline_probe, "ok", False)) else None\n    pending = candidates\n    if baseline is not None:\n        # p_min=0 is exactly the already-selected MTP runtime probe. Reuse it instead\n        # of reloading the same GGUF/server once more just to reproduce the baseline.\n        probes.append(baseline)\n        pending = tuple(value for value in candidates if value != 0.0)\n\n    bench_request = autotune._compact_benchmark_request(request)\n    probe_tokens = min(\n        int(config.max_new_tokens),\n        autotune._env_int(\n            "MMM_LLAMA_AUTOTUNE_TOKENS", autotune._BENCHMARK_OUTPUT_TOKENS\n        ),\n    )\n    preferred_port = autotune._env_int("MMM_LLAMA_AUTOTUNE_PORT", 18910)\n    for p_min in pending:\n        base = _as_speed_variant(selected, draft_p_min=p_min)\n        root_name = base.name.split("|pm", 1)[0]\n        variant = replace(\n            base,\n            name=root_name if p_min == 0 else f"{root_name}|pm{p_min:g}",\n        )\n        process = None\n        started = time.perf_counter()\n        try:\n            port = autotune._free_port(preferred_port)\n            process = autotune._start_server(binary, model_path, config, variant, port)\n            url = autotune._wait_ready(process, port)\n            autotune._probe_server(url, bench_request, max_tokens=1, variant=variant)\n            probe = autotune._probe_server(\n                url, bench_request, max_tokens=probe_tokens, variant=variant\n            )\n        except Exception as exc:\n            probe = autotune.ProbeResult(\n                variant=variant,\n                ok=False,\n                output_sha256="",\n                predicted_tokens=0,\n                predicted_tps=0.0,\n                prompt_tps=0.0,\n                elapsed_seconds=time.perf_counter() - started,\n                error=f"{type(exc).__name__}: {exc}",\n            )\n        finally:\n            autotune._stop_server(process)\n        probes.append(probe)\n        if baseline is None and p_min == 0.0 and bool(getattr(probe, "ok", False)):\n            baseline = probe\n\n    if baseline is None or not bool(getattr(baseline, "ok", False)):\n        return _as_speed_variant(selected), tuple(probes)\n    valid = [\n        probe\n        for probe in probes\n        if bool(getattr(probe, "ok", False))\n        and str(getattr(probe, "output_sha256", ""))\n        == str(getattr(baseline, "output_sha256", ""))\n        and float(getattr(probe, "predicted_tps", 0.0)) > 0\n    ]\n    if not valid:\n        return _as_speed_variant(selected), tuple(probes)\n    best = max(valid, key=lambda probe: float(getattr(probe, "predicted_tps", 0.0)))\n    minimum_gain = autotune._env_float("MMM_LLAMA_STAGE_MIN_GAIN", 1.01)\n    if best is not baseline and _decode_ratio(best, baseline) < max(1.0, minimum_gain):\n        best = baseline\n    return _as_speed_variant(best.variant), tuple(probes)\n\n\ndef _kv_scan_candidates('''
          text = text[:match.start()] + replacement + text[match.end():]

          old_call = '''            selected, extra_probes = _probe_p_min(\n                autotune,\n                binary,\n                model_path,\n                config,\n                request,\n                decision.selected,\n            )\n'''
          new_call = '''            selected_baseline_probe = next(\n                (\n                    probe\n                    for probe in reversed(decision.probes)\n                    if bool(getattr(probe, "ok", False))\n                    and str(getattr(getattr(probe, "variant", None), "spec_type", "none"))\n                    == str(getattr(decision.selected, "spec_type", "none"))\n                    and int(getattr(getattr(probe, "variant", None), "draft_n_max", 0) or 0)\n                    == int(getattr(decision.selected, "draft_n_max", 0) or 0)\n                    and float(getattr(getattr(probe, "variant", None), "draft_p_min", 0.0) or 0.0)\n                    == 0.0\n                ),\n                None,\n            )\n            selected, extra_probes = _probe_p_min(\n                autotune,\n                binary,\n                model_path,\n                config,\n                request,\n                decision.selected,\n                baseline_probe=selected_baseline_probe,\n            )\n'''
          if text.count(old_call) != 1:
              raise SystemExit(f'p_min call shape changed: found {text.count(old_call)}')
          text = text.replace(old_call, new_call, 1)
          decode_path.write_text(text, encoding='utf-8')

          # Completed/failed diagnostic jobs are not part of the production CI surface.
          for raw in (
              '.github/workflows/apply-max-llama-decode.yml',
              '.github/workflows/full-code-audit.yml',
              '.github/workflows/verify-final-efficiency.yml',
          ):
              Path(raw).unlink(missing_ok=True)
          PY
      - name: Verify all four efficiency changes without dependency installation
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          decode = Path('minecraft_mod_ai/llama_decode_speed_contract.py').read_text(encoding='utf-8')
          ast.parse(decode)
          assert 'baseline_probe: Any | None = None' in decode
          assert 'pending = tuple(value for value in candidates if value != 0.0)' in decode
          assert 'baseline_probe=selected_baseline_probe' in decode
          assert 'MMM_LLAMA_KV_AUTOTUNE", False' in decode
          assert '"0,0.8"' in decode

          runtime = Path('minecraft_mod_ai/llama_server_runtime_tuning.py').read_text(encoding='utf-8')
          ast.parse(runtime)
          assert '_mmm_adaptive_cold_search' in runtime
          assert 'mtp_values' in runtime and 'ngram_values' in runtime
          assert 'if _model_supports_mtp(config) and spec is baseline and ngram_values' in runtime

          setup = Path('tools/colab_runtime_setup.py').read_text(encoding='utf-8')
          ast.parse(setup)
          assert '_project_install_fingerprint' in setup
          assert 'receipt hit; pip skipped' in setup

          bootstrap = Path('minecraft_mod_ai/runtime_bootstrap.py').read_text(encoding='utf-8')
          pipeline = Path('minecraft_mod_ai/llama_tuning_pipeline.py').read_text(encoding='utf-8')
          ast.parse(bootstrap); ast.parse(pipeline)
          assert 'install_native_llama_tuning_pipeline(' in bootstrap
          for obsolete in ('install_llama_efficiency(', 'install_llama_runtime_tuning(', 'install_llama_cache_reuse(', 'install_llama_decode_speed('):
              assert obsolete not in bootstrap
          expected = ('hardware', 'efficiency', 'runtime', 'cache-reuse', 'decode-speed')
          positions = [pipeline.index(f'"{name}"') for name in expected]
          assert positions == sorted(positions)

          workflows = {p.name for p in Path('.github/workflows').glob('*.yml')}
          expected_workflows = {
              'build-native-llama-cuda-all.yml',
              'build-native-llama-cuda.yml',
              'ci.yml',
              'production-integration.yml',
              'finalize-efficiency-cleanup.yml',
          }
          assert workflows == expected_workflows, workflows
          PY
      - name: Commit final cleanup and self-delete
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-efficiency-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish all four runtime efficiency fixes'
          git pull --rebase origin main
          git push origin HEAD:main
