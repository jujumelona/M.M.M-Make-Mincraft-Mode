name: Worker 02 Final Verify

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/worker02-final-verify.yml"
      - "docs/parallel_progress/worker-02.md"
      - "minecraft_mod_ai/pre_design_rag_quality_contract.py"
      - "minecraft_mod_ai/pre_design_rag_fusion.py"
      - "minecraft_mod_ai/pre_design_rag_corrective.py"
      - "minecraft_mod_ai/pre_design_rag_support.py"
      - "minecraft_mod_ai/pre_design_research_pipeline.py"
      - "minecraft_mod_ai/pre_design_domain_research.py"
      - "minecraft_mod_ai/research_grounded_rag_contract.py"
      - "minecraft_mod_ai/github_adaptive_retrieval.py"
      - "tests/test_research_grounded_rag_contract.py"
      - "tests/test_pre_design_rag_quality_contract.py"
      - "tests/test_worker02_rag_source_evidence_contract.py"
      - "tests/test_worker02_rag_clean_code_regressions.py"
      - "tests/test_pre_design_requirement_evidence_sufficiency.py"

concurrency:
  group: worker02-final-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  worker02-final-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and verification tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest tomli ruff

      - name: Compile Worker 02 surfaces
        run: |
          python -m compileall -q \
            minecraft_mod_ai/pre_design_rag_quality_contract.py \
            minecraft_mod_ai/pre_design_rag_fusion.py \
            minecraft_mod_ai/pre_design_rag_corrective.py \
            minecraft_mod_ai/pre_design_rag_support.py \
            minecraft_mod_ai/pre_design_research_pipeline.py \
            minecraft_mod_ai/pre_design_domain_research.py \
            minecraft_mod_ai/research_grounded_rag_contract.py \
            minecraft_mod_ai/github_adaptive_retrieval.py \
            tests/test_research_grounded_rag_contract.py \
            tests/test_pre_design_rag_quality_contract.py \
            tests/test_worker02_rag_source_evidence_contract.py \
            tests/test_worker02_rag_clean_code_regressions.py \
            tests/test_pre_design_requirement_evidence_sufficiency.py

      - name: Ruff Worker 02 surfaces
        run: >
          python -m ruff check
          minecraft_mod_ai/pre_design_rag_quality_contract.py
          minecraft_mod_ai/pre_design_rag_fusion.py
          minecraft_mod_ai/pre_design_rag_corrective.py
          minecraft_mod_ai/pre_design_rag_support.py
          minecraft_mod_ai/pre_design_research_pipeline.py
          minecraft_mod_ai/pre_design_domain_research.py
          minecraft_mod_ai/research_grounded_rag_contract.py
          minecraft_mod_ai/github_adaptive_retrieval.py
          tests/test_research_grounded_rag_contract.py
          tests/test_pre_design_rag_quality_contract.py
          tests/test_worker02_rag_source_evidence_contract.py
          tests/test_worker02_rag_clean_code_regressions.py
          tests/test_pre_design_requirement_evidence_sufficiency.py
          --select F,E7,E9

      - name: Run Worker 02 regressions
        run: >
          python -m pytest -q
          tests/test_research_grounded_rag_contract.py
          tests/test_pre_design_rag_quality_contract.py
          tests/test_worker02_rag_source_evidence_contract.py
          tests/test_worker02_rag_clean_code_regressions.py
          tests/test_pre_design_requirement_evidence_sufficiency.py
