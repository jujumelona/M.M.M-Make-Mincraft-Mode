name: One-shot planner requirement integrity fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one_shot_requirement_integrity_fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply planner integrity patch
        run: python .github/scripts/one_shot_requirement_integrity_fix.py
      - name: Compile and run focused regressions
        run: |
          python -m py_compile minecraft_mod_ai/agentic_research_game_design.py tests/test_agentic_design_requirement_integrity.py
          python -m pytest -q tests/test_agentic_design_requirement_integrity.py tests/test_agentic_design_meta_fallback.py
      - name: Commit fix directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft_mod_ai/agentic_research_game_design.py tests/test_agentic_design_requirement_integrity.py
          git commit -m "fix: enforce planner requirement authority across fields"
          git push origin HEAD:main
