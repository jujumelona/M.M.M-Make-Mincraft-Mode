name: Sync generated Skill catalog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package tooling
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Restore missing canonical Skill sources
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from minecraft_mod_ai.skill_catalog import CANONICAL_SKILLS

          payload = json.loads(Path('minecraft_mod_ai/packaged_skills.json').read_text(encoding='utf-8'))
          skills = payload.get('skills', {})
          for name in CANONICAL_SKILLS:
              text = skills.get(name)
              if not isinstance(text, str) or not text.strip():
                  raise SystemExit(f'packaged snapshot cannot restore canonical Skill: {name}')
              target = Path('skills') / name / 'SKILL.md'
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(text if text.endswith('\n') else text + '\n', encoding='utf-8')
          PY
      - name: Generate canonical Skill snapshot
        run: python tools/package_skills.py
      - name: Commit restored and generated Skill files if changed
        run: |
          if git diff --quiet -- skills minecraft_mod_ai/packaged_skills.json plugins/mmm-minecraft-mod-ai/skills; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills minecraft_mod_ai/packaged_skills.json plugins/mmm-minecraft-mod-ai/skills
          git commit -m 'Restore and sync canonical Skill sources'
          git push origin HEAD:main
