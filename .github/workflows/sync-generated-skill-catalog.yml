name: Sync generated Skill catalog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package tooling
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Generate canonical Skill snapshot
        run: python tools/package_skills.py
      - name: Commit generated snapshot if changed
        run: |
          if git diff --quiet -- minecraft_mod_ai/packaged_skills.json plugins/mmm-minecraft-mod-ai/skills; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/packaged_skills.json plugins/mmm-minecraft-mod-ai/skills
          git commit -m 'Sync generated Skill catalog'
          git push origin HEAD:main
