name: Sync generated Skill catalog

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Restore canonical Skill sources and registry
        run: |
          git fetch --no-tags --depth=1 origin 39011b3c091c9a0524a07c3b5a8e077372e160ad
          git checkout 39011b3c091c9a0524a07c3b5a8e077372e160ad -- skills
          python - <<'PY'
          from pathlib import Path
          path = Path('minecraft_mod_ai/skill_catalog.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('CANONICAL_SKILLS =')
          end = text.index('REQUIRED_SECTIONS =', start)
          replacement = """CANONICAL_SKILLS = ('intake-mod-brief', 'research-minecraft-evidence', 'plan-game-design', 'freeze-approved-spec', 'inspect-existing-project', 'generate-fabric-core', 'generate-datagen', 'generate-worldgen', 'generate-geckolib-entity', 'generate-quest-progression', 'generate-gui-networking', 'generate-textures', 'model-with-blockbench', 'compile-and-repair', 'runtime-playtest', 'visual-review', 'release-security', 'execute-complete-production', 'patch-existing-project', 'publish-release', 'compile-massive-work-graph', 'gather-adaptive-minecraft-evidence', 'ground-production-with-live-evidence', 'resume-production-run', 'route-generic-game-research', 'select-compatible-ai-technique', 'converge-game-quality')
POLICY_NATIVE_SKILLS = frozenset({'compile-massive-work-graph', 'gather-adaptive-minecraft-evidence', 'resume-production-run', 'route-generic-game-research', 'select-compatible-ai-technique', 'execute-complete-production', 'converge-game-quality'})
"""
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package tooling
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Generate canonical Skill snapshot
        run: python tools/package_skills.py
      - name: Validate restored catalog
        run: |
          python -m ruff check minecraft_mod_ai/skill_catalog.py minecraft_mod_ai/packaged_skill_runtime.py --select F,E7,E9
          python -m pytest -q tests/test_skill_catalog.py tests/test_packaged_skill_runtime.py || python -m pytest -q tests -k 'skill_catalog or packaged_skill'
      - name: Commit restored and generated Skill files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skills minecraft_mod_ai/skill_catalog.py minecraft_mod_ai/packaged_skills.json plugins/mmm-minecraft-mod-ai/skills
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Restore canonical Skill sources'
          git push origin HEAD:main
