name: Refresh runtime audit once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-runtime-audit-once.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh from latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          python .github/scripts/audit_runtime_mutations.py --output runtime_mutation_audit.json
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          data = json.loads(Path('runtime_mutation_audit.json').read_text())
          rows = data['behavioral']
          summary = {
              'schema_version': 'mmm/runtime-mutation-summary-v2',
              'behavioral_count': len(rows),
              'path_count': len({r['path'] for r in rows}),
              'by_path': dict(Counter(r['path'] for r in rows).most_common()),
          }
          Path('runtime_mutation_summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          PY
          rm .github/workflows/refresh-runtime-audit-once.yml
          git add -A
          git diff --cached --check
          git commit -m "chore(audit): refresh runtime rebind baseline"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
