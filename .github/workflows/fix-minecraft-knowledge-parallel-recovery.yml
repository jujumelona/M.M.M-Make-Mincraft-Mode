name: Fix Minecraft knowledge parallel research recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-minecraft-knowledge-parallel-recovery.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch parallel research recovery and add regressions
        run: |
          echo '' | base64 -d | python
      - name: Validate focused behavior
        run: |
          python -m pip install -q -e '.[dev]'
          python -m py_compile minecraft_mod_ai/central_intelligence_amplifier.py tests/test_parallel_research_recovery.py
          python -m ruff check minecraft_mod_ai/central_intelligence_amplifier.py tests/test_parallel_research_recovery.py --select F,E7,E9
          python -m pytest -q tests/test_parallel_research_recovery.py tests/test_minecraft_knowledge_contract.py tests/test_agentic_research_game_design.py
      - name: Commit validated recovery to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-minecraft-knowledge-parallel-recovery.yml
          git add minecraft_mod_ai/central_intelligence_amplifier.py tests/test_parallel_research_recovery.py .github/workflows/fix-minecraft-knowledge-parallel-recovery.yml
          git diff --cached --check
          git commit -m "Recover failed parallel Minecraft research domains"
          git pull --rebase origin main
          git push origin HEAD:main
