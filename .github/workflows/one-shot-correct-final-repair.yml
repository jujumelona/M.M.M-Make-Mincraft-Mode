name: One Shot Correct Final Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-correct-final-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -q -e '.[dev]'
      - name: Apply root-cause fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # 1. Restore explicit authored-behavior coverage certification between
          #    full requirement pages. A full page is not proof that another page
          #    exists, and repetition is not proof that authored coverage is complete.
          path = Path('minecraft_mod_ai/planning_state_resolution.py')
          text = path.read_text(encoding='utf-8')
          old_import = 'from .planning_contract_ssot import SUBMIT_RESEARCHED_REQUIREMENTS_SCHEMA\n'
          new_import = '''from .planning_contract_ssot import (\n    REQUIREMENT_COVERAGE_SCHEMA,\n    SUBMIT_RESEARCHED_REQUIREMENTS_SCHEMA,\n)\n'''
          if old_import not in text:
              raise SystemExit('planning coverage import anchor missing')
          text = text.replace(old_import, new_import, 1)
          start = text.index('def _generate_requirement_pages(')
          end = text.index('def compile_researched_requirements(', start)
          restored = '''def _generate_requirement_pages(router: Any, messages: list[dict[str, str]], budget: int) -> Any:\n    \"\"\"Bound each model response while proving authored-behavior coverage.\"\"\"\n    from .model_adapters import ModelConfigurationError\n\n    page_size = int(_REQUIREMENT_PARAMETERS[\"properties\"][\"requirements\"][\"maxItems\"])\n    collected: list[dict[str, Any]] = []\n    seen: set[str] = set()\n    payload = json.loads(messages[1][\"content\"])\n    page_index = 0\n    remaining: dict[str, Any] | None = None\n    while True:\n        current_messages = deepcopy(messages)\n        if collected:\n            current_messages[1][\"content\"] = json.dumps(\n                {\n                    **payload,\n                    \"already_compiled_requirements\": collected,\n                    \"uncovered_authored_behavior\": remaining,\n                },\n                ensure_ascii=False,\n                separators=(\",\", \":\"),\n            )\n            if sum(len(row[\"content\"].encode(\"utf-8\")) for row in current_messages) > budget:\n                raise ModelConfigurationError(\n                    \"REQUIREMENT_PAGINATION_CONTEXT_EXHAUSTED: continuation cannot fit \"\n                    \"without losing authored task or prior requirement coverage\"\n                )\n        try:\n            with planner_operation(\"researched_requirement_compile\", output_tokens=2048):\n                raw = router.generate_tool_decision(\n                    \"planner\",\n                    current_messages,\n                    tool_name=_REQUIREMENT_TOOL,\n                    parameters=_REQUIREMENT_PARAMETERS,\n                    description=\"Submit the next page of independently testable player-visible requirements.\",\n                )\n        except Exception as exc:\n            if not collected:\n                raise\n            raise ModelConfigurationError(\n                \"REQUIREMENT_PAGINATION_FAILED: continuation failed; partial requirements are not complete\"\n            ) from exc\n        rows = raw.get(\"requirements\") if isinstance(raw, Mapping) else None\n        if not isinstance(rows, list):\n            if not collected:\n                return raw\n            raise ModelConfigurationError(\n                \"REQUIREMENT_PAGINATION_FAILED: invalid continuation page\"\n            )\n        emit_root_cause(\n            \"planner_requirement_page_received\",\n            stage=\"planning_state\",\n            operation=\"researched_requirement_compile\",\n            result=\"INFO\",\n            details={\"page_index\": page_index + 1, \"requirements\": rows},\n        )\n        for row in rows:\n            if not isinstance(row, Mapping) or not _text(row.get(\"statement\")):\n                raise ModelConfigurationError(\n                    \"REQUIREMENT_PAGINATION_FAILED: invalid requirement row\"\n                )\n            identity = json.dumps(\n                [\n                    _text(row.get(\"statement\")).casefold(),\n                    _text(row.get(\"semantic_capability\")).casefold(),\n                    [value.casefold() for value in _strings(row.get(\"acceptance\"))],\n                ],\n                ensure_ascii=False,\n            )\n            if identity in seen:\n                raise ModelConfigurationError(\n                    \"REQUIREMENT_PAGINATION_NO_PROGRESS: repeated requirement cannot certify remaining coverage\"\n                )\n            seen.add(identity)\n            collected.append(dict(row))\n        page_index += 1\n        emit_root_cause(\n            \"planner_requirement_page\",\n            stage=\"planning_state\",\n            operation=\"researched_requirement_compile\",\n            result=\"CONTINUE\" if len(rows) >= page_size else \"COMPLETE\",\n            details={\n                \"page_index\": page_index,\n                \"page_requirement_count\": len(rows),\n                \"total_requirement_count\": len(collected),\n                \"requirements\": rows,\n            },\n        )\n        if len(rows) < page_size:\n            return {\"requirements\": collected}\n\n        coverage_messages = [\n            {\n                \"role\": \"system\",\n                \"content\": (\n                    \"Compare the original authored task with the collected requirements. Decide whether \"\n                    \"any explicitly requested player-visible behavior is still missing. A full page does \"\n                    \"not mean more requirements exist. Do not invent features to fill pages, expand vague \"\n                    \"'etc' into features, or repeat covered behavior with extra implementation details. \"\n                    \"If all requested behaviors are represented, return complete=true and both remaining \"\n                    \"fields empty. Otherwise return complete=false, an exact verbatim quote from the task \"\n                    \"that requests the missing behavior, and a description of that behavior.\"\n                ),\n            },\n            {\n                \"role\": \"user\",\n                \"content\": json.dumps(\n                    {**payload, \"already_compiled_requirements\": collected},\n                    ensure_ascii=False,\n                    separators=(\",\", \":\"),\n                ),\n            },\n        ]\n        if sum(len(row[\"content\"].encode(\"utf-8\")) for row in coverage_messages) > budget:\n            raise ModelConfigurationError(\n                \"REQUIREMENT_PAGINATION_CONTEXT_EXHAUSTED: coverage review cannot fit\"\n            )\n        try:\n            with planner_operation(\"requirement_coverage_review\", output_tokens=512):\n                remaining = router.generate_tool_decision(\n                    \"planner\",\n                    coverage_messages,\n                    tool_name=\"review_requirement_coverage\",\n                    parameters=REQUIREMENT_COVERAGE_SCHEMA,\n                    description=\"Decide whether an explicitly authored behavior remains uncovered.\",\n                )\n        except Exception as exc:\n            raise ModelConfigurationError(\n                \"REQUIREMENT_COVERAGE_FAILED: cannot certify partial requirement coverage\"\n            ) from exc\n        emit_root_cause(\n            \"planner_requirement_coverage\",\n            stage=\"planning_state\",\n            operation=\"requirement_coverage_review\",\n            result=\"INFO\",\n            details={\"review\": remaining},\n        )\n        if not isinstance(remaining, Mapping) or type(remaining.get(\"complete\")) is not bool:\n            raise ModelConfigurationError(\n                \"REQUIREMENT_COVERAGE_INVALID: missing explicit completion decision\"\n            )\n        quote = remaining.get(\"remaining_source_quote\")\n        behavior = _text(remaining.get(\"remaining_behavior\"))\n        if remaining[\"complete\"]:\n            if quote != \"\" or behavior:\n                raise ModelConfigurationError(\n                    \"REQUIREMENT_COVERAGE_INVALID: completion contradicts remaining behavior\"\n                )\n            return {\"requirements\": collected}\n        task = payload.get(\"task\", {})\n        source = str(task.get(\"original_prompt\") or task.get(\"prompt\") or \"\")\n        if not isinstance(quote, str) or not quote.strip() or quote not in source or not behavior:\n            raise ModelConfigurationError(\n                \"REQUIREMENT_COVERAGE_INVALID: remaining behavior lacks an exact task quote\"\n            )\n\n\n'''
          text = text[:start] + restored + text[end:]
          path.write_text(text, encoding='utf-8')

          # 2. on_result already checkpoints each successful atomic work item before
          #    executor detachment. The detached assembly loop must not persist/checkpoint
          #    the same result a second time.
          path = Path('minecraft_mod_ai/planning_state_adaptive_implementation.py')
          text = path.read_text(encoding='utf-8')
          marker = '            for work_item, result_receipt in completed_work:\n'
          loop_start = text.index(marker)
          block_start = text.index('                    if kind_tag == "artifact":\n', loop_start)
          remaining_anchor = text.index('                    remaining -= 1\n', block_start)
          replacement = '''                    # checkpoint_completed_work already persisted this result.\n                    # Only update the in-memory mirrors used for assembly here.\n                    if kind_tag == \"artifact\":\n                        result_receipt = _planning_only_artifact_receipt(result_receipt)\n                        job[\"artifact_fragments\"].setdefault(artifact_kind, {})[\n                            step_id\n                        ] = result_receipt\n                    else:\n                        job[\"fragments\"][idx] = result_receipt\n\n'''
          text = text[:block_start] + replacement + text[remaining_anchor:]
          checkpoint_anchor = '                    working_state = _checkpoint_state(working_state, checkpoint)\n                    emit_root_cause(\n'
          checkpoint_pos = text.index(checkpoint_anchor, loop_start)
          text = text[:checkpoint_pos] + '                    emit_root_cause(\n' + text[checkpoint_pos + len(checkpoint_anchor):]
          path.write_text(text, encoding='utf-8')

          # 3. Collision-anchor fencing is additive. It must never globally disable
          #    fail-closed serial-stage admission for shared CPU mutation domains.
          path = Path('tests/test_scheduler_parallel_safety_contract.py')
          text = path.read_text(encoding='utf-8')
          old = '''def test_anchor_fenced_runtime_disables_coarse_stage_admission() -> None:\n    assert scheduler_contract._SERIAL_CPU_STAGES == ()\n'''
          new = '''def test_anchor_fenced_runtime_keeps_fail_closed_stage_admission() -> None:\n    assert scheduler_contract._SERIAL_CPU_STAGES == (\n        \"generate:content\",\n        \"generate:system\",\n        \"generate:entity\",\n    )\n'''
          if old not in text:
              raise SystemExit('scheduler stale-test anchor missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Verify focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_planning_progress_monotone.py \
            tests/test_planning_requirement_pagination.py \
            tests/test_scheduler_parallel_safety_contract.py \
            tests/test_scheduler_claim_install_identity.py \
            tests/test_planning_deadline_hardening.py \
            tests/test_planning_convergence_contract.py
          python -m ruff check \
            minecraft_mod_ai/planning_state_resolution.py \
            minecraft_mod_ai/planning_state_adaptive_implementation.py \
            tests/test_scheduler_parallel_safety_contract.py \
            --select F,E7,E9
      - name: Commit and push verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jujumelona'
          git config user.email 'qasdaa025@gmail.com'
          git add \
            minecraft_mod_ai/planning_state_resolution.py \
            minecraft_mod_ai/planning_state_adaptive_implementation.py \
            tests/test_scheduler_parallel_safety_contract.py
          git diff --cached --check
          git commit -m 'fix: restore coverage proof and monotone checkpoints'
          git fetch origin main
          git rebase origin/main
          python -m pytest -q \
            tests/test_planning_progress_monotone.py \
            tests/test_planning_requirement_pagination.py \
            tests/test_scheduler_parallel_safety_contract.py \
            tests/test_scheduler_claim_install_identity.py
          git push origin HEAD:main
