name: One-time owner cleanup v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-owner-cleanup-v3.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse validated patch block
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/one-time-owner-cleanup-v2.yml').read_text(encoding='utf-8')
          marker = '      - name: Apply validated owner cleanup\n'
          start = source.index(marker)
          run_marker = '        run: |\n'
          start = source.index(run_marker, start) + len(run_marker)
          end = source.index('      - name: Verify consolidated contracts\n', start)
          Path('/tmp/apply-owner-cleanup.sh').write_text(
              textwrap.dedent(source[start:end]),
              encoding='utf-8',
          )
          PY
          bash /tmp/apply-owner-cleanup.sh
      - name: Verify consolidated contracts
        run: |
          python -m pip install --prefer-binary -e '.[dev]'
          python -m compileall -q minecraft_mod_ai tests tools download_resources.py
          python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9
          vulture minecraft_mod_ai tools download_resources.py --min-confidence 100
          node --check integrations/mineflayer-1201/bridge.mjs
          python -m pytest -q \
            tests/test_runtime_bootstrap_clean.py \
            tests/test_execution_efficiency_contract.py \
            tests/test_planner_pagination_safety_contract.py \
            tests/test_mineflayer_action_contract.py \
            tests/test_platform_target_resolution.py \
            tests/test_mod_only_public_surface.py \
            tests/test_production_stack.py \
            tests/test_notebook_registry_policy.py
          git diff --check
      - name: Commit and remove maintenance workflows
        run: |
          git rm .github/workflows/one-time-owner-cleanup.yml
          git rm .github/workflows/one-time-owner-cleanup-v2.yml
          git rm .github/workflows/one-time-owner-cleanup-v3.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Consolidate runtime owners and remove stale contract shapes'
          git push origin HEAD:main
