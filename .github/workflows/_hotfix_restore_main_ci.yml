name: Restore main CI gates

on:
  push:
    paths:
      - .github/workflows/_hotfix_restore_main_ci.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore fail-closed main CI topology
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git show da365d0c37cb77c57702d1deda52a18aa74d1cf4:.github/workflows/main-ci.yml > .github/workflows/main-ci.yml
          grep -F 'from tools.ci_test_shard import select_shard' .github/workflows/main-ci.yml
          grep -F 'name: Production path regression' .github/workflows/main-ci.yml
          grep -F 'name: Required JDT readiness gate' .github/workflows/main-ci.yml
          grep -F 'name: Parallel execution safety' .github/workflows/main-ci.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/main-ci.yml
          git commit -m 'fix: restore fail-closed CI gate topology'
          git push origin HEAD:main
