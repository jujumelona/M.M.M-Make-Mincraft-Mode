name: One-shot public acceptance hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  hotfix:
    if: github.event.head_commit.message == 'chore: install one-shot public acceptance hotfix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch acceptance pipeline before expensive recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          boundary_path = Path('minecraft_mod_ai/production_boundary_contract.py')
          production_path = Path('minecraft_mod_ai/production_contract.py')
          llama_path = Path('minecraft_mod_ai/llama_model.py')
          test_path = Path('tests/test_public_acceptance_runtime_boundary.py')

          boundary = boundary_path.read_text(encoding='utf-8')
          production = production_path.read_text(encoding='utf-8')
          llama = llama_path.read_text(encoding='utf-8')
          tests = test_path.read_text(encoding='utf-8')

          helper = r'''
def _sanitize_public_acceptance_items(value: Any) -> list[str]:
    """Keep only user-observable acceptance clauses before production compilation.

    Evidence planning may contain mixed strings such as
    ``Visible behavior; task_sha256 must match``.  Production correctly rejects
    the integrity clause, but rejecting the whole plan here forces an expensive
    LLM regeneration even though the public clause is already usable.  Split
    mixed clauses deterministically and keep only clauses accepted by the
    canonical production validator.
    """
    if not isinstance(value, str):
        return []
    from . import evidence_first_planning as _evidence

    normalize = getattr(_evidence, "_normalize_public_acceptance", None)
    candidate = normalize(value) if callable(normalize) else value.strip()
    candidate = str(candidate or "").strip()
    if not candidate:
        return []
    if _strict_public_acceptance(candidate):
        return [candidate]

    clauses = []
    for chunk in candidate.replace("\r", "\n").replace("\n", ";").split(";"):
        chunk = chunk.strip(" \t-*•")
        if chunk and _strict_public_acceptance(chunk):
            clauses.append(chunk)
    return clauses


def _sanitize_evidence_plan_public_acceptance(
    evidence_plan: Mapping[str, Any] | None,
) -> Mapping[str, Any] | None:
    """Project a clean public-acceptance authority before the strict compiler.

    The request catalog is the authority.  Release bindings are rewritten from
    that sanitized authority so stale/internal task-integrity prose cannot reach
    the production validator and trigger full structured regeneration.
    """
    if not isinstance(evidence_plan, Mapping):
        return evidence_plan

    plan = dict(evidence_plan)
    catalog = plan.get("request_catalog")
    if not isinstance(catalog, Mapping):
        return plan
    requirements = catalog.get("requirements")
    if not isinstance(requirements, (list, tuple)):
        return plan

    clean_requirements = []
    acceptance_by_ref: dict[str, list[str]] = {}
    for requirement in requirements:
        if not isinstance(requirement, Mapping):
            clean_requirements.append(requirement)
            continue
        clean_requirement = dict(requirement)
        raw_acceptance = requirement.get("acceptance")
        raw_items = [raw_acceptance] if isinstance(raw_acceptance, str) else (
            list(raw_acceptance) if isinstance(raw_acceptance, (list, tuple)) else []
        )
        clean_items: list[str] = []
        for item in raw_items:
            clean_items.extend(_sanitize_public_acceptance_items(item))

        # Fail open only toward a public, user-observable fallback; never copy
        # internal task/integrity prose into public acceptance.
        if not clean_items:
            source_span = requirement.get("source_span")
            source_text = ""
            if isinstance(source_span, Mapping):
                source_text = str(source_span.get("text") or "").strip()
            if source_text and _strict_public_acceptance(source_text):
                clean_items = [
                    f"The generated Minecraft mod visibly satisfies this request: {source_text}"
                ]
            else:
                clean_items = [
                    "The requested behavior is present and observable in the generated Minecraft mod."
                ]

        clean_requirement["acceptance"] = clean_items
        clean_requirements.append(clean_requirement)
        requirement_ref = str(
            requirement.get("requirement_id")
            or requirement.get("requirement_ref")
            or ""
        ).strip()
        if requirement_ref:
            acceptance_by_ref[requirement_ref] = list(clean_items)

    clean_catalog = dict(catalog)
    clean_catalog["requirements"] = clean_requirements
    plan["request_catalog"] = clean_catalog

    bindings = plan.get("acceptance_release_bindings")
    if isinstance(bindings, (list, tuple)):
        clean_bindings = []
        for binding in bindings:
            if not isinstance(binding, Mapping):
                clean_bindings.append(binding)
                continue
            clean_binding = dict(binding)
            requirement_ref = str(
                binding.get("requirement_ref")
                or binding.get("requirement_id")
                or ""
            ).strip()
            if requirement_ref in acceptance_by_ref:
                clean_binding["acceptance"] = list(acceptance_by_ref[requirement_ref])
            else:
                raw_binding_acceptance = binding.get("acceptance")
                binding_items = (
                    [raw_binding_acceptance]
                    if isinstance(raw_binding_acceptance, str)
                    else list(raw_binding_acceptance)
                    if isinstance(raw_binding_acceptance, (list, tuple))
                    else []
                )
                clean_values: list[str] = []
                for item in binding_items:
                    clean_values.extend(_sanitize_public_acceptance_items(item))
                if clean_values:
                    clean_binding["acceptance"] = clean_values
            clean_bindings.append(clean_binding)
        plan["acceptance_release_bindings"] = clean_bindings

    return plan

'''

          if 'def _sanitize_evidence_plan_public_acceptance(' not in boundary:
              anchor = 'def _filter_evidence_input_acceptance('
              if anchor not in boundary:
                  raise SystemExit('hotfix anchor missing: _filter_evidence_input_acceptance')
              boundary = boundary.replace(anchor, helper + anchor, 1)

          old_effective = 'effective_acceptance = _filter_evidence_input_acceptance(acceptance_tests, evidence_plan)'
          if old_effective in boundary and 'effective_evidence_plan = _sanitize_evidence_plan_public_acceptance(evidence_plan)' not in boundary:
              boundary = boundary.replace(
                  old_effective,
                  old_effective + '\n        effective_evidence_plan = _sanitize_evidence_plan_public_acceptance(evidence_plan)',
                  1,
              )

          # Only inside the production wrapper: feed the sanitized plan to the
          # original compiler.  Do not weaken the compiler validator itself.
          if 'effective_evidence_plan = _sanitize_evidence_plan_public_acceptance(evidence_plan)' in boundary:
              idx = boundary.index('effective_evidence_plan = _sanitize_evidence_plan_public_acceptance(evidence_plan)')
              tail = boundary[idx:]
              replaced_tail, count = re.subn(
                  r'(?<!effective_)evidence_plan\s*=\s*evidence_plan',
                  'evidence_plan=effective_evidence_plan',
                  tail,
                  count=1,
              )
              if count != 1 and 'evidence_plan=effective_evidence_plan' not in tail:
                  raise SystemExit('hotfix anchor missing: original compiler evidence_plan argument')
              boundary = boundary[:idx] + replaced_tail

          # Preserve strict rejection, but expose the exact marker and folded
          # statement if anything ever reaches this validator again.
          generic = re.compile(
              r'(?P<i>^[ \t]*)raise ProductionContractError\(\n'
              r'[ \t]*[\'\"]public acceptance contains internal task or integrity language[\'\"]\n'
              r'[ \t]*\)',
              re.MULTILINE,
          )
          if 'marker={matched_marker!r}' not in production:
              def detail_repl(match):
                  i = match.group('i')
                  return (
                      f"{i}matched_marker = (\"task_\" if \"task_\" in folded else "
                      "next((marker for marker in _PUBLIC_ACCEPTANCE_INTERNAL_MARKERS if marker in folded), \"unknown\"))\n"
                      f"{i}raise ProductionContractError(\n"
                      f"{i}    f\"public acceptance contains internal task or integrity language: "
                      "marker={matched_marker!r}; value={folded!r}\"\n"
                      f"{i})"
                  )
              production, count = generic.subn(detail_repl, production, count=1)
              if count != 1:
                  raise SystemExit('hotfix anchor missing: generic public acceptance error')

          # Structured recovery previously printed only errors=N.  Preserve the
          # existing line and add the concrete validation errors in-place.
          if 'structured recovery' in llama.lower() and 'details={' not in llama:
              recovery_pattern = re.compile(r'errors=\{len\((?P<v>[A-Za-z_]\w*)\)\}')
              llama, count = recovery_pattern.subn(
                  lambda m: f"errors={{len({m.group('v')})}} details={{{m.group('v')}!r}}",
                  llama,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('hotfix anchor missing: structured recovery errors counter')

          regression = r'''


def test_evidence_plan_public_acceptance_is_sanitized_before_production_compile():
    from minecraft_mod_ai.production_boundary_contract import (
        _sanitize_evidence_plan_public_acceptance,
    )

    plan = {
        "request_catalog": {
            "requirements": [
                {
                    "requirement_id": "req_visible",
                    "source_span": {"text": "Show the requested visible behavior"},
                    "acceptance": [
                        "The requested block is visible in game; task_sha256 must match"
                    ],
                }
            ]
        },
        "acceptance_release_bindings": [
            {
                "requirement_ref": "req_visible",
                "acceptance": ["required_gates must pass"],
            }
        ],
    }
    sanitized = _sanitize_evidence_plan_public_acceptance(plan)
    expected = ["The requested block is visible in game"]
    assert sanitized["request_catalog"]["requirements"][0]["acceptance"] == expected
    assert sanitized["acceptance_release_bindings"][0]["acceptance"] == expected


def test_public_acceptance_failure_reports_exact_internal_marker():
    from minecraft_mod_ai.production_contract import (
        ProductionContractError,
        _validate_public_acceptance,
    )

    try:
        _validate_public_acceptance("Visible result and task_sha256 must match")
    except ProductionContractError as exc:
        message = str(exc)
    else:
        raise AssertionError("dirty public acceptance unexpectedly passed")
    assert "task_" in message or "task_sha256" in message
    assert "value=" in message
'''

          marker = 'test_evidence_plan_public_acceptance_is_sanitized_before_production_compile'
          if marker not in tests:
              tests = tests.rstrip() + regression + '\n'

          boundary_path.write_text(boundary, encoding='utf-8')
          production_path.write_text(production, encoding='utf-8')
          llama_path.write_text(llama, encoding='utf-8')
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Compile and run focused regressions
        shell: bash
        run: |
          python -m compileall -q minecraft_mod_ai
          python -m pytest tests/test_public_acceptance_runtime_boundary.py -q
          python .github/scripts/audit_runtime_mutations.py

      - name: Commit hotfix to main and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-public-acceptance-hotfix.yml
          git add minecraft_mod_ai/production_boundary_contract.py minecraft_mod_ai/production_contract.py minecraft_mod_ai/llama_model.py tests/test_public_acceptance_runtime_boundary.py
          git commit -m 'fix: sanitize public acceptance before production validation'
          git push origin HEAD:main
