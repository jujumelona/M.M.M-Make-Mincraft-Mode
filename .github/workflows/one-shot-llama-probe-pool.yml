name: One-shot llama probe pool patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Fix one-shot llama probe pool patcher'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Hoist parallel probe executor across benchmark rounds
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/llama_server_runtime_tuning.py')
          source = path.read_text(encoding='utf-8')
          old = "\n".join([
              "        rounds: list[list[Any]] = []",
              "        for probe_request in (request, _medium_prefill_request(request)):",
              "            with ThreadPoolExecutor(",
              "                max_workers=concurrency, thread_name_prefix=\"mmm_llama_slot_probe\"",
              "            ) as pool:",
              "                values = [",
              "                    future.result()",
              "                    for future in [",
              "                        pool.submit(",
              "                            autotune_module._probe_server,",
              "                            base_url,",
              "                            probe_request,",
              "                            max_tokens=max_tokens,",
              "                            variant=variant,",
              "                        )",
              "                        for _ in range(concurrency)",
              "                    ]",
              "                ]",
              "            rounds.append(values)",
          ])
          new = "\n".join([
              "        rounds: list[list[Any]] = []",
              "        with ThreadPoolExecutor(",
              "            max_workers=concurrency, thread_name_prefix=\"mmm_llama_slot_probe\"",
              "        ) as pool:",
              "            for probe_request in (request, _medium_prefill_request(request)):",
              "                values = [",
              "                    future.result()",
              "                    for future in [",
              "                        pool.submit(",
              "                            autotune_module._probe_server,",
              "                            base_url,",
              "                            probe_request,",
              "                            max_tokens=max_tokens,",
              "                            variant=variant,",
              "                        )",
              "                        for _ in range(concurrency)",
              "                    ]",
              "                ]",
              "                rounds.append(values)",
          ])
          if source.count(old) != 1:
              raise SystemExit(f'expected exactly one parallel probe block, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Verify pool reuse regression
        run: python -m pytest -q tests/test_llama_server_runtime_efficiency.py tests/test_llama_parallel_runtime_contract.py
      - name: Commit exact production change to main
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add minecraft_mod_ai/llama_server_runtime_tuning.py
          git diff --cached --check
          git commit -m 'Reuse llama probe worker pool across rounds'
          git push origin HEAD:main
