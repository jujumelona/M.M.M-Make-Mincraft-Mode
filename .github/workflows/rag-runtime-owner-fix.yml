name: RAG runtime owner fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rag-runtime-owner-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Apply reviewed RAG patches
        run: |
          python -m pip install --quiet PyYAML
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          data = yaml.safe_load(Path('.github/workflows/rag-correctness-hotfix.yml').read_text(encoding='utf-8'))
          wanted = [
              'Apply reviewed small-model architecture refactor',
              'Remove model-driven JSON repair',
              'Make corrective sufficiency fail closed',
          ]
          by_name = {
              step.get('name'): step
              for step in data['jobs']['hotfix']['steps']
              if isinstance(step, dict) and step.get('name')
          }
          for name in wanted:
              step = by_name.get(name)
              if not step:
                  raise SystemExit(f'missing patch step: {name}')
              subprocess.run(step['run'], shell=True, executable='/bin/bash', check=True)
          PY

      - name: Patch canonical runtime bounded-output owner
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/runtime_stability_contract.py')
          text = path.read_text(encoding='utf-8')
          old = '''        module._emit_research_progress("model_attempt", label=progress_label, attempt=1)
                  try:
                      raw = router.generate_text(
                          "planner",
                          aligned_messages,
                          response_format="json",
                          response_schema=bound_schema,
                          tool_stage="research",
                          enable_tools=False,
                      )
                      return parser(raw)
                  except Exception as exc:
                      from .structured_output import StructuredOutputValidationError

                      if isinstance(exc, (agentic_module.SpecValidationError, StructuredOutputValidationError)):
                          raise module._BoundedResearchOutputError(
                              f"bounded structured output failed after host repair: {exc}"
                          ) from exc
                      raise
          '''
          new = '''        module._emit_research_progress("model_attempt", label=progress_label, attempt=1)
                  raw = ""
                  try:
                      raw = router.generate_text(
                          "planner",
                          aligned_messages,
                          response_format="json",
                          response_schema=bound_schema,
                          tool_stage="research",
                          enable_tools=False,
                      )
                  except Exception as exc:
                      module._emit_bounded_failure(
                          "bounded_model_failure",
                          progress_label=progress_label,
                          raw_output=raw,
                          error=exc,
                      )
                      raise

                  try:
                      return parser(raw)
                  except Exception as first_error:
                      module._emit_bounded_failure(
                          "bounded_parse_failure",
                          progress_label=progress_label,
                          raw_output=raw,
                          error=first_error,
                      )
                      try:
                          normalized = module._normalize_bounded_json_text(raw)
                          parsed = parser(normalized)
                      except Exception as normalized_error:
                          module._emit_bounded_failure(
                              "bounded_host_normalization_failure",
                              progress_label=progress_label,
                              raw_output=raw,
                              error=normalized_error,
                          )
                          raise module._BoundedResearchOutputError(
                              "bounded structured output failed after deterministic host normalization: "
                              f"{type(normalized_error).__name__}: {normalized_error}"
                          ) from normalized_error
                      module._emit_research_progress(
                          "bounded_host_normalized",
                          label=progress_label,
                          attempt=1,
                          raw_output_sha256=module._sha256_text(raw),
                      )
                      return parsed
          '''
          if old not in text:
              raise SystemExit('runtime bounded-output owner block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate canonical runtime path
        run: |
          python -m pip install --prefer-binary -e '.[dev]'
          python -m compileall -q minecraft_mod_ai tests
          python -m ruff check minecraft_mod_ai tests --select F,E7,E9
          python -m pytest -q tests/test_agentic_research_game_design.py tests/test_pre_design_rag_quality_contract.py
          python - <<'PY'
          import json
          from minecraft_mod_ai import agentic_pre_design_rag as rag
          from minecraft_mod_ai import pre_design_rag_corrective as corrective

          class Agentic:
              class SpecValidationError(ValueError):
                  pass

          class Router:
              def __init__(self):
                  self.calls = 0
              def generate_text(self, *args, **kwargs):
                  self.calls += 1
                  return '```json\n{"queries":["minecraft colony persistence"]}\n```'

          router = Router()
          parsed = rag._generate_bounded(
              Agentic,
              router,
              messages=[{'role': 'user', 'content': 'x'}],
              response_schema={'type': 'object'},
              parser=json.loads,
              progress_label='runtime-owner-regression',
          )
          assert parsed == {'queries': ['minecraft colony persistence']}
          assert router.calls == 1
          summary = {'claims': [{'claim': 'supported'}]}
          assert corrective._round_is_terminally_sufficient(summary)
          assert not corrective._round_is_terminally_sufficient(summary, page_gaps=['missing'])
          assert not corrective._round_is_terminally_sufficient(summary, support_rejections=['unsupported'])
          assert rag._DOMAIN_CHECKPOINT_SCHEMA.endswith('-v6')
          assert corrective._QUALITY_SCHEMA.endswith('-v4')
          PY

      - name: Commit tested source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/agentic_research_game_design.py minecraft_mod_ai/agentic_pre_design_rag.py minecraft_mod_ai/pre_design_rag_corrective.py minecraft_mod_ai/pre_design_rag_fusion.py minecraft_mod_ai/runtime_stability_contract.py tests/test_agentic_research_game_design.py tests/test_pre_design_rag_quality_contract.py
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: make pre-design RAG fail closed end to end'
          git push origin HEAD:main
