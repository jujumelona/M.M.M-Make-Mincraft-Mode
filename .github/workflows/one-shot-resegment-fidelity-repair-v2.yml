name: One-shot resegment fidelity repair v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-resegment-fidelity-repair-v2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply production patch from the guarded first workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/one-shot-resegment-fidelity-repair.yml').read_text(encoding='utf-8')
          )
          steps = workflow['jobs']['repair']['steps']
          step = next(
              item for item in steps
              if item.get('name') == 'Add bounded diagnostic retry for compound resegmentation'
          )
          run = step['run']
          prefix = "python - <<'PY'\n"
          if not run.startswith(prefix) or not run.rstrip().endswith('\nPY'):
              raise SystemExit('guarded patch heredoc not found')
          script = run[len(prefix):].rstrip()
          script = script[:-2].rstrip() + '\n'
          exec(compile(script, '<guarded-resegment-patch>', 'exec'), {})
          PY
      - name: Verify exact latest-log source-gap recovery
        run: |
          python - <<'PY'
          import json
          from minecraft_mod_ai.request_requirements import resegment_compound_leaf

          clause_text = '자원파밍 돈모으기 거래 등으로'
          clause = {
              'clause_index': 0,
              'char_start': 0,
              'char_end': len(clause_text),
              'text': clause_text,
          }
          parent = {
              'source_clause_index': 0,
              'source_anchor': clause_text,
              'semantic_statement': 'The player can gather resources, earn money, and trade.',
              'given': 'The player is in the game.',
              'when': 'The player acts.',
              'then': 'The requested economy actions occur.',
              'semantic_type': 'gameplay_mechanic',
          }

          def leaf(anchor, statement):
              return {
                  'source_clause_index': 0,
                  'source_anchor': anchor,
                  'semantic_statement': statement,
                  'given': 'The player is in the game.',
                  'when': statement,
                  'then': statement,
                  'semantic_type': 'gameplay_mechanic',
              }

          class RepairingRouter:
              def __init__(self):
                  self.calls = 0
                  self.saw_gap = False
              def generate_tool_decision(self, role, messages, **kwargs):
                  self.calls += 1
                  body = json.loads(messages[-1]['content'])
                  group = body['compound_groups'][0]
                  if self.calls == 2:
                      self.saw_gap = 'REQ_SOURCE_PARTITION_GAP' in group['previous_validation_error']
                  last_anchor = '거래' if self.calls == 1 else '거래 등으로'
                  return {'groups': [{'group_id': group['group_id'], 'leaves': [
                      leaf('자원파밍', 'The player can gather resources.'),
                      leaf('돈모으기', 'The player can earn money.'),
                      leaf(last_anchor, 'The player can trade.'),
                  ]}]}

          router = RepairingRouter()
          atomic, ignored = resegment_compound_leaf(router, parent, clause)
          assert router.calls == 2
          assert router.saw_gap
          assert [item['source_anchor'] for item in atomic] == [
              '자원파밍', '돈모으기', '거래 등으로'
          ]
          assert ignored == []

          class BrokenRouter(RepairingRouter):
              def generate_tool_decision(self, role, messages, **kwargs):
                  self.calls += 1
                  body = json.loads(messages[-1]['content'])
                  group = body['compound_groups'][0]
                  return {'groups': [{'group_id': group['group_id'], 'leaves': [
                      leaf('자원파밍', 'The player can gather resources.'),
                      leaf('돈모으기', 'The player can earn money.'),
                      leaf('거래', 'The player can trade.'),
                  ]}]}

          broken = BrokenRouter()
          try:
              resegment_compound_leaf(broken, parent, clause)
          except ValueError as exc:
              assert 'diagnostic-guided repair' in str(exc)
          else:
              raise AssertionError('broken re-segmentation must fail closed')
          assert broken.calls == 2
          PY
      - name: Run semantic and planner regressions
        run: |
          pytest -q \
            tests/test_request_requirements_atomicity.py \
            tests/test_planner_log_replay_2026_09.py \
            tests/test_evidence_first_planning.py
      - name: Static check changed production file
        run: |
          ruff check minecraft_mod_ai/request_requirements.py
          python -m py_compile minecraft_mod_ai/request_requirements.py
      - name: Commit verified repair directly to main
        run: |
          rm .github/workflows/one-shot-resegment-fidelity-repair.yml
          rm .github/workflows/one-shot-resegment-fidelity-repair-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/request_requirements.py \
            .github/workflows/one-shot-resegment-fidelity-repair.yml \
            .github/workflows/one-shot-resegment-fidelity-repair-v2.yml
          git commit -m 'fix: repair compound source gaps in bounded retry'
          git push origin HEAD:main
