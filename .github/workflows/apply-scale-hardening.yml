name: Apply scale hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: main-scale-hardening
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: ${{ hashFiles('tools/apply_scale_hardening.py.gz.b64') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test environment
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,ui]'
      - name: Decode and apply fail-closed patch
        run: |
          base64 -d tools/apply_scale_hardening.py.gz.b64 | gzip -d > /tmp/apply_scale_hardening.py
          python /tmp/apply_scale_hardening.py
      - name: Compile
        run: python -m compileall -q minecraft_mod_ai tools mcp_gateway.py download_resources.py
      - name: Notebook contract
        run: python tools/build_colab_notebook.py --check
      - name: Test
        run: pytest -q
      - name: Commit verified hardening directly to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Remove arbitrary scale caps and shard large mod generation'
          git push origin HEAD:main
