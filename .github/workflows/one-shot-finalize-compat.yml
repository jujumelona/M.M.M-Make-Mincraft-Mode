name: One-shot Finalize Compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-finalize-compat.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Apply byte-verified compatibility patch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          blob_shas = [
              '5d22e602d074e282705c1bd64883d81662b1435f',
              '8c23acc991bd7fbdde1510f57c40df7fece8d438',
              '935488f97f91eb4bdd05420bb17568d6479d803b',
          ]
          chunks = []
          for blob_sha in blob_shas:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{blob_sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  payload = json.load(response)
              chunks.append(base64.b64decode(payload['content']).decode('utf-8'))
          encoded = ''.join(chunks)
          data = base64.b64decode(encoded, validate=True)
          with open('/tmp/final-compat.patch.xz', 'wb') as fh:
              fh.write(data)
          print(f'encoded_chars={len(encoded)} patch_blob_bytes={len(data)}')
          PY
          xz -t /tmp/final-compat.patch.xz
          xz -dc /tmp/final-compat.patch.xz > /tmp/final-compat.patch
          git apply --check /tmp/final-compat.patch
          git apply /tmp/final-compat.patch
          git rm --ignore-unmatch \
            .github/workflows/one-shot-source-export.yml \
            .github/workflows/one-shot-compat-revert-diagnose.yml \
            .github/workflows/one-shot-finalize-compat.yml
          git diff --check
          git diff --name-only --diff-filter=ACMR -- '*.py' -z | xargs -0 -r python -m py_compile

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -e '.[dev]'

      - name: Architecture regression guard
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/audit_code_quality_regression.py \
            --base-ref b87f502 \
            --output /tmp/code-quality-regression.json

      - name: Runtime efficiency and mutation guards
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/audit_runtime_efficiency.py \
            --output /tmp/runtime-efficiency-current.json
          base_eff="$(mktemp -d)"
          git archive --format=tar b87f502 -- \
            .github/scripts/audit_runtime_efficiency.py \
            minecraft_mod_ai tools download_resources.py \
            | tar -xf - -C "$base_eff"
          (
            cd "$base_eff"
            python .github/scripts/audit_runtime_efficiency.py \
              --output /tmp/runtime-efficiency-base.json
          )
          python .github/scripts/gate_runtime_efficiency.py \
            --baseline /tmp/runtime-efficiency-base.json \
            --current /tmp/runtime-efficiency-current.json

          base_mut="$(mktemp -d)"
          git archive --format=tar b87f502 -- \
            .github/scripts/audit_runtime_mutations.py \
            minecraft_mod_ai tools download_resources.py \
            | tar -xf - -C "$base_mut"
          python .github/scripts/audit_runtime_mutations.py \
            --baseline-root "$base_mut" \
            --fail-on-new \
            --output /tmp/runtime-mutations.json

      - name: Critical compatibility regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q \
            tests/test_central_research.py \
            tests/test_central_research_intelligence_contract.py \
            tests/test_custom_module_host_grounding_contract.py \
            tests/test_direct_task_mutation_authority_contract.py \
            tests/test_fresh_java_host_grounding_contract.py \
            tests/test_grounding_policy_actionable_evidence.py \
            tests/test_host_grounding_write_scope.py \
            tests/test_platform_topology_identity_contract.py \
            tests/test_qwen_parser_single_owner.py \
            tests/test_qwen_tool_parser_sibling_isolation.py \
            tests/test_source_set_boundary_contract.py \
            tests/test_validation_diagnostic_wrapper_trace.py \
            tests/test_progress_aware_semantic_convergence.py \
            tests/test_progress_aware_tool_loop_rewrite.py \
            tests/test_progress_aware_verifier_recovery.py \
            tests/test_progress_aware_verifier_repair_state.py \
            tests/test_verifier_repair_state.py \
            tests/test_repair_mutation_recovery_contract.py \
            tests/test_mutation_recovery_and_jdt_readiness.py

      - name: Diagnostic contract regressions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. pytest -q \
            tests/test_ci_quality_regression_audit.py \
            tests/test_pytest_diagnostics_timeout_evidence.py \
            tests/test_root_cause_audit_wrapper.py

      - name: Commit and push final fixes
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -n "$(git status --porcelain)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix refactor runtime compatibility regressions'
          git push origin HEAD:main
