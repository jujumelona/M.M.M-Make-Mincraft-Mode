name: One-shot Finalize Compatibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-finalize-compat.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Apply compatibility code patch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          blob_shas = [
              '5d22e602d074e282705c1bd64883d81662b1435f',
              '8c23acc991bd7fbdde1510f57c40df7fece8d438',
              '935488f97f91eb4bdd05420bb17568d6479d803b',
          ]
          chunks = []
          for blob_sha in blob_shas:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{blob_sha}',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  payload = json.load(response)
              chunks.append(base64.b64decode(payload['content']).decode('utf-8'))
          encoded = ''.join(chunks)
          data = base64.b64decode(encoded, validate=True)
          with open('/tmp/final-compat.patch.xz', 'wb') as fh:
              fh.write(data)
          PY
          xz -t /tmp/final-compat.patch.xz
          xz -dc /tmp/final-compat.patch.xz > /tmp/final-compat.patch
          git apply --check /tmp/final-compat.patch
          git apply /tmp/final-compat.patch
          git rm --ignore-unmatch \
            .github/workflows/one-shot-source-export.yml \
            .github/workflows/one-shot-compat-revert-diagnose.yml \
            .github/workflows/one-shot-finalize-compat.yml
          git diff --check
          git diff -z --name-only --diff-filter=ACMR -- '*.py' | xargs -0 -r python -m py_compile

      - name: Commit and push code
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          test -n "$(git status --porcelain)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix refactor runtime compatibility regressions'
          git push origin HEAD:main
