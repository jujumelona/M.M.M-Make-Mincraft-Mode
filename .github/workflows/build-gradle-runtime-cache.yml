name: Build immutable Gradle runtime cache

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-gradle-runtime-cache.yml
      - minecraft_mod_ai/verified_scaffold_registry.py

permissions:
  contents: write

concurrency:
  group: gradle-runtime-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror:
    name: Gradle ${{ matrix.gradle_version }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        gradle_version: ["7.6", "8.1", "8.5", "8.8", "8.10.2"]
    env:
      RELEASE_TAG: gradle-runtime-cache-v1-immutable
      GRADLE_VERSION: ${{ matrix.gradle_version }}
    steps:
      - name: Resolve official checksums
        id: checksums
        shell: bash
        run: |
          set -euo pipefail
          case "$GRADLE_VERSION" in
            7.6)
              dist=7ba68c54029790ab444b39d7e293d3236b2632631fb5f2e012bb28b4ff669e4b
              wrapper=c5a643cf80162e665cc228f7b16f343fef868e47d3a4836f62e18b7e17ac018a
              ;;
            8.1)
              dist=a62c5f99585dd9e1f95dab7b9415a0e698fa9dd1e6c38537faa81ac078f4d23e
              wrapper=ed2c26eba7cfb93cc2b7785d05e534f07b5b48b5e7fc941921cd098628abca58
              ;;
            8.5)
              dist=9d926787066a081739e8200858338b4a69e837c3a821a33aca9db09dd4a41026
              wrapper=d3b261c2820e9e3d8d639ed084900f11f4a86050a8f83342ade7b6bc9b0d2bdd
              ;;
            8.8)
              dist=a4b4158601f8636cdeeab09bd76afb640030bb5b144aafe261a5e8af027dc612
              wrapper=cb0da6751c2b753a16ac168bb354870ebb1e162e9083f116729cec9c781156b8
              ;;
            8.10.2)
              dist=31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26
              wrapper=2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046
              ;;
            *)
              echo "unsupported Gradle version: $GRADLE_VERSION" >&2
              exit 1
              ;;
          esac
          echo "distribution_sha256=$dist" >> "$GITHUB_OUTPUT"
          echo "wrapper_sha256=$wrapper" >> "$GITHUB_OUTPUT"

      - name: Check immutable GitHub cache
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dist="gradle-${GRADLE_VERSION}-bin.zip"
          wrapper="gradle-${GRADLE_VERSION}-wrapper.jar"
          published=false
          has_dist=false
          has_wrapper=false
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            names="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            if grep -Fxq "$dist" <<<"$names"; then has_dist=true; fi
            if grep -Fxq "$wrapper" <<<"$names"; then has_wrapper=true; fi
            if [[ "$has_dist" != "$has_wrapper" ]]; then
              echo "Gradle cache release is incomplete for $GRADLE_VERSION" >&2
              exit 1
            fi
            if [[ "$has_dist" == true ]]; then published=true; fi
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"
          echo "Gradle $GRADLE_VERSION cache present=$published"

      - name: Download official Gradle runtime
        if: steps.release.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          curl --fail --location --retry 4 --retry-all-errors \
            --output "dist/gradle-${GRADLE_VERSION}-bin.zip" \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          curl --fail --location --retry 4 --retry-all-errors \
            --output "dist/gradle-${GRADLE_VERSION}-wrapper.jar" \
            "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}/gradle/wrapper/gradle-wrapper.jar"

      - name: Verify official Gradle checksums
        if: steps.release.outputs.published != 'true'
        shell: bash
        env:
          DIST_SHA256: ${{ steps.checksums.outputs.distribution_sha256 }}
          WRAPPER_SHA256: ${{ steps.checksums.outputs.wrapper_sha256 }}
        run: |
          set -euo pipefail
          echo "$DIST_SHA256  dist/gradle-${GRADLE_VERSION}-bin.zip" | sha256sum -c -
          echo "$WRAPPER_SHA256  dist/gradle-${GRADLE_VERSION}-wrapper.jar" | sha256sum -c -
          printf '%s  %s\n' "$DIST_SHA256" "gradle-${GRADLE_VERSION}-bin.zip" \
            > "dist/gradle-${GRADLE_VERSION}-bin.zip.sha256"
          printf '%s  %s\n' "$WRAPPER_SHA256" "gradle-${GRADLE_VERSION}-wrapper.jar" \
            > "dist/gradle-${GRADLE_VERSION}-wrapper.jar.sha256"

      - name: Publish immutable Gradle cache
        if: steps.release.outputs.published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Immutable Gradle runtime cache" \
              --notes "Pinned official Gradle binary distributions and wrapper JARs used by M.M.M isolated build sandboxes. Assets are checksum-verified and append-only; this workflow never clobbers an existing version." \
            || gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi

          files=(
            "dist/gradle-${GRADLE_VERSION}-bin.zip"
            "dist/gradle-${GRADLE_VERSION}-bin.zip.sha256"
            "dist/gradle-${GRADLE_VERSION}-wrapper.jar"
            "dist/gradle-${GRADLE_VERSION}-wrapper.jar.sha256"
          )
          if ! gh release upload "$RELEASE_TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY"; then
            names="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            for path in "${files[@]}"; do
              grep -Fxq "$(basename "$path")" <<<"$names"
            done
            echo "Gradle $GRADLE_VERSION assets were published concurrently; keeping existing immutable files"
          fi
