name: One-shot Retired Pre-design Test Cleanup

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-retired-predesign-tests.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Remove obsolete tests and stale imports
        run: |
          python - <<'PY'
          from pathlib import Path

          obsolete = (
              'tests/test_agentic_pre_design_rag.py',
              'tests/test_pre_design_phase_grounding_recovery.py',
              'tests/test_pre_design_rag_root_cause.py',
              'tests/test_pre_design_research_pipeline.py',
          )
          for raw in obsolete:
              path = Path(raw)
              if path.exists():
                  path.unlink()

          stale_imports = {
              'tests/test_agentic_planner_runtime_hardening.py':
                  'import minecraft_mod_ai.agentic_pre_design_rag as forced_rag\n',
              'tests/test_agentic_research_game_design.py':
                  'import minecraft_mod_ai.agentic_pre_design_rag as paged_rag\n',
              'tests/test_planner_failure_regressions.py':
                  'from minecraft_mod_ai import agentic_pre_design_rag as project_rag\n',
              'tests/test_research_claim_transport.py':
                  'from minecraft_mod_ai import agentic_pre_design_rag as paged_rag\n',
          }
          for raw, old in stale_imports.items():
              path = Path(raw)
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'stale import marker missing: {raw}')
              path.write_text(text.replace(old, '', 1), encoding='utf-8')

          path = Path('tests/test_runtime_contract_composer_ownership.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def test_package_bootstrap_phase_order_is_explicit_and_graph_owned() -> None:')
          next_test = text.index('\n\ndef ', start + 5)
          replacement = '''def test_package_bootstrap_phase_order_is_explicit_and_graph_owned() -> None:\n    import re\n\n    source = (PACKAGE / "runtime_bootstrap.py").read_text(encoding="utf-8")\n    expected = [\n        "prebootstrap",\n        "core",\n        "model-runtime",\n        "validation",\n        "generation",\n        "platform",\n        "planner",\n        "architecture",\n        "late-safety",\n        "public-boundary",\n        "post-bootstrap",\n        "postbootstrap",\n        "integrity",\n    ]\n    observed = re.findall(r'ContractStage\\(\\s*"([^"]+)"', source)\n    assert observed[: len(expected)] == expected\n    assert 'compose_contract_stages(' in source\n'''
          path.write_text(text[:start] + replacement + text[next_test:], encoding='utf-8')

          token = 'agentic_' + 'pre_design_' + 'rag'
          offenders = []
          for path in Path('tests').glob('test_*.py'):
              if token in path.read_text(encoding='utf-8'):
                  offenders.append(str(path))
          if offenders:
              raise SystemExit('remaining retired-owner test references: ' + ', '.join(offenders))
          PY
      - name: Compile changed tests
        run: |
          python -m py_compile \
            tests/test_agentic_planner_runtime_hardening.py \
            tests/test_agentic_research_game_design.py \
            tests/test_planner_failure_regressions.py \
            tests/test_research_claim_transport.py \
            tests/test_runtime_contract_composer_ownership.py
      - name: Commit cleanup to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A tests
          if ! git diff --cached --quiet; then
            git commit -m 'test: remove retired pre-design owner assumptions'
            git push origin HEAD:main
          fi
