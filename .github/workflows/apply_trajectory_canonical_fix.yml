name: Diagnose trajectory retrieval wrapper owner

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Locate every trajectory retrieval binding
        run: |
          grep -RIn "relevant_trajectories" minecraft_mod_ai tests || true
      - name: Inspect composed runtime callable
        run: |
          python -m pip install --prefer-binary -e '.[dev]' >/dev/null
          python - <<'PY'
          import inspect
          from minecraft_mod_ai import temporary_skill_contract as contract
          from minecraft_mod_ai import trajectory_memory as tm
          for label, fn in (
              ("trajectory_memory.relevant_trajectories", tm.relevant_trajectories),
              ("temporary_skill_contract.relevant_trajectories", getattr(contract, "relevant_trajectories", None)),
          ):
              print(label, "=", fn)
              if fn is not None:
                  print(" module=", getattr(fn, "__module__", None))
                  print(" qualname=", getattr(fn, "__qualname__", None))
                  print(" signature=", inspect.signature(fn))
                  print(" wrapped=", getattr(fn, "__wrapped__", None))
          PY
