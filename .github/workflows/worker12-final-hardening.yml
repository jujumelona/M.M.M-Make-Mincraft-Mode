name: Worker 12 final hardening

on:
  push:
    paths:
      - '.github/worker12-final-hardening.trigger'

permissions:
  contents: write

concurrency:
  group: worker12-final-hardening
  cancel-in-progress: false

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply exact worker 12 final patch
        run: |
          python .github/scripts/worker12_final_hardening.py
          python .github/scripts/worker12_final_fixture_fix.py
          python .github/scripts/worker12_agentic_compat_cleanup.py
      - name: Worker 12 static and architecture gates
        run: |
          git diff --check
          python -m compileall -q minecraft_mod_ai tests tools download_resources.py
          python -m ruff check minecraft_mod_ai/validation_diagnostic_contract.py minecraft_mod_ai/trajectory_memory.py minecraft_mod_ai/agentic_optimization_contract.py minecraft_mod_ai/agent_security_contract.py tools/colab_runtime_setup.py tests/test_worker12_shared_core.py tests/test_agent_security_contract.py --select F,E7,E9
          vulture minecraft_mod_ai/validation_diagnostic_contract.py minecraft_mod_ai/trajectory_memory.py minecraft_mod_ai/agentic_optimization_contract.py minecraft_mod_ai/agent_security_contract.py tools/colab_runtime_setup.py --min-confidence 100
          python tools/validate_colab_notebook.py
      - name: Worker 12 regression suite
        run: |
          python -m pytest -q \
            tests/test_worker12_shared_core.py \
            tests/test_worker10_validation_fail_closed.py \
            tests/test_validation_execution_contract.py \
            tests/test_runtime_bootstrap_clean.py \
            tests/test_runtime_contract_composer.py \
            tests/test_runtime_contract_composer_ownership.py \
            tests/test_runtime_wrapper_signature_integrity.py \
            tests/test_agent_security_contract.py \
            tests/test_remote_store_defaults.py \
            tests/test_remote_trajectory_auth_preflight.py \
            tests/test_colab_prefetch_bootstrap.py \
            tests/test_colab_run_modes.py
      - name: Commit tested source patch
        run: |
          git add minecraft_mod_ai tools tests
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix: close worker12 shared-core trust gaps'
      - name: Rebase, re-test, and push main
        run: |
          set -euo pipefail
          if ! git log -1 --pretty=%s | grep -q '^fix: close worker12 shared-core trust gaps$'; then
            exit 0
          fi
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            python -m pytest -q \
              tests/test_worker12_shared_core.py \
              tests/test_worker10_validation_fail_closed.py \
              tests/test_validation_execution_contract.py \
              tests/test_runtime_bootstrap_clean.py \
              tests/test_runtime_contract_composer.py \
              tests/test_runtime_contract_composer_ownership.py \
              tests/test_runtime_wrapper_signature_integrity.py \
              tests/test_agent_security_contract.py \
              tests/test_remote_store_defaults.py \
              tests/test_remote_trajectory_auth_preflight.py \
              tests/test_colab_prefetch_bootstrap.py \
              tests/test_colab_run_modes.py
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
