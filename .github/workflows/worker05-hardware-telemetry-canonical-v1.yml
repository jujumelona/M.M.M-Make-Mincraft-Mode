name: Worker 05 Hardware Telemetry Canonical V1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/worker05-hardware-telemetry-canonical-v1.yml'

permissions:
  contents: write

jobs:
  canonicalize-hardware-telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply canonical hardware telemetry cleanup
        run: |
          python .github/scripts/worker05_hardware_telemetry_canonical_v1.py
          python .github/scripts/worker05_hardware_lint_fix_v1.py
      - name: Verify hardware telemetry owner
        run: |
          # V1.2: revalidated on canonical liveness owner; zero default auxiliary HTTP probes.
          python -m compileall -q minecraft_mod_ai
          python .github/scripts/debug_repo_audit.py
          ruff check minecraft_mod_ai/llama_server_hardware_policy.py minecraft_mod_ai/runtime_bootstrap.py tests/test_llama_prefill_telemetry_contract.py tests/test_llama_server_hardware_policy.py
          pytest -q tests/test_llama_prefill_telemetry_contract.py tests/test_llama_server_hardware_policy.py tests/test_llama_completion_liveness_contract.py tests/test_llama_sse_error_contract.py tests/test_agent_tool_round_policy.py tests/test_llama_context_safety_contract.py tests/test_agent_context_window_contract.py tests/test_llama_forced_tool_capability_contract.py tests/test_llama_kv_correctness_contract.py
      - name: Commit cleanup to main with verified race retries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(llama): canonicalize native telemetry owner'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main
            python -m compileall -q minecraft_mod_ai
            python .github/scripts/debug_repo_audit.py
            ruff check minecraft_mod_ai/llama_server_hardware_policy.py minecraft_mod_ai/runtime_bootstrap.py tests/test_llama_prefill_telemetry_contract.py tests/test_llama_server_hardware_policy.py
            pytest -q tests/test_llama_prefill_telemetry_contract.py tests/test_llama_server_hardware_policy.py tests/test_llama_completion_liveness_contract.py tests/test_llama_sse_error_contract.py tests/test_agent_tool_round_policy.py tests/test_llama_context_safety_contract.py tests/test_agent_context_window_contract.py tests/test_llama_forced_tool_capability_contract.py tests/test_llama_kv_correctness_contract.py
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 8 ]; then
              echo 'worker05 hardware telemetry push could not acquire current main after 8 verified attempts' >&2
              exit 1
            fi
            sleep 1
          done
