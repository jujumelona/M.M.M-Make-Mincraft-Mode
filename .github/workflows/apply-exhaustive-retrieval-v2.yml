name: apply canonical exhaustive retrieval migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-exhaustive-retrieval-v2.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply exhaustive retrieval migration
        run: |
          python .github/scripts/patch_exhaustive_retrieval.py
          python .github/scripts/canonicalize_exhaustive_retrieval.py
      - name: Remove auto-fixable lint residue
        run: python -m ruff check --fix minecraft_mod_ai/github_adaptive_retrieval.py minecraft_mod_ai/research_grounded_rag_contract.py minecraft_mod_ai/pre_design_research_pipeline.py tests/test_exhaustive_retrieval_contract.py
      - name: Compile
        run: python -m compileall -q minecraft_mod_ai tests
      - name: Lint
        run: python -m ruff check minecraft_mod_ai/github_adaptive_retrieval.py minecraft_mod_ai/research_grounded_rag_contract.py minecraft_mod_ai/pre_design_research_pipeline.py tests/test_exhaustive_retrieval_contract.py
      - name: Run retrieval contract tests
        run: |
          python -m pytest -q tests/test_exhaustive_retrieval_contract.py tests/test_pre_design_rag_root_cause.py tests/test_grounded_rag_runtime_contract.py
      - name: Reject legacy numeric retrieval stops
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('minecraft_mod_ai/github_adaptive_retrieval.py').read_text()
          forbidden = (
              '_search_request_budget',
              '_source_request_budget',
              '_source_byte_budget',
              '_output_byte_budget',
              '_coverage_target',
              'search_request_budget_exhausted',
              'source_request_budget_exhausted',
              'source_byte_budget_exhausted',
              'evidence_coverage_satisfied',
          )
          found = [name for name in forbidden if name in text]
          if found:
              raise SystemExit('legacy numeric retrieval termination remains: ' + ', '.join(found))
          rg = Path('minecraft_mod_ai/research_grounded_rag_contract.py').read_text()
          for name in ('_MAX_EXTERNAL_PROJECTS', '_MAX_SOURCE_TEXT_CHARS'):
              if name in rg:
                  raise SystemExit('legacy result/content truncation remains: ' + name)
          PY
      - name: Commit migrated sources and cleanup
        run: |
          rm -f \
            .github/scripts/patch_exhaustive_retrieval.py \
            .github/scripts/canonicalize_exhaustive_retrieval.py \
            .github/workflows/apply-exhaustive-retrieval.yml \
            .github/workflows/apply-exhaustive-retrieval-v2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'fix: exhaust grounded retrieval frontiers'
          git push origin HEAD:main
