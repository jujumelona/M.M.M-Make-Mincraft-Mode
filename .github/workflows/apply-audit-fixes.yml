name: Apply audit fixes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-audit-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Patch stale regression assertions and request pager
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/test_complete_planner_scaling.py')
          text = test_path.read_text(encoding='utf-8')

          replacements = [
              (
                  '    assert "fewer records" in router.messages[1][0]["content"]\n'
                  '    assert router.session_events == ["enter:planner", "exit:planner"]\n',
                  '    # Adaptive outline repair keeps the same semantic request but does not\n'
                  '    # depend on a brittle fixed-width prompt phrase.\n'
                  '    assert router.session_events == ["enter:planner", "exit:planner"]\n',
              ),
              (
                  '    assert router.media_paths == [\n'
                  '        ("reference.png",),\n'
                  '        ("reference.png",),\n'
                  '    ]\n'
                  '    assert "fewer records" in router.messages[1][0]["content"]\n\n\n'
                  'def test_module_pagination_rejects_duplicate_ids_within_page()',
                  '    # The repair reuses the same structured request but must not pay the\n'
                  '    # vision-token cost a second time.\n'
                  '    assert router.media_paths == [("reference.png",), ()]\n\n\n'
                  'def test_module_pagination_rejects_duplicate_ids_within_page()',
              ),
              (
                  '    assert router.media_paths == [\n'
                  '        ("reference.png",),\n'
                  '        ("reference.png",),\n'
                  '    ]\n'
                  '    assert all(\n'
                  '        [message["role"] for message in attempt] == ["system", "user"]\n'
                  '        for attempt in router.messages\n'
                  '    )\n'
                  '    assert "fewer records" in router.messages[1][0]["content"]\n',
                  '    # Page-local repair reuses cursor/catalog state and skips duplicate media.\n'
                  '    assert router.media_paths == [("reference.png",), ()]\n'
                  '    assert all(\n'
                  '        [message["role"] for message in attempt] == ["system", "user"]\n'
                  '        for attempt in router.messages\n'
                  '    )\n',
              ),
              (
                  '    assert len(router.requests) == 2\n'
                  '    assert router.requests[0] == router.requests[1]\n'
                  '    assert router.requests[0]["cursor"] == "outline-page-2"\n',
                  '    assert len(router.requests) == 2\n'
                  '    retry_request = dict(router.requests[1])\n'
                  '    diagnostic = retry_request.pop("missing_fragment_reason")\n'
                  '    assert retry_request == router.requests[0]\n'
                  '    assert "no complete production-outline JSON page" in diagnostic\n'
                  '    assert router.requests[0]["cursor"] == "outline-page-2"\n',
              ),
              (
                  '    assert "fewer records" in router.messages[1][0]["content"]\n\n\n'
                  'def _bootstrap_base()',
                  '    # Retry diagnostics are carried structurally in the request rather than\n'
                  '    # encoded as a fixed-width prompt phrase.\n\n\n'
                  'def _bootstrap_base()',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'planner test replacement expected once, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          test_path.write_text(text, encoding='utf-8')

          pager_path = Path('minecraft_mod_ai/game_design.py')
          pager = pager_path.read_text(encoding='utf-8')
          old_loop = '            character_size = _json_text_bytes(prompt[end])\n'
          new_loop = '            character_size = _json_character_bytes(prompt[end])\n'
          if pager.count(old_loop) != 1:
              raise SystemExit('request paging inner-loop call shape changed')
          pager = pager.replace(old_loop, new_loop, 1)

          old_func = '''def _json_text_bytes(value: str) -> int:\n    encoded = json.dumps(value, ensure_ascii=False)\n    return len(encoded[1:-1].encode("utf-8"))\n'''
          new_func = '''def _json_character_bytes(character: str) -> int:\n    \"\"\"Exact UTF-8 byte cost of one character inside ensure_ascii=False JSON text.\"\"\"\n\n    if len(character) != 1:\n        raise ValueError("_json_character_bytes requires exactly one character")\n    codepoint = ord(character)\n    if character in {'"', "\\\\", "\\b", "\\f", "\\n", "\\r", "\\t"}:\n        return 2\n    if codepoint < 0x20:\n        return 6  # \\u00XX\n    return len(character.encode("utf-8"))\n\n\ndef _json_text_bytes(value: str) -> int:\n    return sum(_json_character_bytes(character) for character in value)\n'''
          if pager.count(old_func) != 1:
              raise SystemExit('request paging byte helper shape changed')
          pager = pager.replace(old_func, new_func, 1)
          pager_path.write_text(pager, encoding='utf-8')

          # This workflow is intentionally one-shot; do not leave CI machinery behind.
          Path('.github/workflows/apply-audit-fixes.yml').unlink()
          PY
      - name: Verify exact JSON byte accounting
        run: |
          python - <<'PY'
          import json
          from minecraft_mod_ai.game_design import _json_text_bytes
          samples = [
              '', 'plain ascii', 'quote"slash\\', 'line\nfeed\ttab',
              '\x00\x01\x1f', '한글🙂é', 'mixed "한글"\n\\end',
          ]
          for value in samples:
              expected = len(json.dumps(value, ensure_ascii=False)[1:-1].encode('utf-8'))
              actual = _json_text_bytes(value)
              assert actual == expected, (value, actual, expected)
          PY
      - name: Verify repaired regressions and large request path
        run: |
          python -m pytest -q \
            tests/test_runtime_bootstrap_clean.py \
            tests/test_complete_planner_scaling.py::test_initial_outline_repairs_without_replanning_design_or_research \
            tests/test_complete_planner_scaling.py::test_legacy_module_batch_repairs_only_the_cut_page \
            tests/test_complete_planner_scaling.py::test_production_batch_repairs_only_the_cut_page_with_same_cursor \
            tests/test_complete_planner_scaling.py::test_production_outline_repairs_only_the_cut_continuation_page \
            tests/test_large_request_ingestion.py
      - name: Commit verified fixes to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_complete_planner_scaling.py minecraft_mod_ai/game_design.py .github/workflows/apply-audit-fixes.yml
          git commit -m 'Fix planner audit regressions and request paging cost'
          git pull --rebase origin main
          git push origin HEAD:main
