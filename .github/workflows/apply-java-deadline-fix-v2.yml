name: Apply JDT deadline fix v2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-java-deadline-fix-v2.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch and test
        shell: bash
        run: |
          git fetch origin main
          git rebase origin/main
          python -m pip install --disable-pip-version-check -q -e ".[dev]"
          python - <<'PY'
          import base64
          from pathlib import Path

          p = Path("minecraft_mod_ai/java_lsp.py")
          s = p.read_text(encoding="utf-8")

          def one(old, new):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"replacement match count={n}: {old[:100]!r}")
              s = s.replace(old, new, 1)

          one(
              'class JDTWorkspaceBootstrapError(JDTLanguageServerError):\n    """JDT LS started or configured without a usable Java project bootstrap."""\n\n\ndef _configuration_value',
              'class JDTWorkspaceBootstrapError(JDTLanguageServerError):\n    """JDT LS started or configured without a usable Java project bootstrap."""\n\n\ndef _remaining_jdt_deadline(deadline: float, *, operation: str) -> float:\n    remaining = float(deadline) - time.monotonic()\n    if remaining <= 0:\n        raise JDTLanguageServerError(f"JDT LS {operation} deadline exceeded.")\n    return remaining\n\n\ndef _configuration_value',
          )
          one(
              '    def _ensure_rpc_locked(self, root: Path, *, timeout_seconds: int) -> _JsonRpcProcess:\n        rpc = self._rpc\n',
              '    def _ensure_rpc_locked(\n        self,\n        root: Path,\n        *,\n        timeout_seconds: int,\n        deadline: float | None = None,\n    ) -> _JsonRpcProcess:\n        deadline = deadline if deadline is not None else time.monotonic() + float(timeout_seconds)\n        _remaining_jdt_deadline(deadline, operation="session initialization")\n        rpc = self._rpc\n',
          )
          one(
              '                timeout=min(timeout_seconds, 45),\n',
              '                timeout=min(_remaining_jdt_deadline(deadline, operation="initialize"), 45.0),\n',
          )
          one(
              '                timeout_seconds=timeout_seconds,\n                quiet_seconds=min(self.diagnostic_quiet_seconds, 0.25),\n            )\n',
              '                timeout_seconds=timeout_seconds,\n                quiet_seconds=min(self.diagnostic_quiet_seconds, 0.25),\n                deadline=deadline,\n            )\n',
          )
          one(
              '        if timeout_seconds <= 0:\n            raise ValueError("timeout_seconds must be positive.")\n        try:\n            assert_server_safe_source_sets(root)\n',
              '        if timeout_seconds <= 0:\n            raise ValueError("timeout_seconds must be positive.")\n        deadline = time.monotonic() + float(timeout_seconds)\n        try:\n            assert_server_safe_source_sets(root)\n',
          )
          one(
              '            rpc = self._ensure_rpc_locked(root, timeout_seconds=timeout_seconds)\n            diagnostics: dict[str, list[dict[str, Any]]] = {}\n',
              '            _remaining_jdt_deadline(deadline, operation="diagnostics")\n            rpc = self._ensure_rpc_locked(\n                root,\n                timeout_seconds=timeout_seconds,\n                deadline=deadline,\n            )\n            diagnostics: dict[str, list[dict[str, Any]]] = {}\n',
          )
          one(
              '            for page_index, page in enumerate(pages):\n                sources, source_bytes = _read_source_page(\n',
              '            for page_index, page in enumerate(pages):\n                _remaining_jdt_deadline(deadline, operation="diagnostics")\n                sources, source_bytes = _read_source_page(\n',
          )
          one(
              '                        timeout_seconds=timeout_seconds,\n                        quiet_seconds=self.diagnostic_quiet_seconds,\n                    )\n',
              '                        timeout_seconds=_remaining_jdt_deadline(\n                            deadline, operation="diagnostics"\n                        ),\n                        quiet_seconds=self.diagnostic_quiet_seconds,\n                        deadline=deadline,\n                    )\n',
          )
          one(
              '        if timeout_seconds <= 0:\n            raise ValueError("timeout_seconds must be positive.")\n        with self._session_lock:\n            rpc = self._ensure_rpc_locked(root, timeout_seconds=timeout_seconds)\n            result = rpc.request("workspace/symbol", {"query": query}, timeout=timeout_seconds)\n',
              '        if timeout_seconds <= 0:\n            raise ValueError("timeout_seconds must be positive.")\n        deadline = time.monotonic() + float(timeout_seconds)\n        with self._session_lock:\n            _remaining_jdt_deadline(deadline, operation="workspace symbols")\n            rpc = self._ensure_rpc_locked(\n                root,\n                timeout_seconds=timeout_seconds,\n                deadline=deadline,\n            )\n            result = rpc.request(\n                "workspace/symbol",\n                {"query": query},\n                timeout=_remaining_jdt_deadline(deadline, operation="workspace symbols"),\n            )\n',
          )
          one(
              'def _await_java_core_ready(\n    rpc: _JsonRpcProcess,\n    root: Path,\n    *,\n    timeout_seconds: float,\n    quiet_seconds: float,\n) -> None:\n',
              'def _await_java_core_ready(\n    rpc: _JsonRpcProcess,\n    root: Path,\n    *,\n    timeout_seconds: float,\n    quiet_seconds: float,\n    deadline: float | None = None,\n) -> None:\n',
          )
          one(
              '    deadline = time.monotonic() + float(timeout_seconds)\n    version = 1\n',
              '    deadline = deadline if deadline is not None else time.monotonic() + float(timeout_seconds)\n    version = 1\n',
          )
          one(
              '            remaining = max(0.001, deadline - time.monotonic())\n            diagnostics = _collect_diagnostics(\n                rpc,\n                expected_uris={uri},\n                timeout_seconds=remaining,\n                quiet_seconds=quiet_seconds,\n            )\n',
              '            remaining = _remaining_jdt_deadline(deadline, operation="semantic readiness")\n            diagnostics = _collect_diagnostics(\n                rpc,\n                expected_uris={uri},\n                timeout_seconds=remaining,\n                quiet_seconds=quiet_seconds,\n                deadline=deadline,\n            )\n',
          )
          one(
              'def _collect_diagnostics(\n    rpc: _JsonRpcProcess,\n    *,\n    expected_uris: set[str],\n    timeout_seconds: float,\n    quiet_seconds: float,\n) -> dict[str, list[dict[str, Any]]]:\n',
              'def _collect_diagnostics(\n    rpc: _JsonRpcProcess,\n    *,\n    expected_uris: set[str],\n    timeout_seconds: float,\n    quiet_seconds: float,\n    deadline: float | None = None,\n) -> dict[str, list[dict[str, Any]]]:\n',
          )
          one(
              '    diagnostics: dict[str, list[dict[str, Any]]] = {}\n    deadline = time.monotonic() + float(timeout_seconds)\n',
              '    diagnostics: dict[str, list[dict[str, Any]]] = {}\n    deadline = deadline if deadline is not None else time.monotonic() + float(timeout_seconds)\n',
          )
          one(
              '            message = rpc.messages.get(timeout=max(0.001, wait_seconds))\n',
              '            message = rpc.messages.get(timeout=wait_seconds)\n',
          )
          p.write_text(s, encoding="utf-8")
          test_b64 = ''
          Path("tests/test_java_lsp_deadline_budget.py").write_bytes(base64.b64decode(test_b64))
          PY
          python -m compileall -q minecraft_mod_ai/java_lsp.py tests/test_java_lsp_deadline_budget.py
          python -m pytest -q tests/test_java_lsp_deadline_budget.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft_mod_ai/java_lsp.py tests/test_java_lsp_deadline_budget.py
          git commit -m "fix(jdt): enforce end-to-end diagnostics deadline"
          git pull --rebase origin main
          git push origin HEAD:main
