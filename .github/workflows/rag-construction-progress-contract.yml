name: Host Java and Construction Progress Contracts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'minecraft_mod_ai/construction_generation.py'
      - 'minecraft_mod_ai/construction_host_source.py'
      - 'minecraft_mod_ai/construction_host_member_repair.py'
      - 'minecraft_mod_ai/host_java_imports.py'
      - 'minecraft_mod_ai/first_pass_java_source.py'
      - 'minecraft_mod_ai/construction_journal.py'
      - 'minecraft_mod_ai/model_router.py'
      - 'minecraft_mod_ai/llama_structured_decode_policy.py'
      - 'minecraft_mod_ai/construction_source_repair.py'
      - 'minecraft_mod_ai/first_pass_java_declarations.py'
      - 'minecraft_mod_ai/artifact_graph_executor.py'
      - 'minecraft_mod_ai/construction_memory.py'
      - 'minecraft_mod_ai/construction_declaration_choices.py'
      - 'tests/test_first_pass_java_source.py'
      - 'tests/test_host_java_imports.py'
      - 'tests/test_construction_host_source.py'
      - 'tests/test_construction_host_member_repair.py'
      - 'tests/test_construction_java_member_journal.py'
      - 'tests/test_host_java_implementation_transport.py'
      - 'tests/test_native_java_decode_strategy_recovery.py'
      - 'tests/test_artifact_java_source_ports.py'
      - 'tests/test_construction_operation_progress_gate.py'
      - '.github/workflows/rag-construction-progress-contract.yml'

permissions:
  contents: read

concurrency:
  group: rag-construction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Compile changed production entrypoints
        run: |
          python -m py_compile \
            minecraft_mod_ai/construction_generation.py \
            minecraft_mod_ai/construction_host_source.py \
            minecraft_mod_ai/construction_host_member_repair.py \
            minecraft_mod_ai/host_java_imports.py \
            minecraft_mod_ai/first_pass_java_source.py \
            minecraft_mod_ai/construction_journal.py \
            minecraft_mod_ai/model_router.py \
            minecraft_mod_ai/construction_source_repair.py \
            minecraft_mod_ai/first_pass_java_declarations.py \
            minecraft_mod_ai/artifact_graph_executor.py \
            minecraft_mod_ai/construction_declaration_choices.py
      - name: Run regression contracts
        run: |
          python -m pytest -q --maxfail=1 \
            tests/test_first_pass_java_source.py \
            tests/test_host_java_imports.py \
            tests/test_construction_host_source.py \
            tests/test_construction_host_member_repair.py \
            tests/test_construction_java_member_journal.py \
            tests/test_host_java_implementation_transport.py \
            tests/test_native_java_decode_strategy_recovery.py \
            tests/test_artifact_java_source_ports.py \
            tests/test_construction_operation_progress_gate.py
