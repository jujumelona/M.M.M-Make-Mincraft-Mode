name: Cancel exhaustive MTP grid search

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-joint-mtp-max-search.yml

permissions:
  contents: write

concurrency:
  group: mmm-joint-mtp-max-search
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve staged runtime and remove this obsolete workflow
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          runtime = Path('minecraft_mod_ai/llama_server_runtime_tuning.py').read_text(encoding='utf-8')
          assert 'benchmark._mmm_adaptive_cold_search = True' in runtime
          assert 'if _model_supports_mtp(config) and spec is baseline and ngram_values:' in runtime
          assert '_mmm_joint_mtp_grid' not in runtime
          PY
          rm .github/workflows/apply-joint-mtp-max-search.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove exhaustive MTP grid workflow'
          git pull --rebase origin main
          git push origin HEAD:main
