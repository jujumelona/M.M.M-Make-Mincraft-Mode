name: Final small-model CI compatibility repair

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/final_small_model_ci_repair.py'
      - '.github/workflows/final-small-model-ci-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Apply final compatibility repair
        run: python .github/scripts/final_small_model_ci_repair.py
      - name: Install dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Validate final compatibility repair
        run: |
          python -m compileall -q minecraft_mod_ai tests
          ruff check minecraft_mod_ai/agentic_research_game_design.py minecraft_mod_ai/pre_design_domain_research.py tests/test_pre_design_rag_direct_owner.py --select F,E7,E9
          pytest -q tests/test_agentic_research_game_design.py tests/test_pipeline_search_and_structured_repair.py tests/test_pre_design_rag_direct_owner.py tests/test_small_model_predesign_v2.py tests/test_worker03_planner_design_readiness.py
      - name: Commit verified repair
        run: |
          rm -f .github/scripts/final_small_model_ci_repair.py
          rm -f .github/workflows/final-small-model-ci-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: finalize small-model CI contracts'
          git push origin HEAD:main
