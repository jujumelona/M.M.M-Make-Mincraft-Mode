name: Debug repository audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/debug-repo-audit.yml
      - .github/scripts/debug_repo_audit.py
      - .github/scripts/refresh_bootstrap_contract_test.py
      - .github/scripts/apply_debug_batch1.py

permissions:
  contents: write

concurrency:
  group: debug-repo-audit-main
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply first debug repair batch
        run: python .github/scripts/apply_debug_batch1.py
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Verify first debug repair batch
        run: |
          python -m compileall -q minecraft_mod_ai tests tools
          python -m ruff check \
            minecraft_mod_ai/platform_runtime_contract.py \
            minecraft_mod_ai/performance_final_contract.py \
            minecraft_mod_ai/work_graph.py \
            minecraft_mod_ai/scheduler_claim_fencing_contract.py \
            minecraft_mod_ai/production_page_durable_contract.py \
            minecraft_mod_ai/external_mcp_router.py \
            --select F,E7,E9
          node --check integrations/mineflayer-1201/bridge.mjs
          python -m pytest -q \
            tests/test_runtime_manager_concurrency.py \
            tests/test_runtime_policy_v2.py \
            tests/test_external_mcp_router.py \
            tests/test_mineflayer_action_contract.py \
            tests/test_production_page_durable_contract.py \
            tests/test_validation_execution_contract.py \
            tests/test_project_write_concurrency_contract.py -k 'not commit_lane_action'
          git diff --check
      - name: Commit verified first repair batch
        run: |
          if ! git diff --quiet; then
            git add minecraft_mod_ai integrations tests
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Fix runtime concurrency and progress-driven repair defects'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Refresh live bootstrap contract test
        run: python .github/scripts/refresh_bootstrap_contract_test.py
      - name: Verify bootstrap test migration
        run: |
          python -m pytest -q tests/test_runtime_bootstrap_clean.py
          git diff --check
      - name: Static internal import audit
        run: python .github/scripts/debug_repo_audit.py
      - name: Compile all Python
        run: python -m compileall -q minecraft_mod_ai tests tools
      - name: Undefined-name and syntax lint
        run: python -m ruff check minecraft_mod_ai tests tools --select F,E7,E9
      - name: Package and Colab import smoke
        run: |
          python -c "import minecraft_mod_ai; print('package import OK')"
          python -c "from minecraft_mod_ai.colab_run_modes import prepare_existing_mod_input; print('colab import OK')"
      - name: Bootstrap and agent/planner regression
        run: |
          python -m pytest -q \
            tests/test_runtime_bootstrap_clean.py \
            tests/test_agent_tool_calling.py \
            tests/test_agent_tool_runtime_colab_stdio.py \
            tests/test_planner_incremental_repair_contract.py \
            tests/test_complete_planner_scaling.py
      - name: Full test suite
        run: python -m pytest -q
