name: Debug repository audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/debug-repo-audit.yml
      - .github/scripts/debug_repo_audit.py
      - .github/scripts/refresh_bootstrap_contract_test.py

permissions:
  contents: write

concurrency:
  group: debug-repo-audit-main
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh live bootstrap contract test
        run: python .github/scripts/refresh_bootstrap_contract_test.py
      - name: Verify and commit bootstrap test migration
        run: |
          python -m pip install --prefer-binary -e '.[dev]'
          python -m pytest -q tests/test_runtime_bootstrap_clean.py
          git diff --check
          if ! git diff --quiet -- tests/test_runtime_bootstrap_clean.py; then
            git add tests/test_runtime_bootstrap_clean.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Align bootstrap test with live contract owners'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Static internal import audit
        run: python .github/scripts/debug_repo_audit.py
      - name: Compile all Python
        run: python -m compileall -q minecraft_mod_ai tests tools
      - name: Undefined-name and syntax lint
        run: python -m ruff check minecraft_mod_ai tests tools --select F,E7,E9
      - name: Package and Colab import smoke
        run: |
          python -c "import minecraft_mod_ai; print('package import OK')"
          python -c "from minecraft_mod_ai.colab_run_modes import prepare_existing_mod_input; print('colab import OK')"
      - name: Bootstrap and agent/planner regression
        run: |
          python -m pytest -q \
            tests/test_runtime_bootstrap_clean.py \
            tests/test_agent_tool_calling.py \
            tests/test_agent_tool_runtime_colab_stdio.py \
            tests/test_planner_incremental_repair_contract.py \
            tests/test_complete_planner_scaling.py
      - name: Full test suite
        run: python -m pytest -q
