name: Apply large request root fixes v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-large-root-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply paging and neutral-page fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('minecraft_mod_ai/planner_incremental_repair_contract.py')
          s = p.read_text(encoding='utf-8')
          old = '''            if not raw_batches:\n                # Nothing semantic exists to patch. Save the failure and request only\n                # the missing continuation fragment; never redo accepted batches.\n                checkpoint_state.update(\n                    {\n                        "saved_batches": saved_batches,\n                        "last_envelope_error": envelope_error or "no complete batch object",\n                        "status": "awaiting_missing_fragment",\n                    }\n                )\n                _save_checkpoint(checkpoint_path, checkpoint_state)\n                continue\n'''
          new = '''            if not raw_batches:\n                # A valid terminal outline page may legitimately contain zero batches.\n                # Treat it as successful no-op work instead of regenerating forever.\n                if page_complete and not page_next_cursor and not envelope_error:\n                    checkpoint_state.update(\n                        {\n                            "saved_batches": saved_batches,\n                            "pending_batches": [],\n                            "pending_patch": None,\n                            "page_complete": True,\n                            "page_next_cursor": "",\n                            "resume_cursor": "",\n                            "last_envelope_error": "",\n                            "status": "complete",\n                        }\n                    )\n                    _save_checkpoint(checkpoint_path, checkpoint_state)\n                    return _resume_result(checkpoint_state, saved_batches)\n\n                checkpoint_state.update(\n                    {\n                        "saved_batches": saved_batches,\n                        "last_envelope_error": envelope_error or "no complete batch object",\n                        "status": "awaiting_missing_fragment",\n                    }\n                )\n                _save_checkpoint(checkpoint_path, checkpoint_state)\n                continue\n'''
          if old not in s:
              raise SystemExit('neutral-page target changed')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          g = Path('minecraft_mod_ai/game_design.py')
          s = g.read_text(encoding='utf-8')
          old_call = '            character_size = _json_text_bytes(prompt[end])\n'
          if old_call not in s:
              raise SystemExit('paging inner loop target changed')
          s = s.replace(old_call, '            character_size = _json_character_bytes(prompt[end])\n', 1)
          old_func = '''def _json_text_bytes(value: str) -> int:\n    encoded = json.dumps(value, ensure_ascii=False)\n    return len(encoded[1:-1].encode("utf-8"))\n'''
          new_func = '''def _json_character_bytes(character: str) -> int:\n    \"\"\"Exact byte cost of one character inside ensure_ascii=False JSON text.\"\"\"\n    if len(character) != 1:\n        raise ValueError("_json_character_bytes requires exactly one character")\n    codepoint = ord(character)\n    if character in {'"', "\\\\", "\\b", "\\f", "\\n", "\\r", "\\t"}:\n        return 2\n    if codepoint < 0x20:\n        return 6\n    return len(character.encode("utf-8"))\n\n\ndef _json_text_bytes(value: str) -> int:\n    return sum(_json_character_bytes(character) for character in value)\n'''
          if old_func not in s:
              raise SystemExit('paging helper target changed')
          g.write_text(s.replace(old_func, new_func, 1), encoding='utf-8')

          Path('.github/workflows/apply-large-root-v2.yml').unlink()
          PY
      - name: Verify exact byte accounting
        run: |
          python - <<'PY'
          import json
          from minecraft_mod_ai.game_design import _json_text_bytes
          for value in ['', 'ascii', 'quote"slash\\', 'line\nfeed\t', '\x00\x1f', '한글🙂é']:
              expected = len(json.dumps(value, ensure_ascii=False)[1:-1].encode('utf-8'))
              assert _json_text_bytes(value) == expected
          PY
      - name: Verify large request end to end
        run: |
          timeout 120s python -m pytest -q \
            tests/test_large_request_ingestion.py::test_more_than_6144_word_request_is_losslessly_paged_through_production
      - name: Commit verified root fixes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/planner_incremental_repair_contract.py minecraft_mod_ai/game_design.py .github/workflows/apply-large-root-v2.yml
          git commit -m 'Fix large request paging and neutral outline completion'
          git pull --rebase origin main
          git push origin HEAD:main
