name: MMM pre-design liveness retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mmm-predesign-io-retry.yml'

permissions:
  contents: write

concurrency:
  group: mmm-predesign-io-fix-main
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Sync latest main
        run: git pull --ff-only origin main
      - name: Apply pre-design I/O and query scheduler fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          # Reuse the already compiled/tested source-I/O transform verbatim.
          workflow = Path('.github/workflows/mmm-predesign-io-fix.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          program = textwrap.dedent(workflow[start:end])
          exec(compile(program, '<predesign-io-patch>', 'exec'), {'__name__': '__main__'})

          path = Path('minecraft_mod_ai/catalog_first_grounded_rag.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'catalog anchor not found: {old[:180]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'from .planning_mod_discovery import CATALOG_PROVIDERS\n',
              'from .deadline_executor import iter_completed_with_deadlines\nfrom .planning_mod_discovery import CATALOG_PROVIDERS\n',
          )
          replace_once(
              '''Concurrency deliberately lives at the transport/source-fetch leaf. Query and catalog\norchestration stay serial so provider-internal source pools cannot multiply into nested\nquery x catalog x source executor trees.\n''',
              '''Query-level orchestration uses the backend-owned dynamic worker authority and the\nshared deadline executor. Provider/source retrieval remains independently bounded by its\ntransport timeouts, while deterministic output order is reconstructed from authored specs.\n''',
          )
          replace_once(
              '''    by_spec: dict[tuple[str, tuple[str, ...]], dict[str, Any]] = {}\n    for query, providers in specs:\n        try:\n            by_spec[(query, providers)] = _query_bundle(\n                backend,\n                router,\n                query,\n                providers,\n                github_disabled=github_disabled,\n                disable_github=disable_github,\n            )\n        except Exception as exc:\n            by_spec[(query, providers)] = _query_failure(backend, query, exc)\n''',
              '''    by_spec: dict[tuple[str, tuple[str, ...]], dict[str, Any]] = {}\n    if specs:\n        query_workers = backend._query_worker_count(len(specs))\n\n        def run_query_spec(\n            spec: tuple[str, tuple[str, ...]],\n        ) -> tuple[tuple[str, tuple[str, ...]], dict[str, Any]]:\n            query, providers = spec\n            try:\n                row = _query_bundle(\n                    backend,\n                    router,\n                    query,\n                    providers,\n                    github_disabled=github_disabled,\n                    disable_github=disable_github,\n                )\n            except Exception as exc:\n                row = _query_failure(backend, query, exc)\n            return spec, row\n\n        for _spec, result in iter_completed_with_deadlines(\n            tuple(specs),\n            run_query_spec,\n            max_workers=max(1, query_workers),\n            stage="predesign-query-bundles",\n            sort_key=lambda item: (item[0], item[1]),\n        ):\n            spec, row = result\n            by_spec[spec] = row\n''',
          )
          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_predesign_io_deadline_contract.py')
          body = test.read_text(encoding='utf-8')
          body += '''\n\ndef test_catalog_query_scheduler_uses_shared_deadline_executor() -> None:\n    from minecraft_mod_ai import catalog_first_grounded_rag\n\n    source = inspect.getsource(catalog_first_grounded_rag)\n    assert 'backend._query_worker_count(len(specs))' in source\n    assert 'stage="predesign-query-bundles"' in source\n    assert 'iter_completed_with_deadlines' in source\n'''
          test.write_text(body, encoding='utf-8')
          PY
      - name: Compile
        run: |
          python -m py_compile \
            minecraft_mod_ai/pre_design_grounded_rag.py \
            minecraft_mod_ai/catalog_first_grounded_rag.py \
            tests/test_predesign_io_deadline_contract.py
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Run pre-design regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_predesign_io_deadline_contract.py \
            tests/test_pre_design_dynamic_limits.py \
            tests/test_retrieval_liveness_deadline_contract.py \
            tests/test_remaining_bottleneck_contract.py
          mapfile -t rag_tests < <(find tests -maxdepth 1 -type f \( -name '*pre_design*' -o -name '*grounded_rag*' \) ! -name 'test_predesign_io_deadline_contract.py' ! -name 'test_pre_design_dynamic_limits.py' -print)
          if ((${#rag_tests[@]})); then
            python -m pytest -q "${rag_tests[@]}"
          fi
      - name: Check correctness/import regressions
        run: |
          ruff check --select F,I --fix \
            minecraft_mod_ai/pre_design_grounded_rag.py \
            minecraft_mod_ai/catalog_first_grounded_rag.py \
            tests/test_predesign_io_deadline_contract.py
          ruff check --select F,I \
            minecraft_mod_ai/pre_design_grounded_rag.py \
            minecraft_mod_ai/catalog_first_grounded_rag.py \
            tests/test_predesign_io_deadline_contract.py
          python -m py_compile \
            minecraft_mod_ai/pre_design_grounded_rag.py \
            minecraft_mod_ai/catalog_first_grounded_rag.py
      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f \
            .github/workflows/mmm-predesign-io-fix.yml \
            .github/workflows/mmm-predesign-io-retry.yml
          git add \
            minecraft_mod_ai/pre_design_grounded_rag.py \
            minecraft_mod_ai/catalog_first_grounded_rag.py \
            tests/test_predesign_io_deadline_contract.py
          git commit -m 'fix: bound and parallelize pre-design retrieval'
          for attempt in 1 2 3 4; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            git fetch origin main
            sleep $((attempt * 2))
          done
          echo 'failed to push pre-design liveness fixes after retries' >&2
          exit 1
