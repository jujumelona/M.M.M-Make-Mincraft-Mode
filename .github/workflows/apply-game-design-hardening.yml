name: Apply game design hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-game-design-hardening.yml
      - .github/scripts/apply_game_design_hardening.py
      - .github/scripts/fix_game_design_hardening_lint.py
      - minecraft_mod_ai/planner_stage_trace.py

permissions:
  contents: write

concurrency:
  group: apply-game-design-hardening-main
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Apply hardening patch
        run: |
          python .github/scripts/apply_game_design_hardening.py
          python .github/scripts/fix_game_design_hardening_lint.py
      - name: Static verification
        run: |
          python -m compileall -q minecraft_mod_ai tests tools
          python -m ruff check minecraft_mod_ai tests tools --select F,E7,E9
          python .github/scripts/debug_repo_audit.py
          git diff --check
      - name: Structured planner regression
        run: |
          python -m pytest -q \
            tests/test_game_design_router.py \
            tests/test_game_design_plan.py \
            tests/test_openai_compatible_json.py \
            tests/test_planner_strict_json_contract.py \
            tests/test_runtime_bootstrap_clean.py
      - name: Full test suite
        run: python -m pytest -q
      - name: Commit verified source and remove migration files
        run: |
          git rm .github/workflows/apply-game-design-hardening.yml
          git rm .github/scripts/apply_game_design_hardening.py
          git rm .github/scripts/fix_game_design_hardening_lint.py
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden structured game-design generation and repair'
          git pull --rebase origin main
          git push origin HEAD:main
