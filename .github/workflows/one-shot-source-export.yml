name: One-shot Source Export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-source-export.yml'

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Remove git metadata
        shell: bash
        run: rm -rf .git
      - name: Upload current source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: current-source-${{ github.sha }}
          path: .
          include-hidden-files: true
          retention-days: 1
