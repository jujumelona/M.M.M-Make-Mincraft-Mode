name: One-shot Fresh Java Grounding Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-source-export.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Patch grounding and fresh-Java RAG gating
        shell: python
        run: |
          from pathlib import Path

          loop_path = Path('minecraft_mod_ai/progress_aware_tool_loop.py')
          source = loop_path.read_text(encoding='utf-8')
          old = '''    require_rag = bool(\n        role in {"coder", "coder_safe"}\n        and all_names & _RAG_EVIDENCE_TOOLS\n        and (\n            (router._agent_require_fresh_evidence and not host_grounded)\n            or fresh_java_target\n        )\n    )'''
          new = '''    require_rag = bool(\n        role in {"coder", "coder_safe"}\n        and all_names & _RAG_EVIDENCE_TOOLS\n        and not host_grounded\n        and (router._agent_require_fresh_evidence or fresh_java_target)\n    )'''
          if old not in source:
              if new not in source:
                  raise SystemExit('fresh-Java RAG policy shape changed; refusing blind patch')
          else:
              source = source.replace(old, new, 1)
              loop_path.write_text(source, encoding='utf-8')

          grounding_path = Path('minecraft_mod_ai/grounding_policy.py')
          source = grounding_path.read_text(encoding='utf-8')
          old = '''    receipt = project.get("receipt")\n    if not isinstance(receipt, Mapping) or not _positive_observation_count(receipt):\n        return False\n    return bool(\n        str(receipt.get("project_sha256", "")).strip()\n        and str(receipt.get("observations_sha256", "")).strip()\n    )'''
          new = '''    receipt = project.get("receipt")\n    if not isinstance(receipt, Mapping):\n        return False\n    observation_count = receipt.get("observation_count")\n    if observation_count is not None and (\n        type(observation_count) is not int or observation_count <= 0\n    ):\n        return False\n    return bool(\n        str(receipt.get("project_sha256", "")).strip()\n        and str(receipt.get("observations_sha256", "")).strip()\n    )'''
          if old not in source:
              if new not in source:
                  raise SystemExit('grounding receipt policy shape changed; refusing blind patch')
          else:
              source = source.replace(old, new, 1)
              grounding_path.write_text(source, encoding='utf-8')
      - name: Run focused grounding regressions
        shell: bash
        run: |
          python -m compileall -q minecraft_mod_ai/progress_aware_tool_loop.py minecraft_mod_ai/grounding_policy.py
          python -m pytest -q \
            tests/test_progress_aware_fresh_java_rag_gating.py \
            tests/test_fresh_java_host_grounding_contract.py \
            tests/test_fresh_java_grounding_transition.py \
            tests/test_grounding_policy_actionable_evidence.py \
            tests/test_host_grounding_write_scope.py
      - name: Commit repair to main
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No repair diff required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/progress_aware_tool_loop.py minecraft_mod_ai/grounding_policy.py
          git commit -m 'Fix host-grounded fresh Java execution'
          git pull --rebase origin main
          git push origin HEAD:main
