name: CI

on:
  pull_request:
  push:
    branches: [main, feat/real-multimodal-mcp-router]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,ui]'
      - name: Compile
        run: python -m compileall -q minecraft_mod_ai tools mcp_gateway.py download_resources.py
      - name: Notebook contract
        run: python tools/build_colab_notebook.py --check
      - name: Test
        run: pytest -x --tb=short > pytest.log 2>&1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: |
            pytest.log
            tests/
            minecraft_mod_ai/
            config/
          if-no-files-found: error
