name: CI

on:
  pull_request:
  push:
    branches: [main, feat/real-multimodal-mcp-router]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply complete patch bundle
        if: hashFiles('tools/apply_production_patch_bundle.py') != '' && hashFiles('tools/.patch_chunks/READY') != ''
        run: python tools/apply_production_patch_bundle.py
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,ui]'
      - name: Compile
        run: python -m compileall -q minecraft_mod_ai tools mcp_gateway.py download_resources.py
      - name: Test
        run: pytest -x --tb=short > pytest.log 2>&1
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: |
            pytest.log
            tests/
            minecraft_mod_ai/
          if-no-files-found: error
