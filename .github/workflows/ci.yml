name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,ui]'
      - name: Compile Python
        run: python -m compileall -q minecraft_mod_ai tools mcp_gateway.py download_resources.py
      - name: Notebook contract
        run: python tools/build_colab_notebook.py --check
      - name: Unit and contract tests
        run: pytest -q

  complete-reference:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Generate build GameTest and inspect complete reference mod
        run: python tools/verify_complete_reference_ci.py --output /tmp/mmm-complete-reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-reference-evidence
          path: |
            /tmp/mmm-complete-reference/evidence/
            /tmp/mmm-complete-reference/reference-build-result.json
          if-no-files-found: warn

  report-status:
    if: always()
    needs: [contracts, complete-reference]
    runs-on: ubuntu-latest
    steps:
      - name: Publish mmm/ci commit status
        uses: actions/github-script@v7
        env:
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          REFERENCE_RESULT: ${{ needs.complete-reference.result }}
        with:
          script: |
            const success = process.env.CONTRACTS_RESULT === 'success' && process.env.REFERENCE_RESULT === 'success';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: success ? 'success' : 'failure',
              context: 'mmm/ci',
              description: success
                ? 'Python contracts and complete Fabric Gradle/GameTest passed'
                : `contracts=${process.env.CONTRACTS_RESULT}, reference=${process.env.REFERENCE_RESULT}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
