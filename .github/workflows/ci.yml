name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Direct-main development can produce several commits in quick succession. Only the
# newest commit is useful; keeping superseded full suites alive wastes runner time.
concurrency:
  group: ci-audit-v5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'

      - name: Compile Python sources
        run: python -m compileall -q minecraft_mod_ai tests tools download_resources.py

      - name: Import package bootstrap
        run: python -c "import minecraft_mod_ai"

      - name: Validate Mineflayer bridge syntax
        run: node --check integrations/mineflayer-1201/bridge.mjs

      - name: Validate canonical Colab notebook
        run: python tools/validate_colab_notebook.py

      - name: Verify packaged Skill catalog
        run: |
          python tools/package_skills.py
          git diff --exit-code -- minecraft_mod_ai/packaged_skills.json

      - name: Enforce clean runtime composition
        run: python -m pytest -q tests/test_runtime_bootstrap_clean.py

      - name: Enforce planner repair termination
        run: >-
          python -m pytest -q
          tests/test_production_page_durable_contract.py
          tests/test_planner_incremental_repair_contract.py
          tests/test_planner_strict_json_contract.py

      - name: Enforce parallel repair candidate safety
        run: >-
          python -m pytest -q
          tests/test_agentic_search_efficiency_contract.py
          tests/test_repair_candidate_purity_contract.py
          tests/test_llama_parallel_runtime_contract.py
          tests/test_platform_repair_target_contract.py

      - name: Run remaining unit and contract tests
        run: >-
          python -m pytest -vv --tb=short --durations=25 --maxfail=25
          --ignore=tests/test_runtime_bootstrap_clean.py
          --ignore=tests/test_production_page_durable_contract.py
          --ignore=tests/test_planner_incremental_repair_contract.py
          --ignore=tests/test_planner_strict_json_contract.py
          --ignore=tests/test_agentic_search_efficiency_contract.py
          --ignore=tests/test_repair_candidate_purity_contract.py
          --ignore=tests/test_llama_parallel_runtime_contract.py
          --ignore=tests/test_platform_repair_target_contract.py
