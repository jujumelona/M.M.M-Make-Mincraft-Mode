name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write
  statuses: write

concurrency:
  group: ci-audit-v9-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Static and packaging audit
    steps:
      - name: Publish diagnostic run locator
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=pending
          -f context='ci/run-locator'
          -f description='Temporary CI run locator'
          -f target_url="$RUN_URL"
      - uses: actions/checkout@v6
      - name: Migrate stale max-efficiency references
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          adaptive = Path("minecraft_mod_ai/adaptive_execution_hardening.py")
          adaptive_text = adaptive.read_text(encoding="utf-8")
          old_active = "from .max_efficiency_runtime_contract import _active_parallelism"
          new_active = "from .llama_parallel_runtime_contract import _active_parallelism"
          if old_active in adaptive_text:
              adaptive.write_text(adaptive_text.replace(old_active, new_active), encoding="utf-8")

          scaling = Path("minecraft_mod_ai/inference_time_scaling.py")
          lines = scaling.read_text(encoding="utf-8").splitlines(keepends=True)
          marker = "# max_efficiency_runtime_contract uses this ContextVar to stop nested"
          start = next((index for index, line in enumerate(lines) if marker in line), None)
          if start is not None:
              end = next(
                  (
                      index
                      for index in range(start, min(len(lines), start + 16))
                      if lines[index].strip() == "pass"
                  ),
                  None,
              )
              if end is None:
                  raise SystemExit("stale max-efficiency guard terminator was not found")
              del lines[start : end + 1]
              scaling.write_text("".join(lines), encoding="utf-8")

          for path in (adaptive, scaling):
              if "max_efficiency_runtime_contract" in path.read_text(encoding="utf-8"):
                  raise SystemExit(f"stale max-efficiency reference remains in {path}")
          PY
          if git diff --quiet -- minecraft_mod_ai/adaptive_execution_hardening.py minecraft_mod_ai/inference_time_scaling.py; then
            exit 0
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            echo "main advanced; latest main run will apply the migration"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add minecraft_mod_ai/adaptive_execution_hardening.py minecraft_mod_ai/inference_time_scaling.py
          git commit -m 'fix(runtime): remove stale max-efficiency imports'
          git push origin HEAD:main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Audit internal imports and bootstrap contracts
        run: python .github/scripts/debug_repo_audit.py
      - name: Compile Python sources
        run: python -m compileall -q minecraft_mod_ai tests tools download_resources.py
      - name: Enforce dead-code and control-flow hygiene
        run: python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9
      - name: Enforce high-confidence unreachable-code hygiene
        run: vulture minecraft_mod_ai tools download_resources.py --min-confidence 100
      - name: Import package bootstrap
        run: python -c "import minecraft_mod_ai"
      - name: Validate Mineflayer bridge syntax
        run: node --check integrations/mineflayer/bridge.mjs
      - name: Validate canonical Colab notebook
        run: python tools/validate_colab_notebook.py
      - name: Verify packaged Skill catalog
        run: |
          python tools/package_skills.py
          git diff --exit-code -- minecraft_mod_ai/packaged_skills.json

  runtime-clean:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Runtime composition
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Fail-closed runtime composition contracts
        run: >-
          python -m pytest -q
          tests/test_runtime_bootstrap_clean.py
          tests/test_runtime_contract_composer.py
          tests/test_runtime_contract_composer_ownership.py
          tests/test_runtime_wrapper_signature_integrity.py

  mcp-evidence:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Minecraft MCP evidence
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - run: >-
          python -m pytest -q
          tests/test_minecraft_mcp_evidence_contract.py
          tests/test_external_mcp_role_scope.py
          tests/test_research_coordinator.py

  planner-contract:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Planner host template contract
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - run: python -m pytest -q tests/test_planner_template_schema.py

  parallel-repair:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Parallel repair safety
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - run: >-
          python -m pytest -q
          tests/test_agentic_search_efficiency_contract.py
          tests/test_repair_candidate_purity_contract.py
          tests/test_llama_parallel_runtime_contract.py

  remaining-tests:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Remaining tests ${{ matrix.shard }}/3
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev,ui]'
      - name: Run deterministic pytest shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          dedicated = {
              "test_runtime_bootstrap_clean.py",
              "test_runtime_contract_composer.py",
              "test_runtime_contract_composer_ownership.py",
              "test_runtime_wrapper_signature_integrity.py",
              "test_minecraft_mcp_evidence_contract.py",
              "test_external_mcp_role_scope.py",
              "test_research_coordinator.py",
              "test_planner_template_schema.py",
              "test_agentic_search_efficiency_contract.py",
              "test_repair_candidate_purity_contract.py",
              "test_llama_parallel_runtime_contract.py",
          }
          shard = int(os.environ["SHARD"]) - 1
          files = [
              str(path)
              for index, path in enumerate(sorted(Path("tests").glob("test_*.py")))
              if path.name not in dedicated and index % 3 == shard
          ]
          if not files:
              raise SystemExit("pytest shard selected no files")
          raise SystemExit(
              subprocess.call(
                  [
                      sys.executable,
                      "-m",
                      "pytest",
                      "-vv",
                      "--tb=short",
                      "--durations=15",
                      "--maxfail=25",
                      *files,
                  ]
              )
          )
          PY
