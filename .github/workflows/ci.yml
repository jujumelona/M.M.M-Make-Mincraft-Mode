name: CI

on:
  pull_request:
  push:
    branches: [main, feat/real-multimodal-mcp-router]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Compile
        run: python -m compileall -q minecraft_mod_ai mcp_gateway.py download_resources.py
      - name: Test
        run: pytest -x --tb=short > pytest.log 2>&1
      - name: Upload pytest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log
          path: pytest.log
          if-no-files-found: error
