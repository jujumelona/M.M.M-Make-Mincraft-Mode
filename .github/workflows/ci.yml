name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: main-branch-consolidation
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,ui]'
      - name: Consolidate all remote branches into main, verify, then delete
        if: hashFiles('tools/consolidate_all_branches.sh') != '' && hashFiles('docs/branch-consolidation-report.json') == ''
        run: bash tools/consolidate_all_branches.sh
      - name: Compile
        if: hashFiles('tools/consolidate_all_branches.sh') == '' || hashFiles('docs/branch-consolidation-report.json') != ''
        run: python -m compileall -q minecraft_mod_ai tools mcp_gateway.py download_resources.py
      - name: Notebook contract
        if: hashFiles('tools/consolidate_all_branches.sh') == '' || hashFiles('docs/branch-consolidation-report.json') != ''
        run: python tools/build_colab_notebook.py --check
      - name: Test
        if: hashFiles('tools/consolidate_all_branches.sh') == '' || hashFiles('docs/branch-consolidation-report.json') != ''
        run: pytest -q
