name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

concurrency:
  group: ci-audit-v10-${{ github.event_name }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Static and packaging audit
    steps:
      - name: Publish diagnostic run locator
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh api --method POST
          "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=success
          -f context='ci/run-locator'
          -f description='Diagnostic CI run locator published'
          -f target_url="$RUN_URL"
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Audit internal imports and bootstrap contracts
        run: python .github/scripts/debug_repo_audit.py
      - name: Audit runtime mutation budget
        run: |
          python .github/scripts/audit_runtime_mutations.py --output "$RUNNER_TEMP/runtime-mutation-audit.json"
          python - "$RUNNER_TEMP/runtime-mutation-audit.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          behavioral = int(payload["behavioral_count"])
          # Reviewed surface: the prior finalized runtime was 431. The small-model task
          # capsule removes the obsolete pre-finalization authority install and adds the
          # final outer task scope/tool binder plus compact task projection. The measured
          # net reviewed surface is 433. Any further rebinding remains a hard CI failure.
          budget = 433
          print(f"runtime mutation surface: behavioral={behavioral} budget={budget}")
          if behavioral > budget:
              raise SystemExit(
                  f"runtime mutation surface grew from reviewed budget {budget} to {behavioral}"
              )
          PY
      - name: Compile Python sources
        run: python -m compileall -q minecraft_mod_ai tests tools download_resources.py
      - name: Enforce dead-code and control-flow hygiene
        run: python -m ruff check minecraft_mod_ai tests tools download_resources.py --select F,E7,E9
      - name: Enforce high-confidence unreachable-code hygiene
        run: vulture minecraft_mod_ai tools download_resources.py --min-confidence 100
      - name: Import package bootstrap
        run: python -c "import minecraft_mod_ai"
      - name: Validate Mineflayer bridge syntax
        run: node --check integrations/mineflayer/bridge.mjs
      - name: Validate canonical Colab notebook
        run: python tools/validate_colab_notebook.py
      - name: Verify packaged Skill catalog
        run: |
          python tools/package_skills.py
          git diff --exit-code -- minecraft_mod_ai/packaged_skills.json plugins/mmm-minecraft-mod-ai/skills

  runtime-clean:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Runtime composition
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Fail-closed runtime composition contracts
        run: >-
          python -m pytest -q
          tests/test_runtime_bootstrap_clean.py
          tests/test_runtime_contract_composer.py
          tests/test_runtime_contract_composer_ownership.py
          tests/test_runtime_wrapper_signature_integrity.py

  mcp-evidence:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Minecraft MCP evidence
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - run: >-
          python -m pytest -q
          tests/test_minecraft_mcp_evidence_contract.py
          tests/test_external_mcp_role_scope.py
          tests/test_research_coordinator.py

  planner-contract:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Planner host template contract
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - run: python -m pytest -q tests/test_planner_template_schema.py

  ui-contract:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Conversational UI contract
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev,ui]'
      - run: python -m pytest -q tests/test_conversational_ui.py

  parallel-repair:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Parallel repair safety
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --prefer-binary -e '.[dev]'
      - run: >-
          python -m pytest -q
          tests/test_agentic_search_efficiency_contract.py
          tests/test_repair_candidate_purity_contract.py
          tests/test_llama_parallel_runtime_contract.py

  remaining-tests:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Remaining tests ${{ matrix.shard }}/3
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Run deterministic pytest shard with compact diagnostics
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          from tools.ci_test_shard import select_shard

          dedicated = {
              "test_runtime_bootstrap_clean.py",
              "test_runtime_contract_composer.py",
              "test_runtime_contract_composer_ownership.py",
              "test_runtime_wrapper_signature_integrity.py",
              "test_minecraft_mcp_evidence_contract.py",
              "test_external_mcp_role_scope.py",
              "test_research_coordinator.py",
              "test_planner_template_schema.py",
              "test_conversational_ui.py",
              "test_agentic_search_efficiency_contract.py",
              "test_repair_candidate_purity_contract.py",
              "test_llama_parallel_runtime_contract.py",
          }
          shard_number = int(os.environ["SHARD"])
          eligible = [
              path
              for path in Path("tests").glob("test_*.py")
              if path.name not in dedicated
          ]
          files = list(
              select_shard(
                  eligible,
                  shard_number=shard_number,
                  shard_count=3,
              )
          )
          if not files:
              raise SystemExit("pytest shard selected no files")
          raise SystemExit(
              subprocess.call(
                  [
                      sys.executable,
                      "tools/pytest_diagnostics.py",
                      "--log",
                      f"audit/pytest-shard-{shard_number}.log",
                      "--junit",
                      f"audit/pytest-shard-{shard_number}.xml",
                      "--durations",
                      "15",
                      "--maxfail",
                      "25",
                      *files,
                  ]
              )
          )
          PY
      - name: Upload raw pytest diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pytest-shard-${{ matrix.shard }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            audit/pytest-shard-${{ matrix.shard }}.log
            audit/pytest-shard-${{ matrix.shard }}.xml
