name: CI

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Compile Python sources
        run: python -m compileall -q minecraft_mod_ai tests tools mcp_gateway.py download_resources.py

      - name: Import package bootstrap
        run: python -c "import minecraft_mod_ai"

      - name: Validate Mineflayer bridge syntax
        run: node --check integrations/mineflayer-1201/bridge.mjs

      - name: Validate canonical Colab notebook
        run: python tools/validate_colab_notebook.py

      - name: Verify packaged Skill catalog
        run: |
          python tools/package_skills.py
          git diff --exit-code -- minecraft_mod_ai/packaged_skills.json

      - name: Run unit and contract tests
        run: python -m pytest -q
