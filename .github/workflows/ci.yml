name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,ui]'
      - name: Compile
        run: python -m compileall -q minecraft_mod_ai tools mcp_gateway.py download_resources.py
      - name: Notebook contract
        run: python tools/build_colab_notebook.py --check
      - name: Test
        run: pytest -q
