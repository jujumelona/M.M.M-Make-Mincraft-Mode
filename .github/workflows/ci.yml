name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,ui]'
      - name: Compile Python
        run: python -m compileall -q minecraft_mod_ai tools mcp_gateway.py download_resources.py
      - name: Notebook contract
        run: python tools/build_colab_notebook.py --check
      - name: Unit and contract tests
        run: pytest -q

  complete-reference:
    needs: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Generate build GameTest and inspect complete reference mod
        run: python tools/verify_complete_reference_build.py --output /tmp/mmm-complete-reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: complete-reference-evidence
          path: /tmp/mmm-complete-reference/
          if-no-files-found: warn
