name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev,ui]'
      - name: Apply, verify and commit complete main patch
        if: hashFiles('tools/apply_complete_main_patch.py') != '' && hashFiles('tools/.complete_patch_chunks/*.txt') != ''
        run: python tools/apply_complete_main_patch.py
      - name: Compile
        if: hashFiles('tools/apply_complete_main_patch.py') == ''
        run: python -m compileall -q minecraft_mod_ai tools mcp_gateway.py download_resources.py
      - name: Notebook contract
        if: hashFiles('tools/apply_complete_main_patch.py') == ''
        run: python tools/build_colab_notebook.py --check
      - name: Test
        if: hashFiles('tools/apply_complete_main_patch.py') == ''
        run: pytest -q
