name: Resource architecture migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-architecture-migration-main
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Verify exact main baseline
        run: |
          test "$(git branch --show-current)" = "main"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Reconstruct and apply guarded migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          root = Path('tools/.resource_migration_parts')
          parts = sorted(root.glob('part*.txt'))
          if len(parts) != 6:
              raise SystemExit(f'expected 6 migration payload parts, found {len(parts)}')
          payload = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          source = zlib.decompress(base64.b64decode(payload))
          target = Path('tools/migrate_resource_architecture.py')
          target.write_bytes(source)
          compile(source, str(target), 'exec')
          PY
          python tools/migrate_resource_architecture.py
          python - <<'PY'
          from pathlib import Path
          target = Path('minecraft_mod_ai/resource_contracts.py')
          text = target.read_text(encoding='utf-8')
          old = 'from pathlib import Path, PurePosixPath'
          if text.count(old) != 1:
              raise SystemExit('resource_contracts pathlib import anchor mismatch')
          target.write_text(text.replace(old, 'from pathlib import PurePosixPath', 1), encoding='utf-8')
          PY
      - name: Install development dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Compile and static-check changed architecture
        run: |
          python -m compileall -q minecraft_mod_ai tests tools
          python -m ruff check \
            minecraft_mod_ai/resource_contracts.py \
            minecraft_mod_ai/resource_prompt_compiler.py \
            minecraft_mod_ai/model_adapters/image_diffusion.py \
            minecraft_mod_ai/resource_asset_production.py \
            minecraft_mod_ai/complete_spec.py \
            minecraft_mod_ai/production_contract.py \
            minecraft_mod_ai/work_graph.py \
            minecraft_mod_ai/complete_orchestrator_services.py \
            minecraft_mod_ai/complete_orchestrator.py \
            minecraft_mod_ai/extended_content_generator.py \
            tests/test_resource_architecture.py \
            --select F,E7,E9
      - name: Run resource and template contract tests
        run: |
          python -m pytest -q \
            tests/test_resource_architecture.py \
            tests/test_template_runtime_ssot.py
      - name: Validate package bootstrap and template catalog
        run: |
          python -c "import minecraft_mod_ai"
          python - <<'PY'
          from minecraft_mod_ai.task_template_catalog import RUNTIME_TEMPLATE_ROOT
          from minecraft_mod_ai.template_contract_validation import runtime_consumer_roots, validate_catalog
          validate_catalog(RUNTIME_TEMPLATE_ROOT, consumer_roots=runtime_consumer_roots())
          PY
      - name: Remove one-shot migration machinery from proposed result
        run: |
          rm -f tools/migrate_resource_architecture.py
          rm -rf tools/.resource_migration_parts
          rm -f .github/workflows/resource_architecture_migration.yml
      - name: Build validated migration patch
        run: |
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Migration produced no changes"
            exit 1
          fi
          git diff --cached --binary --full-index > /tmp/resource-architecture-migration.patch
          git status --short > /tmp/resource-architecture-migration.status.txt
          test -s /tmp/resource-architecture-migration.patch
      - name: Upload validated migration patch
        uses: actions/upload-artifact@v4
        with:
          name: resource-architecture-migration-${{ github.sha }}
          path: |
            /tmp/resource-architecture-migration.patch
            /tmp/resource-architecture-migration.status.txt
          retention-days: 14
          if-no-files-found: error
