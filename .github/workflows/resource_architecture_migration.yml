name: Resource architecture migration

on:
  push:
    branches: [main]
    paths:
      - 'tools/.resource_migration_parts/**'
      - 'tools/finalize_resource_architecture_migration.py'
      - 'tools/fix_resource_architecture_migration.py'
      - '.github/workflows/resource_architecture_migration.yml'

permissions:
  contents: write

concurrency:
  group: resource-architecture-migration-main
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Verify exact main baseline
        run: |
          test "$(git branch --show-current)" = "main"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Reconstruct and apply guarded migration
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, zlib
          root = Path('tools/.resource_migration_parts')
          parts = sorted(root.glob('part*.txt'))
          if len(parts) != 6:
              raise SystemExit(f'expected 6 migration payload parts, found {len(parts)}')
          payload = ''.join(path.read_text(encoding='utf-8').strip() for path in parts)
          source = zlib.decompress(base64.b64decode(payload))
          target = Path('tools/migrate_resource_architecture.py')
          target.write_bytes(source)
          compile(source, str(target), 'exec')
          PY
          python tools/migrate_resource_architecture.py
          python tools/finalize_resource_architecture_migration.py
          python tools/fix_resource_architecture_migration.py
      - name: Install development dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Compile and static-check changed architecture
        run: |
          python -m compileall -q minecraft_mod_ai tests tools
          python -m ruff check \
            minecraft_mod_ai/resource_contracts.py \
            minecraft_mod_ai/resource_prompt_compiler.py \
            minecraft_mod_ai/model_adapters/image_diffusion.py \
            minecraft_mod_ai/resource_asset_production.py \
            minecraft_mod_ai/asset_resume_efficiency_contract.py \
            minecraft_mod_ai/runtime_bootstrap.py \
            minecraft_mod_ai/complete_spec.py \
            minecraft_mod_ai/production_contract.py \
            minecraft_mod_ai/work_graph.py \
            minecraft_mod_ai/complete_orchestrator_services.py \
            minecraft_mod_ai/complete_orchestrator.py \
            minecraft_mod_ai/extended_content_generator.py \
            tests/test_resource_architecture.py \
            tools/finalize_resource_architecture_migration.py \
            tools/fix_resource_architecture_migration.py \
            --select F,E7,E9
      - name: Run resource and integration tests
        run: |
          set -o pipefail
          python -m pytest -vv \
            tests/test_resource_architecture.py \
            tests/test_template_runtime_ssot.py 2>&1 | tee /tmp/resource-migration-pytest.txt
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resource-migration-pytest-${{ github.sha }}
          path: /tmp/resource-migration-pytest.txt
          retention-days: 2
          if-no-files-found: ignore
      - name: Validate package bootstrap and template catalog
        run: |
          python -c "import minecraft_mod_ai"
          python - <<'PY'
          from minecraft_mod_ai.task_template_catalog import RUNTIME_TEMPLATE_ROOT
          from minecraft_mod_ai.template_contract_validation import runtime_consumer_roots, validate_catalog
          validate_catalog(RUNTIME_TEMPLATE_ROOT, consumer_roots=runtime_consumer_roots())
          PY
      - name: Remove one-shot migration machinery
        run: |
          rm -f tools/migrate_resource_architecture.py
          rm -f tools/finalize_resource_architecture_migration.py
          rm -f tools/fix_resource_architecture_migration.py
          rm -rf tools/.resource_migration_parts
          rm -f .github/workflows/resource_architecture_migration.yml
      - name: Commit and push validated migration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Migration produced no changes"
            exit 1
          fi
          git commit -m "refactor: canonicalize Minecraft resource generation"
          for attempt in 1 2 3; do
            git fetch origin main
            if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
              git rebase origin/main
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 2
          done
          exit 1
