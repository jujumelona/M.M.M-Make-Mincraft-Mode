name: One-shot progress loop fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one_shot_fix_progress_loop.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch host execution state machine
        shell: python
        run: |
          from pathlib import Path

          path = Path("minecraft_mod_ai/progress_aware_tool_loop.py")
          lines = path.read_text(encoding="utf-8").splitlines()

          helper = '''_VERIFIER_UNAVAILABLE_STATUSES = frozenset({
              "UNAVAILABLE", "NOT_RUN", "TIMEOUT", "TIMED_OUT", "UNHEALTHY",
          })
          _VERIFIER_FAIL_STATUSES = frozenset({"FAIL", "FAILED", "ERROR", "INVALID"})
          _VERIFIER_PASS_STATUSES = frozenset({
              "PASS", "PASSED", "OK", "SUCCESS", "SUCCEEDED", "AVAILABLE",
          })


          def _verification_outcome(tool_name: str, payload: Mapping[str, Any]) -> str:
              """Classify verifier semantics independently from transport/runtime health."""
              if not bool(payload.get("ok")):
                  return "UNAVAILABLE"
              result = payload.get("result")
              if not isinstance(result, Mapping):
                  return "PASS"
              status = str(
                  result.get("status") or result.get("state") or result.get("outcome") or ""
              ).strip().upper()
              if status in _VERIFIER_UNAVAILABLE_STATUSES:
                  return "UNAVAILABLE"
              if status in _VERIFIER_FAIL_STATUSES:
                  return "FAIL"
              if status in _VERIFIER_PASS_STATUSES and tool_name not in {
                  "java_diagnostics", "jdt_diagnostics"
              }:
                  return "PASS"
              if result.get("available") is False:
                  return "UNAVAILABLE"
              for key in ("success", "ok"):
                  if key in result and isinstance(result.get(key), bool):
                      return "PASS" if bool(result.get(key)) else "FAIL"
              if "exit_code" in result:
                  try:
                      return "PASS" if int(result.get("exit_code")) == 0 else "FAIL"
                  except (TypeError, ValueError, OverflowError):
                      return "UNAVAILABLE"
              if tool_name in {"java_diagnostics", "jdt_diagnostics"}:
                  from .validation_diagnostic_contract import diagnostic_errors
                  errors = diagnostic_errors(result)
                  if any(
                      str(item.get("code") or "") == "JDT_DIAGNOSTICS_UNAVAILABLE"
                      for item in errors
                  ):
                      return "UNAVAILABLE"
                  return "FAIL" if errors else "PASS"
              return "PASS"


          def _fixed_point_tool_results(
              executed: Sequence[tuple[Any, Mapping[str, Any]]],
          ) -> list[dict[str, Any]]:
              """Use semantic outcomes, not volatile transport text, as loop identity."""
              stable: list[dict[str, Any]] = []
              for call, payload in executed:
                  if call.name in _VERIFY_TOOLS:
                      stable.append({
                          "name": call.name,
                          "verification_outcome": _verification_outcome(call.name, payload),
                      })
                  else:
                      stable.append({
                          "name": call.name,
                          "ok": bool(payload.get("ok")),
                          "failure_code": payload.get("failure_code"),
                      })
              return stable


          '''.splitlines()

          # 1) Install verifier taxonomy immediately before the first public helper.
          if not any(line.startswith("def _verification_outcome(") for line in lines):
              idx = next(i for i, line in enumerate(lines) if line.startswith("def normalize_retrieval_query("))
              lines[idx:idx] = helper

          # 2) A mutation hallucinated during VERIFY must not escape to ACT.
          phase_start = next(i for i, line in enumerate(lines) if "if call.name not in allowed_phase_tools:" in line)
          phase_stop = next(i for i in range(phase_start + 1, len(lines)) if "if is_evidence_tool(call):" in lines[i])
          phase_inserted = False
          for i in range(phase_start, phase_stop):
              if lines[i].strip() == "and implementation_requires_mutation":
                  indent = lines[i][: len(lines[i]) - len(lines[i].lstrip())]
                  if i + 1 >= len(lines) or "state.phase == LoopPhase.OBSERVE" not in lines[i + 1]:
                      lines.insert(i + 1, indent + "and state.phase == LoopPhase.OBSERVE")
                  phase_inserted = True
                  break
          if not phase_inserted:
              raise SystemExit("phase guard location not found")

          # 3) Mutation failure recovery is disabled while verifier owns the phase.
          mutation_start = next(i for i, line in enumerate(lines) if "failure_code = str(payload.get(\"failure_code\")" in line)
          mutation_stop = next(i for i in range(mutation_start + 1, len(lines)) if "mutation failed" in lines[i])
          retry_done = observe_done = False
          for i in range(mutation_start, mutation_stop):
              stripped = lines[i].strip()
              indent = lines[i][: len(lines[i]) - len(lines[i].lstrip())]
              if stripped == "if authority_retry:":
                  lines[i] = indent + "if authority_retry and state.phase != LoopPhase.VERIFY:"
                  retry_done = True
              elif stripped == "elif all_exposed_names & _READ_OBSERVE_TOOLS:":
                  lines[i] = indent + "elif state.phase != LoopPhase.VERIFY and all_exposed_names & _READ_OBSERVE_TOOLS:"
                  observe_done = True
          if not (retry_done and observe_done):
              raise SystemExit("mutation recovery guards not found")

          # 4) Replace the old transport-ok => validation FAIL category error.
          status_idx = next(
              i for i, line in enumerate(lines)
              if 'status = "PASS" if bool(payload.get("ok")) else "FAIL"' in line
          )
          verify_start = status_idx - 1
          base_indent = lines[verify_start][: len(lines[verify_start]) - len(lines[verify_start].lstrip())]
          verify_end = next(
              i for i in range(status_idx + 1, len(lines))
              if lines[i].strip() == "continue" and lines[i].startswith(base_indent + "    ")
          ) + 1
          replacement = [
              base_indent + "if call.name in _VERIFY_TOOLS:",
              base_indent + "    status = _verification_outcome(call.name, payload)",
              base_indent + "    if status == \"UNAVAILABLE\":",
              base_indent + "        # Runtime/tool failure is verifier health, not a source defect.",
              base_indent + "        state.validation_status = \"UNAVAILABLE\"",
              base_indent + "        state.record_failure(",
              base_indent + "            call.name, payload.get(\"error\", \"verification unavailable\")",
              base_indent + "        )",
              base_indent + "        continue",
              base_indent + "    if status != state.validation_status:",
              base_indent + "        state.validation_status = status",
              base_indent + "        turn_made_progress = True",
              base_indent + "    if status == \"FAIL\" and implementation_requires_mutation:",
              base_indent + "        # Only trustworthy verifier evidence may request another edit.",
              base_indent + "        state.record_failure(",
              base_indent + "            call.name, \"verification reported source defects\"",
              base_indent + "        )",
              base_indent + "        state.phase = LoopPhase.ACT",
              base_indent + "    continue",
          ]
          lines[verify_start:verify_end] = replacement

          # 5) Fixed-point identity ignores varying exception prose and includes host state.
          no_progress = next(i for i, line in enumerate(lines) if "state.record_no_progress_result(" in line)
          tool_result_idx = next(
              i for i in range(no_progress, min(no_progress + 40, len(lines)))
              if '"tool_results": results_info,' in lines[i]
          )
          indent = lines[tool_result_idx][: len(lines[tool_result_idx]) - len(lines[tool_result_idx].lstrip())]
          lines[tool_result_idx:tool_result_idx + 1] = [
              indent + '"validation_status": state.validation_status,',
              indent + '"workspace_changed": state.workspace_changed,',
              indent + '"applied_mutations": tuple(state.applied_mutations),',
              indent + '"tool_results": _fixed_point_tool_results(executed),',
          ]

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")

      - name: Syntax check
        run: python -m py_compile minecraft_mod_ai/progress_aware_tool_loop.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft_mod_ai/progress_aware_tool_loop.py
          git commit -m "fix: make verifier progress state trustworthy"
          git push origin HEAD:main
