name: One-shot progress loop fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one_shot_fix_progress_loop.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch host execution state machine
        shell: python
        run: |
          from pathlib import Path

          path = Path("minecraft_mod_ai/progress_aware_tool_loop.py")
          text = path.read_text(encoding="utf-8")

          anchor = '''_VERIFY_TOOLS = frozenset({
              "java_diagnostics",
              "jdt_diagnostics",
              "run_gradle_build",
              "gradle_build",
              "run_gametest",
          })
          '''
          replacement = '''_VERIFY_TOOLS = frozenset({
              "java_diagnostics",
              "jdt_diagnostics",
              "run_gradle_build",
              "gradle_build",
              "run_gametest",
          })

          _VERIFIER_UNAVAILABLE_STATUSES = frozenset({
              "UNAVAILABLE", "NOT_RUN", "TIMEOUT", "TIMED_OUT", "UNHEALTHY",
          })
          _VERIFIER_FAIL_STATUSES = frozenset({
              "FAIL", "FAILED", "ERROR", "INVALID",
          })
          _VERIFIER_PASS_STATUSES = frozenset({
              "PASS", "PASSED", "OK", "SUCCESS", "SUCCEEDED", "AVAILABLE",
          })


          def _verification_outcome(tool_name: str, payload: Mapping[str, Any]) -> str:
              """Classify verifier semantics independently from tool transport success."""

              # execute() sets ok=False only when the tool/runtime call itself raised or
              # was rejected by the host. That is verifier availability, not evidence
              # that the source under test failed validation.
              if not bool(payload.get("ok")):
                  return "UNAVAILABLE"

              result = payload.get("result")
              if not isinstance(result, Mapping):
                  return "PASS"

              status = str(
                  result.get("status")
                  or result.get("state")
                  or result.get("outcome")
                  or ""
              ).strip().upper()
              if status in _VERIFIER_UNAVAILABLE_STATUSES:
                  return "UNAVAILABLE"
              if status in _VERIFIER_FAIL_STATUSES:
                  return "FAIL"
              if status in _VERIFIER_PASS_STATUSES:
                  # For JDT receipts, PASS/AVAILABLE is not enough by itself: severity-1
                  # diagnostics still mean a trustworthy source failure.
                  if tool_name not in {"java_diagnostics", "jdt_diagnostics"}:
                      return "PASS"

              if result.get("available") is False:
                  return "UNAVAILABLE"
              for key in ("success", "ok"):
                  if key in result and isinstance(result.get(key), bool):
                      return "PASS" if bool(result.get(key)) else "FAIL"
              if "exit_code" in result:
                  try:
                      return "PASS" if int(result.get("exit_code")) == 0 else "FAIL"
                  except (TypeError, ValueError, OverflowError):
                      return "UNAVAILABLE"

              if tool_name in {"java_diagnostics", "jdt_diagnostics"}:
                  from .validation_diagnostic_contract import diagnostic_errors

                  errors = diagnostic_errors(result)
                  if any(
                      str(item.get("code") or "") == "JDT_DIAGNOSTICS_UNAVAILABLE"
                      for item in errors
                  ):
                      return "UNAVAILABLE"
                  return "FAIL" if errors else "PASS"

              return "PASS"
          '''
          if text.count(anchor) != 1:
              raise SystemExit("verification helper anchor mismatch")
          text = text.replace(anchor, replacement, 1)

          old = '''                if (
                      call.name in _MUTATION_ACT_TOOLS
                      and implementation_requires_mutation
                      and state.mutation_context is not None
                      and state.mutation_context.is_mutation_ready
                  ):
                      # The target is already localized. A stale mutation emitted during
                      # OBSERVE needs a phase correction, not another retrieval round.
                      state.phase = LoopPhase.ACT
          '''
          new = '''                if (
                      call.name in _MUTATION_ACT_TOOLS
                      and implementation_requires_mutation
                      and state.phase == LoopPhase.OBSERVE
                      and state.mutation_context is not None
                      and state.mutation_context.is_mutation_ready
                  ):
                      # The target is already localized. Only OBSERVE may correct a stale
                      # mutation into ACT. A mutation hallucinated during VERIFY must not
                      # escape the verifier phase or reset liveness accounting.
                      state.phase = LoopPhase.ACT
          '''
          if text.count(old) != 1:
              raise SystemExit("phase-violation anchor mismatch")
          text = text.replace(old, new, 1)

          old = '''                    if authority_retry:
                          # Retrieval cannot expand write authority. Reissue the same
                          # single mutation action against the host-pinned target.
                          state.phase = LoopPhase.ACT
                      elif all_exposed_names & _READ_OBSERVE_TOOLS:
                          state.phase = LoopPhase.OBSERVE
                      state.record_failure(call.name, payload.get("error", "mutation failed"))
          '''
          new = '''                    if (
                          failure_code == "PHASE_PROTOCOL_VIOLATION"
                          and state.phase == LoopPhase.VERIFY
                      ):
                          # VERIFY owns the next transition. An out-of-phase mutation is
                          # an invalid model action, not a reason to re-enter ACT/OBSERVE.
                          pass
                      elif authority_retry:
                          # Retrieval cannot expand write authority. Reissue the same
                          # single mutation action against the host-pinned target.
                          state.phase = LoopPhase.ACT
                      elif all_exposed_names & _READ_OBSERVE_TOOLS:
                          state.phase = LoopPhase.OBSERVE
                      state.record_failure(call.name, payload.get("error", "mutation failed"))
          '''
          if text.count(old) != 1:
              raise SystemExit("authority-retry anchor mismatch")
          text = text.replace(old, new, 1)

          old = '''            if call.name in _VERIFY_TOOLS:
                  status = "PASS" if bool(payload.get("ok")) else "FAIL"
                  if status != state.validation_status:
                      state.validation_status = status
                      turn_made_progress = True
                  if status == "FAIL" and implementation_requires_mutation:
                      state.record_failure(call.name, payload.get("error", "verification FAIL"))
                      state.phase = LoopPhase.ACT
                  continue
          '''
          new = '''            if call.name in _VERIFY_TOOLS:
                  status = _verification_outcome(call.name, payload)
                  if status == "UNAVAILABLE":
                      # Tool/runtime failure does not prove a source defect and therefore
                      # cannot credit semantic progress or pivot VERIFY back into ACT.
                      state.validation_status = "UNAVAILABLE"
                      state.record_failure(
                          call.name,
                          payload.get("error", "verification unavailable"),
                      )
                      continue
                  if status != state.validation_status:
                      state.validation_status = status
                      turn_made_progress = True
                  if status == "FAIL" and implementation_requires_mutation:
                      # Only a trustworthy verifier observation may request another edit.
                      state.record_failure(call.name, "verification reported source defects")
                      state.phase = LoopPhase.ACT
                  continue
          '''
          if text.count(old) != 1:
              raise SystemExit("verify outcome anchor mismatch")
          text = text.replace(old, new, 1)

          old = '''                {
                      "phase_before": phase_before,
                      "phase_after": phase_after,
                      "localization_stage_before": loc_stage_before,
                      "localization_stage_after": loc_stage_after,
                      "mutation_context_after": ctx_after,
                      "model_tool_calls": model_calls_info,
                      "tool_results": results_info,
                  }
          '''
          new = '''                {
                      "phase_before": phase_before,
                      "phase_after": phase_after,
                      "localization_stage_before": loc_stage_before,
                      "localization_stage_after": loc_stage_after,
                      "mutation_context_after": ctx_after,
                      "validation_status": state.validation_status,
                      "workspace_changed": state.workspace_changed,
                      "applied_mutations": tuple(state.applied_mutations),
                      "model_tool_calls": model_calls_info,
                      # Verifier exception strings can contain incidental transport text.
                      # Fixed-point identity uses the semantic verifier outcome instead.
                      "tool_results": [
                          (
                              {
                                  "name": item.get("name"),
                                  "verification_outcome": _verification_outcome(
                                      str(item.get("name") or ""),
                                      next(
                                          payload
                                          for call, payload in executed
                                          if call.name == item.get("name")
                                      ),
                                  ),
                              }
                              if item.get("name") in _VERIFY_TOOLS
                              else item
                          )
                          for item in results_info
                      ],
                  }
          '''
          if text.count(old) != 1:
              raise SystemExit("fixed-point anchor mismatch")
          text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft_mod_ai/progress_aware_tool_loop.py
          git commit -m "fix: make verifier progress state trustworthy"
          git push origin HEAD:main
