name: Regenerate host catalog artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regenerate-host-catalog-artifact.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Regenerate authoritative host catalog
        run: python -m minecraft_mod_ai.populate_version_artifact_rules
      - name: Verify regenerated catalog admissions
        run: python -m pytest -q tests/test_packaged_version_catalog.py tests/test_platform_target_resolution.py tests/test_resolved_version_context.py
      - name: Commit verified catalog only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft_mod_ai/data/host_version_catalog.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Host catalog is already current"
            exit 0
          fi
          git commit -m "fix: reseal host version catalog admissions"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
