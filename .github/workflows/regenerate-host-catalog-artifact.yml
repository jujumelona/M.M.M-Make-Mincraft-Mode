name: Regenerate host catalog artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/regenerate-host-catalog-artifact.yml'

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Regenerate authoritative host catalog
        run: python -m minecraft_mod_ai.populate_version_artifact_rules
      - name: Verify regenerated catalog admissions
        run: python -m pytest -q tests/test_packaged_version_catalog.py
      - name: Upload regenerated catalog
        uses: actions/upload-artifact@v4
        with:
          name: regenerated-host-version-catalog
          path: minecraft_mod_ai/data/host_version_catalog.json
          if-no-files-found: error
          retention-days: 1
