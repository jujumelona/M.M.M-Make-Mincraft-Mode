name: Update coder liveness contract tests once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update_coder_liveness_contract_tests_once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Update obsolete liveness contracts
        run: python .github/scripts/update_coder_liveness_contract_tests_once.py
      - name: Run affected tests
        run: |
          python -m pytest -q \
            tests/test_custom_module_output_continuation.py \
            tests/test_custom_module_structural_repair_efficiency.py \
            tests/test_unified_host_execution_loop.py \
            tests/test_coder_liveness_boundaries.py
      - name: Commit contract update and remove temporary machinery
        run: |
          git rm .github/scripts/update_coder_liveness_contract_tests_once.py .github/workflows/update_coder_liveness_contract_tests_once.yml
          git add \
            tests/test_custom_module_output_continuation.py \
            tests/test_custom_module_structural_repair_efficiency.py \
            tests/test_unified_host_execution_loop.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: align coder liveness contracts with single-owner recovery"
          git push origin HEAD:main
      - name: Remove temporary machinery after failure
        if: failure()
        run: |
          git reset --hard HEAD
          git rm -f .github/scripts/update_coder_liveness_contract_tests_once.py .github/workflows/update_coder_liveness_contract_tests_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove failed liveness contract update machinery"
          git push origin HEAD:main
