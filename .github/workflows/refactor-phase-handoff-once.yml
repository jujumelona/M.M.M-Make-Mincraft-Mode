name: Refactor phase handoff once

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refactor-phase-handoff-once
  cancel-in-progress: false

jobs:
  refactor:
    if: github.event.head_commit.message == 'Run phase handoff ownership cleanup'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Refactor phase handoff ownership
        run: python .github/scripts/refactor_phase_handoff_once.py
      - name: Verify focused behavior
        run: |
          python -m compileall -q minecraft_mod_ai/progress_aware_tool_loop.py tests/test_tool_call_admission_contract.py
          ruff check --fix tests/test_tool_call_admission_contract.py
          ruff check tests/test_tool_call_admission_contract.py
          pytest -q tests/test_tool_call_admission_contract.py
      - name: Reject regressions introduced by this rewrite
        run: |
          python .github/scripts/audit_code_quality_regression.py \
            --base-ref "$GITHUB_SHA" \
            --output /tmp/phase-handoff-quality.json
          cat /tmp/phase-handoff-quality.json
      - name: Commit clean source to main and remove one-shot helpers
        run: |
          set -euo pipefail
          git rm .github/workflows/refactor-phase-handoff-once.yml
          git rm .github/scripts/refactor_phase_handoff_once.py
          git add minecraft_mod_ai/progress_aware_tool_loop.py tests/test_tool_call_admission_contract.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Move phase handoff ownership out of main loop'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git push origin HEAD:main
