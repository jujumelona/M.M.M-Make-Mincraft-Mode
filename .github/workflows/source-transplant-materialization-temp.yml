name: Source transplant materialization temp

on:
  push:
    paths:
      - .github/workflows/source-transplant-materialization-temp.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-transplant-materialization-temp
  cancel-in-progress: false

jobs:
  patch-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install -e . pytest

      - name: Patch source transplant materialization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('minecraft_mod_ai/source_transplant.py')
          text = path.read_text(encoding='utf-8')

          import_anchor = 'import re\nfrom collections import OrderedDict, deque\n'
          import_replacement = 'import re\nfrom collections import OrderedDict, deque\nfrom concurrent.futures import ThreadPoolExecutor\n'
          if 'from concurrent.futures import ThreadPoolExecutor\n' not in text:
              if import_anchor not in text:
                  raise SystemExit('source_transplant import anchor changed')
              text = text.replace(import_anchor, import_replacement, 1)

          helper_anchor = '''def _blob_cache_byte_budget() -> int:\n    configured = _env_int(\n        "MMM_SOURCE_TRANSPLANT_BLOB_CACHE_BYTE_BUDGET",\n        256 * 1024 * 1024,\n        minimum=64 * 1024,\n        maximum=2 * 1024 * 1024 * 1024,\n    )\n    return max(configured, _single_blob_byte_budget())\n'''
          helper_replacement = helper_anchor + '''\n\ndef _materialization_download_workers() -> int:\n    """Bound concurrent immutable donor downloads by an explicit I/O resource budget."""\n\n    return _env_int(\n        "MMM_SOURCE_TRANSPLANT_MATERIALIZE_DOWNLOAD_WORKERS",\n        8,\n        minimum=1,\n        maximum=32,\n    )\n'''
          if 'def _materialization_download_workers() -> int:' not in text:
              if helper_anchor not in text:
                  raise SystemExit('source_transplant helper anchor changed')
              text = text.replace(helper_anchor, helper_replacement, 1)

          start_marker = 'def materialize_source_slices(\n'
          end_marker = '\n\ndef _donor_materialization_key(\n'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('materialize_source_slices start changed')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('materialize_source_slices end changed')
          old = text[start:end]
          required_shapes = (
              'for decision, parsed_donor in validated:',
              'for item in files:',
              'raw = _fetch_blob_bytes(client, repository, blob_sha)',
              'destination.write_bytes(raw)',
          )
          if not all(shape in old for shape in required_shapes):
              raise SystemExit('materialize_source_slices body changed unexpectedly')

          new = '''def materialize_source_slices(\n    project_root: str | Path,\n    reuse_plan: Mapping[str, Any],\n) -> dict[str, Any]:\n    """Refetch pinned donor blobs, verify hashes, and expose them as immutable evidence."""\n\n    root = Path(project_root).expanduser().resolve()\n    decisions = reuse_plan.get("capabilities") if isinstance(reuse_plan, Mapping) else None\n    if not isinstance(decisions, Sequence) or isinstance(decisions, (str, bytes)):\n        return {"schema_version": "mmm/reuse-materialization-v1", "donors": [], "count": 0}\n\n    validated: list[tuple[Mapping[str, Any], DonorSlice]] = []\n    for decision in decisions:\n        if not isinstance(decision, Mapping) or decision.get("mode") not in {"source_transplant", "adapt"}:\n            continue\n        validated.append((decision, validated_reuse_donor(decision)))\n    if not validated:\n        return {"schema_version": "mmm/reuse-materialization-v1", "donors": [], "count": 0}\n\n    target_root = root / ".minecraft_ai" / "reuse" / "donors"\n    target_root.mkdir(parents=True, exist_ok=True)\n\n    token = os.environ.get("GITHUB_TOKEN", "").strip()\n    client = _github_client(token)\n    download_workers = _materialization_download_workers()\n    executor = (\n        ThreadPoolExecutor(\n            max_workers=download_workers,\n            thread_name_prefix="source-transplant-download",\n        )\n        if download_workers > 1\n        else None\n    )\n    receipts: list[dict[str, Any]] = []\n    try:\n        for decision, parsed_donor in validated:\n            donor = parsed_donor.to_dict()\n            repository = parsed_donor.repository\n            commit_sha = parsed_donor.commit_sha\n            files = donor["files"]\n            donor_key = _donor_materialization_key(decision, donor, files)\n            donor_root = target_root / donor_key\n            donor_root.mkdir(parents=True, exist_ok=True)\n\n            prepared: list[tuple[Mapping[str, Any], str, str, str, int]] = []\n            for item in files:\n                if not isinstance(item, Mapping):\n                    raise SourceTransplantError("Malformed donor file manifest.")\n                path = str(item.get("path") or "").replace("\\\\", "/")\n                blob_sha = str(item.get("blob_sha") or "")\n                expected = str(item.get("sha256") or "")\n                expected_size = item.get("size_bytes")\n                if not path or path.startswith("/") or ".." in path.split("/"):\n                    raise SourceTransplantError("Unsafe donor source path.")\n                if type(expected_size) is not int:\n                    raise SourceTransplantError(\n                        f"Pinned donor size is invalid for {repository}@{commit_sha}:{path}."\n                    )\n                prepared.append((item, path, blob_sha, expected, expected_size))\n\n            def fetch_and_verify(\n                spec: tuple[Mapping[str, Any], str, str, str, int],\n            ) -> tuple[Mapping[str, Any], str, str, str, bytes]:\n                item, path, blob_sha, expected, expected_size = spec\n                raw = _fetch_blob_bytes(client, repository, blob_sha)\n                if not raw:\n                    raise SourceTransplantError(\n                        f"Pinned donor blob is empty for {repository}@{commit_sha}:{path}."\n                    )\n                actual = "sha256:" + hashlib.sha256(raw).hexdigest()\n                if actual != expected:\n                    raise SourceTransplantError(\n                        f"Pinned donor hash mismatch for {repository}@{commit_sha}:{path}."\n                    )\n                if len(raw) != expected_size:\n                    raise SourceTransplantError(\n                        f"Pinned donor size mismatch for {repository}@{commit_sha}:{path}."\n                    )\n                return item, path, blob_sha, actual, raw\n\n            # Fetch and verify the whole immutable slice before the first write.\n            # executor.map preserves declared manifest order even when downloads finish out of order.\n            if executor is None:\n                fetched = [fetch_and_verify(spec) for spec in prepared]\n            else:\n                fetched = list(executor.map(fetch_and_verify, prepared))\n\n            written: list[dict[str, Any]] = []\n            for item, path, blob_sha, actual, raw in fetched:\n                destination = (donor_root / path).resolve()\n                destination.relative_to(donor_root.resolve())\n                destination.parent.mkdir(parents=True, exist_ok=True)\n                destination.write_bytes(raw)\n                written.append(\n                    {\n                        "path": str(destination),\n                        "source_path": path,\n                        "blob_sha": blob_sha,\n                        "sha256": actual,\n                        "size_bytes": len(raw),\n                        "symbols": list(item.get("symbols") or ()),\n                    }\n                )\n            manifest = {\n                "repository": repository,\n                "commit_sha": commit_sha,\n                "license_id": donor.get("license_id"),\n                "capability": decision.get("capability"),\n                "required_dependencies": list(donor.get("required_dependencies") or ()),\n                "donor_tests": list(donor.get("donor_tests") or ()),\n                "files": written,\n            }\n            (donor_root / "manifest.json").write_text(\n                json.dumps(manifest, ensure_ascii=False, sort_keys=True, indent=2),\n                encoding="utf-8",\n            )\n            receipts.append(manifest)\n    finally:\n        if executor is not None:\n            executor.shutdown(wait=True, cancel_futures=True)\n        client.close()\n    return {\n        "schema_version": "mmm/reuse-materialization-v1",\n        "donors": receipts,\n        "count": len(receipts),\n    }\n'''
          text = text[:start] + new + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Add focused regression tests
        shell: bash
        run: |
          cat > tests/test_source_transplant_materialization_parallel.py <<'PY'
          from __future__ import annotations

          import hashlib
          import threading
          import time
          from pathlib import Path

          import pytest

          from minecraft_mod_ai import source_transplant as st


          class _FakeClient:
              def __init__(self) -> None:
                  self.closed = False

              def close(self) -> None:
                  self.closed = True


          def _file(path: str, blob_sha: str, payload: bytes) -> st.DonorFile:
              return st.DonorFile(
                  path=path,
                  blob_sha=blob_sha,
                  sha256="sha256:" + hashlib.sha256(payload).hexdigest(),
                  size_bytes=len(payload),
                  symbols=(),
              )


          def _donor(files: tuple[st.DonorFile, ...]) -> st.DonorSlice:
              return st.DonorSlice(
                  capability="parallel-materialization-test",
                  repository="owner/repo",
                  commit_sha="1" * 40,
                  license_id="MIT",
                  source_url="https://github.com/owner/repo",
                  target_compatibility="exact",
                  files=files,
                  seed_files=(),
                  source_symbols=(),
                  required_dependencies=(),
                  donor_tests=(),
                  confidence=1.0,
              )


          def _plan() -> dict[str, object]:
              return {
                  "capabilities": [
                      {
                          "mode": "source_transplant",
                          "capability": "parallel-materialization-test",
                          "donor": {},
                      }
                  ]
              }


          def test_materialization_parallelizes_fetch_but_preserves_manifest_order(
              monkeypatch: pytest.MonkeyPatch,
              tmp_path: Path,
          ) -> None:
              payloads = {
                  "a" * 40: b"first",
                  "b" * 40: b"second",
                  "c" * 40: b"third",
              }
              donor = _donor(
                  (
                      _file("src/First.java", "a" * 40, payloads["a" * 40]),
                      _file("src/Second.java", "b" * 40, payloads["b" * 40]),
                      _file("src/Third.java", "c" * 40, payloads["c" * 40]),
                  )
              )
              fake_client = _FakeClient()
              active = 0
              peak = 0
              lock = threading.Lock()
              delays = {"a" * 40: 0.08, "b" * 40: 0.04, "c" * 40: 0.01}

              def fake_fetch(_client: object, _repository: str, blob_sha: str) -> bytes:
                  nonlocal active, peak
                  with lock:
                      active += 1
                      peak = max(peak, active)
                  try:
                      time.sleep(delays[blob_sha])
                      return payloads[blob_sha]
                  finally:
                      with lock:
                          active -= 1

              monkeypatch.setenv("MMM_SOURCE_TRANSPLANT_MATERIALIZE_DOWNLOAD_WORKERS", "3")
              monkeypatch.setattr(st, "validated_reuse_donor", lambda _decision: donor)
              monkeypatch.setattr(st, "_github_client", lambda _token: fake_client)
              monkeypatch.setattr(st, "_fetch_blob_bytes", fake_fetch)

              result = st.materialize_source_slices(tmp_path, _plan())

              assert peak >= 2
              assert result["count"] == 1
              manifest = result["donors"][0]
              assert [entry["source_path"] for entry in manifest["files"]] == [
                  "src/First.java",
                  "src/Second.java",
                  "src/Third.java",
              ]
              assert [Path(entry["path"]).read_bytes() for entry in manifest["files"]] == [
                  b"first",
                  b"second",
                  b"third",
              ]
              assert fake_client.closed is True


          def test_materialization_hash_failure_writes_no_partial_donor_files(
              monkeypatch: pytest.MonkeyPatch,
              tmp_path: Path,
          ) -> None:
              good = b"good"
              expected = b"expected"
              donor = _donor(
                  (
                      _file("src/Good.java", "d" * 40, good),
                      _file("src/Bad.java", "e" * 40, expected),
                  )
              )
              fake_client = _FakeClient()
              payloads = {"d" * 40: good, "e" * 40: b"wrong"}

              monkeypatch.setenv("MMM_SOURCE_TRANSPLANT_MATERIALIZE_DOWNLOAD_WORKERS", "2")
              monkeypatch.setattr(st, "validated_reuse_donor", lambda _decision: donor)
              monkeypatch.setattr(st, "_github_client", lambda _token: fake_client)
              monkeypatch.setattr(
                  st,
                  "_fetch_blob_bytes",
                  lambda _client, _repository, blob_sha: payloads[blob_sha],
              )

              with pytest.raises(st.SourceTransplantError, match="hash mismatch"):
                  st.materialize_source_slices(tmp_path, _plan())

              assert not [path for path in tmp_path.rglob("*") if path.is_file()]
              assert fake_client.closed is True
          PY

      - name: Run focused verification
        run: |
          python -m py_compile minecraft_mod_ai/source_transplant.py
          python -m pytest -q tests/test_source_transplant_materialization_parallel.py

      - name: Commit production change and remove temp workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/source-transplant-materialization-temp.yml
          git add minecraft_mod_ai/source_transplant.py tests/test_source_transplant_materialization_parallel.py
          git commit -m "Parallelize pinned donor materialization downloads"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
