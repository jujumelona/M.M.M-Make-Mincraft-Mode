name: Fix Semantic V2

on:
  push:
    paths:
      - .github/workflows/fix-semantic-v2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Fix migration matcher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/semantic-termination-apply-v2.yml')
          text = path.read_text(encoding='utf-8')
          old = "          replace_once('    forced_rag_attempts = 0\\n', '')\n"
          new = "          text = ''.join(\n              line for line in text.splitlines(keepends=True)\n              if line.strip() != 'forced_rag_attempts = 0'\n          )\n"
          if text.count(old) != 1:
              raise SystemExit(f'forced-RAG matcher anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/fix-semantic-v2.yml
          git config user.name 'OpenAI semantic migration repair'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix semantic migration forced RAG matcher'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
