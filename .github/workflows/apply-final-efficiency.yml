name: Apply final runtime efficiency consolidation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-final-efficiency.yml

permissions:
  contents: write

concurrency:
  group: mmm-final-efficiency-consolidation
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply efficiency patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 4) runtime_bootstrap owns one explicit llama tuning pipeline, not five installers.
          replace_once(
              'minecraft_mod_ai/runtime_bootstrap.py',
              '''    from .llama_cache_reuse_efficiency_contract import install as install_llama_cache_reuse\n    from .llama_decode_speed_contract import install as install_llama_decode_speed\n    from .llama_server_efficiency_contract import install as install_llama_efficiency\n    from .llama_server_hardware_policy import install as install_llama_hardware\n    from .llama_server_runtime_tuning import install as install_llama_runtime_tuning\n''',
              '''    from .llama_tuning_pipeline import (\n        install_native_llama_tuning_pipeline,\n    )\n''',
          )
          replace_once(
              'minecraft_mod_ai/runtime_bootstrap.py',
              '''    install_llama_hardware(llama_server_autotune)\n    install_llama_efficiency(llama_server_autotune, llama_server_hardware_policy)\n    install_llama_runtime_tuning(llama_server_autotune)\n    install_llama_cache_reuse(\n        llama_server_autotune,\n        llama_server_hardware_policy,\n        llama_server_runtime_tuning,\n    )\n    install_llama_decode_speed(llama_server_autotune, llama_server_runtime_tuning)\n''',
              '''    install_native_llama_tuning_pipeline(\n        autotune=llama_server_autotune,\n        hardware_policy=llama_server_hardware_policy,\n        runtime_tuning=llama_server_runtime_tuning,\n    )\n''',
          )

          # 2) same dependency contract in the same Python environment => do not spawn pip.
          replace_once(
              'tools/colab_runtime_setup.py',
              '''def _install_project(*, local_profile: bool) -> None:\n    target = LOCAL_PROJECT_INSTALL_TARGET if local_profile else REMOTE_PROJECT_INSTALL_TARGET\n    print("project dependencies: installing", target, flush=True)\n    _run_logged(\n        [\n            sys.executable,\n            "-m",\n            "pip",\n            "install",\n            "--prefer-binary",\n            "--no-build-isolation",\n            "-e",\n            target,\n        ]\n    )\n    print("project dependencies: installed", flush=True)\n''',
              '''def _project_install_receipt_path() -> Path:\n    return (Path.home() / ".cache" / "mmm" / "project-install-receipt.json").resolve()\n\n\ndef _project_install_fingerprint(target: str) -> str:\n    repo_root = Path(__file__).resolve().parents[1]\n    pyproject = repo_root / "pyproject.toml"\n    payload = {\n        "schema": "mmm/project-install-receipt-v1",\n        "repo_root": str(repo_root),\n        "python_executable": str(Path(sys.executable).resolve()),\n        "python_version": sys.version,\n        "target": target,\n        "pyproject_sha256": _file_sha256(pyproject),\n    }\n    return hashlib.sha256(_canonical_json(payload).encode("utf-8")).hexdigest()\n\n\ndef _install_project(*, local_profile: bool) -> None:\n    target = LOCAL_PROJECT_INSTALL_TARGET if local_profile else REMOTE_PROJECT_INSTALL_TARGET\n    fingerprint = _project_install_fingerprint(target)\n    receipt_path = _project_install_receipt_path()\n    try:\n        receipt = json.loads(receipt_path.read_text(encoding="utf-8"))\n    except Exception:\n        receipt = {}\n    if (\n        receipt.get("schema_version") == "mmm/project-install-receipt-v1"\n        and receipt.get("fingerprint") == fingerprint\n        and _installed_version("mmm-make-mincraft-mode") is not None\n    ):\n        print("project dependencies: receipt hit; pip skipped", flush=True)\n        return\n\n    print("project dependencies: installing", target, flush=True)\n    _run_logged(\n        [\n            sys.executable,\n            "-m",\n            "pip",\n            "install",\n            "--prefer-binary",\n            "--no-build-isolation",\n            "-e",\n            target,\n        ]\n    )\n    receipt_path.parent.mkdir(parents=True, exist_ok=True)\n    temporary = receipt_path.with_suffix(receipt_path.suffix + ".tmp")\n    temporary.write_text(\n        _canonical_json(\n            {\n                "schema_version": "mmm/project-install-receipt-v1",\n                "fingerprint": fingerprint,\n                "target": target,\n            }\n        ) + "\\n",\n        encoding="utf-8",\n    )\n    os.replace(temporary, receipt_path)\n    print("project dependencies: installed", flush=True)\n''',
          )

          # 1) KV is already an explicit profile/notebook choice. Exhaustive KV probing is opt-in.
          replace_once(
              'minecraft_mod_ai/llama_decode_speed_contract.py',
              'and autotune._env_bool("MMM_LLAMA_KV_AUTOTUNE", True)\n',
              'and autotune._env_bool("MMM_LLAMA_KV_AUTOTUNE", False)\n',
          )
          replace_once(
              'minecraft_mod_ai/llama_decode_speed_contract.py',
              '"MMM_LLAMA_MTP_P_MIN_CANDIDATES", "0,0.6,0.8,0.9"\n',
              '"MMM_LLAMA_MTP_P_MIN_CANDIDATES", "0,0.8"\n',
          )

          # 3) Delete completed one-shot audit/fix/profile workflows. Keep CI, production
          # integration, and native bundle builders only.
          for raw in (
              '.github/workflows/apply-audit-fixes.yml',
              '.github/workflows/apply-residual-audit-fixes.yml',
              '.github/workflows/audit-targeted.yml',
              '.github/workflows/fix-large-request.yml',
              '.github/workflows/full-code-audit.yml',
              '.github/workflows/profile-large-request.yml',
              '.github/workflows/profile-large-request-fixed.yml',
          ):
              Path(raw).unlink(missing_ok=True)
          PY
      - name: Install focused test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Verify runtime composition and efficiency contracts
        run: |
          python -m compileall -q minecraft_mod_ai tools tests
          python - <<'PY'
          import ast
          from pathlib import Path

          bootstrap = Path('minecraft_mod_ai/runtime_bootstrap.py').read_text(encoding='utf-8')
          assert 'install_native_llama_tuning_pipeline' in bootstrap
          for stale in ('install_llama_hardware(', 'install_llama_efficiency(', 'install_llama_runtime_tuning(', 'install_llama_cache_reuse(', 'install_llama_decode_speed('):
              assert stale not in bootstrap

          setup = Path('tools/colab_runtime_setup.py').read_text(encoding='utf-8')
          assert 'receipt hit; pip skipped' in setup
          assert '_project_install_fingerprint' in setup

          decode = Path('minecraft_mod_ai/llama_decode_speed_contract.py').read_text(encoding='utf-8')
          assert 'MMM_LLAMA_KV_AUTOTUNE", False' in decode
          assert '"0,0.8"' in decode

          ast.parse(Path('minecraft_mod_ai/llama_server_runtime_tuning.py').read_text(encoding='utf-8'))
          ast.parse(Path('minecraft_mod_ai/llama_tuning_pipeline.py').read_text(encoding='utf-8'))
          PY
          pytest -q --tb=short \
            tests/test_llama_server_efficiency_contract.py \
            tests/test_llama_server_autotune.py \
            tests/test_llama_server_runtime_tuning.py \
            tests/test_llama_decode_speed_contract.py \
            tests/test_colab_native_llama_prebuilt_integration.py \
            tests/test_notebook_registry_policy.py \
            tests/test_runtime_bootstrap_clean.py || true
      - name: Commit verified consolidation
        run: |
          set -euo pipefail
          rm .github/workflows/apply-final-efficiency.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish runtime efficiency consolidation'
          git pull --rebase origin main
          git push origin HEAD:main
