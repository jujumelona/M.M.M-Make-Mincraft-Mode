name: Clean llama prefill once
on:
  push:
    paths:
      - '.github/workflows/clean_llama_prefill_once.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Refactor prefill ownership into adapter
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          adapter = Path('minecraft_mod_ai/model_adapters/llama_cpp_adapter.py')
          text = adapter.read_text(encoding='utf-8')
          old_payload = '''def _assistant_prefill_calibration_payload(
              original: Mapping[str, Any],
          ) -> dict[str, Any]:
              payload: dict[str, Any] = {
                  "model": original.get("model", "local"),
                  "messages": [
                      {
                          "role": "user",
                          "content": "Calibrate the trailing-assistant template. Generate no tokens.",
                      },
                      {"role": "assistant", "content": _PREFILL_CALIBRATION_SENTINEL},
                  ],
                  "max_tokens": 0,
                  "temperature": 0.0,
              }
              for key in (
                  "chat_template_kwargs",
                  "reasoning_effort",
                  "tools",
                  "tool_choice",
                  "parallel_tool_calls",
              ):
                  if key in original:
                      payload[key] = original[key]
              return payload
          '''
          new_payload = '''def _assistant_prefill_calibration_payload(
              original: Mapping[str, Any],
          ) -> dict[str, Any]:
              """Build a template-only request; calibration must never enter inference."""

              payload: dict[str, Any] = {
                  "model": original.get("model", "local"),
                  "messages": [
                      {
                          "role": "user",
                          "content": "Calibrate the trailing-assistant template. Generate no tokens.",
                      },
                      {"role": "assistant", "content": _PREFILL_CALIBRATION_SENTINEL},
                  ],
              }
              for key in (
                  "chat_template_kwargs",
                  "reasoning_effort",
                  "tools",
                  "tool_choice",
                  "parallel_tool_calls",
              ):
                  if key in original:
                      payload[key] = original[key]
              return payload
          '''
          if old_payload not in text:
              raise SystemExit('adapter calibration payload anchor missing')
          text = text.replace(old_payload, new_payload, 1)

          pattern = re.compile(
              r'''def _calibrate_assistant_prefill_generation_prompt\(\n    server_url: str,\n    original: Mapping\[str, Any\],\n\) -> str:\n.*?\n\ndef _assistant_prefill_server_identity''',
              re.S,
          )
          replacement = '''def _assistant_prefill_apply_template_url(server_url: str) -> str:
              origin = server_url.rstrip("/")
              if origin.endswith("/v1"):
                  origin = origin[:-3].rstrip("/")
              return f"{origin}/apply-template"


          def _post_apply_template(
              server_url: str,
              payload: Mapping[str, Any],
          ) -> Any:
              """Render llama.cpp's chat template without running model inference."""

              read_timeout = _positive_env_float(
                  "MMM_LLAMA_COMPLETION_TIMEOUT_SECONDS",
                  _DEFAULT_COMPLETION_TIMEOUT_SECONDS,
              )
              timeout = httpx.Timeout(
                  connect=30.0,
                  read=read_timeout,
                  write=30.0,
                  pool=30.0,
              )
              endpoint = _assistant_prefill_apply_template_url(server_url)
              try:
                  if httpx.post is not _DEFAULT_HTTPX_POST:
                      return httpx.post(endpoint, json=dict(payload), timeout=timeout)
                  from ..llama_stream_efficiency_contract import _client

                  return _client(server_url).post(
                      endpoint,
                      json=dict(payload),
                      timeout=timeout,
                  )
              except httpx.TimeoutException as exc:
                  raise RuntimeError(
                      "native llama-server apply-template made no readable progress for "
                      f"{read_timeout:.0f}s"
                  ) from exc


          def _calibrate_assistant_prefill_generation_prompt(
              server_url: str,
              original: Mapping[str, Any],
          ) -> str:
              response = _post_apply_template(
                  server_url,
                  _assistant_prefill_calibration_payload(original),
              )
              if response.status_code >= 400:
                  body = _bounded_response_body(response)
                  raise RuntimeError(
                      "assistant-prefill apply-template request was rejected"
                      + (f": {body}" if body else "")
                  )
              data = response.json()
              if not isinstance(data, Mapping):
                  raise TypeError("assistant-prefill apply-template returned invalid JSON")
              prompt = data.get("prompt")
              if not isinstance(prompt, str):
                  raise TypeError("assistant-prefill apply-template returned no rendered prompt")
              if prompt.count(_PREFILL_CALIBRATION_SENTINEL) != 1:
                  raise RuntimeError(
                      "assistant-prefill apply-template sentinel is missing or ambiguous"
                  )
              suffix = prompt.split(_PREFILL_CALIBRATION_SENTINEL, 1)[1]
              if not suffix:
                  raise RuntimeError(
                      "assistant-prefill template suffix is empty or ambiguous"
                  )
              if len(suffix.encode("utf-8")) > _MAX_PREFILL_TEMPLATE_BYTES:
                  raise RuntimeError(
                      "assistant-prefill template suffix is unexpectedly large"
                  )
              return suffix


          def _assistant_prefill_server_identity'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'adapter calibrator replacement count={count}')
          adapter.write_text(text, encoding='utf-8')

          finish = Path('minecraft_mod_ai/llama_finish_reason_contract.py')
          text = finish.read_text(encoding='utf-8')
          text = text.replace('_PREFILL_RESILIENCE_MARKER = "_mmm_nonfatal_prefill_calibration"\n', '', 1)
          text, count = re.subn(
              r'''\ndef _install_nonfatal_prefill_calibration\(llama_cpp_module: Any\) -> None:\n.*?\n\ndef install\(llama_cpp_module: Any\) -> None:\n    """Own completion decoding directly and install non-fatal prefill resilience\."""\n\n    _install_nonfatal_prefill_calibration\(llama_cpp_module\)\n''',
              '''\ndef install(llama_cpp_module: Any) -> None:\n    """Own completion-boundary decoding without mutating prefill policy."""\n''',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'finish-reason prefill wrapper replacement count={count}')
          finish.write_text(text, encoding='utf-8')

          finalization = Path('minecraft_mod_ai/runtime_finalization.py')
          text = finalization.read_text(encoding='utf-8')
          text = text.replace(
              '        from .prefill_calibration_strictness_contract import install as install_prefill_calibration_strictness\n',
              '',
              1,
          )
          text = text.replace(
              '        install_prefill_calibration_strictness(llama_cpp_adapter)\n',
              '',
              1,
          )
          finalization.write_text(text, encoding='utf-8')

          test = Path('tests/test_coder_liveness_boundaries.py')
          text = test.read_text(encoding='utf-8')
          text = text.replace(
              'from minecraft_mod_ai import prefill_calibration_strictness_contract as prefill\n',
              '',
              1,
          )
          text, count = re.subn(
              r'''\ndef test_apply_template_strips_openai_v1_prefix\(monkeypatch\):\n.*?\n\ndef test_recover_does_not_expose_verifiers''',
              '\n\ndef test_recover_does_not_expose_verifiers',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'duplicate apply-template test removal count={count}')
          test.write_text(text, encoding='utf-8')

          contract = Path('minecraft_mod_ai/prefill_calibration_strictness_contract.py')
          if not contract.exists():
              raise SystemExit('prefill contract already missing unexpectedly')
          contract.unlink()

          workflow = Path('.github/workflows/clean_llama_prefill_once.yml')
          workflow.unlink()
          PY
      - name: Verify no temporary or obsolete ownership remains
        run: |
          test ! -e .github/workflows/clean_llama_prefill_once.yml
          test ! -e minecraft_mod_ai/prefill_calibration_strictness_contract.py
          ! git grep -n 'prefill_calibration_strictness_contract' -- ':!*.md'
          ! git grep -n 'max_tokens.*0' minecraft_mod_ai/model_adapters/llama_cpp_adapter.py
          ! find .github -type f \( -iname '*one_shot*' -o -iname '*once*' \) -print | grep .
      - name: Install test dependencies
        run: python -m pip install --prefer-binary -e '.[dev]'
      - name: Run focused clean-code regressions
        run: |
          python -m py_compile \
            minecraft_mod_ai/model_adapters/llama_cpp_adapter.py \
            minecraft_mod_ai/llama_exact_context.py \
            minecraft_mod_ai/llama_finish_reason_contract.py \
            minecraft_mod_ai/runtime_finalization.py
          python -m pytest -q \
            tests/test_llama_assistant_prefill_continuation.py \
            tests/test_llama_finish_reason_contract.py \
            tests/test_coder_liveness_boundaries.py \
            tests/test_llama_exact_context.py
      - name: Commit clean refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: make llama prefill ownership explicit'
          git push origin HEAD:main
      - name: Remove temporary workflow after failure
        if: failure()
        run: |
          git fetch origin main
          git reset --hard origin/main
          if [ -e .github/workflows/clean_llama_prefill_once.yml ]; then
            git rm .github/workflows/clean_llama_prefill_once.yml
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: remove failed cleanup workflow'
            git push origin HEAD:main
          fi
