[mcp_servers.minecraft-dev]
command = "npx"
args = [
    "-y",
    "@mcdxai/minecraft-dev-mcp@1.2.4",
]

[mcp_servers.mmm-frontdoor]
command = "python"
args = [
    "-m",
    "minecraft_mod_ai.mcp_stdio_entrypoint",
    "minecraft_mod_ai.mcp_server",
]

[mcp_servers.mmm-frontdoor.env]
MMM_MCP_STAGE = "frontdoor"
MMM_MODEL_PROFILE = "t4_local"
MMM_WORKSPACE = "mmm-output"

[mcp_servers.mmm-generation]
command = "python"
args = [
    "-m",
    "minecraft_mod_ai.mcp_stdio_entrypoint",
    "minecraft_mod_ai.mod_generation_mcp_server",
]

[mcp_servers.mmm-generation.env]
MMM_MCP_STAGE = "generation"
MMM_MODEL_PROFILE = "t4_local"
MMM_WORKSPACE = "mmm-output"

