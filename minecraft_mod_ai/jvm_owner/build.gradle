plugins { id 'java' }

repositories {
    mavenCentral()
    maven { url = uri('https://repo.gradle.org/gradle/libs-releases') }
}

configurations {
    eclipseRuntime
    embedded
    antRuntime
    implementation.extendsFrom(eclipseRuntime, embedded)
}

dependencies {
    antRuntime 'org.apache.ant:ant:1.10.15'
    eclipseRuntime 'org.eclipse.jdt:org.eclipse.jdt.core:3.46.0'
    eclipseRuntime 'org.eclipse.jdt:org.eclipse.jdt.apt.core:3.8.800'
    eclipseRuntime 'org.eclipse.jdt:org.eclipse.jdt.apt.pluggable.core:1.4.700'
    eclipseRuntime 'org.eclipse.platform:org.eclipse.equinox.launcher:1.6.600'
    eclipseRuntime 'org.apache.felix:org.apache.felix.scr:2.2.14'
    eclipseRuntime 'org.osgi:org.osgi.service.component:1.5.1'
    eclipseRuntime 'org.osgi:org.osgi.util.function:1.2.0'
    eclipseRuntime 'org.osgi:org.osgi.util.promise:1.3.0'
    embedded 'org.gradle:gradle-tooling-api:8.6'
    embedded 'com.google.code.gson:gson:2.11.0'
    embedded 'org.slf4j:slf4j-simple:1.7.36'
}

java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
dependencyLocking { lockAllConfigurations() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

tasks.register('antBundle', Jar) {
    archiveFileName = 'org.apache.ant-1.10.15.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.antRuntime.collect { zipTree(it) } }
    exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.RSA'
    manifest {
        attributes('Bundle-ManifestVersion': '2', 'Bundle-SymbolicName': 'org.apache.ant',
            'Bundle-Version': '1.10.15', 'Export-Package': 'org.apache.tools.ant,org.apache.tools.ant.taskdefs,org.apache.tools.ant.types,org.apache.tools.ant.util,org.apache.tools.ant.launch')
    }
}

jar {
    archiveFileName = 'mmm.owner.jar'
    from(configurations.embedded) { into 'lib' }
    manifest {
        attributes('Bundle-ManifestVersion': '2', 'Bundle-SymbolicName': 'mmm.owner;singleton:=true',
            'Bundle-Version': '1.0.0', 'Bundle-RequiredExecutionEnvironment': 'JavaSE-17',
            'Require-Bundle': 'org.eclipse.core.runtime,org.eclipse.core.resources,org.eclipse.jdt.core,org.eclipse.jdt.core.compiler.batch,org.eclipse.jdt.apt.core,org.eclipse.jdt.apt.pluggable.core,org.eclipse.equinox.app',
            'Bundle-ClassPath': (['.'] + configurations.embedded.collect { 'lib/' + it.name }).join(','))
    }
}

tasks.register('installDist') {
    dependsOn jar, antBundle
    inputs.files(configurations.eclipseRuntime, tasks.jar.archiveFile)
    outputs.dir(layout.buildDirectory.dir('install/owner'))
    doLast {
        def target = layout.buildDirectory.dir('install/owner').get().asFile
        delete(target)
        copy { from configurations.eclipseRuntime; into new File(target, 'plugins') }
        copy { from tasks.jar.archiveFile; into new File(target, 'plugins') }
        copy { from tasks.antBundle.archiveFile; into new File(target, 'plugins') }
        def jars = new File(target, 'plugins').listFiles().findAll { it.name.endsWith('.jar') }
        def framework = jars.find { it.name.startsWith('org.eclipse.osgi-') }
        def bundles = jars.findAll { it != framework && !it.name.startsWith('org.eclipse.equinox.launcher-') }
        def eagerStart = { File jar ->
            if (jar.name.startsWith('org.eclipse.equinox.common-')) return '@2:start'
            if (jar.name.startsWith('org.apache.felix.scr-')) return '@2:start'
            if (jar.name.startsWith('org.eclipse.core.runtime-')) return '@4:start'
            if (jar.name.startsWith('org.eclipse.equinox.app-')) return '@4:start'
            return ''
        }
        def config = new File(target, 'configuration'); config.mkdirs()
        new File(config, 'config.ini').text = 'osgi.framework=' + framework.toURI() + '\n' +
            'osgi.bundles=' + bundles.collect { 'reference:' + it.toURI() + eagerStart(it) }.join(',') + '\n' +
            'osgi.bundles.defaultStartLevel=4\nosgi.configuration.cascaded=false\neclipse.application=mmm.owner.application\n'
    }
}
