# A registered Block also exposes a registered BlockItem for inventory and recipes.
id: fabric/block/register_basic
artifact: java_fragment
target:
  operation: JAVA_PATCH
  file: src/main/java/{{package_path}}/registry/ModBlocks.java
  anchor: "/* MMM:block_registry */"
requires:
  - mod_id
  - registry_path
  - java_constant
  - package_path
dependencies:
  - "{{subject}}.block_key_symbol"
produces:
  - name: block_registry_id
    binding: "{{subject}}.block_registry_id"
    kind: REGISTRY_ID
    target_type: "Block"
    value: "{{mod_id}}:{{registry_path}}"
  - name: block_symbol
    binding: "{{subject}}.block_symbol"
    kind: JAVA_SYMBOL
    target_type: "Block"
    value: "ModBlocks.{{java_constant}}"
  # Crafting recipes refer to Item identities, not Block identities.
  # Publishing this port is valid only because the render also registers BlockItem.
  - name: block_item_registry_id
    binding: "{{subject}}.registry_id"
    kind: REGISTRY_ID
    target_type: "Item"
    value: "{{mod_id}}:{{registry_path}}"
ai_slots: []
render:
  language: java
  body: |
    public static final Block {{java_constant}} =
        Registry.register(
            BuiltInRegistries.BLOCK,
            ModBlockIds.{{java_constant}}_KEY,
            new Block(BlockBehaviour.Properties.of().setId(ModBlockIds.{{java_constant}}_KEY)/* MMM:block_properties:{{registry_path}} */)
        );
    public static final ResourceKey<Item> {{java_constant}}_ITEM_KEY =
        ResourceKey.create(Registries.ITEM, ModBlockIds.{{java_constant}}_KEY.identifier());
    public static final Item {{java_constant}}_ITEM =
        Registry.register(
            BuiltInRegistries.ITEM,
            {{java_constant}}_ITEM_KEY,
            new BlockItem({{java_constant}}, new Item.Properties().setId({{java_constant}}_ITEM_KEY))
        );
validators:
  - java_parse
fixture:
  input:
    mod_id: space
    package_path: com/foo/space
    java_constant: LUNITE_ORE
    registry_path: lunite_ore
  expected_contains:
    - "Registry.register"
    - "BuiltInRegistries.BLOCK"
    - "ModBlockIds.LUNITE_ORE_KEY"
    - "lunite_ore"
    - "LUNITE_ORE"
    - "new BlockItem("
    - "BuiltInRegistries.ITEM"
dependency_types:
  '{{subject}}.block_key_symbol':
    kind: JAVA_SYMBOL
    target_type: ResourceKey<Block>
