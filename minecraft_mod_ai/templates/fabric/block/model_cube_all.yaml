id: fabric/block/model_cube_all
artifact: json_resource
target:
  operation: CREATE_FILE
  file: src/main/resources/assets/{{mod_id}}/models/block/{{registry_path}}.json
requires:
  - mod_id
  - registry_path
dependencies:
  - "{{subject}}.block_registry_id"
produces:
  - name: block_model_ref
    binding: "{{subject}}.block_model_ref"
    kind: MODEL_REF
    target_type: "Block"
    value: "{{mod_id}}:block/{{registry_path}}"
ai_slots: []
render:
  language: json
  body:
    parent: "minecraft:block/cube_all"
    textures:
      all: "{{mod_id}}:block/{{registry_path}}"
validators:
  - json_parse
fixture:
  input:
    mod_id: space
    registry_path: lunite_ore
  expected_contains:
    - "minecraft:block/cube_all"
    - "space:block/lunite_ore"
dependency_types:
  '{{subject}}.block_registry_id':
    kind: REGISTRY_ID
    target_type: Block
