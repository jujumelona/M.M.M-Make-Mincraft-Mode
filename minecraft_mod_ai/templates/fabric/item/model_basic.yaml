id: fabric/item/model_basic
artifact: json_resource
target:
  operation: CREATE_FILE
  file: src/main/resources/assets/{{mod_id}}/models/item/{{registry_path}}.json
requires:
  - mod_id
  - registry_path
dependencies:
  - "{{subject}}.registry_id"
produces:
  - name: model_ref
    binding: "{{subject}}.model_ref"
    kind: MODEL_REF
    target_type: "Item"
    value: "{{mod_id}}:item/{{registry_path}}"
ai_slots: []
render:
  language: json
  body:
    parent: "minecraft:item/generated"
    textures:
      layer0: "{{mod_id}}:item/{{registry_path}}"
validators:
  - json_parse
fixture:
  input:
    mod_id: space
    registry_path: raw_lunite
  expected_contains:
    - "minecraft:item/generated"
    - "space:item/raw_lunite"
dependency_types:
  '{{subject}}.registry_id':
    kind: REGISTRY_ID
    target_type: Item
