id: fabric/item/lang_en
artifact: json_fragment
target:
  operation: JSON_OBJECT_MERGE
  file: src/main/resources/assets/{{mod_id}}/lang/en_us.json
requires:
  - mod_id
  - registry_path
  - display_name
dependencies:
  - "{{subject}}.registry_id"
produces:
  - name: translation_key
    binding: "{{subject}}.translation_key"
    kind: TRANSLATION_KEY
    target_type: "Item"
    value: "item.{{mod_id}}.{{registry_path}}"
ai_slots: []
render:
  language: json
  body:
    "item.{{mod_id}}.{{registry_path}}": "{{display_name}}"
validators:
  - json_parse
fixture:
  input:
    mod_id: space
    registry_path: raw_lunite
    display_name: Raw Lunite
  expected_contains:
    - "item.space.raw_lunite"
    - "Raw Lunite"
dependency_types:
  '{{subject}}.registry_id':
    kind: REGISTRY_ID
    target_type: Item
