id: fabric/item/register_keyed
artifact: java_fragment
target:
  operation: JAVA_PATCH
  file: src/main/java/{{package_path}}/registry/ModItems.java
  anchor: "/* MMM:item_registry */"
requires:
  - mod_id
  - registry_path
  - java_constant
  - package_path
dependencies:
  - "{{subject}}.key_symbol"
produces:
  - name: item_registry_id
    binding: "{{subject}}.registry_id"
    kind: REGISTRY_ID
    target_type: "Item"
    value: "{{mod_id}}:{{registry_path}}"
  - name: item_symbol
    binding: "{{subject}}.java_symbol"
    kind: JAVA_SYMBOL
    target_type: "Item"
    value: "ModItems.{{java_constant}}"
ai_slots: []
render:
  language: java
  body: |
    public static final Item {{java_constant}} =
        Registry.register(
            BuiltInRegistries.ITEM,
            ModItemIds.{{java_constant}}_KEY,
            new Item(new Item.Properties().setId(ModItemIds.{{java_constant}}_KEY)/* MMM:properties:{{registry_path}} */)
        );
validators:
  - java_parse
  - registry_identifier_unique
fixture:
  input:
    mod_id: space
    package_path: com/foo/space
    java_constant: RAW_LUNITE
    registry_path: raw_lunite
  expected_contains:
    - "Registry.register"
    - "BuiltInRegistries.ITEM"
    - "ModItemIds.RAW_LUNITE_KEY"
    - ".setId(ModItemIds.RAW_LUNITE_KEY)"
    - "RAW_LUNITE"
dependency_types:
  '{{subject}}.key_symbol':
    kind: JAVA_SYMBOL
    target_type: ResourceKey<Item>
