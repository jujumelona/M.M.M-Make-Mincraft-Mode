id: fabric/item/register_basic
artifact: java_fragment
target:
  file: src/main/java/{{package_path}}/registry/ModItems.java
  anchor: "/* MMM:item_registry */"
requires:
  - mod_id
  - registry_path
  - java_constant
  - package_path
produces:
  - item_registry_id
  - item_symbol
ai_slots: []
render:
  language: java
  body: |
    public static final Item {{java_constant}} =
        Registry.register(
            BuiltInRegistries.ITEM,
            ModItemIds.{{java_constant}}_KEY,
            new Item(new Item.Properties().setId(ModItemIds.{{java_constant}}_KEY)/* MMM:properties:{{registry_path}} */)
        );
validators:
  - java_parse
  - registry_identifier_unique
fixture:
  input:
    mod_id: space
    package_path: com/foo/space
    java_constant: RAW_LUNITE
    registry_path: raw_lunite
  expected_contains:
    - "Registry.register"
    - "BuiltInRegistries.ITEM"
    - "ModItemIds.RAW_LUNITE_KEY"
    - "raw_lunite"
    - "RAW_LUNITE"
