id: minecraft/network_payload/requirement
task: Implement only the requirement responsibility of the supplied network payload
  artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: network_payload_identity
  type: identifier
  required: true
outputs:
- name: network_payload_contract
  type: contract_receipt
host_requirements:
  capabilities:
  - NETWORKING
implementation_key: fabric/network_payload/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/network_payload/requirement
  writable_anchors:
  - /* MMM:network_payload_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- symbol
- test
rules:
- Implement requirement responsibility for network_payload strictly within declared
  NETWORKING capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required network_payload prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy semantic_contract validator before completion.
