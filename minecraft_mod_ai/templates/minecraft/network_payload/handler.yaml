id: minecraft/network_payload/handler
task: Implement only the handler responsibility of the supplied network payload artifact.
execution_mode: model
side:
- common
inputs:
- name: network_payload_identity
  type: identifier
  required: true
- name: network_payload_handler_input
  type: specification
  required: true
outputs:
- name: network_payload_handler_receipt
  type: receipt
- name: network_payload_handler_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - NETWORK_PACKET
  symbols:
  - register_item
  schemas: []
implementation_key: fabric/network_payload/handler
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - network_payload_properties
repair:
  scope:
  - minecraft/network_payload/handler
  writable_anchors:
  - /* MMM:network_payload_handler */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- handler
anchor_kinds:
- symbol
- test
rules:
- Implement handler responsibility for network_payload strictly within declared NETWORKING
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required network_payload prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- network_payload handler matches host version contract
- network_payload handler receipts emitted with verified context
