id: minecraft/loot/requirement
task: Implement only the requirement responsibility of the supplied loot artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: loot_identity
  type: identifier
  required: true
- name: loot_requirement_input
  type: specification
  required: true
outputs:
- name: loot_requirement_receipt
  type: receipt
- name: loot_requirement_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - LOOT_TABLE
  symbols: []
  schemas:
  - fabric/loot/block_drop
implementation_key: fabric/loot/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - loot_properties
repair:
  scope:
  - minecraft/loot/requirement
  writable_anchors:
  - /* MMM:loot_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- resource
- test
rules:
- Implement requirement responsibility for loot strictly within declared LOOT_TABLE
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required loot prerequisite receipt is missing; never invent defaults.
- Output must satisfy semantic_contract validator before completion.
postconditions:
- loot requirement matches host version contract
- loot requirement receipts emitted with verified context
