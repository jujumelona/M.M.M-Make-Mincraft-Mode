id: minecraft/loot/identifier
task: Implement only the identifier responsibility of the supplied loot artifact.
execution_mode: model
side:
- common
inputs:
- name: loot_identity
  type: identifier
  required: true
- name: loot_identifier_input
  type: specification
  required: true
outputs:
- name: loot_identifier_receipt
  type: receipt
- name: loot_identifier_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - LOOT_TABLE
  symbols: []
  schemas:
  - fabric/loot/block_drop
implementation_key: fabric/loot/identifier
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - loot_properties
repair:
  scope:
  - minecraft/loot/identifier
  writable_anchors:
  - /* MMM:loot_identifier */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- identifier
anchor_kinds:
- resource
- test
rules:
- Implement identifier responsibility for loot strictly within declared LOOT_TABLE
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required loot prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- loot identifier matches host version contract
- loot identifier receipts emitted with verified context
