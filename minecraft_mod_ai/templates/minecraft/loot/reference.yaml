id: minecraft/loot/reference
task: Implement only the reference responsibility of the supplied loot artifact.
execution_mode: model
side:
- common
inputs:
- name: loot_identity
  type: identifier
  required: true
outputs:
- name: loot_reference_receipt
  type: receipt
host_requirements:
  capabilities:
  - LOOT_TABLE
implementation_key: fabric/loot/reference
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/loot/reference
  writable_anchors:
  - /* MMM:loot_reference */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- reference
anchor_kinds:
- resource
- test
rules:
- Implement reference responsibility for loot strictly within declared LOOT_TABLE
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required loot prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
