id: minecraft/loot/entry
task: Implement only the entry responsibility of the supplied loot artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: drop_table
  type: json_object
  required: true
outputs:
- name: loot_json
  type: resource_file
host_requirements:
  capabilities:
  - LOOT_TABLE
implementation_key: fabric/loot/block_drop
validators:
- json_schema
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
repair:
  scope:
  - minecraft/loot/entry
  writable_anchors:
  - /* MMM:loot_entry */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- entry
anchor_kinds:
- resource
- test
rules:
- Use the supplied artifact identity and acceptance contract.
- Use only target-compatible symbols verified in the supplied bindings.
- If this concern is inapplicable, record its concrete reason and perform no edit.
- If information is missing, return blocked; never invent a default implementation.
- Modify only the owned anchor for this responsibility.
- Complete only after its declared postcondition is checked.
