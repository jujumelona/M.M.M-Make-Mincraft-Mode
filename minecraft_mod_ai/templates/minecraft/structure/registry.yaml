id: minecraft/structure/registry
task: Implement only the registry responsibility of the supplied structure artifact.
execution_mode: model
side:
- server
inputs:
- name: structure_identity
  type: identifier
  required: true
outputs:
- name: structure_registry_id
  type: string
- name: structure_java_symbol
  type: string
host_requirements:
  capabilities:
  - WORLDGEN_STRUCTURE
implementation_key: fabric/structure/registry
validators:
- java_parse
- registry_identifier_unique
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - java_constant
repair:
  scope:
  - minecraft/structure/registry
  writable_anchors:
  - /* MMM:structure_registry */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- registry
anchor_kinds:
- registry_id
- symbol
- test
rules:
- Implement registry responsibility for structure strictly within declared WORLDGEN_STRUCTURE
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required structure prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
