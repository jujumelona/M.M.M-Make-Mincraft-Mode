id: minecraft/structure/pool
task: Implement only the pool responsibility of the supplied structure artifact.
execution_mode: model
side:
- common
inputs:
- name: structure_identity
  type: identifier
  required: true
- name: structure_pool_input
  type: specification
  required: true
outputs:
- name: structure_pool_receipt
  type: receipt
- name: structure_pool_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - WORLDGEN_FEATURE
  symbols: []
  schemas: []
implementation_key: fabric/structure/pool
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - structure_properties
repair:
  scope:
  - minecraft/structure/pool
  writable_anchors:
  - /* MMM:structure_pool */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- pool
anchor_kinds:
- symbol
- test
rules:
- Implement pool responsibility for structure strictly within declared WORLDGEN_STRUCTURE
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required structure prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy json_schema validator before completion.
postconditions:
- structure pool matches host version contract
- structure pool receipts emitted with verified context
