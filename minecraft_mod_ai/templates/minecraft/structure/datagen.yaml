id: minecraft/structure/datagen
task: Implement only the datagen responsibility of the supplied structure artifact.
execution_mode: deterministic
side:
- server
inputs:
- name: structure_identity
  type: identifier
  required: true
outputs:
- name: structure_datagen_receipt
  type: receipt
host_requirements:
  capabilities:
  - WORLDGEN_STRUCTURE
implementation_key: fabric/structure/datagen
validators:
- json_schema
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/structure/datagen
  writable_anchors:
  - /* MMM:structure_datagen */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- datagen
anchor_kinds:
- symbol
- test
rules:
- Implement datagen responsibility for structure strictly within declared WORLDGEN_STRUCTURE
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required structure prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy json_schema validator before completion.
