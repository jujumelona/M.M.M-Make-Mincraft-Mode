id: minecraft/structure/integration
task: Implement only the integration responsibility of the supplied structure artifact.
execution_mode: model
side:
- common
inputs:
- name: structure_identity
  type: identifier
  required: true
- name: structure_integration_input
  type: specification
  required: true
outputs:
- name: structure_integration_receipt
  type: receipt
- name: structure_integration_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - WORLDGEN_FEATURE
  symbols: []
  schemas: []
implementation_key: fabric/structure/integration
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - structure_properties
repair:
  scope:
  - minecraft/structure/integration
  writable_anchors:
  - /* MMM:structure_integration */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- integration
anchor_kinds:
- symbol
- test
rules:
- Implement integration responsibility for structure strictly within declared WORLDGEN_STRUCTURE
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required structure prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- structure integration matches host version contract
- structure integration receipts emitted with verified context
