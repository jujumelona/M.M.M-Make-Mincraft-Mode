id: minecraft/structure/validation
task: Implement only the validation responsibility of the supplied structure artifact.
execution_mode: deterministic
side:
- server
inputs:
- name: structure_identity
  type: identifier
  required: true
outputs:
- name: structure_validation_receipt
  type: receipt
host_requirements:
  capabilities:
  - WORLDGEN_STRUCTURE
implementation_key: fabric/structure/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/structure/validation
  writable_anchors:
  - /* MMM:structure_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- symbol
- test
rules:
- Implement validation responsibility for structure strictly within declared WORLDGEN_STRUCTURE
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required structure prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy mod_integration_test validator before completion.
