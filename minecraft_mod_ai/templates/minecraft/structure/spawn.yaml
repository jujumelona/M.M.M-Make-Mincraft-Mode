id: minecraft/structure/spawn
task: Implement only the spawn responsibility of the supplied structure artifact.
execution_mode: model
side:
- server
inputs:
- name: structure_identity
  type: identifier
  required: true
outputs:
- name: structure_spawn_receipt
  type: receipt
host_requirements:
  capabilities:
  - WORLDGEN_STRUCTURE
implementation_key: fabric/structure/spawn
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/structure/spawn
  writable_anchors:
  - /* MMM:structure_spawn */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- spawn
anchor_kinds:
- symbol
- test
rules:
- Implement spawn responsibility for structure strictly within declared WORLDGEN_STRUCTURE
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required structure prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
