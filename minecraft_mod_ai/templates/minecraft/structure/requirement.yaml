id: minecraft/structure/requirement
task: Implement only the requirement responsibility of the supplied structure artifact.
execution_mode: deterministic
side:
- server
inputs:
- name: structure_identity
  type: identifier
  required: true
outputs:
- name: structure_contract
  type: contract_receipt
host_requirements:
  capabilities:
  - WORLDGEN_STRUCTURE
implementation_key: fabric/structure/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/structure/requirement
  writable_anchors:
  - /* MMM:structure_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- symbol
- test
rules:
- Implement requirement responsibility for structure strictly within declared WORLDGEN_STRUCTURE
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required structure prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy semantic_contract validator before completion.
