id: minecraft/datagen/integration
task: Implement only the integration responsibility of the supplied datagen artifact.
execution_mode: model
side:
- common
inputs:
- name: datagen_identity
  type: identifier
  required: true
outputs:
- name: datagen_integration_receipt
  type: receipt
host_requirements:
  capabilities:
  - DATA_GENERATOR
implementation_key: fabric/datagen/integration
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/datagen/integration
  writable_anchors:
  - /* MMM:datagen_integration */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- integration
anchor_kinds:
- symbol
- test
rules:
- Implement integration responsibility for datagen strictly within declared DATA_GENERATOR
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required datagen prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
