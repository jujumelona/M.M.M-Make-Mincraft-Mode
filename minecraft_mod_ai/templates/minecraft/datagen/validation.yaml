id: minecraft/datagen/validation
task: Implement only the validation responsibility of the supplied datagen artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: datagen_identity
  type: identifier
  required: true
outputs:
- name: datagen_validation_receipt
  type: receipt
host_requirements:
  capabilities:
  - DATA_GENERATOR
implementation_key: fabric/datagen/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/datagen/validation
  writable_anchors:
  - /* MMM:datagen_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- symbol
- test
rules:
- Implement validation responsibility for datagen strictly within declared DATA_GENERATOR
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required datagen prerequisite receipt is missing; never invent defaults.
- Output must satisfy mod_integration_test validator before completion.
