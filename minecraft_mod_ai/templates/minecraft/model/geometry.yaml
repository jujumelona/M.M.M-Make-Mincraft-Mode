id: minecraft/model/geometry
task: Implement only the geometry responsibility of the supplied model artifact.
execution_mode: model
side:
- common
inputs:
- name: model_identity
  type: identifier
  required: true
- name: model_geometry_input
  type: specification
  required: true
outputs:
- name: model_geometry_receipt
  type: receipt
- name: model_geometry_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols: []
  schemas:
  - minecraft/resource/item/model_generated
implementation_key: fabric/model/geometry
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - model_properties
repair:
  scope:
  - minecraft/model/geometry
  writable_anchors:
  - /* MMM:model_geometry */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- geometry
anchor_kinds:
- resource
- test
rules:
- Implement geometry responsibility for model strictly within declared MODEL_DEFINITION
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required model prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- model geometry matches host version contract
- model geometry receipts emitted with verified context
