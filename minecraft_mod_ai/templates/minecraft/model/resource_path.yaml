id: minecraft/model/resource_path
task: Implement only the resource path responsibility of the supplied model artifact.
execution_mode: deterministic
side:
- client
inputs:
- name: model_identity
  type: identifier
  required: true
outputs:
- name: model_resource_path_receipt
  type: receipt
host_requirements:
  capabilities:
  - MODEL_DEFINITION
implementation_key: fabric/model/resource_path
validators:
- json_schema
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/model/resource_path
  writable_anchors:
  - /* MMM:model_resource_path */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- resource_path
anchor_kinds:
- resource
- test
rules:
- Implement resource_path responsibility for model strictly within declared MODEL_DEFINITION
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required model prerequisite receipt is missing; never invent defaults.
- Output must satisfy json_schema validator before completion.
