id: minecraft/model/uv
task: Implement only the uv responsibility of the supplied model artifact.
execution_mode: model
side:
- client
inputs:
- name: model_identity
  type: identifier
  required: true
outputs:
- name: model_uv_receipt
  type: receipt
host_requirements:
  capabilities:
  - MODEL_DEFINITION
implementation_key: fabric/model/uv
validators:
- java_parse
- client_side_only
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/model/uv
  writable_anchors:
  - /* MMM:model_uv */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- uv
anchor_kinds:
- resource
- test
rules:
- Implement uv responsibility for model strictly within declared MODEL_DEFINITION
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required model prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
