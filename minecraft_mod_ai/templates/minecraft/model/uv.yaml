id: minecraft/model/uv
task: Implement only the uv responsibility of the supplied model artifact.
execution_mode: model
side:
- common
inputs:
- name: model_identity
  type: identifier
  required: true
- name: model_uv_input
  type: specification
  required: true
outputs:
- name: model_uv_receipt
  type: receipt
- name: model_uv_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols: []
  schemas:
  - minecraft/resource/item/model_generated
implementation_key: fabric/model/uv
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - model_properties
repair:
  scope:
  - minecraft/model/uv
  writable_anchors:
  - /* MMM:model_uv */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- uv
anchor_kinds:
- resource
- test
rules:
- Implement uv responsibility for model strictly within declared MODEL_DEFINITION
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required model prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- model uv matches host version contract
- model uv receipts emitted with verified context
