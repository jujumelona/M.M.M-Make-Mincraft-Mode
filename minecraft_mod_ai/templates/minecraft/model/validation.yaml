id: minecraft/model/validation
task: Implement only the validation responsibility of the supplied model artifact.
execution_mode: deterministic
side:
- client
inputs:
- name: model_identity
  type: identifier
  required: true
outputs:
- name: model_validation_receipt
  type: receipt
host_requirements:
  capabilities:
  - MODEL_DEFINITION
implementation_key: fabric/model/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/model/validation
  writable_anchors:
  - /* MMM:model_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- resource
- test
rules:
- Implement validation responsibility for model strictly within declared MODEL_DEFINITION
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required model prerequisite receipt is missing; never invent defaults.
- Output must satisfy mod_integration_test validator before completion.
