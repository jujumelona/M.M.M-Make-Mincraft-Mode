id: minecraft/model/integration
task: Implement only the integration responsibility of the supplied model artifact.
execution_mode: model
side:
- common
inputs:
- name: model_identity
  type: identifier
  required: true
- name: model_integration_input
  type: specification
  required: true
outputs:
- name: model_integration_receipt
  type: receipt
- name: model_integration_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols: []
  schemas:
  - fabric/item/model_basic
implementation_key: fabric/model/integration
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - model_properties
repair:
  scope:
  - minecraft/model/integration
  writable_anchors:
  - /* MMM:model_integration */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- integration
anchor_kinds:
- resource
- test
rules:
- Implement integration responsibility for model strictly within declared MODEL_DEFINITION
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required model prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- model integration matches host version contract
- model integration receipts emitted with verified context
