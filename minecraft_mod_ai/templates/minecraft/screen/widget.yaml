id: minecraft/screen/widget
task: Implement only the widget responsibility of the supplied screen artifact.
execution_mode: model
side:
- client
inputs:
- name: screen_identity
  type: identifier
  required: true
- name: screen_widget_input
  type: specification
  required: true
outputs:
- name: screen_widget_receipt
  type: receipt
- name: screen_widget_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - GUI_EXISTS
  symbols:
  - ScreenHandlerType
  schemas: []
implementation_key: fabric/screen/widget
validators:
- java_parse
- client_side_only
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - screen_properties
repair:
  scope:
  - minecraft/screen/widget
  writable_anchors:
  - /* MMM:screen_widget */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- widget
anchor_kinds:
- symbol
- test
rules:
- Implement widget responsibility for screen strictly within declared SCREEN_CLIENT
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required screen prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- screen widget matches host version contract
- screen widget receipts emitted with verified context
