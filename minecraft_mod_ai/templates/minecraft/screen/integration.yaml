id: minecraft/screen/integration
task: Implement only the integration responsibility of the supplied screen artifact.
execution_mode: model
side:
- client
inputs:
- name: screen_identity
  type: identifier
  required: true
outputs:
- name: screen_integration_receipt
  type: receipt
host_requirements:
  capabilities:
  - SCREEN_CLIENT
  symbols:
  - handled_screens_register
implementation_key: fabric/screen/integration
validators:
- java_parse
- client_side_only
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/screen/integration
  writable_anchors:
  - /* MMM:screen_integration */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- integration
anchor_kinds:
- symbol
- test
rules:
- Implement integration responsibility for screen strictly within declared SCREEN_CLIENT
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required screen prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
