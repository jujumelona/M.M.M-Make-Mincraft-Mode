id: minecraft/screen/validation
task: Implement only the validation responsibility of the supplied screen artifact.
execution_mode: deterministic
side:
- client
inputs:
- name: screen_identity
  type: identifier
  required: true
- name: screen_validation_input
  type: specification
  required: true
outputs:
- name: screen_validation_receipt
  type: receipt
- name: screen_validation_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - GUI_EXISTS
  symbols:
  - ScreenHandlerType
  schemas: []
implementation_key: fabric/screen/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - screen_properties
repair:
  scope:
  - minecraft/screen/validation
  writable_anchors:
  - /* MMM:screen_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- symbol
- test
rules:
- Implement validation responsibility for screen strictly within declared SCREEN_CLIENT
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required screen prerequisite receipt is missing; never invent defaults.
- Output must satisfy mod_integration_test validator before completion.
postconditions:
- screen validation matches host version contract
- screen validation receipts emitted with verified context
