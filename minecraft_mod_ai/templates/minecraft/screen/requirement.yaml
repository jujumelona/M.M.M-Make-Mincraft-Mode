id: minecraft/screen/requirement
task: Implement only the requirement responsibility of the supplied screen artifact.
execution_mode: deterministic
side:
- client
inputs:
- name: screen_identity
  type: identifier
  required: true
- name: screen_requirement_input
  type: specification
  required: true
outputs:
- name: screen_requirement_receipt
  type: receipt
- name: screen_requirement_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - GUI_EXISTS
  symbols:
  - ScreenHandlerType
  schemas: []
implementation_key: fabric/screen/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - screen_properties
repair:
  scope:
  - minecraft/screen/requirement
  writable_anchors:
  - /* MMM:screen_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- symbol
- test
rules:
- Implement requirement responsibility for screen strictly within declared SCREEN_CLIENT
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required screen prerequisite receipt is missing; never invent defaults.
- Output must satisfy semantic_contract validator before completion.
postconditions:
- screen requirement matches host version contract
- screen requirement receipts emitted with verified context
