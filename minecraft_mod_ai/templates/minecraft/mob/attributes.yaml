id: minecraft/mob/attributes
task: Implement only the attributes responsibility of the supplied mob artifact.
execution_mode: model
side:
- common
inputs:
- name: mob_identity
  type: identifier
  required: true
outputs:
- name: mob_attributes_receipt
  type: receipt
host_requirements:
  capabilities:
  - REGISTER_MOB
implementation_key: fabric/mob/attributes
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/mob/attributes
  writable_anchors:
  - /* MMM:mob_attributes */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- attributes
anchor_kinds:
- symbol
- test
rules:
- Implement attributes responsibility for mob strictly within declared REGISTER_MOB
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required mob prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
