id: minecraft/mob/validation
task: Implement only the validation responsibility of the supplied mob artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: mob_identity
  type: identifier
  required: true
outputs:
- name: mob_validation_receipt
  type: receipt
host_requirements:
  capabilities:
  - REGISTER_MOB
implementation_key: fabric/mob/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/mob/validation
  writable_anchors:
  - /* MMM:mob_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- symbol
- test
rules:
- Implement validation responsibility for mob strictly within declared REGISTER_MOB
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required mob prerequisite receipt is missing; never invent defaults.
- Output must satisfy mod_integration_test validator before completion.
