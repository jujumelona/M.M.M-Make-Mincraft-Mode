id: minecraft/mob/spawning
task: Implement only the spawning responsibility of the supplied mob artifact.
execution_mode: model
side:
- common
inputs:
- name: mob_identity
  type: identifier
  required: true
- name: mob_spawning_input
  type: specification
  required: true
outputs:
- name: mob_spawning_receipt
  type: receipt
- name: mob_spawning_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - ENTITY_EXISTS
  symbols:
  - EntityType
  schemas: []
implementation_key: fabric/mob/spawning
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - mob_properties
repair:
  scope:
  - minecraft/mob/spawning
  writable_anchors:
  - /* MMM:mob_spawning */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- spawning
anchor_kinds:
- symbol
- test
rules:
- Implement spawning responsibility for mob strictly within declared REGISTER_MOB
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required mob prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- mob spawning matches host version contract
- mob spawning receipts emitted with verified context
