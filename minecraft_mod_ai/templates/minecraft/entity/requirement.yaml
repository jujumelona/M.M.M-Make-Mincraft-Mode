id: minecraft/entity/requirement
task: Implement only the requirement responsibility of the supplied entity artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: entity_identity
  type: identifier
  required: true
outputs:
- name: entity_contract
  type: contract_receipt
host_requirements:
  capabilities:
  - REGISTER_ENTITY
implementation_key: fabric/entity/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/entity/requirement
  writable_anchors:
  - /* MMM:entity_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- symbol
- test
rules:
- Implement requirement responsibility for entity strictly within declared REGISTER_ENTITY
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required entity prerequisite receipt is missing; never invent defaults.
- Output must satisfy semantic_contract validator before completion.
