id: minecraft/entity/requirement
task: Implement only the requirement responsibility of the supplied entity artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: entity_identity
  type: identifier
  required: true
- name: entity_requirement_input
  type: specification
  required: true
outputs:
- name: entity_requirement_receipt
  type: receipt
- name: entity_requirement_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - ENTITY_EXISTS
  symbols:
  - EntityType
  schemas: []
implementation_key: fabric/entity/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - entity_properties
repair:
  scope:
  - minecraft/entity/requirement
  writable_anchors:
  - /* MMM:entity_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- symbol
- test
rules:
- Implement requirement responsibility for entity strictly within declared REGISTER_ENTITY
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required entity prerequisite receipt is missing; never invent defaults.
- Output must satisfy semantic_contract validator before completion.
postconditions:
- entity requirement matches host version contract
- entity requirement receipts emitted with verified context
