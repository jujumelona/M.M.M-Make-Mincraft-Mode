id: minecraft/entity/renderer
task: Implement only the renderer responsibility of the supplied entity artifact.
execution_mode: model
side:
- client
inputs:
- name: entity_identity
  type: identifier
  required: true
outputs:
- name: client_renderer_symbol
  type: string
host_requirements:
  capabilities:
  - ENTITY_RENDERER
implementation_key: fabric/entity/renderer
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
repair:
  scope:
  - minecraft/entity/renderer
  writable_anchors:
  - /* MMM:entity_renderer */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- renderer
anchor_kinds:
- symbol
- test
rules:
- Use the supplied artifact identity and acceptance contract.
- Use only target-compatible symbols verified in the supplied bindings.
- If this concern is inapplicable, record its concrete reason and perform no edit.
- If information is missing, return blocked; never invent a default implementation.
- Modify only the owned anchor for this responsibility.
- Complete only after its declared postcondition is checked.
