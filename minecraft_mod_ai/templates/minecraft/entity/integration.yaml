id: minecraft/entity/integration
task: Implement only the integration responsibility of the supplied entity artifact.
execution_mode: model
side:
- common
inputs:
- name: entity_identity
  type: identifier
  required: true
outputs:
- name: entity_integration_receipt
  type: receipt
host_requirements:
  capabilities:
  - REGISTER_ENTITY
  symbols:
  - entity_type_register
implementation_key: fabric/entity/integration
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/entity/integration
  writable_anchors:
  - /* MMM:entity_integration */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- integration
anchor_kinds:
- symbol
- test
rules:
- Implement integration responsibility for entity strictly within declared REGISTER_ENTITY
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required entity prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
