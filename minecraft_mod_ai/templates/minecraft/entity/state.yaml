id: minecraft/entity/state
task: Implement only the state responsibility of the supplied entity artifact.
execution_mode: model
side:
- common
inputs:
- name: entity_identity
  type: identifier
  required: true
outputs:
- name: entity_state_receipt
  type: receipt
host_requirements:
  capabilities:
  - REGISTER_ENTITY
implementation_key: fabric/entity/state
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - java_constant
repair:
  scope:
  - minecraft/entity/state
  writable_anchors:
  - /* MMM:entity_state */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- state
anchor_kinds:
- symbol
- test
rules:
- Implement state responsibility for entity strictly within declared REGISTER_ENTITY
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required entity prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
