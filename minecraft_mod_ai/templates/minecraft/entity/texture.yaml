id: minecraft/entity/texture
task: Implement only the texture responsibility of the supplied entity artifact.
execution_mode: model
side:
- client
inputs:
- name: entity_identity
  type: identifier
  required: true
outputs:
- name: entity_texture_receipt
  type: receipt
host_requirements:
  capabilities:
  - REGISTER_ENTITY
implementation_key: fabric/entity/texture
validators:
- java_parse
- client_side_only
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/entity/texture
  writable_anchors:
  - /* MMM:entity_texture */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- texture
anchor_kinds:
- symbol
- test
rules:
- Implement texture responsibility for entity strictly within declared REGISTER_ENTITY
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required entity prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
