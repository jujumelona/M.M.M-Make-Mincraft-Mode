id: minecraft/entity/loot
task: Implement only the loot responsibility of the supplied entity artifact.
execution_mode: model
side:
- common
inputs:
- name: entity_identity
  type: identifier
  required: true
- name: entity_loot_input
  type: specification
  required: true
outputs:
- name: entity_loot_receipt
  type: receipt
- name: entity_loot_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - ENTITY_EXISTS
  symbols:
  - EntityType
  schemas: []
implementation_key: fabric/entity/loot
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - entity_properties
repair:
  scope:
  - minecraft/entity/loot
  writable_anchors:
  - /* MMM:entity_loot */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- loot
anchor_kinds:
- symbol
- test
rules:
- Implement loot responsibility for entity strictly within declared REGISTER_ENTITY
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required entity prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- entity loot matches host version contract
- entity loot receipts emitted with verified context
