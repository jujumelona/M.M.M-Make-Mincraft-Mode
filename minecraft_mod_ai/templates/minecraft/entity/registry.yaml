id: minecraft/entity/registry
task: Implement only the registry responsibility of the supplied entity artifact.
execution_mode: model
side:
- common
inputs:
- name: entity_identity
  type: identifier
  required: true
outputs:
- name: entity_registry_id
  type: string
- name: entity_java_symbol
  type: string
host_requirements:
  capabilities:
  - REGISTER_ENTITY
  symbols:
  - entity_type_register
implementation_key: fabric/entity/registry
validators:
- java_parse
- registry_identifier_unique
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - java_constant
repair:
  scope:
  - minecraft/entity/registry
  writable_anchors:
  - /* MMM:entity_registry */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- registry
anchor_kinds:
- registry_id
- symbol
- test
rules:
- Implement registry responsibility for entity strictly within declared REGISTER_ENTITY
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required entity prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
