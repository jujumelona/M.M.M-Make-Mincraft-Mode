id: minecraft/event/side
task: Implement only the side responsibility of the supplied event artifact.
execution_mode: model
side:
- common
inputs:
- name: event_identity
  type: identifier
  required: true
outputs:
- name: event_side_receipt
  type: receipt
host_requirements:
  capabilities:
  - EVENT_LISTENER
implementation_key: fabric/event/side
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/event/side
  writable_anchors:
  - /* MMM:event_side */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- side
anchor_kinds:
- symbol
- test
rules:
- Implement side responsibility for event strictly within declared EVENT_LISTENER
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required event prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
