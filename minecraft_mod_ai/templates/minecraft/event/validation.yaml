id: minecraft/event/validation
task: Implement only the validation responsibility of the supplied event artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: event_identity
  type: identifier
  required: true
- name: event_validation_input
  type: specification
  required: true
outputs:
- name: event_validation_receipt
  type: receipt
- name: event_validation_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols:
  - register_item
  schemas: []
implementation_key: fabric/event/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - event_properties
repair:
  scope:
  - minecraft/event/validation
  writable_anchors:
  - /* MMM:event_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- symbol
- test
rules:
- Implement validation responsibility for event strictly within declared EVENT_LISTENER
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required event prerequisite receipt is missing; never invent defaults.
- Output must satisfy mod_integration_test validator before completion.
postconditions:
- event validation matches host version contract
- event validation receipts emitted with verified context
