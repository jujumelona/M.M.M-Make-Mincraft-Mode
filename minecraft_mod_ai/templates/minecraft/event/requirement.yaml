id: minecraft/event/requirement
task: Implement only the requirement responsibility of the supplied event artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: event_identity
  type: identifier
  required: true
outputs:
- name: event_contract
  type: contract_receipt
host_requirements:
  capabilities:
  - EVENT_LISTENER
implementation_key: fabric/event/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/event/requirement
  writable_anchors:
  - /* MMM:event_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- symbol
- test
rules:
- Implement requirement responsibility for event strictly within declared EVENT_LISTENER
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required event prerequisite receipt is missing; never invent defaults.
- Output must satisfy semantic_contract validator before completion.
