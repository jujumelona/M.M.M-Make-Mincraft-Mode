id: minecraft/event/integration
task: Implement only the integration responsibility of the supplied event artifact.
execution_mode: model
side:
- common
inputs:
- name: event_identity
  type: identifier
  required: true
outputs:
- name: event_integration_receipt
  type: receipt
host_requirements:
  capabilities:
  - EVENT_LISTENER
  symbols:
  - event_register
implementation_key: fabric/event/integration
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/event/integration
  writable_anchors:
  - /* MMM:event_integration */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- integration
anchor_kinds:
- symbol
- test
rules:
- Implement integration responsibility for event strictly within declared EVENT_LISTENER
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required event prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
