id: minecraft/menu/quick_move
task: Implement only the quick move responsibility of the supplied menu artifact.
execution_mode: model
side:
- common
inputs:
- name: menu_identity
  type: identifier
  required: true
outputs:
- name: menu_quick_move_receipt
  type: receipt
host_requirements:
  capabilities:
  - SCREEN_HANDLER
implementation_key: fabric/menu/quick_move
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/menu/quick_move
  writable_anchors:
  - /* MMM:menu_quick_move */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- quick_move
anchor_kinds:
- symbol
- test
rules:
- Implement quick_move responsibility for menu strictly within declared SCREEN_HANDLER
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required menu prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
