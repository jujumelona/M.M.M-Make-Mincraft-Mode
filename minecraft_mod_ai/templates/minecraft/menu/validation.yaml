id: minecraft/menu/validation
task: Implement only the validation responsibility of the supplied menu artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: menu_identity
  type: identifier
  required: true
- name: menu_validation_input
  type: specification
  required: true
outputs:
- name: menu_validation_receipt
  type: receipt
- name: menu_validation_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - GUI_EXISTS
  symbols:
  - ScreenHandlerType
  schemas: []
implementation_key: fabric/menu/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - menu_properties
repair:
  scope:
  - minecraft/menu/validation
  writable_anchors:
  - /* MMM:menu_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- symbol
- test
rules:
- Implement validation responsibility for menu strictly within declared SCREEN_HANDLER
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required menu prerequisite receipt is missing; never invent defaults.
- Output must satisfy mod_integration_test validator before completion.
postconditions:
- menu validation matches host version contract
- menu validation receipts emitted with verified context
