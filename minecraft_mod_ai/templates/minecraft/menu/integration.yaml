id: minecraft/menu/integration
task: Implement only the integration responsibility of the supplied menu artifact.
execution_mode: model
side:
- common
inputs:
- name: menu_identity
  type: identifier
  required: true
outputs:
- name: menu_integration_receipt
  type: receipt
host_requirements:
  capabilities:
  - SCREEN_HANDLER
  symbols:
  - screen_handler_type_register
implementation_key: fabric/menu/integration
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/menu/integration
  writable_anchors:
  - /* MMM:menu_integration */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- integration
anchor_kinds:
- symbol
- test
rules:
- Implement integration responsibility for menu strictly within declared SCREEN_HANDLER
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required menu prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
