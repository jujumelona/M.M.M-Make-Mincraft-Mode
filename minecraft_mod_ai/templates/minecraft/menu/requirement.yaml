id: minecraft/menu/requirement
task: Implement only the requirement responsibility of the supplied menu artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: menu_identity
  type: identifier
  required: true
outputs:
- name: menu_contract
  type: contract_receipt
host_requirements:
  capabilities:
  - SCREEN_HANDLER
implementation_key: fabric/menu/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/menu/requirement
  writable_anchors:
  - /* MMM:menu_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- symbol
- test
rules:
- Implement requirement responsibility for menu strictly within declared SCREEN_HANDLER
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required menu prerequisite receipt is missing; never invent defaults.
- Output must satisfy semantic_contract validator before completion.
