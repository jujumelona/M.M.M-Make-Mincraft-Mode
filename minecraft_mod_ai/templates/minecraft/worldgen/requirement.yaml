id: minecraft/worldgen/requirement
task: Implement only the requirement responsibility of the supplied worldgen artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: worldgen_identity
  type: identifier
  required: true
- name: worldgen_requirement_input
  type: specification
  required: true
outputs:
- name: worldgen_requirement_receipt
  type: receipt
- name: worldgen_requirement_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - WORLDGEN_FEATURE
  symbols: []
  schemas: []
implementation_key: fabric/worldgen/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - worldgen_properties
repair:
  scope:
  - minecraft/worldgen/requirement
  writable_anchors:
  - /* MMM:worldgen_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- symbol
- test
rules:
- Implement requirement responsibility for worldgen strictly within declared WORLDGEN_FEATURE
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required worldgen prerequisite receipt is missing; never invent defaults.
- Output must satisfy semantic_contract validator before completion.
postconditions:
- worldgen requirement matches host version contract
- worldgen requirement receipts emitted with verified context
