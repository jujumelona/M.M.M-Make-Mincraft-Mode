id: minecraft/worldgen/datagen
task: Implement only the datagen responsibility of the supplied worldgen artifact.
execution_mode: deterministic
side:
- server
inputs:
- name: worldgen_identity
  type: identifier
  required: true
outputs:
- name: worldgen_datagen_receipt
  type: receipt
host_requirements:
  capabilities:
  - WORLDGEN_FEATURE
implementation_key: fabric/worldgen/datagen
validators:
- json_schema
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/worldgen/datagen
  writable_anchors:
  - /* MMM:worldgen_datagen */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- datagen
anchor_kinds:
- symbol
- test
rules:
- Implement datagen responsibility for worldgen strictly within declared WORLDGEN_FEATURE
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required worldgen prerequisite receipt is missing; never invent defaults.
- Output must satisfy json_schema validator before completion.
