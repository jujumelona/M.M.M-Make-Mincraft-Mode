id: minecraft/worldgen/configured_feature
task: Implement only the configured feature responsibility of the supplied worldgen
  artifact.
execution_mode: model
side:
- server
inputs:
- name: worldgen_identity
  type: identifier
  required: true
outputs:
- name: worldgen_configured_feature_receipt
  type: receipt
host_requirements:
  capabilities:
  - WORLDGEN_FEATURE
implementation_key: fabric/worldgen/configured_feature
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/worldgen/configured_feature
  writable_anchors:
  - /* MMM:worldgen_configured_feature */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- configured_feature
anchor_kinds:
- symbol
- test
rules:
- Implement configured_feature responsibility for worldgen strictly within declared
  WORLDGEN_FEATURE capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required worldgen prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
