id: minecraft/worldgen/validation
task: Implement only the validation responsibility of the supplied worldgen artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: worldgen_identity
  type: identifier
  required: true
- name: worldgen_validation_input
  type: specification
  required: true
outputs:
- name: worldgen_validation_receipt
  type: receipt
- name: worldgen_validation_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - WORLDGEN_FEATURE
  symbols: []
  schemas: []
implementation_key: fabric/worldgen/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - worldgen_properties
repair:
  scope:
  - minecraft/worldgen/validation
  writable_anchors:
  - /* MMM:worldgen_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- symbol
- test
rules:
- Implement validation responsibility for worldgen strictly within declared WORLDGEN_FEATURE
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required worldgen prerequisite receipt is missing; never invent defaults.
- Output must satisfy mod_integration_test validator before completion.
postconditions:
- worldgen validation matches host version contract
- worldgen validation receipts emitted with verified context
