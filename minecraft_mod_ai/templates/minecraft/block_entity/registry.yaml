id: minecraft/block_entity/registry
task: Implement only the registry responsibility of the supplied block entity artifact.
execution_mode: model
side:
- common
inputs:
- name: block_entity_identity
  type: identifier
  required: true
outputs:
- name: block_entity_registry_id
  type: string
- name: block_entity_java_symbol
  type: string
host_requirements:
  capabilities:
  - BLOCK_ENTITY
  symbols:
  - block_entity_type_register
implementation_key: fabric/block_entity/registry
validators:
- java_parse
- registry_identifier_unique
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - java_constant
repair:
  scope:
  - minecraft/block_entity/registry
  writable_anchors:
  - /* MMM:block_entity_registry */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- registry
anchor_kinds:
- registry_id
- symbol
- test
rules:
- Implement registry responsibility for block_entity strictly within declared BLOCK_ENTITY
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required block_entity prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
