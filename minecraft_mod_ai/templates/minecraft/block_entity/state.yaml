id: minecraft/block_entity/state
task: Implement only the state responsibility of the supplied block entity artifact.
execution_mode: model
side:
- common
inputs:
- name: block_entity_identity
  type: identifier
  required: true
outputs:
- name: block_entity_state_receipt
  type: receipt
host_requirements:
  capabilities:
  - BLOCK_ENTITY
implementation_key: fabric/block_entity/state
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - java_constant
repair:
  scope:
  - minecraft/block_entity/state
  writable_anchors:
  - /* MMM:block_entity_state */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- state
anchor_kinds:
- symbol
- test
rules:
- Implement state responsibility for block_entity strictly within declared BLOCK_ENTITY
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required block_entity prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
