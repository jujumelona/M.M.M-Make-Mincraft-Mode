id: minecraft/block_entity/renderer
task: Implement only the renderer responsibility of the supplied block entity artifact.
execution_mode: model
side:
- client
inputs:
- name: block_entity_identity
  type: identifier
  required: true
outputs:
- name: block_entity_renderer_receipt
  type: receipt
host_requirements:
  capabilities:
  - BLOCK_ENTITY
implementation_key: fabric/block_entity/renderer
validators:
- java_parse
- client_side_only
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/block_entity/renderer
  writable_anchors:
  - /* MMM:block_entity_renderer */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- renderer
anchor_kinds:
- symbol
- test
rules:
- Implement renderer responsibility for block_entity strictly within declared BLOCK_ENTITY
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required block_entity prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
