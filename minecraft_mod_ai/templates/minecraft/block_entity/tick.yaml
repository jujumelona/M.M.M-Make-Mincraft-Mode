id: minecraft/block_entity/tick
task: Implement only the tick responsibility of the supplied block entity artifact.
execution_mode: model
side:
- common
inputs:
- name: block_entity_identity
  type: identifier
  required: true
- name: block_entity_tick_input
  type: specification
  required: true
outputs:
- name: block_entity_tick_receipt
  type: receipt
- name: block_entity_tick_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - BLOCK_ENTITY_EXISTS
  - REGISTER_BLOCK
  symbols:
  - BlockEntityType
  - register_block
  schemas: []
implementation_key: fabric/block_entity/tick
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - block_entity_properties
repair:
  scope:
  - minecraft/block_entity/tick
  writable_anchors:
  - /* MMM:block_entity_tick */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- tick
anchor_kinds:
- symbol
- test
rules:
- Implement tick responsibility for block_entity strictly within declared BLOCK_ENTITY
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required block_entity prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- block_entity tick matches host version contract
- block_entity tick receipts emitted with verified context
