id: minecraft/block_entity/validation
task: Implement only the validation responsibility of the supplied block entity artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: block_entity_identity
  type: identifier
  required: true
outputs:
- name: block_entity_validation_receipt
  type: receipt
host_requirements:
  capabilities:
  - BLOCK_ENTITY
implementation_key: fabric/block_entity/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/block_entity/validation
  writable_anchors:
  - /* MMM:block_entity_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- symbol
- test
rules:
- Implement validation responsibility for block_entity strictly within declared BLOCK_ENTITY
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required block_entity prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy mod_integration_test validator before completion.
