id: minecraft/command/feedback
task: Implement only the feedback responsibility of the supplied command artifact.
execution_mode: model
side:
- common
inputs:
- name: command_identity
  type: identifier
  required: true
- name: command_feedback_input
  type: specification
  required: true
outputs:
- name: command_feedback_receipt
  type: receipt
- name: command_feedback_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols:
  - register_item
  schemas: []
implementation_key: fabric/command/feedback
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - command_properties
repair:
  scope:
  - minecraft/command/feedback
  writable_anchors:
  - /* MMM:command_feedback */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- feedback
anchor_kinds:
- symbol
- test
rules:
- Implement feedback responsibility for command strictly within declared COMMAND_REGISTRATION
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required command prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- command feedback matches host version contract
- command feedback receipts emitted with verified context
