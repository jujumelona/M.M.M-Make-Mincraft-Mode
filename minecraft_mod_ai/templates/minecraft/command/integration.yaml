id: minecraft/command/integration
task: Implement only the integration responsibility of the supplied command artifact.
execution_mode: model
side:
- common
inputs:
- name: command_identity
  type: identifier
  required: true
- name: command_integration_input
  type: specification
  required: true
outputs:
- name: command_integration_receipt
  type: receipt
- name: command_integration_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols:
  - register_item
  schemas: []
implementation_key: fabric/command/integration
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - command_properties
repair:
  scope:
  - minecraft/command/integration
  writable_anchors:
  - /* MMM:command_integration */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- integration
anchor_kinds:
- symbol
- test
rules:
- Implement integration responsibility for command strictly within declared COMMAND_REGISTRATION
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required command prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- command integration matches host version contract
- command integration receipts emitted with verified context
