id: minecraft/command/suggestion
task: Implement only the suggestion responsibility of the supplied command artifact.
execution_mode: model
side:
- server
inputs:
- name: command_identity
  type: identifier
  required: true
outputs:
- name: command_suggestion_receipt
  type: receipt
host_requirements:
  capabilities:
  - COMMAND_REGISTRATION
implementation_key: fabric/command/suggestion
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/command/suggestion
  writable_anchors:
  - /* MMM:command_suggestion */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- suggestion
anchor_kinds:
- symbol
- test
rules:
- Implement suggestion responsibility for command strictly within declared COMMAND_REGISTRATION
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required command prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
