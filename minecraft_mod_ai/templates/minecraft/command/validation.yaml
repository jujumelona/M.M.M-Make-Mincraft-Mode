id: minecraft/command/validation
task: Implement only the validation responsibility of the supplied command artifact.
execution_mode: deterministic
side:
- server
inputs:
- name: command_identity
  type: identifier
  required: true
outputs:
- name: command_validation_receipt
  type: receipt
host_requirements:
  capabilities:
  - COMMAND_REGISTRATION
implementation_key: fabric/command/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/command/validation
  writable_anchors:
  - /* MMM:command_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- symbol
- test
rules:
- Implement validation responsibility for command strictly within declared COMMAND_REGISTRATION
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required command prerequisite receipt is missing; never invent defaults.
- Output must satisfy mod_integration_test validator before completion.
