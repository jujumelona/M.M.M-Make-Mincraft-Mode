id: minecraft/block/requirement
task: Implement only the requirement responsibility of the supplied block artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: block_identity
  type: identifier
  required: true
outputs:
- name: block_contract
  type: contract_receipt
host_requirements:
  capabilities:
  - REGISTER_BLOCK
implementation_key: fabric/block/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/block/requirement
  writable_anchors:
  - /* MMM:block_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- symbol
- test
rules:
- Implement requirement responsibility for block strictly within declared REGISTER_BLOCK
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required block prerequisite receipt is missing; never invent defaults.
- Output must satisfy semantic_contract validator before completion.
