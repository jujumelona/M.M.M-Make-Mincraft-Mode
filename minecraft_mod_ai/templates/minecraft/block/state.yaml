id: minecraft/block/state
task: Implement only the state responsibility of the supplied block artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: block_identity
  type: identifier
  required: true
- name: block_state_input
  type: specification
  required: true
outputs:
- name: block_state_receipt
  type: receipt
- name: block_state_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_BLOCK
  symbols:
  - register_block
  - resource_key_create
  schemas: []
implementation_key: fabric/block/state
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - block_properties
repair:
  scope:
  - minecraft/block/state
  writable_anchors:
  - /* MMM:block_state */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- state
anchor_kinds:
- symbol
- test
rules:
- Implement state responsibility for block strictly within declared REGISTER_BLOCK
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required block prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- block state matches host version contract
- block state receipts emitted with verified context
