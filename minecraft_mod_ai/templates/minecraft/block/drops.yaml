id: minecraft/block/drops
task: Implement only the drops responsibility of the supplied block artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: block_identity
  type: identifier
  required: true
- name: block_drops_input
  type: specification
  required: true
outputs:
- name: block_drops_receipt
  type: receipt
- name: block_drops_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_BLOCK
  symbols:
  - register_block
  - resource_key_create
  schemas: []
implementation_key: fabric/block/drops
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - block_properties
repair:
  scope:
  - minecraft/block/drops
  writable_anchors:
  - /* MMM:block_drops */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- drops
anchor_kinds:
- symbol
- test
rules:
- Implement drops responsibility for block strictly within declared REGISTER_BLOCK
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required block prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- block drops matches host version contract
- block drops receipts emitted with verified context
