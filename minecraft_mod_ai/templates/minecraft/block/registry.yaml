id: minecraft/block/registry
task: Implement only the registry responsibility of the supplied block artifact.
execution_mode: model
side:
- common
inputs:
- name: block_identity
  type: identifier
  required: true
outputs:
- name: block_registry_id
  type: string
- name: java_symbol
  type: string
host_requirements:
  capabilities:
  - REGISTER_BLOCK
  symbols:
  - register_block
  - builtin_block_registry
implementation_key: fabric/block/register_basic
validators:
- java_parse
- registry_identifier_unique
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - java_constant
  - package_path
repair:
  scope:
  - minecraft/block/registry
  writable_anchors:
  - /* MMM:block_registry */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- registry
anchor_kinds:
- registry_id
- symbol
- test
rules:
- Use the supplied artifact identity and acceptance contract.
- Use only target-compatible symbols verified in the supplied bindings.
- If this concern is inapplicable, record its concrete reason and perform no edit.
- If information is missing, return blocked; never invent a default implementation.
- Modify only the owned anchor for this responsibility.
- Complete only after its declared postcondition is checked.
