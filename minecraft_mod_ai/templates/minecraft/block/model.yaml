id: minecraft/block/model
task: Implement only the model responsibility of the supplied block artifact.
execution_mode: model
side:
- client
inputs:
- name: block_identity
  type: identifier
  required: true
outputs:
- name: block_model_receipt
  type: receipt
host_requirements:
  capabilities:
  - REGISTER_BLOCK
implementation_key: fabric/block/model
validators:
- java_parse
- client_side_only
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - java_constant
repair:
  scope:
  - minecraft/block/model
  writable_anchors:
  - /* MMM:block_model */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- model
anchor_kinds:
- symbol
- test
rules:
- Implement model responsibility for block strictly within declared REGISTER_BLOCK
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required block prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
