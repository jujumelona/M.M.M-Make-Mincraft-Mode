id: minecraft/block/integration
task: Implement only the integration responsibility of the supplied block artifact.
execution_mode: model
side:
- common
inputs:
- name: block_identity
  type: identifier
  required: true
- name: block_integration_input
  type: specification
  required: true
outputs:
- name: block_integration_receipt
  type: receipt
- name: block_integration_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_BLOCK
  symbols:
  - register_block
  - resource_key_create
  schemas: []
implementation_key: fabric/block/integration
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - block_properties
repair:
  scope:
  - minecraft/block/integration
  writable_anchors:
  - /* MMM:block_integration */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- integration
anchor_kinds:
- symbol
- test
rules:
- Implement integration responsibility for block strictly within declared REGISTER_BLOCK
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required block prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- block integration matches host version contract
- block integration receipts emitted with verified context
