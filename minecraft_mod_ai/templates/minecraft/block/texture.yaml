id: minecraft/block/texture
task: Implement only the texture responsibility of the supplied block artifact.
execution_mode: model
side:
- client
inputs:
- name: block_identity
  type: identifier
  required: true
- name: block_texture_input
  type: specification
  required: true
outputs:
- name: block_texture_receipt
  type: receipt
- name: block_texture_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_BLOCK
  symbols:
  - register_block
  - resource_key_create
  schemas: []
implementation_key: fabric/block/texture
validators:
- java_parse
- client_side_only
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - block_properties
repair:
  scope:
  - minecraft/block/texture
  writable_anchors:
  - /* MMM:block_texture */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- texture
anchor_kinds:
- symbol
- test
rules:
- Implement texture responsibility for block strictly within declared REGISTER_BLOCK
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required block prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- block texture matches host version contract
- block texture receipts emitted with verified context
