id: minecraft/saved_data/default
task: Implement only the default responsibility of the supplied saved data artifact.
execution_mode: deterministic
side:
- server
inputs:
- name: saved_data_identity
  type: identifier
  required: true
outputs:
- name: saved_data_default_receipt
  type: receipt
host_requirements:
  capabilities:
  - PERSISTENT_STATE
implementation_key: fabric/saved_data/default
validators:
- json_schema
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/saved_data/default
  writable_anchors:
  - /* MMM:saved_data_default */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- default
anchor_kinds:
- symbol
- test
rules:
- Implement default responsibility for saved_data strictly within declared PERSISTENT_STATE
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required saved_data prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy json_schema validator before completion.
