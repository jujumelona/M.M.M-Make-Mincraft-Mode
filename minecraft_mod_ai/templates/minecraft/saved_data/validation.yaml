id: minecraft/saved_data/validation
task: Implement only the validation responsibility of the supplied saved data artifact.
execution_mode: deterministic
side:
- server
inputs:
- name: saved_data_identity
  type: identifier
  required: true
outputs:
- name: saved_data_validation_receipt
  type: receipt
host_requirements:
  capabilities:
  - PERSISTENT_STATE
implementation_key: fabric/saved_data/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/saved_data/validation
  writable_anchors:
  - /* MMM:saved_data_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- symbol
- test
rules:
- Implement validation responsibility for saved_data strictly within declared PERSISTENT_STATE
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required saved_data prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy mod_integration_test validator before completion.
