  - minecraft/saved_data/malformed
  writable_anchors:
  - /* MMM:saved_data_malformed */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- malformed
anchor_kinds:
- symbol
- test
rules:
- Implement malformed responsibility for saved_data strictly within declared PERSISTENT_STATE
