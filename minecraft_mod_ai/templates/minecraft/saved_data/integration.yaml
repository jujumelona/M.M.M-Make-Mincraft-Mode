id: minecraft/saved_data/integration
task: Implement only the integration responsibility of the supplied saved data artifact.
execution_mode: model
side:
- server
inputs:
- name: saved_data_identity
  type: identifier
  required: true
outputs:
- name: saved_data_integration_receipt
  type: receipt
host_requirements:
  capabilities:
  - PERSISTENT_STATE
  symbols:
  - persistent_state_get
implementation_key: fabric/saved_data/integration
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/saved_data/integration
  writable_anchors:
  - /* MMM:saved_data_integration */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- integration
anchor_kinds:
- symbol
- test
rules:
- Implement integration responsibility for saved_data strictly within declared PERSISTENT_STATE
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required saved_data prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
