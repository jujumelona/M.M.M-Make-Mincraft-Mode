id: minecraft/keybind/category
task: Implement only the category responsibility of the supplied keybind artifact.
execution_mode: model
side:
- client
inputs:
- name: keybind_identity
  type: identifier
  required: true
outputs:
- name: keybind_category_receipt
  type: receipt
host_requirements:
  capabilities:
  - KEYBIND_REGISTRATION
implementation_key: fabric/keybind/category
validators:
- java_parse
- client_side_only
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/keybind/category
  writable_anchors:
  - /* MMM:keybind_category */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- category
anchor_kinds:
- symbol
- test
rules:
- Implement category responsibility for keybind strictly within declared KEYBIND_REGISTRATION
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required keybind prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
