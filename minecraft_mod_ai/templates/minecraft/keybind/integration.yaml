id: minecraft/keybind/integration
task: Implement only the integration responsibility of the supplied keybind artifact.
execution_mode: model
side:
- client
inputs:
- name: keybind_identity
  type: identifier
  required: true
outputs:
- name: keybind_integration_receipt
  type: receipt
host_requirements:
  capabilities:
  - KEYBIND_REGISTRATION
  symbols:
  - keybind_register
implementation_key: fabric/keybind/integration
validators:
- java_parse
- client_side_only
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/keybind/integration
  writable_anchors:
  - /* MMM:keybind_integration */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- integration
anchor_kinds:
- symbol
- test
rules:
- Implement integration responsibility for keybind strictly within declared KEYBIND_REGISTRATION
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required keybind prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
