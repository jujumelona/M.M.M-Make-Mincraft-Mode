id: minecraft/keybind/requirement
task: Implement only the requirement responsibility of the supplied keybind artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: keybind_identity
  type: identifier
  required: true
- name: keybind_requirement_input
  type: specification
  required: true
outputs:
- name: keybind_requirement_receipt
  type: receipt
- name: keybind_requirement_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - GUI_EXISTS
  symbols:
  - ScreenHandlerType
  schemas: []
implementation_key: fabric/keybind/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - keybind_properties
repair:
  scope:
  - minecraft/keybind/requirement
  writable_anchors:
  - /* MMM:keybind_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- symbol
- test
rules:
- Implement requirement responsibility for keybind strictly within declared KEYBIND_REGISTRATION
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required keybind prerequisite receipt is missing; never invent defaults.
- Output must satisfy semantic_contract validator before completion.
postconditions:
- keybind requirement matches host version contract
- keybind requirement receipts emitted with verified context
