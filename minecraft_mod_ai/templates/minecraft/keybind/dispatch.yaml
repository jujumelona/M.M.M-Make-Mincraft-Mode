id: minecraft/keybind/dispatch
task: Implement only the dispatch responsibility of the supplied keybind artifact.
execution_mode: model
side:
- common
inputs:
- name: keybind_identity
  type: identifier
  required: true
- name: keybind_dispatch_input
  type: specification
  required: true
outputs:
- name: keybind_dispatch_receipt
  type: receipt
- name: keybind_dispatch_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - GUI_EXISTS
  symbols:
  - ScreenHandlerType
  schemas: []
implementation_key: fabric/keybind/dispatch
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - keybind_properties
repair:
  scope:
  - minecraft/keybind/dispatch
  writable_anchors:
  - /* MMM:keybind_dispatch */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- dispatch
anchor_kinds:
- symbol
- test
rules:
- Implement dispatch responsibility for keybind strictly within declared KEYBIND_REGISTRATION
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required keybind prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- keybind dispatch matches host version contract
- keybind dispatch receipts emitted with verified context
