id: minecraft/keybind/validation
task: Implement only the validation responsibility of the supplied keybind artifact.
execution_mode: deterministic
side:
- client
inputs:
- name: keybind_identity
  type: identifier
  required: true
outputs:
- name: keybind_validation_receipt
  type: receipt
host_requirements:
  capabilities:
  - KEYBIND_REGISTRATION
implementation_key: fabric/keybind/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/keybind/validation
  writable_anchors:
  - /* MMM:keybind_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- symbol
- test
rules:
- Implement validation responsibility for keybind strictly within declared KEYBIND_REGISTRATION
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required keybind prerequisite receipt is missing; never invent defaults.
- Output must satisfy mod_integration_test validator before completion.
