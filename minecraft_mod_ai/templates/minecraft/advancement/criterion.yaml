id: minecraft/advancement/criterion
task: Implement only the criterion responsibility of the supplied advancement artifact.
execution_mode: model
side:
- common
inputs:
- name: advancement_identity
  type: identifier
  required: true
- name: advancement_criterion_input
  type: specification
  required: true
outputs:
- name: advancement_criterion_receipt
  type: receipt
- name: advancement_criterion_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - ADVANCEMENT
  symbols: []
  schemas: []
implementation_key: fabric/advancement/criterion
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - advancement_properties
repair:
  scope:
  - minecraft/advancement/criterion
  writable_anchors:
  - /* MMM:advancement_criterion */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- criterion
anchor_kinds:
- resource
- test
rules:
- Implement criterion responsibility for advancement strictly within declared ADVANCEMENT
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required advancement prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- advancement criterion matches host version contract
- advancement criterion receipts emitted with verified context
