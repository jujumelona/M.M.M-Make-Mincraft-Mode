id: minecraft/advancement/requirement
task: Implement only the requirement responsibility of the supplied advancement artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: advancement_identity
  type: identifier
  required: true
outputs:
- name: advancement_contract
  type: contract_receipt
host_requirements:
  capabilities:
  - ADVANCEMENT
implementation_key: fabric/advancement/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/advancement/requirement
  writable_anchors:
  - /* MMM:advancement_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- resource
- test
rules:
- Implement requirement responsibility for advancement strictly within declared ADVANCEMENT
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required advancement prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy semantic_contract validator before completion.
