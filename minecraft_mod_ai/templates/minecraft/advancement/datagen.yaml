id: minecraft/advancement/datagen
task: Implement only the datagen responsibility of the supplied advancement artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: advancement_identity
  type: identifier
  required: true
outputs:
- name: advancement_datagen_receipt
  type: receipt
host_requirements:
  capabilities:
  - ADVANCEMENT
implementation_key: fabric/advancement/datagen
validators:
- json_schema
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/advancement/datagen
  writable_anchors:
  - /* MMM:advancement_datagen */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- datagen
anchor_kinds:
- resource
- test
rules:
- Implement datagen responsibility for advancement strictly within declared ADVANCEMENT
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required advancement prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy json_schema validator before completion.
