id: minecraft/inventory/synchronization
task: Implement only the synchronization responsibility of the supplied inventory
  artifact.
execution_mode: model
side:
- common
inputs:
- name: inventory_identity
  type: identifier
  required: true
outputs:
- name: inventory_synchronization_receipt
  type: receipt
host_requirements:
  capabilities:
  - INVENTORY_CAPABILITY
implementation_key: fabric/inventory/synchronization
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/inventory/synchronization
  writable_anchors:
  - /* MMM:inventory_synchronization */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- synchronization
anchor_kinds:
- symbol
- test
rules:
- Implement synchronization responsibility for inventory strictly within declared
  INVENTORY_CAPABILITY capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required inventory prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
