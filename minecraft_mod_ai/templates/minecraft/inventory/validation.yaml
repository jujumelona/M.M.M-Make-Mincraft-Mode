id: minecraft/inventory/validation
task: Implement only the validation responsibility of the supplied inventory artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: inventory_identity
  type: identifier
  required: true
outputs:
- name: inventory_validation_receipt
  type: receipt
host_requirements:
  capabilities:
  - INVENTORY_CAPABILITY
implementation_key: fabric/inventory/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/inventory/validation
  writable_anchors:
  - /* MMM:inventory_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- symbol
- test
rules:
- Implement validation responsibility for inventory strictly within declared INVENTORY_CAPABILITY
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required inventory prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy mod_integration_test validator before completion.
