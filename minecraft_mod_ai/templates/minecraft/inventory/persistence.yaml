id: minecraft/inventory/persistence
task: Implement only the persistence responsibility of the supplied inventory artifact.
execution_mode: model
side:
- common
inputs:
- name: inventory_identity
  type: identifier
  required: true
- name: inventory_persistence_input
  type: specification
  required: true
outputs:
- name: inventory_persistence_receipt
  type: receipt
- name: inventory_persistence_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols:
  - register_item
  schemas: []
implementation_key: fabric/inventory/persistence
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - inventory_properties
repair:
  scope:
  - minecraft/inventory/persistence
  writable_anchors:
  - /* MMM:inventory_persistence */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- persistence
anchor_kinds:
- symbol
- test
rules:
- Implement persistence responsibility for inventory strictly within declared INVENTORY_CAPABILITY
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required inventory prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- inventory persistence matches host version contract
- inventory persistence receipts emitted with verified context
