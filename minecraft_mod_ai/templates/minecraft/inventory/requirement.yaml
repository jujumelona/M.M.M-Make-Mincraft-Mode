id: minecraft/inventory/requirement
task: Implement only the requirement responsibility of the supplied inventory artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: inventory_identity
  type: identifier
  required: true
- name: inventory_requirement_input
  type: specification
  required: true
outputs:
- name: inventory_requirement_receipt
  type: receipt
- name: inventory_requirement_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols:
  - register_item
  schemas: []
implementation_key: fabric/inventory/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - inventory_properties
repair:
  scope:
  - minecraft/inventory/requirement
  writable_anchors:
  - /* MMM:inventory_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- symbol
- test
rules:
- Implement requirement responsibility for inventory strictly within declared INVENTORY_CAPABILITY
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required inventory prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy semantic_contract validator before completion.
postconditions:
- inventory requirement matches host version contract
- inventory requirement receipts emitted with verified context
