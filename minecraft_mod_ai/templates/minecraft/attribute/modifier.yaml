id: minecraft/attribute/modifier
task: Implement only the modifier responsibility of the supplied attribute artifact.
execution_mode: model
side:
- common
inputs:
- name: attribute_identity
  type: identifier
  required: true
- name: attribute_modifier_input
  type: specification
  required: true
outputs:
- name: attribute_modifier_receipt
  type: receipt
- name: attribute_modifier_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols:
  - register_item
  schemas: []
implementation_key: fabric/attribute/modifier
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - attribute_properties
repair:
  scope:
  - minecraft/attribute/modifier
  writable_anchors:
  - /* MMM:attribute_modifier */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- modifier
anchor_kinds:
- symbol
- test
rules:
- Implement modifier responsibility for attribute strictly within declared ENTITY_ATTRIBUTES
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required attribute prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- attribute modifier matches host version contract
- attribute modifier receipts emitted with verified context
