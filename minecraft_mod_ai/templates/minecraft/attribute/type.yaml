id: minecraft/attribute/type
task: Implement only the type responsibility of the supplied attribute artifact.
execution_mode: model
side:
- common
inputs:
- name: attribute_identity
  type: identifier
  required: true
outputs:
- name: attribute_type_receipt
  type: receipt
host_requirements:
  capabilities:
  - ENTITY_ATTRIBUTES
implementation_key: fabric/attribute/type
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/attribute/type
  writable_anchors:
  - /* MMM:attribute_type */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- type
anchor_kinds:
- symbol
- test
rules:
- Implement type responsibility for attribute strictly within declared ENTITY_ATTRIBUTES
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required attribute prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
