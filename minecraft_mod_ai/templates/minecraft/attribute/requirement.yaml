id: minecraft/attribute/requirement
task: Implement only the requirement responsibility of the supplied attribute artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: attribute_identity
  type: identifier
  required: true
- name: attribute_requirement_input
  type: specification
  required: true
outputs:
- name: attribute_requirement_receipt
  type: receipt
- name: attribute_requirement_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols:
  - register_item
  schemas: []
implementation_key: fabric/attribute/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - attribute_properties
repair:
  scope:
  - minecraft/attribute/requirement
  writable_anchors:
  - /* MMM:attribute_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- symbol
- test
rules:
- Implement requirement responsibility for attribute strictly within declared ENTITY_ATTRIBUTES
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required attribute prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy semantic_contract validator before completion.
postconditions:
- attribute requirement matches host version contract
- attribute requirement receipts emitted with verified context
