id: minecraft/attribute/registry
task: Implement only the registry responsibility of the supplied attribute artifact.
execution_mode: model
side:
- common
inputs:
- name: attribute_identity
  type: identifier
  required: true
outputs:
- name: attribute_registry_id
  type: string
- name: attribute_java_symbol
  type: string
host_requirements:
  capabilities:
  - ENTITY_ATTRIBUTES
  symbols:
  - attribute_register
implementation_key: fabric/attribute/registry
validators:
- java_parse
- registry_identifier_unique
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - java_constant
repair:
  scope:
  - minecraft/attribute/registry
  writable_anchors:
  - /* MMM:attribute_registry */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- registry
anchor_kinds:
- registry_id
- symbol
- test
rules:
- Implement registry responsibility for attribute strictly within declared ENTITY_ATTRIBUTES
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required attribute prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
