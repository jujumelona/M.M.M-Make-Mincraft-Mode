id: minecraft/sound/requirement
task: Implement only the requirement responsibility of the supplied sound artifact.
execution_mode: deterministic
side:
- client
inputs:
- name: sound_identity
  type: identifier
  required: true
outputs:
- name: sound_contract
  type: contract_receipt
host_requirements:
  capabilities:
  - SOUND_EVENT
implementation_key: fabric/sound/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/sound/requirement
  writable_anchors:
  - /* MMM:sound_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- resource
- test
rules:
- Implement requirement responsibility for sound strictly within declared SOUND_EVENT
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required sound prerequisite receipt is missing; never invent defaults.
- Output must satisfy semantic_contract validator before completion.
