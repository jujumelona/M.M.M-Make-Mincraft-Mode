id: minecraft/sound/requirement
task: Implement only the requirement responsibility of the supplied sound artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: sound_identity
  type: identifier
  required: true
- name: sound_requirement_input
  type: specification
  required: true
outputs:
- name: sound_requirement_receipt
  type: receipt
- name: sound_requirement_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - SOUND_EVENT
  symbols:
  - SoundEvent
  schemas: []
implementation_key: fabric/sound/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - sound_properties
repair:
  scope:
  - minecraft/sound/requirement
  writable_anchors:
  - /* MMM:sound_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- resource
- test
rules:
- Implement requirement responsibility for sound strictly within declared SOUND_EVENT
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required sound prerequisite receipt is missing; never invent defaults.
- Output must satisfy semantic_contract validator before completion.
postconditions:
- sound requirement matches host version contract
- sound requirement receipts emitted with verified context
