id: minecraft/sound/validation
task: Implement only the validation responsibility of the supplied sound artifact.
execution_mode: deterministic
side:
- client
inputs:
- name: sound_identity
  type: identifier
  required: true
outputs:
- name: sound_validation_receipt
  type: receipt
host_requirements:
  capabilities:
  - SOUND_EVENT
implementation_key: fabric/sound/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/sound/validation
  writable_anchors:
  - /* MMM:sound_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- resource
- test
rules:
- Implement validation responsibility for sound strictly within declared SOUND_EVENT
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required sound prerequisite receipt is missing; never invent defaults.
- Output must satisfy mod_integration_test validator before completion.
