id: minecraft/sound/integration
task: Implement only the integration responsibility of the supplied sound artifact.
execution_mode: model
side:
- client
inputs:
- name: sound_identity
  type: identifier
  required: true
outputs:
- name: sound_integration_receipt
  type: receipt
host_requirements:
  capabilities:
  - SOUND_EVENT
  symbols:
  - sound_event_register
implementation_key: fabric/sound/integration
validators:
- java_parse
- client_side_only
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/sound/integration
  writable_anchors:
  - /* MMM:sound_integration */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- integration
anchor_kinds:
- resource
- test
rules:
- Implement integration responsibility for sound strictly within declared SOUND_EVENT
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required sound prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
