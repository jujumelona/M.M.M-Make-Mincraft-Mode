id: minecraft/component/validation
task: Implement only the validation responsibility of the supplied component artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: component_identity
  type: identifier
  required: true
outputs:
- name: component_validation_receipt
  type: receipt
host_requirements:
  capabilities:
  - DATA_COMPONENTS
implementation_key: fabric/component/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/component/validation
  writable_anchors:
  - /* MMM:component_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- symbol
- test
rules:
- Implement validation responsibility for component strictly within declared DATA_COMPONENTS
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required component prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy mod_integration_test validator before completion.
