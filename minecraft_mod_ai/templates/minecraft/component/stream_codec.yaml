id: minecraft/component/stream_codec
task: Implement only the stream codec responsibility of the supplied component artifact.
execution_mode: model
side:
- common
inputs:
- name: component_identity
  type: identifier
  required: true
outputs:
- name: component_stream_codec_receipt
  type: receipt
host_requirements:
  capabilities:
  - DATA_COMPONENTS
implementation_key: fabric/component/stream_codec
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/component/stream_codec
  writable_anchors:
  - /* MMM:component_stream_codec */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- stream_codec
anchor_kinds:
- symbol
- test
rules:
- Implement stream_codec responsibility for component strictly within declared DATA_COMPONENTS
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required component prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
