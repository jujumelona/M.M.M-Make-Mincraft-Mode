id: minecraft/component/registry
task: Implement only the registry responsibility of the supplied component artifact.
execution_mode: model
side:
- common
inputs:
- name: component_identity
  type: identifier
  required: true
- name: component_registry_input
  type: specification
  required: true
outputs:
- name: component_registry_receipt
  type: receipt
- name: component_registry_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - DATA_COMPONENT
  symbols:
  - ComponentType
  schemas: []
implementation_key: fabric/component/registry
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - component_properties
repair:
  scope:
  - minecraft/component/registry
  writable_anchors:
  - /* MMM:component_registry */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- registry
anchor_kinds:
- registry_id
- symbol
- test
rules:
- Implement registry responsibility for component strictly within declared DATA_COMPONENTS
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required component prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- component registry matches host version contract
- component registry receipts emitted with verified context
