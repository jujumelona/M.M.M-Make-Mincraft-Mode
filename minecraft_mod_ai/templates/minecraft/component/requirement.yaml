id: minecraft/component/requirement
task: Implement only the requirement responsibility of the supplied component artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: component_identity
  type: identifier
  required: true
outputs:
- name: component_contract
  type: contract_receipt
host_requirements:
  capabilities:
  - DATA_COMPONENTS
implementation_key: fabric/component/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/component/requirement
  writable_anchors:
  - /* MMM:component_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- symbol
- test
rules:
- Implement requirement responsibility for component strictly within declared DATA_COMPONENTS
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required component prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy semantic_contract validator before completion.
