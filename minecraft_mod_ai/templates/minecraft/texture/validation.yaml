id: minecraft/texture/validation
task: Implement only the validation responsibility of the supplied texture artifact.
execution_mode: deterministic
side:
- client
inputs:
- name: texture_identity
  type: identifier
  required: true
- name: texture_validation_input
  type: specification
  required: true
outputs:
- name: texture_validation_receipt
  type: receipt
- name: texture_validation_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols:
  - register_item
  schemas: []
implementation_key: fabric/texture/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - texture_properties
repair:
  scope:
  - minecraft/texture/validation
  writable_anchors:
  - /* MMM:texture_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- resource
- test
rules:
- Implement validation responsibility for texture strictly within declared TEXTURE_ASSET
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required texture prerequisite receipt is missing; never invent defaults.
- Output must satisfy mod_integration_test validator before completion.
postconditions:
- texture validation matches host version contract
- texture validation receipts emitted with verified context
