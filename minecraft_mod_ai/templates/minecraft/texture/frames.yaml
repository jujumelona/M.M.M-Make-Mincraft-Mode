id: minecraft/texture/frames
task: Implement only the frames responsibility of the supplied texture artifact.
execution_mode: model
side:
- client
inputs:
- name: texture_identity
  type: identifier
  required: true
outputs:
- name: texture_frames_receipt
  type: receipt
host_requirements:
  capabilities:
  - TEXTURE_ASSET
implementation_key: fabric/texture/frames
validators:
- java_parse
- client_side_only
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/texture/frames
  writable_anchors:
  - /* MMM:texture_frames */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- frames
anchor_kinds:
- resource
- test
rules:
- Implement frames responsibility for texture strictly within declared TEXTURE_ASSET
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required texture prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
