id: minecraft/texture/generation
task: Implement only the generation responsibility of the supplied texture artifact.
execution_mode: model
side:
- server
inputs:
- name: texture_identity
  type: identifier
  required: true
outputs:
- name: texture_generation_receipt
  type: receipt
host_requirements:
  capabilities:
  - TEXTURE_ASSET
implementation_key: fabric/texture/generation
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/texture/generation
  writable_anchors:
  - /* MMM:texture_generation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- generation
anchor_kinds:
- resource
- test
rules:
- Implement generation responsibility for texture strictly within declared TEXTURE_ASSET
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required texture prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
