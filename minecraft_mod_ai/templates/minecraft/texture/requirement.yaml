id: minecraft/texture/requirement
task: Implement only the requirement responsibility of the supplied texture artifact.
execution_mode: deterministic
side:
- client
inputs:
- name: texture_identity
  type: identifier
  required: true
- name: texture_requirement_input
  type: specification
  required: true
outputs:
- name: texture_requirement_receipt
  type: receipt
- name: texture_requirement_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols:
  - register_item
  schemas: []
implementation_key: fabric/texture/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - texture_properties
repair:
  scope:
  - minecraft/texture/requirement
  writable_anchors:
  - /* MMM:texture_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- resource
- test
rules:
- Implement requirement responsibility for texture strictly within declared TEXTURE_ASSET
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required texture prerequisite receipt is missing; never invent defaults.
- Output must satisfy semantic_contract validator before completion.
postconditions:
- texture requirement matches host version contract
- texture requirement receipts emitted with verified context
