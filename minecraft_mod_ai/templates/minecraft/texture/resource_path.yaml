id: minecraft/texture/resource_path
task: Implement only the resource path responsibility of the supplied texture artifact.
execution_mode: deterministic
side:
- client
inputs:
- name: texture_identity
  type: identifier
  required: true
outputs:
- name: texture_resource_path_receipt
  type: receipt
host_requirements:
  capabilities:
  - TEXTURE_ASSET
implementation_key: fabric/texture/resource_path
validators:
- json_schema
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/texture/resource_path
  writable_anchors:
  - /* MMM:texture_resource_path */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- resource_path
anchor_kinds:
- resource
- test
rules:
- Implement resource_path responsibility for texture strictly within declared TEXTURE_ASSET
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required texture prerequisite receipt is missing; never invent defaults.
- Output must satisfy json_schema validator before completion.
