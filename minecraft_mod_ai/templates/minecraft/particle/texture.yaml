id: minecraft/particle/texture
task: Implement only the texture responsibility of the supplied particle artifact.
execution_mode: model
side:
- client
inputs:
- name: particle_identity
  type: identifier
  required: true
- name: particle_texture_input
  type: specification
  required: true
outputs:
- name: particle_texture_receipt
  type: receipt
- name: particle_texture_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - PARTICLE_TYPE
  symbols:
  - ParticleType
  schemas: []
implementation_key: fabric/particle/texture
validators:
- java_parse
- client_side_only
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - particle_properties
repair:
  scope:
  - minecraft/particle/texture
  writable_anchors:
  - /* MMM:particle_texture */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- texture
anchor_kinds:
- symbol
- test
rules:
- Implement texture responsibility for particle strictly within declared PARTICLE_TYPE
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required particle prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- particle texture matches host version contract
- particle texture receipts emitted with verified context
