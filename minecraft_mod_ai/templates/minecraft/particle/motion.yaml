id: minecraft/particle/motion
task: Implement only the motion responsibility of the supplied particle artifact.
execution_mode: model
side:
- client
inputs:
- name: particle_identity
  type: identifier
  required: true
outputs:
- name: particle_motion_receipt
  type: receipt
host_requirements:
  capabilities:
  - PARTICLE_TYPE
implementation_key: fabric/particle/motion
validators:
- java_parse
- client_side_only
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/particle/motion
  writable_anchors:
  - /* MMM:particle_motion */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- motion
anchor_kinds:
- symbol
- test
rules:
- Implement motion responsibility for particle strictly within declared PARTICLE_TYPE
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required particle prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
