id: minecraft/language/fallback
task: Implement only the fallback responsibility of the supplied language artifact.
execution_mode: model
side:
- common
inputs:
- name: language_identity
  type: identifier
  required: true
- name: language_fallback_input
  type: specification
  required: true
outputs:
- name: language_fallback_receipt
  type: receipt
- name: language_fallback_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols: []
  schemas:
  - fabric/item/lang_en
implementation_key: fabric/language/fallback
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - language_properties
repair:
  scope:
  - minecraft/language/fallback
  writable_anchors:
  - /* MMM:language_fallback */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- fallback
anchor_kinds:
- resource
- test
rules:
- Implement fallback responsibility for language strictly within declared LANGUAGE_ASSET
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required language prerequisite receipt is missing; never invent defaults.
- Output must satisfy json_schema validator before completion.
postconditions:
- language fallback matches host version contract
- language fallback receipts emitted with verified context
