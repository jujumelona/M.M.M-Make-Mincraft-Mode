id: minecraft/language/text
task: Implement only the text responsibility of the supplied language artifact.
execution_mode: model
side:
- common
inputs:
- name: language_identity
  type: identifier
  required: true
- name: language_text_input
  type: specification
  required: true
outputs:
- name: language_text_receipt
  type: receipt
- name: language_text_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols: []
  schemas:
  - fabric/item/lang_en
implementation_key: fabric/language/text
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - language_properties
repair:
  scope:
  - minecraft/language/text
  writable_anchors:
  - /* MMM:language_text */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- text
anchor_kinds:
- resource
- test
rules:
- Implement text responsibility for language strictly within declared LANGUAGE_ASSET
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required language prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- language text matches host version contract
- language text receipts emitted with verified context
