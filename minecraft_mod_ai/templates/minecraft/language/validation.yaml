id: minecraft/language/validation
task: Implement only the validation responsibility of the supplied language artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: language_identity
  type: identifier
  required: true
- name: language_validation_input
  type: specification
  required: true
outputs:
- name: language_validation_receipt
  type: receipt
- name: language_validation_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols: []
  schemas:
  - fabric/item/lang_en
implementation_key: fabric/language/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - language_properties
repair:
  scope:
  - minecraft/language/validation
  writable_anchors:
  - /* MMM:language_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- resource
- test
rules:
- Implement validation responsibility for language strictly within declared LANGUAGE_ASSET
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required language prerequisite receipt is missing; never invent defaults.
- Output must satisfy mod_integration_test validator before completion.
postconditions:
- language validation matches host version contract
- language validation receipts emitted with verified context
