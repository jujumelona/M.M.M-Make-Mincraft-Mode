id: minecraft/language/integration
task: Implement only the integration responsibility of the supplied language artifact.
execution_mode: model
side:
- common
inputs:
- name: language_identity
  type: identifier
  required: true
outputs:
- name: language_integration_receipt
  type: receipt
host_requirements:
  capabilities:
  - LANGUAGE_ASSET
implementation_key: fabric/language/integration
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/language/integration
  writable_anchors:
  - /* MMM:language_integration */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- integration
anchor_kinds:
- resource
- test
rules:
- Implement integration responsibility for language strictly within declared LANGUAGE_ASSET
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required language prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
