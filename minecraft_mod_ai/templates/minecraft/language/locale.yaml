id: minecraft/language/locale
task: Implement only the locale responsibility of the supplied language artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: language_identity
  type: identifier
  required: true
outputs:
- name: language_locale_receipt
  type: receipt
host_requirements:
  capabilities:
  - LANGUAGE_ASSET
implementation_key: fabric/language/locale
validators:
- json_schema
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/language/locale
  writable_anchors:
  - /* MMM:language_locale */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- locale
anchor_kinds:
- resource
- test
rules:
- Implement locale responsibility for language strictly within declared LANGUAGE_ASSET
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required language prerequisite receipt is missing; never invent defaults.
- Output must satisfy json_schema validator before completion.
