id: minecraft/language/key
task: Implement only the key responsibility of the supplied language artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: language_identity
  type: identifier
  required: true
- name: language_key_input
  type: specification
  required: true
outputs:
- name: language_key_receipt
  type: receipt
- name: language_key_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols: []
  schemas:
  - fabric/item/lang_en
implementation_key: fabric/language/key
validators:
- json_schema
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - language_properties
repair:
  scope:
  - minecraft/language/key
  writable_anchors:
  - /* MMM:language_key */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- key
anchor_kinds:
- resource
- test
rules:
- Implement key responsibility for language strictly within declared LANGUAGE_ASSET
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required language prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- language key matches host version contract
- language key receipts emitted with verified context
