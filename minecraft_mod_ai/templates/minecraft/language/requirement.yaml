id: minecraft/language/requirement
task: Implement only the requirement responsibility of the supplied language artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: language_identity
  type: identifier
  required: true
- name: language_requirement_input
  type: specification
  required: true
outputs:
- name: language_requirement_receipt
  type: receipt
- name: language_requirement_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols: []
  schemas:
  - fabric/item/lang_en
implementation_key: fabric/language/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - language_properties
repair:
  scope:
  - minecraft/language/requirement
  writable_anchors:
  - /* MMM:language_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- resource
- test
rules:
- Implement requirement responsibility for language strictly within declared LANGUAGE_ASSET
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required language prerequisite receipt is missing; never invent defaults.
- Output must satisfy semantic_contract validator before completion.
postconditions:
- language requirement matches host version contract
- language requirement receipts emitted with verified context
