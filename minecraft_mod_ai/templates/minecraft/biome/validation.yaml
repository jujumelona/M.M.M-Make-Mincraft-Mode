id: minecraft/biome/validation
task: Implement only the validation responsibility of the supplied biome artifact.
execution_mode: deterministic
side:
- server
inputs:
- name: biome_identity
  type: identifier
  required: true
outputs:
- name: biome_validation_receipt
  type: receipt
host_requirements:
  capabilities:
  - BIOME
implementation_key: fabric/biome/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/biome/validation
  writable_anchors:
  - /* MMM:biome_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- symbol
- test
rules:
- Implement validation responsibility for biome strictly within declared BIOME capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required biome prerequisite receipt is missing; never invent defaults.
- Output must satisfy mod_integration_test validator before completion.
