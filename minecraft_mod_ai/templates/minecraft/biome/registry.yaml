id: minecraft/biome/registry
task: Implement only the registry responsibility of the supplied biome artifact.
execution_mode: model
side:
- common
inputs:
- name: biome_identity
  type: identifier
  required: true
- name: biome_registry_input
  type: specification
  required: true
outputs:
- name: biome_registry_receipt
  type: receipt
- name: biome_registry_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - BIOME
  symbols: []
  schemas: []
implementation_key: fabric/biome/registry
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - biome_properties
repair:
  scope:
  - minecraft/biome/registry
  writable_anchors:
  - /* MMM:biome_registry */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- registry
anchor_kinds:
- registry_id
- symbol
- test
rules:
- Implement registry responsibility for biome strictly within declared BIOME capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required biome prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- biome registry matches host version contract
- biome registry receipts emitted with verified context
