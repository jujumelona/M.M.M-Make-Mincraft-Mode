id: minecraft/biome/integration
task: Implement only the integration responsibility of the supplied biome artifact.
execution_mode: model
side:
- common
inputs:
- name: biome_identity
  type: identifier
  required: true
- name: biome_integration_input
  type: specification
  required: true
outputs:
- name: biome_integration_receipt
  type: receipt
- name: biome_integration_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - BIOME
  symbols: []
  schemas: []
implementation_key: fabric/biome/integration
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - biome_properties
repair:
  scope:
  - minecraft/biome/integration
  writable_anchors:
  - /* MMM:biome_integration */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- integration
anchor_kinds:
- symbol
- test
rules:
- Implement integration responsibility for biome strictly within declared BIOME capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required biome prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- biome integration matches host version contract
- biome integration receipts emitted with verified context
