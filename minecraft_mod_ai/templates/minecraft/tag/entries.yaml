id: minecraft/tag/entries
task: Implement only the entries responsibility of the supplied tag artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: tag_values
  type: array
  required: true
outputs:
- name: tag_json
  type: resource_file
host_requirements:
  capabilities:
  - TAGS
implementation_key: fabric/tag/registry
validators:
- json_schema
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
repair:
  scope:
  - minecraft/tag/entries
  writable_anchors:
  - /* MMM:tag_entries */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- entries
anchor_kinds:
- resource
- test
rules:
- Use the supplied artifact identity and acceptance contract.
- Use only target-compatible symbols verified in the supplied bindings.
- If this concern is inapplicable, record its concrete reason and perform no edit.
- If information is missing, return blocked; never invent a default implementation.
- Modify only the owned anchor for this responsibility.
- Complete only after its declared postcondition is checked.
