id: minecraft/tag/validation
task: Implement only the validation responsibility of the supplied tag artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: tag_identity
  type: identifier
  required: true
- name: tag_validation_input
  type: specification
  required: true
outputs:
- name: tag_validation_receipt
  type: receipt
- name: tag_validation_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - TAGS
  symbols: []
  schemas:
  - fabric/tag/registry
implementation_key: fabric/tag/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - tag_properties
repair:
  scope:
  - minecraft/tag/validation
  writable_anchors:
  - /* MMM:tag_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- resource
- test
rules:
- Implement validation responsibility for tag strictly within declared TAGS capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required tag prerequisite receipt is missing; never invent defaults.
- Output must satisfy mod_integration_test validator before completion.
postconditions:
- tag validation matches host version contract
- tag validation receipts emitted with verified context
