id: minecraft/tag/registry
task: Implement only the registry responsibility of the supplied tag artifact.
execution_mode: model
side:
- common
inputs:
- name: tag_identity
  type: identifier
  required: true
outputs:
- name: tag_registry_id
  type: string
- name: tag_java_symbol
  type: string
host_requirements:
  capabilities:
  - TAGS
implementation_key: fabric/tag/registry
validators:
- java_parse
- registry_identifier_unique
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - java_constant
repair:
  scope:
  - minecraft/tag/registry
  writable_anchors:
  - /* MMM:tag_registry */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- registry
anchor_kinds:
- registry_id
- symbol
- test
rules:
- Implement registry responsibility for tag strictly within declared TAGS capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required tag prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
