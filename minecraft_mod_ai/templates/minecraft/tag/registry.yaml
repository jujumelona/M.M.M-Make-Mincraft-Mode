id: minecraft/tag/registry
task: Implement only the registry responsibility of the supplied tag artifact.
execution_mode: model
side:
- common
inputs:
- name: tag_identity
  type: identifier
  required: true
- name: tag_registry_input
  type: specification
  required: true
outputs:
- name: tag_registry_receipt
  type: receipt
- name: tag_registry_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - TAGS
  symbols: []
  schemas:
  - fabric/tag/registry
implementation_key: fabric/tag/registry
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - tag_properties
repair:
  scope:
  - minecraft/tag/registry
  writable_anchors:
  - /* MMM:tag_registry */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- registry
anchor_kinds:
- registry_id
- symbol
- test
rules:
- Implement registry responsibility for tag strictly within declared TAGS capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required tag prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- tag registry matches host version contract
- tag registry receipts emitted with verified context
