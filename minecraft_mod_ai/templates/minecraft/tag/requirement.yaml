id: minecraft/tag/requirement
task: Implement only the requirement responsibility of the supplied tag artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: tag_identity
  type: identifier
  required: true
- name: tag_requirement_input
  type: specification
  required: true
outputs:
- name: tag_requirement_receipt
  type: receipt
- name: tag_requirement_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - TAGS
  symbols: []
  schemas:
  - fabric/tag/registry
implementation_key: fabric/tag/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - tag_properties
repair:
  scope:
  - minecraft/tag/requirement
  writable_anchors:
  - /* MMM:tag_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- resource
- test
rules:
- Implement requirement responsibility for tag strictly within declared TAGS capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required tag prerequisite receipt is missing; never invent defaults.
- Output must satisfy semantic_contract validator before completion.
postconditions:
- tag requirement matches host version contract
- tag requirement receipts emitted with verified context
