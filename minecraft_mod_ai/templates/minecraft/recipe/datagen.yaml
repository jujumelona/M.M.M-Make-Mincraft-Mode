id: minecraft/recipe/datagen
task: Implement only the datagen responsibility of the supplied recipe artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: recipe_identity
  type: identifier
  required: true
outputs:
- name: recipe_datagen_receipt
  type: receipt
host_requirements:
  capabilities:
  - RECIPE_CRAFTING
implementation_key: fabric/recipe/datagen
validators:
- json_schema
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/recipe/datagen
  writable_anchors:
  - /* MMM:recipe_datagen */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- datagen
anchor_kinds:
- resource
- test
rules:
- Implement datagen responsibility for recipe strictly within declared RECIPE_CRAFTING
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required recipe prerequisite receipt is missing; never invent defaults.
- Output must satisfy json_schema validator before completion.
