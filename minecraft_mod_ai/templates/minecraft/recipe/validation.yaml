id: minecraft/recipe/validation
task: Implement only the validation responsibility of the supplied recipe artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: recipe_identity
  type: identifier
  required: true
- name: recipe_validation_input
  type: specification
  required: true
outputs:
- name: recipe_validation_receipt
  type: receipt
- name: recipe_validation_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - RECIPE_CRAFTING
  - RECIPE_SMELTING
  symbols: []
  schemas:
  - fabric/recipe/shaped
  - fabric/recipe/shapeless
implementation_key: fabric/recipe/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - recipe_properties
repair:
  scope:
  - minecraft/recipe/validation
  writable_anchors:
  - /* MMM:recipe_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- resource
- test
rules:
- Implement validation responsibility for recipe strictly within declared RECIPE_CRAFTING
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required recipe prerequisite receipt is missing; never invent defaults.
- Output must satisfy mod_integration_test validator before completion.
postconditions:
- recipe validation matches host version contract
- recipe validation receipts emitted with verified context
