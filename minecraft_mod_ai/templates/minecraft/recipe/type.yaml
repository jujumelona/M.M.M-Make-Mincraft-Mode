id: minecraft/recipe/type
task: Implement only the type responsibility of the supplied recipe artifact.
execution_mode: model
side:
- common
inputs:
- name: recipe_identity
  type: identifier
  required: true
- name: recipe_type_input
  type: specification
  required: true
outputs:
- name: recipe_type_receipt
  type: receipt
- name: recipe_type_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - RECIPE_CRAFTING
  - RECIPE_SMELTING
  symbols: []
  schemas:
  - fabric/recipe/shaped
  - fabric/recipe/shapeless
implementation_key: fabric/recipe/type
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - recipe_properties
repair:
  scope:
  - minecraft/recipe/type
  writable_anchors:
  - /* MMM:recipe_type */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- type
anchor_kinds:
- resource
- test
rules:
- Implement type responsibility for recipe strictly within declared RECIPE_CRAFTING
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required recipe prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- recipe type matches host version contract
- recipe type receipts emitted with verified context
