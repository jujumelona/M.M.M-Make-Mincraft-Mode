id: minecraft/recipe/ingredient
task: Implement only the ingredient responsibility of the supplied recipe artifact.
execution_mode: model
side:
- common
inputs:
- name: recipe_identity
  type: identifier
  required: true
outputs:
- name: recipe_ingredient_receipt
  type: receipt
host_requirements:
  capabilities:
  - RECIPE_CRAFTING
implementation_key: fabric/recipe/ingredient
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/recipe/ingredient
  writable_anchors:
  - /* MMM:recipe_ingredient */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- ingredient
anchor_kinds:
- resource
- test
rules:
- Implement ingredient responsibility for recipe strictly within declared RECIPE_CRAFTING
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required recipe prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
