id: minecraft/recipe/serializer
task: Implement only the serializer responsibility of the supplied recipe artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: recipe_identity
  type: identifier
  required: true
outputs:
- name: recipe_json
  type: resource_file
host_requirements:
  capabilities:
  - RECIPE_CRAFTING
implementation_key: fabric/recipe/serializer
validators:
- json_schema
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/recipe/serializer
  writable_anchors:
  - /* MMM:recipe_serializer */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- serializer
anchor_kinds:
- resource
- test
rules:
- Implement serializer responsibility for recipe strictly within declared RECIPE_CRAFTING
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required recipe prerequisite receipt is missing; never invent defaults.
- Output must satisfy json_schema validator before completion.
