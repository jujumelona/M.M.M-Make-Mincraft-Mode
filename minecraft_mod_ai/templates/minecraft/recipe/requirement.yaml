id: minecraft/recipe/requirement
task: Implement only the requirement responsibility of the supplied recipe artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: recipe_identity
  type: identifier
  required: true
- name: recipe_requirement_input
  type: specification
  required: true
outputs:
- name: recipe_requirement_receipt
  type: receipt
- name: recipe_requirement_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - RECIPE_CRAFTING
  - RECIPE_SMELTING
  symbols: []
  schemas:
  - fabric/recipe/shaped
  - fabric/recipe/shapeless
implementation_key: fabric/recipe/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - recipe_properties
repair:
  scope:
  - minecraft/recipe/requirement
  writable_anchors:
  - /* MMM:recipe_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- resource
- test
rules:
- Implement requirement responsibility for recipe strictly within declared RECIPE_CRAFTING
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required recipe prerequisite receipt is missing; never invent defaults.
- Output must satisfy semantic_contract validator before completion.
postconditions:
- recipe requirement matches host version contract
- recipe requirement receipts emitted with verified context
