id: minecraft/animation/validation
task: Implement only the validation responsibility of the supplied animation artifact.
execution_mode: deterministic
side:
- client
inputs:
- name: animation_identity
  type: identifier
  required: true
- name: animation_validation_input
  type: specification
  required: true
outputs:
- name: animation_validation_receipt
  type: receipt
- name: animation_validation_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - ENTITY_EXISTS
  symbols:
  - EntityType
  schemas: []
implementation_key: fabric/animation/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - animation_properties
repair:
  scope:
  - minecraft/animation/validation
  writable_anchors:
  - /* MMM:animation_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- resource
- test
rules:
- Implement validation responsibility for animation strictly within declared ANIMATION_DEFINITION
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required animation prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy mod_integration_test validator before completion.
postconditions:
- animation validation matches host version contract
- animation validation receipts emitted with verified context
