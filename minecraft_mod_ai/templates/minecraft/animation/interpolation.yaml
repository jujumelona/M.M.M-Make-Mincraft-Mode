id: minecraft/animation/interpolation
task: Implement only the interpolation responsibility of the supplied animation artifact.
execution_mode: model
side:
- client
inputs:
- name: animation_identity
  type: identifier
  required: true
outputs:
- name: animation_interpolation_receipt
  type: receipt
host_requirements:
  capabilities:
  - ANIMATION_DEFINITION
implementation_key: fabric/animation/interpolation
validators:
- java_parse
- client_side_only
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/animation/interpolation
  writable_anchors:
  - /* MMM:animation_interpolation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- interpolation
anchor_kinds:
- resource
- test
rules:
- Implement interpolation responsibility for animation strictly within declared ANIMATION_DEFINITION
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required animation prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
