id: minecraft/effect/validation
task: Implement only the validation responsibility of the supplied effect artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: effect_identity
  type: identifier
  required: true
- name: effect_validation_input
  type: specification
  required: true
outputs:
- name: effect_validation_receipt
  type: receipt
- name: effect_validation_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - STATUS_EFFECT
  symbols:
  - StatusEffect
  schemas: []
implementation_key: fabric/effect/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - effect_properties
repair:
  scope:
  - minecraft/effect/validation
  writable_anchors:
  - /* MMM:effect_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- symbol
- test
rules:
- Implement validation responsibility for effect strictly within declared STATUS_EFFECT
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required effect prerequisite receipt is missing; never invent defaults.
- Output must satisfy mod_integration_test validator before completion.
postconditions:
- effect validation matches host version contract
- effect validation receipts emitted with verified context
