id: minecraft/effect/amplifier
task: Implement only the amplifier responsibility of the supplied effect artifact.
execution_mode: model
side:
- common
inputs:
- name: effect_identity
  type: identifier
  required: true
outputs:
- name: effect_amplifier_receipt
  type: receipt
host_requirements:
  capabilities:
  - STATUS_EFFECT
implementation_key: fabric/effect/amplifier
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/effect/amplifier
  writable_anchors:
  - /* MMM:effect_amplifier */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- amplifier
anchor_kinds:
- symbol
- test
rules:
- Implement amplifier responsibility for effect strictly within declared STATUS_EFFECT
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required effect prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
