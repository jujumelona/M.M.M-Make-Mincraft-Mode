id: minecraft/effect/requirement
task: Implement only the requirement responsibility of the supplied effect artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: effect_identity
  type: identifier
  required: true
outputs:
- name: effect_contract
  type: contract_receipt
host_requirements:
  capabilities:
  - STATUS_EFFECT
implementation_key: fabric/effect/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/effect/requirement
  writable_anchors:
  - /* MMM:effect_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- symbol
- test
rules:
- Implement requirement responsibility for effect strictly within declared STATUS_EFFECT
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required effect prerequisite receipt is missing; never invent defaults.
- Output must satisfy semantic_contract validator before completion.
