id: minecraft/item/interaction
task: Implement only the interaction responsibility of the supplied item artifact.
execution_mode: model
side:
- common
inputs:
- name: item_identity
  type: identifier
  required: true
outputs:
- name: item_interaction_receipt
  type: receipt
host_requirements:
  capabilities:
  - REGISTER_ITEM
implementation_key: fabric/item/interaction
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/item/interaction
  writable_anchors:
  - /* MMM:item_interaction */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- interaction
anchor_kinds:
- symbol
- test
rules:
- Implement interaction responsibility for item strictly within declared REGISTER_ITEM
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required item prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
