id: minecraft/item/requirement
task: Implement only the requirement responsibility of the supplied item artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: item_identity
  type: identifier
  required: true
outputs:
- name: item_contract
  type: contract_receipt
host_requirements:
  capabilities:
  - REGISTER_ITEM
implementation_key: minecraft/item/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
repair:
  scope:
  - minecraft/item/requirement
  writable_anchors:
  - /* MMM:item_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- symbol
- test
rules:
- Use the supplied artifact identity and acceptance contract.
- Use only target-compatible symbols verified in the supplied bindings.
- If this concern is inapplicable, record its concrete reason and perform no edit.
- If information is missing, return blocked; never invent a default implementation.
- Modify only the owned anchor for this responsibility.
- Complete only after its declared postcondition is checked.
