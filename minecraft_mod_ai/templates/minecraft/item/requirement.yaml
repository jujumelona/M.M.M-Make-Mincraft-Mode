id: minecraft/item/requirement
task: Implement only the requirement responsibility of the supplied item artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: item_identity
  type: identifier
  required: true
outputs:
- name: item_contract
  type: contract_receipt
host_requirements:
  capabilities:
  - REGISTER_ITEM
implementation_key: fabric/item/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/item/requirement
  writable_anchors:
  - /* MMM:item_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- symbol
- test
rules:
- Implement requirement responsibility for item strictly within declared REGISTER_ITEM
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required item prerequisite receipt is missing; never invent defaults.
- Output must satisfy semantic_contract validator before completion.
