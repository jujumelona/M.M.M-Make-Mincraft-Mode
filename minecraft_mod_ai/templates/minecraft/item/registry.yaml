id: minecraft/item/registry
task: Implement only the registry responsibility of the supplied item artifact.
execution_mode: model
side:
- common
inputs:
- name: item_identity
  type: identifier
  required: true
outputs:
- name: item_registry_id
  type: string
- name: item_java_symbol
  type: string
host_requirements:
  capabilities:
  - REGISTER_ITEM
  symbols:
  - register_item
  - builtin_item_registry
implementation_key: fabric/item/registry
validators:
- java_parse
- registry_identifier_unique
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - java_constant
repair:
  scope:
  - minecraft/item/registry
  writable_anchors:
  - /* MMM:item_registry */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- registry
anchor_kinds:
- registry_id
- symbol
- test
rules:
- Implement registry responsibility for item strictly within declared REGISTER_ITEM
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required item prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
