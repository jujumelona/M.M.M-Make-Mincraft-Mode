id: minecraft/item/validation
task: Implement only the validation responsibility of the supplied item artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: item_identity
  type: identifier
  required: true
- name: item_validation_input
  type: specification
  required: true
outputs:
- name: item_validation_receipt
  type: receipt
- name: item_validation_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  - ITEM_SETTINGS
  symbols:
  - register_item
  - resource_key_create
  - item_stacks_to
  schemas: []
implementation_key: fabric/item/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - item_properties
repair:
  scope:
  - minecraft/item/validation
  writable_anchors:
  - /* MMM:item_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- symbol
- test
rules:
- Implement validation responsibility for item strictly within declared REGISTER_ITEM
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required item prerequisite receipt is missing; never invent defaults.
- Output must satisfy mod_integration_test validator before completion.
postconditions:
- item validation matches host version contract
- item validation receipts emitted with verified context
