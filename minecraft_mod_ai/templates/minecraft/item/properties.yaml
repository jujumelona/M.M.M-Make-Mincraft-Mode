id: minecraft/item/properties
task: Implement only the properties responsibility of the supplied item artifact.
execution_mode: model
side:
- common
inputs:
- name: item_identity
  type: identifier
  required: true
- name: item_properties_input
  type: specification
  required: true
outputs:
- name: item_properties_receipt
  type: receipt
- name: item_properties_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - REGISTER_ITEM
  - ITEM_SETTINGS
  symbols:
  - register_item
  - resource_key_create
  - item_stacks_to
  schemas: []
implementation_key: fabric/item/properties
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - item_properties
repair:
  scope:
  - minecraft/item/properties
  writable_anchors:
  - /* MMM:item_properties */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- properties
anchor_kinds:
- symbol
- test
rules:
- Implement properties responsibility for item strictly within declared REGISTER_ITEM
  capability.
- Target side must remain common; reject cross-side symbol leakage.
- Fail closed if required item prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- item properties matches host version contract
- item properties receipts emitted with verified context
