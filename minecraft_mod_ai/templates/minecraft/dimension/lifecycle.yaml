id: minecraft/dimension/lifecycle
task: Implement only the lifecycle responsibility of the supplied dimension artifact.
execution_mode: model
side:
- server
inputs:
- name: dimension_identity
  type: identifier
  required: true
outputs:
- name: dimension_lifecycle_receipt
  type: receipt
host_requirements:
  capabilities:
  - DIMENSION
implementation_key: fabric/dimension/lifecycle
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/dimension/lifecycle
  writable_anchors:
  - /* MMM:dimension_lifecycle */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- lifecycle
anchor_kinds:
- symbol
- test
rules:
- Implement lifecycle responsibility for dimension strictly within declared DIMENSION
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required dimension prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
