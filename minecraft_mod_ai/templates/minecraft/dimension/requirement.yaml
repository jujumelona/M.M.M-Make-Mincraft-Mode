id: minecraft/dimension/requirement
task: Implement only the requirement responsibility of the supplied dimension artifact.
execution_mode: deterministic
side:
- common
inputs:
- name: dimension_identity
  type: identifier
  required: true
- name: dimension_requirement_input
  type: specification
  required: true
outputs:
- name: dimension_requirement_receipt
  type: receipt
- name: dimension_requirement_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - DIMENSION
  symbols: []
  schemas: []
implementation_key: fabric/dimension/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - dimension_properties
repair:
  scope:
  - minecraft/dimension/requirement
  writable_anchors:
  - /* MMM:dimension_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- symbol
- test
rules:
- Implement requirement responsibility for dimension strictly within declared DIMENSION
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required dimension prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy semantic_contract validator before completion.
postconditions:
- dimension requirement matches host version contract
- dimension requirement receipts emitted with verified context
