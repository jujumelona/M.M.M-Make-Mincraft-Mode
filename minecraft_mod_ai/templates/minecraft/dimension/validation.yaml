id: minecraft/dimension/validation
task: Implement only the validation responsibility of the supplied dimension artifact.
execution_mode: deterministic
side:
- server
inputs:
- name: dimension_identity
  type: identifier
  required: true
outputs:
- name: dimension_validation_receipt
  type: receipt
host_requirements:
  capabilities:
  - DIMENSION
implementation_key: fabric/dimension/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
repair:
  scope:
  - minecraft/dimension/validation
  writable_anchors:
  - /* MMM:dimension_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- symbol
- test
rules:
- Implement validation responsibility for dimension strictly within declared DIMENSION
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required dimension prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy mod_integration_test validator before completion.
