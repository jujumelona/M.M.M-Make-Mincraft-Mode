id: minecraft/dimension/registry
task: Implement only the registry responsibility of the supplied dimension artifact.
execution_mode: model
side:
- server
inputs:
- name: dimension_identity
  type: identifier
  required: true
outputs:
- name: dimension_registry_id
  type: string
- name: dimension_java_symbol
  type: string
host_requirements:
  capabilities:
  - DIMENSION
implementation_key: fabric/dimension/registry
validators:
- java_parse
- registry_identifier_unique
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - java_constant
repair:
  scope:
  - minecraft/dimension/registry
  writable_anchors:
  - /* MMM:dimension_registry */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- registry
anchor_kinds:
- registry_id
- symbol
- test
rules:
- Implement registry responsibility for dimension strictly within declared DIMENSION
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required dimension prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
