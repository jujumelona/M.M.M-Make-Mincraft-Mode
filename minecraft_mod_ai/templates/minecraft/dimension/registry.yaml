id: minecraft/dimension/registry
task: Author the supplied dimension as a mod-owned datapack dimension definition.
execution_mode: model
side:
- common
inputs:
- name: dimension_identity
  type: identifier
  required: true
- name: dimension_registry_input
  type: specification
  required: true
outputs:
- name: dimension_registry_receipt
  type: receipt
- name: dimension_registry_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - DIMENSION
  symbols: []
  schemas: []
implementation_key: fabric/dimension/registry
validators:
- json_schema
resource_contract:
  min_minecraft: '1.19'
  renderer: dimension
  target_path: &dimension_resource_path src/main/resources/data/{{mod_id}}/dimension/{{registry_path}}.json
  description: >-
    Return a structured dimension definition using the real target registry IDs
    supplied in the schema. Select the dimension type, noise settings and biome
    source to implement the source requirement and authored module properties.
    Every choice needs gameplay justification from that requirement; never select
    an overworld clone merely to produce a valid file. Preserve concrete supplied
    dimension_type IDs. The host preserves authored ambient_light and
    coordinate_scale in an inline copy of the selected target dimension type.
    Use dimension_type_overrides only for environmental properties grounded in
    the active requirement or meaningful authored design. Express darkness as
    numeric ambient light and a coordinate ratio as a numeric scale. Opaque ID
    fragments in legacy properties are not numeric facts; leave unspecified
    overrides absent so the selected real type supplies them. Never invent
    environmental numbers merely to fill optional properties.
    Custom terrain or biome definitions must already exist as prerequisite resources.
  authored_type_fields:
    ambient_light:
      type: number
      minimum: 0
      maximum: 1
    coordinate_scale:
      type: number
      minimum: 0.00001
      maximum: 30000000
  model_schema: &dimension_definition
    type: object
    additionalProperties: false
    required: [type, generator]
    properties:
      type:
        type: string
        pattern: '^[a-z0-9_.-]+:[a-z0-9_./-]+$'
        minLength: 1
        x-mmm-resource-registry: dimension_type
      dimension_type_overrides:
        type: object
        additionalProperties: false
        properties:
          ambient_light:
            type: number
            minimum: 0
            maximum: 1
          coordinate_scale:
            type: number
            minimum: 0.00001
            maximum: 30000000
      generator: &dimension_generator
        type: object
        additionalProperties: false
        required: [type, settings, biome_source]
        properties:
          type:
            const: minecraft:noise
          settings:
            type: string
            pattern: '^[a-z0-9_.-]+:[a-z0-9_./-]+$'
            minLength: 1
            x-mmm-resource-registry: worldgen/noise_settings
          biome_source:
            anyOf:
            - type: object
              additionalProperties: false
              required: [type, biome]
              properties:
                type:
                  const: minecraft:fixed
                biome:
                  type: string
                  pattern: '^[a-z0-9_.-]+:[a-z0-9_./-]+$'
                  minLength: 1
                  x-mmm-resource-registry: worldgen/biome
            - type: object
              additionalProperties: false
              required: [type, preset]
              properties:
                type:
                  const: minecraft:multi_noise
                preset:
                  type: string
                  pattern: '^[a-z0-9_.-]+:[a-z0-9_./-]+$'
                  minLength: 1
                  x-mmm-resource-registry: worldgen/multi_noise_biome_source_parameter_list
            - type: object
              additionalProperties: false
              required: [type]
              properties:
                type:
                  const: minecraft:the_end
  output_schema:
    <<: *dimension_definition
    properties:
      type:
        anyOf:
        - type: string
          pattern: '^[a-z0-9_.-]+:[a-z0-9_./-]+$'
          minLength: 1
        - type: object
          minProperties: 1
      generator: *dimension_generator
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - dimension_properties
repair:
  scope:
  - minecraft/dimension/registry
  writable_anchors:
  - *dimension_resource_path
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- registry
anchor_kinds:
- registry_id
- resource
rules:
- Implement only the declared DIMENSION resource responsibility.
- Return structured resource values; the host owns JSON syntax and file installation.
- Dimensions are dynamic datapack resources; do not search for a Java registerDimension API.
- Fail closed if required dimension prerequisite receipt is missing; never invent
  defaults.
- All selected registry references must resolve in the exact target or materialized project.
- Output must satisfy the dimension JSON schema and reference validator before completion.
postconditions:
- dimension registry matches host version contract
- dimension registry receipts emitted with verified context
