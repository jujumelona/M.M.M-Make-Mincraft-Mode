id: minecraft/dimension/registry
task: Implement only the registry responsibility of the supplied dimension artifact.
execution_mode: model
side:
- common
inputs:
- name: dimension_identity
  type: identifier
  required: true
- name: dimension_registry_input
  type: specification
  required: true
outputs:
- name: dimension_registry_receipt
  type: receipt
- name: dimension_registry_artifact
  type: code_fragment
host_requirements:
  java_class_header: plain
  capabilities:
  - DIMENSION
  symbols: []
  schemas: []
implementation_key: fabric/dimension/registry
validators:
- json_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - dimension_properties
repair:
  scope:
  - minecraft/dimension/registry
  writable_anchors:
  - /* MMM:dimension_registry */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- registry
anchor_kinds:
- registry_id
- symbol
- test
rules:
- Implement registry responsibility for dimension strictly within declared DIMENSION
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required dimension prerequisite receipt is missing; never invent
  defaults.
- The dimension definition is a data-pack JSON resource, not a Java registry method.
- Include a dimension type reference and an executable world generator definition.
- Output must satisfy json_parse and the host-owned dimension object schema before completion.
postconditions:
- dimension JSON definition matches host version contract
- dimension registry receipts emitted with verified context
