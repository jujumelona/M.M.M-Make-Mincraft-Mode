id: minecraft/dimension/integration
task: Implement only the integration responsibility of the supplied dimension artifact.
execution_mode: model
side:
- common
inputs:
- name: dimension_identity
  type: identifier
  required: true
- name: dimension_integration_input
  type: specification
  required: true
outputs:
- name: dimension_integration_receipt
  type: receipt
- name: dimension_integration_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - DIMENSION
  symbols: []
  schemas: []
implementation_key: fabric/dimension/integration
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - dimension_properties
repair:
  scope:
  - minecraft/dimension/integration
  writable_anchors:
  - /* MMM:dimension_integration */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- integration
anchor_kinds:
- symbol
- test
rules:
- Implement integration responsibility for dimension strictly within declared DIMENSION
  capability.
- Target side must remain server; reject cross-side symbol leakage.
- Fail closed if required dimension prerequisite receipt is missing; never invent
  defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- dimension integration matches host version contract
- dimension integration receipts emitted with verified context
