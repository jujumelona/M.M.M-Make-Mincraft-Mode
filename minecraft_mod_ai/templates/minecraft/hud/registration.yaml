id: minecraft/hud/registration
task: Implement only the registration responsibility of the supplied hud artifact.
execution_mode: model
side:
- client
inputs:
- name: hud_identity
  type: identifier
  required: true
- name: hud_registration_input
  type: specification
  required: true
outputs:
- name: hud_registration_receipt
  type: receipt
- name: hud_registration_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - GUI_EXISTS
  symbols:
  - ScreenHandlerType
  schemas: []
implementation_key: fabric/hud/registration
validators:
- java_parse
- client_side_only
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - hud_properties
repair:
  scope:
  - minecraft/hud/registration
  writable_anchors:
  - /* MMM:hud_registration */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- registration
anchor_kinds:
- symbol
- test
rules:
- Implement registration responsibility for hud strictly within declared HUD_RENDER
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required hud prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- hud registration matches host version contract
- hud registration receipts emitted with verified context
