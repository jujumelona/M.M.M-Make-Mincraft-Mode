id: minecraft/hud/validation
task: Implement only the validation responsibility of the supplied hud artifact.
execution_mode: deterministic
side:
- client
inputs:
- name: hud_identity
  type: identifier
  required: true
- name: hud_validation_input
  type: specification
  required: true
outputs:
- name: hud_validation_receipt
  type: receipt
- name: hud_validation_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - GUI_EXISTS
  symbols:
  - ScreenHandlerType
  schemas: []
implementation_key: fabric/hud/validation
validators:
- mod_integration_test
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - hud_properties
repair:
  scope:
  - minecraft/hud/validation
  writable_anchors:
  - /* MMM:hud_validation */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- validation
anchor_kinds:
- symbol
- test
rules:
- Implement validation responsibility for hud strictly within declared HUD_RENDER
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required hud prerequisite receipt is missing; never invent defaults.
- Output must satisfy mod_integration_test validator before completion.
postconditions:
- hud validation matches host version contract
- hud validation receipts emitted with verified context
