id: minecraft/hud/state
task: Implement only the state responsibility of the supplied hud artifact.
execution_mode: deterministic
side:
- client
inputs:
- name: hud_identity
  type: identifier
  required: true
- name: hud_state_input
  type: specification
  required: true
outputs:
- name: hud_state_receipt
  type: receipt
- name: hud_state_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - GUI_EXISTS
  symbols:
  - ScreenHandlerType
  schemas: []
implementation_key: fabric/hud/state
validators:
- java_parse
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - hud_properties
repair:
  scope:
  - minecraft/hud/state
  writable_anchors:
  - /* MMM:hud_state */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- state
anchor_kinds:
- symbol
- test
rules:
- Implement state responsibility for hud strictly within declared HUD_RENDER capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required hud prerequisite receipt is missing; never invent defaults.
- Output must satisfy java_parse validator before completion.
postconditions:
- hud state matches host version contract
- hud state receipts emitted with verified context
