id: minecraft/hud/requirement
task: Implement only the requirement responsibility of the supplied hud artifact.
execution_mode: deterministic
side:
- client
inputs:
- name: hud_identity
  type: identifier
  required: true
- name: hud_requirement_input
  type: specification
  required: true
outputs:
- name: hud_requirement_receipt
  type: receipt
- name: hud_requirement_artifact
  type: code_fragment
host_requirements:
  capabilities:
  - GUI_EXISTS
  symbols:
  - ScreenHandlerType
  schemas: []
implementation_key: fabric/hud/requirement
validators:
- semantic_contract
context_projection:
  max_bytes: 4096
  include:
  - mod_id
  - registry_path
  - package_path
  - hud_properties
repair:
  scope:
  - minecraft/hud/requirement
  writable_anchors:
  - /* MMM:hud_requirement */
consumes:
- artifact_requirement
- target_cell
- verified_bindings
- owned_anchor
- prerequisite_receipts
provides:
- requirement
anchor_kinds:
- symbol
- test
rules:
- Implement requirement responsibility for hud strictly within declared HUD_RENDER
  capability.
- Target side must remain client; reject cross-side symbol leakage.
- Fail closed if required hud prerequisite receipt is missing; never invent defaults.
- Output must satisfy semantic_contract validator before completion.
postconditions:
- hud requirement matches host version contract
- hud requirement receipts emitted with verified context
