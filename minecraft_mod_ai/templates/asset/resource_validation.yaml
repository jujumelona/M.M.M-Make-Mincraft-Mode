id: asset/resource_validation
execution: host
input:
  generated_resource:
  resource_contract:
  asset_manifest:
  generation_profile:
  generation_evidence:
output:
  valid:
  failed_checks:
proof:
  predicate: valid is true only when actual PNG pixels, metadata and exact model references satisfy every resolved resource contract
checks:
