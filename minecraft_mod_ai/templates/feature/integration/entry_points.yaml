id: feature/integration/entry_points
task: Resolve exactly one entry points record for the supplied feature and acceptance
  criterion.
input_fields:
- requirement
- criterion
- evidence
- accepted_records
record_schema:
  type: object
  properties:
    boundary:
      type: string
      minLength: 1
    trigger:
      type: string
      minLength: 1
      maxLength: 96
      pattern: '^(?:mod_initialize|server_started|server_stopping|server_tick|player_join|player_disconnect|player_respawn|(?:command:|/)[a-z0-9_]{1,64})    owner:
      type: string
      minLength: 1
  required:
  - boundary
  - trigger
  - owner
  additionalProperties: false
rules:
- Return only the next record for this concern; do not plan neighboring concerns.
- The trigger is the *source* Fabric hook, not a gameplay condition or an action name.
- Use only a real bound lifecycle hook or an explicit named command such as command:open_ui.
- UI unlock states, button clicks, skill effects, and similar semantic actions are not source hooks. Preserve those semantics in their behavior or UI records, not in trigger.
- Never choose an unrelated lifecycle event merely to satisfy the trigger schema.
- If the requested action has no supported source hook, return blocked with the exact missing adapter; do not invent one.
- Preserve supplied evidence identifiers. Never invent external APIs, paths or facts.
- Return done only after all records for this concern are supplied.
- Return not_applicable with a concrete reason only when this concern does not apply.
- Return blocked with the missing information when it cannot be resolved.
- Do not turn missing information into an inapplicability claim.

