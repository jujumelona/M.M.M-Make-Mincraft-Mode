id: feature/state_model/transitions
task: Resolve exactly one transitions record for the supplied feature and acceptance
  criterion.
input_fields:
- requirement
- criterion
- evidence
- accepted_records
record_schema:
  type: object
  properties:
    from_state:
      type: string
      minLength: 1
    trigger:
      type: string
      minLength: 1
    guard:
      type: string
      minLength: 1
    mutation:
      type: string
      minLength: 1
    to_state:
      type: string
      minLength: 1
  required:
  - from_state
  - trigger
  - guard
  - mutation
  - to_state
  additionalProperties: false
rules:
- Return only the next record for this concern; do not plan neighboring concerns.
- Preserve supplied evidence identifiers. Never invent external APIs, paths or facts.
- Return done only after all records for this concern are supplied.
- Return not_applicable with a concrete reason only when this concern does not apply.
- Return blocked with the missing information when it cannot be resolved.
- Do not turn missing information into an inapplicability claim.
