id: feature/feature.schema
standalone: true
# Documentation schema for host-assembled records, not a model generation task.
schema:
  type: object
  properties:
    feature_id: {type: string, minLength: 1}
    description: {type: string, minLength: 1}
    records: {type: object}
    children: {type: array, items: {type: string}}
  required: [feature_id, description, records, children]
  additionalProperties: false
