id: feature/persistence/migration
task: Resolve exactly one typed migration record for the supplied feature and acceptance
  criterion.
input_fields:
- requirement
- criterion
- evidence
- accepted_records
record_schema:
  type: object
  properties:
    source_version:
      type: string
      minLength: 1
    destination_version:
      type: string
      minLength: 1
    operation:
      type: string
      enum:
      - preserve
      - rename_key
      - delete_key
      - set_default
    source_key:
      type:
      - string
      - "null"
      minLength: 1
    destination_key:
      type:
      - string
      - "null"
      minLength: 1
    value:
      type:
      - string
      - number
      - integer
      - boolean
      - "null"
  required:
  - source_version
  - destination_version
  - operation
  - source_key
  - destination_key
  - value
  additionalProperties: false
rules:
- Preserve supplied evidence identifiers. Never invent external APIs, paths or facts.
- Use only the typed migration operations in the schema; never encode executable behavior in prose.
- rename_key requires source_key and destination_key.
- delete_key requires source_key.
- set_default requires destination_key and a typed value.
- preserve requires no keys or value.
- Return semantic record content only. Do not emit count, done, continuation, retry, ordinal, blocked, applicability, or other loop-control protocol.
