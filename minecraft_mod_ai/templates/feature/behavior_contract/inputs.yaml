id: feature/behavior_contract/inputs
task: Resolve exactly one inputs record for the supplied feature and acceptance criterion.
cardinality_blocking: false
input_fields:
- requirement
- criterion
- evidence
- accepted_records
record_schema:
  type: object
  properties:
    name:
      type: string
      minLength: 1
    type:
      type: string
      minLength: 1
    unit:
      type: string
      minLength: 1
    range:
      type: string
      minLength: 1
    default:
      type: string
      minLength: 1
    source:
      type: string
      minLength: 1
  required:
  - name
  - type
  - unit
  - range
  - default
  - source
  additionalProperties: false
rules:
- Return only the host-requested ordinal record for this concern; do not plan neighboring concerns.
- Preserve supplied evidence identifiers. Never invent external APIs, paths or facts.
- Do not emit continuation, completion, applicability, retry, or loop-control decisions; the host owns cardinality and iteration.
- If the supplied facts cannot support the requested ordinal record, fail rather than inventing a fallback record.
