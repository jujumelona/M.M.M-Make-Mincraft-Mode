id: feature/behavior_contract/rejection_postconditions
task: Resolve exactly one rejection postconditions record for the supplied feature
  and acceptance criterion.
cardinality_blocking: false
input_fields:
- requirement
- criterion
- evidence
- accepted_records
record_schema:
  type: object
  properties:
    condition:
      type: string
      minLength: 1
    preserved_state:
      type: string
      minLength: 1
    observation:
      type: string
      minLength: 1
  required:
  - condition
  - preserved_state
  - observation
  additionalProperties: false
rules:
- Return only the host-requested ordinal record for this concern; do not plan neighboring concerns.
- Preserve supplied evidence identifiers. Never invent external APIs, paths or facts.
- Do not emit continuation, completion, applicability, retry, or loop-control decisions; the host owns cardinality and iteration.
- Author the requested gameplay record, choosing missing mechanics and values consistently with the requirement. These are design choices and do not require external evidence.
