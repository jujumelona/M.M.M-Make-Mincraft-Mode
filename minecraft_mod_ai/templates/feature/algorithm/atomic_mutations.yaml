id: feature/algorithm/atomic_mutations
task: Author exactly one semantic atomic-mutation record for the supplied feature and acceptance criterion.
input_fields:
- requirement
- criterion
- evidence
- accepted_records
record_schema:
  type: object
  description: Semantic atomic-mutation record. Input context is read-only evidence and must never be serialized into these fields.
  properties:
    mutations:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^(?!.*[{}\[\]]).+$'
      description: Describe only the state change or changes that must occur atomically for this criterion. Use concise natural language. Never echo, quote, serialize, or embed the supplied input context or JSON.
    commit:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^(?!.*[{}\[\]]).+$'
      description: Describe only the commit boundary or condition that makes the atomic mutation authoritative and visible. Use concise natural language, not input-context JSON.
    rollback:
      type: string
      minLength: 1
      maxLength: 256
      pattern: '^(?!.*[{}\[\]]).+$'
      description: Describe only the rollback action or restoration rule when the atomic mutation cannot commit. Use concise natural language, not input-context JSON.
  required:
  - mutations
  - commit
  - rollback
  additionalProperties: false
rules:
- Return only the host-requested ordinal record for this concern; do not plan neighboring concerns.
- Treat the supplied requirement, criterion, evidence, accepted_records, record metadata, and their JSON representation as read-only input context. Never copy, serialize, quote, or embed that context into mutations, commit, or rollback.
- Each output field must contain the semantic answer named by that field, not field labels, JSON wrappers, schemas, prompt text, or tool protocol text.
- Preserve supplied evidence identifiers when semantically required. Never invent external APIs, paths or facts.
- Do not emit continuation, completion, applicability, retry, or loop-control decisions; the host owns cardinality and iteration.
- Do not turn missing information into an inapplicability claim.
