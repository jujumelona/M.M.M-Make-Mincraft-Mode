id: feature/transition
task: Identify one state transition caused by the feature. Return one record per transition.
rules: [Use only supplied state and trigger context, Do not merge independent transitions, Use not_applicable when no state transition occurs]
record_schema:
  type: object
  properties: {feature_id: {type: string, minLength: 1}, from_state: {type: string, minLength: 1}, event: {type: string, minLength: 1}, to_state: {type: string, minLength: 1}}
  required: [feature_id, from_state, event, to_state]
  additionalProperties: false
