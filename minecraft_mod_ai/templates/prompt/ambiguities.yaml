id: prompt/ambiguities
execution: records
task: Identify every genuine contradiction or user preference whose answer is necessary to understand the authored request. Missing counts, prices, balance, mechanics, algorithms, platform APIs, source files and design choices are not ambiguities here. Ordinary explicit restrictions belong to parse. Do not choose blockers or research routes.
record_schema:
  type: object
  properties:
    question: &text
      type: string
      minLength: 1
      maxLength: 256
    reason:
      type: string
      enum:
      - contradiction
      - user_preference
    information_needed: *text
  required:
  - question
  - reason
  - information_needed
  additionalProperties: false
input_schema:
  type: object
  properties:
    original_prompt: *text
  required:
  - original_prompt
  additionalProperties: false
rules: []
