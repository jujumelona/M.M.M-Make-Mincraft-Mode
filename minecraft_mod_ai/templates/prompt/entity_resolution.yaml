id: prompt/entity_resolution
execution: records
task: Identify all external games, mods, products, styles or named works explicitly referenced in the original prompt, plus what must be learned about each. Do not research them yet, infer unnamed references or mistake ordinary feature nouns for external references.
record_schema:
  type: object
  properties:
    name: &text
      type: string
      minLength: 1
    source_quote:
      type: string
      minLength: 0
    what_must_be_learned: *text
  required:
  - name
  - what_must_be_learned
  additionalProperties: false
input_schema:
  type: object
  properties:
    original_prompt: *text
  required:
  - original_prompt
  additionalProperties: false
rules: []
