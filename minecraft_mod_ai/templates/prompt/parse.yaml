id: prompt/parse
execution: records
task: Extract one explicitly authored fact or requested behavior. Do not group independent statements or infer additional features. Explicit restrictions and delivery requirements have separate tasks.
record_schema:
  type: object
  properties:
    statement:
      type: string
      minLength: 1
      maxLength: 256
    source_quote:
      type: string
      minLength: 0
      maxLength: 256
  required:
    - statement
  additionalProperties: false
input_schema:
  type: object
  properties:
    original_prompt:
      type: string
      minLength: 1
  required:
    - original_prompt
  additionalProperties: false
rules:
  - Use only the original user prompt as evidence. Do not invent behavior, parameters, APIs, versions, files, defaults or implementation details.
  - Game and feature names are input data, never template categories. Preserve the authored meaning and exclusions.
  - Return one record at a time for this concern only; the host controls repetition and termination.
  - If the prompt contains no record for this concern, emit no content record and let the host terminate the record loop.
  - Missing implementation choices are not prompt ambiguity; only explicitly authored prompt facts belong here.
