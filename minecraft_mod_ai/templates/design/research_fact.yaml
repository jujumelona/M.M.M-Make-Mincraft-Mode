id: design/research_fact
task: Extract exactly one factual claim supported by the supplied evidence shard and relevant to the current requirement.
record_schema:
  type: object
  properties:
    fact:
      type: string
      minLength: 1
      maxLength: 256
  required:
    - fact
  additionalProperties: false
rules:
  - Use only information explicitly supported by the supplied evidence shard; do not infer source identifiers or unsupported details.
  - Emit one factual claim per record.
  - The host must skip this template for a shard that contains no relevant supporting fact.
