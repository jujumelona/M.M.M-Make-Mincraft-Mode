id: design/content_capability
task: Return the exact base Minecraft FactType dictated by the current content entity kind.
record_schema:
  type: object
  properties:
    fact_type:
      type: string
      enum:
        - ITEM_EXISTS
        - BLOCK_EXISTS
        - CRAFTING_RECIPE
        - SMELTING_RECIPE
        - REGISTRY_TAG
        - ENTITY_EXISTS
        - GUI_EXISTS
        - NETWORK_PACKET
        - BLOCK_ENTITY_EXISTS
        - DATA_COMPONENT
        - WORLDGEN_FEATURE
        - DIMENSION
        - BIOME
        - STATUS_EFFECT
        - SOUND_EVENT
        - PARTICLE_TYPE
        - ENTITY_LOOT
        - ADVANCEMENT
        - EQUIPMENT_ARMOR
        - CUSTOM_ITEM_BEHAVIOR
        - CUSTOM_BLOCK_BEHAVIOR
  required:
    - fact_type
  additionalProperties: false
rules:
  - The host binds fact_type to the single FactType mapped from entity.kind before generation; return only that schema-allowed value.
  - Never invent sentinel, fallback, unsupported, or substitute capability values.
