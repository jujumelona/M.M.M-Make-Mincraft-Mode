id: design/content_entity
task: Identify exactly one concrete Minecraft content entity explicitly required by the current requirement.
record_schema:
  type: object
  properties:
    entity_id:
      type: string
      minLength: 1
      maxLength: 64
      pattern: ^[a-z][a-z0-9_]+$
    kind:
      type: string
      minLength: 1
      maxLength: 32
      pattern: ^[a-z][a-z0-9_]*$
    role:
      type: string
      minLength: 1
      maxLength: 128
  required:
    - role
    - kind
    - entity_id
  additionalProperties: false
rules:
  - Read the original game request and canonical gameplay requirements together with the resource/UI constraints. Engineering names alone do not describe the requested player-facing content.
  - allowed_content_kinds supplies the authoritative concrete content vocabulary for both discovery and record authoring. The kind field is bound to that same vocabulary; use only a host-allowed kind.
  - When coverage_ref is supplied, resolve that one already-authored resource/UI obligation. Shared gameplay context explains it but does not authorize unrelated entities. Reuse an existing entity when it implements the same obligation.
  - A resource/UI concern describes an obligation, not an entity kind. Displayed state does not imply a GUI, and interactions do not imply networking. Identify the actual content owner from the authored requirement; create a screen only when a screen is explicitly required.
  - Reusing an existing entity preserves its kind. A separate screen associated with a block has its own entity_id and a relation to the block; never classify the block itself as a GUI to cover a display obligation.
  - minimum_entity_count is host-owned. This template is only for primary content owners. Engineering-only registry/data-resource obligations are not invoked here and cannot create primary content identities.
  - Emit only a host-allowed primary Minecraft content capability such as an item, block, entity, GUI, dimension, or supported behavior. Recipes and registry tags are graph-level resource definitions derived later by the host from explicit structured data-resource records.
  - System-level mechanics belong in design decisions and relations between concrete content entities.
  - Code registries, definition catalogs, lookup tables, manager classes, and other implementation-only structures are not Minecraft content entities. Exclude those structures individually; still identify the concrete primary items, blocks, screens, or other content required by the gameplay they support.
  - A mixed requirement containing an implementation-only structure is not an empty content requirement. Return no entities only when the entire supplied gameplay requirement needs no concrete content from the allowed vocabulary.
  - Use block_entity only for runtime state physically attached to a placed block. Never use block_entity as a synonym for a code registry, data catalog, or general module registry.
  - Never emit registry_tag, crafting_recipe, or smelting_recipe from this template. Those identities are host-derived only after concrete target entities exist.
  - Describe the authored semantic role of this concrete content entity, not an implementation module or file.
  - Reuse a host-supplied existing entity_id only when its meaning and role are identical; otherwise create one deterministic lowercase identifier from the explicit requirement.
  - Do not truncate two different semantic entities to the same identifier prefix. Keep distinguishing words when possible; global collision resolution remains host-owned.
  - Emit one entity per record. The host controls repetition and must stop or block before invoking this template when meaning is unresolved.
