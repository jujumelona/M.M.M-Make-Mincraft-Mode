id: design/content_entity
task: Identify exactly one distinct content entity explicitly required by the current requirement.
record_schema:
  type: object
  properties:
    entity_id:
      type: string
      minLength: 1
      maxLength: 32
      pattern: ^[a-z][a-z0-9_]+$
    kind:
      type: string
      minLength: 1
      maxLength: 32
      pattern: ^[a-z][a-z0-9_]*$
    role:
      type: string
      minLength: 1
      maxLength: 128
  required:
    - entity_id
    - kind
    - role
  additionalProperties: false
rules:
  - Describe a semantic content role, not an implementation module.
  - Reuse a host-supplied existing entity_id only when its meaning and role are identical; otherwise create one deterministic lowercase identifier from the explicit requirement.
  - Emit one entity per record. The host controls repetition and must stop or block before invoking this template when meaning is unresolved.
