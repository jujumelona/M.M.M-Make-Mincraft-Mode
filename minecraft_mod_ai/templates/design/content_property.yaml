id: design/content_property
task: Resolve exactly one property of the current content entity.
record_schema:
  type: object
  properties:
    property:
      type: string
      pattern: >-
        ^(display_name|stack_limit|shape|material|main_color|accent|surface|silhouette|transparency|tileability|category|health|attack_damage|speed|tracking_range|width|height|archetype|behavior|screen_type|slot_count|packet_name|channel|direction|sync_type|container_size|component_type|feature_type|placement|dimension_type|generator_type|temperature|downfall|precipitation|effect_category|color|duration_policy|sound_id|particle_mode|loot_source|loot_result|criterion|reward|equipment_slot|armor_points|toughness|interaction|effect|state_change|recipe_kind|count|pattern_[1-3]|cooking_type|experience|cookingtime|registry_kind)$
    value:
      type: string
      minLength: 1
      maxLength: 256
  required:
    - property
    - value
  additionalProperties: false
rules:
  - Emit exactly one property record; the host controls which property is requested, repetition, ordering, and termination.
  - When requested_property is present in context, property must equal requested_property exactly.
  - Do not invent host-owned identifiers, paths, registry keys, or serialized Minecraft resources in value.
  - Do not substitute generic defaults merely because a property is missing; resolve only the requested design property from the active requirement, accepted design state, and grounded evidence.
  - Use display_name for the authored English display name and stack_limit only when the active requirement or design state requires a non-default stack limit.
  - Recipe pattern rows use pattern_1 through pattern_3; emit each property as a separate record.
