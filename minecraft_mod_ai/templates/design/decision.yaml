id: design/decision
task: Resolve exactly one required design decision for a host-supplied slot.
record_schema:
  type: object
  properties:
    slot_id:
      type: string
      minLength: 1
      maxLength: 32
    value:
      type: string
      minLength: 1
      maxLength: 256
  required:
    - slot_id
    - value
  additionalProperties: false
rules:
  - Use exactly one slot_id from allowed_slots supplied by the host.
  - Resolve only that slot from explicit requirement/context evidence; do not fill unrelated slots or invent missing requirements.
  - The host must skip this template when no unresolved allowed slot is required.
