id: design/content_relation
task: Resolve exactly one explicit relationship between host-supplied content entities.
record_schema:
  type: object
  properties:
    relation_type:
      type: string
      minLength: 1
      maxLength: 32
      pattern: ^(consumes|produces|contains|drops|requires|unlocks|upgrades|opens|controls|spawns|transports_to|displays|synchronizes|key_[A-Za-z0-9])$
    source_id:
      type: string
      minLength: 1
      maxLength: 32
      pattern: ^[a-z][a-z0-9_]+$
    target_id:
      type: string
      minLength: 1
      maxLength: 32
      pattern: ^[a-z][a-z0-9_]+$
  required:
    - relation_type
    - source_id
    - target_id
  additionalProperties: false
rules:
  - Use only exact entity IDs supplied by the host; never invent a missing endpoint.
  - Emit only relationships explicitly required by the current requirement; the host must skip this template when none are required.
  - Do not infer drops, ingredients, progression, networking, or other relations from convention alone.
