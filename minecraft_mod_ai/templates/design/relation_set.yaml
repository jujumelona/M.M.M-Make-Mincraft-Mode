id: design/relation_set
task: Select every explicit relationship from the fixed host-supplied source entity to the fixed host-supplied target entity.
record_schema:
  type: object
  properties:
    relations:
      type: array
      uniqueItems: true
      items:
        type: string
        enum: [consumes, produces, contains, drops, requires, unlocks, upgrades, opens, controls, spawns, transports_to, displays, synchronizes]
    key_code:
      type: integer
      minimum: 0
      maximum: 36
  required: [relations, key_code]
  additionalProperties: false
rules:
  - Return the complete set of ordinary relationships explicitly required by the active requirement for this exact ordered pair; an empty relations array means none.
  - The source_id and target_id are fixed by the host and must not be reinterpreted.
  - Never truncate the relationship set to satisfy an arbitrary item-count limit.
  - key_code is 0 when there is no crafting-key relation; otherwise 1-26 encode A-Z and 27-36 encode 0-9.
  - The host owns pair enumeration, validation, and termination.
