schema_version: mmm/model-registry-v2

# ─── YAML anchors for shared non-LLM roles ───
_shared_embedding: &shared_embedding
  model_id: Qwen/Qwen3-Embedding-0.6B
  adapter: embedding
  device: cpu
  dimensions: 512
  max_context: 8192
  max_new_tokens: 1

_shared_reranker: &shared_reranker
  model_id: Qwen/Qwen3-Reranker-0.6B
  adapter: reranker
  device: cpu
  max_context: 8192
  max_new_tokens: 1

_shared_image_gen: &shared_image_gen
  model_id: black-forest-labs/FLUX.2-klein-9B
  adapter: image_diffusion
  quantization: bnb_4bit_nf4
  torch_dtype: float16
  exclusive_gpu: true
  cpu_offload: true
  min_free_vram_mb: 9000
  lora_model_id: artificialguybr/PIXELART-REDMOND-FLUXKLEIN9B
  lora_weight_name: "[FLUX.2.Klein]PixelArt_Redmond.safetensors"
  lora_adapter_name: mmm_pixelart_redmond
  lora_scale: 1.0
  lora_trigger: "Pixel Art, PixArFK"

_shared_speech: &shared_speech
  model_id: openai/whisper-small
  adapter: speech
  torch_dtype: float16
  exclusive_gpu: true
  min_free_vram_mb: 3000

profiles:
  mini_mod:
    description: "⚡ Mini Mod Test — 실제 Gemma4 LLM으로 초소형 간이 모드를 1분 만에 완벽 검증 및 생성"
    roles:
      planner: &mini_mod_gemma
        model_id: google/gemma-4-12B-it-qat-q4_0-gguf
        adapter: llama_cpp
        gguf_filename: gemma-4-12b-it-qat-q4_0.gguf
        torch_dtype: float16
        max_context: 8192
        max_input_tokens: 0
        max_new_tokens: 1024
        min_free_vram_mb: 1000
        exclusive_gpu: true
      researcher: *mini_mod_gemma
      coder: *mini_mod_gemma
      coder_safe: *mini_mod_gemma
      visual_critic: *mini_mod_gemma
      embedding: *shared_embedding
      reranker: *shared_reranker
      image_generator: *shared_image_gen
      speech_recognition: *shared_speech

  fast_test:
    description: "⚡ Fast Test Mode — 10초 만에 1번~8번 셀 전체 파이프라인 무결성을 검증하고 모드 ZIP을 생성"
    roles:
      planner: &fast_test_mock
        model_id: mock/fast-test-engine
        adapter: mock
        max_context: 32768
        max_input_tokens: 0
        max_new_tokens: 2048
        min_free_vram_mb: 0
      researcher: *fast_test_mock
      coder: *fast_test_mock
      coder_safe: *fast_test_mock
      visual_critic: *fast_test_mock
      embedding: *shared_embedding
      reranker: *shared_reranker
      image_generator: *shared_image_gen
      speech_recognition: *shared_speech

